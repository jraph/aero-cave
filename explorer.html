h if persistent |\n| engine fire flight | fuel/MIX/pump OFF→throttle/prop/mags + cabin heat/air per POH→specified airspeed→forced landing; no restart unless survival requires and fire confirmed out |\n| cabin fire | control→source OFF→extinguish→vent after out if directed→land |\n\n- `!:` fire/smoke can rapidly damage structure/controls or poison occupants; nearest suitable landing. Extinguisher/ventilation effects are agent- and aircraft-specific."},{"id":"08-19","card":"08","h":"Carbon monoxide","a":"carbon-monoxide","c":["agk-hf","emg-fire"],"p":["PPL","CPL"],"md":"- Sources: exhaust/heater leak. Symptoms: headache, nausea, dizziness, drowsiness, impaired judgment.\n- `P:` cabin heat off→fresh air/vents/windows as safe→oxygen if available→land ASAP→medical evaluation.\n- `T:` symptoms mimic fatigue/illness; colour/smell unreliable. Detector is valuable."},{"id":"08-20","card":"08","h":"Pitot / static","a":"pitot--static","c":["agk-pitot"],"p":["PPL","CPL","IR"],"md":"- Pitot→ASI; static→ASI/ALT/VSI. Pitot heat normally does not heat static ports; preflight for covers/bugs/water/ice/tape.\n\n| Failure | ASI | ALT | VSI |\n|---|---|---|---|\n| pitot blocked, drain open | →`0` | normal | normal |\n| pitot+drain blocked | climb high/descent low | normal | normal |\n| static blocked | climb low/descent high | frozen | →`0` |\n| alternate static | often ASI/ALT higher | aircraft-specific | momentary/specific |\n\n- `P:` heat→alternate static per POH→attitude/power/GPS trend→ATC→land. Exact errors vary."},{"id":"08-21","card":"08","h":"Altimeter failure / unreliable altitude","a":"altimeter-failure--unreliable-altitude","c":["agk-pitot","emg-sys"],"p":["PPL","CPL","IR"],"md":"- Cross-check against genuinely independent sources. GPS altitude differs from barometric altitude; ATC-displayed pressure altitude may share the aircraft static-system fault. ALT/VSI/ASI can all share one blocked static source.\n- `P IFR:` declare→request block altitude/vectors→use reliable backup/standby→avoid terrain/icing→land.\n- `T:` GPS altitude is not barometric altitude and normally cannot replace required altimeter."},{"id":"08-22","card":"08","h":"Vacuum / gyro failure","a":"vacuum--gyro-failure","c":["agk-gyro","emg-sys"],"p":["PPL","CPL","IR"],"md":"- Legacy vacuum often powers AI+DG; turn coordinator often electric. `S:` low suction, slow/precessing/frozen or conflicting indications.\n- `P:` identify/cover→use reliable pitot-static/turn/compass/power cues→ATC/no-gyro vectors→land.\n- AI failed: ASI/ALT/VSI/turn/compass/power; DG failed: compass/timed turns/GPS supplementary; TC failed: AI/DG/compass.\n- `T:` gradual failure looks plausible; know common power sources."},{"id":"08-23","card":"08","h":"Magnetic compass","a":"magnetic-compass","c":["nav-compass"],"p":["PPL","CPL"],"md":"- Errors: variation/deviation, oscillation, acceleration/turning/dip.\n- Northern hemisphere: on east/west headings, acceleration causes a false north indication and deceleration a false south indication (`ANDS`); turning-error rollout memory is `UNOS`: undershoot north/overshoot south.\n- `T:` turbulence and turns make compass difficult; roll out using timed/lead technique."},{"id":"08-24","card":"08","h":"Flight-control malfunction","a":"flight-control-malfunction","c":["agk-systems","emg-sys"],"p":["PPL","CPL"],"md":"- `P:` maintain control with remaining surfaces→reduce speed/load→trim/power/flap asymmetry awareness→declare→long straight-in landing.\n- Jammed elevator: power + trim may control pitch. Jammed aileron: rudder/dihedral may assist roll. Jammed rudder: bank/power carefully.\n- `!:` aircraft-specific controllability varies. Avoid abrupt inputs.\n- `T:` autopilot/trim system may be source of apparent control jam."},{"id":"08-25","card":"08","h":"Trim runaway / jam","a":"trim-runaway--jam","c":["agk-systems","emg-sys"],"p":["PPL","CPL"],"md":"- `P:` hold control firmly→disconnect autopilot/electric trim→pull breaker/switch per POH→retrim manually→slow as appropriate→land.\n- `T:` electric trim may continue after autopilot disconnect depending fault; know separate trim disconnect.\n- `!:` do not release control pressure while troubleshooting."},{"id":"08-26","card":"08","h":"Flap malfunction / asymmetry","a":"flap-malfunction--asymmetry","c":["agk-systems","emg-sys"],"p":["PPL","CPL"],"md":"- `S:` roll/yaw, unequal indication, motor noise/no movement.\n- `P:` stop flap movement→do not reverse unless POH directs→control speed/bank→leave flaps→calculate landing distance→long runway.\n- `T:` asymmetric flaps can create severe roll; cycling may worsen."},{"id":"08-27","card":"08","h":"Landing-gear malfunction","a":"landing-gear-malfunction","c":["agk-systems","emg-sys"],"p":["CPL","ME"],"md":"- `P:` slow within limits→check breaker/selector/indicator/light bulbs→recycle only if POH permits→emergency extension→verify visually/ATC→brief landing/evacuation.\n- Gear-up landing: secure fuel/electrical per POH, doors/occupants brief, land under control on suitable surface.\n- `T:` repeated cycling consumes electrical/hydraulic energy and may worsen jam."},{"id":"08-28","card":"08","h":"Brake failure","a":"brake-failure","c":["agk-systems","emg-sys"],"p":["PPL","CPL"],"md":"- `P:` release/reapply→use opposite brake/rudder cautiously→reduce speed→mixture cutoff/engine shutdown if necessary→avoid obstacles.\n- One brake failed: plan runway/taxi direction; use aerodynamic control and minimum braking.\n- Hot brakes: stop clear, avoid parking brake, keep people away from wheel area.\n- `T:` brake pumping may not help every system; POH/system type wins."},{"id":"08-29","card":"08","h":"Tire failure","a":"tire-failure","c":["agk-systems","emg-sys"],"p":["PPL","CPL"],"md":"- Takeoff roll: reject if controllable/runway permits.\n- Landing: keep failed tire light as long as possible, aerodynamic braking, directional control, avoid heavy braking.\n- `T:` do not taxi fast after suspected failure."},{"id":"08-30","card":"08","h":"Door / window open","a":"door--window-open","c":["emg-sys"],"p":["PPL","CPL"],"md":"- `P:` fly aircraft→normal safe speed→land or close only if low workload/POH procedure.\n- Usually noise/vibration more than structural emergency in trainers.\n- `T:` reaching/fighting door can cause loss of control."},{"id":"08-31","card":"08","h":"Windshield / bird strike","a":"windshield--bird-strike","c":["emg-sys"],"p":["PPL","CPL"],"md":"- `P:` control→slow as appropriate→protect eyes→assess engine/controls/visibility→land.\n- Windshield penetration: goggles/sunglasses, head away from airflow, use side view/instruments.\n- `T:` hidden prop/leading-edge/control damage may exist even if engine runs."},{"id":"08-32","card":"08","h":"Structural icing","a":"structural-icing","c":["met-icing"],"p":["PPL","CPL","IR"],"md":"- `P:` exit immediately toward known non-icing air→systems on per POH→declare→increase margins/speed as specified→nearest suitable landing.\n- Effects: stall speed↑, drag↑, climb↓, prop/engine/antenna/static blockage, control anomalies.\n- `T:` do not use autopilot to hide control-force change; avoid flap changes if tailplane icing concern/POH directs."},{"id":"08-33","card":"08","h":"Induction / alternate air","a":"induction--alternate-air","c":["carb-ice"],"p":["PPL","CPL"],"md":"- Fuel-injected engines may use alternate induction air instead of carb heat.\n- `S:` intake filter blockage/ice → power loss; alternate air may restore.\n- `T:` alternate air often warmer/unfiltered and changes mixture/power."},{"id":"08-34","card":"08","h":"Cabin pressurization / outflow — L4","a":"cabin-pressurization--outflow--l4","c":["agk-press"],"p":["CPL","ME"],"md":"| Key | Recall |\n|---|---|\n| `T` CABIN ALT | Pressure-equivalent **cabin** ALT ≠ ACFT ALT; cabin ALT governs altitude-dependent O₂ use, subject to separate rules. |\n| `R` OUTFLOW | Regulates cabin P by controlling **air discharged**, with conditioned/pressurizing air supplied. |\n| `M` CLOSE | Outflow closes→less air escapes→cabin **P↑ / ALT↓** (other factors equal). |\n| `M` OPEN | Outflow opens→more air escapes→cabin **P↓ / ALT↑** (other factors equal). |\n| `F` ΔP | Differential P = **cabin P − ambient P**; AFM structural limit. |\n| `T` RELIEF | **Positive** relief protects against excess cabin P; **negative** relief protects against excess outside P. |\n| `!` FAILURE | Depressurization→cabin ALT↑→O₂ / emergency DESC per AFM; **O₂ thresholds/supply: [card 04 · CAR 605.31–32](04_canadian_air_law_core_av_cave_v0_2_compact.md#oxygen--oxygène--car-60531-32)** (not duplicated). |\n\n- `SRC:` [FAA PHAK · pressurization systems](https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/phak) · [CAR 605.31–32](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.31.html); ACFT AFM/checklists control.\n- `M · L4` **PRESSURIZATION: outflow CLOSE→cabin P↑/ALT↓; OPEN→P↓/ALT↑ | ΔP=cabin−ambient | +relief excess cabin P; −relief excess outside P | decompression→O₂/emergency DESC per AFM.**"},{"id":"08-35","card":"08","h":"Cabin heat / defrost","a":"cabin-heat--defrost","c":["agk-systems"],"p":["PPL","CPL"],"md":"- Often uses exhaust-shroud heat; exhaust crack can introduce CO.\n- `S:` exhaust smell, headache, detector alert.\n- `P:` heat/defrost off→fresh air→land.\n- `T:` windshield fogging may compete with CO response; safety of occupants first, land promptly."},{"id":"08-36","card":"08","h":"ELT / emergency equipment","a":"elt--emergency-equipment","c":["law-elt"],"p":["PPL","CPL"],"md":"- Know activation, remote switch, antenna, battery/inspection status, survival equipment and extinguisher.\n- After forced landing: ELT confirm ON, evacuate, fire risk, first aid, shelter/signalling.\n- `T:` ELT does not replace flight plan/itinerary closure or survival planning."},{"id":"08-37","card":"08","h":"Radio failure","a":"radio-failure","c":["law-atc","emg-sys","emg-comms"],"p":["PPL","CPL","IR"],"md":"- `P:` audio panel/volume/squelch/headset/mic/PTT/frequency/breaker→other radio→121.5/FSS/relay→transmit blind/listen→squawk `7600`.\n- VFR controlled: comply with light signals/land when safe. IFR: published/specific lost-comms procedure.\n- `T:` receiver failure vs transmitter failure may be different; keep listening."},{"id":"08-38","card":"08","h":"Transponder failure","a":"transponder-failure","c":["law-atc","emg-sys"],"p":["PPL","CPL"],"md":"- `P:` recycle/change code only if appropriate→check breaker/Mode C→advise ATC→comply with instructions/airspace restrictions.\n- `T:` do not select `7500/7600/7700` casually."},{"id":"08-39","card":"08","h":"Checklist / declaration","a":"checklist--declaration","c":["emg"],"p":["PPL","CPL"],"md":"- Memory items stop immediate threat; flow organizes; current checklist verifies/finishes. Outdated memorization is hazardous.\n- `PAN PAN` urgent/reduced safety; `MAYDAY` serious/imminent danger. State callsign/problem/position-altitude/intentions/fuel/persons/assistance.\n- `T:` declaration is a resource, not failure."},{"id":"08-40","card":"08","h":"Symptom quick map","a":"symptom-quick-map","c":["agk-systems","emg"],"p":["PPL","CPL"],"md":"| Symptom | First suspects |\n|---|---|\n| RPM↓ fixed-pitch, humid/partial power | carb ice |\n| MP↓ constant-speed, RPM stable | carb ice/induction/power |\n| rough + low fuel flow | starvation/selector/pump |\n| rough on one mag | plug/mag/lead |\n| low oil P + high T | lubrication failure |\n| discharge/low volts | alternator/gen failure |\n| AI+DG disagree, suction low | vacuum failure |\n| ASI odd, ALT/VSI normal | pitot failure |\n| ASI+ALT+VSI odd | static failure |\n| headache + heater | CO |\n| smoke/odour + electrical anomaly | electrical fire |\n\n- `T:` map starts diagnosis; POH/checklist determines action."},{"id":"08-41","card":"08","h":"Pebble","a":"pebble","c":["agk-systems","study-pebble"],"p":["PPL","CPL","IR"],"md":"- PRESSURIZATION `outflow CLOSE→cabin P↑/ALT↓; OPEN→P↓/ALT↑ | ΔP=cabin−ambient | +relief excess internal P; −relief excess external P | decompression→O₂/emergency DESC per AFM; O₂ rules card 04`\n- FUEL `octane=knock resistance | AVGAS 80/87 RED; 100/130 GREEN (lean/rich); 100LL BLUE (LL=low lead) | JET A max freeze −40°C / A-1 −47°C; B wide-cut | FSII water-ice inhibitor ≠ fuel/airframe de-ice | approved fuel/grade per POH; colour alone≠proof`\n- MP `absolute intake P inHg | OFF≈ambient→IDLE↓↓ | throttle↑ MP↑ | non-turbo ALT↑→MPmax↓; turbo may hold MP to critical ALT | CS throttle→MP/PROP→RPM | carb ice CS MP↓ vs fixed RPM↓ | over-square=MP>RPM/100 (may be OK); overboost=MP>approved limit (RPM-dependent); POH wins`\n- POWERPLANT `JET exhaust | FAN bypass/core; BPR≠AFR | T-PROP gearbox→PROP | T-SHAFT output | STAGE≠SPOOL | fine low pitch/high RPM ↔ coarse high pitch/low RPM | feather drag↓ ≠ reverse | constant-speed governor holds RPM within stops | turboprop ALPHA=governed RPM / BETA=ground blade-angle lever (ground fine→reverse); BETA≠REVERSE; AFM limits | typical piston SE oil→coarse, ME oil→fine/feather on oil loss; POH wins`\n- `CONTROL-DIAGNOSE-MEMORY-CHECKLIST-DECLARE-LAND` | engine=`AIR-FUEL-SPARK-COMPRESSION` | rough=`HEAT-MIX-FUEL-PRIMER-MAGS` | mags independent of master | carb ice: full heat, worse→better | fuel gauges + clock, not gauges alone | low oil P+high T=land ASAP | alternator fail=`SHED-CALCULATE-COMMUNICATE-LAND` | pitot affects ASI; static affects ASI/ALT/VSI | vacuum often AI+DG | smoke/fire=land now | CO heat off/fresh air/land | flap asymmetry stop movement | controls first, checklist second | POH wins."},{"id":"09-0","card":"09","h":"Overview","a":null,"c":["study-src"],"p":["IR"],"md":"`SEPTEMBER CPAER REVIEW: retained reference, not freshly revalidated` | use exact aircraft/current operational sources\n`R` rule | `P` proc | `T` trap | `M` memory | `!` safety | Canada IFR study; current CAP/NOTAM/POH/SOP win\n`RELEASE:` `OPS/EXAM-REF PROVISIONAL` | `CANONICAL SOURCE:` `ifr_knowledge_core_av_cave_v0_2.md` | `NOT FLIGHT AUTHORITY`"},{"id":"09-1","card":"09","h":"Current publication cycle","a":"current-publication-cycle","c":["nav-pubs","study-src"],"p":["IR"],"md":"- Current `CAP/CAP GEN/CFS/AIP/DAH/charts` AIRAC cycle: effective `2026-07-09` through `2026-09-03`.\n- These publications update every `56 days`; AIP SUP/AIC publish on a `14-day` cycle.\n- `P preflight:` current publication→NOTAM→AIP SUP/AIC→airport/procedure page→aircraft data.\n- Trigger NOTAM = notice that source material changed; retrieve the referenced amendment/Supplement. It may expire while the underlying AIP SUP remains active.\n- `[NAV CANADA publication schedule; AIC 009/2026]`"},{"id":"09-2","card":"09","h":"Instrument-rating recency","a":"instrument-rating-recency","c":["law-recency"],"p":["IR"],"md":"- `24 months:` qualifying instrument flight test, IPC or other accepted test/check under CAR 401.05(3).\n- `Six approaches / six months:` following the first day of the seventh month after that test/check, complete six instrument approaches within the six months before the flight, in accordance with the procedure's specified minima.\n- Aircraft: actual or simulated IMC. Other options: Level B/C/D full-flight simulator of the same instrument-rating group, or an FTD under a person qualified under Standard 425.21(9).\n- `T:` no separate six-hour instrument-time requirement. The old 12-month grace period and `6–6–6` memory rule are outdated. Retain recency records for three years.\n- `M:` **24-month check; after six months, six approaches in six months.** [CAR 401.05(3)–(3.2)](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-401.05.html)"},{"id":"09-3","card":"09","h":"Source / mindset","a":"source--mindset","c":["ifr","study-traps","study-src"],"p":["IR"],"md":"- AIM = guidance, not law. Current CAP/CAP GEN, CFS, AIP SUP and NOTAM govern published operational data.\n- Local `CAP_GEN_03-19-2026.pdf` is expired; current cycle began `2026-07-09`.\n- `T:` CAP is amended by NOTAM/AIP SUP. A Trigger NOTAM only announces changed source material; open the referenced source.\n- IFR = clearance + obstacle clearance + nav accuracy + comms + fuel/alternate logic + workload discipline."},{"id":"09-4","card":"09","h":"Clearance / readback","a":"clearance--readback","c":["law-atc","ifr-enr"],"p":["IR"],"md":"- Clearance memory: `CRAFT-ish` = clearance limit, route, altitude, frequency, transponder, plus void/release/hold-for-release if issued.\n- `T:` clearance ≠ takeoff clearance. “climb/maintain” ≠ terrain clearance on visual/VFR restriction if you accepted separation duties."},{"id":"09-5","card":"09","h":"IFR in VMC / VFR restriction","a":"ifr-in-vmc--vfr-restriction","c":["ifr"],"p":["IR"],"md":"- IFR clearance with VFR restriction may be issued if pilot requests, outside Class A, within applicable B/C/D/E, and weather permits.\n- `T:` during VFR restriction/release, pilot provides own separation incl wake; if unable, advise ATC/request amended clearance."},{"id":"09-6","card":"09","h":"Lost comms — general","a":"lost-comms--general","c":["emg-comms"],"p":["IR"],"md":"- `P:` squawk `7600`; listen; try other ATC/aircraft relay; comply with CAP/CFS/specific comm-fail instructions; phone ATS if all else fails.\n- `T:` specific SID/STAR/IAP comm-fail procedure overrides generic. judgment required if uncovered case."},{"id":"09-7","card":"09","h":"Lost comms — IFR route / altitude / time","a":"lost-comms--ifr-route--altitude--time","c":["emg-comms"],"p":["IR"],"md":"- VMC after fail: continue VFR, land as soon as practicable. `T:` practicable≠nearest unsuitable field.\n- IMC route: assigned → vectored direct to specified fix/route/airway → expected → filed.\n- IMC altitude: highest of assigned / minimum IFR altitude / expected. If vectored below published IFR altitude, climb immediately to appropriate minimum IFR altitude.\n- Descent: maintain enroute altitude to nav facility/approach fix; start descent at latest of filed/amended ETA, last ATC-ack ETA, or EAT. If holding instruction: hold as directed; approach at EAT/EFC.\n- `M:` route = `A-V-E-F`; alt = `highest A-M-E`; time = latest `ETA/EAT/EFC`."},{"id":"09-8","card":"09","h":"Minimum altitudes / terrain","a":"minimum-altitudes--terrain","c":["ifr-enr"],"p":["IR"],"md":"- MEA = nav+obstacle; MOCA = obstacle + limited nav; MSA = emergency/sector; MVA not published to pilots.\n- `T:` cleared direct ≠ terrain guaranteed unless ATC/radar/MEA logic valid. cold/RASS/temp corrections can raise minima."},{"id":"09-9","card":"09","h":"Holds","a":"holds","c":["ifr-hold"],"p":["IR"],"md":"- Hold clearance: fix, direction, radial/course/bearing/airway, leg length/time, altitude, EFC.\n- Entries: direct / teardrop / parallel. `T:` entry method is aid; protected airspace matters more than pretty drawing.\n- Timing: outbound adjusted to make inbound leg; wind correction triple outbound rough rule.\n- `T:` no EFC? ask. fuel clock starts early."},{"id":"09-10","card":"09","h":"CAP transition watch","a":"cap-transition-watch","c":["nav-pubs","ifr-plates"],"p":["IR"],"md":"- AIC `013/2026` announces a future PFAF/glidepath-intercept depiction using a lightning-bolt symbol.\n- Incremental implementation starts `2026-10-29`, not in the current July cycle.\n- Until a current chart actually shows it, read the symbols printed on that chart; do not assume the future convention."},{"id":"09-11","card":"09","h":"Approach brief","a":"approach-brief","c":["ifr-app-fly"],"p":["IR"],"md":"- `P:` plate/eff date→airport/runway/proc→freq/nav source→MSA/RASS/cold temp→IAF/IF/FAF→altitudes/stepdowns→DA/MDA/HAT/HAA/vis→MAP→missed→runway/LDA/lights→threats.\n- `M:` plate-wx-nav-alt-min-MAP-missed-rwy-threats.\n- `T:` CDI source errors kill. brief both lateral/vertical mode and missed nav setup."},{"id":"09-12","card":"09","h":"Approach types / minima","a":"approach-types--minima","c":["ifr-app-fly"],"p":["IR"],"md":"- Precision: lateral+vertical guidance with DA/DH. APV: vertical guidance but not precision. NPA: MDA/MAP.\n- CAP minima box lists nav type, MDA/DA, HAA/HAT/HATh/DH, advisory visibility by aircraft category.\n- `T:` LPV ≠ ILS; LNAV/VNAV temp limits matter if uncompensated Baro-VNAV."},{"id":"09-13","card":"09","h":"RASS / altimeter","a":"rass--altimeter","c":["ifr-rass"],"p":["IR"],"md":"- Before IAP: current usable altimeter required; local or authorized remote. older than 60min caution; 90min current limit concept.\n- RASS “when using X add N ft” ⇒ add to intermediate/final/missed segment minimum altitudes. “circling minima apply” ⇒ straight-in minima not usable under that RASS case.\n- `T:` cold/remote/falling pressure corrections affect obstacle margin."},{"id":"09-14","card":"09","h":"Landing minima / visual reference","a":"landing-minima--visual-reference","c":["ifr-minima"],"p":["IR"],"md":"- Do not continue below DH/DA or descend below MDA unless required visual reference established and maintained for safe landing.\n- Visual refs include runway/markings/threshold/TDZ/approach lights/VGSI/RIL/threshold-end lights/edge/centreline/TDZL.\n- Published landing visibilities are advisory only subject to approach ban; use to judge success probability.\n- `!:` missed after MAP: obstacle clearance not assured."},{"id":"09-15","card":"09","h":"Missed approach","a":"missed-approach","c":["ifr-missed"],"p":["IR"],"md":"- At DA/MDA/MAP without required visual reference, or unstable/unsafe, execute missed. Fly published lateral/vertical exactly.\n- `T:` configure/power/pitch before nav cleanup. missed point is obstacle-clearance origin.\n- Circling lost visual reference: follow circling missed logic; initially turn toward landing runway unless procedure/SOP directs otherwise, then intercept missed."},{"id":"09-16","card":"09","h":"Alternate minima","a":"alternate-minima","c":["ifr-alt"],"p":["IR"],"md":"| Facilities | Weather requirement |\n|---|---|\n| 2+ usable precision, separate suitable runways | `400-1` or `+200/+1/2` above lowest usable HAT/vis, greater |\n| 1 usable precision | `600-2*` or `+300/+1` above lowest HAT/vis, greater |\n| NPA only | `800-2*` or `+300/+1` above lowest HAT/HAA and vis, greater |\n| No IFR approach | forecast ≥`500 ft` above min IFR alt permitting VFR approach/landing |\n\n- Standard alternate minima: `600-2` or `800-2` as applicable; if standard applies, other authorized lower-vis options may apply from CAP table.\n- TAF logic: improving `BECMG` at end; deteriorating `BECMG` at start; `TEMPO` not below alternate minima; `PROB` not below landing minima.\n- GFA alternate: no cloud <`1000 ft` above lowest usable HAT/HAA, no CB, vis ≥`3 mi`. Advisory forecast alternate: ≥`500 ft` above lowest usable HAT/HAA and vis ≥`3 mi`.\n- `T:` alternate use depends on aircraft performance, nav equipment, NAVAIDs/NOTAM, forecast type, wind/runway, and chart “alternate not authorized.”"},{"id":"09-17","card":"09","h":"GNSS / RNAV","a":"gnss--rnav","c":["nav-gnss"],"p":["IR"],"md":"- Check database current, RAIM/WAAS availability, correct procedure, correct sensitivity/mode, and missed approach sequencing.\n- Alternate with satellite approach: verify expected RAIM/WAAS integrity at ETA; destination+alternate satellite-use separation rules may apply.\n- `T:` “GPS direct” ≠ cleared route unless ATC cleared. OBS/SUSP misuse common."},{"id":"09-18","card":"09","h":"RVR / approach ban","a":"rvr--approach-ban","c":["ifr-minima"],"p":["IR"],"md":"- RVR = automated runway visual range for landing/takeoff direction. Use current approach-ban rules; category/operator-specific.\n- `T:` advisory vis not same as approach-ban controlling visibility. CAP/CAR/operator ops spec wins."},{"id":"09-19","card":"09","h":"IFR emergencies","a":"ifr-emergencies","c":["ifr-emerg"],"p":["IR"],"md":"- Emergency: aviate; declare; ATC expects necessary action and will assist. If no comm, `7700` can indicate emergency but may not be detected.\n- Equipment fail: report nav/comm malfunctions to ATC. Partial panel: attitude-power-performance; reduce workload, ask vectors/no-gyro if needed.\n- Icing: exit conditions early; climb/descend/turn; approach speed/config per POH/SOP. `T:` “trace” can become performance problem fast in trainer."},{"id":"09-20","card":"09","h":"Pebble","a":"pebble","c":["ifr","study-pebble"],"p":["IR"],"md":"- clearance CRAFT | lost comm 7600/listen/relay/phone | VMC land practicable | IMC route A-V-E-F | altitude highest A-M-E | descent latest ETA/EAT/EFC | hold direct/teardrop/parallel | brief plate-wx-nav-alt-min-MAP-missed-rwy-threats | DA/MDA needs visual refs | missed after MAP no assured OC | alternate 400-1 / 600-2 / 800-2 | BECMG end/start, TEMPO alt-min, PROB landing-min | current CAP/NOTAM wins."},{"id":"09-21","card":"09","h":"Sources & review status","a":"sources--review-status","c":["study-src"],"p":["IR"],"md":"See the [separate review record](../CONTENT_REVIEW.md#historical-source-review-notes) for source editions, check dates and earlier validation notes."},{"id":"10-0","card":"10","h":"Overview","a":null,"c":["study-src"],"p":["IR"],"md":"`SEPTEMBER CPAER REVIEW: retained reference, not freshly revalidated` | use exact aircraft/current operational sources\n`R` rule | `F` formula | `P` procedure | `T` trap | `M` memory | `!` safety | `?` verify | Canada INRAT exam prep\n`RELEASE:` `EXAM/CYCLE-REF PROVISIONAL` | `CANONICAL SOURCE:` `inrat_knowledge_core_av_cave_v0_3.md` | `NOT FLIGHT AUTHORITY`"},{"id":"10-1","card":"10","h":"Current publication cycle","a":"current-publication-cycle","c":["nav-pubs","study-src"],"p":["IR"],"md":"- Current `CAP/CAP GEN/CFS/AIP/DAH/charts` AIRAC cycle: effective `2026-07-09` through `2026-09-03`.\n- These publications update every `56 days`; AIP SUP/AIC publish on a `14-day` cycle.\n- `P preflight:` current publication→NOTAM→AIP SUP/AIC→airport/procedure page→aircraft data.\n- Trigger NOTAM = notice that source material changed; retrieve the referenced amendment/Supplement. It may expire while the underlying AIP SUP remains active.\n- `[NAV CANADA publication schedule; AIC 009/2026]`"},{"id":"10-2","card":"10","h":"Instrument-rating recency","a":"instrument-rating-recency","c":["law-recency"],"p":["IR"],"md":"- `24 months:` qualifying instrument flight test, IPC or other accepted test/check under CAR 401.05(3).\n- `Six approaches / six months:` following the first day of the seventh month after that test/check, complete six instrument approaches within the six months before the flight, in accordance with the procedure's specified minima.\n- Aircraft: actual or simulated IMC. Other options: Level B/C/D full-flight simulator of the same instrument-rating group, or an FTD under a person qualified under Standard 425.21(9).\n- `T:` no separate six-hour instrument-time requirement. The old 12-month grace period and `6–6–6` memory rule are outdated. Retain recency records for three years.\n- `M:` **24-month check; after six months, six approaches in six months.** [CAR 401.05(3)–(3.2)](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-401.05.html)"},{"id":"10-3","card":"10","h":"Source / exam frame","a":"source--exam-frame","c":["ifr","study-traps","study-src"],"p":["IR"],"md":"- `SRC:` TP 691E topic anchor; CARs/STD 421 legal req; TC AIM + current CAP/CFS/AIP SUP/NOTAM for procedures.\n- Current CAP/CFS cycle: `2026-07-09` to `2026-09-03`; local March/2025 copies are reference-only.\n- `T:` TP/AIM/test guides = guidance; CARs/Standards = regulatory; current operational publications win.\n- INRAT = Instrument Rating written. `50 MCQ`, `3h`, `70%`. General IFR + simulated IFR flight. Initial flight-test aircraft category must match INRAT category.\n- Standard 421 IR groups: `G1` multi-engine aeroplane flight test = all aeroplanes; `G2` centreline thrust + single; `G3` single-engine; `G4` helicopter.\n- IR knowledge req: CARs, IFR rules/procedures, met, instruments, radio/radar, nav. Experience/skill are separate from exam."},{"id":"10-4","card":"10","h":"INRAT attack method","a":"inrat-attack-method","c":["study-traps"],"p":["IR"],"md":"- Read question stem first: asks `legal?`, `safe?`, `next?`, `minimum?`, `forecast?`, `plate?`, `lost comm?`.\n- Extract: aircraft category, equipment, departure/dest/alternate, ETA, route, freezing level, winds, NOTAM, CAP note, RASS, lighting, RVR/vis, TAF change group.\n- `M:` source order = CAR/STD → CAP/CFS/NOTAM → AIM/TP guide → school notes.\n- `T:` many wrong answers are “operationally plausible but legally wrong” or “legal but unsafe.”"},{"id":"10-5","card":"10","h":"Air law / IFR privileges","a":"air-law--ifr-privileges","c":["law-lic"],"p":["IR"],"md":"- IFR needs appropriate licence/rating/medical/recency + aircraft equipment + IFR flight plan/clearance where required.\n- IFR rating privilege depends on group/class/category and aircraft. `G3` single only; `G1` covers all aeroplanes.\n- `T:` INRAT pass≠rating issued; written + experience + skill + admin still needed.\n- `T:` clearance limit is not destination authorization beyond that point; expect hold/further clearance."},{"id":"10-6","card":"10","h":"IFR fuel — CAR 602.88 memory","a":"ifr-fuel--car-60288-memory","c":["law-plan","ifr-plan"],"p":["IR"],"md":"- IFR prop with alternate: dest + approach + missed → alternate + land → `45 min`.\n- IFR prop no alternate: dest + approach + missed → `45 min`.\n- IFR turbojet/helicopter: same logic but `30 min`.\n- Always add foreseeable taxi/delay/met/routing/traffic/other delays.\n- `T:` fuel reserve is after required legs, not “fuel on board at destination.” Exam may hide missed approach before alternate leg."},{"id":"10-7","card":"10","h":"IFR flight planning workflow","a":"ifr-flight-planning-workflow","c":["ifr-plan"],"p":["IR"],"md":"- Route: CFS/CAP/LO chart/preferred routes/airways/direct fixes/MEA/MOCA/AMA/MSA/mountainous region/controlled airspace.\n- Weather: METAR/SPECI actual; TAF legality; GFA area; FD winds/temp; SIGMET/AIRMET/PIREP; NOTAM; RSC/CRFI; freezing level.\n- Leg calc: `TC±VAR=MC±DEV=CH`; `time=dist/GS`; `fuel=time×burn`; `ETA=dep+ETE`; `wind correction` and actual GS.\n- `T:` simulated flight questions often test route feasibility, not one isolated fact."},{"id":"10-8","card":"10","h":"IFR route / altitude terms","a":"ifr-route--altitude-terms","c":["ifr-enr"],"p":["IR"],"md":"| Term | Memory |\n|---|---|\n| `MEA` | obstacle + nav reception on airway/route |\n| `MOCA` | obstacle clearance; nav reception usually limited near NAVAID |\n| `MRA` | min altitude to receive/use fix-defining signal |\n| `AMA` | area min altitude; replaced old `GASA`; standard temp/pressure |\n| `MSA` | emergency/sector altitude near facility/ARP/waypoint |\n| `MVA` | ATC radar/vector altitude, normally unpublished to pilots |\n\n- `T:` cleared direct ≠ automatically safe at low altitude; compare minimum IFR altitude / terrain / cold temp / MEA logic."},{"id":"10-9","card":"10","h":"Altimeter-setting / standard-pressure regions","a":"altimeter-setting--standard-pressure-regions","c":["law-airspace","met-atmos","ifr-enr"],"p":["IR"],"md":"- Altimeter-setting region: departure set aerodrome setting/elevation; enroute nearest station along route; arrival set destination setting if available.\n- Standard-pressure region: set `29.92/1013.2` except departure/arrival transition procedures.\n- Climbing into standard-pressure region: set standard immediately after entering. Descending into altimeter-setting region: set appropriate station immediately before descending into region.\n- `T:` flight level = standard-pressure altimeter. “high-to-low/cold = look out below” still applies."},{"id":"10-10","card":"10","h":"Controlled / uncontrolled IFR","a":"controlled--uncontrolled-ifr","c":["law-airspace","ifr-enr"],"p":["IR"],"md":"- Controlled IFR: clearance, altitude, route, comms, transponder/Mode C where required.\n- Uncontrolled IFR: pilot self-separation from terrain and other IFR/VFR using published procedures, MF/ATF calls, IFR flight plan/itinerary, and weather/altitude minima.\n- `T:` uncontrolled IFR departure/arrival may have no ATC separation until controlled airspace; broadcast and protect yourself."},{"id":"10-11","card":"10","h":"Clearance / readback","a":"clearance--readback","c":["law-atc","ifr-enr"],"p":["IR"],"md":"- Clearance contents: clearance limit, route, altitude, departure/restrictions, frequency, squawk, void/release/hold-for-release if issued.\n- `P:` read back clearance limit/route/altitude/restrictions/squawk/hold-short/runway.\n- `T:` “cleared for the approach” authorizes IAP but not visual descent below minima; “cleared to airport” may be clearance limit, not landing clearance."},{"id":"10-12","card":"10","h":"IFR in VMC / visual restriction","a":"ifr-in-vmc--visual-restriction","c":["ifr"],"p":["IR"],"md":"- If IFR clearance includes VFR/visual restriction, pilot accepts own terrain/traffic/wake responsibility as specified.\n- Visual approach: IFR remains IFR; visual reference to airport/traffic; ATC may clear visual; missed usually as coordinated/ATC, not necessarily published IAP missed unless assigned.\n- Contact approach: pilot requests; clear of cloud; flight visibility and reasonable expectation to destination; IFR remains IFR.\n- `T:` visual/contact approach can remove published segment protection if you wander."},{"id":"10-13","card":"10","h":"Lost comms — general","a":"lost-comms--general","c":["emg-comms"],"p":["IR"],"md":"- `P:` squawk `7600`; maintain listening watch; try alternate freq/FSS/relay/phone when practical; comply with specific SID/STAR/IAP/CAP comm-fail instructions.\n- `T:` specific published comm-fail procedure overrides generic rules.\n- `T:` if ATC says “if no comm by X, expect Y,” that can become expected route/alt/time logic."},{"id":"10-14","card":"10","h":"Lost comms — VMC / IMC","a":"lost-comms--vmc--imc","c":["emg-comms"],"p":["IR"],"md":"- VMC after failure: continue VFR and land as soon as practicable. `T:` practicable≠nearest unsuitable field.\n- IMC route: `A-V-E-F` = assigned → vectored direct to fix/route/airway → expected → filed.\n- IMC altitude: highest of `A-M-E` = assigned / minimum IFR altitude / expected. If vectored below published IFR altitude, climb immediately to appropriate minimum IFR altitude.\n- Descent: maintain enroute altitude to nav facility/approach fix; descend at latest ETA/EAT/EFC logic. If holding instruction acknowledged, hold as directed and approach at `EAT/EFC`.\n- `M:` lost comm = `7600 + VMC land / IMC AVEF + AME + latest time`."},{"id":"10-15","card":"10","h":"Departure / takeoff minima","a":"departure--takeoff-minima","c":["ifr-dep"],"p":["IR"],"md":"- Check CAP aerodrome chart/SID/ODP/diverse departure, climb gradient, obstacle notes, RVR/visibility, lighting, engine-out capability if applicable.\n- `R:` takeoff visibility precedence: use runway `RVR` when reported at/above the applicable minimum; use aerodrome `ground visibility` when RVR is below minimum, varies below/above minimum, or is not reported; use PIC-observed `runway visibility` only when neither RVR nor ground visibility is reported. `[CAR 602.126]`\n- Applicable minimum comes from the AOC/special authorization, or the current CAP for other operations.\n- `T:` takeoff visibility ≠ landing/approach visibility. Departure obstacle climb gradient may be more restrictive than weather.\n- `T:` “standard takeoff minima” is not “safe to climb over obstacles”; compare required climb gradient vs aircraft performance."},{"id":"10-16","card":"10","h":"SID / ODP / climb gradient","a":"sid--odp--climb-gradient","c":["ifr-dep"],"p":["IR"],"md":"- SID = published ATC/obstacle/departure routing; may include altitude/speed/climb gradient.\n- Diverse departure assumes obstacle environment supports generic departure; if obstacle DP exists, use it unless ATC assigns otherwise.\n- Climb gradient: `ft/NM`; required ROC ≈ `GS × ft/NM / 60`.\n- Common 3.3% ≈ `200 ft/NM`. `F:` `ROC fpm = GS kt × gradient(ft/NM)/60`.\n- `T:` climb gradient is ground-speed based; tailwind/high GS raises required fpm."},{"id":"10-17","card":"10","h":"Enroute / position reports / ATC","a":"enroute--position-reports--atc","c":["law-atc","ifr-enr"],"p":["IR"],"md":"- IFR position report when required: position, time, altitude, next fix/ETA, ensuing fix, remarks.\n- STAR lateral path forms part of route when filed/cleared; descent clearance still needed unless specifically cleared by ATC/procedure.\n- ATC speed assignment supersedes charted speed until prohibited/cancelled; charted restrictions remain unless cancelled.\n- `T:` STAR vertical restrictions above assigned altitude remain mandatory unless cancelled."},{"id":"10-18","card":"10","h":"Holding","a":"holding","c":["ifr-hold"],"p":["IR"],"md":"- Clearance: fix, direction, radial/course/bearing/airway, leg length/time, altitude, EFC.\n- Standard = right turns; non-standard = left. Published max speed inside hold wins.\n- Entries: direct / teardrop / parallel. `T:` entry is a method; protected airspace matters.\n- Timing: standard outbound leg `1 min` at/below `14,000 ft ASL`; `1.5 min` above. Adjust outbound to achieve the corresponding inbound time; DME holds use specified distances. `[AIM 2026-1 RAC 10.3/10.6]`\n- Wind: outbound correction about `3×` inbound drift. `T:` EFC and fuel are exam-critical."},{"id":"10-19","card":"10","h":"Publication-currency exam traps","a":"publication-currency-exam-traps","c":["nav-pubs","study-traps"],"p":["IR"],"md":"- Check effective date/cycle first. Then NOTAM and AIP SUP; Trigger NOTAM only points to changed material.\n- AIP SUP can remain active with no current Trigger NOTAM.\n- PFAF lightning-bolt depiction is a future incremental standard beginning `2026-10-29`; current July-cycle questions use current-chart symbology.\n- `T:` wrong-cycle plate may produce a numerically correct but operationally invalid answer."},{"id":"10-20","card":"10","h":"CAP plate read flow","a":"cap-plate-read-flow","c":["ifr-plates"],"p":["IR"],"md":"- `P:` title/effective→airport/runway/proc→nav source/freq/course→MSA/Safe100/terrain→RASS/cold temp→IAF/IF/FAF/FAP→stepdowns→DA/MDA/HAT/HAA/HATh/DH→advisory vis→MAP→missed→lighting/runway/LDA→notes.\n- `T:` wrong frequency/source/course = common trap. Always verify CDI source and loaded procedure.\n- `T:` plan view altitude is not enough; profile and minima notes can modify it."},{"id":"10-21","card":"10","h":"CAP definitions / minima","a":"cap-definitions--minima","c":["ifr-minima","ifr-plates"],"p":["IR"],"md":"| Item | Memory |\n|---|---|\n| `DA` | altitude where missed shall be initiated if visual ref not established |\n| `DH` | height of DA above TDZE/threshold |\n| `MDA` | no descent below until required visual ref |\n| `HAA` | MDA above aerodrome elevation, circling |\n| `HAT/HATh` | DA/MDA above TDZE/threshold, straight-in |\n| `MSA` | min 1000 ft clearance in sector, standard temp/pressure |\n| `RVR` | runway centreline visual range of markings/lights |\n\n- `T:` advisory visibility helps probability/ban logic; DA/MDA controls vertical descent."},{"id":"10-22","card":"10","h":"RASS / remote altimeter","a":"rass--remote-altimeter","c":["ifr-rass"],"p":["IR"],"md":"- `Use CYND`: procedure minima have RASS built in; use identified altimeter source.\n- `When using CYND add 160`: add adjustment to intermediate, final, and missed-approach segment minimum altitudes.\n- `When using CYND add 160. Circling minima apply`: final descent gradient exceeded after RASS; straight-in minima not usable.\n- `T:` RASS/cold temperature corrections can change stepdowns, MDA/DA, and missed segment altitudes; do not just add to the final line mentally."},{"id":"10-23","card":"10","h":"Approach types","a":"approach-types","c":["ifr-app-fly"],"p":["IR"],"md":"- Precision: ILS with lateral+vertical guidance; uses `DA/DH`.\n- APV: vertical guidance but not precision; e.g., `LPV`, `LNAV/VNAV`; uses `DA`.\n- NPA: lateral guidance only; e.g., LOC/VOR/NDB/LNAV; uses `MDA`.\n- SCDA/CDFA: stable descent technique on NPA; do not descend below MDA without visual reference.\n- `T:` LPV is not ILS. Baro-VNAV temperature limits matter; uncompensated altimetry can invalidate VNAV minima."},{"id":"10-24","card":"10","h":"ILS / LOC / VOR / NDB / DME","a":"ils--loc--vor--ndb--dme","c":["nav-radio","ifr-app-fly"],"p":["IR"],"md":"- ILS: localizer lateral + glideslope vertical; identify frequency/course; beware false GS from above.\n- LOC: localizer lateral only; no glideslope; use LOC minima/MDA.\n- VOR: radials FROM station; set correct course; TO/FROM flag matters.\n- NDB/ADF: bearing to station; wind correction/relative bearing; high workload; needle points to station, not necessarily desired track.\n- DME: slant range; DME arcs require lead/radial orientation.\n- `T:` reverse sensing only if display/source/course logic mishandled; know equipment."},{"id":"10-25","card":"10","h":"RNAV/GNSS","a":"rnavgnss","c":["nav-gnss","ifr-app-fly"],"p":["IR"],"md":"- Verify database current, correct airport/runway/procedure/transition, RAIM/WAAS, mode/sensitivity, OBS/SUSP, missed approach sequencing.\n- CDI sensitivity: enroute → terminal → approach; ensure unit arms/activates correct mode.\n- Alternate planning with GNSS: verify availability/integrity and current Canadian rules; ground NAVAID fallback may be required depending equipment/approval.\n- `T:` “direct-to FAF” may delete procedure sequencing/protection. `OBS/SUSP` misuse is an INRAT classic."},{"id":"10-26","card":"10","h":"Descent / approach math","a":"descent--approach-math","c":["ifr-app-fly","study-formulas"],"p":["IR"],"md":"- `F:` 3° path ≈ `300 ft/NM`; required ROD ≈ `GS × 5`.\n- `F:` descent gradient ft/NM → `ROC/ROD fpm = GS × ft/NM / 60`.\n- `F:` descent distance NM ≈ altitude to lose / `300` for 3°. `T:` add level segments, stepdowns, wind, configuration.\n- `F:` time min = distance/GS×60. `T:` groundspeed, not IAS."},{"id":"10-27","card":"10","h":"Landing minima / visual reference","a":"landing-minima--visual-reference","c":["ifr-minima"],"p":["IR"],"md":"- Do not continue below DA/DH or descend below MDA unless required visual reference is established and maintained for safe landing.\n- Required visual refs include runway/markings/threshold/TDZ/approach lights/VGSI/RIL/threshold-end lights/edge/centreline/TDZL.\n- `T:` seeing “some lights” may not be enough if it doesn’t allow position/rate assessment for safe landing."},{"id":"10-28","card":"10","h":"Missed approach","a":"missed-approach","c":["ifr-missed"],"p":["IR"],"md":"- Precision/APV: at DA/DH without visual refs → missed.\n- NPA: at MAP or when unable to continue safely/legally → missed; do not descend below MDA before visual refs.\n- Fly published missed exactly: climb, turn limits, nav source, altitude, hold. If missed after MAP, obstacle clearance may not be assured.\n- `T:` power/attitude/config first; then nav. brief missed before FAF."},{"id":"10-29","card":"10","h":"Circling","a":"circling","c":["ifr-missed"],"p":["IR"],"md":"- Circling minima based on category; maintain visual reference; remain within protected area; use published restrictions.\n- If visual reference lost while circling: initiate missed; generally turn toward landing runway and intercept published missed unless procedure/SOP says otherwise.\n- `T:` circling at night/marginal wx is high risk; exam may test category/speed/minima mismatch."},{"id":"10-30","card":"10","h":"Approach ban / RVR — general aviation","a":"approach-ban--rvr--general-aviation","c":["ifr-minima"],"p":["IR"],"md":"- GA NPA/APV/CAT I/II: governed by RVR values when runway served by RVR.\n- General non-Part VII aeroplane rule: if both measured, below minimum when `RVR A <1200` **or** `RVR B <600`; if only one is measured, below minimum when it is `<1200`. `[CAR 602.129]`\n- Exceptions include: below-min RVR received after FAF; training missed approach; RVR varying below/above; RVR below min but ground vis ≥`1/4 SM`; CAT III as applicable.\n- `T:` if RVR unavailable/not reported, GA approach-ban criterion may not exist; still need DA/MDA visual reference to land.\n- `T:` commercial approach-ban rules are stricter/different; don’t mix GA and 703/704/705 tables."},{"id":"10-31","card":"10","h":"Takeoff visibility / RVR trap","a":"takeoff-visibility--rvr-trap","c":["ifr-dep","ifr-minima"],"p":["IR"],"md":"- RVR report can be below takeoff minimum but ground visibility at/above minimum may govern; inverse also possible.\n- If both lowest RVR and ground visibility are below required minimum, takeoff not authorized.\n- If only RVR below minimum and no governing ground visibility at/above minimum, takeoff not authorized.\n- `T:` “variable RVR” and “observed on-the-hour vs now” wording can flip the answer."},{"id":"10-32","card":"10","h":"Alternate minima core","a":"alternate-minima-core","c":["ifr-alt"],"p":["IR"],"md":"| Facility at alternate | Weather memory |\n|---|---|\n| 2+ usable precision, separate suitable runways | `400-1` or `+200/+1/2` above lowest usable HAT/vis, greater |\n| 1 usable precision | `600-2` or `+300/+1` above lowest HAT/vis, greater |\n| NPA only | `800-2` or `+300/+1` above lowest HAT/HAA and vis, greater |\n| No IFR approach | forecast ≥`500 ft` above min IFR altitude permitting VFR app/landing |\n\n- `600-2` and `800-2` are standard alternate minima. If standard applies, other authorized minima may be available from CAP table.\n- `T:` “alternate not authorized” / NOTAM NAVAID out / runway not suitable / no forecast can kill an otherwise good alternate."},{"id":"10-33","card":"10","h":"TAF alternate logic","a":"taf-alternate-logic","c":["met-taf","ifr-alt","ifr-wx"],"p":["IR"],"md":"- Improving `BECMG`: use new condition at END of BECMG period.\n- Deteriorating `BECMG`: use new condition at START of BECMG period.\n- `TEMPO` must not be below alternate minima.\n- `PROB` must not be below appropriate landing minima.\n- GFA alternate: no cloud <`1000 ft` above lowest usable HAT/HAA; no CB; vis ≥`3 SM`.\n- Aerodrome advisory forecast alternate: ≥`500 ft` above lowest usable HAT/HAA and vis ≥`3 SM`.\n- `T:` alternate minima ≠ landing minima ≠ approach-ban minima."},{"id":"10-34","card":"10","h":"Weather decoding — exam workflow","a":"weather-decoding--exam-workflow","c":["met-products","ifr-wx"],"p":["IR"],"md":"- METAR/SPECI: wind, vis, wx, cloud, temp/dew, altimeter, remarks; RVR if vis ≤`1 SM` and/or RVR ≤`6000 ft`.\n- TAF: validity, FM, BECMG, TEMPO, PROB, wind/vis/wx/cloud. Ceiling = lowest BKN/OVC/VV.\n- FD: interpolate wind/temp aloft; choose true altitude/level; use winds for GS/fuel/temp/icing.\n- GFA: clouds/wx + icing/turb/freezing level; use time panels and expected movement.\n- `T:` TAF legal but GFA/SIGMET/PIREPs ugly = operational no-go even if exam legal answer exists."},{"id":"10-35","card":"10","h":"IFR weather traps","a":"ifr-weather-traps","c":["ifr-wx","study-traps"],"p":["IR"],"md":"- Freezing level + cloud/precip = icing risk. Carb ice can exist above freezing in humid partial power.\n- Warm front: layered cloud/low vis/steady precip/freezing rain risk. Cold front: convective showers/TS/gusts/wind shear.\n- TS/CB: avoid; embedded CB in IMC is no-go for light trainer.\n- Low-level wind shear/microburst: go-around may not save you if severe; avoid.\n- `T:` altimetry errors from cold temps affect obstacle clearance, not just indicated altitude comfort."},{"id":"10-36","card":"10","h":"Instrument failures","a":"instrument-failures","c":["agk-inst","ifr-emerg"],"p":["IR"],"md":"- Pitot blocked + drain open: ASI reads `0`. Pitot blocked + drain blocked: ASI acts altimeter-ish. Static blocked: ASI/ALT/VSI errors; alternate static changes readings.\n- Vacuum fail: attitude/heading unreliable; use turn coordinator/compass/power/performance if electric TC.\n- Compass: variation, deviation, dip, acceleration, turning errors. `ANDS/UNOS` for N hemisphere.\n- Electrical fail: load shed, battery time, comm/nav loss planning. `T:` GPS/iPad not a full IFR electrical system."},{"id":"10-37","card":"10","h":"Navigation aid checks","a":"navigation-aid-checks","c":["nav-radio"],"p":["IR"],"md":"- VOR: identify Morse/voice, correct frequency/course/TO-FROM, service volume and NOTAM.\n\n##### VOR receiver checks — 4–6–4\n\n| Check | Maximum acceptable error / difference |\n|---|---|\n| VOT / designated ground checkpoint | **±4°** from the reference indication (FAA AIM reference; see Canadian scope below) |\n| Airborne landmark / published-radial check | **±6°** from the published radial |\n| Dual independent VOR receivers, same station | **4° total difference** between indicated bearings |\n\n- `M:` **4 ground — 6 airborne — 4 between receivers.**\n- `P VOT:` with CDI centred, reference indication is **000° FROM** or **180° TO**; apply ±4°. A designated ground checkpoint uses its published radial instead.\n- `T dual:` NAV1 030° / NAV2 034° = at the limit; 030° / 035° = exceeds tolerance. This is **4° between receivers**, not ±4° each. Compare using the same TO/FROM sense.\n- `T airborne:` ±6° is a **receiver-check tolerance**, not permission to track 6° off course.\n- **Canadian scope:** TC AIM 2026-1 COM 4.5.1–4.5.2 specifies the dual comparison and airborne check: difference greater than 4° requires investigation/correction before IFR use; airborne error greater than 6° means the equipment should not be used for IFR navigation. The ground/VOT ±4° and VOT indications above are explicitly sourced to the FAA AIM; do not infer U.S. checking intervals or recordkeeping requirements for Canada.\n- **Sources:** [TC AIM 2026-1, COM 4.5.1–4.5.2](https://tc.canada.ca/en/aviation/publications/transport-canada-aeronautical-information-manual-tc-aim-tp-14371); [FAA AIM 1-1-4, VOR Receiver Check](https://www.faa.gov/air_traffic/publications/atpubs/aim_html/chap1_section_1.html). Reviewed 2026-10-19.\n\n\n- ILS: identify LOC; set front course; GS alive from below; marker/DME/fixes per plate.\n- NDB: identify; station passage/needle swing; ADF errors near TS/coast/night/mountain.\n- GNSS: current DB, RAIM/WAAS, correct mode, CDI scaling, annunciations.\n- `T:` failed identification = unusable navaid for approach."},{"id":"10-38","card":"10","h":"Human factors / single-pilot IFR","a":"human-factors--single-pilot-ifr","c":["agk-hf"],"p":["IR"],"md":"- Threats: workload, fixation, automation surprise, spatial disorientation, fatigue, hypoxia, CO, pressure.\n- `P:` brief before busy segment; set bugs/freqs/GPS/OBS; use flows+checklists; say unable early.\n- Leans/coriolis/graveyard spiral/somatogravic illusion: trust instruments, cross-check, standard-rate turns.\n- `T:` automation can be wrong because pilot loaded it wrong."},{"id":"10-39","card":"10","h":"INRAT high-yield traps","a":"inrat-high-yield-traps","c":["study-traps"],"p":["IR"],"md":"- Legal source vs guidance source. RVR vs ground vis vs advisory vis. Alternate minima vs landing minima vs approach ban. RASS/cold-temp corrections.\n- Lost comm route/alt/time. STAR lateral vs vertical clearance. Visual/contact approach IFR status. Hold EFC/fuel.\n- MAP vs MDA vs missed after MAP. SCDA not permission below MDA. LPV vs ILS. LNAV/VNAV temp limits. OBS/SUSP.\n- Fuel includes approach+missed at destination before alternate. `TEMPO/BECMG/PROB` logic. Uncontrolled IFR comms/separation. NOTAM invalidates NAVAID/runway/procedure."},{"id":"10-40","card":"10","h":"Simulated IFR flight workflow","a":"simulated-ifr-flight-workflow","c":["ifr","ifr-plan"],"p":["IR"],"md":"- `1 Documents:` current CAP/CFS/LO/NOTAM/TAF/METAR/GFA/FD/SIGMET/PIREP.\n- `2 Route:` dep SID/ODP → enroute MEA/MOCA/AMA → STAR/approach → alternate.\n- `3 Weather:` dest legal? alternate legal? icing/TS/turb/wind/RVR/approach ban? freezing level? runway state?\n- `4 Fuel:` taxi/delay + trip + app/missed + alternate + reserve + foreseeable.\n- `5 Plates:` RASS/cold temp, minima, stepdowns, MAP, missed, lighting, runway length.\n- `6 Calculations:` GS/ETE/fuel, climb gradient fpm, descent rate, hold timing, alternate minima.\n- `7 Decision:` legal? safe? equipped? current? if no, what changes?"},{"id":"10-41","card":"10","h":"Pebble","a":"pebble","c":["ifr","study-pebble"],"p":["IR"],"md":"- INRAT `50/3h/70` | TP guide≠law | IR G1/G2/G3/G4 | fuel prop alt: dest app+missed→alt land→45 | no alt: dest app+missed→45 | route `A-V-E-F` | alt highest `A-M-E` | descent latest `ETA/EAT/EFC` | RASS add to intermediate/final/missed | MDA no below; DA missed | missed after MAP no assured OC | alt mins `400-1 / 600-2 / 800-2` | BECMG improve=end/deteriorate=start | TEMPO ≥alt mins | PROB ≥landing mins | RVR/advisory/ground vis are different | GS not IAS for timing/gradient."},{"id":"10-42","card":"10","h":"Sources & review status","a":"sources--review-status","c":["study-src"],"p":["IR"],"md":"See the [separate review record](../CONTENT_REVIEW.md#historical-source-review-notes) for source editions, check dates and earlier validation notes."},{"id":"11-0","card":"11","h":"Overview","a":null,"c":["ifr-plates","study-src"],"p":["IR"],"md":"`SEPTEMBER CPAER REVIEW: retained reference, not freshly revalidated` | use exact aircraft/current operational sources\n`P` procedure | `R` rule | `T` trap | `M` memory | `!` safety | `?` verify | Canada CAP / IFR / INRAT\n`RELEASE:` `OPS/CYCLE-REF PROVISIONAL` | `CANONICAL SOURCE:` `cap_plate_reading_qrc_av_cave_v0_2.md` | `NOT FLIGHT AUTHORITY`"},{"id":"11-1","card":"11","h":"Current publication cycle","a":"current-publication-cycle","c":["nav-pubs","ifr-plates","study-src"],"p":["IR"],"md":"- Current `CAP/CAP GEN/CFS/AIP/DAH/charts` AIRAC cycle: effective `2026-07-09` through `2026-09-03`.\n- These publications update every `56 days`; AIP SUP/AIC publish on a `14-day` cycle.\n- `P preflight:` current publication→NOTAM→AIP SUP/AIC→airport/procedure page→aircraft data.\n- Trigger NOTAM = notice that source material changed; retrieve the referenced amendment/Supplement. It may expire while the underlying AIP SUP remains active.\n- `[NAV CANADA publication schedule; AIC 009/2026]`"},{"id":"11-2","card":"11","h":"Source / scope","a":"source--scope","c":["ifr-plates","study-src"],"p":["IR"],"md":"- `SRC:` current CAP/CAP GEN/CFS/NOTAM/AIP SUP win. Current cycle: `2026-07-09` to `2026-09-03`.\n- CAP contains IFR arrival/departure information: IAP, SID, STAR, visual approaches, noise abatement and aerodrome/ground charts.\n- CAP is not intended for VFR operations and is regularly amended by NOTAM/AIP SUP.\n- `T:` stale plate = no-go. Trigger NOTAM≠the amendment; retrieve referenced material."},{"id":"11-3","card":"11","h":"10-second plate scan","a":"10-second-plate-scan","c":["ifr-plates"],"p":["IR"],"md":"- `P:` title/effective→airport/runway/procedure→nav source/freq/course→plan view→profile→minima→missed→notes→lighting/runway→brief threats.\n- `M:` `TITLE-NAV-PLAN-PROFILE-MIN-MISSED-NOTES-RWY`.\n- `T:` don’t start with minima only. Plate errors usually come from source/fix/altitude/missed/notes."},{"id":"11-4","card":"11","h":"Currency gate","a":"currency-gate","c":["nav-pubs","ifr-plates"],"p":["IR"],"md":"- `G:` chart effective/current→procedure not cancelled/replaced→NOTAM reviewed→AIP SUP reviewed→NAVAIDs/runway/lights available→database current.\n- AIP SUP may remain effective after its short-lived Trigger NOTAM disappears.\n- `T:` a plate matching the current 56-day cycle can still be amended or unavailable."},{"id":"11-5","card":"11","h":"Title block","a":"title-block","c":["ifr-plates"],"p":["IR"],"md":"- Check airport name/ICAO, procedure title, runway, amendment/effective date, page/cycle, units, notes.\n- Procedure title tells primary nav basis: `ILS`, `LOC`, `RNAV (GNSS)`, `VOR`, `NDB`, `DME`, `RNP AR` etc.\n- `T:` runway number/procedure variant matters; `ILS RWY 24` ≠ `LOC RWY 24` ≠ `RNAV (GNSS) RWY 24`."},{"id":"11-6","card":"11","h":"Required equipment / approval","a":"required-equipment--approval","c":["ifr-plates"],"p":["IR"],"md":"- Confirm aircraft and pilot authorized/equipped: NAV receiver, DME, ADF, GNSS/WAAS, Baro-VNAV, RNP AR, comms, transponder, database.\n- `T:` if equipment/navaid/database not usable, that line/minima may be unavailable.\n- `T:` GNSS overlay/direct-to does not make a non-GNSS procedure a GNSS approach unless authorized/published."},{"id":"11-7","card":"11","h":"Frequencies / nav source","a":"frequencies--nav-source","c":["nav-radio","ifr-plates"],"p":["IR"],"md":"- `P:` set/identify nav aid; verify Morse/voice where applicable; set inbound course/front course; cross-check GPS/database.\n- `T:` wrong CDI source is lethal: green needles vs magenta needles vs raw data.\n- `T:` ILS front course set even when autopilot/GPS displays course automatically; know equipment."},{"id":"11-8","card":"11","h":"Plan view","a":"plan-view","c":["ifr-plates"],"p":["IR"],"md":"- Read IAF/IF/FAF/FAP, transitions, arcs, bearings/radials/tracks, distances, holds, MSA/Safe 100 NM/sector altitudes, terrain, restricted areas.\n- `T:` plan view gives lateral path; profile gives vertical constraints. Need both.\n- `T:` arc/radial orientation: VOR radials are FROM station; bearings to NDB are TO station."},{"id":"11-9","card":"11","h":"MSA / Safe altitude / terrain","a":"msa--safe-altitude--terrain","c":["ifr-plates"],"p":["IR"],"md":"- MSA/sector altitude = emergency/sector obstacle clearance near reference point; not necessarily ATC minimum vectoring altitude.\n- Check terrain symbols, obstacles, minimum sector altitude, procedure notes, cold-temp notes.\n- `T:` MSA is not a clearance to descend on the procedure."},{"id":"11-10","card":"11","h":"Initial / intermediate segment","a":"initial--intermediate-segment","c":["ifr-app-fly","ifr-plates"],"p":["IR"],"md":"- Identify crossing altitudes and restrictions before FAF/FAP.\n- Stepdown fixes: confirm fix source and altitude. If fix cannot be identified, stepdown may be unusable.\n- `T:` “at or above” altitude is a floor, not a target to duck under early."},{"id":"11-11","card":"11","h":"PFAF depiction transition","a":"pfaf-depiction-transition","c":["nav-pubs","ifr-app-fly","ifr-plates"],"p":["IR"],"md":"- Current July 2026 cycle: use the symbols actually printed on the plate.\n- From `2026-10-29`, NAV CANADA plans incremental use of a lightning-bolt symbol for the PFAF/glidepath-intercept altitude on vertically guided procedures.\n- Future co-charted procedures may show both: Maltese cross for non-vertical FAF + lightning bolt for PFAF.\n- `T:` this is a future incremental change, not a blanket reinterpretation of current plates."},{"id":"11-12","card":"11","h":"FAF / FAP","a":"faf--fap","c":["ifr-app-fly","ifr-plates"],"p":["IR"],"md":"- FAF often Maltese-cross-like symbol on NPA; FAP for precision/APV intercept of final descent path.\n- `P:` before FAF/FAP: correct nav source, approach mode, altimeter, brief complete, landing config plan, missed set, timer if required.\n- `T:` after FAF, workload jumps; if not configured/briefed, go around or delay."},{"id":"11-13","card":"11","h":"Profile view","a":"profile-view","c":["ifr-app-fly","ifr-plates"],"p":["IR"],"md":"- Read inbound course, crossing altitudes, stepdowns, descent angle, distance to threshold/MAP, MDA/DA relationship.\n- For NPA: manage MDA, MAP, timing/DME/fix. For precision/APV: manage DA and vertical path.\n- `T:` advisory descent angle/CDFA does not authorize descent below MDA without required visual reference."},{"id":"11-14","card":"11","h":"Descent math","a":"descent-math","c":["ifr-app-fly","ifr-plates","study-formulas"],"p":["IR"],"md":"- `F 3°:` ROD≈`GS×5`.\n- `F:` descent gradient fpm=`GS×ft/NM/60`.\n- `F:` distance to lose altitude≈`altitude to lose/300` for 3°.\n- `T:` use groundspeed. Stepdowns and level-offs change the simple 3° plan."},{"id":"11-15","card":"11","h":"Minima box scan","a":"minima-box-scan","c":["ifr-minima","ifr-plates"],"p":["IR"],"md":"- Read aircraft category first: `A/B/C/D/E` by final approach speed category.\n- Identify line: `ILS/LOC/LNAV/LNAV-VNAV/LPV/VOR/NDB/circling`.\n- Extract: `DA/DH` or `MDA`; `HAT/HATh/HAA`; advisory visibility; notes/lighting penalties; RASS/cold-temp impacts.\n- `T:` wrong category = wrong protected area/minima. Faster circling speed can force higher category."},{"id":"11-16","card":"11","h":"Minima definitions","a":"minima-definitions","c":["ifr-minima","ifr-plates"],"p":["IR"],"md":"| Item | Use |\n|---|---|\n| `DA` | decision altitude; missed if visual ref not established |\n| `DH` | height above threshold/TDZE reference |\n| `MDA` | minimum descent altitude; do not descend below until visual ref |\n| `HAT/HATh` | height above touchdown/threshold, straight-in |\n| `HAA` | height above aerodrome, circling |\n| `Vis` | advisory / approach-ban planning value, not DA/MDA itself |\n\n- `T:` DA/MDA controls vertical descent; RVR/vis controls approach-ban/planning/success probability."},{"id":"11-17","card":"11","h":"Visual reference rule","a":"visual-reference-rule","c":["ifr-minima","ifr-plates"],"p":["IR"],"md":"- Do not continue below DH/DA or descend below MDA unless required visual reference is established and maintained for safe landing.\n- Visual references may include runway/markings/threshold/TDZ/approach lights/VGSI/RIL/threshold-end lights/edge/centreline/TDZ lights.\n- `T:` “I see glow/lights” may not be enough; must support safe continuation/landing."},{"id":"11-18","card":"11","h":"Approach type memory","a":"approach-type-memory","c":["ifr-app-fly","ifr-plates"],"p":["IR"],"md":"| Type | Vertical? | Minimum |\n|---|---|---|\n| `ILS` | precision vertical | `DA/DH` |\n| `LOC` | lateral only | `MDA` |\n| `LNAV` | lateral only | `MDA` |\n| `LNAV/VNAV` | APV vertical | `DA` |\n| `LPV` | APV vertical-like | `DA` |\n| `VOR/NDB` | lateral/non-precision | `MDA` |\n| `Circling` | visual manoeuvre | `MDA/HAA` |\n\n- `T:` `LPV` is not ILS. `LNAV/VNAV` often temperature/Baro-VNAV limited."},{"id":"11-19","card":"11","h":"RASS / altimeter source","a":"rass--altimeter-source","c":["ifr-plates","ifr-rass"],"p":["IR"],"md":"- Read altimeter source line before minima. Approved altimeter setting source drives procedure protection.\n- `Use CYXX`: procedure designed/minima already based on that source.\n- `When using CYXX add N ft`: add correction to relevant intermediate/final/missed minimum altitudes.\n- `When using CYXX add N ft; circling minima apply`: straight-in not usable under that remote setting case.\n- `T:` RASS is not optional arithmetic decoration; it can invalidate straight-in minima."},{"id":"11-20","card":"11","h":"Cold temperature","a":"cold-temperature","c":["met-cold","ifr-plates"],"p":["IR"],"md":"- Check CAP cold-temp notes / temperature limits / uncompensated Baro-VNAV restrictions.\n- Apply required altitude corrections to procedure altitudes as applicable; ATC cleared altitude may need coordination if correction affects assigned altitude.\n- `T:` cold correction protects obstacle clearance; it does not change aircraft altimeter reading."},{"id":"11-21","card":"11","h":"Notes block","a":"notes-block","c":["ifr-plates"],"p":["IR"],"md":"- Read all notes: NA at night, procedure NA, GNSS required, DME required, circling restrictions, approach-angle notes, lighting notes, altimeter/RASS, temperature, missed-climb gradient.\n- `T:` notes can override the attractive minima line.\n- `M:` if a note starts with `NA`, `Use`, `When`, `Requires`, or `Circling`, slow down."},{"id":"11-22","card":"11","h":"Missed approach","a":"missed-approach","c":["ifr-missed","ifr-plates"],"p":["IR"],"md":"- Brief before FAF: initial climb, turn direction/altitude, fix/hold, nav source, frequencies, climb gradient, special notes.\n- At DA/MDA/MAP without required visual ref or unstable/unsafe: power→attitude→config→track missed.\n- `T:` missed after MAP may not ensure obstacle clearance. Do not continue level past MAP hunting runway."},{"id":"11-23","card":"11","h":"MAP identification","a":"map-identification","c":["ifr-missed","ifr-plates"],"p":["IR"],"md":"- Precision/APV: DA/DH on glidepath is decision point.\n- NPA: MAP may be timing, DME, waypoint, station passage, runway threshold, or defined fix.\n- `T:` if timer/DME/GPS not set before FAF, MAP identification can fail under workload."},{"id":"11-24","card":"11","h":"Timing","a":"timing","c":["ifr-app-fly","ifr-plates"],"p":["IR"],"md":"- Timing required if MAP based on time or as backup when published.\n- `F:` time(min)=distance/GS×60.\n- `T:` use ground speed, not IAS. Wind change on final can make timing inaccurate; use primary MAP if available."},{"id":"11-25","card":"11","h":"Circling","a":"circling","c":["ifr-missed","ifr-plates"],"p":["IR"],"md":"- Check circling minima/category, prohibited sectors, day/night restrictions, runway lighting, terrain/obstacles, weather/wind.\n- If visual reference lost: initiate circling missed; generally turn toward landing runway then intercept published missed unless procedure/SOP says otherwise.\n- `T:` circling area depends category/speed. Faster than category = higher category."},{"id":"11-26","card":"11","h":"Straight-in vs circling","a":"straight-in-vs-circling","c":["ifr-minima","ifr-missed","ifr-plates"],"p":["IR"],"md":"- Straight-in minima require alignment/descent/visual environment adequate for landing on that runway.\n- If runway not suitable/visual manoeuvre required, use circling minima unless procedure provides straight-in authorized minima.\n- `T:` “approach to runway” does not guarantee straight-in landing is sensible."},{"id":"11-27","card":"11","h":"Lighting / runway / visual aids","a":"lighting--runway--visual-aids","c":["ifr-minima","ifr-plates"],"p":["IR"],"md":"- Check ALS, runway lights, TDZ/centreline lights, PAPI/VASI, RIL, approach lighting penalties, runway length/LDA, slope, displaced threshold.\n- `T:` lighting inoperative can increase minima or make procedure/runway unsuitable. NOTAM can change this."},{"id":"11-28","card":"11","h":"Runway / landing distance","a":"runway--landing-distance","c":["agk-perfcalc","ifr-plates"],"p":["IR"],"md":"- Use LDA/declared distances, slope, surface condition/RSC, wind, temperature, aircraft landing performance.\n- `T:` approach legal does not mean landing distance acceptable."},{"id":"11-29","card":"11","h":"GNSS / RNAV plate traps","a":"gnss--rnav-plate-traps","c":["nav-gnss","ifr-app-fly","ifr-plates","study-traps"],"p":["IR"],"md":"- Verify database current, correct airport/runway/procedure/transition, approach mode armed/active, RAIM/WAAS, CDI sensitivity, OBS/SUSP.\n- Do not use expired database for IFR approach unless explicitly permitted/verified by approved procedure and data.\n- `T:` `Direct-To FAF` can destroy sequencing; missed approach may not auto-sequence until SUSP cancelled correctly."},{"id":"11-30","card":"11","h":"ILS / LOC traps","a":"ils--loc-traps","c":["nav-radio","ifr-app-fly","ifr-plates","study-traps"],"p":["IR"],"md":"- Identify LOC frequency, set front course, intercept from below glidepath, verify GS alive/captured, monitor raw data.\n- LOC-only approach uses LOC minima and MDA, not ILS DA.\n- `T:` false glideslope if intercept from above; back-course/reverse sensing depends equipment and procedure."},{"id":"11-31","card":"11","h":"VOR / NDB / DME traps","a":"vor--ndb--dme-traps","c":["nav-radio","ifr-app-fly","ifr-plates","study-traps"],"p":["IR"],"md":"- VOR radials are FROM; NDB bearing is TO; DME is slant range.\n- DME arc: lead radial/turn anticipation; station passage/DME switch can confuse.\n- `T:` unserviceable navaid or no identification = no approach using that navaid."},{"id":"11-32","card":"11","h":"Approach briefing compact script","a":"approach-briefing-compact-script","c":["ifr-app-fly","ifr-plates"],"p":["IR"],"md":"- `P:` “This is [procedure/runway] at [airport], plate current. Nav [source/freq/course], minima [line/category/DA-MDA/vis], altimeter/RASS [source/correction], FAF [fix/alt], MAP [fix/time/DME], missed [climb/turn/fix/hold], runway [LDA/lights], threats [wx/terrain/wind/icing/NOTAM].”\n- `M:` `PROC-NAV-MIN-RASS-FAF-MAP-MISSED-RWY-THREATS`."},{"id":"11-33","card":"11","h":"Before FAF / final gate","a":"before-faf--final-gate","c":["ifr-app-fly","ifr-plates"],"p":["IR"],"md":"- `P:` altimeter set/cross-check → nav source active → course set → approach armed/active → missed loaded/briefed → landing checklist → speed/config plan → timer if needed → minimums bugged.\n- `T:` if not stable/briefed/configured, request vectors/hold or go missed."},{"id":"11-34","card":"11","h":"INRAT plate question method","a":"inrat-plate-question-method","c":["ifr-plates","study-traps"],"p":["IR"],"md":"- `1` identify procedure/minima line; `2` check category; `3` read notes/RASS/cold; `4` check altimeter source; `5` apply lighting/runway/NOTAM; `6` compare weather/RVR; `7` determine legal/safe action.\n- `T:` exam distractors often ignore a note or use wrong category/minima line."},{"id":"11-35","card":"11","h":"Real-flight plate method","a":"real-flight-plate-method","c":["ifr-plates","study-traps"],"p":["IR"],"md":"- `1` current plate/NOTAM; `2` legal/equipped; `3` fuel/alternate; `4` terrain/icing/TS/wind; `5` setup/brief; `6` monitor stable approach; `7` miss early if doubt.\n- `T:` legal minimums are not personal minimums. Low-vis approaches invite confirmation bias."},{"id":"11-36","card":"11","h":"Pebble","a":"pebble","c":["ifr-plates","study-pebble"],"p":["IR"],"md":"- scan `TITLE-NAV-PLAN-PROFILE-MIN-MISSED-NOTES-RWY` | current CAP/NOTAM wins | category first | note block can kill approach | DA/MDA require visual refs | RASS add to altitudes / may force circling | cold temp protects obstacle clearance | brief missed before FAF | MAP timing uses GS | LPV≠ILS | LOC line≠ILS line | wrong CDI source kills | circling lost visual→missed | legal approach≠landing distance OK."},{"id":"11-37","card":"11","h":"Sources & review status","a":"sources--review-status","c":["ifr-plates","study-src"],"p":["IR"],"md":"See the [separate review record](../CONTENT_REVIEW.md#historical-source-review-notes) for source editions, check dates and earlier validation notes."},{"id":"12-0","card":"12","h":"Overview","a":null,"c":["study-src"],"p":["IR"],"md":"`SEPTEMBER CPAER REVIEW: retained reference, not freshly revalidated` | use exact aircraft/current operational sources\n`P` procedure | `G` gate | `T` trap | `M` memory | `!` safety | `?` verify | Canada IFR; POH/AFM/SOP/current CAP/NOTAM win\n`RELEASE:` `OPS/STUDY-REF / AIRCRAFT-DEPENDENT` | `CANONICAL SOURCE:` `ifr_procedures_qrc_av_cave_v0_2.md` | `NOT FLIGHT AUTHORITY`"},{"id":"12-1","card":"12","h":"Current publication cycle","a":"current-publication-cycle","c":["nav-pubs","study-src"],"p":["IR"],"md":"- Current `CAP/CAP GEN/CFS/AIP/DAH/charts` AIRAC cycle: effective `2026-07-09` through `2026-09-03`.\n- These publications update every `56 days`; AIP SUP/AIC publish on a `14-day` cycle.\n- `P preflight:` current publication→NOTAM→AIP SUP/AIC→airport/procedure page→aircraft data.\n- Trigger NOTAM = notice that source material changed; retrieve the referenced amendment/Supplement. It may expire while the underlying AIP SUP remains active.\n- `[NAV CANADA publication schedule; AIC 009/2026]`"},{"id":"12-2","card":"12","h":"Scope / discipline","a":"scope--discipline","c":["ifr","study-src"],"p":["IR"],"md":"- `SRC:` current CARs/TC AIM/CAP/CFS/NOTAM + aircraft POH/AFM/SOP. TC flight-test guide = training/evaluation guidance, not legal authority.\n- `M:` aviate→navigate→communicate; configure early; verify source/mode; brief missed before FAF.\n- `T:` this QRC is generic. Aircraft memory items, speeds, automation logic, icing limitations and engine-out actions are aircraft-specific."},{"id":"12-3","card":"12","h":"Before engine start — IFR readiness","a":"before-engine-start--ifr-readiness","c":["ifr-plan"],"p":["IR"],"md":"- `P:` weather→current CAP/CFS/AIP→NOTAM→AIP SUP/AIC→RSC→route/altitudes→fuel/alternate→W&B/performance→database/RAIM-WAAS→equipment/defects→personal minima.\n- Set paper/electronic backup, frequencies, route, departure plate, emergency/alternate plan.\n- `G:` legal + equipped + current + fuel + performance + escape options.\n- `T:` a valid clearance does not make an unsafe weather/icing/performance decision safe."},{"id":"12-4","card":"12","h":"Clearance copy","a":"clearance-copy","c":["law-atc","ifr-enr"],"p":["IR"],"md":"- `M:` `CRAFT+` = clearance limit | route | altitude | frequency | transponder | release/void/EFC/restrictions.\n- `P:` copy verbatim→compare filed/expected→mark initial altitude and top altitude→identify SID/transition→read back limit/route/altitude/restrictions/squawk.\n- Ask immediately if ambiguous, impossible, below safe altitude, equipment-incompatible or route not understood.\n- `T:` takeoff clearance is separate. “Expect” altitude is not authorization to climb."},{"id":"12-5","card":"12","h":"IFR cockpit / instrument check","a":"ifr-cockpit--instrument-check","c":["agk-inst"],"p":["IR"],"md":"- `P:` documents/database/current plates→pitot/static heat as req→altimeters set/cross-check→heading indicators aligned→turn instrument/compass during taxi→nav/comms identified→GPS annunciations→autopilot disconnect/test per POH.\n- Taxi turns: heading/compass turn correctly; attitude remains erect; turn coordinator/indicator responds; ball opposite turn; no abnormal flags.\n- `T:` never accept a failed instrument because GPS “looks fine.”"},{"id":"12-6","card":"12","h":"Departure brief","a":"departure-brief","c":["ifr-dep"],"p":["IR"],"md":"- `P:` runway/TODA-ASDA if relevant→takeoff minima→SID/ODP→initial heading/track→first fix→initial altitude→top altitude→freq→climb gradient→terrain→weather→engine/instrument failure plan.\n- `M:` `RWY-PATH-ALT-FREQ-GRAD-THREATS-FAIL`.\n- State: reject criteria; failure before/after liftoff; return vs continue; lost-comms path; automation plan.\n- `T:` ATC vector does not erase obstacle/climb-gradient requirements before radar protection is assured."},{"id":"12-7","card":"12","h":"Before-takeoff IFR gate","a":"before-takeoff-ifr-gate","c":["ifr-dep"],"p":["IR"],"md":"- `G:` clearance understood/read back | runway verified | instruments green | nav source correct | departure loaded/activated | initial course/heading set | altitude bugged | squawk/Mode C | frequencies staged | timer/clock | takeoff brief complete.\n- `P:` heading bug→initial altitude→first nav leg→departure frequency→transponder→lights/pitot heat→doors/checklist.\n- `T:` wrong runway + correct SID is still wrong."},{"id":"12-8","card":"12","h":"Takeoff / initial climb","a":"takeoff--initial-climb","c":["ifr-dep"],"p":["IR"],"md":"- `P:` runway/heading cross-check→power set/engine instruments→airspeed alive→rotate/climb→positive rate/gear as applicable→track runway/SID→instrument transition→after-TKOF flow/checklist.\n- TC flight-test context: instrument control once airborne and above `400 ft AAE`, unless departure procedure specifies otherwise.\n- Maintain assigned heading/track/altitude; verify course indications correspond to selected equipment.\n- `T:` do not chase needles immediately after liftoff; attitude/power first, then trim/nav."},{"id":"12-9","card":"12","h":"Climb gradient check","a":"climb-gradient-check","c":["ifr-dep"],"p":["IR"],"md":"- `F:` required `fpm = GS × ft/NM ÷ 60`.\n- `P:` compare expected GS/ROC with published requirement before departure; monitor actual performance.\n- `T:` tailwind raises GS and required fpm. If unable, advise ATC before takeoff or immediately when recognized."},{"id":"12-10","card":"12","h":"Enroute flow","a":"enroute-flow","c":["ifr-enr"],"p":["IR"],"md":"- `P:` level→power→trim→mixture/engine→altimeter setting→heading/nav cross-check→fuel/time→weather/icing→next frequency/fix/altitude.\n- `M:` `A-P-T-N-E-F`: altitude, power, trim, nav, engine, fuel.\n- Cross-check raw data vs GPS/autopilot; verify every direct-to/route amendment before EXEC/activate.\n- `T:` automation follows the programming error precisely."},{"id":"12-11","card":"12","h":"ATC amendment","a":"atc-amendment","c":["law-atc","ifr-enr"],"p":["IR"],"md":"- `P:` write→read back→confirm aircraft state→modify one system at a time→verify active leg/course/altitude→monitor turn/intercept.\n- If saturated: “stand by,” request vector, delay descent, or ask for clarification.\n- `T:` heads-down programming during turn/descent = loss-of-control/setup-error trap."},{"id":"12-12","card":"12","h":"Arrival setup","a":"arrival-setup","c":["ifr-enr"],"p":["IR"],"md":"- `P:` weather/ATIS→NOTAM/runway→approach choice→plate current→altimeter/RASS/cold temp→category/minima→landing performance→missed/alternate→fuel.\n- Load procedure with correct transition; verify waypoint sequence against plate; stage frequencies/courses; set minimums and missed altitude.\n- `M:` `WX-PLATE-NAV-MIN-MISSED-RWY-FUEL`.\n- `T:` loading an approach is not clearance to fly it or descend."},{"id":"12-13","card":"12","h":"Hold clearance copy","a":"hold-clearance-copy","c":["law-atc","ifr-enr","ifr-hold"],"p":["IR"],"md":"- `M:` `F-D-C-L-A-E` = fix | direction | course/radial/bearing | leg length/time | altitude | EFC.\n- `P:` copy/read back→slow before fix→determine inbound course/turn direction→choose safe entry→brief wind/timing/fuel/EFC→report entry if required.\n- `T:` no EFC or fuel ambiguity? ask."},{"id":"12-14","card":"12","h":"Hold entry / execution","a":"hold-entry--execution","c":["ifr-hold"],"p":["IR"],"md":"- `P:` cross fix→entry→correct side/protected airspace→time outbound abeam/wings-level as appropriate→intercept inbound→adjust timing/wind.\n- Entry: direct / teardrop / parallel; any suitable entry that remains protected is acceptable.\n- Wind rough rule: outbound drift correction ≈ `3×` inbound correction; adjust outbound time to achieve inbound target.\n- TC test targets: track/course `±10°` or within ½-scale, airspeed `±10 kt`, altitude `±100 ft`.\n- `T:` perfect entry sketch with poor fuel awareness is failure. Continuously compute max holding time and alternate fuel."},{"id":"12-15","card":"12","h":"Approach clearance / vector-to-final","a":"approach-clearance--vector-to-final","c":["law-atc","ifr-app-fly"],"p":["IR"],"md":"- `P:` hear approach/runway/route/altitude→read back→verify clearance does not descend below published/assigned minimum→set intercept heading/course/source→arm correct mode only when appropriate.\n- On vectors: maintain last assigned altitude until cleared lower or established as required by clearance/procedure.\n- `T:` approach clearance ≠ landing clearance."},{"id":"12-16","card":"12","h":"Chart-symbol transition","a":"chart-symbol-transition","c":["nav-pubs","ifr-plates"],"p":["IR"],"md":"- Use current-chart symbology. The future PFAF lightning-bolt depiction begins incrementally `2026-10-29`; do not apply it to July-cycle plates unless printed."},{"id":"12-17","card":"12","h":"Approach brief — compact","a":"approach-brief--compact","c":["ifr-app-fly"],"p":["IR"],"md":"- `P:` “[procedure/runway], current plate; nav/freq/course; IAF/FAF altitudes; RASS/cold correction; category/minima/vis; MAP; missed climb-turn-fix-altitude; runway/LDA/lights; threats.”\n- `M:` `PROC-NAV-ALT-MIN-MAP-MISSED-RWY-THREATS`.\n- Pilot-monitoring/self-brief challenge: source? mode? next altitude? next fix? missed action?"},{"id":"12-18","card":"12","h":"Approach setup gate","a":"approach-setup-gate","c":["ifr-app-fly"],"p":["IR"],"md":"- `G:` plate current | NOTAM checked | altimeter source/correction | frequencies identified | CDI source correct | course set | procedure sequence verified | minimums bugged | missed altitude/nav briefed | landing checklist planned.\n- `T:` green vs magenta needles; LOC vs ILS minima; LNAV vs LPV annunciation; wrong transition."},{"id":"12-19","card":"12","h":"Before FAF / FAWP gate","a":"before-faf--fawp-gate","c":["ifr-app-fly"],"p":["IR"],"md":"- `P:` landing checklist→speed/config plan→altitude verified→approach mode active/armed correctly→course alive→timer if required→missed mentally rehearsed.\n- RNAV: confirm approach-ac
