tive mode within `2 NM` before FAWP inbound when required by TC test criteria.\n- `G:` stable enough to continue; if behind, request delay/vector or go missed.\n- `T:` do not descend because vertical guidance appears unless correct mode/procedure/altitude intercept conditions are verified."},{"id":"12-20","card":"12","h":"Stable approach guide","a":"stable-approach-guide","c":["ifr-app-fly"],"p":["IR"],"md":"- TC generic test guide: proper configuration, brief/checklist complete, appropriate power, lateral/vertical within ½-scale for ILS/LPV/LNAV-VNAV, sink ≤`1000 fpm`, speed within `+20/-0`, only small corrections.\n- Stable by `1000 AGL` in IMC / `500 AGL` in VMC; otherwise missed/go-around.\n- `CONTEXT:` TC instrument flight-test guide criterion; not a CAR approach minimum. Operator/school SOP may be tighter.\n- `T:` training/SOP criteria may be tighter. Becoming unstable after the gate still requires a missed approach."},{"id":"12-21","card":"12","h":"NPA / CDFA","a":"npa--cdfa","c":["ifr-app-fly"],"p":["IR"],"md":"- Prefer CDFA when practical for NPA with suitable slope.\n- `P:` calculate descent→cross FAF at/above altitude→constant descent→respect every stepdown→level at/above MDA if required or treat MDA as decision-style altitude when visual references not imminent.\n- No descent below MDA without required visual reference; no missed-approach turn before MAP.\n- `T:` CDFA does not turn MDA into a legal DA. Prevent momentum from carrying below MDA."},{"id":"12-22","card":"12","h":"ILS / LPV / LNAV-VNAV","a":"ils--lpv--lnav-vnav","c":["nav-radio","nav-gnss","ifr-app-fly"],"p":["IR"],"md":"- `P:` intercept lateral course→vertical path from valid position/below as applicable→confirm correct annunciation→small corrections→cross-check altitude/distance→DA decision.\n- ILS/LPV: maintain no more than ½-scale deviations for test standard; at DH/DA without required visual reference→missed.\n- `T:` false glideslope from above; LPV≠ILS; LNAV/VNAV temperature limits; automation downgrade can change minima."},{"id":"12-23","card":"12","h":"LNAV / VOR / LOC / NDB","a":"lnav--vor--loc--ndb","c":["nav-radio","nav-gnss","ifr-app-fly"],"p":["IR"],"md":"- `P:` identify source→course/raw-data check→FAF altitude→CDFA/stepdowns→MDA→MAP identification.\n- Start timer when required; verify DME/GPS waypoint sequence; maintain MDA until visual descent or MAP.\n- `T:` LOC approach uses LOC minima. “Glideslope available” does not authorize ILS minima if not cleared/equipped/identified."},{"id":"12-24","card":"12","h":"Visual transition","a":"visual-transition","c":["ifr-minima"],"p":["IR"],"md":"- `G:` required visual reference established and maintained + normal descent/landing possible + runway/traffic/clearance understood.\n- Transition with minimal manoeuvring; remain within limitations; confirm landing clearance at controlled airport.\n- `T:` runway lights in sight do not automatically mean position/rate permit a safe landing."},{"id":"12-25","card":"12","h":"Missed approach — universal flow","a":"missed-approach--universal-flow","c":["ifr-app-fly","ifr-missed"],"p":["IR"],"md":"- `P:` POWER→ATTITUDE→CONFIG→TRACK→NAV→TALK→CHECKLIST.\n- Initiate promptly at MAP/MAWP or DH/DA, or earlier if unstable/unsafe/unable.\n- Follow published missed or ATC modification; report missed; climb to published/cleared altitude; advise if unable climb gradient/restriction.\n- TC test targets: airspeed `+10/-5`, heading/track `±10°`, altitude `±100 ft`.\n- `T:` first turn no earlier than published/MAP requirements. Do not level beyond MAP searching for runway."},{"id":"12-26","card":"12","h":"Missed approach setup","a":"missed-approach-setup","c":["ifr-app-fly","ifr-missed"],"p":["IR"],"md":"- Before FAF know: initial climb altitude, straight-ahead requirement, turn altitude, direction, fix/hold, nav source, frequency, minimum climb gradient.\n- GNSS: know `SUSP/OBS` sequencing and when to activate missed; verify unit-specific procedure.\n- `T:` pressing buttons before pitch/power/config creates CFIT/loss-of-control risk."},{"id":"12-27","card":"12","h":"Circling","a":"circling","c":["ifr-missed"],"p":["IR"],"md":"- `P:` use correct category/minima→identify runway/traffic→remain visual/protected→configure conservatively→bank ≤aircraft/SOP limits→stable normal descent.\n- Lost visual: execute missed; initially manoeuvre toward landing runway as appropriate, then intercept published missed per plate/SOP.\n- `T:` speed above category may require higher category. Night/marginal circling deserves higher personal minima."},{"id":"12-28","card":"12","h":"Lost communications — immediate","a":"lost-communications--immediate","c":["emg-comms"],"p":["IR"],"md":"- `P:` maintain control/clearance→check volume/squelch/audio panel/mic/PTT/frequency/circuit breakers per POH→try last/next/121.5/FSS/relay→listen on NAV/voice→squawk `7600`.\n- Transmit blind with intentions/position/altitude; monitor for light signals if applicable; use phone after landing.\n- `T:` specific SID/STAR/IAP comm-fail instructions override generic memory."},{"id":"12-29","card":"12","h":"Lost communications — route / altitude / time","a":"lost-communications--route--altitude--time","c":["emg-comms"],"p":["IR"],"md":"- VMC after failure: continue VFR and land as soon as practicable.\n- IMC route: `A-V-E-F` = assigned→vectored direct to specified fix/route/airway→expected→filed.\n- IMC altitude: highest `A-M-E` = assigned / minimum IFR altitude / expected.\n- Descent/approach timing: use applicable latest ETA/EAT/EFC logic and published procedure.\n- `T:` generic mnemonic cannot answer every uncovered scenario; exercise judgment and comply with published instructions."},{"id":"12-30","card":"12","h":"Vacuum / attitude-heading failure","a":"vacuum--attitude-heading-failure","c":["agk-gyro","emg-sys","ifr-emerg"],"p":["IR"],"md":"- `P:` recognize flag/inconsistent indications→cover/ignore failed instruments→level using reliable instruments→power/trim→advise ATC→request vectors/no-gyro or suitable approach→reduce workload.\n- Cross-check turn instrument, compass, ASI, ALT, VSI, GPS track if approved/reliable.\n- `T:` slow-failing gyro can look plausible. Confirm with multiple instruments."},{"id":"12-31","card":"12","h":"No-gyro vectors","a":"no-gyro-vectors","c":["agk-gyro","ifr-emerg"],"p":["IR"],"md":"- ATC may instruct “start turn/stop turn”; use standard-rate turns unless otherwise instructed, half-standard on final if directed/appropriate.\n- `P:` acknowledge→stabilize altitude/speed→turn on command→stop promptly→monitor compass/turn instrument.\n- `T:` no-gyro vector does not replace terrain/altitude responsibility outside ATC protection."},{"id":"12-32","card":"12","h":"Pitot/static failure","a":"pitotstatic-failure","c":["agk-pitot","emg-sys","ifr-emerg"],"p":["IR"],"md":"- Pitot blocked + drain open: ASI→zero. Pitot+drain blocked: ASI altitude-like. Static blocked: ALT freezes; VSI zero; ASI errors with altitude changes.\n- `P:` pitot heat→alternate static per POH→use attitude/power/GPS/known settings→advise ATC→land.\n- `T:` alternate static may change indications; know aircraft correction."},{"id":"12-33","card":"12","h":"Electrical failure","a":"electrical-failure","c":["agk-elec","emg-sys","ifr-emerg"],"p":["IR"],"md":"- `P:` confirm alternator/gen failure→reset only per POH→shed load→estimate battery endurance→preserve comm/nav/gear/flaps→declare/divert/land before total loss.\n- Turn off nonessential lights/heaters/chargers; plan manual gear/flap or handheld backup if applicable.\n- `T:` low-voltage light is time-critical in IMC/night."},{"id":"12-34","card":"12","h":"Autopilot / trim runaway","a":"autopilot--trim-runaway","c":["emg-sys","ifr-emerg"],"p":["IR"],"md":"- `P:` disconnect→override/control→pull appropriate breaker/switch per POH→retrim manually→advise ATC/request lower workload.\n- `T:` autopilot masks developing attitude/trim problem until disconnect. Keep hand near disconnect during approach."},{"id":"12-35","card":"12","h":"Unusual attitude — nose high","a":"unusual-attitude--nose-high","c":["emg-ua"],"p":["IR"],"md":"- `P:` recognize reliable instruments→power as required/reduce if near stall? aircraft-specific→lower pitch/AoA→level wings→recover to assigned attitude/altitude smoothly.\n- Generic training memory: add power as appropriate, lower nose, level wings; avoid stall/yaw.\n- `T:` exact sequence varies with aircraft/attitude; POH/instructor method wins."},{"id":"12-36","card":"12","h":"Unusual attitude — nose low","a":"unusual-attitude--nose-low","c":["emg-ua"],"p":["IR"],"md":"- `P:` power idle/reduce→level wings→ease out→avoid overspeed/excess g→re-establish power/trim.\n- `T:` pulling before levelling increases load factor/spiral."},{"id":"12-37","card":"12","h":"Icing encounter","a":"icing-encounter","c":["met-icing","ifr-emerg"],"p":["IR"],"md":"- `P:` exit immediately: turn/climb/descend toward known non-icing→pitot/static/prop/windshield/boots/heat per POH→advise ATC→increase speed/config margins per POH→plan nearest suitable landing.\n- Avoid flap/config changes that create tailplane/handling risk unless POH directs.\n- `T:` non-approved aircraft: “trace” is already an escape event, not a monitoring plan."},{"id":"12-38","card":"12","h":"Convective / severe turbulence","a":"convective--severe-turbulence","c":["met-ts","ifr-emerg"],"p":["IR"],"md":"- `P:` avoid; ask deviation early. If inadvertent: turbulence penetration speed/attitude per POH, autopilot off if required, accept altitude variation, do not chase, exit shortest safe route.\n- `T:` onboard weather shows history/attenuation; never use it to thread cells."},{"id":"12-39","card":"12","h":"Engine abnormal in IMC","a":"engine-abnormal-in-imc","c":["emg-engine","ifr-emerg"],"p":["IR"],"md":"- `P:` control/attitude→power/config→identify issue→checklist→declare→nearest suitable approach/landing.\n- Single engine aircraft: maintain glide/partial-power option; avoid descending below terrain escape altitude prematurely.\n- Multi-engine: maintain `Vyse`/control, clean/identify/verify/feather per aircraft; OEI missed may be impossible.\n- `T:` troubleshooting fixation + IMC = spatial disorientation/CFIT."},{"id":"12-40","card":"12","h":"ATC workload tools","a":"atc-workload-tools","c":["law-atc","agk-hf"],"p":["IR"],"md":"- Use: “unable,” “stand by,” “request vectors,” “request lower,” “request block altitude,” “minimum fuel,” `PAN PAN`, `MAYDAY`.\n- Declare early when safety margin reduced; state equipment failure, capability, fuel, souls, intentions.\n- `T:` ATC cannot help with a problem you hide."},{"id":"12-41","card":"12","h":"Final approach callouts — single pilot","a":"final-approach-callouts--single-pilot","c":["agk-hf","ifr-app-fly"],"p":["IR"],"md":"- `P:` altitude/fix→source/mode→course alive→glidepath alive→FAF→gear/config→minimums approaching→minimums/MAP→land or missed.\n- Speak next action: “At minimums: required visual reference or missed.”\n- `T:` silence under high workload permits mode/altitude errors."},{"id":"12-42","card":"12","h":"Post-landing","a":"post-landing","c":["ifr"],"p":["IR"],"md":"- `P:` clear runway fully→stop/after-landing flow→ground clearance→close flight plan if required→record defects/fuel/approach issues.\n- `T:` do not reconfigure heads-down while still on runway."},{"id":"12-43","card":"12","h":"Pebble","a":"pebble","c":["ifr","study-pebble"],"p":["IR"],"md":"- preflight `legal-equipped-current-fuel-performance-options` | clearance `CRAFT+` | dep brief `RWY-PATH-ALT-FREQ-GRAD-THREATS-FAIL` | gate source/course/alt/freq/squawk | hold `F-D-C-L-A-E` | approach `PROC-NAV-ALT-MIN-MAP-MISSED-RWY-THREATS` | before FAF source-mode-alt-min-missed | stable guide `1000 IMC/500 VMC` | NPA CDFA but never below MDA | missed `POWER-ATT-CONFIG-TRACK-NAV-TALK` | lost comm `7600 + AVEF + highest AME` | partial panel reliable instruments + ATC help | icing exit now | unable early."},{"id":"12-44","card":"12","h":"Sources & review status","a":"sources--review-status","c":["study-src"],"p":["IR"],"md":"See the [separate review record](../CONTENT_REVIEW.md#historical-source-review-notes) for source editions, check dates and earlier validation notes."},{"id":"13-0","card":"13","h":"Overview","a":null,"c":["study-src"],"p":["ME"],"md":"`SEPTEMBER CPAER REVIEW: retained reference, not freshly revalidated` | use exact aircraft/current operational sources\n`R` rule | `F` formula | `P` procedure | `T` trap | `M` memory | `!` safety | `?` verify | Canada ME rating\n`RELEASE:` `EXAM/STUDY-REF / AIRCRAFT-DEPENDENT` | `CANONICAL SOURCE:` `multi_engine_knowledge_core_av_cave_v0_1.md` | `NOT FLIGHT AUTHORITY`"},{"id":"13-1","card":"13","h":"Source / rating frame","a":"source--rating-frame","c":["me","study-src"],"p":["ME"],"md":"- `SRC:` CAR/STD 421.38 = rating skill requirement; TP 219E = TC flight-test guide; POH/AFM/SOP wins aircraft-specific speeds/procedures.\n- Canada ME class rating: applicant completes flight test as PIC of multi-engine class aeroplane per Standard 428 Schedule 7.\n- `T:` ME rating ≠ Group 1 IFR. ME class lets you fly multi-engine class aeroplanes VFR/IFR only if licence/rating/equipment/recency/ops rules allow."},{"id":"13-2","card":"13","h":"Essential speeds to know cold","a":"essential-speeds-to-know-cold","c":["agk-vspeeds","me-oei"],"p":["ME"],"md":"| Symbol | Meaning |\n|---|---|\n| `Vmc` | min control speed airborne, critical engine failed |\n| `Vsse` | safe intentional OEI speed; if POH none, TC guide says use `Vmc+10` |\n| `Vyse` | OEI best rate-of-climb speed, blue line |\n| `Vxse` | OEI best angle-of-climb speed |\n| `Vs0` | stall speed landing config |\n| `Va` | manoeuvring speed |\n| `Vle` | max gear extended |\n| `Vlo` | max gear operating |\n| `Vfe` | max flap extended |\n\n- `T:` quote aircraft numbers from memory for test; all other performance from POH/AFM charts."},{"id":"13-3","card":"13","h":"Core ME physics","a":"core-me-physics","c":["me-vmc"],"p":["ME"],"md":"- Two engines = thrust + yaw + roll problem after failure, not “half a single-engine airplane.”\n- Failed engine side: thrust↓ + drag↑. Operating engine creates yaw toward failed engine.\n- `T:` asymmetry increases with power on live engine, low speed, high AoA, aft CG, low weight, windmilling prop, gear/flaps drag.\n- `M:` CONTROL before CHECKLIST; drag reduction before diagnosis obsession."},{"id":"13-4","card":"13","h":"Critical engine","a":"critical-engine","c":["me-vmc"],"p":["ME"],"md":"- Critical engine = engine whose failure most adversely affects performance/handling.\n- Conventional clockwise props viewed from cockpit: left engine often critical.\n- Why: `P-factor` + accelerated slipstream + spiraling slipstream + torque effects usually make left-engine failure worse.\n- `M:` left failed = right engine thrust line farther from CG ⇒ larger yaw arm.\n- `T:` counter-rotating twins may have no “more critical” engine; aircraft-specific."},{"id":"13-5","card":"13","h":"Vmc definition / certification memory","a":"vmc-definition--certification-memory","c":["me-vmc"],"p":["ME"],"md":"- `Vmc:` minimum flight speed where straight flight/control possible after sudden critical-engine failure with max rudder and ≤`5°` bank.\n- TC guide conditions: max rated power on engines at failure, min practical test weight, rearmost CG, gear retracted, flaps takeoff, failed critical prop windmilling.\n- Below `Vmc`: yaw/roll toward failed engine; regain by reducing live-engine power, increasing airspeed by lowering pitch, or both.\n- `T:` `Vmc` is a control speed, not a climb speed. Above Vmc does not mean climb possible."},{"id":"13-6","card":"13","h":"Vmc factors","a":"vmc-factors","c":["me-vmc"],"p":["ME"],"md":"| Factor | Vmc effect |\n|---|---|\n| live engine power ↑ | `Vmc ↑` |\n| density altitude ↑ / power ↓ | `Vmc ↓` but performance worse |\n| aft CG | `Vmc ↑` |\n| lower weight | `Vmc ↑` |\n| gear/flap down | often `Vmc ↓` due drag/stability, but performance worse |\n| windmilling failed prop | yaw/drag ↑, performance worse |\n| bank into live engine | `Vmc ↓`, performance ↑ |\n\n- `T:` high DA may lower Vmc but makes OEI climb worse. “control easier” while performance gone."},{"id":"13-7","card":"13","h":"Zero sideslip / best OEI performance","a":"zero-sideslip--best-oei-performance","c":["me-vmc"],"p":["ME"],"md":"- Best OEI performance usually: slight bank toward operating engine + ball slightly displaced toward live engine / aircraft-specific.\n- Common memory: `2–5°` bank toward good engine, rudder to stop yaw, trim.\n- `M:` bank into good engine reduces rudder drag; level wings often requires lots of rudder and creates sideslip/drag.\n- `T:` centre the ball blindly? not always best; use POH/AFM and instructor method."},{"id":"13-8","card":"13","h":"Dead foot / dead engine","a":"dead-foot--dead-engine","c":["me-vmc","me-fail"],"p":["ME"],"md":"- Failure recognition: yaw/roll/noise/power instruments.\n- `M:` dead foot = dead engine. Foot not pressing = failed side.\n- Identify: mixture/prop/throttle or power lever suspected engine. Verify: reduce suspected throttle/power; no change confirms failed engine. Then feather/shutdown per checklist.\n- `T:` never feather until verified. Wrong feather can make a bad day unrecoverable."},{"id":"13-9","card":"13","h":"Engine failure flow — generic","a":"engine-failure-flow--generic","c":["emg-engine","me-fail"],"p":["ME"],"md":"- `P:` MAINTAIN CONTROL → POWER AS REQ → PITCH `Vyse/Vxse` → GEAR/FLAPS UP as appropriate → IDENTIFY → VERIFY → FEATHER → SECURE → CHECKLIST → PLAN.\n- `M:` Control–Config–Identify–Verify–Feather–Secure–Checklist.\n- `T:` in critical phase, memory items first; full checklist only after control and drag clean-up.\n- `T:` do not rush feather below safe altitude if procedure/aircraft/training says simulate only."},{"id":"13-10","card":"13","h":"Drag hierarchy","a":"drag-hierarchy","c":["me-vmc"],"p":["ME"],"md":"- Worst drag: windmilling prop. Then gear, flaps, cowl flaps, sideslip, excessive bank/trim.\n- `M:` clean + feather + blue line.\n- `P:` gear up after positive climb/no runway; flaps up in stages as POH; prop feather after verify; cowl flaps as required.\n- `T:` unfeathered failed prop can erase climb performance."},{"id":"13-11","card":"13","h":"OEI climb","a":"oei-climb","c":["agk-perfcalc","me-oei"],"p":["ME"],"md":"- `Vyse` = best rate; `Vxse` = best angle. Use obstacle vs rate logic.\n- `T:` positive climb may be zero or negative depending weight/DA/config/failed engine/prop/surface.\n- POH required: OEI ROC, single-engine service ceiling, accelerate-stop/go if available, climb gradients.\n- `M:` ME safety comes from precomputed options, not heroic rudder."},{"id":"13-12","card":"13","h":"Accelerate-stop / accelerate-go","a":"accelerate-stop--accelerate-go","c":["agk-perfcalc","me-oei"],"p":["ME"],"md":"- Accelerate-stop = accelerate to decision/engine-failure speed, reject, stop.\n- Accelerate-go = accelerate to failure speed, continue takeoff, climb/clear obstacle OEI.\n- Light twins often have long or unavailable accelerate-go margins at normal training weights/DA.\n- `T:` balanced field/V1 thinking from transport category does not automatically apply to light twins.\n- `P pre-TKOF brief:` below reject speed/runway remaining → stop; after liftoff/gear up/no runway → control, clean, climb if able, land ahead/nearby if not."},{"id":"13-13","card":"13","h":"TKOF speeds · transport-category distinctions — L4","a":"tkof-speeds--transport-category-distinctions--l4","c":["agk-vspeeds","me-oei"],"p":["CPL","ME"],"md":"| Key | Recall |\n|---|---|\n| `V1` | Reject/continue boundary; first reject action **by V1** to satisfy applicable accelerate-stop limits. |\n| `VR` | Rotation speed → initiate nose-up rotation. |\n| `V2` | TKOF safety speed → **OEI = One Engine Inoperative** climb/control margins; **≠ braking speed**. |\n| `Vtire` | Maximum certificated **tire groundspeed** during TKOF roll; may limit max TKOF GW. |\n| `T` | V1 depends on GW/ENG accel, RWY, wind, conditions/config; transport-category V1/V2 concepts **not automatically applicable to light twins**; AFM/POH wins. |\n\n- `SRC:` [FAA AFH Ch 16 · takeoff speeds/accelerate-stop](https://www.faa.gov/sites/faa.gov/files/regulations_policies/handbooks_manuals/aviation/airplane_handbook/17_afh_ch16.pdf).\n- `M · L4` **V1=reject/continue (accelerate-stop) | VR=rotate | V2=OEI safety/climb | Vtire=max tire GS | GW/RWY/conditions affect V1 | light twin ≠ automatic transport-category V-speeds | AFM wins.**"},{"id":"13-14","card":"13","h":"Takeoff briefing — ME","a":"takeoff-briefing--me","c":["me-oei"],"p":["ME"],"md":"- `P:` runway/length/wind/DA/perf → rotate speed → `Vmc/Vyse/Vsse` → reject criteria → EF before liftoff → EF after liftoff with runway → EF airborne no runway → emergency return/straight-ahead plan.\n- `M:` before power: “what kills us today?” runway, weight, DA, obstacles, weather, traffic.\n- `T:` “continue no matter what” is wrong; “stop no matter what” is also wrong. runway remaining + energy + control decide."},{"id":"13-15","card":"13","h":"Engine failure on takeoff / overshoot","a":"engine-failure-on-takeoff--overshoot","c":["emg-engine","me-fail"],"p":["ME"],"md":"- `P:` recognize → control → power/config/drag in proper order → identify/verify → bank good engine → maintain heading ± practical → positive climb if capable → `Vxse` obstacle or `Vyse` rate → trim.\n- TC test tolerances: heading control within about `±20°`; speed `Vxse/Vyse +10/-5` for overshoot scenario.\n- `T:` gear/flap movement during power change is high workload; control first.\n- `T:` OEI go-around may not climb. If not climbing, land under control."},{"id":"13-16","card":"13","h":"Engine failure in cruise","a":"engine-failure-in-cruise","c":["emg-engine","me-fail"],"p":["ME"],"md":"- `P:` control → maintain heading/alt if capable → set power/config → identify/verify → cause checks → feather/secure if no restart → trim → evaluate restart/divert.\n- Turns OEI: bank not >`30°` in TC test context; use appropriate pitch/bank/trim.\n- `T:` trying to hold altitude below OEI capability causes speed decay to Vmc/stall. Descend if required."},{"id":"13-17","card":"13","h":"Precautionary shutdown","a":"precautionary-shutdown","c":["emg-engine","me-fail"],"p":["ME"],"md":"- Reasons: oil pressure loss, severe vibration, fire risk, runaway prop, uncontrollable temps/pressures.\n- `P:` confirm need → stabilize → identify/verify affected engine → reduce power → feather/secure per checklist → monitor live engine → divert/land.\n- `T:` not every roughness = immediate shutdown; not every problem can wait. Decide by fire/mechanical damage/controllability."},{"id":"13-18","card":"13","h":"PROP governor / feather — L4 cross-ref","a":"prop-governor--feather--l4-cross-ref","c":["agk-prop","me-fail"],"p":["ME"],"md":"- `M` Typical **piston SE CS non-feather**: governor oil P↑→COARSE/pitch↑→RPM↓ | **piston ME CS full-feather**: oil P↑→FINE/pitch↓→RPM↑; oil P↓→counterweights/springs→FEATHER; **architecture varies**.\n- `T` FINE low blade angle ≠ low RPM: low angle→RPM tendency↑ | COARSE high angle→RPM tendency↓ | FEATHER near airflow→drag↓; REVERSE negative thrust (ground only if approved).\n- `!` OEI: windmilling low-pitch PROP→drag↑/climb↓ | **IDENTIFY→VERIFY→FEATHER** per POH; feather locks, unfeather pumps, accumulators ACFT-specific.\n- `SRC:` [FAA AFH · ME propeller](https://www.faasafety.gov/files/events/SO/SO15/2022/SO15118118/TransitionToMultiengineAirplanes.pdf) | [08 Aircraft Systems · Powerplant / PROP](08_aircraft_systems_failures_qrc_av_cave_v0_2_compact.md)."},{"id":"13-19","card":"13","h":"Restart / unfeather","a":"restart--unfeather","c":["agk-prop","me-fail"],"p":["ME"],"md":"- `P:` assess altitude/time/fire/damage/prop status/fuel/electrical. If feasible: restart checklist; if not: leave secured and land.\n- `T:` restarting a damaged/fire engine can make problem worse. checklist and scenario drive."},{"id":"13-20","card":"13","h":"OEI approach / landing","a":"oei-approach--landing","c":["me-fail"],"p":["ME"],"md":"- `P:` brief long final, avoid rushed configuration, maintain `Vyse` or POH speed until landing assured, configure late/controlled, anticipate asymmetric power.\n- Gear/flap only when landing assured unless procedure says otherwise. Power changes gradual; trim cautiously.\n- `T:` full flap/gear early can remove climb escape. OEI go-around may be unavailable.\n- `M:` stable > pretty. no salvage below minima/unstable."},{"id":"13-21","card":"13","h":"OEI missed / go-around","a":"oei-missed--go-around","c":["ifr-missed","me-fail"],"p":["ME"],"md":"- `P:` max allowable power live engine → control yaw/bank → pitch `Vyse/Vxse` → drag up in sequence → verify failed engine secure/feathered → trim.\n- `T:` if unable climb, lower nose and land ahead/within available area. Do not pull below `Vyse` toward `Vmc`.\n- `T:` high power + low speed + dirty config = Vmc trap."},{"id":"13-22","card":"13","h":"Vmc demo / reduced-speed training","a":"vmc-demo--reduced-speed-training","c":["me-vmc","me-train"],"p":["ME"],"md":"- Setup per POH/instructor/test guide; safe altitude; clearing; no real hazard; recover at first sign of loss of directional control/stall buffet/warning or prebriefed minimum.\n- Recovery: reduce live-engine power enough to regain control + lower pitch/increase speed + wings/bank controlled.\n- `T:` wrong instinct = add power/pull. Correct = reduce asymmetric thrust and increase airspeed.\n- `T:` Vmc demo is not a macho manoeuvre; it is recognition and immediate recovery."},{"id":"13-23","card":"13","h":"Stall / slow flight ME","a":"stall--slow-flight-me","c":["agk-stall","me-train"],"p":["ME"],"md":"- Slow flight near Vmc/VS margins with asymmetry is dangerous. Maintain coordination, power awareness, safe altitude.\n- Stall recovery: reduce AoA, manage asymmetry, power as appropriate, avoid yaw.\n- `T:` power-on stall with one engine/thrust asymmetry can roll/yaw aggressively."},{"id":"13-24","card":"13","h":"Systems focus for ME","a":"systems-focus-for-me","c":["agk-systems","me-train"],"p":["ME"],"md":"- Prop governors/feathering/unfeathering: oil pressure, accumulators/unfeather pumps depending aircraft.\n- Fuel: selectors/crossfeed/aux pumps/boost pumps; know which positions are allowed for takeoff/landing.\n- Electrical: two alternators? bus logic? battery endurance? gear/flap dependence?\n- Vacuum/pressure: source from one/both engines? failure effect after engine shutdown?\n- Hydraulics/gear: extension/retraction speed, emergency extension, gear warning.\n- `T:` engine shutdown may remove systems powered by that engine."},{"id":"13-25","card":"13","h":"Performance calculations required","a":"performance-calculations-required","c":["agk-perfcalc","me-oei"],"p":["ME"],"md":"- Takeoff distance / obstacle. Accelerate-stop if available. Accelerate-go if available. Time/fuel to climb. Cruise power/KTAS/fuel. Landing distance. OEI ROC. OEI enroute performance.\n- `T:` use actual weight, temp, pressure altitude, runway, wind, obstacle, configuration. Training “it climbs” assumption is unsafe.\n- `M:` compare before flight: all-engine climb, OEI climb, terrain/obstacle, nearest runway/return."},{"id":"13-26","card":"13","h":"W&B ME traps","a":"wb-me-traps","c":["agk-wb","me-oei","study-traps"],"p":["ME"],"md":"- Multi-engine aircraft often have narrow CG/fuel/baggage constraints. Check takeoff, landing, zero-fuel if relevant.\n- Aft CG worsens Vmc/control. Light weight can worsen Vmc but improves climb; heavy weight may improve Vmc but destroy climb.\n- `T:` Vmc certification worst case is light/aft; performance worst case is heavy/hot/high/dirty."},{"id":"13-27","card":"13","h":"Flight test mindset","a":"flight-test-mindset","c":["me-train","study-traps"],"p":["ME"],"md":"- TC test wants PIC-level control, memory vital actions, checklist discipline, POH knowledge, and decision-making.\n- Essential speeds from memory. Charts and performance from approved data.\n- `T:` examiner is testing whether you know when not to continue as much as whether you can keep it flying."},{"id":"13-28","card":"13","h":"Memory atoms","a":"memory-atoms","c":["me","study-pebble"],"p":["ME"],"md":"- `dead foot = dead engine`\n- `identify before verify; verify before feather`\n- `blue line = best OEI rate`\n- `red line = Vmc; below red line reduce power/lower nose`\n- `clean + feather + blue line`\n- `bank toward good engine`\n- `control first, checklist second`\n- `above Vmc ≠ climb`\n- `single-engine service ceiling may be below terrain`\n- `live engine can kill you if you cannot control it`"},{"id":"13-29","card":"13","h":"Pebble","a":"pebble","c":["me","study-pebble"],"p":["ME"],"md":"- TKOF `V1=reject/continue; accelerate-stop | VR=rotate | V2=OEI (One Engine Inoperative) safety/climb | Vtire=max tire GS | GW/RWY/conditions affect V1 | light twins≠automatic transport-category V-speeds | AFM wins`\n- PROP `typical piston SE oil→coarse/RPM↓ vs ME oil→fine/RPM↑; ME oil loss→feather | fine RPM tendency↑, coarse RPM tendency↓ | windmill drag↑; feather drag↓ | verify before feather; POH wins`\n- ME rating = skill flight test | ME≠Group1 IFR | Vmc control not climb | Vsse = Vmc+10 if POH none | Vyse blue line | critical engine worst handling/perf | Vmc worst: max pwr/light/aft/gear up/takeoff flap/windmilling | below Vmc: reduce live power + lower nose | zero sideslip = bank good engine | dead foot dead engine | identify-verify-feather | clean-feather-blue | OEI climb maybe negative | accelerate-stop/go prebrief | OEI go-around may not climb | POH speeds/procedures win."},{"id":"17-0","card":"17","h":"Overview","a":null,"c":["study-src"],"p":["CPL","IR"],"md":"[Dense CAVE HTML reader](https://jraph.github.io/aero-cave/readers/17_Pilot_Qualifications_Operator_Checks_EN_FR.html) · [Card 04 — authoritative air-law context](04_canadian_air_law_core_av_cave_v0_2_compact.md) · [Index](../README.md)\n\n**R · 2026-10-24:** CARs live consolidation current to 2026-09-30, last amended 2026-06-17; TC Standard 421 and TC AIM 2026-2. **CAVE quick-recall companion, not a flight authority.** / **R · 24-10-2026 :** RAC consolidé au 30-09-2026, dernière modification 17-06-2026; norme 421 et AIM 2026-2. **Aide-mémoire, non autorité opérationnelle.**\n\n**LEGEND / LÉGENDE:** PIC = pilot-in-command / commandant de bord (CDB); SIC = second-in-command / copilote; PPC = pilot proficiency check / contrôle de la compétence du pilote; CC / VC = competency check / vérification de compétence; SE = single engine / monomoteur; ME = multi-engine / multimoteur; HP = high performance / hautes performances; IR = instrument rating / qualification IFR; TT = total time / heures totales. Validity in months (mo) / validité en mois."},{"id":"17-1","card":"17","h":"OPERATE → SEAT → CHECK / EXPLOITER → SIÈGE → CONTRÔLE","a":"operate--seat--check--exploiter--siège--contrôle","c":["law-type","law-commercial"],"p":["CPL","IR"],"md":"| CAR / Opération | Aircraft applicability · Aéronefs (kg/lb · pax) | Examples · Exemples | PIC / SIC | Licence | Class / Rating · Classe / Qualif. | PPC / CC · PPC / VC | Validity / Validité | Ground / Sol | Condition / Précision | CAR |\n|---|---|---|---|---|---|---|---|---|---|---|\n| 604 · Private / Privé | **ANY ONE (604.02):** large aeroplane >5,700 kg (>12,566 lb); turbine-powered; pressurized; OR multi-engine. / **UN SEUL SUFFIT (604.02) :** gros avion >5 700 kg (>12 566 lb); turbine; pressurisé; OU multimoteur. | PA-30 (ME); PA-46 Malibu (press.); C208 (turbine); Citation CJ3 (jet); Challenger 350 (large) / PA-30 (multi.); PA-46 Malibu (press.); C208 (turbine); Citation CJ3 (réacteur); Challenger 350 (gros) | PIC | Part IV · PPL+ | Class/type; IR if IFR / Classe/type; qualif. IFR si IFR | CC or accepted PPC / VC ou PPC reconnu | CC 24 mo* | 12 mo / some 36 | Private operation; 604.140 equivalencies / Exploitation privée; équivalences 604.140 | 604.143 |\n| 604 · Private / Privé | **ANY ONE (604.02):** large aeroplane >5,700 kg (>12,566 lb); turbine-powered; pressurized; OR multi-engine. / **UN SEUL SUFFIT (604.02) :** gros avion >5 700 kg (>12 566 lb); turbine; pressurisé; OU multimoteur. | PA-30 (ME); PA-46 Malibu (press.); C208 (turbine); Citation CJ3 (jet); Challenger 350 (large) / PA-30 (multi.); PA-46 Malibu (press.); C208 (turbine); Citation CJ3 (réacteur); Challenger 350 (gros) | SIC | Part IV · appropriate | Class/type; IR if required / Classe/type; IFR si exigé | CC or accepted PPC / VC ou PPC reconnu | CC 24 mo* | 12 mo / some 36 | Same-type check, differences training / Vérif. du même type, formation aux différences | 604.143 |\n| 702 · Aerial work / Travail aérien | Aeroplane/helicopter performing qualifying aerial work; no general weight/seat cap; sightseeing excluded (§702.01). / Avion/hélico en travail aérien admissible; aucune limite générale de masse/sièges; excursions aériennes exclues (§702.01). | Air Tractor AT-502B (spraying); C172 (survey/photo) / Air Tractor AT-502B (épandage); C172 (photo/relevés) | PIC/SIC | Part IV · commercial as required | Class/type + IR if IFR / Classe/type + qualif. IFR si IFR | CC or PPC (routine); PPC for IFR with non-crew aboard / VC ou PPC (courant); PPC pour IFR avec non-équipage | CC 12 / PPC 24 mo | 12 mo | Chief-pilot CC/PPC exemption does not waive IFR PPC / Exemption du chef pilote sans dispense du PPC IFR | 702.65 |\n| 703 · Air taxi SE / Taxi aérien mono | SE aircraft: no general MCTOW/seat threshold in §703.01(a). / Monomoteur : aucun seuil général de MMHD/sièges au §703.01a). | C206 Stationair; C208 Caravan; Pilatus PC-12 / C206 Stationair; C208 Caravan; Pilatus PC-12 | PIC | CPL+ | SE; IR if IFR/night VFR with pax / Mono; IFR si IFR/VFR nuit avec pax | CC normally; PPC if operated under 703.22(2) / VC normalement; PPC si 703.22(2) | 12 mo | 12 mo | 5 h in PIC position on type/basic model before pax; reduction permitted / 5 h en position CDB sur type/modèle avant pax; réduction possible | 703.88 |\n| 703 · Air taxi ME / Taxi aérien multi | ME aircraft other than turbojet aeroplane: MCTOW ≤8,618 kg (19,000 lb), ≤9 pax seats (pilot seats excluded). / Multimoteur sauf avion à turboréacteurs : MMHD ≤8 618 kg (19 000 lb), ≤9 sièges pax (hors pilotes). | Piper PA-31 Navajo; King Air C90/B200 / Piper PA-31 Navajo; King Air C90/B200 | PIC | CPL or ATPL† | ME; Group 1 IR if IFR; type if required / Multimoteur; IFR G1 si IFR; type si requis | PPC mandatory / PPC obligatoire | 12 mo | 12 mo | 15 h in PIC position on type/basic model before pax; 50% max reduction / 15 h en position CDB sur type/modèle avant pax; réduction max. 50 % | 703.88 |\n| 703 · Air taxi ME / Taxi aérien multi | ME aircraft other than turbojet aeroplane: MCTOW ≤8,618 kg (19,000 lb), ≤9 pax seats (pilot seats excluded). / Multimoteur sauf avion à turboréacteurs : MMHD ≤8 618 kg (19 000 lb), ≤9 sièges pax (hors pilotes). | Piper PA-31 Navajo; King Air C90/B200 / Piper PA-31 Navajo; King Air C90/B200 | SIC | CPL+ | ME; Group 1 IR if required; type if required / Multimoteur; IFR G1 si requis; type si requis | PPC or CC / PPC ou VC | 12 mo | 12 mo | SIC option does not replace PIC PPC / Option copilote ≠ PPC du CDB | 703.88 |\n| 704 · Commuter / Navette | ME aeroplane: MCTOW ≤8,618 kg (19,000 lb), 10–19 pax seats. Turbojet: MZFW ≤22,680 kg (50,000 lb), type certificate ≤19 pax. / Avion multimoteur : MMHD ≤8 618 kg (19 000 lb), 10–19 sièges pax. Turboréacteur : masse maxi sans carburant ≤22 680 kg (50 000 lb), type ≤19 pax. | DHC-6 Twin Otter (19 seats); Beech 1900D (19) / DHC-6 Twin Otter (19 sièges); Beech 1900D (19) | PIC | CPL or ATPL† | Class/IR/type as required / Classe/IFR/type selon le cas | PPC / PPC | 12 mo | 12 mo | PIC ≥500 h VFR; ≥1,200 h IFR carrying pax / CDB ≥500 h VFR; ≥1 200 h IFR avec pax | 704.108 |\n| 704 · Commuter / Navette | ME aeroplane: MCTOW ≤8,618 kg (19,000 lb), 10–19 pax seats. Turbojet: MZFW ≤22,680 kg (50,000 lb), type certificate ≤19 pax. / Avion multimoteur : MMHD ≤8 618 kg (19 000 lb), 10–19 sièges pax. Turboréacteur : masse maxi sans carburant ≤22 680 kg (50 000 lb), type ≤19 pax. | DHC-6 Twin Otter (19 seats); Beech 1900D (19) / DHC-6 Twin Otter (19 sièges); Beech 1900D (19) | SIC | CPL+ | Class/IR/type as required / Classe/IFR/type selon le cas | PPC / PPC | 12 mo | 12 mo | 3 T/O + landings within previous 90 days / 3 décollages + atterrissages sur 90 jours | 704.108 |\n| 705 · Airline / Transport aérien | Aeroplane: MCTOW >8,618 kg (>19,000 lb) OR type certificate ≥20 pax; except 704-authorized aeroplanes. / Avion : MMHD >8 618 kg (>19 000 lb) OU certificat de type ≥20 pax; sauf avions autorisés 704. | ATR 42; ATR 72; Dash 8 Q400; A220; B737 / ATR 42; ATR 72; Dash 8 Q400; A220; B737 | PIC | ATPL | Group 1 IR + individual type / IFR groupe 1 + type individuel | PPC / PPC | 6 mo‡ | 12 mo + 6 mo‡ | Line check 12 mo; approved AQP/recurrent alternatives / Contrôle en ligne 12 mois; options approuvées AQP/périodiques | 705.106 |\n| 705 · Airline / Transport aérien | Aeroplane: MCTOW >8,618 kg (>19,000 lb) OR type certificate ≥20 pax; except 704-authorized aeroplanes. / Avion : MMHD >8 618 kg (>19 000 lb) OU certificat de type ≥20 pax; sauf avions autorisés 704. | ATR 42; ATR 72; Dash 8 Q400; A220; B737 / ATR 42; ATR 72; Dash 8 Q400; A220; B737 | SIC | CPL/ATPL§ | Group 1 IR + individual type / IFR groupe 1 + type individuel | PPC / PPC | 6 mo‡ | 12 mo + 6 mo‡ | 90-day flight/sector currency; initial line qualification / Récence 90 jours des vols/secteurs; qualification en ligne | 705.106 |\n\n\\* Under 604, the 24-mo figure describes its CC/check regime; an accepted Part VII PPC remains subject to the equivalency/validity conditions in 604.140. **†** CPL PIC only if the aeroplane is certificated for one pilot; commercial PIC on a two-crew aeroplane requires ATPL. **‡** 705 PPC 6 mo by default; approved six-month recurrent substitution may permit 12 mo, or approved AQP. **§** Additional MPL pathway exists for 705 SIC. All PIC/SIC assignments require the correct Part IV privileges, approved training, recency and operator authorization. / *L'équivalence 604 ne prolonge pas automatiquement la validité d'un PPC externe; † CDB commercial avion à deux pilotes : ATPL; ‡ autre programme périodique/AQP approuvé possible; § voie MPL possible pour copilote 705.*\n\n**604 scope vs registration / Champ 604 et enregistrement :** §604.02 applies when **ANY ONE** of the four aircraft characteristics above is present. Separately, §604.03 generally requires a private-operator registration document to carry passengers or goods in a **large aeroplane**, a **turbojet aeroplane**, or a **turbine-powered pressurized aeroplane certificated for more than six passenger seats** (Part VII / flight-permit exceptions). A small, non-pressurized piston twin meets §604.02 solely because it is multi-engine; that fact alone does not trigger §604.03 registration. / §604.02 : **un seul** des quatre critères suffit. §604.03 : enregistrement généralement requis pour transporter passagers ou marchandises en **gros avion**, **avion à turboréacteur**, ou **avion à turbine pressurisé homologué pour plus de six sièges passagers** (exceptions partie VII / permis de vol). Un petit bimoteur à pistons non pressurisé relève du §604.02 par ses moteurs, sans que cela déclenche seul l'enregistrement §604.03.\n\n**Aircraft examples / Exemples d'avions:** Illustrations only, not assigned CAR categories: operator certificate/authorization, certified passenger seating and mission control applicability. PA-30 private multi-engine, PA-46 Malibu private pressurized piston, C208 private turbine, CJ3 private jet **or** 704 authorized turbojet; DHC-6 19-seat commuter or fewer-seat variants/other authorized operations. / Exemples indicatifs seulement : certificat d'exploitation, capacité passagers homologuée et mission prévalent; un même type peut relever de plusieurs sous-parties selon l'exploitation.\n\n**Aircraft classification / Classement des aéronefs:** MCTOW = maximum certificated takeoff weight / masse maximale homologuée au décollage (MMHD). MZFW = maximum zero fuel weight / masse maximale sans carburant. **704 turbojet uses MZFW, not MCTOW.** Seating limits exclude pilot seats except where the rule expressly uses type-certificate passenger authorization; 702 aerial work and 604 private operations are defined by purpose/equipment, not one shared seat cut-off. §604.02 applicability is broader than §604.03 registration. Ministerial 703/704/705 authorizations and helicopter-specific conditions may apply. / **704 turboréacteur : masse maxi sans carburant, non masse au décollage.**"},{"id":"17-2","card":"17","h":"703 SINGLE-PILOT IFR + PASSENGERS / IFR MONOPILOTE + PASSAGERS — STD 723.86","a":"703-single-pilot-ifr--passengers--ifr-monopilote--passagers--std-72386","c":["law-type","law-commercial"],"p":["CPL","IR"],"md":"**Authorized exception to two-pilot IFR / Dispense autorisée de copilote IFR.** In addition to 703 ME PIC **PPC 12 mo**, the PIC needs **1,000 h total**, **100 h ME if operating ME**, **50 h simulated or actual flight in IMC**, **50 h on aeroplane type**. PPC must assess single-pilot procedures including autopilot; for pressurized aeroplanes, **FL250 maximum**. These thresholds do **not** apply to every 703 flight. / En plus du **PPC CDB multimoteur 12 mois** : **1 000 h total**, **100 h multimoteur si appareil ME**, **50 h de vol en IMC réel ou simulé**, **50 h sur type**; PPC monopilote et procédures pilote automatique; avion pressurisé **FL250 max**. **Pas** un minimum universel pour tous les vols 703.\n\n**M:** `703 SP-IFR PAX = 1000 TT / 100 ME / 50 IMC / 50 TYPE + PPC`. [CASS 723.86](https://tc.canada.ca/en/corporate-services/acts-regulations/list-regulations/canadian-aviation-regulations-sor-96-433/standards/standard-723-air-taxi-aeroplanes-canadian-aviation-regulations-cars)"},{"id":"17-3","card":"17","h":"LICENCE → TYPE / LICENCE → TYPE","a":"licence--type--licence--type","c":["law-lic","law-type"],"p":["CPL","IR"],"md":"| Qualification | English | Français |\n|---|---|---|\n| PPL(A) | 17 yr; 45 h TT; PPAER ≥60%; medical Cat 1/3 | 17 ans; 45 h total; PPAER ≥60 %; médical cat. 1/3 |\n| CPL(A) | 18 yr; 200 h aeroplane; 100 PIC incl 20 XC PIC; 65 h post-PPL training (35 dual + 30 solo); CPAER ≥60%; Cat 1 | 18 ans; 200 h avion; 100 h CDB dont 20 en navigation; 65 h après PPL (35 double + 30 solo); CPAER ≥60 %; cat. 1 |\n| ATPL(A) | 21 yr; 1,500 h total; ≥900 aeroplane; ≥250 PIC/PICUS (max 100 PICUS); 100 night; 75 instrument; XC sub-minima; SAMRA + SARON + INRAT ≥70%; Group 1 IR; Cat 1 | 21 ans; 1 500 h total; ≥900 avion; ≥250 CDB/CDB sous supervision (max 100 supervisées); 100 nuit; 75 instruments; détails navigation; SAMRA + SARON + INRAT ≥70 %; IFR G1; cat. 1 |\n| ME class / Classe multimoteur | No fixed training-hour minimum; ME flight test; class rating is not an individual type rating | Pas d'heures de formation minimales fixes; test multimoteur; classe ≠ qualification de type individuelle |\n| Group 1 IR / IFR G1 | 50 h PIC cross-country + 40 h instrument (≤20 approved ground); INRAT ≥70% + flight test | 50 h nav CDB + 40 h instruments (≤20 entraîneur approuvé); INRAT ≥70 % + test en vol |\n| HP individual type / Type HP | ≥200 h aeroplane; type-specific ground/flight training; qualifying flight within 12 months | ≥200 h avion; formation sol/vol propre au type; vol de qualification dans les 12 mois |\n| Two-crew type / Type 2 pilotes | ≥250 h aeroplane (integrated-course exception); type training; IATRA ≥70% within 24 mo OR qualifying SAMRA+SARON/ATPL route; PPC/check for type | ≥250 h avion (exception cours intégré); formation type; IATRA ≥70 % dans les 24 mois OU voie SAMRA+SARON/ATPL admissible; PPC/vérif. du type |"},{"id":"17-4","card":"17","h":"RECENCY CLOCKS / HORLOGES DE RÉCENCE","a":"recency-clocks--horloges-de-récence","c":["law-recency"],"p":["CPL","IR"],"md":"| Clock / Exigence | English | Français | CAR |\n|---|---|---|---|\n| General flight / Vol général | 5 years PIC/SIC or permitted alternative | 5 ans CDB/copilote ou équivalent autorisé | 401.05(1) |\n| General recurrent / Périodique générale | 24 months: qualifying recurrent activity | 24 mois : activité périodique admissible | 401.05(2) |\n| Passengers day / Pax jour | 5 takeoffs + 5 landings in 6 months, category/class | 5 décollages + 5 atterrissages en 6 mois, catégorie/classe | 401.05(2) |\n| Passengers night / Pax nuit | 5 NIGHT takeoffs + 5 NIGHT landings in 6 months | 5 décollages NUIT + 5 atterrissages NUIT en 6 mois | 401.05(2) |\n| IR qualifying check / IFR contrôle | 24 months: flight test / IPC / qualifying PPC or CC with instrument portion | 24 mois : test / IPC / PPC ou VC admissible avec composante instruments | 401.05(3) |\n| IR approaches / IFR approches | Following first day of 7th month: 6 approaches within preceding 6 months; NO 6-h requirement | Après 1er jour du 7e mois : 6 approches sur les 6 mois précédents; PAS de règle des 6 h | 401.05(3.1) |\n| 703 / 704 crew / Équipage | 3 takeoffs + 3 landings within 90 days (with authorized alternatives) | 3 décollages + 3 atterrissages sur 90 jours (options autorisées) | 703.88 / 704.108 |\n| 705 crew / Équipage | 90 days: 3 T/O + LDG plus 1 sector, OR 5 sectors, OR qualifying training | 90 jours : 3 décollages/atterrissages + 1 secteur, OU 5 secteurs, OU formation admissible | 705.106 |\n| Cat 1 commercial / Médical cat. 1 | 12 months; 6 if age ≥40 single-pilot with passengers or age ≥60 | 12 mois; 6 si ≥40 ans monopilote avec passagers ou ≥60 ans | 404.04 |"},{"id":"17-5","card":"17","h":"EXAM TRAPS / PIÈGES D'EXAMEN","a":"exam-traps--pièges-dexamen","c":["law-type","study-pebble","study-traps"],"p":["CPL","IR"],"md":"| Trap / Piège | English | Français |\n|---|---|---|\n| Licence ≠ operator check ≠ type | Holding CPL/ME/IR does not itself authorize Part VII PIC; PPC/CC, training and operational eligibility are separate. | CPL/multimoteur/IFR ne suffisent pas : contrôle PPC/VC, formation et exigences d'exploitation sont distincts. |\n| 604 clock vs accepted check | 604 check is normally 24 mo; an accepted external PPC/CC must still be valid under the equivalency conditions. | Contrôle 604 normalement 24 mois; PPC/VC externe reconnu doit rester valide selon l'équivalence. |\n| 703 SE special case | 703.22(2) single-engine passenger IFR/night VFR changes the PIC CC to PPC; night VFR carrying non-crew also invokes IR requirement. | Sous 703.22(2), le contrôle CDB passe de VC à PPC; VFR de nuit avec non-équipage exige aussi IFR. |\n| 702 IFR non-crew | 702 IFR with a non-flight-crew person on board requires PPC even where the general chief-pilot exception applies. | 702 IFR avec personne hors équipage de conduite : PPC malgré l'exception générale du chef pilote. |\n| ATPL and two-crew PIC | CPL can qualify for certain single-pilot aeroplane PIC roles; ATPL is needed as PIC of a commercial two-crew aeroplane. | CPL permet certains postes CDB sur avion monopilote; ATPL requis comme CDB commercial d'un avion à deux pilotes. |\n| PPC vs IR currency | A qualifying PPC can satisfy CAR 401.05(3) only if it includes required instrument procedures; check separate approach recency. | Un PPC admissible satisfait 401.05(3) uniquement avec procédures IFR requises; récence des approches distincte. |\n\n**M · PEBBLE:** `PPL45 → CPL200 → ATPL1500 | IR 50 XC PIC / 40 inst | HP type200 / 2crew type250 + IATRA/SAMRA-SARON | 604 CC24 / ground12 | 702 CC12 or PPC24 (IFR + non-crew PPC) | 703 SE PIC CC12*; ME PIC PPC12; ME SIC PPC/CC12 | 704 PPC12 | 705 PPC6 (exceptions) | general 5y/24m/6m | IFR 24m + 6 approaches/6m after month6`."},{"id":"17-6","card":"17","h":"SOURCES / SOURCES","a":"sources--sources","c":["study-src"],"p":["CPL","IR"],"md":"- [Air Tractor AT-502B agricultural aircraft](https://airtractor.com/aircraft/)\n- [De Havilland Twin Otter 19-seat specifications](https://dehavilland.com/twin-otter/)\n- [Textron Cessna Citation CJ3 (MZFW / occupancy)](https://cessna.txtav.com/citation/cj3-gen3)\n- [ATR 42 / ATR 72 manufacturer specification](https://www.atr-aircraft.com/regional-mobility/regional-aircraft/)\n- [Piper PA-46 Malibu POH (pressurization)](https://www.aeroelectric.com/Reference_Docs/Piper/PiperMalibu_PA46-310_SN4608008-140.pdf)\n\n- [CAR 101.01 — large aeroplane](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-101.01.html)\n- [CAR 604.02 — private scope](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.02.html)\n- [CAR 604.03 — private registration](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.03.html)\n- [CAR 702.01 — aerial work](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.01.html)\n- [CAR 703.01 — air taxi](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-703.01.html)\n- [CAR 704.01 — commuter](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-704.01.html)\n- [CAR 705.01 — airline](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-705.01.html)\n\n\n- [401.05](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-401.05.html)\n- [404.04](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-404.04.html)\n- [401.30–401.34](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/)\n- [421.40 / 421.46](https://tc.canada.ca/en/corporate-services/acts-regulations/list-regulations/canadian-aviation-regulations-sor-96-433/standards/standard-421-flight-crew-permits-licences-ratings-canadian-aviation-regulations-cars)\n- [604.139–604.143](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.139.html)\n- [702.65 / 702.67](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.65.html)\n- [703.88 / 703.91](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-703.88.html)\n- [704.108 / 704.111](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-704.108.html)\n- [705.106 / 705.113](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-705.106.html)\n- [TC AIM 2026-2 LRA 1.7–1.12](https://tc.canada.ca/en/aviation/publications/transport-canada-aeronautical-information-manual-tc-aim)\n\n**Scope:** Aeroplanes and common operator cases; not exhaustive of aircraft-specific Ops Specs, type endorsements, special authorizations, alternative checks, helicopter rules, privileges and experience credits. Revalidate for operational decisions. / **Portée :** avions, cas usuels; vérifier spécifications d'exploitation, qualifications de type, autorisations, contrôles alternatifs et crédits d'expérience."},{"id":"F-0","card":"F","h":"Overview","a":null,"c":["study-formulas","study-src"],"p":["PPL","CPL"],"md":"[Open CAVE reader](https://jraph.github.io/aero-cave/readers/CPAER_Formulas_Recall_EN_FR.html) · [All study cards](../README.md)\n\nNavigation and operational additions reviewed 19 Oct 2026; source editions and scope in review record. / Ajouts navigation et exploitation revus le 19 oct. 2026; éditions et portée dans le compte rendu."},{"id":"F-1","card":"F","h":"Time · fuel / Temps · carburant","a":"time--fuel--temps--carburant","c":["nav-dr","agk-fuel","study-formulas"],"p":["PPL","CPL"],"md":"| Label | English | Français |\n|---|---|---|\n| Distance | D(NM) = GS(kt) × t(h) | D(NM) = vitesse sol(kt) × durée(h) |\n| Time / Durée | t(min) = 60D/GS | t(min) = 60D/vitesse sol |\n| GS / Vitesse sol | GS(kt) = 60D/t(min) | Vitesse sol(kt) = 60D/t(min) |\n| Fuel / Carburant | Fuel = hourly flow × hours; endurance = usable fuel/flow | Carburant = débit horaire × heures; autonomie = carburant utilisable/débit |\n| Specific range | GS/fuel flow = NM per fuel unit | Vitesse sol/débit = NM par unité de carburant |"},{"id":"F-2","card":"F","h":"Wind · navigation / Vent · navigation","a":"wind--navigation--vent--navigation","c":["nav-dr","study-formulas"],"p":["PPL","CPL"],"md":"| Label | English | Français |\n|---|---|---|\n| Components | Crosswind = W sin θ; headwind = W cos θ; θ is wind-from angle relative to course | Vent traversier = W sin θ; vent de face = W cos θ; θ entre provenance du vent et route |\n| WCA / Dérive | WCA = asin(crosswind/TAS); steer into wind | Correction = asin(vent traversier/TAS); corriger vers le vent |\n| Heading / Cap | True heading = true course + signed WCA | Cap vrai = route vraie + correction signée |\n| T → M → C | Subtract EAST / add WEST: variation, then deviation | Soustraire EST / ajouter OUEST : déclinaison, puis déviation |\n| Track error | TE° ≈ 60 × off-track/distance flown | Erreur de route ≈ 60 × écart latéral/distance parcourue |\n| Closing angle | CA° ≈ 60 × off-track/distance remaining | Angle de convergence ≈ 60 × écart latéral/distance restante |\n| Correction | TE + CA towards track; small-angle approximation | Erreur + convergence vers la route; approximation pour petits angles |"},{"id":"F-3","card":"F","h":"ADF · VOR · DME · intercepts / Interceptions","a":"adf--vor--dme--intercepts--interceptions","c":["nav-radio","study-formulas"],"p":["CPL","IR"],"md":"| Label | English | Français |\n|---|---|---|\n| Conventions | MH = magnetic heading; RB = clockwise relative bearing from nose; BTS/BFS = bearing TO/FROM station. Use one north reference throughout. | MH = cap magnétique; RB = gisement horaire depuis le nez; BTS/BFS = relèvement VERS/DEPUIS la station. Même référence nord pour tous les angles. |\n| Wrap / Normaliser | wrap(x) = x modulo 360; add/subtract 360 until 0–359°. North may be written 000° or 360°. | wrap(x) = x modulo 360; ajouter/soustraire 360 pour obtenir 0–359°. Nord : 000° ou 360°. |\n| BTS = MH + RB | BTS = wrap(MH + RB). MH 350°, RB 040° → BTS 030°. | BTS = wrap(MH + RB). MH 350°, RB 040° → BTS 030°. |\n| BFS = BTS ±180 | BFS = wrap(BTS +180°). BTS 030° → BFS 210°: aircraft southwest of station. | BFS = wrap(BTS +180°). BTS 030° → BFS 210° : avion au sud-ouest de la station. |\n| RB = BTS − MH | RB = wrap(BTS − MH). BTS 020°, MH 080° → RB 300° (60° left of nose). | RB = wrap(BTS − MH). BTS 020°, MH 080° → RB 300° (60° à gauche du nez). |\n| MH = BTS − RB | MH = wrap(BTS − RB). BTS 100°, RB 250° → MH 210°. | MH = wrap(BTS − RB). BTS 100°, RB 250° → MH 210°. |\n| ADF card / Rose | Fixed card: read RB. Movable card: set current MH under index to read magnetic BTS. RMI: correctly referenced needle head = BTS, tail = BFS. | Rose fixe : lire RB. Rose mobile : afficher MH à l’index pour lire BTS magnétique. RMI correctement référencé : pointe = BTS, queue = BFS. |\n| Turn / Virage | At essentially unchanged position, right turn +30° → RB decreases 30°; left turn → RB increases. BTS stays nearly unchanged. | À position pratiquement constante, virage droite +30° → RB diminue de 30°; gauche → RB augmente. BTS reste presque constant. |\n| Homing ≠ tracking | RB 000° points the nose at the station. In crosswind, holding RB 000° gives a curved homing path. Tracking needs wind correction. | RB 000° pointe le nez vers la station. Par vent traversier, maintenir RB 000° produit une trajectoire courbe. Suivre une route exige une correction de dérive. |\n| VOR radial | Radial = bearing FROM station. On R-090: outbound course 090°; inbound course 270°. Identify aid and north reference (true-reference exceptions exist in Canada). | Radiale = relèvement DEPUIS station. Sur R-090 : route éloignement 090°; rapprochement 270°. Identifier aide et référence nord (exceptions au nord vrai au Canada). |\n| TO / FROM | With CDI centred: selected course toward station → TO; reciprocal → FROM. Flag describes selected-course geometry, not aircraft heading or actual travel. | CDI centré : route sélectionnée vers station → TO; réciproque → FROM. Le drapeau décrit la géométrie sélectionnée, pas le cap ni le déplacement réel. |\n| 30° intercept setup | C = desired direction of travel, NOT always radial. Choose H = C ±30° toward the course line. Sketch station, current BFS and target line first; heading alone cannot select the side. No-wind examples below. | C = route désirée, PAS toujours radiale. Choisir H = C ±30° vers la ligne. Dessiner station, BFS actuel et ligne cible; le cap seul ne donne pas le côté. Exemples sans vent ci-dessous. |\n| Capture: inbound | At capture BTS = C; RB = wrap(C − H). H=C+30 → RB330; H=C−30 → RB030. Start rollout with appropriate lead. | À l’interception BTS = C; RB = wrap(C − H). H=C+30 → RB330; H=C−30 → RB030. Anticiper la sortie du virage. |\n| Capture: outbound | At capture BTS = wrap(C+180); RB = wrap(C+180−H). H=C+30 → RB150; H=C−30 → RB210. | À l’interception BTS = wrap(C+180); RB = wrap(C+180−H). H=C+30 → RB150; H=C−30 → RB210. |\n| Inbound example | Aircraft west-northwest of NDB (BFS285), intercept C090 inbound: H120 toward line. At capture BTS090, RB330. Turn left toward 090, then correct wind. | Avion au ouest-nord-ouest du NDB (BFS285), intercepter C090 en rapprochement : H120 vers ligne. À l’interception BTS090, RB330. Virer gauche vers 090, puis corriger le vent. |\n| Outbound example | Aircraft northeast (BFS045), intercept C090 outbound: H120. At capture BFS090, BTS270, RB150. Turn left toward 090, then correct wind. | Avion au nord-est (BFS045), intercepter C090 en éloignement : H120. À l’interception BFS090, BTS270, RB150. Virer gauche vers 090, puis corriger le vent. |\n| Wind trap / Vent | 30° is a chosen training intercept, not a universal rule. Wind changes the ground intercept angle. Always compute capture RB from actual heading; after capture fly the wind-corrected heading. | 30° est un choix pédagogique, pas une règle universelle. Le vent modifie l’angle au sol. Calculer RB à partir du cap réel; après interception appliquer la correction de dérive. |\n| Cross-track distance | Lateral offset = ground range × sin(angular error); small angle ≈ range × error°/60. At 30 NM, 4° → about 2 NM. | Écart latéral = distance horizontale × sin(erreur angulaire); petit angle ≈ distance × erreur°/60. À 30 NM, 4° → environ 2 NM. |\n| VOR dots | Conventional VOR CDI: normally 2° per dot, ±10° full scale. Two dots at 30 NM ≈ 2 NM. LOC and GNSS scales differ; check equipment/mode. | CDI VOR classique : normalement 2° par point, ±10° pleine échelle. Deux points à 30 NM ≈ 2 NM. Échelles LOC/GNSS différentes; vérifier équipement/mode. |\n| DME geometry | Slant NM = √(ground NM² + height NM²); height NM = height above station(ft)/6076. Over station at 6076 ft above it → about 1 DME, not zero. | Distance oblique NM = √(distance horizontale NM² + hauteur NM²); hauteur NM = pieds au-dessus station/6076. À la verticale à 6076 ft au-dessus → environ 1 DME, pas zéro. |\n| DME ground range | Ground NM = √(DME² − height NM²). DME 5 NM, height 6076 ft → √24 ≈4.90 NM. DME speed/time meaningful toward/away from station; unreliable for along-track speed on an arc. | Distance horizontale NM = √(DME² − hauteur NM²). DME 5 NM, hauteur 6076 ft → √24 ≈4,90 NM. Vitesse/temps DME pertinents vers/depuis station; pas la vitesse le long d’un arc. |\n| 30° closing time | For a 30° GROUND-track intercept: closing speed = GS × sin30 = GS/2. Time(min)=120 × lateral NM/GS. 2 NM off at 120 kt → 2 min. Wind-correct heading to obtain that ground track. | Interception à 30° de ROUTE SOL : vitesse de rapprochement = GS/2. Temps(min)=120 × écart NM/GS. Écart 2 NM à 120 kt → 2 min. Corriger le cap pour obtenir cette route sol. |"},{"id":"F-4","card":"F","h":"Weight · balance / Masse · centrage","a":"weight--balance--masse--centrage","c":["agk-wb","study-formulas"],"p":["PPL","CPL"],"md":"| Label | English | Français |\n|---|---|---|\n| Moment | Moment = weight × arm | Moment = masse × bras de levier |\n| CG | CG = total moment/total weight | CG = somme des moments/masse totale |\n| Shift / Déplacement | ΔCG = moved weight × distance moved/total weight | ΔCG = masse déplacée × déplacement/masse totale |\n| Required weight | w = total weight × ΔCG/distance moved | w = masse totale × ΔCG/déplacement |\n| Add / remove | CGnew = (W × CGold ± w × arm)/(W ± w) | CGnouveau = (W × CGancien ± w × bras)/(W ± w) |\n| % MAC / CMA | 100(CG − LEMAC)/MAC; common datum and units | 100(CG − bord d’attaque CMA)/CMA; même référence et unités |"},{"id":"F-5","card":"F","h":"Altitude · weather / Altitude · météo","a":"altitude--weather--altitude--météo","c":["met-atmos","study-formulas"],"p":["PPL","CPL"],"md":"| Label | English | Français |\n|---|---|---|\n| ISA | T°C ≈ 15 − 2 × altitude(thousands ft); troposphere | T°C ≈ 15 − 2 × altitude(milliers pi); troposphère |\n| PA / AP | PA ≈ IALT + 1000(29.92 − setting inHg) | AP ≈ altitude indiquée + 1000(29,92 − calage inHg) |\n| DA / AD | DA ≈ PA + 120(OAT − ISA at PA) | AD ≈ AP + 120(température extérieure − ISA à AP) |\n| True altitude | Correction ft ≈ 4 × height above setting source(thousands ft) × ΔT°C; warm add, cold subtract | Correction pi ≈ 4 × hauteur au-dessus de la source du calage(milliers pi) × ΔT°C; chaud ajouter, froid soustraire |\n| Temperature | F = 1.8C + 32; C = (F − 32)/1.8 | F = 1,8C + 32; C = (F − 32)/1,8 |\n| DALR | Unsaturated rising parcel: −3°C/1000 ft | Parcelle ascendante non saturée : −3°C/1000 pi |\n| SALR | Saturated rising parcel: ≈ −1.5°C/1000 ft; variable | Parcelle ascendante saturée : ≈ −1,5°C/1000 pi; variable |\n| Dew point | Unsaturated parcel: ≈ −0.5°C/1000 ft | Point de rosée, parcelle non saturée : ≈ −0,5°C/1000 pi |\n| Cloud base · exam | Convective base AGL ft ≈ 1000(T − Td)/3; **simplified classroom shortcut** assuming Td approximately constant | Base convective AGL pi ≈ 1000(T − Td)/3; **raccourci de cours** avec Td supposé presque constant |\n| Cloud base · parcel | Convective LCL AGL ft ≈ 1000(T − Td)/(3 − 0.5); rising unsaturated parcel cools 3°C/1000 ft, dew point falls 0.5°C/1000 ft → spread closes 2.5°C/1000 ft | NCL convectif AGL pi ≈ 1000(T − Td)/(3 − 0,5); la parcelle non saturée refroidit de 3°C/1000 pi, le point de rosée baisse de 0,5°C/1000 pi → écart réduit de 2,5°C/1000 pi |\n| Freezing · exam | Parcel 0°C height AGL ≈ CB(exam) + 1000 Td/1.5; assumes T at cloud base ≈ surface Td, saturated lapse ≈ 1.5°C/1000 ft | Hauteur AGL de 0°C dans la parcelle ≈ base(examen) + 1000 Td/1,5; T à la base ≈ Td de surface, gradient saturé ≈ 1,5°C/1000 pi |\n| Freezing · parcel | T_CB ≈ T − 3 CB(parcel)/1000; parcel 0°C height AGL ≈ CB(parcel) + 1000 T_CB/1.5 (if T_CB > 0°C); saturated lapse variable | T_base ≈ T − 3 base(parcelle)/1000; hauteur AGL de 0°C ≈ base(parcelle) + 1000 T_base/1,5 (si T_base > 0°C); gradient saturé variable |\n| Freezing · actual | Parcel 0°C height ≠ atmospheric freezing level; environmental vertical temperature profile / GFA / winds-temp aloft wins. ASL = AGL + field elevation (same datum) | Hauteur de 0°C de la parcelle ≠ niveau de congélation réel; privilégier profil thermique ambiant / GFA / vents-températures en altitude. ASL = AGL + altitude du terrain (même référence) |"},{"id":"F-6","card":"F","h":"Stall · airspeed / Décrochage · vitesse","a":"stall--airspeed--décrochage--vitesse","c":["agk-stall","agk-vspeeds","study-formulas"],"p":["PPL","CPL"],"md":"| Label | English | Français |\n|---|---|---|\n| Load / Charge | n = 1/cos(bank): coordinated LEVEL turn only | n = 1/cos(inclinaison) : virage coordonné EN PALIER uniquement |\n| Stall / Décrochage | Vs loaded = Vs × √n; Vs₂ = Vs₁√(W₂/W₁) | Vs sous charge = Vs × √n; Vs₂ = Vs₁√(W₂/W₁) |\n| VS / VS1 / VS0 | VS = generic stall speed; VS1 = specified configuration (often clean); VS0 = landing config. VS and VS1 can refer to the same clean speed; not VS0. | VS = vitesse de décrochage générique; VS1 = configuration spécifiée (souvent lisse); VS0 = configuration d'atterrissage. VS et VS1 peuvent désigner la même vitesse en configuration lisse; pas VS0. |\n| VA · theoretical / théorique | VA_est = VS(clean)√n_limit; legacy Normal +3.8g → ≈1.95 VS1 (mental ≈2×VS1, not a VA range); VS1=50 KIAS → ≈97.5 KIAS. Positive stall/limit-load intersection, not necessarily certified VA. | VA_est = VS(lisse)√n_limite; Normal ancien +3,8g → ≈1,95 VS1 (calcul mental ≈2×VS1, pas une plage de VA); VS1=50 KIAS → ≈97,5 KIAS. Intersection décrochage/charge limite positive, pas nécessairement la VA certifiée. |\n| VA · weight / masse | VA₂ ≈ VA₁√(W₂/W₁) for same configuration/load-factor basis; lighter → lower VA. Published POH/AFM and weight schedule govern; VA does not protect against every abrupt/multiple input or gust. | VA₂ ≈ VA₁√(W₂/W₁), à configuration et facteur de charge comparables; masse moindre → VA moindre. POH/AFM et valeurs selon la masse prévalent; VA ne protège pas contre toute action brusque/combinée ni toute rafale. |\n| VREF definition / Définition | Landing reference speed: the published POH/AFM speed to be maintained to 50 ft in the specified landing configuration. Use the published value; certification bases differ. | Vitesse de référence à l’atterrissage : vitesse publiée au POH/AFM à maintenir jusqu’à 50 pi dans la configuration d’atterrissage précisée. Utiliser la valeur publiée; les bases de certification diffèrent. |\n| VREF fallback / Calcul | If VREF is not specified: 1.3 × VSO. Example: VSO 50 KIAS → VREF 65 KIAS. For approach category, use VSO at maximum certificated landing weight. | Si VREF n’est pas précisée : 1,3 × VSO. Exemple : VSO 50 KIAS → VREF 65 KIAS. Pour la catégorie d’approche, utiliser VSO à la masse maximale certifiée à l’atterrissage. |\n| Weight / Masse | Same configuration/basis only: VREF₂ ≈ VREF₁√(W₂/W₁). POH/AFM landing-weight data takes precedence. Wind/gust additive changes the approach target, not VREF. | Même configuration et même base seulement : VREF₂ ≈ VREF₁√(W₂/W₁). Les données POH/AFM selon la masse ont priorité. La correction vent/rafale modifie la cible d’approche, pas VREF. |\n| Lift / Portance | L = ½ρV²SCL; dynamic pressure q = ½ρV² | L = ½ρV²SCL; pression dynamique q = ½ρV² |\n| TAS | TAS = EAS√(ρ₀/ρ) | Vitesse vraie = vitesse équivalente × √(ρ₀/ρ) |\n| TAS shortcut | ≈ CAS[1 + 0.02(PA/1000)]; rough; E6B for actual temperature | ≈ CAS[1 + 0,02(AP/1000)]; approximatif; E6B pour température réelle |\n| 30° / 45° / 60° | n: 1.15 / 1.41 / 2; Vs factors: 1.07 / 1.19 / 1.41 | n : 1,15 / 1,41 / 2; facteurs Vs : 1,07 / 1,19 / 1,41 |"},{"id":"F-7","card":"F","h":"Climb · descent / Montée · descente","a":"climb--descent--montée--descente","c":["agk-perfcalc","study-formulas"],"p":["PPL","CPL"],"md":"| Label | English | Français |\n|---|---|---|\n| Gradient | ft/NM = 60 × vertical speed(ft/min)/GS(kt) | pi/NM = 60 × vitesse verticale(pi/min)/vitesse sol(kt) |\n| Required rate | ft/min = gradient(ft/NM) × GS/60 | pi/min = gradient(pi/NM) × vitesse sol/60 |\n| Percent / Pourcentage | % = 100 × vertical/horizontal distance; same units | % = 100 × distance verticale/horizontale; mêmes unités |\n| % → ft/NM | ft/NM = 60.76 × percent; 5% ≈ 304 ft/NM | pi/NM = 60,76 × pourcentage; 5% ≈ 304 pi/NM |\n| 3° path / Pente | 3° ≈ 5.24% ≈ 318 ft/NM; NOT 3% | 3° ≈ 5,24% ≈ 318 pi/NM; PAS 3% |\n| 3° rate / Taux | Descent ft/min ≈ 5.3 × GS; mental shortcut 5 × GS | Descente pi/min ≈ 5,3 × vitesse sol; raccourci 5 × vitesse sol |\n| 3° distance | NM ≈ height to lose(ft)/318; rough 3 NM/1000 ft | NM ≈ hauteur à perdre(pi)/318; environ 3 NM/1000 pi |\n| Descent time | Minutes = height change/vertical speed; NM = GS × minutes/60 | Minutes = dénivelé/vitesse verticale; NM = vitesse sol × minutes/60 |\n| Worked / Exemple | Lose 4000 ft at GS120: ≈12.6 NM, 636 ft/min, 6.3 min on 3° | Perdre 4000 pi à GS120 : ≈12,6 NM, 636 pi/min, 6,3 min sur 3° |\n| Wind / Vent | Same climb rate: headwind improves ground gradient; tailwind reduces it | Même taux de montée : vent de face améliore la pente sol; vent arrière la réduit |"},{"id":"F-8","card":"F","h":"Turns / Virages","a":"turns--virages","c":["agk-load","study-formulas"],"p":["PPL","CPL"],"md":"| Label | English | Français |\n|---|---|---|\n| Standard rate | 3°/s; 90°=30s; 180°=60s; 360°=120s | 3°/s; 90°=30s; 180°=60s; 360°=120s |\n| Rate / Taux | °/s ≈ 1091 tan(bank)/TAS(kt) | °/s ≈ 1091 tan(inclinaison)/TAS(kt) |\n| Radius / Rayon | ft ≈ TAS²/[11.26 tan(bank)] | pi ≈ TAS²/[11,26 tan(inclinaison)] |\n| Standard bank | bank = atan(3TAS/1091); 100kt≈15°; 150kt≈22° | inclinaison = atan(3TAS/1091); 100kt≈15°; 150kt≈22° |\n| Double speed | Same bank: half turn rate, FOUR times radius | Même inclinaison : taux divisé par deux, rayon QUADRUPLÉ |\n| Assumptions | Coordinated level turn; TAS; air-relative geometry; wind alters ground track | Virage coordonné en palier; TAS; géométrie dans l’air; vent modifie trajectoire sol |"},{"id":"F-9","card":"F","h":"Radio · runway / Radio · piste","a":"radio--runway--radio--piste","c":["agk-perfcalc","ifr-minima","study-formulas"],"p":["PPL","CPL"],"md":"| Label | English | Français |\n|---|---|---|\n| VHF range | NM ≈ 1.23(√h₁ + √h₂); 1.25 also used; feet above surface | NM ≈ 1,23(√h₁ + √h₂); 1,25 également; hauteurs en pi au-dessus de la surface |\n| Rotating tyre | Dynamic hydroplaning kt ≈ 9√pressure(psi); 36psi→54kt | Pneu en rotation : aquaplanage dynamique kt ≈ 9√pression(psi); 36psi→54kt |\n| Non-rotating tyre | kt ≈ 7.7√pressure(psi); 36psi→46.2kt | Pneu sans rotation : kt ≈ 7,7√pression(psi); 36psi→46,2kt |\n| FISE frequencies | 123.275 / 123.375 / 123.475 / 123.550 MHz; use local published RCO | 123,275 / 123,375 / 123,475 / 123,550 MHz; utiliser RCO publié |\n| 126.7 | Generally not monitored by FIC at dedicated FISE RCOs; broadcasts may occur | Généralement non veillée par FIC aux RCO FISE dédiés; diffusions possibles |"},{"id":"F-10","card":"F","h":"Conversions","a":"conversions","c":["nav-units","study-formulas"],"p":["PPL","CPL"],"md":"| Label | English | Français |\n|---|---|---|\n| NM | 1 NM = 1.852km = 6076ft = 1.151 statute mi | 1 NM = 1,852km = 6076pi = 1,151 mille terrestre |\n| Gallon | US 3.785L; Imperial 4.546L | US 3,785L; impérial 4,546L |\n| Mass / length | 1kg = 2.205lb; 1m = 3.281ft | 1kg = 2,205lb; 1m = 3,281pi |\n| Earth / Terre | 15° longitude/hour; 4min/degree; 1′ latitude ≈ 1NM | 15° longitude/heure; 4min/degré; 1′ latitude ≈ 1NM |"},{"id":"F-11","card":"F","h":"Timing shortcuts / Estimation du temps","a":"timing-shortcuts--estimation-du-temps","c":["nav-dr","study-formulas"],"p":["PPL","CPL"],"md":"| Label | English | Français |\n|---|---|---|\n| Units / Unités | Distance in NM × fraction = ETE in MINUTES; use groundspeed, including wind. | Distance en NM × fraction = ETE en MINUTES; utiliser la vitesse sol, vent compris. |\n| 60 kt | ETE = distance × 1 → same number; 30 NM = 30 min | ETE = distance × 1 → même nombre; 30 NM = 30 min |\n| 75 kt | ETE = distance × ⅘ → ÷5 then ×4; 30 NM = 24 min | ETE = distance × ⅘ → ÷5 puis ×4; 30 NM = 24 min |\n| 90 kt | ETE = distance × ⅔ → ÷3 then ×2; 30 NM = 20 min | ETE = distance × ⅔ → ÷3 puis ×2; 30 NM = 20 min |\n| 100 kt | ETE = distance × ⅗ → ÷5 then ×3; 30 NM = 18 min | ETE = distance × ⅗ → ÷5 puis ×3; 30 NM = 18 min |\n| 120 kt | ETE = distance × ½ → ÷2; 30 NM = 15 min | ETE = distance × ½ → ÷2; 30 NM = 15 min |\n| 150 kt | ETE = distance × ⅖ → ÷5 then ×2; 30 NM = 12 min | ETE = distance × ⅖ → ÷5 puis ×2; 30 NM = 12 min |\n| 180 kt | ETE = distance × ⅓ → ÷3; 30 NM = 10 min | ETE = distance × ⅓ → ÷3; 30 NM = 10 min |"},{"id":"F-12","card":"F","h":"CFS servicing · public facilities / Services · installations publiques CFS","a":"cfs-servicing--public-facilities--services--installations-publiques-cfs","c":["nav-pubs","agk-stall","study-formulas"],"p":["PPL","CPL"],"md":"| Label | English | Français |\n|---|---|---|\n| 1 | Storage available | Entreposage disponible |\n| 2 | Servicing / minor repairs | Entretien / réparations mineures |\n| 3 | Major repairs | Réparations majeures |\n| 4 | Extended-term parking | Stationnement prolongé |\n| 5 | Tie-down facilities | Dispositifs d’amarrage |\n| 6 | Plug-in facilities | Prises de branchement |\n| 7 | Pick-up/drop-off only; no extended parking | Embarquement/débarquement seulement; aucun stationnement prolongé |\n| PF location / Lieu | `PF` = public facilities. `A` terminal; `B` on aerodrome; `C` within 5 NM; `D` within 30 NM. | `PF` = installations publiques. `A` aérogare; `B` sur l’aérodrome; `C` à moins de 5 NM; `D` à moins de 30 NM. |\n| PF 1–4 | `1` phone; `2` food; `3` taxi; `4` medical. | `1` téléphone; `2` restauration; `3` taxi; `4` services médicaux. |\n| PF 5–8 | `5` hotel; `6` car rental; `7` public Wi-Fi; `8` public Internet access. | `5` hôtel; `6` location auto; `7` Wi-Fi public; `8` accès Internet public. |\n| PF example / Exemple | `PF A-1,2 B-5` = phone and food in terminal; hotel on aerodrome. `S 5` means tie-down, but `PF 5` means hotel. | `PF A-1,2 B-5` = téléphone et restauration dans l’aérogare; hôtel sur l’aérodrome. `S 5` signifie arrimage, mais `PF 5` signifie hôtel. |"},{"id":"F-13","card":"F","h":"Communications · weather / Communications · météo","a":"communications--weather--communications--météo","c":["law-atc","met-products","study-formulas"],"p":["PPL","CPL"],"md":"| Label | English | Français |\n|---|---|---|\n| RADIO | FSS/FIC information and advisories | Information et conseils FSS/FIC |\n| RCO | Remote radio link to FSS/FIC: FISE or RAAS | Liaison radio distante FSS/FIC : FISE ou RAAS |\n| DRCO | Dial-up RCO; 4 deliberate mic clicks | RCO à liaison téléphonique; 4 pressions délibérées |\n| FISE | Flight Information Service En Route | Service d’information de vol en route |\n| RAAS | Remote Aerodrome Advisory Service | Service consultatif télécommandé d’aérodrome |\n| ATIS | Recorded terminal weather and operational information; note letter | Information météo et opérationnelle enregistrée; noter lettre |\n| CLNC DEL | Clearance delivery | Délivrance des autorisations |\n| APRON | Apron movement management/advisory | Gestion/conseils des mouvements sur aire de trafic |\n| GND | Ground control: taxi instructions | Contrôle sol : instructions de circulation |\n| GND ADV | Ground advisory at certain MF sites; may relay pre-taxi clearances | Conseils au sol à certains sites MF; relais possible d’autorisations avant circulation |\n| TWR | Tower: runway and local airborne control | Tour : contrôle piste et circulation aérienne locale |\n| MF | Mandatory Frequency; mandatory reporting area, not necessarily controlled | Fréquence obligatoire; comptes rendus obligatoires, pas nécessairement contrôlé |\n| ATF | Aerodrome Traffic Frequency for uncontrolled traffic coordination | Fréquence de trafic d’aérodrome pour coordination non contrôlée |\n| TML | Terminal ATC | Contrôle terminal |\n| ARR / DEP | Arrival / departure ATC | Contrôle des arrivées / départs |\n| VFR ADV | VFR advisory service | Service consultatif VFR |\n| PAL | Peripheral station: remote ATC radio site | Station périphérique : site radio ATC distant |\n| UNICOM | Private airport information/advisory radio | Radio privée d’information/conseils d’aéroport |\n| APRT RDO | Airport Radio, usually CARS observer/communicator | Radio d’aéroport, généralement observateur/communicateur CARS |\n| A/G | Air/Ground communications | Communications air-sol |\n| MIL | Military frequency; read named unit | Fréquence militaire; lire unité indiquée |\n| VDF / UDF | VHF / UHF direction finding: bearing from your transmission | Radiogoniométrie VHF / UHF : relèvement de votre émission |\n| INTL AIR | International air-carrier communications, commonly HF | Communications transporteurs internationaux, souvent HF |\n| AWOS | Automated Weather Observation System | Système automatisé d’observation météorologique |\n| LWIS | Limited Weather Information System: wind, temperature, dew point, altimeter | Système limité : vent, température, point de rosée, calage |\n| AUTO | Local automated weather; does not meet METAR/SPECI/LWIS reporting requirements | Météo automatisée locale; ne satisfait pas exigences METAR/SPECI/LWIS |\n| PMSV | Pilot to Metro Service: military meteorological personnel | Liaison pilote–service météo militaire |\n| VOLMET | Weather for aircraft in flight: voice broadcast | Météo pour aéronefs en vol : diffusion vocale |\n| D-VOLMET | Weather via data link; D = data link | Météo par liaison de données; D = données |"},{"id":"F-14","card":"F","h":"FIR · FIC","a":"fir--fic","c":["law-airspace","law-atc","study-formulas"],"p":["PPL","CPL"],"md":"| Label | English | Français |\n|---|---|---|\n| 7 FIR | Vancouver, Edmonton, Winnipeg, Toronto, Montréal, Moncton, Gander | Vancouver, Edmonton, Winnipeg, Toronto, Montréal, Moncton, Gander |\n| 4 briefing FIC | Kamloops, Edmonton, London, Québec | Kamloops, Edmonton, London, Québec |\n| Whitehorse | FIC for flight-plan processing/alerting; Kamloops provides telephone pilot briefings | FIC pour traitement plans de vol/alerte; Kamloops assure exposés téléphoniques |\n| Five areas | Course shorthand: Pacific, Edmonton, Ontario, Québec, Atlantic; London serves Ontario + Atlantic. These are not the seven FIRs. | Raccourci pédagogique : Pacifique, Edmonton, Ontario, Québec, Atlantique; London dessert Ontario + Atlantique. Ce ne sont pas les sept FIR. |"},{"id":"F-15","card":"F","h":"NOTAM · header & Q-line / En-tête et ligne Q","a":"notam--header--q-line--en-tête-et-ligne-q","c":["nav-pubs","study-formulas"],"p":["PPL","CPL"],"md":"| Label | English | Français |\n|---|---|---|\n| Example / Exemple | Training example: H1234/26 NOTAMN; Q) CZUL/QMRLC/IV/NBO/A/000/999/4528N07345W005 | Exemple pédagogique : H1234/26 NOTAMN; Q) CZUL/QMRLC/IV/NBO/A/000/999/4528N07345W005 |\n| 1 Header | H = series; 1234 = number; /26 = year | H = série; 1234 = numéro; /26 = année |\n| 2 Type | NOTAMN new; NOTAMR replacement; NOTAMC cancellation | NOTAMN nouveau; NOTAMR remplacement; NOTAMC annulation |\n| 3–5 | Q) qualifiers; CZUL FIR; QMRLC = runway closed (MR runway, LC closed) | Q) qualificatifs; CZUL FIR; QMRLC = piste fermée (MR piste, LC fermé) |\n| 6 Traffic | I IFR; V VFR; IV both | I IFR; V VFR; IV les deux |\n| 7 Purpose | N immediate attention; B briefing; O flight operations; M miscellaneous on request; K checklist | N attention immédiate; B exposé; O opérations de vol; M divers sur demande; K liste récapitulative |\n| 8 Scope | A aerodrome; E en route; W navigation warning; AE aerodrome + en route | A aérodrome; E en route; W avertissement navigation; AE aérodrome + en route |\n| 9–10 Vertical | Lower/upper in FL; 000/999 commonly default filtering values | Limites inférieure/supérieure en FL; 000/999 souvent valeurs de filtrage par défaut |\n| 11–12 Geography | 4528N07345W = centre; 005 = 5 NM RADIUS | 4528N07345W = centre; 005 = RAYON de 5 NM |\n| A / B / C | A location; B start UTC; C end UTC or PERM | A lieu; B début UTC; C fin UTC ou PERM |\n| D / E / F / G | D schedule; E operational text; F/G lower/upper limits when applicable | D horaire; E texte opérationnel; F/G limites inférieure/supérieure si applicables |"},{"id":"F-16","card":"F","h":"Common NOTAM codes / Codes NOTAM courants","a":"common-notam-codes--codes-notam-courants","c":["nav-pubs","study-formulas","study-abbrev"],"p":["PPL","CPL"],"md":"| Label | English | Français |\n|---|---|---|\n| QMRLC | Runway closed | Piste fermée |\n| QMXLC | Taxiway closed | Voie de circulation fermée |\n| QFALC | Aerodrome closed | Aérodrome fermé |\n| QICAS | ILS unserviceable | ILS hors service |\n| QILAS | Localizer unserviceable | Radiophare d’alignement hors service |\n| QIGAS | Glide path unserviceable | Alignement de descente hors service |\n| QNVAS | VOR unserviceable | VOR hors service |\n| QNDAS | DME unserviceable | DME hors service |\n| QNBAS | NDB unserviceable | NDB hors service |\n| QCAAS | Air-ground communications unserviceable | Communications air-sol hors service |\n| QOBCE | Obstacle erected | Obstacle érigé |\n| QOLAS | Obstacle lights unserviceable | Feux d’obstacle hors service |"},{"id":"F-17","card":"F","h":"Twilight · time zones · DST / Crépuscule · fuseaux · heure avancée","a":"twilight--time-zones--dst--crépuscule--fuseaux--heure-avancée","c":["law-oprules","nav-dr","study-formulas"],"p":["PPL","CPL"],"m
