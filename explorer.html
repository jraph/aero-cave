<style>
:root{--ok:#1c7c54;--part:#9a6200;--miss:#b3261e;--size:16px;--bg:#f4f7f8;--panel:#fff;--ink:#183044;--muted:#526775;--accent:#006f75;--line:#dbe6e9;--stripe:#f0f6f6;--pill:#dff1ef;--warn:#8a5a00;font-size:var(--size);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111c24;--panel:#172731;--ink:#e7f0f4;--muted:#b2c3cc;--accent:#72d8ce;--line:#304550;--stripe:#1b3039;--pill:#234d50;--warn:#e8b95a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111c24;--panel:#172731;--ink:#e7f0f4;--muted:#b2c3cc;--accent:#72d8ce;--line:#304550;--stripe:#1b3039;--pill:#234d50;--warn:#e8b95a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:60rem;margin:0 auto;padding:0 .7rem}
header{padding:.7rem 0 .3rem}
.eyebrow{font-size:.72rem;letter-spacing:.12em;color:var(--accent);font-weight:700}
h1{font-size:1.25rem;margin:.1rem 0 .3rem;line-height:1.2}
.top{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;font-size:.85rem}
.top a{color:var(--accent)}
.top .sp{flex:1}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:.45rem;padding:.25rem .55rem;cursor:pointer;min-height:2rem}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:.4rem 0}
.bar .wrap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.35rem}
#q{grid-column:1/-1;width:100%;padding:.5rem .6rem;border:1px solid var(--line);border-radius:.5rem;background:var(--panel);min-height:2.4rem}
.bar select{width:100%;min-width:0;padding:.4rem .3rem;border:1px solid var(--line);border-radius:.5rem;background:var(--panel);min-height:2.3rem;text-overflow:ellipsis}
.bar select.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
@media (max-width:30rem){.bar .wrap{grid-template-columns:1fr 1fr}#fc{grid-column:1/-1}}
main{padding:.6rem 0 3rem}
h2{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:1rem 0 .4rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.4rem}
.tile{display:flex;flex-direction:column;gap:.15rem;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:.55rem .6rem;cursor:pointer;min-height:3.4rem}
.tile b{font-size:.92rem;line-height:1.2}
.tile span{font-size:.75rem;color:var(--muted)}
.tile:hover,.chip:hover{border-color:var(--accent)}
.tile.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
#vpanel{border-left:3px solid var(--accent);padding:.1rem .6rem .3rem;margin-bottom:.6rem}#vpanel h3{margin:.1rem 0 .2rem;font-size:1.05rem;line-height:1.2}
.pl{margin:.3rem 0;display:flex;flex-wrap:wrap;gap:.22rem}.pt{background:var(--stripe);border:1px solid var(--line);border-radius:.3rem;padding:.05rem .35rem;font-size:.84rem;line-height:1.3}.pt.k{background:var(--pill);font-weight:700;border-color:transparent}
#gpanel h3{margin:.2rem 0 .2rem;font-size:1.1rem}
.bars{display:flex;height:.55rem;border-radius:.3rem;overflow:hidden;margin:.5rem 0 .4rem;background:var(--line)}
.bars span{display:block}.sC{background:var(--ok)}.sP{background:var(--part)}.sM{background:var(--miss)}.sE{background:var(--muted)}
.leg{display:flex;flex-wrap:wrap;gap:.3rem;margin:.3rem 0 .6rem}
.leg .btn{font-size:.8rem;display:flex;gap:.35rem;align-items:center}.leg .btn[aria-pressed="true"]{background:var(--pill);color:var(--ink);border-color:var(--accent)}
.dot{width:.6rem;height:.6rem;border-radius:50%;display:inline-block;flex:none}
details.grp{background:var(--panel);border:1px solid var(--line);border-radius:.5rem;margin:.25rem 0}
details.grp>summary{cursor:pointer;padding:.45rem .55rem;display:flex;gap:.5rem;align-items:center;list-style:none;font-weight:600}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .bars{flex:0 0 4.5rem;margin:0 0 0 auto;height:.4rem}
.it{display:grid;grid-template-columns:auto 1fr;gap:.1rem .5rem;padding:.4rem .55rem;border-top:1px solid var(--line);font-size:.9rem}
.it .sb{font-size:.62rem;font-weight:700;color:#fff;border-radius:.3rem;padding:.05rem .3rem;align-self:start;margin-top:.15rem;min-width:1.2rem;text-align:center}
.it .gap{grid-column:2;font-size:.78rem;color:var(--muted)}.it .us{grid-column:2;display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.15rem}
.uid{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.72rem;color:var(--muted)}
details.sec.hit{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
#cpanel{background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:.6rem;margin-bottom:.6rem}
#cpanel h3{margin:.15rem 0 .35rem;font-size:1.1rem;line-height:1.2}
.crumbs{font-size:.78rem;color:var(--muted);line-height:1.5}
.crumbs button{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.rel{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;margin-top:.35rem}
.rel i{font-style:normal;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:4.2rem}
.chip{background:var(--pill);border:1px solid transparent;border-radius:1rem;padding:.2rem .6rem;font-size:.8rem;cursor:pointer;line-height:1.25;text-align:left}
.chip small{color:var(--muted)}
.chip.r{background:none;border:1px dashed var(--line)}
.chip.b{background:none;border:1px solid var(--line)}
#graph{margin-top:.5rem;border-top:1px solid var(--line);padding-top:.4rem}
#graph svg{display:block;width:100%;height:auto;max-width:34rem;margin:0 auto}
#graph text{font-size:11px;fill:var(--ink);pointer-events:none}
#graph .n rect{fill:var(--pill);stroke:var(--line);cursor:pointer}
#graph .n.c rect{fill:var(--accent)}#graph .n.c text{fill:var(--bg);font-weight:700}
#graph .n.r rect{fill:var(--panel);stroke-dasharray:4 3}
#graph .n.b rect{fill:var(--panel)}#graph .n[data-id=""] rect{stroke-dasharray:none;fill:var(--bg)}
#graph path{fill:none;stroke:var(--line);stroke-width:1.3}
#graph path.r{stroke-dasharray:4 3}
#count{font-size:.8rem;color:var(--muted);margin:.5rem 0 .3rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.gh{font-size:.8rem;font-weight:700;color:var(--accent);margin:.8rem 0 .25rem;display:flex;gap:.4rem;align-items:baseline}
.gh small{color:var(--muted);font-weight:400}
details.sec{scroll-margin-top:8.5rem;background:var(--panel);border:1px solid var(--line);border-radius:.5rem;margin:.22rem 0}
details.sec>summary{list-style:none;cursor:pointer;padding:.42rem .55rem;display:flex;flex-wrap:wrap;gap:.3rem .45rem;align-items:baseline}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";color:var(--accent);font-size:.8rem}
details.sec[open]>summary::before{content:"▾"}
details.sec[open]>summary{border-bottom:1px solid var(--line)}
.st{font-weight:600;flex:1;min-width:9rem;line-height:1.25}
.pb{font-size:.62rem;font-weight:700;border:1px solid var(--line);border-radius:.3rem;padding:0 .25rem;color:var(--muted);letter-spacing:.03em}
.snip{flex-basis:100%;font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
mark{background:var(--pill);color:inherit;border-radius:.15rem;padding:0 .1rem}
.body{padding:.45rem .55rem .55rem;font-size:.9rem;line-height:1.3;overflow-wrap:anywhere}
.body p{margin:.3rem 0}.body ul,.body ol{margin:.25rem 0;padding-left:1.1rem}.body li{margin:.14rem 0}
.body h5{margin:.6rem 0 .25rem;font-size:.86rem;color:var(--accent)}
.body code{background:var(--stripe);border-radius:.2rem;padding:0 .2rem;font-size:.92em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.body a{color:var(--accent)}
.tw{overflow-x:auto;margin:.35rem 0;-webkit-overflow-scrolling:touch}
.body table{border-collapse:collapse;font-size:.84rem;min-width:100%;overflow-wrap:normal}
.body th,.body td{border:1px solid var(--line);padding:.14rem .35rem;text-align:left;vertical-align:top;min-width:3.2rem}
.body th{background:var(--stripe)}.body tr:nth-child(even) td{background:var(--stripe)}
.foot{border-top:1px dashed var(--line);margin-top:.5rem;padding-top:.4rem;display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;font-size:.78rem}
.foot a{color:var(--accent);margin-left:auto}
.empty{padding:1.2rem .4rem;color:var(--muted)}
footer{font-size:.74rem;color:var(--muted);padding:1rem 0 2rem;border-top:1px solid var(--line)}
footer a{color:var(--accent)}
.note{font-size:.76rem;color:var(--warn);margin:.3rem 0 0}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style></head>

winds / GFA, SIGMET / AIRMET, PIREP et vents en altitude","kb/met/ground-deicing.md":"Ground de-/anti-icing & clean aircraft / Dégivrage / antigivrage au sol et aéronef propre","kb/met/icing.md":"Icing / Givrage","kb/met/metar.md":"METAR / SPECI","kb/met/recall.md":"Meteorology — exam traps & recall / Météorologie — pièges et rappel","kb/met/stability-clouds.md":"Temperature, moisture, stability & cloud / Température, humidité, stabilité et nuages","kb/met/taf.md":"TAF","kb/met/thunderstorms.md":"Thunderstorms & convection / Orages et convection","kb/met/turbulence-wind-shear.md":"Turbulence, wind shear & mountain wave / Turbulence, cisaillement et ondes orographiques","kb/met/weather-products.md":"Weather products & decoding / Produits météo et décodage"}}],"sections":[{"id":"01-0","card":"01","h":"Overview","a":null,"c":["study-src"],"p":["PPL","CPL"],"md":"`TARGETED CPAER REVIEW: 2026-09-06` | see `00_CPAER_REVIEW_NOTES.md` for scope and remaining gaps\n`R` rule | `F` formula | `P` proc | `T` trap | `M` memory | `!` safety | `?` verify\n`RELEASE:` `LEGAL/CYCLE-REF PROVISIONAL` | `CANONICAL SOURCE:` `flight_theory_vfr_knowledge_av_cave_v0_6.md` | `NOT FLIGHT AUTHORITY`"},{"id":"01-1","card":"01","h":"Current publication cycle","a":"current-publication-cycle","c":["nav-pubs","study-src"],"p":["PPL","CPL"],"md":"- The July 2026 cycle statement in this card is historical. Check each product’s printed effective dates and current amendments.\n- Publication schedules differ by product; do not assign a universal 56-day validity to all charts and publications.\n- `P preflight:` current publication→NOTAM→AIP SUP/AIC→airport/procedure page→aircraft data.\n- Trigger NOTAM = notice that source material changed; retrieve the referenced amendment/Supplement. It may expire while the underlying AIP SUP remains active.\n- `[NAV CANADA publication schedule; AIC 009/2026]`"},{"id":"01-2","card":"01","h":"Docs / legal","a":"docs--legal","c":["law-airworthy"],"p":["PPL","CPL"],"md":"- PIC responsible. Onboard as applicable: CofR, flight authority/CofA, current POH/AFM/supplements, journey log unless exception, required licences/medical.\n- Insurance coverage is required; the CARs do not impose one universal onboard proof-of-insurance document rule for every private flight.\n- `T:` valid document≠current pilot or airworthy aircraft. Current CFS/AIP/NOTAM/POH wins.\n- Pax brief: belts/doors/exits/no smoking/ELT/survival/sterile cockpit/emerg. `M:` SAFETY."},{"id":"01-3","card":"01","h":"Flight plan / itinerary / PIREP","a":"flight-plan--itinerary--pirep","c":["law-plan","met-gfa"],"p":["PPL","CPL"],"md":"- VFR flight plan/itinerary unless within `25 NM` dep AD. Intl = flight plan. `T:` itinerary needs responsible person.\n- Arrival report: ident + plan/itinerary + dep + arr + date/time. `T:` close it.\n- VFR pos report: ident-pos-time-alt-plan-dest. PIREP: loc/time-alt-type-cloud-temp-wind-turb-ice-rmk."},{"id":"01-4","card":"01","h":"CFS / aerodrome scan","a":"cfs--aerodrome-scan","c":["nav-pubs"],"p":["PPL","CPL"],"md":"- `P:` aerodrome ID/elevation→RWY dimensions/surface/slope→circuit direction/altitude→FREQ/MF/ATF→lighting/PCL→`PRO`→`CAUTION`→services/fuel→nearby airspace.\n- CFS sections: General | Aerodrome Directory | Planning | Radio Navigation/Communications | Military | Emergency.\n- `T:` CFS page still requires current NOTAM/AIP SUP; a Trigger NOTAM is only a pointer."},{"id":"01-5","card":"01","h":"Radio / transponder","a":"radio--transponder","c":["law-atc"],"p":["PPL","CPL"],"md":"- XPDR: `1200 ≤12500` | `1400 >12500` | `7600 comm` | `7700 emerg` | `7500 hijack`.\n- Call: who-called | who-you-are | where | what-want. Readback: clearance/runway/hold-short/alt/hdg/squawk.\n- `T:` “roger”≠cleared. listen before transmit. aviate before radio."},{"id":"01-6","card":"01","h":"Airspace","a":"airspace","c":["law-airspace"],"p":["PPL","CPL"],"md":"| Class | Memory |\n|---|---|\n| A | IFR only |\n| B | clearance + separation |\n| C | clearance |\n| D | 2-way comm |\n| E | IFR controlled / VFR no clearance |\n| F | CYR/CYA/CYD special |\n| G | uncontrolled |\n\n- `T:` chart/CFS floor/ceiling wins. class rules≠weather minima.\n- See the [VFR separation / conflict-resolution matrix](04_canadian_air_law_core_av_cave_v0_2_compact.md#vfr-separation--conflict-resolution-by-class) for who ATC separates in Classes B–E."},{"id":"01-7","card":"01","h":"VFR minima / cruise altitude","a":"vfr-minima--cruise-altitude","c":["law-airspace"],"p":["PPL","CPL"],"md":"- CTRL: flight vis `≥3 SM`, cloud `1 SM horiz / 500 ft vert`, visual reference to surface. CZ: reported ground vis also `≥3 SM`; stay `≥500 ft` from surface except takeoff/landing.\n- UNCTRL ≥`1000 AGL`: day `1 SM`, night `3 SM`, cloud `2000h/500v`.\n- UNCTRL <`1000 AGL` aeroplane: day `2 SM`, night `3 SM`, clear of cloud.\n- CRZ >`3000 AGL`: SDA=`MTRK`, NDA=`TTRK`; `000–179 odd+500 / 180–359 even+500`. `T:` track≠heading."},{"id":"01-8","card":"01","h":"MET","a":"met","c":["met-decide"],"p":["PPL","CPL"],"md":"- METAR actual; SPECI special; TAF aerodrome forecast; GFA area; FD/FB winds/temp aloft.\n- Clouds: FEW 1-2, SCT 3-4, BKN 5-7, OVC 8. Ceiling=lowest BKN/OVC/VV.\n- Stable=smooth/layer/poor vis/steady precip. Unstable=bumps/CU/showers/good vis.\n- `!:` TS/CB/gust front/wind shear/hail/icing/turb = avoid. Carb ice possible above freezing in humid partial power."},{"id":"01-9","card":"01","h":"Altimetry / density altitude","a":"altimetry--density-altitude","c":["met-atmos"],"p":["PPL","CPL"],"md":"- ISA SL: `29.92 / 1013 / 15°C`; lapse≈`2°C/1000 ft`.\n- High→low or warm→cold = actual lower. `M:` look out below.\n- DA↑ with temperature/humidity/pressure altitude↑. Weight does NOT change DA; it independently worsens takeoff/climb. Higher DA: roll↑ climb↓; TAS↑ for the same IAS.\n- `F:` PA≈elev+(29.92-altset)×1000. DA≈PA+120×(OAT-ISA). `T:` approximation only."},{"id":"01-10","card":"01","h":"Aerodynamics — lift, drag & equilibrium","a":"aerodynamics--lift-drag--equilibrium","c":["agk-theory"],"p":["PPL","CPL"],"md":"| Key | Essential recall |\n|---|---|\n| `LIFT` | Force component ⟂ relative airflow; `L=½ρV²SCL` (V = TAS); AOA controls `CL` until critical AOA/stall. |\n| `CP / CG / AC` | CP = location of resultant aero force on airfoil (moves with AOA); CG = weight acts here; AC ≈25% chord for typical subsonic airfoil (pitching moment approx constant with AOA). |\n| `MOMENT` | Pitching moment about CG = force × perpendicular arm; trimmed unaccelerated FLT requires net pitching moment `ΣM(CG)=0` (tail force may balance wing/fuselage moment). |\n| `DRAG` | Total = parasite + induced; parasite = form/pressure + skin friction + interference; induced = drag due to lift/downwash. |\n| `SPD / DRAG` | At given GW/config/ALT in steady level FLT, IAS↓→AOA/induced drag↑; IAS↑→parasite drag↑; minimum total drag ≈ max `L/D`. |\n| `EQUIL` | Straight/level/constant-speed simplified: `L=W; T=D; ΣM=0`; requires aligned thrust & negligible vertical thrust/tail geometry effects. |\n| `BANK` | Coordinated level turn: `L cosφ=W`, `n=1/cosφ`, `Vs(turn)=Vs(level)√n` (same config/weight). |\n| `AIRFOIL` | Wing cross-section: chord = LE→TE straight line; camber = curvature; thickness = upper/lower separation; `CL` varies with AOA up to critical AOA. |\n| `WASHOUT` | Geometric twist: wingtip incidence < root incidence → generally promotes root-first stall/longer aileron effectiveness; not guaranteed. |\n| `AR` | Aspect ratio `AR=b²/S` (span²/wing area); rectangular wing `AR=b/c` (span/chord). |\n| `INDUCED / AR` | At equal `CL` and span efficiency, `AR↑→CDi↓`; `CDi=CL²/(πeAR)` (e = span-efficiency factor). |\n| `T` | Washout ≠ dihedral; AR ≠ wing area; cambered airfoil may lift at geometric AOA 0°; stall at critical AOA. |\n| `T` | CP ≠ CG ≠ AC; lift vector ⟂ relative wind, not necessarily vertical; stall = critical AOA, not a fixed IAS. |\n\n- `SRC:` [FAA PHAK, Ch. 4–5 · Principles/Aerodynamics of Flight](https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/phak); general theory; aircraft POH/AFM governs performance."},{"id":"01-11","card":"01","h":"Performance / W&B","a":"performance--wb","c":["agk-perf","agk-wb"],"p":["PPL","CPL"],"md":"- Vx=altitude/distance. Vy=altitude/time. Best glide=max distance no power. Min sink=max time.\n- Headwind helps; tailwind hurts big. grass/soft/wet/snow roll↑ braking↓. +10% speed≈+21% energy.\n- `F:` moment=`W×arm`; CG=`ΣM/ΣW`. `T:` within max weight≠within CG.\n- FWD CG: stable↑ stall↑ elevator/flare↓. AFT CG: stable↓ stall/spin recovery worse."},{"id":"01-12","card":"01","h":"Navigation","a":"navigation","c":["nav-dr"],"p":["PPL","CPL"],"md":"- Track=ground path. Heading=nose. Bearing=direction to object. Course=planned line.\n- `T±V=M±D=C`; true→mag: east least, west best.\n- `F:` time=dist/GS; fuel=time×burn; 1-in-60 error°≈offtrack×60/dist flown.\n- Divert: decide early→dest→line feature→track/dist/GS/ETA/fuel→inform. Lost: climb safe→communicate→conserve→confess→comply."},{"id":"01-13","card":"01","h":"Human / emergency","a":"human--emergency","c":["agk-hf"],"p":["PPL","CPL"],"md":"- IMSAFE | PAVE | DECIDE | 5P. `T:` external pressure makes bad plan feel reasonable.\n- Hypoxia: night vision early. CO: heat off/vent/land. Meds/fatigue degrade before obvious.\n- Emerg: aviate>navigate>communicate. MAYDAY×3→ident→problem→position→intention→POB/fuel.\n- Rough engine: carb heat/mixture/fuel/mags/primer as POH/time. `T:` partial power can lure you past fields."},{"id":"01-14","card":"01","h":"Pebble","a":"pebble","c":["study-pebble"],"p":["PPL","CPL"],"md":"- AERO `L⊥relative wind | CP resultant force / CG weight / AC≈¼ chord | ΣM(CG)=0 in trim | D=parasite(form+friction+interference)+induced | slow→induced↑; fast→parasite↑ | L/Dmax≈Dmin | straight level L=W,T=D | coordinated level turn n=1/cosφ, Vs×√n | airfoil=chord/camber/thickness | washout=tip incidence↓→root-first stall generally | AR=b²/S; AR↑→induced drag↓ (equal CL/e)`\n- docs-current | close plan | 1200/1400/7600/7700/7500 | A/B/C/D/E/F/G | CTRL 3-1-500 | unctl high 1/3+2000/500 | unctl low 2/3 COC | track≠hdg | hot-high-heavy bad | high→low/cold below | W×arm | T±V=M±D=C | 1:60 | lost C5 | aviate first."},{"id":"01-15","card":"01","h":"Sources & review status","a":"sources--review-status","c":["study-src"],"p":["PPL","CPL"],"md":"See the [separate review record](../CONTENT_REVIEW.md#historical-source-review-notes) for source editions, check dates and earlier validation notes."},{"id":"02-0","card":"02","h":"Overview","a":null,"c":["study-src"],"p":["PPL","CPL"],"md":"`P` proc | `T` trap | `F` formula | `M` memory | `!` safety | `?` check | `POH>` aircraft-specific | `SOP>` school-specific\n`RELEASE:` `STUDY / AIRCRAFT-DEPENDENT` | `CANONICAL SOURCE:` `flight_training_procedures_av_cave_v0_2.md` | `NOT FLIGHT AUTHORITY`"},{"id":"02-1","card":"02","h":"Core","a":"core","c":["agk-ops"],"p":["PPL","CPL"],"md":"- `P:` ATT→PWR→TRIM. LOOKOUT→ATT→PWR→PERF→TRIM→SCAN. Outside picture primary; instruments confirm.\n- `T:` trim≠control. chasing ASI late; set attitude first."},{"id":"02-2","card":"02","h":"Taxi / pre-takeoff","a":"taxi--pre-takeoff","c":["ops-to"],"p":["PPL","CPL"],"md":"- `P:` brake chk→steer→wind ctrl→walk-ish speed→clear path. Runup/pre-TKOF before active.\n- `!:` loose items/belts/doors/fuel/trim/controls/mags/carb heat/temps-pressures."},{"id":"02-3","card":"02","h":"Normal takeoff","a":"normal-takeoff","c":["ops-to"],"p":["PPL","CPL"],"md":"- `P:` line-up runway/HDG chk→heels floor→full pwr smooth→engine green→ASI alive→rudder centreline→rotate `[POH]`→climb attitude→track runway→after-TKOF.\n- `T:` rudder keeps centreline. reject early if no full power/no ASI/rough while runway remains."},{"id":"02-4","card":"02","h":"Crosswind takeoff","a":"crosswind-takeoff","c":["ops-to"],"p":["PPL","CPL"],"md":"- `P:` aileron into wind→reduce as speed↑→rudder centreline→rotate+prevent drift→airborne crab to track runway.\n- `T:` drift≠yaw. ground track matters."},{"id":"02-5","card":"02","h":"Short / obstacle takeoff","a":"short--obstacle-takeoff","c":["ops-to"],"p":["PPL","CPL"],"md":"- `P:` POH config→max usable runway→brakes?→full pwr→green→rotate POH→`Vx` until clear→`Vy/normal`.\n- `M:` obstacle = height/distance ⇒ `Vx`.\n- `T:` Vx long climb = poor cooling/visibility; use only as needed."},{"id":"02-6","card":"02","h":"Soft / rough takeoff","a":"soft--rough-takeoff","c":["ops-to"],"p":["PPL","CPL"],"md":"- `P:` keep moving→nose light/up→liftoff in ground effect→level just clear→accelerate→climb `[POH]`.\n- `M:` unstick early, don’t climb early.\n- `T:` ground effect can lie; climb before safe speed ⇒ sink/stall."},{"id":"02-7","card":"02","h":"Climb","a":"climb","c":["ops-to"],"p":["PPL","CPL"],"md":"- `P:` attitude+pwr set→trim→lookout→temps/pressures→track. `Vy/normal`; `Vx` obstacle.\n- `T:` high nose = low energy/heat/poor vis. wind correction after departure."},{"id":"02-8","card":"02","h":"Circuit","a":"circuit","c":["ops-ldg"],"p":["PPL","CPL"],"md":"- `P:` TKOF→crosswind→downwind→base→final. default LH unless published/cleared. normal `1000 AAE`.\n- `P:` after TKOF straight ~`500 AAE`→crosswind→circuit height. downwind parallel/spacing/pre-LDG. base by wind/spacing. final centreline/profile/speed/config/aimpoint.\n- `T:` headings change with wind; ground track matters. lookout all legs."},{"id":"02-9","card":"02","h":"Normal landing","a":"normal-landing","c":["ops-ldg"],"p":["PPL","CPL"],"md":"- `P:` aligned→stabilized→speed `[POH]`→descent path→aimpoint fixed→flare→holdoff→land.\n- `T:` aimpoint up=low/undershoot; down=high/overshoot. flare high=drop; late=flat/hard."},{"id":"02-10","card":"02","h":"Crosswind landing","a":"crosswind-landing","c":["ops-ldg"],"p":["PPL","CPL"],"md":"- `P:` crab to track OR wing-low sideslip. touchdown longitudinal axis aligned. rollout: more aileron into wind as speed↓.\n- `T:` crab tracks; slip aligns. no side-load at touchdown."},{"id":"02-11","card":"02","h":"Slip","a":"slip","c":["ops-ldg"],"p":["PPL","CPL"],"md":"- `P:` forward slip=bank+opposite rudder→↑ROD no ↑IAS. side slip=wing low into wind+opposite rudder→no drift.\n- `T:` flap+slip only if POH allows. recover before flare unless side-slip XW landing."},{"id":"02-12","card":"02","h":"Go-around","a":"go-around","c":["ops-ldg"],"p":["PPL","CPL"],"md":"- `P:` power full/smooth→attitude climb→carb heat cold→stop sink→flaps staged POH→climb speed→track→communicate.\n- `M:` Power–Attitude–Config–Track–Talk.\n- `T:` trim may be nose-up; flap up too fast/low energy ⇒ sink."},{"id":"02-13","card":"02","h":"Precautionary landing","a":"precautionary-landing","c":["ops-ldg","emg-engine"],"p":["PPL","CPL"],"md":"- `P:` doubt site/wx/fuel/light/health/mech ⇒ inspect before commitment. overhead/normal circuit→safe low inspection beside runway/site→repeat if needed→land/leave.\n- `T:` don’t rush unless fuel/dark/wx force abbreviated inspection. bad site? leave early."},{"id":"02-14","card":"02","h":"Forced landing","a":"forced-landing","c":["ops-ldg","emg-engine"],"p":["PPL","CPL"],"md":"- `!:` POH emergency checklist wins.\n- `P:` engine fail=CONTROL→CARB HEAT→TRIM→FIELD→PLAN. then time permitting CAUSE→MAYDAY→PAX→SECURE→LAND.\n- `M:` Control–Field–Plan–Cause–Mayday–Pax–Secure–Land.\n- `T:` glide trimmed = judgement possible. troubleshooting never replaces landing plan."},{"id":"02-15","card":"02","h":"EFATO","a":"efato","c":["emg-engine"],"p":["PPL","CPL"],"md":"- `P:` nose down `Vg/POH`→landing path→small turns only→land. below safe turnback alt: NOSE–FIELD–LAND.\n- `T:` impossible turn = pull+bank+low AS⇒spin."},{"id":"02-16","card":"02","h":"Engine fail in circuit / from altitude","a":"engine-fail-in-circuit--from-altitude","c":["ops-ldg","emg-engine"],"p":["PPL","CPL"],"md":"- `P:` glide speed→choose runway/field→forced pattern. key pattern: high key→low key abeam→base/final.\n- `F:` high key AGL≈`2 min glide loss + 200 ft`. strong wind⇒key closer.\n- `T:` high is fixable; low usually not. flap/slip once landing assured."},{"id":"02-17","card":"02","h":"Mayday / pax / secure","a":"mayday--pax--secure","c":["emg","emg-engine"],"p":["PPL","CPL"],"md":"- `P:` MAYDAY×3→ident→problem→position→intention→POB/fuel if time. xpdr `7700`; comm fail `7600`; unlawful `7500`.\n- `P:` pax: glasses/sharp off→loose secure→belts tight→brace. secure: fuel off→mixture ICO→mags off→alt/gen off→master off after flaps set.\n- `T:` master off before electric flaps set = self-own."},{"id":"02-18","card":"02","h":"Spiral / stall","a":"spiral--stall","c":["agk-stall","emg-ua"],"p":["PPL","CPL"],"md":"- `P spiral:` throttle closed→wings level→ease out→power after AS normal. `T:` pulling first=tighter/high-g.\n- `P stall:` AoA↓ NOW→wings coordinated→power as req/full if low→recover attitude. `T:` stall=AoA, not speed; yaw aggravates spin."},{"id":"02-19","card":"02","h":"VFR nav / diversion / lost","a":"vfr-nav--diversion--lost","c":["nav-dr"],"p":["PPL","CPL"],"md":"- `P dep:` overhead/geopoint/enroute climb. set heading: over point→time hack→compass HDG→visual departure angle→DI/compass chk→checkpoint ETA.\n- `P enroute:` altitude→planned speed→trim→OAT→lean→DI→engine/fuel scan. map: orient→anticipate→confirm→pinpoint.\n- `P divert:` decide early→choose dest→line feature if possible→track/dist/GS/ETA/fuel→inform.\n- `P lost:` climb if safe→communicate→conserve→confess→comply."},{"id":"02-20","card":"02","h":"Pebble","a":"pebble","c":["agk-ops","study-pebble"],"p":["PPL","CPL"],"md":"- TKOF line-up→pwr→green→alive→rotate→climb | XW aileron wind+rudder centre | SOFT keep moving→GE accel | SHORT Vx→clear→Vy | CCT 500/1000 | LDG align-profile-speed-flare | GO power-att-config-track-talk | PREC inspect-decide | FORCED control-field-plan-cause-MAYDAY-pax-secure-land | EFATO nose-field-land | SPIRAL idle-level-ease | STALL AoA↓ | LOST C5."},{"id":"03-0","card":"03","h":"Overview","a":null,"c":["study-src"],"p":["CPL"],"md":"`TARGETED CPAER REVIEW: 2026-09-06` | see `00_CPAER_REVIEW_NOTES.md` for scope and remaining gaps\n`R` rule | `F` formula | `P` proc | `T` trap | `M` memory | `!` safety | CPL-A Canada\n`RELEASE:` `EXAM-REF PROVISIONAL` | `CANONICAL SOURCE:` `licensing_performance_operations_av_cave_v0_2.md` | `NOT FLIGHT AUTHORITY`"},{"id":"03-1","card":"03","h":"CPL-A requirements","a":"cpl-a-requirements","c":["law-lic"],"p":["CPL"],"md":"- Age `18`; valid Cat 1 medical for CPL; `80h` CPL ground school; CPAER `60%` each subject + overall.\n- Experience: `200h` aeroplane TT incl `100 PIC` + `20 PIC XC`.\n- Post-PPL training: `65h` = `35 dual + 30 solo VFR`.\n- Dual: `5 night incl 2 XC` + `5 XC incl night-XC credit` + `20 instrument` max `10 sim/FTD`.\n- Solo: `25 h skill improvement` including XC of at least `300 NM total`, full-stop landings at `3 different aerodromes other than departure`, one at least `250 NM straight-line from departure`; plus `5 h solo night` including `10 takeoffs, circuits and landings`.\n- Current non-integrated rule effective `2025-12-17`: special Newfoundland alternative uses `150 NM` straight-line, with the same 300 NM total/3 full stops. Older 300 NM radius wording is not the current 421.30 rule. Integrated-course requirements must be checked separately. [STD 421.30(4)](https://tc.canada.ca/en/corporate-services/acts-regulations/list-regulations/canadian-aviation-regulations-sor-96-433/standards/standard-421-flight-crew-permits-licences-ratings-canadian-aviation-regulations-cars)\n- Skill: flight test within `12mo` before application. `T:` daylight restriction if night req not met."},{"id":"03-2","card":"03","h":"Flight test / standard","a":"flight-test--standard","c":["law-lic","study-traps"],"p":["CPL"],"md":"- Admission: ID + licence + CPL medical proof + instructor letter ≤`30d` + ≥`75%` flying exp + written proof/deficiency review if applicable.\n- Stable VFR app: correct path/config/power/checklist/brief; ROD≤`1000 fpm`; speed `+10/-5`; small corrections; stable by `200 AGL` or overshoot.\n- `CONTEXT:` CPL flight-test evaluation criterion; not a CAR operating minimum and not the IFR stable-approach gate.\n- `T:` examiner wants safe PIC judgement, not rote manoeuvre."},{"id":"03-3","card":"03","h":"CPL mindset","a":"cpl-mindset","c":["agk-ops","agk-hf","study-traps"],"p":["CPL"],"md":"- PPL asks “can I fly?” CPL asks “should I accept/continue as paid PIC?”\n- `T:` legal≠professional. customer/time/weather/fuel/runway pressure = threat multipliers.\n- ADM: PAVE before start; 5P enroute; DECIDE abnormal."},{"id":"03-4","card":"03","h":"Privileges / ops","a":"privileges--ops","c":["law-lic","law-commercial"],"p":["CPL"],"md":"- CPL privileges depend on rating/medical/recency/aircraft/category/class/ops rules.\n- `T:` CPL≠703/704/705 authorization by itself. Hire/reward usually triggers operator/OC/ops rules unless exception.\n- PIC remains responsible for briefing, load, CG, fuel, documents, insurance."},{"id":"03-5","card":"03","h":"Planning / fuel / go-no-go","a":"planning--fuel--go-no-go","c":["law-plan","met-decide"],"p":["CPL"],"md":"- Plan: wx+NOTAM+CFS+fuel+W&B+perf+alternates/options+daylight/night+terrain/airspace.\n- Fuel: taxi/start + trip + contingency + reserve + alternate/diversion + unusable.\n- `T:` POH burn≠actual burn. marginal VFR + commercial pressure + unfamiliar terrain = trap."},{"id":"03-6","card":"03","h":"Performance / W&B","a":"performance--wb","c":["agk-perf","agk-wb"],"p":["CPL"],"md":"- Calculate, don’t guess. TO/LDG: weight/temp/pressure/elev/wind/slope/surface/config/technique.\n- `M:` hot-high-heavy-humid-tailwind-soft-uphill TO = bad stack.\n- LDG energy: KE∝V²; +10% speed≈+21% energy. Tailwind small value, large distance penalty.\n- CG=`ΣM/ΣW`; check takeoff+landing+zero-fuel if near edge. Aft CG = recovery worse; forward CG = flare authority lower."},{"id":"03-7","card":"03","h":"Handling / landings","a":"handling--landings","c":["agk-ops","ops-ldg"],"p":["CPL"],"md":"- Steep turn: clearing→entry speed/pwr→bank→back pressure→scan→rollout lead. `T:` altitude by attitude first.\n- Slow flight: coord critical. Stall: AoA↓ first, power as req, coord. Spiral: idle→wings level→ease.\n- Precision/P180: key positions + wind + energy. `T:` high fixable, low usually not.\n- Short LDG: stable speed/profile/touchdown zone; fast final eats runway. Soft LDG: protect nose, keep moving, yoke back."},{"id":"03-8","card":"03","h":"Nav / MET / systems","a":"nav--met--systems","c":["nav-dr","met-decide"],"p":["CPL"],"md":"- ETA uses actual GS. `1-in-60:` track error≈off×60/distance flown; closing angle≈off×60/distance remaining; destination correction=error+closing angle. Double-track-error is a separate intercept technique, not a universal destination correction.\n- Divert early→MTRK/dist/GS/ETA/fuel→terrain/airspace/wx→advise.\n- MET trends > snapshot. Cold front=sudden/showers/TS/gusts; warm=layer/low ceiling/steady precip.\n- Systems: fuel/oil/electrical/ignition/vacuum/pitot-static/flaps/brakes/heat/vent. `T:` checklist item without system model = weak oral."},{"id":"03-9","card":"03","h":"Emerg / human","a":"emerg--human","c":["agk-hf"],"p":["CPL"],"md":"- Forced: control→field→plan→cause→MAYDAY→pax→secure→land. EFATO: nose/Vg→land ahead-ish.\n- Declare early. Fire: POH memory items + land ASAP. CO: heat off/vent/fresh air/land.\n- Haz attitudes: anti-authority/impulsivity/invulnerability/macho/resignation. Antidotes: follow rules/not so fast/could happen/chances foolish/not helpless."},{"id":"03-10","card":"03","h":"Pebble","a":"pebble","c":["agk-ops","study-pebble"],"p":["CPL"],"md":"- 18/Cat1/80GS/CPAER60 | 200TT/100PIC/20PIC-XC | 65=35 dual+30 solo | 300NM total+3 full stops away+250NM straight-line | CPL-test stable by 200AGL | CPL≠sell flights alone | legal≠professional | calc perf | fast final bad | actual fuel≠POH | declare early | pressure=hazard."},{"id":"04-0","card":"04","h":"Overview","a":null,"c":["study-src"],"p":["PPL","CPL"],"md":"`TARGETED CPAER REVIEW: 2026-09-06` | see `00_CPAER_REVIEW_NOTES.md` for scope and remaining gaps\n`R` regulation | `S` Standard | `G` guidance | `T` trap | `M` memory | `?` check current source | live CARs checked `2026-07-10`\n`RELEASE:` `LEGAL-REF PROVISIONAL` | `NOT FLIGHT AUTHORITY`"},{"id":"04-1","card":"04","h":"Source / authority","a":"source--authority","c":["law","study-src"],"p":["PPL","CPL","IR"],"md":"- `A1:` Act/CARs/incorporated Standards = law; `A2:` current AIP/CFS/CAP/NOTAM = operational data; AIM/TP/FTM = guidance.\n- Historical full review: July 2026. September 6 review is targeted: medical validity, SVFR qualifiers, and the commercial comparison below. This is not a new verification of every CAR reference.\n- `T:` never rely on expired CAR/CFS/CAP copies."},{"id":"04-2","card":"04","h":"PIC responsibility / emergency","a":"pic-responsibility--emergency","c":["law-oprules"],"p":["PPL","CPL"],"md":"- PIC is responsible; reckless/negligent operation is prohibited. `[CAR 602.01.1–602.01.2]`\n- Emergency deviation only as necessary for safety. `[CAR 602.01.3]` `M:` authority≠absence of accountability."},{"id":"04-3","card":"04","h":"Fitness / alcohol / drugs","a":"fitness--alcohol--drugs","c":["law-medical"],"p":["PPL","CPL"],"md":"- No crew duty when unfit; no impairing drugs; no alcohol within `12 h` or while affected. `[CAR 602.02–602.03]`\n- `T:` legal medication≠fit to fly; self-ground if performance may be impaired."},{"id":"04-4","card":"04","h":"Licence validity stack","a":"licence-validity-stack","c":["law-lic"],"p":["PPL","CPL"],"md":"- Required: licence/permit + ratings + medical + recency + aircraft class/type + operation authority.\n- `M:` `LICENCE-RATING-MEDICAL-RECENCY-AIRCRAFT-OPERATION`; PPL/CPL alone is insufficient."},{"id":"04-5","card":"04","h":"Medical category / validity — aeroplane memory","a":"medical-category--validity--aeroplane-memory","c":["law-medical"],"p":["PPL","CPL"],"md":"| Privilege | Medical | Typical validity |\n|---|---|---|\n| PPL | Category `3` or valid Cat `1` | `<40`: `60 mo`; `40+`: `24 mo` |\n| CPL hire/reward | Category `1` | `12 mo`; reduced to `6 mo` if age `≥40` AND single-pilot with passengers, OR age `≥60` |\n\n- Medical validity is calculated from the first day of the month following the medical examination/declaration. `[CAR 404.04]`\n- CPL holder may exercise PPL privileges while within the applicable PPL medical-validity period. `[CAR 401.30; STD 421.30]`\n- `T:` licence document does not expire like medical privileges do."},{"id":"04-6","card":"04","h":"Recency","a":"recency","c":["law-recency"],"p":["PPL","CPL"],"md":"| Privilege | Requirement |\n|---|---|\n| general `5 y` | PIC/co-pilot in preceding `5 years`, or prescribed review + exam `[CAR 401.05(1)]` |\n| recurrent `24 mo` | approved recurrent activity, recorded `[CAR 401.05(2); STD 421.05]` |\n| passengers `6 mo` | `5 TO + 5 LDG`, same category/class; night flight requires all `5+5` at night `[CAR 401.05(2)(b)]` |\n| instrument | qualifying test/check within `24 mo`; following first day of seventh month after test/check: `6 approaches in preceding 6 mo` to specified minima; no separate `6 h` requirement; retain records `3 y` [CAR 401.05(3)–(3.2)](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-401.05.html) |\n\n- `T:` medical, general, passenger and instrument recency are separate clocks; solo legality≠passenger legality."},{"id":"04-7","card":"04","h":"Instrument-rating recency","a":"instrument-rating-recency","c":["law-recency"],"p":["CPL","IR"],"md":"- `24 months:` qualifying instrument flight test, IPC or other accepted test/check under CAR 401.05(3).\n- `Six approaches / six months:` following the first day of the seventh month after that test/check, complete six instrument approaches within the six months before the flight, in accordance with the procedure's specified minima.\n- Aircraft: actual or simulated IMC. Other options: Level B/C/D full-flight simulator of the same instrument-rating group, or an FTD under a person qualified under Standard 425.21(9).\n- `T:` no separate six-hour instrument-time requirement. The old 12-month grace period and `6–6–6` memory rule are outdated. Retain recency records for three years.\n- `M:` **24-month check; after six months, six approaches in six months.** [CAR 401.05(3)–(3.2)](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-401.05.html)"},{"id":"04-8","card":"04","h":"PPL / CPL / commercial boundary","a":"ppl--cpl--commercial-boundary","c":["law-lic","law-commercial"],"p":["PPL","CPL"],"md":"- `PPL-A:` PIC/co-pilot only for held ratings; generally no hire/reward except CAR 401.28 cases. `[CAR 401.26; 401.28(2)–(4)]`\n- Cost-share: owner/operator + non-commercial purpose + incidental passengers + reimbursement only for fuel/oil/aircraft fees. Employer/volunteer reimbursement has separate strict conditions.\n- `CPL-A:` PPL/VFR-OTT privileges; PIC single-pilot rated aeroplane or co-pilot in commercial service; instruction needs instructor qualification. Day-only restriction applies if issued without night requirement. `[CAR 401.30]`\n- Air transport and listed aerial work generally require an authorizing AOC. `[CAR 700.02]`\n- `M:` licence qualifies pilot; AOC authorizes service. `T:` equal cost split alone is insufficient."},{"id":"04-9","card":"04","h":"Maintenance approvals / abnormal occurrences","a":"maintenance-approvals--abnormal-occurrences","c":["law-airworthy","law-report"],"p":["PPL","CPL"],"md":"| CAVE | Recall / rule |\n|---|---|\n| `R` AME | Aircraft Maintenance Engineer = licensed person; maintenance-release privileges depend on licence, rating, work and CAR 571 authority. [CAR 403](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-403.01.html) · [571.11](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-571.11.html) |\n| `R` AMO | Approved Maintenance Organization = TC-approved organization/scope; **not required for every private-ACFT inspection**. [CAR 573](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-573.02.html) |\n| `R` abnormal occurrence | Hard/overweight LDG, prop strike, excessive loads/turbulence, lightning, wind/jet blast suspected damage → applicable inspection per MFR + STD 625 App G **before return to service**; release by appropriately authorized person/org. [STD 625 App G](https://tc.canada.ca/en/corporate-services/acts-regulations/list-regulations/canadian-aviation-regulations-sor-96-433/standards/standard-625-aircraft-equipment-maintenance-canadian-aviation-regulations-cars) |\n| `R` PRM | **Person Responsible for Maintenance** → AMO appoints; oversees QA/SMS corrective actions; accountable even when management functions assigned. [573.03](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-573.03.html) · [573.04](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-573.04.html) |\n| `R` PRM QUAL | MAINT performance/direct supervision **≥6 yr**, incl. **≥6 mo in preceding 2 yr**; CAR open-book **≥70%** (AME licence/legacy exemptions for test; limited AMO rating/risk-assessment exception for experience). [STD 573.04(1)](https://tc.canada.ca/en/corporate-services/acts-regulations/list-regulations/canadian-aviation-regulations-sor-96-433/standards/standard-573-approved-maintenance-organizations-canadian-aviation-regulations-cars) · [573.03(4)–(5)](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-573.03.html) |\n| `R` PRM ACK | Sign acceptance to TC **≤30 days** after appointment; delegation of specified functions in **MPM ≠ transfer of responsibility**. [573.04(1),(4)–(6)](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-573.04.html) |\n| `R` PRMCS | **Person Responsible for Maintenance Control System** → AOC holder appoints employee; **≥70% open-book** unless AME licence or legacy exemption; ensures MAINT control / removes unsafe or non-compliant ACFT from operation. [706.03](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-706.03.html) |\n| `T` PRM/PRMCS | **AMO→PRM · Air operator→PRMCS**; if same holder holds **AOC + AMO**, **same person** fills both roles [706.03(7)](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-706.03.html). PRM/PRMCS appointment **≠ AME MAINT-release privileges**. |\n| `R` MPM | Maintenance Policy Manual → AMO procedures. [573.10](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-573.10.html) |\n| `R` MCM | Maintenance Control Manual → applicable air-operator maintenance-control procedures. [706.08](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-706.08.html) |\n| `R` MSA | Maintenance Schedule Approval → where required, approved schedule/intervals; **not universal to every private ACFT**. [605.86](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.86.html) |\n| `R` DML | Deferred Maintenance List → defect tracking (where used); **DML ≠ MEL authority**. [605.09–.10](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.10.html) |\n| `T` | AME≠AMO · INSP requirement≠mandatory AMO · defect entry≠maintenance release. |\n\n`M:` **AME=licenced individual | AMO=approved org | AMO→PRM (6 yr/6 mo, test ≥70% unless exempt, TC ACK ≤30d) | AOC→PRMCS (test ≥70% unless exempt) | dual AOC+AMO→same person | MPM AMO | MCM operator | MSA intervals | DML defects | App G→INSP**."},{"id":"04-10","card":"04","h":"Aircraft operating limitations","a":"aircraft-operating-limitations","c":["law-airworthy"],"p":["PPL","CPL"],"md":"- Operate according to AFM/POH/authorized documents, limitations, markings and placards. `[CAR 602.07; 605.04–605.05]`\n- `T:` a school checklist cannot authorize something prohibited by the POH/placard."},{"id":"04-11","card":"04","h":"Aircraft icing / clean aircraft","a":"aircraft-icing--clean-aircraft","c":["law-oprules","deice"],"p":["PPL","CPL","IR"],"md":"- No takeoff with frost, ice or snow adhering to critical surfaces. `[CAR 602.11]`\n- When contamination may reasonably be expected, perform the required immediate pre-takeoff contamination inspection. `[CAR 602.11]`\n- `M:` clean-wing concept: no “little bit is fine.”"},{"id":"04-12","card":"04","h":"Core aircraft documents","a":"core-aircraft-documents","c":["law-airworthy"],"p":["PPL","CPL"],"md":"| Document | Rule |\n|---|---|\n| Certificate of Registration | carried on board `[CAR 202.26]` |\n| Flight authority / C of A / permit | in effect, conditions complied with, normally carried `[CAR 605.03]` |\n| AFM/POH if required | current applicable amendments/supplements available to crew `[CAR 605.04]` |\n| Journey log | carried unless a listed exception applies `[CAR 605.95]` |\n| Radio licence | carried if one has been issued for onboard apparatus `[CAR 605.03.1]` |\n\n- Journey-log exception: may remain behind when no landing and shutdown is planned anywhere other than departure, subject to exact CAR conditions.\n- `T:` proof of insurance is required by CAR 606.02, but “must be carried on board” is not stated as a universal CAR 202/605 document rule."},{"id":"04-13","card":"04","h":"ACFT REG / airworthiness — CoR · CoA","a":"acft-reg--airworthiness--cor--coa","c":["law-airworthy"],"p":["PPL","CPL"],"md":"| CAVE | Rule / trap |\n|---|---|\n| `R` CoR | Certificate of Registration; carry onboard; registered custody/control **≠ proof of title**. [202.26](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-202.26.html) |\n| `R` CoR fields | **REG marks · ACFT manufacturer/model/serial no. · registered owner name/address · purpose PVT/COM/State · issuing authority/date**; `purpose` = statistical designation **≠ operating AUTH or MAINT category**. [TC AC 202-002 §3, 7.2](https://tc.canada.ca/en/aviation/reference-centre/advisory-circulars/advisory-circular-ac-no-202-002) |\n| `T` CoR vs register | **MTOW stored in Canadian Civil Aircraft Register (CCAR), NOT displayed on CoR**; CCAR MTOW ≠ approved AFM/POH limit. [TC AC 202-002 §7.2(3)](https://tc.canada.ca/en/aviation/reference-centre/advisory-circulars/advisory-circular-ac-no-202-002) |\n| `R` transfer | Any transfer of legal custody/control → CoR cancelled; former registered owner informs TC **in writing ≤7 days**; Part 203 leasing provisions may apply. [202.35](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-202.35.html) |\n| `R` interim | First qualifying transfer to eligible new owner → deemed interim REG; **no second successive interim transfer**; ends at earliest trigger, including **3 mo**, new CoR or further transfer. [202.36](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-202.36.html) |\n| `R` temporary | TC-issued temporary CoR for registration processing; **≤3 mo** or earlier termination. [202.25](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-202.25.html) |\n| `R` provisional | Movement/import under **specific route/dates/conditions**, not general 3-mo authority. [202.37](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-202.37.html) |\n| `R` CoA | Certificate of Airworthiness = flight authority **≠ CoR**; transfer alone does not cancel CoA if validity/airworthiness conditions continue. [507.11](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-507.11.html) |\n| `R` special | Special CoA ≠ Flight Permit; see FLT-authority classification table below; conditions control. [CAR 507.03–.04](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/FullText.html) |\n| `T` | REG≠title≠airworthiness · CoA alone cannot replace REG · dual-state REG prohibited. |\n\n`M:` **CoR: REG marks + manufacturer/model/serial + owner name/address + purpose PVT/COM/State + issue info | MTOW NOT printed | transfer→cancel + TC ≤7d | interim ≤3mo/2nd NO | TEMP ≤3mo | PROV route-specific | CoA independent**."},{"id":"04-14","card":"04","h":"Flight authorities — CAR 507","a":"flight-authorities--car-507","c":["law-airworthy"],"p":["PPL","CPL"],"md":"| Flight authority | Classification / meaning |\n|---|---|\n| `C of A` (standard) | Aircraft conforms to approved, non-restricted type design and is safe for FLT. |\n| `Special C of A — Provisional` | Provisional type certificate. |\n| `Special C of A — Restricted` | Restricted-category type certificate or approved modified/special-purpose ACFT. |\n| `Special C of A — Amateur-built` | Built to amateur-built airworthiness requirements (AWM 549). |\n| `Special C of A — Limited` | Eligible aircraft accepted under Limited classification (e.g. certain historic/ex-military ACFT). |\n| `Special C of A — Owner-maintenance` | Eligible ACFT with owner-maintenance privileges; recreational purposes only. |\n| `Flight Permit — Experimental` | Aeronautical R&D or demonstration of compliance with airworthiness standards; not the Canadian amateur-built classification. |\n| `Flight Permit — Specific Purpose` | Defined flight of nonconforming but safe-to-fly ACFT when no CoA/Special CoA is in effect (e.g. ferry). |\n\n- `T:` Amateur-built ≠ Experimental in Canada; Normal/Utility/Aerobatic/Commuter/Transport = **type-certification categories**, not FLT-authority classifications.\n- `T PAX:` Classification alone ≠ passenger authorization; check FLT-authority conditions, operating limits, pilot privileges and applicable CARs.\n- `SRC:` [CAR 507.02–.04, .09–.11](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/FullText.html) · [AWM Standard 507.02–.04](https://tc.canada.ca/en/corporate-services/acts-regulations/list-regulations/canadian-aviation-regulations-sor-96-433/standards/standard-507-flight-authority-certificate-noise-compliance-canadian-aviation-regulations-cars)."},{"id":"04-15","card":"04","h":"AAIR — Annual Airworthiness Information Report · CAR 501","a":"aair--annual-airworthiness-information-report--car-501","c":["law-airworthy"],"p":["PPL","CPL"],"md":"| CAVE | Rule / trap |\n|---|---|\n| `R` WHO | Canadian ACFT owner → AAIR to TC; exemptions: ultra-light; RPAS without issued/applied design approval document; reported out-of-service ACFT for ≥1 reporting period, with **TC notified forthwith on return to service**. [CAR 501.01](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-501.01.html) |\n| `R` WHEN | **JAN 1–DEC 31** reporting period → submit **≤MAR 30 following year**, or **different date agreed beforehand with TC**. [CAR 501.03](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-501.03.html) |\n| `R` HOW | Individual via **CAWIS** or **Form 24-0059** (mail/fax); approved consolidated fleet report permitted. [STD 501.01](https://tc.canada.ca/en/corporate-services/acts-regulations/list-regulations/canadian-aviation-regulations-sor-96-433/standards/standard-501-annual-airworthiness-information-report-canadian-aviation-regulations-cars) |\n| `R` DATA | REG marks · total/annual **air time** · aircraft make/model/serial · base/region · REG & flight-authority type · type certificate · empty W&B/MCTOW/config · **ENG + PROP make/model/serial if applicable** · skis/floats if applicable · significant DMG/repair certification · owner signature/CAWIS authentication. [STD 501.02](https://tc.canada.ca/en/corporate-services/acts-regulations/list-regulations/canadian-aviation-regulations-sor-96-433/standards/standard-501-annual-airworthiness-information-report-canadian-aviation-regulations-cars) |\n| `R` INSP | **Except Part IV/VII ACFT**: last annual/equivalent INSP date + certifying AME licence no. or AMO approval no.; owner-maintenance/amateur-built special CoA → inspector name. [STD 501.02(1)(c)](https://tc.canada.ca/en/corporate-services/acts-regulations/list-regulations/canadian-aviation-regulations-sor-96-433/standards/standard-501-annual-airworthiness-information-report-canadian-aviation-regulations-cars) |\n| `T` PROP | **AAIR: all applicable PROP** (fixed or variable pitch) · **separate PROP tech record: variable-pitch only** [CAR 605.92](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.92.html). |\n| `T` | **AAIR ≠ annual INSP**; AAIR notice not received ≠ exemption; out-of-service declaration requires qualified reporting + return notification. |\n\n`M:` **AAIR: owner→TC ≤MAR30 after JAN–DEC (or pre-agreed date) | CAWIS/24-0059 | air time+INSP/AME/AMO exceptions+DMG+ACFT/ENG/PROP data | O/S reported→no AAIR until RTS notice | AAIR PROP any type ≠ tech-record variable-pitch PROP only**."},{"id":"04-16","card":"04","h":"Journey log / technical records — CAR 605.92–.97","a":"journey-log--technical-records--car-6059297","c":["law-airworthy"],"p":["PPL","CPL"],"md":"| CAVE | Rule / trap |\n|---|---|\n| `R` records | Owner: journey log + airframe + **each ENG** + **each variable-pitch PROP** technical record + applicable components + empty W&B report; allowed combining cases apply. [605.92](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.92.html) |\n| `T` fixed PROP | **No separate fixed-pitch PROP technical record required**; applicable MAINT still recorded. |\n| `R` journey | Air time/defects/MAINT/releases entered per prescribed schedules/timing; PIC checks defects + MAINT status. [605.94](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.94.html) |\n| `R` carry | Journey log onboard **unless CAR 605.95 exception** (e.g. no planned LDG + engine shutdown outside DEP). [605.95](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.95.html) |\n| `R` retain | Technical-record retention varies by record/STD 625; **no universal period**. [605.96](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.96.html) |\n| `R` title transfer | Transfer **all related technical records with aeronautical product at transfer**. [605.97](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.97.html) |\n\n`M:` **JL + airframe + each ENG + variable-pitch PROP only + W&B | JL onboard unless exception | title→records | MAINT entry≠release**."},{"id":"04-17","card":"04","h":"Unserviceable equipment — no MEL","a":"unserviceable-equipment--no-mel","c":["law-airworthy","law-equip"],"p":["PPL","CPL","IR"],"md":"- If equipment is required by applicable day/night VFR/IFR standard, manufacturer equipment list, certificate, AD or CAR: no takeoff with it unserviceable/removed. `[CAR 605.10]`\n- Non-required defective equipment may permit flight only if isolated/secured, placarded, and recorded as applicable. `[CAR 605.10]`\n- PIC cannot fly if safety is affected regardless of deferral mechanics. `[CAR 605.08]`\n- `M:` `REQUIRED? → SERVICEABLE? → DEFER LEGALLY? → SAFE?`"},{"id":"04-18","card":"04","h":"Day VFR equipment — power-driven","a":"day-vfr-equipment--power-driven","c":["law-equip"],"p":["PPL","CPL"],"md":"- Altimeter (`sensitive/adjustable` in controlled), ASI, independent magnetic direction, required engine/prop gauges, each main-tank fuel quantity, retractable-gear indication and required radio. `[CAR 605.14]`\n- `T:` GPS/tablet does not replace required instruments."},{"id":"04-19","card":"04","h":"Night VFR equipment — PAX / commercial","a":"night-vfr-equipment--pax--commercial","c":["law-equip"],"p":["PPL","CPL"],"md":"| CAVE | Rule / trap |\n|---|---|\n| `R` ALL night | `605.14(c–n)` day VFR EQPT + sensitive ALTM + turn/slip or turn coordinator¹ + electrical supply + spare fuses **≥50%** of accessible installed fuses **per rating**. [CAR 605.16(1)(a–e)](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.16.html) |\n| `R` NAV/light | Stabilized magnetic DG **if A/D not visible**; non-magnetic direction source **in NDA**; instrument illumination + position/anti-collision lights. [605.16(1)(f–k)](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.16.html) |\n| `R` PAX | **LDG light required when carrying PAX** under 605.16(1)(j); not exclusively commercial. [605.16(1)(j)](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.16.html) |\n| `R` commercial | Night VFR **Part VI Subpart 4 or Part VII Subparts 2–5** → **attitude indicator + VSI + ASI-system anti-ice means + OAT gauge** *in addition to 605.16(1)*; PAX **not** prerequisite. [605.16(4)](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.16.html) |\n| `R` 703 night | Air taxi ACFT at night → **≥1 LDG light**, whether PAX carried or not; in actual icing conditions → ice-formation illumination/detection means. [703.64(2)](https://www.laws-lois.justice.gc.ca/eng/regulations/sor-96-433/page-94.html) |\n| `R` 703 SE PAX | **SE + PAX + IFR or night VFR prohibited UNLESS** AOC expressly authorized **AND** STD 723.22 complied with. [703.22](https://laws.justice.gc.ca/eng/regulations/SOR-96-433/page-93.html) |\n| `R` 723 SE type | Eligible SE aeroplane: factory-built **turbine**, OR turbine + gearbox conversion under TC-approved **STC** (effective **SEP 1 2026**); prescribed ENG reliability + pilot training. **Piston SE not eligible under standard**. [STD 723.22(1)](https://tc.canada.ca/en/corporate-services/acts-regulations/list-regulations/canadian-aviation-regulations-sor-96-433/standards/standard-723-air-taxi-aeroplanes-canadian-aviation-regulations-cars) |\n| `R` 723 SE EQPT | **2 independently powered attitude indicators + 2 independent generating sources**; auto/continuous ignition; ENG chip detector; radar ALTM; compliant manual throttle/fuel-control redundancy; emergency O₂; nearest-suitable-A/D electronic NAV; emergency electrical supply for optimal glide DESC; **airborne WX radar if TS reasonably expected** (effective APR 10 2026). [STD 723.22(2)](https://tc.canada.ca/en/corporate-services/acts-regulations/list-regulations/canadian-aviation-regulations-sor-96-433/standards/standard-723-air-taxi-aeroplanes-canadian-aviation-regulations-cars) |\n| `T` | **Night VFR ≠ IFR EQPT**; `605.16(4)` commercial supplements **do not depend on PAX**; `703.22` SE PAX operation requires separate **AOC AUTH**, not merely extra EQPT. |\n\n- `¹` Qualifying **third attitude indicator** may permit slip-skid indicator substitution under 605.16(2); check exact attitude capability.\n- `M:` **Night=605.14(c–n)+ALTM+turn/slip+ELEC+spare fuses+DG/NDA conditional+instrument/ACFT lights | PAX→LDG light | COM VI-4/VII-2–5→AI+VSI+ASI anti-ice+OAT (PAX or not) | 703 night→LDG light+icing detect if icing | 703 SE PAX night→AOC AUTH+723.22 turbine/STC+special EQPT**."},{"id":"04-20","card":"04","h":"IFR equipment","a":"ifr-equipment","c":["law-equip","ifr"],"p":["CPL","IR"],"md":"- IFR requires the applicable 605.16 equipment plus attitude indicator, VSI, OAT gauge and the remaining equipment/nav/comm items in 605.18.\n- Equipment must be adequate for the route/procedure and serviceable.\n- `[CAR 605.18]`\n- `T:` “IFR-certified GPS installed” ≠ aircraft/procedure/current-database/RAIM/approval requirements all met."},{"id":"04-21","card":"04","h":"ELT — CAR 605.38–.40","a":"elt--car-6053840","c":["law-elt"],"p":["PPL","CPL","IR"],"md":"| CAVE | Rule / trap |\n|---|---|\n| `R` general | Approved ELT(s) required subject to type/operation + exceptions; modern approved ELT **406 MHz distress + 121.5 MHz homing**. [605.38](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.38.html) |\n| `R` exceptions | Glider/balloon/airship/ultralight/gyroplane; **FTU flight training ≤25 NM DEP**; flight test; specified new-ACFT delivery/manufacture; parachuting **≤25 NM**; qualifying foreign-registered 406 beacon; or compliant unserviceable-ELT operation. [605.38(3)](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.38.html) |\n| `R` over water | Where liferafts required, relevant **type S** ELT rules; passenger large ME turbojet additional ELT rules. See operation-specific table. [605.38](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.38.html) |\n| `R` UNSVCBL | Missing/defective ELT → only fly if **605.39 conditions** met; placard, records, rectification + applicable time limit. [605.39](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.39.html) |\n| `G` test | 121.5 functional test: first **5 min of UTC HR**, **≤5 sec TX**; 406 testing **MFR instructions only**. [AIM SAR 3.8](https://tc.canada.ca/en/aviation/publications/transport-canada-aeronautical-information-manual-tc-aim) |\n| `T` | FTU ≤25 NM ≠ general exemption for private flights; required ELT count/type varies. |\n\n`M:` **ELT 406+121.5 | FTU training ≤25NM exempt | other 605.38 exceptions | UNSVCBL→605.39 | test first5min UTC HR ≤5s; 406 MFR**."},{"id":"04-22","card":"04","h":"Over water · survival / Survol de l’eau · survie","a":"over-water--survival--survol-de-leau--survie","c":["law-elt"],"p":["PPL","CPL"],"md":"| Memory | Rule / example |\n|---|---|\n| Flotation trigger | Water takeoff/landing OR unable to reach shore after engine failure: one life preserver, individual flotation device or PFD per person. [602.62(1)] |\n| 50 NM / Shore | Landplane >50 NM from shore: LIFE PRESERVER for each person, even if engine-out shore reach is possible. Accessible while seated. [602.62(2),(4)] |\n| Raft / Radeau — SE | Single engine, or multi unable to maintain flight with any engine failed: rafts beyond lesser of 100 NM or 30 min at FILED cruise speed from suitable emergency landing site. [602.63(1)] |\n| Raft / Radeau — ME | Multi able to maintain flight with any engine failed: lesser of 200 NM/60 min. Transport-category aeroplane exception: up to lesser of 400 NM/120 min. [602.63(2)–(3)] |\n| Calculation / Calcul | SE threshold = min(100, filed kt ×0.5) NM. Filed 120 kt →60 NM; 180 kt →90 NM; 240 kt →100 NM. Beyond threshold triggers raft carriage. |\n| Capacity / Capacité | Total raft rated capacity covers everyone. Stow accessible, visibly marked near exit; attached kit: shelter, water/purification, visual distress signals, suited to area/season. [602.63(6)] |\n| Shore ≠ landing site | Flotation test uses shore reach/distance; raft test uses a SUITABLE EMERGENCY LANDING SITE. Crossing width is not automatically distance from that site. |\n| 703 seaplane | 703.83: inflatable flotation worn on/above water; COM procedures and PIC instruction. Exception: person on stretcher, incubator or similar device. Not a blanket rule for every private landplane. |\n| Land survival / Survie terre | 602.61: FIRE + SHELTER + WATER + SIGNAL, for everyone and climate. 25-NM exception requires staying within 25 NM of departure aerodrome AND surface-station radio capability throughout. Other listed exceptions exist. |\n| Planning / Préparation | Recommendation: wear suitable inflatable flotation, brief evacuation and inflate only outside; assess cold-water exposure and rescue delay. Equipment carriage alone does not make a crossing safe. |"},{"id":"04-23","card":"04","h":"Oxygen / Oxygène — CAR 605.31–32","a":"oxygen--oxygène--car-6053132","c":["law-oxygen"],"p":["PPL","CPL","IR"],"md":"| Memory | Rule / example |\n|---|---|\n| 10–13 / 30 | Cabin-pressure altitude >10,000 to ≤13,000 ft: crew USE oxygen after 30 min. |\n| Supply / Réserve | Unpressurized: supply for ALL crew +10% passengers (at least 1 passenger), for time beyond 30 min in that band. |\n| Above / Au-dessus 13,000 | All aboard USE oxygen throughout. Unpressurized supply: all aboard, entire time; air transport service minimum 1 hour. |\n| Boundaries / Seuils | Exactly 13,000 ft remains in the 30-min band. At 13,100 ft, no 30-min grace. Cabin pressure altitude, not height AGL. |\n| Pressurized / Pressurisé | Size emergency supply for worst-point decompression, descent profile and suitable landing aerodrome: use 605.31(2) table and notes; do not reuse unpressurized quantities. |\n| Pilot mask / Masque | Pilot at controls: mask required at/above FL250 without quick-donning masks; above FL410 with quick-donning masks. |"},{"id":"04-24","card":"04","h":"Pre-flight information","a":"pre-flight-information","c":["law-oprules","law-plan"],"p":["PPL","CPL"],"md":"- PIC must be familiar with available information appropriate to intended flight. `[CAR 602.71]`\n- For flight away from aerodrome vicinity: includes weather, fuel, alternatives, runway/airport suitability, delays and relevant operational information.\n- `M:` `WX-NOTAM-FUEL-W&B-PERF-ROUTE-AIRSPACE-RUNWAY-ALTERNATES`."},{"id":"04-25","card":"04","h":"Flight plan / itinerary","a":"flight-plan--itinerary","c":["law-plan"],"p":["PPL","CPL","IR"],"md":"- IFR: file IFR flight plan, except itinerary permitted in specified cases wholly/partly outside controlled airspace or where facilities inadequate. `[CAR 602.73]`\n- VFR: flight plan or itinerary unless flight remains within `25 NM` of departure aerodrome. `[CAR 602.73]`\n- International flight: flight plan.\n- Flight plan filed with ATS/CARS; itinerary may be filed with responsible person, ATS or CARS. `[CAR 602.75]`\n- Report required changes and file arrival report/close as required. `[CAR 602.76–602.78]`\n- `T:` landing does not automatically close every plan/itinerary."},{"id":"04-26","card":"04","h":"Fuel requirements","a":"fuel-requirements","c":["law-plan"],"p":["PPL","CPL","IR"],"md":"| Flight | Required fuel after reaching destination |\n|---|---|\n| VFR aeroplane day | normal cruise `30 min` |\n| VFR aeroplane night | normal cruise `45 min` |\n| IFR prop, no alternate | approach + missed + `45 min` |\n| IFR prop, alternate | approach + missed → alternate → land + `45 min` |\n| IFR turbojet/helicopter | same structure + `30 min` |\n\n- Add taxi and foreseeable delays from weather, routing, traffic, system failure and other foreseeable conditions. `[CAR 602.88]`\n- `T:` reserve begins after all required legs; legal reserve is not a target landing fuel."},{"id":"04-27","card":"04","h":"Baggage / cargo","a":"baggage--cargo","c":["law-oprules","agk-wb"],"p":["PPL","CPL"],"md":"- Carry-on baggage, equipment and cargo must be stowed/secured so they cannot shift, obstruct controls/exits or injure occupants. `[CAR 602.86]`\n- Respect W&B, baggage-area structural limits and dangerous-goods rules.\n- `T:` within total weight ≠ correctly secured or within CG."},{"id":"04-28","card":"04","h":"Passenger briefing","a":"passenger-briefing","c":["law-oprules"],"p":["PPL","CPL"],"md":"- Before takeoff brief exits, seat belts/harnesses/restraints, seats/tables, baggage, oxygen where applicable and smoking restrictions. `[CAR 602.89]`\n- Where applicable include life preservers, first-aid/survival equipment, ELT and raft information.\n- `M:` brief normal use + emergency action, not just “seat belt on.”"},{"id":"04-29","card":"04","h":"Safety belts / restraints","a":"safety-belts--restraints","c":["law-elt","law-oprules"],"p":["PPL","CPL","IR"],"md":"- Seats, safety belts and restraint systems must meet 605.22–605.28 requirements.\n- PIC ensures passengers are instructed and comply during required phases/conditions.\n- `T:` one belt for two persons is not the default; child-restraint provisions are specific."},{"id":"04-30","card":"04","h":"Right-of-way / collision avoidance","a":"right-of-way--collision-avoidance","c":["law-oprules"],"p":["PPL","CPL"],"md":"- Distress has priority; ROW never removes collision-avoidance duty. `[CAR 602.19; 602.21]`\n- Converging: traffic on right has ROW; head-on: both right; overtaking: pass/keep clear right.\n- Powered aeroplane gives way to airship/glider/balloon/towing aircraft; landing aircraft has ROW, but lower aircraft may not cut in on final.\n- `M:` `RIGHT-RIGHT-RIGHT`. `T:` ATC clearance does not remove see-and-avoid in VMC."},{"id":"04-31","card":"04","h":"Minimum altitudes / distances","a":"minimum-altitudes--distances","c":["law-oprules"],"p":["PPL","CPL"],"md":"- Built-up area/open-air assembly: altitude allowing emergency landing without hazard and aeroplane at least `1000 ft` above highest obstacle within `2000 ft` horizontally. `[CAR 602.14]`\n- Elsewhere: at least `500 ft` from any person, vessel, vehicle or structure. `[CAR 602.14]`\n- Exceptions include takeoff/approach/landing and authorized low-altitude operations under 602.15.\n- `T:` “500 AGL” is not the wording; it is `500 ft from` persons/vessels/vehicles/structures."},{"id":"04-32","card":"04","h":"Aerobatic manoeuvres","a":"aerobatic-manoeuvres","c":["law-oprules"],"p":["PPL","CPL"],"md":"- Restrictions include designated airspace/areas, minimum visibility, cloud clearance, altitude and passenger conditions. `[CAR 602.27–602.28]`\n- Aircraft POH/category/W&B limitations also apply.\n- `T:` POH-approved spin ≠ legal anywhere/any altitude/with passengers."},{"id":"04-33","card":"04","h":"ATC clearances / instructions","a":"atc-clearances--instructions","c":["law-atc"],"p":["PPL","CPL","IR"],"md":"- Comply with ATC clearances/instructions received and accepted, except emergency authority or amended clearance. `[CAR 602.31]`\n- If unable/unsafe: advise ATC immediately; do not silently improvise.\n- `T:` clearance ≠ information; “roger” does not mean approval to deviate."},{"id":"04-34","card":"04","h":"Cruising altitudes","a":"cruising-altitudes","c":["law-airspace"],"p":["PPL","CPL","IR"],"md":"- At more than `3000 ft AGL`, use appropriate cruising altitude/flight level based on track, unless otherwise authorized/required. `[CAR 602.34]`\n- VFR: `000–179°` odd thousands +`500`; `180–359°` even thousands +`500`.\n- Southern Domestic Airspace uses magnetic track; Northern Domestic Airspace true track.\n- `T:` track, not heading."},{"id":"04-35","card":"04","h":"Aerodrome / MF operations","a":"aerodrome--mf-operations","c":["law-airspace","ops-ldg"],"p":["PPL","CPL"],"md":"- Ensure suitability/no collision; observe/conform to or avoid circuit; left turns unless CFS/ATC says right; comply CFS/NOTAM; into wind where practicable. Controlled aerodrome: clearance to taxi/TKOF/land. `[CAR 602.96]`\n- No flight below `2000 ft over an aerodrome` except listed operations/ATC authorization; separate from circuit and CAR 602.14 minima. `[CAR 602.96(4)]`\n- MF procedures/reports: CAR 602.97–602.104 + current CFS frequency/area/hours. `T:` uncontrolled≠unregulated; ATF calls≠MF mandatory reports."},{"id":"04-36","card":"04","h":"VFR minima — controlled","a":"vfr-minima--controlled","c":["law-airspace"],"p":["PPL","CPL"],"md":"- Visual reference to surface.\n- Flight visibility `≥3 SM`.\n- Cloud distance `≥500 ft vertical + 1 SM horizontal`.\n- In control zone: reported ground visibility `≥3 SM`; except takeoff/landing, aircraft `≥500 ft` from surface.\n- `[CAR 602.114]`"},{"id":"04-37","card":"04","h":"VFR minima — uncontrolled aeroplane","a":"vfr-minima--uncontrolled-aeroplane","c":["law-airspace"],"p":["PPL","CPL"],"md":"| Height | Day | Night | Cloud |\n|---|---:|---:|---|\n| `≥1000 AGL` | `1 SM` | `3 SM` | `500 ft vert / 2000 ft horiz` |\n| `<1000 AGL` | `2 SM` | `3 SM` | clear of cloud |\n\n- Visual reference to surface required. `[CAR 602.115]`\n- `T:` these are legal minima, not personal minima."},{"id":"04-38","card":"04","h":"Special VFR","a":"special-vfr","c":["law-airspace"],"p":["PPL","CPL"],"md":"- Only within a control zone; pilot requests and obtains ATC authorization.\n- Aeroplane flight visibility `≥1 SM`; helicopter `≥1/2 SM`.\n- Remain clear of cloud and in visual reference to surface. Reported ground visibility and radio conditions also apply. Night aeroplane SVFR authorization is to land at destination; do not generalize it to night departures. `[CAR 602.117; AIM RAC 2.7.3]`\n- `T:` SVFR is not permission to enter cloud/IMC; ATC traffic capacity and conditions still apply."},{"id":"04-39","card":"04","h":"VFR OTT","a":"vfr-ott","c":["law-airspace"],"p":["PPL","CPL"],"md":"- Day cruise only; vertical cloud separation `≥1000 ft`; between layers at least `5000 ft`; flight visibility `≥5 SM`; destination weather and rating/equipment conditions apply. `[CAR 602.116; 401.44–401.45; 605.15]`\n- `T:` PPL alone does not automatically include VFR OTT privilege."},{"id":"04-40","card":"04","h":"IFR general","a":"ifr-general","c":["law-airspace","ifr"],"p":["CPL","IR"],"md":"- IFR operation requires IFR flight plan/clearance where applicable, instrument rating/current privileges, appropriate equipment and compliance with IFR minima/procedures. `[CAR 602.121+]`\n- Alternate, takeoff, approach, landing and approach-ban rules are separated in CAR 602.122–602.131.\n- `T:` advisory visibility, approach-ban threshold and DA/MDA visual-reference rule are three different concepts."},{"id":"04-41","card":"04","h":"Airspace entry memory","a":"airspace-entry-memory","c":["law-airspace"],"p":["PPL","CPL"],"md":"| Class | VFR memory |\n|---|---|\n| A | IFR only |\n| B | ATC clearance + specified equipment/qualification |\n| C | ATC clearance before entry |\n| D | establish two-way communication before entry |\n| E | no VFR clearance generally; IFR controlled |\n| F | special-use rules: `CYR/CYA/CYD` |\n| G | uncontrolled; CARs still apply |\n\n- Check current chart/CFS for floor, ceiling, transponder and communication requirements."},{"id":"04-42","card":"04","h":"VFR separation / conflict resolution by class","a":"vfr-separation--conflict-resolution-by-class","c":["law-airspace","law-atc"],"p":["PPL","CPL"],"md":"| Class | VFR entry | Airborne ATC service |\n|---|---|---|\n| A | prohibited | IFR only; `SEP ALL` |\n| B | clearance; `CVFR` | `SEP ALL`, incl VFR–VFR |\n| C | clearance | `SEP` IFR–IFR; `CR` IFR–VFR as needed; `TFC` all; VFR–VFR `CR O/R` after TFC |\n| D | 2-way comm | `SEP` IFR–IFR only; `TFC` all; workload/equipment permitting: IFR–VFR `CR`, VFR–VFR `CR O/R` |\n| E | none generally; MF/XPDR rules may apply | `SEP` IFR–IFR only; VFR `TFC O/R` workload/equipment permitting; may stop without notice |\n| F | obey `CYR/CYA/CYD` | surrounding class unless specified; may be controlled, uncontrolled or both |\n| G | none | no ATC control/`SEP`; see-and-avoid + CARs |\n\n- `SEP` formal separation | `CR` conflict resolution for identified aircraft in ATC comm | `TFC` traffic information | `O/R` on request.\n- `C/D → E` when ATC unit closed: check published hours + NOTAM.\n- `C/D runway:` `SEP ALL`; this does **not** mean airborne VFR–VFR separation.\n- `T:` clearance/TFC/flight following ≠ collision-avoidance transfer. Lookout + right-of-way remain.\n- Sources: [TC AIM 2026-2 RAC 2.8.1–2.8.7](https://tc.canada.ca/sites/default/files/2026-10/aim-2026-2_rac_en.pdf) · [Standard 821.01 definitions](https://tc.canada.ca/en/corporate-services/acts-regulations/list-regulations/sor-96-433/standards/standard-821-canadian-domestic-air-traffic-control-separation-standards-canadian-aviation-regulations-cars)"},{"id":"04-43","card":"04","h":"ATS surveillance / wake / RVSM","a":"ats-surveillance--wake--rvsm","c":["law-atc"],"p":["CPL"],"md":"| CAVE | Rule / trap |\n|---|---|\n| `G` ATS SEP | Surveillance **5 NM standard / 3 NM authorized terminal**; other minima may apply. [AIM RAC](https://tc.canada.ca/en/aviation/publications/transport-canada-aeronautical-information-manual-tc-aim) |\n| `G` vertical | **1,000 ft below FL290**; RVSM **FL290–FL410 incl. 1,000 ft** for approved ACFT; higher non-RVSM generally **2,000 ft**. |\n| `G` WAKE CAT | **S=A380 · H>136t · M>7t to <136t · L≤7t**. |\n| `G` WAKE NM | Leader→follower: **S→S/H/M/L=4/6/7/8 · H→H/M/L=4/5/6 · M→L=4**; unspecified pairs still need normal ATS SEP. |\n| `G` TKOF MIN | Specified same/close-parallel THLD: **H→following 2 min**; specified INTXN/downstream: **3 min**; **M→L same THLD advisory, INTXN 3 min**. Check configuration. |\n| `G` WAKE AVOID | Strongest heavy+clean+slow; vortex ↓ and downwind drift; avoid behind/below/downwind · jet blast/propwash ≠ vortex WAKE. |\n\n`M:` **ATS 5/3NM | RVSM FL290–410 1,000ft | WAKE S 4/6/7/8 · H 4/5/6 · M→L 4NM | H TKOF 2/3min cases**."},{"id":"04-44","card":"04","h":"TWR light signals — NORDO","a":"twr-light-signals--nordo","c":["law-atc","emg-comms"],"p":["PPL","CPL"],"md":"| Signal | IN FLT | ON GND |\n|---|---|---|\n| Steady GN | LDG CLNC | TKOF CLNC |\n| Flash GN | Return for LDG (not CLNC) | Taxi CLNC |\n| Steady RED | Give way / circle | STOP |\n| Flash RED | A/D unsafe / NO LDG | Taxi clear LDG area / RWY |\n| Flash WHITE | — | Return starting point |\n| Alternating RED/GN | Extreme caution | Extreme caution |\n\n- `P:` ACK IN FLT → rock wings; night → flashing lights as prescribed. [TC AIM RAC](https://tc.canada.ca/en/aviation/publications/transport-canada-aeronautical-information-manual-tc-aim).\n- `T:` Flash GN ≠ LDG CLNC; **steady GN** = LDG CLNC.\n- `M:` **IN FLT GN steady=LDG/flash=return · RED steady=circle/flash=unsafe | GND GN steady=TKOF/flash=taxi · RED steady=STOP/flash=clear · WHITE=return**."},{"id":"04-45","card":"04","h":"Night definition","a":"night-definition","c":["law-oprules"],"p":["PPL","CPL"],"md":"- `Night` = period from end of evening civil twilight to beginning of morning civil twilight. `[CAR 101.01]`\n- `T:` sunset is not the legal start of night; use official twilight data."},{"id":"04-46","card":"04","h":"TSB occurrence reporting — AIM GEN 3.3–3.4","a":"tsb-occurrence-reporting--aim-gen-3334","c":["law-report"],"p":["PPL","CPL"],"md":"| CAVE | Rule / trap |\n|---|---|\n| `R` accident | Fatal/serious injury from ACFT operation; significant structural DMG affecting strength/performance/flight characteristics (specified minor/engine-only exclusions); missing/inaccessible ACFT. [AIM GEN 3.3](https://tc.canada.ca/en/aviation/publications/transport-canada-aeronautical-information-manual-tc-aim) |\n| `R` incident scope | Mandatory listed incidents for **MCTOW >2,250 kg OR ACFT under Part VII AOC**; **not** every private light-ACFT malfunction. |\n| `R` examples | ENG failure/shutdown · fire/smoke · control difficulties · RWY excursion/gear-up · crew incapacitation · depressurization/emerg DESC · fuel divert/priority · wrong fuel · collision/SEP loss · emergency priority · dropped slung load · dangerous goods release. |\n| `R` who/when | Owner/operator/PIC/crew/ATS direct knowledge → TSB **ASAP by quickest means**; remaining info **as available ≤30d**. |\n| `R` evidence | Preserve; safety measures permitted, document/advise TSB as practicable. |\n| `T` | Accident duty ≠ incident threshold; **2,250 kg** applies listed incident class, not accidents. |\n\n`M:` **TSB accident: fatal/serious/structural DMG/missing | incident >2,250kg OR Part VII | ASAP fastest; balance ≤30d | preserve evidence**."},{"id":"04-47","card":"04","h":"High-yield traps","a":"high-yield-traps","c":["law","study-traps"],"p":["PPL","CPL"],"md":"- PIC vs ATC | PPL cost-share conditions | CPL≠AOC | medical vs `5y/24mo/6mo` recency | night passenger recency | `500 ft from`≠`500 AGL`.\n- Controlled `3-1-500`; uncontrolled high `1D/3N-2000/500`; low `2D/3N-clear`; `25 NM` plan exemption; fuel `30D/45N`; MF≠ATF; SVFR pilot-request/control-zone/COC/surface."},{"id":"04-48","card":"04","h":"Pebble","a":"pebble","c":["law","study-pebble"],"p":["PPL","CPL","IR"],"md":"- `PIC responsible / emergency only as necessary`\n- fit + `12h bottle-to-throttle`\n- recency `5y / 24mo / pax 5TO+5LDG in 6mo / IFR 24mo check; after six months, 6 apps in 6mo; no 6h minimum`\n- PPL cost-share = owner/operator + non-commercial purpose + incidental pax + fuel/oil/fees only\n- CPL pilot privilege ≠ AOC\n- docs `CoR + flight authority + current AFM + journey log if required`\n- ACFT REG `CoR: marks/MFR model/SN/owner name+address/purpose/issue | NO MTOW; purpose≠AUTH | transfer→cancel; TC ≤7d | interim ≤3mo/no second transfer | CoA separate`\n- FLT AUTH `CoA=standard | Special CoA=provisional/restricted/amateur-built/limited/owner-maintenance | Flight Permit=experimental/specific purpose | type-cert category≠flight authority | PAX depends on conditions+limits+pilot privileges`\n- TECH `journey log + airframe + each ENG + variable-pitch PROP only; technical records follow title transfer`\n- AAIR `owner→TC ≤MAR30 after calendar yr (or pre-agreed date) | CAWIS/24-0059 | hours+INSP (except IV/VII)+DMG+ENG/PROP data any pitch | out-of-service exemption if reported; RTS notify TC | AAIR≠annual INSP`\n- MAINT
