s |\n|---|---|---|\n| `MI` | Shallow; weather descriptor | Mince; près du sol |\n| `BC` | Patches; weather descriptor | Bancs; descripteur météo |\n| `PR` | Partial; weather descriptor | Partiel; descripteur météo |\n| `DR` | Drifting; raised below 2 m | Chasse basse; soulevé à moins de 2 m |\n| `BL` | Blowing; raised to 2 m or more | Chasse élevée; soulevé à 2 m ou plus |\n| `SH` | Shower(s) | Averse(s) |\n| `FZ` | Freezing | Verglaçant; givrant |\n| `MIFG` | Shallow fog; ground-hugging | Brouillard mince; près du sol |\n| `PRFG` | Partial fog; covers part of aerodrome | Brouillard couvrant une partie de l'aérodrome |\n| `VCFG` | Fog in the vicinity | Brouillard au voisinage |\n| `VCTS` | Thunderstorm in the vicinity | Orage au voisinage |\n| `VCSH` | Showers in the vicinity | Averses au voisinage |\n| `TSRA` | Thunderstorm with rain | Orage avec pluie |\n| `TSSN` | Thunderstorm with snow | Orage avec neige |\n| `TSGR` | Thunderstorm with hail | Orage avec grêle |\n| `TSGS` | Thunderstorm with snow pellets | Orage avec neige roulée |\n| `SHGR` | Hail showers | Averses de grêle |\n| `+FC` | Tornado or waterspout | Tornade ou trombe marine |\n| `DU` | Dust | Poussière |\n| `SA` | Sand | Sable |\n| `VA` | Volcanic ash | Cendres volcaniques |\n| `UP` | Unknown precipitation; AUTO | Précipitations indéterminées; AUTO |\n| `DS` | Duststorm | Tempête de poussière |\n| `SS` | Sandstorm; weather code | Tempête de sable; code météo |"},{"id":"A-13","card":"A","h":"Weather report fields & remarks / Champs et remarques météo","a":null,"c":["met-products","met-metar","study-abbrev"],"p":["PPL","CPL","IR","ME"],"md":"| Code | English | Français |\n|---|---|---|\n| `VV` | Vertical visibility; obscured ceiling | Visibilité verticale; plafond obscurci |\n| `NCD` | No cloud detected; automated sensor | Aucun nuage détecté; capteur automatique |\n| `RMK` | Remarks | Remarques |\n| `SLP` | Sea-level pressure; hPa | Pression au niveau de la mer; hPa |\n| `PRESFR` | Pressure falling rapidly | Pression en baisse rapide |\n| `PRESRR` | Pressure rising rapidly | Pression en hausse rapide |\n| `FROIN` | Frost on indicator | Gelée blanche sur l'indicateur |\n| `CCA` | First corrected report | Premier compte rendu corrigé |\n| `CCB` | Second corrected report | Deuxième compte rendu corrigé |\n| `CIGS` | Ceilings; plural of CIG | Plafonds; pluriel de CIG |\n| `00000KT` | Calm wind | Vent calme |\n| `dddVddd` | Wind-direction extremes; true degrees | Directions extrêmes du vent; degrés vrais |\n| `P6SM` | Visibility greater than 6 SM | Visibilité supérieure à 6 milles terrestres |\n| `M1/4SM` | Visibility less than 1/4 SM | Visibilité inférieure à 1/4 mille terrestre |\n| `A####` | Altimeter setting; hundredths of inHg | Calage altimétrique; centièmes de po Hg |\n| `M (temperature)` | Minus; negative temperature | Moins; température négative |\n| `Rxx/...FT` | Runway visual range; feet | Portée visuelle de piste; pieds |\n| `/U (RVR)` | Upward RVR trend | Tendance à la hausse de la RVR |\n| `/D (RVR)` | Downward RVR trend | Tendance à la baisse de la RVR |\n| `/N (RVR)` | No distinct RVR trend | Aucune tendance nette de la RVR |"},{"id":"A-14","card":"A","h":"Additional CFS / IFR wording / Autres termes CFS / IFR","a":null,"c":["nav-pubs","study-abbrev"],"p":["IR"],"md":"| Code | English | Français |\n|---|---|---|\n| `INTL AIR` | International Air Carrier | Transporteur aérien international |\n| `MIL` | Military | Militaire |\n| `VDF` | VHF direction finder | Radiogoniomètre VHF |\n| `UDF` | UHF direction finder | Radiogoniomètre UHF |\n| `SELCAL` | Selective calling system | Système d'appel sélectif |\n| `RONLY` | Receiver only | Récepteur seulement |\n| `(V)` | Emergency frequency 121.5 MHz | Fréquence d'urgence 121,5 MHz |\n| `(U)` | Emergency frequency 243.0 MHz | Fréquence d'urgence 243,0 MHz |\n| `(E)` | Both emergency frequencies | Les deux fréquences d'urgence |\n| `LVOP` | Low Visibility Operations Plan | Plan d'exploitation par faible visibilité |\n| `RVOP` | Reduced Visibility Operations Plan | Plan d'exploitation par visibilité réduite |\n| `RVR` | Runway Visual Range | Portée visuelle de piste |\n| `RNAV` | Area Navigation | Navigation de surface |\n| `RNP` | Required Navigation Performance | Qualité de navigation requise |\n| `GNSS` | Global Navigation Satellite System | Système mondial de navigation par satellite |\n| `MDA` | Minimum Descent Altitude | Altitude minimale de descente |\n| `DH` | Decision Height | Hauteur de décision |\n| `MOCA` | Minimum Obstruction Clearance Altitude | Altitude minimale de franchissement d'obstacles |\n| `MVA` | Minimum Vectoring Altitude | Altitude minimale de guidage radar |\n| `SID` | Standard Instrument Departure | Départ normalisé aux instruments |\n| `STAR` | Standard Terminal Arrival Route | Route d'arrivée normalisée en région terminale |\n| `AIP` | Aeronautical Information Publication | Publication d'information aéronautique |\n| `CAP` | Canada Air Pilot | Canada Air Pilot |\n| `VNC` | VFR Navigation Chart | Carte aéronautique de navigation VFR |\n| `VTA` | VFR Terminal Area Chart | Carte de région terminale VFR |"},{"id":"A-15","card":"A","h":"Memory traps & examples / Pièges et exemples","a":null,"c":["study-pebble","study-traps","study-abbrev"],"p":["PPL","CPL","IR","ME"],"md":"**Basic-code context / Contexte des codes de base** · ACFT = aircraft / aéronef; AD and A/D = aerodrome / aérodrome; APRT = airport / aéroport. AP also means anomalous propagation in meteorology / AP signifie aussi propagation anormale en météo. CFS rpt = report / compte rendu; MANAB RPT = repeat / répéter. CFS hr = hour, HR = high-level air route / CFS hr = heure, HR = route aérienne de haute altitude.\n\n**Fog & code-building / Brouillard et composition** · MIFG = MI shallow + FG fog / MI mince + FG brouillard. BCFG = banks / bancs; PRFG = partial aerodrome coverage / couverture partielle de l’aérodrome; VCFG = nearby / au voisinage; FZFG = freezing fog / brouillard givrant. MI/BC/PR apply to FG / s’emploient avec FG. No TS+SH combined descriptor / pas de double descripteur TS+SH. SS: weather sandstorm, CFS sunset / météo tempête de sable, CFS coucher du soleil. M: temperature minus; bearing magnetic; RVR below measurement range / température négative; relèvement magnétique; RVR sous la plage de mesure.\n\n\n**Context / Contexte** · ACC: weather = altocumulus castellanus; CFS = Area Control Centre / météo = altocumulus castellanus; CFS = centre de contrôle régional. NS: nimbostratus / Nova Scotia (Nouvelle-Écosse). GS: snow pellets / glide slope = neige roulée / alignement de descente. NR: near / number = près / numéro. WI: within; also Wisconsin / à l’intérieur de; aussi Wisconsin.\n\n**Clouds / Nuages** · FEW 1-2; SCT 3-4; BKN 5-7; OVC 8 oktas. Ceiling / plafond = lowest / plus basse couche BKN-OVC, or / ou visibilité verticale. METAR-TAF cloud heights / hauteurs des nuages: hundreds of feet above aerodrome / centaines de pieds au-dessus de l’aérodrome. GFA bases-tops / bases-sommets: generally / généralement ASL; ceilings / plafonds: AGL.\n\n**Weather decoding / Décodage météo** · FZ freezing / verglaçant; SH showers / averses; TS thunderstorm / orage. - light / léger; no sign / sans signe: moderate / modéré; + heavy / fort, where intensity applies / lorsque l’intensité s’applique. -SHRA = light rain showers / averses de pluie légères. SHGS: snow-pellet showers; may also mean small hail <5 mm / averses de neige roulée; aussi petite grêle <5 mm.\n\n**Forecast changes / Évolution des prévisions** · FM: new prevailing conditions from time / nouvelles conditions dominantes dès l’heure indiquée. BECMG: transition during interval / transition pendant l’intervalle. TEMPO: each event <1 h; total <half the interval / chaque épisode <1 h; total <la moitié de l’intervalle. NSW: no significant weather; cloud may remain / aucun temps significatif; des nuages peuvent subsister.\n\n**Access & radio / Accès et radio** · PN notify / préavis; PPR permission / permission. O/R request / sur demande; O/T other times / aux autres heures; O/S out of service / hors service. MF-ATF = frequency-area designation / désignation de fréquence-zone. FSS-RAAS-CARS-AU-UNICOM = service / service. MF may have no active ground station / MF possible sans station au sol active. LWIS: wind, temperature, dew point, altimeter / vent, température, point de rosée, calage altimétrique.\n\n**Time & symbols / Heures et symboles** · 10-04Z: 1000 to 0400 next day / 10 h à 4 h le lendemain, UTC. ‡: UTC times 1 h earlier in daylight-saving time / heures UTC avancées de 1 h à l’heure d’été. UTC-5(4): standard minus 5; daylight minus 4 / normale moins 5; été moins 4. (V) 121.5 MHz; (U) 243.0 MHz; (E) both / les deux. INTL AIR: International Air Carrier / transporteur aérien international. (bil) after COMM / après COMM: all listed services / tous les services listés; before one service / devant un service: that service / ce service.\n\n**Runway distances / Distances de piste** · TORA = run / roulement. TODA = TORA + clearway / prolongement dégagé. ASDA = TORA + stopway / prolongement d’arrêt. LDA = landing / atterrissage. Displaced threshold / seuil décalé: landing distance reduced in that direction / distance d’atterrissage réduite dans ce sens. DME = slant range / distance oblique. MEHT = eye height, not wheel clearance / hauteur de l’œil, pas marge des roues. NDA VOR-TACAN: true north / nord vrai. FL: 29.92 inHg / 1013.2 hPa.\n\n**Servicing S / Entretien S** · 1 store / entreposage; 2 minor repairs / réparations mineures; 3 major repairs / réparations majeures; 4 extended parking / stationnement prolongé; 5 tie-down / arrimage; 6 plug-in / prises; 7 pick-up-drop-off only / embarquement-débarquement seulement. Chain / chaîne: store-small-major-park-tie-plug-drop / ranger-mineur-majeur-parquer-attacher-brancher-déposer.\n\n**Public facilities PF / Installations publiques PF** · Location / lieu: A terminal / aérogare; B on aerodrome / sur l’aérodrome; C within / à moins de 5 NM; D within / à moins de 30 NM. 1 phone / téléphone; 2 food / restauration; 3 taxi / taxi; 4 medical / services médicaux; 5 hotel / hôtel; 6 car rental / location auto; 7 public Wi-Fi / Wi-Fi public; 8 public Internet access / accès Internet public. S 5 = tie-down / arrimage; PF 5 = hotel / hôtel.\n\n**Examples / Exemples** · PF A-1,2 B-5: phone-food in terminal; hotel on aerodrome / téléphone-restauration dans l’aérogare; hôtel sur l’aérodrome. S 2,5: minor repairs + tie-down / réparations mineures + arrimage. MF radio 118.7 04-12Z 5NM 3100 ASL: frequency, service hours, radius, upper limit / fréquence, heures du service, rayon, limite supérieure ASL.\n\n***"},{"id":"A-16","card":"A","h":"TC flight-crew examinations / Examens du personnel navigant (TC)","a":null,"c":["study-abbrev"],"p":["PPL","CPL","IR","ME"],"md":"**Scope / Portée** · Selected TC examination meanings supplementary to the MANAB/CFS study sections (not a claim of MANAB/CFS authority). English entries follow the [TC list](https://tc.canada.ca/en/aviation/licensing-pilots-personnel/flight-crew-licences-permits-ratings/flight-crew-examinations/abbreviations-acronyms-flight-crew-examinations); French = concise study translation, not certified official terminology. / Sens complémentaires d'examens TC (non présentés comme définitions MANAB/CFS). Français = traduction d'étude.\n\n| Code | English · TC exam | Français · étude |\n|---|---|---|\n| `AAE` | Above aerodrome elevation | Au-dessus de l'altitude de l'aérodrome |\n| `ACAS` | Airborne collision avoidance system | Système anticollision embarqué |\n| `AD` | Airworthiness directive (TC exam); MANAB AD = aerodrome | Consigne de navigabilité (TC) ; MANAB AD = aérodrome |\n| `ADIZ` | Air defence identification zone | Zone d'identification de défense aérienne |\n| `AME` | Aircraft maintenance engineer | Technicien d'entretien d'aéronefs |\n| `APU` | Auxiliary power unit | Groupe auxiliaire de puissance |\n| `ASI` | Airspeed indicator | Indicateur de vitesse |\n| `ASR` | Airport surveillance radar | Radar de surveillance d'aéroport |\n| `ATPL` | Airline transport pilot licence | Licence de pilote de ligne |\n| `ATS` | Air traffic services | Services de la circulation aérienne |\n| `BFL` | Balanced field length | Longueur de piste équilibrée |\n| `CAME` | Civil Aviation Medical Examiner | Médecin-examinateur de l'aviation civile |\n| `CARs` | Canadian Aviation Regulations; ≠ CARS community aerodrome radio station | Règlement de l'aviation canadien ; ≠ CARS station radio d'aérodrome communautaire |\n| `CAS` | Calibrated airspeed | Vitesse corrigée |\n| `CAT` | Clear air turbulence; ≠ approach category | Turbulence en air clair ; ≠ catégorie d'approche |\n| `CDI` | Course deviation indicator | Indicateur d'écart de route |\n| `CFI` | Chief flying instructor | Chef-instructeur de vol |\n| `CMNPS` | Canadian minimum navigation performance specifications | Spécifications canadiennes de performances minimales de navigation |\n| `CMNPSA` | Canadian minimum navigation performance specifications airspace | Espace aérien des spécifications canadiennes de performances minimales de navigation |\n| `CP` | Critical point; ≠ PNR | Point critique ; ≠ PNR |\n| `CPL` | Commercial pilot licence | Licence de pilote professionnel |\n| `CVFR` | Controlled visual flight rules | Règles de vol à vue contrôlé |\n| `CVR` | Cockpit voice recorder | Enregistreur de conversations de poste de pilotage |\n| `DF` | Direction finder | Radiogoniomètre |\n| `DVFR` | Defence visual flight rules | Règles de vol à vue de défense |\n| `EAT` | Expected approach time | Heure prévue d'approche |\n| `EFC` | Expected further clearance time | Heure prévue de nouvelle autorisation |\n| `EGT` | Exhaust gas temperature | Température des gaz d'échappement |\n| `EPR` | Engine pressure ratio | Rapport de pression moteur |\n| `ESCAT Plan` | Emergency security control of air traffic plan | Plan de contrôle d'urgence de la circulation aérienne à des fins de sécurité |\n| `ETOPS` | Extended range operations by twin-engined aeroplanes | Opérations à distance accrue d'avions bimoteurs |\n| `EWH` | Eye-to-wheel height | Hauteur œil–roues |\n| `FD` | Upper-level wind and temperature forecasts (TC exam); ≠ flight director | Prévisions de vents et températures en altitude (TC) ; ≠ directeur de vol |\n| `FDR` | Flight data recorder | Enregistreur de données de vol |\n| `FMS` | Flight management system | Système de gestion de vol |\n| `FPD` | Freezing point depressant; ≠ FDP flight duty period | Abaisseur du point de congélation ; ≠ FDP période de service de vol |\n| `HSI` | Horizontal situation indicator | Indicateur de situation horizontale |\n| `IAF` | Initial approach fix | Repère d'approche initiale |\n| `IAS` | Indicated airspeed | Vitesse indiquée |\n| `ICAO` | International Civil Aviation Organization | Organisation de l'aviation civile internationale |\n| `IMC` | Instrument meteorological conditions | Conditions météorologiques de vol aux instruments |\n| `INS` | Inertial navigation system | Système de navigation inertielle |\n| `ISA` | International Standard Atmosphere | Atmosphère type internationale |\n| `ISO` | International Organization for Standardization | Organisation internationale de normalisation |\n| `KIAS` | Knots indicated air speed | Nœuds de vitesse indiquée |\n| `LAHSO` | Land and hold short operations | Atterrissage avec arrêt avant intersection |\n| `LEMAC` | Leading edge of mean aerodynamic chord | Bord d'attaque de la corde aérodynamique moyenne |\n| `MAC` | Mean aerodynamic chord | Corde aérodynamique moyenne |\n| `MAP` | Missed approach point; ≠ MP manifold pressure | Point d'approche interrompue ; ≠ MP pression d'admission |\n| `MEA` | Minimum en route altitude | Altitude minimale en route |\n| `MEL` | Minimum equipment list | Liste d'équipement minimal |\n| `MNPS` | Minimum navigation performance specifications | Spécifications de performances minimales de navigation |\n| `MNPSA` | Minimum navigation performance specifications airspace | Espace aérien aux spécifications de performances minimales de navigation |\n| `MP` | Manifold pressure; absolute intake pressure (inHg) | Pression d'admission ; pression absolue (po Hg) |\n| `MRA` | Minimum reception altitude | Altitude minimale de réception |\n| `MSL` | Mean sea level | Niveau moyen de la mer |\n| `MVFR` | Marginal visual flight rules | Conditions marginales de vol à vue |\n| `N1 / Ng` | Gas-generator turbine RPM (TC exam notation; engine-dependent) | Régime de turbine génératrice de gaz (notation TC ; selon moteur) |\n| `N2 / Np` | Power-turbine RPM (TC exam notation; engine-dependent) | Régime de turbine de puissance (notation TC ; selon moteur) |\n| `NAT` | North Atlantic | Atlantique Nord |\n| `NAVAID` | Navigation aid | Aide à la navigation |\n| `OBS` | Omnibearing selector | Sélecteur omnidirectionnel |\n| `PNR` | Point of no return; ≠ CP | Point de non-retour ; ≠ CP |\n| `PSR` | Primary surveillance radar | Radar primaire de surveillance |\n| `RAIM` | Receiver autonomous integrity monitoring | Contrôle autonome de l'intégrité par le récepteur |\n| `RMI` | Radio magnetic indicator | Indicateur radiomagnétique |\n| `RVSM` | Reduced vertical separation minimums | Minimums réduits d'espacement vertical |\n| `SAE` | Society of Automotive Engineers | Society of Automotive Engineers (organisme de normalisation) |\n| `SGR` | Specific ground range | Distance-sol spécifique (distance par unité de carburant) |\n| `SSR` | Secondary surveillance radar | Radar secondaire de surveillance |\n| `STOL` | Short take-off and landing | Décollage et atterrissage courts |\n| `SVFR` | Special visual flight rules | Règles de vol à vue spécial |\n| `TCAS` | Traffic alert and collision avoidance system | Système d'alerte de trafic et d'évitement des collisions |\n| `TEMAC` | Trailing edge of mean aerodynamic chord | Bord de fuite de la corde aérodynamique moyenne |\n| `TOT` | Turbine outlet temperature | Température de sortie de turbine |\n| `VLF` | Very low frequency | Très basse fréquence |\n| `VMC` | Visual meteorological conditions | Conditions météorologiques de vol à vue |\n| `VOT` | VOR receiver test facility | Installation d'essai de récepteur VOR |\n| `VSI` | Vertical speed indicator | Variomètre / indicateur de vitesse verticale |\n\n**T · COLLISIONS** · `AD` TC Airworthiness Directive ≠ MANAB aerodrome | `MP` manifold pressure ≠ `MAP` missed approach point | `FD` upper-wind/temp forecast ≠ flight director | `CARs` regulations ≠ `CARS` station | `FPD` freezing-point depressant ≠ `FDP` flight duty period | TC `N1/Ng` / `N2/Np` ≠ universal turbine indications.\n\n**Sources / Références** · MANAB 4th ed. / 4e éd. (2021), English and French tables / tables anglaise et française; supplied / fourni CFS General (12 Jun-7 Aug / 12 juin-7 août 2025), A7-A12 + directory legends / légendes; supplied / fourni TC AIM 2026-1, MET. Study terminology; use current CFS-NOTAM for flight / Terminologie d’étude; utiliser le CFS-NOTAM en vigueur pour le vol.\n\n[TC exam abbreviations](https://tc.canada.ca/en/aviation/licensing-pilots-personnel/flight-crew-licences-permits-ratings/flight-crew-examinations/abbreviations-acronyms-flight-crew-examinations) · [MANAB EN](https://www.canada.ca/en/environment-climate-change/services/weather-manuals-documentation/manab-word-abbreviations-4th-edition/search.html) · [MANAB FR](https://www.canada.ca/fr/environnement-changement-climatique/services/manuels-documents-conditions-meteorologiques/manab-abreviations-de-mots-4e-edition/recherche.html)"},{"id":"MET-0","card":"MET","f":"kb/met/air-masses-fronts-wind.md","h":"Air masses","a":"air-masses","c":["met-systems"],"p":["PPL","CPL","IR"],"u":"wx-air-masses","md":"- Classified by moisture/source: continental `c` dry, maritime `m` moist; Arctic/Polar/Tropical temp source.\n- Weather changes as air mass moves over warmer/colder/moister terrain.\n- Cold air over warm surface ⇒ instability/showers.\n- Warm air over cold surface ⇒ stability/fog/stratus."},{"id":"MET-1","card":"MET","f":"kb/met/air-masses-fronts-wind.md","h":"Pressure systems","a":"pressure-systems","c":["met-systems"],"p":["PPL","CPL","IR"],"u":"wx-pressure-systems","md":"- Northern Hemisphere:\n  - Low: counter-clockwise + inward, rising air, cloud/precip.\n  - High: clockwise + outward, sinking air, often fair/stable.\n- Trough = elongated low pressure, often wind shift/cloud/showers.\n- Ridge = elongated high pressure, generally more stable.\n- Closely spaced isobars ⇒ stronger pressure-gradient wind."},{"id":"MET-2","card":"MET","f":"kb/met/air-masses-fronts-wind.md","h":"Wind","a":"wind","c":["met-systems"],"p":["PPL","CPL","IR"],"u":"wx-wind","md":"- Pressure-gradient force drives high→low.\n- Coriolis deflects right in Northern Hemisphere; increases with latitude/speed.\n- Aloft, pressure gradient + Coriolis ≈ geostrophic/gradient flow, roughly parallel isobars.\n- Surface friction slows wind ⇒ Coriolis↓ ⇒ wind crosses isobars toward low.\n- `M:` surface wind angles **into LOW / out of HIGH**."},{"id":"MET-3","card":"MET","f":"kb/met/air-masses-fronts-wind.md","h":"Local winds","a":"local-winds","c":["met-systems"],"p":["PPL","CPL","IR"],"u":"wx-local-winds","md":"- Sea breeze day: sea→land; land breeze night: land→sea.\n- Valley/anabatic day: upslope/up-valley.\n- Mountain/katabatic night: downslope/down-valley.\n- Funnel/terrain effects can accelerate and redirect wind.\n- `T:` airport wind may differ sharply from ridge/pass/valley wind."},{"id":"MET-4","card":"MET","f":"kb/met/air-masses-fronts-wind.md","h":"Fronts","a":"fronts","c":["met-systems"],"p":["PPL","CPL","IR"],"u":"wx-fronts","md":"- **Cold:** cold undercuts warm; steeper/narrower; CU/CB, showers, gusts, turbulence, fast wind shift.\n- **Warm:** warm overruns cold; broad layered cloud; lowering ceilings, steady precip, icing/FZRA risk.\n- **Stationary:** little movement; prolonged cloud/precip.\n- **Occluded:** cold front catches warm front; extensive mixed frontal weather.\n- `M cold:` `fast-steep-convective`.\n- `M warm:` `slow-wide-layered`."},{"id":"MET-5","card":"MET","f":"kb/met/air-masses-fronts-wind.md","h":"CF — before / passing / after","a":"cf--before--passing--after","c":["met-systems"],"p":["PPL","CPL","IR"],"u":"wx-cold-front","md":"- `K:` surface passage at one location; typical NH mid-latitude low, south of centre. Wind = FROM; directions illustrative.\n\n| Element | Before | Passing | After |\n|---|---|---|---|\n| Pressure | ↓ | minimum → sharp ↑ | ↑, then levels |\n| T / Td | warm / relatively high | T↓; Td usually↓ | colder / usually drier |\n| Wind | S–SW; may strengthen | veers W–NW; gusts/squalls | W–NW; often gusty, later eases |\n| Cloud | CU/TCU; CB if unstable | TCU/CB band; low ragged cloud | CU/SC; clearing trend |\n| Precip | SH/TS may precede | brief heavy SH ± TS/hail | showers, then easing |\n| CIG / VIS | deteriorate near band | low CIG / poor in precip | improve between showers |\n| `!` | prefrontal squall line possible | turbulence / shear / icing / TS | gusts / turbulence; snow squalls possible |\n\n- `M:` CF = `T↓ Td↓ P↑ WIND VEERS`.\n- `T:` stable/slow CF may give layered cloud + prolonged precip; passage ≠ instant clearing."},{"id":"MET-6","card":"MET","f":"kb/met/air-masses-fronts-wind.md","h":"WF — before / passing / after","a":"wf--before--passing--after","c":["met-systems"],"p":["PPL","CPL","IR"],"u":"wx-warm-front","md":"| Element | Before | Passing | After |\n|---|---|---|---|\n| Pressure | steady ↓ | fall slows → levels | ~steady / slight ↑; may ↓ toward next low/CF |\n| T / Td | cool / Td tends ↑ | T↑; Td steady→↑ | warmer / moist, Td higher |\n| Wind | E–SE | veers toward S; variable near boundary | S–SW; speed varies |\n| Cloud | Ci → Cs → As → Ns; St/fog below | low St / fog | St/SC; may lift/break; CB if unstable |\n| Precip | widespread steady RA/SN; PL/FZRA possible | RA/DZ; may ease | often eases; DZ/SH may persist |\n| CIG / VIS | progressively ↓ | often low / poor | usually improve; low cloud/haze/fog may persist |\n| `!` | icing / embedded CB; FZRA if warm layer over subzero surface | low CIG / fog / shear | warm-sector low cloud / fog; possible TS |\n\n- `M:` WF = `LAYERS LOWER → T↑ Td↑ WIND VEERS; P FALL STOPS`.\n- `T:` tendencies, not guarantees: track/terrain/stability/season modify sequence. Both fronts can have CB; WF ≠ guaranteed clearing or strong P rise.\n- `SRC:` [FAA PHAK — Weather Theory, Fronts (NWS-hosted)](https://www.weather.gov/media/zhu/ZHU_Training_Page/Met_Tutorials/Weather_Theory.pdf); [NWS — frontal analysis / pressure tendencies](https://www.weather.gov/media/zhu/ZHU_Training_Page/Met_Tutorials/AF-Trainee.pdf)."},{"id":"MET-7","card":"MET","f":"kb/met/air-masses-fronts-wind.md","h":"Typical warm-front sequence","a":"typical-warm-front-sequence","c":["met-systems"],"p":["PPL","CPL","IR"],"u":"wx-warm-front-sequence","md":"- `Ci → Cs → As → Ns → St/fog`, ceilings lower and precip increases approaching front.\n- Warm-layer-over-subfreezing-surface setup can produce `FZRA/PL`."},{"id":"MET-8","card":"MET","f":"kb/met/air-masses-fronts-wind.md","h":"Stability / fronts / fog","a":"stability--fronts--fog","c":["met-systems","met-stab","met-fog"],"p":["PPL","CPL","IR"],"u":"wxp-stability-fronts-fog","md":"- Stable: layered/smooth/poor vis/steady precip/broad ice; unstable: CU/TCU/CB/turb/showers. `M:` moisture+lift+instability→convection.\n- Warm front: broad lowering CIG/vis/steady precip/FZRA-PL risk; cold front: narrower SH/TS/gust/shift/turb/rapid change; occlusion: mixed/extensive.\n- Fog: radiation=clear/light wind/moist cooling; advection=warm moist over cold; upslope=forced lift; steam=cold over warm water; precip fog=rain into cold air.\n- `T:` timing errors can rapidly change runway/wind/CIG; fog may form after departure."},{"id":"MET-9","card":"MET","f":"kb/met/atmosphere-altimetry.md","h":"Atmosphere / ISA","a":"atmosphere--isa","c":["met-atmos"],"p":["PPL","CPL","IR"],"u":"wx-isa","md":"- ISA SL: `15°C`, `29.92 inHg /1013.25 hPa`, density `1.225 kg/m³`.\n- Standard temp lapse ≈ `2°C/1000 ft` to tropopause.\n- Pressure/density decrease with altitude; warm air less dense than cold air.\n- `F:` ISA temp ≈ `15 - 2×altitude(1000 ft)`.\n- `T:` ISA is a reference model, not forecast weather."},{"id":"MET-10","card":"MET","f":"kb/met/atmosphere-altimetry.md","h":"Pressure altitude / density altitude","a":"pressure-altitude--density-altitude","c":["met-atmos"],"p":["PPL","CPL","IR"],"u":"wx-pa-da","md":"- Pressure altitude = altitude with altimeter `29.92`.\n- Density altitude = pressure altitude corrected for non-standard temperature.\n- `F rough:` `DA ≈ PA + 120 × (OAT - ISA temp)` ft.\n- High `PA + temp + humidity` ⇒ DA↑ ⇒ takeoff roll↑, climb↓, TAS for same IAS↑.\n- `M:` `HOT-HIGH-HUMID = PERFORMANCE LOW`."},{"id":"MET-11","card":"MET","f":"kb/met/atmosphere-altimetry.md","h":"Altimetry / pressure traps","a":"altimetry--pressure-traps","c":["met-atmos","study-traps"],"p":["PPL","CPL","IR"],"u":"wx-altimetry-traps","md":"- From high pressure→low without reset: true altitude lower than indicated.\n- Warm→cold: true altitude lower than indicated.\n- `M:` `HIGH→LOW / HOT→COLD = LOOK OUT BELOW`.\n- Cold temperature increases obstacle/terrain error; apply published corrections where required."},{"id":"MET-12","card":"MET","f":"kb/met/atmosphere-altimetry.md","h":"Density / TAS","a":"density--tas","c":["met-atmos"],"p":["PPL","CPL","IR"],"u":"wx-density-tas","md":"- For same IAS, TAS rises with altitude as density falls.\n- Rule-of-thumb TAS ≈ `IAS + ~2% per 1000 ft` in lower atmosphere.\n- Higher TAS at same IAS ⇒ larger turn radius and more ground distance during manoeuvre."},{"id":"MET-13","card":"MET","f":"kb/met/carburettor-icing.md","h":"Carburetor icing","a":"carburetor-icing","c":["carb-ice"],"p":["PPL","CPL","IR"],"u":"wx-carb-ice","md":"- Fuel vaporization + venturi pressure drop can cool carb throat well below OAT.\n- Possible even in warm weather; risk high with humidity and partial power.\n- Fixed-pitch clue: RPM↓ then roughness.\n- Apply carb heat per POH; initial RPM drop/roughness may worsen while ice melts.\n- `T:` carb icing ≠ structural icing."},{"id":"MET-14","card":"MET","f":"kb/met/carburettor-icing.md","h":"Carburetor icing · QRC","a":"carburetor-icing--qrc","c":["carb-ice"],"p":["PPL","CPL","IR"],"u":"wxp-carb-ice","md":"- Possible in humid conditions and well above freezing, especially partial power/descent.\n- `P:` apply carb heat per POH; expect initial RPM loss/roughness, then recovery if ice melts.\n- `T:` structural icing forecast and carb icing risk are different."},{"id":"MET-15","card":"MET","f":"kb/met/fog-visibility.md","h":"Fog","a":"fog","c":["met-fog"],"p":["PPL","CPL","IR"],"u":"wx-fog","md":"- **Radiation:** clear/light wind/moist ground/night cooling; burns with heating/mixing.\n- **Advection:** moist air over colder surface; needs wind; can persist.\n- **Upslope:** moist air forced uphill and cooled.\n- **Steam:** cold air over warmer water.\n- **Precipitation/frontal:** rain evaporates into cooler air.\n- **Ice fog:** very cold air, ice crystals.\n- `M:` radiation = cooling ground; advection = moving moist air."},{"id":"MET-16","card":"MET","f":"kb/met/fog-visibility.md","h":"Visibility","a":"visibility","c":["met-fog"],"p":["PPL","CPL","IR"],"u":"wx-visibility","md":"- Reduced by fog, mist, haze, smoke, dust, precip, blowing snow.\n- Stable air tends to trap contaminants; unstable mixing often improves general visibility.\n- `!:` whiteout = no discernible horizon/terrain cues over snow/cloud; visual attitude/height judgment can disappear."},{"id":"MET-17","card":"MET","f":"kb/met/gfa-sigmet-pirep-winds.md","h":"GFA","a":"gfa","c":["met-gfa"],"p":["PPL","CPL","IR"],"u":"wxp-gfa","md":"- Most probable conditions ≤`24,000 ft`; issued `4×/day` approx `2330/0530/1130/1730Z`, valid `0000/0600/1200/1800Z`.\n- Six charts: C&W + icing/turb/freezing at valid/`+6 h/+12 h`; final C&W adds `12 h` IFR outlook.\n- `P:` region/time→system/motion→cloud bases/tops→vis/WX/wind→icing/turb/freezing→comments/outlook; interpolate snapshots with buffer.\n- Heights hundreds ft `ASL` unless `CIG/AGL`; METAR/TAF clouds AGL. `LCA≤25% | PTCHY 26–50% | XTNSV/INTMT>50%`; `P6SM`=>6 SM.\n- Movement/`6 h`: `5 kt≈30 NM`, `10 kt≈60 NM`, `20 kt≈120 NM`. `T:` local/patchy hazard may sit on route."},{"id":"MET-18","card":"MET","f":"kb/met/gfa-sigmet-pirep-winds.md","h":"AIRMET / SIGMET / PIREP","a":"airmet--sigmet--pirep","c":["met-gfa"],"p":["PPL","CPL","IR"],"u":"wxp-airmet-sigmet-pirep","md":"| Product | Use / trap |\n|---|---|\n| `AIRMET` | moderate ice/turb, low CIG/vis, strong wind, mountain obscuration/significant change; may exceed light-GA capability |\n| `SIGMET` | TS, severe turb/LLWS/wave/ice, TC, dust/sand, VA/radioactive cloud; avoid; expired≠hazard ended |\n| `PIREP` | actual `/OV /TM /FL /TP /SK /TA /WV /TB /IC /RM`; match time/place/level/type; jet “light” may be severe operationally for trainer |\n\n- `P:` plot phenomenon/area/time/levels/movement/change; compare route/ETA and updates. UUA includes severe/extreme turb, severe ice, LLWS, tornado/funnel/waterspout, VA or other safety-critical condition."},{"id":"MET-19","card":"MET","f":"kb/met/gfa-sigmet-pirep-winds.md","h":"Upper winds / temperature","a":"upper-winds--temperature","c":["met-gfa"],"p":["PPL","CPL","IR"],"u":"wxp-upper-winds","md":"- Use forecast level nearest route altitude; interpolate if needed. Wind is true direction/speed; temperature °C, omitted at low levels in some coding conventions.\n- `P:` compute WCA/GS/fuel→compare freezing level/temp→select altitude balancing wind, terrain, cloud, icing, oxygen/performance.\n- `T:` strongest tailwind route may place you in icing/turbulence/terrain trap."},{"id":"MET-20","card":"MET","f":"kb/met/ground-deicing.md","h":"De-/anti-icing · FPD · HOT / Dégivrage · antigivrage","a":"de-anti-icing--fpd--hot--dégivrage--antigivrage","c":["deice"],"p":["CPL","IR"],"u":"wxp-deice-hot","md":"| Memory | Rule / example |\n|---|---|\n| De / Anti | De-icing removes contamination; anti-icing protects a clean surface temporarily. Clean-aircraft rule: CAR 602.11; ground fluid does not authorize flight in icing. |\n| I / II / III / IV | I: thin, usually heated, orange, short protection. II: thickened, pale/yellow. III: thickened, lower-speed applications, bright yellow. IV: thickened, longer protection, green. Verify product/aircraft approval. |\n| FPD / FDP | FPD = freezing-point depressant. FDP = flight duty period. ADF in fluid literature can mean aircraft deicing fluid, not the navigation receiver. |\n| LOUT | Use the warmest limit: aerodynamic acceptance; freezing point +10°C (I) or +7°C (II/III/IV); for diluted thickened fluids, coldest published HOT temperature. |\n| LOUT example | Type I: freezing point −30°C; aerodynamic limit −25°C → LOUT −20°C. OAT −22°C: too cold. Check aircraft skin temperature too. |\n| HOT clock | Starts at BEGINNING of final fluid application. Two-step: start of anti-icing step, not completion. Product/dilution, temperature, precipitation/intensity determine table. |\n| HOT judgement | HOT is an estimate, not assured protection. Fluid failure or changed conditions can end protection earlier. Expired HOT: approved inspection/re-treatment procedure; never automatic extra minutes. |\n| Snow / Neige | Use TC snowfall-intensity/visibility table, including day/night and temperature. METAR −SN alone does not resolve very-light versus light HOT categories. |\n| Annual tables | Use current winter 2026–27 HOT guidance and exact fluid table. No universal duration per type. Allowance-time rules for ice pellets/small hail differ from HOT. |\n\nShared additions reviewed 19 October 2026: [source editions and scope](../../CONTENT_REVIEW.md#operational-additions--19-october-2026)."},{"id":"MET-21","card":"MET","f":"kb/met/icing.md","h":"Structural icing","a":"structural-icing","c":["met-icing"],"p":["PPL","CPL","IR"],"u":"wx-icing","md":"- Requires visible moisture + aircraft surface at/below freezing.\n- **Rime:** small supercooled drops, rapid freeze, rough/opaque.\n- **Clear:** larger drops, slower freeze/spread, smooth/heavy.\n- **Mixed:** combination.\n- Effects: lift↓, drag↑, stall speed↑, climb↓; prop/intake/static/control contamination.\n- `!:` freezing rain/drizzle and severe icing require immediate escape.\n- `T:` `OAT >0°C` at surface says nothing about cloud icing aloft."},{"id":"MET-22","card":"MET","f":"kb/met/icing.md","h":"Freezing level","a":"freezing-level","c":["met-icing","met-stab"],"p":["PPL","CPL","IR"],"u":"wx-freezing-level","md":"- Altitude where `0°C`; may be multiple levels with inversions.\n- `F exam parcel 0°C:` AGL ≈ `CB_exam + 1000×Td_surface/1.5` ft: assumes cloud-base parcel temperature ≈ surface dew point and SALR≈1.5°C/1000 ft.\n- `F parcel 0°C:` `T_CB ≈ T_surface−3×CB_parcel/1000`; if `T_CB>0°C`, parcel reaches 0°C at `CB_parcel+1000×T_CB/1.5` ft AGL (approximate/variable SALR).\n- `T:` parcel 0°C height ≠ atmospheric freezing level; use actual environmental temperature profile / GFA / temperatures aloft. Temperature inversions may create multiple 0°C levels.\n- Freezing level ≠ guaranteed icing layer; requires moisture.\n- Cloud + subzero temp + PIREP/AIRMET icing = stronger evidence."},{"id":"MET-23","card":"MET","f":"kb/met/icing.md","h":"Icing gate","a":"icing-gate","c":["met-icing","met-decide"],"p":["PPL","CPL","IR"],"u":"wxp-icing","md":"- Visible moisture + subfreezing surface; `FZRA/FZDZ` especially severe. Types rime/clear/mixed; trace/light/moderate/severe.\n- `!:` non-approved aircraft: avoid forecast/reported ice; exit at first indication.\n- Red: `FZRA/FZDZ/PL`, freezing-level crossing in cloud/precip, warm-front overrunning, PIREP/AIRMET/SIGMET, tops above capability. `T:` surface >`0°C` does not clear icing aloft."},{"id":"MET-24","card":"MET","f":"kb/met/icing.md","h":"Snow / freezing precipitation","a":"snow--freezing-precipitation","c":["met-icing"],"p":["PPL","CPL","IR"],"u":"wxp-snow-fzra","md":"- Snow reduces visibility rapidly; blowing snow may create whiteout/false horizon; contamination harms acceleration/braking/lift.\n- Ice pellets imply warm layer aloft and possible nearby freezing rain/mixed icing.\n- `!:` freezing rain = severe icing/ground contamination risk; avoid.\n- `T:` light snow code can still produce unacceptable visual contrast/visibility."},{"id":"MET-25","card":"MET","f":"kb/met/metar.md","h":"METAR / SPECI scan","a":"metar--speci-scan","c":["met-metar"],"p":["PPL","CPL","IR"],"u":"wxp-metar","md":"- `P:` type→ID→time→wind→vis/RVR→WX→cloud→T/TD→ALT→RMK. `M:` `ID-TIME-WIND-VIS-WX-CLOUD-T/TD-ALT-RMK`.\n- Cloud heights: hundreds ft AGL; ceiling=lowest `BKN/OVC/VV`; `SCT`≠ceiling.\n- `SPECI:` significant change; compare last `2–4` reports for ceiling/vis/wind/pressure/precip/convection.\n- `T:` `AUTO` limits and remarks matter; recent SPECI can override comfort from older data."},{"id":"MET-26","card":"MET","f":"kb/met/metar.md","h":"Wind decoding","a":"wind-decoding","c":["met-metar","met-systems"],"p":["PPL","CPL","IR"],"u":"wxp-wind","md":"- `dddffGggKT`: direction/sustained/gust. `VRB` variable. `dddVddd` directional variation.\n- METAR/TAF wind direction is true. Runway/ATC use requires magnetic/runway alignment awareness.\n- `F:` XW=`wind×sin angle`; HW=`wind×cos angle`.\n- `M:` 30° XW=½; 45°≈0.7; 60°≈0.87; 90°=full.\n- `T:` use gust for control/landing margin; tailwind/XW/runway contamination stack risk."},{"id":"MET-27","card":"MET","f":"kb/met/metar.md","h":"Visibility / RVR","a":"visibility--rvr","c":["met-metar","met-fog","ifr-minima"],"p":["PPL","CPL","IR"],"u":"wxp-vis-rvr","md":"- `P6SM` >6 SM. Fractions may be combined. Prevailing vis may hide directional/local variation in remarks.\n- RVR gives runway visual range, usually hundreds/thousands ft with trend where reported.\n- `T:` prevailing visibility, flight visibility, ground visibility, runway visibility and RVR are different legal/operational concepts."},{"id":"MET-28","card":"MET","f":"kb/met/metar.md","h":"Weather codes","a":"weather-codes","c":["met-metar","study-abbrev"],"p":["PPL","CPL","IR"],"u":"wxp-wx-codes","md":"- Intensity: `-` light | no sign moderate | `+` heavy. Proximity `VC`.\n- Descriptors: `MI` shallow | `BC` patches | `PR` partial | `DR` low drifting | `BL` blowing | `SH` showers | `TS` thunderstorm | `FZ` freezing.\n- Precip: `DZ RA SN SG IC PL GR GS UP`.\n- Obscuration: `BR FG FU VA DU SA HZ PY`.\n- Other: `PO SQ FC SS DS`.\n- `M:` `FZ` + liquid precip = immediate icing red flag."},{"id":"MET-29","card":"MET","f":"kb/met/metar.md","h":"Cloud groups","a":"cloud-groups","c":["met-metar"],"p":["PPL","CPL","IR"],"u":"wxp-cloud-groups","md":"- `FEW 1-2` | `SCT 3-4` | `BKN 5-7` | `OVC 8` oktas; `VV` obscured sky.\n- `TCU/CB` appended to layer. `NSC/SKC/CLR` meanings depend station/reporting system.\n- `T:` cloud base at destination may be legal while enroute terrain/cloud geometry is not."},{"id":"MET-30","card":"MET","f":"kb/met/metar.md","h":"Temperature / dew point","a":"temperature--dew-point","c":["met-metar","met-stab"],"p":["PPL","CPL","IR"],"u":"wxp-temp-dewpoint","md":"- Format `TT/DD`; `M` means minus. Spread small ⇒ saturation/fog/low cloud risk, especially cooling/night.\n- `T:` dew-point spread alone does not predict fog; consider wind, cloud, moisture, terrain, advection and precipitation.\n- `M:` freezing level + visible moisture/precip = icing analysis required."},{"id":"MET-31","card":"MET","f":"kb/met/metar.md","h":"Altimeter / pressure trend","a":"altimeter--pressure-trend","c":["met-metar","met-atmos"],"p":["PPL","CPL","IR"],"u":"wxp-altimeter","md":"- `A2992` = 29.92 inHg. Remarks may show sea-level pressure and rapid rise/fall.\n- `M:` high→low or warm→cold = actual lower than indicated.\n- `T:` rapidly falling pressure often accompanies strengthening system/wind/weather deterioration."},{"id":"MET-32","card":"MET","f":"kb/met/recall.md","h":"Exam traps","a":"exam-traps","c":["met","study-traps"],"p":["PPL","CPL","IR"],"u":"wx-exam-traps","md":"- Stable ≠ “good”: can mean fog/stratus/poor vis/icing.\n- Unstable ≠ “bad everywhere”: often better vis between showers but more turbulence/CB.\n- Warm front generally broader/layered; cold front narrower/convective.\n- Dew-point spread predicts saturation risk, not certainty.\n- Freezing level alone does not equal icing.\n- Wind direction aloft/surface differs due friction.\n- Density altitude is a performance concept, not an indicated instrument altitude.\n- Cloud base units: METAR AGL vs GFA ASL."},{"id":"MET-33","card":"MET","f":"kb/met/recall.md","h":"Pebble","a":"pebble","c":["met","study-pebble"],"p":["PPL","CPL","IR"],"u":"wx-pebble","md":"- ISA `15°C /29.92 / -2°C per1000`\n- DA `≈ PA +120×ΔT`\n- DALR `3°/1000`; SALR `~1.5°/1000`\n- CB exam `AGL=1000(T−Td)/3`; parcel `AGL=1000(T−Td)/(3−0.5)` | parcel 0°C exam `CB+1000Td/1.5`, detailed `CB+1000T_CB/1.5` | environmental FZ≠parcel 0°C\n- stable=`STRATUS-SMOOTH-POOR VIS`; unstable=`CU-TURB-SHOWERS`\n- low=`CCW-IN-RISE`; high=`CW-OUT-SINK`\n- cold front=`FAST-STEEP-CU`; warm=`SLOW-WIDE-LAYERED`\n- fog `RAD COOL / ADVECT MOVE / UPSLOPE LIFT`\n- icing=`MOISTURE + ≤0 SURFACE`; `FZRA/FZDZ RED`\n- TS=`MOISTURE+INSTABILITY+LIFT`; mature=worst\n- microburst=`IAS↑ then ↓`\n- `HIGH→LOW / HOT→COLD = BELOW`\n- METAR/TAF AGL; GFA usually ASL."},{"id":"MET-34","card":"MET","f":"kb/met/stability-clouds.md","h":"Temperature / dew point","a":"temperature--dew-point","c":["met-stab"],"p":["PPL","CPL","IR"],"u":"wx-temp-dewpoint","md":"- Dew point = temperature air must cool to reach saturation at constant pressure/water content.\n- Small `T-Td` spread + cooling ⇒ fog/low cloud increasingly likely.\n- Temperature inversion = temp increases with height; strongly stable, traps haze/smoke, can create wind shear.\n- `T:` small spread alone does not guarantee fog."},{"id":"MET-35","card":"MET","f":"kb/met/stability-clouds.md","h":"Lapse rates / stability","a":"lapse-rates--stability","c":["met-stab"],"p":["PPL","CPL","IR"],"u":"wx-lapse-stability","md":"- `DALR` unsaturated ≈ `3°C/1000 ft`.\n- `SALR` saturated ≈ `1.5°C/1000 ft` average; varies with temp/moisture.\n- Environment cools faster than DALR ⇒ absolutely unstable.\n- Environment cools slower than SALR / inversion ⇒ absolutely stable.\n- Between SALR/DALR ⇒ conditionally unstable.\n- Stable: stratiform cloud, smooth air, poor vis, steady precip.\n- Unstable: CU/TCU/CB, turbulence, showers, generally better between-cloud vis.\n- `M:` steep lapse = vertical motion grows."},{"id":"MET-36","card":"MET","f":"kb/met/stability-clouds.md","h":"Moisture / cloud formation","a":"moisture--cloud-formation","c":["met-stab"],"p":["PPL","CPL","IR"],"u":"wx-moisture-cloud","md":"- Need moisture + cooling to saturation.\n- Cooling mechanisms: lifting, radiation, contact/advection, mixing.\n- Lift: convection, fronts, terrain, convergence.\n- Condensation nuclei help droplets form.\n- Cloud base often near LCL; rising unsaturated air cools DALR until saturated, then SALR.\n- `F exam CB:` convective cloud base AGL ≈ `1000(T−Td)/3` ft, with surface `T,Td` °C; **simplified course shortcut** assumes Td ≈ constant during unsaturated ascent.\n- `F parcel CB:` LCL/cloud base AGL ≈ `1000(T−Td)/(3−0.5)` ft; parcel T↓ ≈3°C/1000 ft, parcel Td↓ ≈0.5°C/1000 ft; both approximate.\n- `T:` estimates apply to a surface-lifted convective parcel, not every observed ceiling/cloud base; field elevation + AGL = ASL only for same vertical datum."},{"id":"MET-37","card":"MET","f":"kb/met/stability-clouds.md","h":"Cloud families","a":"cloud-families","c":["met-stab"],"p":["PPL","CPL","IR"],"u":"wx-cloud-families","md":"| Cloud | Typical significance |\n|---|---|\n| `Ci/Cs/Cc` | high ice cloud; system/front clues |\n| `As/Ac` | mid-level layered/convective; possible icing |\n| `St/Sc` | low stable layer; ceiling/vis concern |\n| `Ns` | widespread steady precip, low ceilings |\n| `Cu` | convective; benign→growing |\n| `TCU` | strong convection, turbulence/icing |\n| `CB` | TS hazards: turbulence/hail/ice/lightning/shear |\n\n- `T:` cloud type often tells stability/lift mechanism."},{"id":"MET-38","card":"MET","f":"kb/met/stability-clouds.md","h":"Precipitation","a":"precipitation","c":["met-stab"],"p":["PPL","CPL","IR"],"u":"wx-precip","md":"- Droplets/crystals grow by collision/coalescence or ice-crystal process.\n- `RA` liquid; `DZ` tiny droplets; `SN`; `PL` ice pellets; `FZRA/FZDZ` supercooled liquid freezing on contact.\n- `!:` freezing rain/drizzle = high-severity icing signal.\n- Virga = precip evaporates before ground; may indicate downdrafts/microburst potential."},{"id":"MET-39","card":"MET","f":"kb/met/taf.md","h":"TAF scan / groups","a":"taf-scan--groups","c":["met-taf"],"p":["PPL","CPL","IR"],"u":"wxp-taf","md":"- `P:` ID→issue/valid→prevailing→`FM/BECMG/TEMPO/PROB` timeline covering DEP/ETA/ALT ETA + delay; do not average groups.\n- `FM` permanent from minute | `BECMG` gradual permanent | `TEMPO` each `<1 h`, total `≤½` period | `PROB30/40` probability.\n- `FM` begins a new self-contained forecast period. With `BECMG/TEMPO`, unchanged groups may carry forward, but a changed cloud group gives the complete new cloud picture; visibility/weather/obscuration form another related group. Do not retain an old cloud layer merely because it is absent after a change. `[AIM MET 7.4]`"},{"id":"MET-40","card":"MET","f":"kb/met/taf.md","h":"TAF alternate / risk","a":"taf-alternate--risk","c":["met-taf","ifr-alt"],"p":["IR"],"u":"wxp-taf-alternate","md":"- `BECMG` improve=end, deteriorate=start; `TEMPO`≥alternate minima; `PROB`≥landing minima.\n- `T:` alternate≠landing≠approach-ban minima. `TEMPO` near ETA and `PROB30/40` high-consequence `TS/FZRA/low vis` require fuel/options; many short groups reduce confidence."},{"id":"MET-41","card":"MET","f":"kb/met/thunderstorms.md","h":"Thunderstorms — ingredients","a":"thunderstorms--ingredients","c":["met-ts"],"p":["PPL","CPL","IR"],"u":"wx-thunderstorms","md":"- Moisture + instability + lift.\n- Stages:\n  1. **Cumulus:** updrafts only.\n  2. **Mature:** up + downdrafts; precip; maximum hazards.\n  3. **Dissipating:** downdrafts dominate.\n- Hazards: extreme turbulence, hail, lightning, heavy precip, icing, tornado, wind shear/microburst.\n- `!:` avoid; never use a visual/radar “gap” to thread active cells."},{"id":"MET-42","card":"MET","f":"kb/met/thunderstorms.md","h":"Convection gate","a":"convection-gate","c":["met-ts","met-decide"],"p":["PPL","CPL","IR"],"u":"wxp-convection","md":"- Hazards: extreme turb/hail/lightning/ice/heavy precip/shear-microburst/tornado/instrument errors.\n- `!:` large-margin avoidance of cells/lines/embedded TS; never thread a radar gap.\n- Assess SIGMET/GFA/TAF/PIREP/radar/lightning/satellite for movement/growth/line/escape. `T:` datalink delayed; attenuation hides cells."},{"id":"MET-43","card":"MET","f":"kb/met/turbulence-wind-shear.md","h":"Turbulence","a":"turbulence","c":["met-turb"],"p":["PPL","CPL","IR"],"u":"wx-turbulence","md":"- Mechanical: wind over terrain/buildings; strongest low/lee side.\n- Convective: thermal/CU/TS.\n- Frontal: wind/shear + convection.\n- Mountain wave/rotor: strong stable cross-ridge flow.\n- CAT: often near jet stream/strong wind shear, without cloud.\n- `T:` turbulence intensity depends on aircraft response; same air mass affects light aircraft more."},{"id":"MET-44","card":"MET","f":"kb/met/turbulence-wind-shear.md","h":"Mountain wave","a":"mountain-wave","c":["met-turb"],"p":["PPL","CPL","IR"],"u":"wx-mountain-wave","md":"- Favoured by strong wind roughly perpendicular to ridge + stable layer.\n- Smooth wave aloft; severe rotor/turbulence below/lee; strong up/downdrafts.\n- Lenticular `ACSL` = wave clue; rotor cloud may mark turbulence.\n- `!:` downdraft may exceed climb capability."},{"id":"MET-45","card":"MET","f":"kb/met/turbulence-wind-shear.md","h":"Wind shear","a":"wind-shear","c":["met-turb"],"p":["PPL","CPL","IR"],"u":"wx-wind-shear","md":"- Rapid wind speed/direction change over short distance.\n- Sources: fronts, inversions/low-level jets, terrain, TS/microbursts.\n- Low-level shear changes IAS/flight path quickly near ground.\n- `T:` surface wind can look acceptable while shear above is severe."},{"id":"MET-46","card":"MET","f":"kb/met/turbulence-wind-shear.md","h":"Microburst / LLWS","a":"microburst--llws","c":["met-turb"],"p":["PPL","CPL","IR"],"u":"wx-microburst","md":"- Microburst = concentrated downdraft spreading outward at surface.\n- Aircraft may see: headwind/IAS↑ → downdraft → tailwind/IAS↓.\n- Most dangerous low during takeoff/landing.\n- Virga, heavy showers, gust fronts and TS are clues.\n- `M:` gain first can precede severe loss."},{"id":"MET-47","card":"MET","f":"kb/met/turbulence-wind-shear.md","h":"Jet stream / CAT","a":"jet-stream--cat","c":["met-turb","met-systems"],"p":["PPL","CPL","IR"],"u":"wx-jet-cat","md":"- Narrow band of strong upper wind near tropopause, usually strongest horizontal temp gradient.\n- CAT favoured near jet core/shear zones, especially bends/entrance/exit regions.\n- Jet position helps locate fronts/system movement."},{"id":"MET-48","card":"MET","f":"kb/met/turbulence-wind-shear.md","h":"Turbulence · QRC","a":"turbulence--qrc","c":["met-turb"],"p":["PPL","CPL","IR"],"u":"wxp-turbulence","md":"- Mechanical: strong wind over rough terrain/obstacles; worst low/lee.\n- Convective: CU/TCU/CB/showers. Mountain wave: strong cross-ridge stable flow. CAT: jet-stream/wind-shear zones aloft.\n- `P:` choose altitude/route/time; slow to turbulence penetration speed per POH; secure cabin; report.\n- `T:` Va changes with weight; published max-gross Va may be too high at lower weight."},{"id":"MET-49","card":"MET","f":"kb/met/turbulence-wind-shear.md","h":"LLWS / microburst","a":"llws--microburst","c":["met-turb"],"p":["PPL","CPL","IR"],"u":"wxp-llws","md":"- TAF wind shear group describes significant shear in lowest `1500 ft AGL`.\n- Red flags: TS/gust front, virga, strong inversion/low-level jet, large surface-vs-aloft wind difference.\n- `!:` postpone/avoid severe shear; go-around may enter worse performance.\n- `T:` increasing airspeed followed by rapid loss can be microburst signature; follow aircraft procedure."},{"id":"MET-50","card":"MET","f":"kb/met/turbulence-wind-shear.md","h":"Mountain / terrain weather","a":"mountain--terrain-weather","c":["met-turb"],"p":["PPL","CPL","IR"],"u":"wxp-mountain","md":"- Check ridge wind angle/speed, mountain wave, rotor, obscuration, ceiling above pass, escape route, downdraft performance.\n- `P:` cross ridge with margin/angle/escape; avoid lee rotor/cloud; no narrow-valley commitment without turnaround room.\n- `T:` reported aerodrome ceiling may not clear enroute terrain."},{"id":"MET-51","card":"MET","f":"kb/met/weather-products.md","h":"Canadian product memory","a":"canadian-product-memory","c":["met-products"],"p":["PPL","CPL","IR"],"u":"wx-products","md":"- `METAR/SPECI` observed aerodrome conditions.\n- `TAF` terminal forecast.\n- `GFA` regional cloud/weather + icing/turb/freezing level.\n- `AIRMET` significant lower-severity/unforecast hazard.\n- `SIGMET` significant hazardous weather.\n- `PIREP` actual pilot-observed conditions.\n- METAR/TAF cloud heights = AGL; GFA heights generally ASL unless stated.\n- `T:` use the separate Weather Decoding / Go-No-Go QRC for exact code/timing/alternate logic."},{"id":"MET-52","card":"MET","f":"kb/met/weather-products.md","h":"Product roles","a":"product-roles","c":["met-products"],"p":["PPL","CPL","IR"],"u":"wxp-product-roles","md":"| Product | Tells you |\n|---|---|\n| `METAR` | observed aerodrome weather now |\n| `SPECI` | significant observed change |\n| `TAF` | forecast aerodrome conditions/time changes |\n| `GFA` | regional clouds/weather + icing/turb/freezing level |\n| `AIRMET` | potentially hazardous weather / significant change below SIGMET severity |\n| `SIGMET` | significant hazardous weather affecting flight safety |\n| `PIREP` | actual conditions encountered |\n| `FB/upper winds` | forecast wind/temp aloft |\n| `Radar` | precipitation location/intensity/trend; not all turbulence/ice |\n| `Satellite` | cloud structure/coverage; interpretation required |\n| `RSC/CRFI` | runway contamination/condition/friction information |\n\n- `T:` radar gap ≠ clear air. no PIREPs ≠ no hazard."},{"id":"MET-53","card":"MET","f":"kb/met/weather-products.md","h":"Weather trend logic","a":"weather-trend-logic","c":["met-products","met-decide"],"p":["PPL","CPL","IR"],"u":"wx-trend","md":"- Observation = **now**; forecast = **expected**; trend = whether expectation is occurring.\n- Compare several METAR/SPECI, not one snapshot.\n- Falling ceiling/vis + pressure + increasing wind/precip often signals approaching system deterioration.\n- `T:` forecast confidence drops when observations repeatedly diverge."}]}</script>

function snippet(s) {
