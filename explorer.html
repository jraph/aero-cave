 `AME person / AMO org / PRM AMO: ≥6y incl ≥6mo recent; 70% or exempt; TC ACK ≤30d / PRMCS AOC: 70% or exempt; dual AOC+AMO same person / MPM AMO / MCM operator / MSA intervals / DML defects`\n- TYPE `HP single-pilot VNE≥250 OR VSO≥80 KIAS (or amateur-built wing loading)→individual TYPE: ≥200h + qualified FLT ≤12mo; 2-crew TYPE: ≥250h OR integrated ATP(A), IATRA≥70% ≤24mo OR SAMRA+SARON/ATPL route, PPC/LOE/PCC ≤12mo; 704 new 24mo PPC ends 01 NOV 2026→12mo; TYPE≠PPC/operational currency`\n- FDP 604/700 `604 base14/15 if ≤70h FDP/30d OR prior REST≥24h; split≥4h→+½break MAX4h +REST | 604 UOC after start +3h MAX +REST | 700 base table; split≥1h credit (break−45m)×night100%/day50%; UOC≤60m at FDP start: +1 single/+2 unaug/+3 aug1FLT/+2 aug2–3FLT +REST | FDP EXT≠FLT time`\n- TSB `accidents all sizes; reportable incidents >2,250kg MCTOW OR Part VII AOC`\n- defects `required? serviceable? legal defer? safe?`\n- NIGHT VFR `605.16 base | PAX→LDG light | VI-4/VII-2–5→AI+VSI+ASI anti-ice+OAT even no PAX | 703 night LDG light, icing→detect | 703 SE PAX IFR/night prohibited unless AOC AUTH + 723.22 turbine/STC+extra EQPT`\n- fuel VFR `30D/45N`; IFR prop `app+missed+alt+45`\n- O2 crew `>10k after30`; all `>13k`\n- ROW `right/head-on right/overtake right`\n- min alt built-up `1000 over within2000`; elsewhere `500 from`\n- flight plan/itinerary except within `25 NM`\n- controlled VFR `3-1-500`\n- uncontrolled high `1D/3N-2000/500`\n- uncontrolled low aeroplane `2D/3N-clear`\n- SVFR `request+ATC / 1SM / COC / surface`\n- airspace `B SEP all | C SEP IFR–IFR + CR IFR–VFR + VFR–VFR O/R | D SEP IFR–IFR; CR workload/O/R | E SEP IFR–IFR only | G none`\n- `current CAR/CFS/CAP/NOTAM wins`."},{"id":"04-49","card":"04","h":"Commercial scope / flight-time comparison — September 2026","a":"commercial-scope--flight-time-comparison--september-2026","c":["law-commercial"],"p":["CPL"],"md":"- PORD: CAR 604.03 covers transport of passengers/goods in specified Canadian aircraft: large aeroplane, turbojet, or pressurized turbine aeroplane certificated for more than six passenger seats, subject to its exceptions. No fare payment is needed to trigger this test.\n- Ordinary private C150 flying does not automatically become Subpart 604 operation.\n\nThe shared flight/duty section below contains current limits and applicability.\n\n- Sources: [604.03](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.03.html), [604.98](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.98.html), [700.27](https://laws-lois.justice.gc.ca/eng/regulations/sor-96-433/page-83.html), [404.04](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-404.04.html)."},{"id":"04-50","card":"04","h":"Passenger weights / Masse des passagers — AIM 2026-1 RAC 3.4.7","a":"passenger-weights--masse-des-passagers--aim-2026-1-rac-347","c":["law-oprules","agk-wb"],"p":["CPL"],"md":"| Memory | Rule / example |\n|---|---|\n| Scope / Portée | Standard averages require the applicable approved W&B method. 703 uses actual/volunteered/estimated or approved segmented/survey methods; do not apply airline averages to a small private aircraft. |\n| Adult M / X ≥12 | Summer 206 lb (93.4 kg); winter 212 lb (96.2 kg). |\n| Adult F ≥12 | Summer 172 lb (78.1 kg); winter 178 lb (80.7 kg). Adult winter increment =6 lb. |\n| Children / Enfants | Age 2–11: 75 lb (34 kg), both seasons. Infant <2: 30 lb (13.6 kg); standard-method infant allowance note applies when infant count exceeds 10% of adults. |\n| Baggage / Bagages | Standard adult weights include clothing/carry-on. No carry-on: permitted reduction 13 lb (5.9 kg). Checked baggage and cargo: actual weights. |\n| Small sample / Petit groupe | 1–4 maximum certificated passenger seats: actual, volunteered or estimated weights. Segmented weights depend on certificated capacity, not passengers aboard. |\n| Segment 5 | 5 certificated passenger seats: summer M/X 243, F 204 lb; winter M/X 249, F 210 lb. |\n| Segment 6–8 | 6–8 certificated passenger seats: summer M/X 238, F 200 lb; winter M/X 244, F 206 lb. |\n| Segment 9–11 | 9–11 certificated passenger seats: summer M/X 230, F 193 lb; winter M/X 236, F 199 lb. |\n| Segment 12–16 | 12–16 certificated passenger seats: summer M/X 227, F 190 lb; winter M/X 233, F 196 lb. |\n| Segment 17–25 | 17–25 certificated passenger seats: summer M/X 223, F 187 lb; winter M/X 229, F 193 lb. |\n| Actual wins / Réel | If a group is heavier than the assumed average, account for actual weights. Never hide infant, baggage or unusual load in a blanket average. |"},{"id":"04-51","card":"04","h":"ACFT type ratings · HP / two-crew / IATRA / PPC — Oct 2026","a":"acft-type-ratings--hp--two-crew--iatra--ppc--oct-2026","c":["law-type"],"p":["CPL"],"md":"| CAVE | Rule / trap |\n|---|---|\n| `R` Blanket | Single-pilot **non-high-performance** aeroplanes → blanket rating with applicable class; otherwise individual type rating where required. |\n| `R` HP test | **Single-pilot** aeroplane per minimum-crew document AND **VNE ≥250 KIAS OR VSO ≥80 KIAS**; **OR** amateur-built aeroplane wing loading above AWM 549.103 threshold. [CAR 400.01](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-400.01.html) |\n| `T` Complex ≠ HP | Complex = flaps + constant-speed PROP + retractable gear (except seaplane); complex, turbine-powered or pressurized ≠ automatically HP. |\n| `R` HP individual TYPE | **STD 421.40(3)(c):** type ground training + type FLT training + **≥200 h aeroplane pilot FLT time** + **qualifying FLT in 12 mo BEFORE rating application** supervised by TC Inspector or qualified person under 425.21(7)(a); **IATRA/PPC not stated as initial HP requirement**. |\n| `R` Two-crew individual TYPE | **Minimum crew ≥2 pilots** per type approval → type ground+FLT training + **≥250 h aeroplane pilot FLT time**, **OR** approved integrated ATP(A) course alternative (STD 421.40, effective 17 DEC 2025). |\n| `R` Two-crew knowledge | First PPL(A)/CPL(A) two-crew endorsement: **IATRA ≥70% within 24 mo** before application **OR SAMRA+SARON ≥70% each within 24 mo**; ATPL(A) holder meets knowledge; approved integrated ATP(A): ATP exams within **5 years** before application. |\n| `R` Two-crew skill | Type-specific **PPC within 12 mo before application** (Part VII / Minister-accepted); **approved AQP LOE** accepted; CAR 604 certificate holder: approved training/proficiency programme + **PPC or PCC under 604.143 within 12 mo**. [STD 421.40](https://tc.canada.ca/en/corporate-services/acts-regulations/list-regulations/canadian-aviation-regulations-sor-96-433/standards/standard-421-flight-crew-permits-licences-ratings-canadian-aviation-regulations-cars) |\n| `T` Three clocks | **IATRA 24 mo** = exam-to-first-rating application; **qualifying FLT/PPC 12 mo** = test-to-type-rating application; **operational PPC currency** = independent recurrent check, **not TYPE rating expiration**. |\n| `R` CAR 704 PPC transition | **Until 01 NOV 2026:** qualifying new PPC may use **24-mo exemption**; **on/after 01 NOV 2026:** no new 24-mo PPC; **standard 12 mo**. Existing PPC issued under 24-mo exemption keeps original validity per TC Bulletin 01/26. [TC ACP/AQPE Bulletin 01/26](https://tc.canada.ca/en/aviation/commercial-air-services/approved-check-pilot-acp-advanced-qualification-program-aqp/acp-aqpe-bulletins/approved-check-pilot-acp-advanced-qualification-program-aqp-evaluator-bulletin-no-01-26) |\n| `T` Operations | TYPE endorsement ≠ operator authorization, PPC, IR, recurrent training or flight crew recency. ATR/other two-crew turboprop uses two-crew path, not HP-speed shortcut. |"},{"id":"04-52","card":"04","h":"Flight time · FDT · FDP / Temps de vol · service","a":"flight-time--fdt--fdp--temps-de-vol--service","c":["law-commercial"],"p":["CPL"],"md":"| Memory | Rule / example |\n|---|---|\n| Terms / Termes | FDT = flight/duty time (general shorthand). FDP = flight duty period; flight time, FDP, work and rest are separate clocks. FPD = freezing-point depressant (fluid). |\n| Applicability / Portée | 700 Division III: applicable commercial operations. 604 private operators have separate limits; ordinary private PPL/CPL flying is not automatically 604. 702 aerial work and 700 Division IV medevac differ. |\n| 700.27 flight time | 112 h/28 days; 300 h/90 days; 1000 h/365 days. Single-pilot: 8 h/24 consecutive hours. |\n| 604.98 flight time | 120 h/30 days; 300 h/90 days; 1200 h/12 consecutive months. Single-pilot IFR: 8 h/24 h. |\n| FDP table key | 700.28: select average scheduled flight duration, number of flights, and applicable start-time reference. No universal 14-hour limit. Tables below are baseline, before special adjustments. |\n| Columns A / B / C | Average <30 min: A=1–11 flights, B=12–17, C=18+. Average 30–<50: A=1–7, B=8–11, C=12+. Average ≥50: A=1–4, B=5–6, C=7+. |\n| 00:00–03:59 | FDP maximum A / B / C = 9 / 9 / 9 hours. |\n| 04:00–04:59 | FDP maximum A / B / C = 10 / 9 / 9 hours. |\n| 05:00–05:59 | FDP maximum A / B / C = 11 / 10 / 9 hours. |\n| 06:00–06:59 | FDP maximum A / B / C = 12 / 11 / 10 hours. |\n| 07:00–12:59 | FDP maximum A / B / C = 13 / 12 / 11 hours. |\n| 13:00–16:59 | FDP maximum A / B / C = 12.5 / 11.5 / 10.5 hours. |\n| 17:00–21:59 | FDP maximum A / B / C = 12 / 11 / 10 hours. |\n| 22:00–22:59 | FDP maximum A / B / C = 11 / 10 / 9 hours. |\n| 23:00–23:59 | FDP maximum A / B / C = 10 / 9 / 9 hours. |\n| Day VFR / VFR jour | All flights day VFR: 700.28(9) uses column A values irrespective of flight count. Positioning is not a flight for table count. |\n| Example / Exemple | Start 08:00, five 60-min flights → column B →12 h FDP (baseline). All day VFR →13 h. Flight time is 5 h, not 12 h. |\n| Work / Travail 700.29 | 60 h/7 d or qualifying 70 h/7 d option; 192 h/28 d; 2200 h/365 d. Each option has its own time-off conditions. |\n| Rest / Repos 700.40 | Home: 12 h OR 11 h + travel to/from rest OR 10 h in operator-provided suitable accommodation. Away: 10 h in suitable accommodation. Special schedules may require more. |\n| Fatigue trap | Being under a numeric limit does not establish fitness. Acclimatization, reserve/standby, split duty, extensions and augmented crews require their specific rules. |"},{"id":"04-53","card":"04","h":"FDP extensions / split / unforeseen — CAR 604 vs 700 (Division III)","a":"fdp-extensions--split--unforeseen--car-604-vs-700-division-iii","c":["law-commercial"],"p":["CPL"],"md":"| CAVE | 604 · Private operator | 700 · Commercial general fatigue regime |\n|---|---|---|\n| `R` Base FDP | **14 h/24 h**; **15 h/24 h** iff previous 30 d total FDP **≤70 h OR previous REST ≥24 h**. [604.99](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.99.html) | **700.28** A/B/C = **9–13 h** based on start-time reference + scheduled FLT count/average duration (table above). |\n| `R` Split | **604.100:** planned break **≥4 consecutive h** in suitable accommodation; prior notice before first FLT/standby. | **700.50:** break **≥60 consecutive min** in suitable accommodation; time windows at acclimatized location. |\n| `F` Split EXT | `MIN(break ÷ 2, 4 h)` → FDP MAX increases by credit. | Deduct **45 min** first; **00:00–05:59 → 100%** of remainder; **06:00–23:59 → 50%**; if replanned after FDP start due to unforeseen circumstances → **50%**. [700.50](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.50.html) |\n| `R` Split REST | **Next minimum REST += ≥actual FDP extension**. [604.100(c)](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.100.html) | REST under **700.40**, plus other applicable provisions; **700.50 does not itself mandate REST += split credit**. |\n| `R` Split restrictions | No generic automatic extension without all 604.100 conditions. | Night-duty split maximum **3 consecutive nights**; reserve duty +2 h only under 700.50(5), with **≤2 FLTs after break**. |\n| `R` UOC timing | **604.102:** unforeseen operational circumstance **after FDP begins**; PIC consults other FLT crew; safe. | **700.63:** UOC **within 60 min of FDP beginning**; PIC consults **all crew** about fatigue; may reduce FDP, extend FDP, or extend REST. |\n| `R` UOC MAX | **+3 h** FDP. [604.102](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.102.html) | **+1 h** single-pilot · **+2 h** non-augmented · **+3 h** augmented +1 scheduled FLT · **+2 h** augmented +2–3 scheduled FLTs. [700.63](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.63.html) |\n| `R` UOC special | PIC informs private operator of UOC + EXT; operator retains notification **5 yr**. | Further UOC **after TKOF of final FLT already extended** → PIC may continue to DESTN/ALTN; PIC notifies operator **at FDP end**. [700.63(2),(4)](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.63.html) |\n| `R` UOC REST | **Next minimum REST += ≥actual FDP extension**. | **REST after extended FDP += ≥actual extension**. [700.63(3)](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.63.html) |\n| `R` UOC→split | `604.102` unexpected EXT ≠ `604.100` planned split. | **700.64:** post-start UOC may trigger split **only if PIC agrees before scheduled ground break**; after consulting crew, refuse if fatigue jeopardizes safety; waiting **before decision ≠ credited break**. [700.64](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.64.html) |\n| `T` | Extension changes **FDP MAX**, **not FLT time** limits under 604.98; split/UOC credits **not automatically stackable**. | Extension changes **FDP MAX**, **not FLT time** limits under 700.27; night split ≠ UOC night credit; no invented universal split cap. |\n\n- `M · L4` **604: 14h | 15h if 30d FDP≤70h OR prior REST≥24h | SPLIT≥4h→+MIN(½break,4h) + next REST≥EXT | UOC after start +3h MAX + next REST≥EXT, PIC→operator, 5yr record.**\n- `M · L4` **700 Div III: FDP 700.28 matrix | SPLIT≥60min→deduct45min, remaining ×100% (00–0559) / ×50% (06–2359 or UOC replan) | UOC ≤60min from FDP start→+1h single/+2h unaug/+3h aug1FLT/+2h aug2–3FLT + next REST≥EXT | 700.64 post-start split only before break + PIC consent.**\n\n\nShared additions reviewed 19 October 2026: [source editions and scope](../CONTENT_REVIEW.md#operational-additions--19-october-2026)."},{"id":"05-0","card":"05","h":"Overview","a":null,"c":["study-src"],"p":["PPL","CPL","IR"],"md":"`TARGETED CPAER REVIEW: 2026-09-06` | see `00_CPAER_REVIEW_NOTES.md` for scope and remaining gaps\n`P` procedure | `R` rule | `F` formula | `T` trap | `M` memory | `!` safety | `?` verify | Canada PPL/CPL/INRAT/IR\n`RELEASE:` `STUDY/OPS-REF PROVISIONAL` | `NOT FLIGHT AUTHORITY`\n`MOVED 2026-11-14:` knowledge sections now live in concept files under [`kb/met/`](../kb/met/README.md); headings below are kept as pointers so saved links still land. Go/no-go flows and gates remain here."},{"id":"05-1","card":"05","h":"Source / master scan","a":"source--master-scan","c":["met-products","study-src"],"p":["PPL","CPL","IR"],"u":"wxp-master-scan","md":"- `SRC:` current AIM MET + NAV CANADA/FIC + CARs/CAP/CFS/NOTAM. Products describe; PIC decides legal + safe.\n- Review GFA/AIRMET/SIGMET→TAF/METAR/SPECI→PIREP/upper winds→radar/satellite/lightning→RSC/CRFI/cameras.\n- `P:` big picture→route→DEP/enroute/DEST/ALT→escape→update. `M:` `SYNOPTIC-GFA-HAZARDS-TERMINALS-PIREP-WINDS-RUNWAY-TREND`.\n- `T:` never one product: decode→compare→trend→threats→options."},{"id":"05-2","card":"05","h":"Go/no-go gates","a":"gono-go-gates","c":["met-decide"],"p":["PPL","CPL","IR"],"u":"wxp-gates","md":"- `LEGAL:` minima/alternate/approach ban/fuel/equipment/day-night.\n- `AIRCRAFT:` icing approval/wind-XW/runway/performance/terrain/heat-defrost.\n- `PILOT:` currency/recent IMC-night-XW-ice/fatigue/workload. `OPTIONS:` alternates/turn-back/fuel/route-alt-time.\n- `T:` legal + no options = fragile."},{"id":"05-22","card":"05","h":"Wind / runway gate","a":"wind--runway-gate","c":["met-decide"],"p":["PPL","CPL","IR"],"u":"wxp-wind-runway","md":"- Compute steady + gust XW/HW/TW; compare POH/SOP/personal limits.\n- Add runway length/slope/surface/RSC/CRFI, obstacles, mechanical turbulence, wind shear.\n- `T:` gusty XW + wet/contaminated short runway = compounded risk, not separate minor issues."},{"id":"05-25","card":"05","h":"Night weather","a":"night-weather","c":["met-decide"],"p":["PPL","CPL","IR"],"u":"wxp-night","md":"- Raise minima for cloud/vis/terrain/precip. Horizon and cloud boundaries disappear; snow/black-hole effects worsen.\n- Moon illumination, terrain lighting and cloud cover affect visual navigation.\n- `T:` legal night VFR visibility may provide poor terrain/weather avoidance."},{"id":"05-26","card":"05","h":"VFR go/no-go flow","a":"vfr-gono-go-flow","c":["met-decide"],"p":["PPL","CPL"],"u":"wxp-vfr-flow","md":"- `P:` ceiling/vis trend→terrain clearance→cloud layers/tops→precip/TS→wind/XW→daylight/night→diversion airports→fuel.\n- Establish personal minimums by day/night, terrain, route familiarity and passenger pressure.\n- `T:` scud running = shrinking options; turn around before valley/ceiling closes."},{"id":"05-27","card":"05","h":"IFR go/no-go flow","a":"ifr-gono-go-flow","c":["met-decide","ifr-plan","ifr-wx"],"p":["IR"],"u":"wxp-ifr-flow","md":"- `P:` departure minima/ODP→enroute MEA/icing/TS→destination TAF/RVR/wind→alternate legality→approach/runway/NOTAM→missed/climb→fuel/options.\n- Single-engine IFR: terrain/icing/engine-failure landing options. Multi-engine: actual OEI climb/ceiling.\n- `T:` legal approach at destination + unusable alternate + icing enroute = no robust plan."},{"id":"05-28","card":"05","h":"Trend","a":"trend","c":["met-decide"],"p":["PPL","CPL","IR"],"u":"wxp-trend","md":"- Compare last `3` METAR/SPECI + TAF + GFA panels + radar/satellite + PIREPs; mark CIG/vis/wind/pressure `↑/↓` and precip/cell motion.\n- `M:` observation=now; forecast=expected; trend=forecast performance. Worse observations→confidence↓."},{"id":"05-29","card":"05","h":"Personal weather matrix","a":"personal-weather-matrix","c":["met-decide"],"p":["PPL","CPL","IR"],"u":"wxp-personal-matrix","md":"| Threat | Green | Amber | Red |\n|---|---|---|---|\n| ceiling/vis | well above personal min | close/trending down | below or no escape |\n| wind/XW | stable below limit | gusty/near limit | above limit/shear |\n| icing | none/clear escape | uncertain nearby | forecast/reported in route |\n| convection | none/distant | isolated with wide escape | line/embedded/near route |\n| runway | dry/long | wet/short margin | contam/braking unknown |\n| options | many | limited | single point of failure |\n\n- `T:` multiple amber items often equal red overall."},{"id":"05-30","card":"05","h":"FIC / in-flight update","a":"fic--in-flight-update","c":["met-products"],"p":["PPL","CPL","IR"],"u":"wxp-fic","md":"- Ask FIC: system timing/confidence, worst segment, bases/tops, ice layers/trend, convection motion, PIREPs, ALT/escape, next update; briefing does not transfer PIC responsibility.\n- Before critical point: DEST/ALT METAR-TAF→SIGMET/AIRMET→PIREP→radar/lightning→fuel→decision. Predefine divert trigger; file useful PIREP.\n- `M:` `UPDATE-FUEL-OPTIONS-DECIDE EARLY`."},{"id":"05-31","card":"05","h":"Hard no-go / exit triggers — light GA","a":"hard-no-go--exit-triggers--light-ga","c":["met-decide"],"p":["PPL","CPL","IR"],"u":"wxp-hard-no-go","md":"- Freezing rain/drizzle, embedded/line TS, severe icing/turbulence, runway below performance/braking needs, wind/shear beyond limits, ceiling/vis below legal or personal minima, no legal/suitable alternate, insufficient fuel/options.\n- `!:` unexpected ice, worsening VMC, rising terrain under lowering ceiling, cell growth/line closure, fuel below divert plan ⇒ exit now."},{"id":"05-32","card":"05","h":"INRAT weather question method","a":"inrat-weather-question-method","c":["ifr-wx","study-traps"],"p":["IR"],"u":"wxp-inrat-method","md":"- `1` locate ETA/time window; `2` decode prevailing/change groups; `3` identify legal threshold; `4` include TEMPO/PROB/BECMG rule; `5` check GFA/AIRMET/SIGMET/NOTAM; `6` calculate wind/fuel/temperature; `7` select legal answer, then note operational risk.\n- `T:` common distractors use wrong time, AGL vs ASL, BKN vs SCT, prevailing vs TEMPO, alternate vs landing minima."},{"id":"05-33","card":"05","h":"Pebble","a":"pebble","c":["met","study-pebble"],"p":["PPL","CPL","IR"],"u":"wxp-pebble","md":"- weather scan `SYNOPTIC-GFA-HAZARDS-TERMINALS-PIREP-WINDS-RUNWAY-TREND` | METAR now / TAF terminal future / GFA regional | METAR cloud AGL; GFA heights ASL unless stated | ceiling=BKN/OVC/VV | `FM` permanent exact | `BECMG` gradual | `TEMPO <1h each/≤half` | alternate BECMG improve=end/deteriorate=start | TEMPO≥alt min / PROB≥landing min | FZ liquid=red | visible moisture+subzero surface=ice | TS avoid | XW 30°=.5/45°=.7/60°=.87 | observations worse than forecast=confidence↓ | many amber=red."},{"id":"06-0","card":"06","h":"Overview","a":null,"c":["study-formulas","study-src"],"p":["PPL","CPL","IR"],"md":"Navigation calculations reviewed 2026-10-19. Other sections retain their review dates; see [review status](../CONTENT_REVIEW.md).\n`F` formula | `M` memory | `T` trap | `?` verify | Canada PPL/CPL/INRAT/IR mental math\n`RELEASE:` `DERIVED/STUDY-REF PROVISIONAL` | `NOT FLIGHT AUTHORITY`"},{"id":"06-1","card":"06","h":"Units / constants","a":"units--constants","c":["nav-units","study-formulas"],"p":["PPL","CPL","IR"],"md":"| Item | Memory |\n|---|---|\n| `1 NM` | `6076 ft` ≈ `1.852 km` |\n| `1 SM` | `5280 ft` ≈ `1.609 km` |\n| `1 NM` | ≈ `1.15 SM` |\n| `1 kt` | `1 NM/hr` ≈ `1.15 mph` ≈ `1.852 km/h` |\n| `1 hr` | `60 min`; `0.1 hr = 6 min` |\n| `1 gal US` | `3.785 L` |\n| `1 gal Imp` | `4.546 L` |\n| `1 US gal avgas` | ≈ `6 lb` |\n| `1 L avgas` | ≈ `1.6 lb` |\n| `1 kg` | `2.205 lb` |\n| `1 lb` | `0.454 kg` |\n| `1 inHg` | ≈ `33.86 hPa` |\n| `1 hPa` | ≈ `30 ft` pressure altitude rough |\n\n- `T:` US gal ≠ Imperial gal. POH fuel units may differ from pump/club logs."},{"id":"06-2","card":"06","h":"Time / speed / distance","a":"time--speed--distance","c":["nav-dr","study-formulas"],"p":["PPL","CPL","IR"],"md":"- `F:` `distance = GS × time(hr)`.\n- `F:` `time(hr)=distance/GS`; `time(min)=distance/GS×60`.\n- `F:` `GS=distance/time(hr)`.\n- `M:` `120 kt = 2 NM/min`; `90 kt = 1.5 NM/min`; `60 kt = 1 NM/min`.\n- `T:` navigation timing uses `GS`, not IAS/TAS."},{"id":"06-3","card":"06","h":"Quick ETE table","a":"quick-ete-table","c":["nav-dr","study-formulas"],"p":["PPL","CPL","IR"],"md":"Distance in NM × fraction = ETE in minutes. Use GS, including wind.\n\n| GS | ETE fraction | Mental calculation | 10 NM | 30 NM | 60 NM |\n|---:|---:|---|---:|---:|---:|\n| 60 kt | ×1 | same number | 10 min | 30 min | 60 min |\n| 75 kt | ×4/5 | ÷5 ×4 | 8 min | 24 min | 48 min |\n| 90 kt | ×2/3 | ÷3 ×2 | 6 min 40 s | 20 min | 40 min |\n| 100 kt | ×3/5 | ÷5 ×3 | 6 min | 18 min | 36 min |\n| 120 kt | ×1/2 | ÷2 ×1 | 5 min | 15 min | 30 min |\n| 150 kt | ×2/5 | ÷5 ×2 | 4 min | 12 min | 24 min |\n| 180 kt | ×1/3 | ÷3 ×1 | 3 min 20 s | 10 min | 20 min |\n\n90 kt: two-thirds of the NM gives minutes. Decimal minutes are not minutes:seconds."},{"id":"06-4","card":"06","h":"Fuel","a":"fuel","c":["agk-fuel","study-formulas"],"p":["PPL","CPL","IR"],"md":"- `F:` `fuel = time(hr) × burn`.\n- `F:` `time available = usable fuel / burn`.\n- `F:` `fuel remaining = fuel on board - fuel used`.\n- `F:` `fuel used = burn × minutes/60`.\n- `M:` burn `6 gph` ⇒ `0.1 gal/min`; burn `9 gph` ⇒ `0.15 gal/min`; burn `12 gph` ⇒ `0.2 gal/min`.\n- `T:` IFR reserve starts after required destination/alternate logic, not after takeoff."},{"id":"06-5","card":"06","h":"Weight / balance","a":"weight--balance","c":["agk-wb","study-formulas"],"p":["PPL","CPL","IR"],"md":"- `F:` `moment = weight × arm`.\n- `F:` `CG = Σmoment / Σweight`.\n- `F:` `new CG = (old moment ± added/removed/shifted moment) / new weight`.\n- `F:` shifted load moment change = `weight × distance shifted`.\n- `M:` forward load lowers arm? depends datum. Calculate, don’t feel it.\n- `T:` within max gross ≠ within CG envelope. Check takeoff + landing + zero-fuel if near limit."},{"id":"06-6","card":"06","h":"Pressure altitude / density altitude","a":"pressure-altitude--density-altitude","c":["met-atmos","study-formulas"],"p":["PPL","CPL","IR"],"md":"- `F:` `PA ≈ field elev + (29.92 - altimeter) × 1000`.\n- `F:` `ISA temp °C ≈ 15 - 2 × altitude(thousands ft)`.\n- `F:` `DA ≈ PA + 120 × (OAT - ISA)`.\n- `M:` hot/high/humid/low pressure ⇒ DA↑ ⇒ roll↑ climb↓. Heavy independently worsens performance; weight does NOT change DA.\n- `T:` DA formula is approximation; POH chart wins."},{"id":"06-7","card":"06","h":"Temperature","a":"temperature","c":["nav-units","study-formulas"],"p":["PPL","CPL","IR"],"u":"calc-temperature","md":"- `F:` `°C = (°F - 32) × 5/9`.\n- `F:` `°F = °C × 9/5 + 32`.\n- `M:` `0°C=32°F`; `10°C=50°F`; `20°C=68°F`; `30°C=86°F`.\n- `T:` cold temp correction affects obstacle clearance; not just comfort."},{"id":"06-8","card":"06","h":"Cold temperature / altitude error","a":"cold-temperature--altitude-error","c":["met-cold","study-formulas"],"p":["CPL","IR"],"md":"- `M:` high to low, look out below; warm to cold, look out below.\n- `F rough:` altitude error ≈ `4 ft × height above station(thousands ft) × °C below ISA`.\n- Example rough: `2000 ft above station`, `20°C colder than ISA` ⇒ `4×2×20=160 ft` low.\n- `T:` use approved cold-temperature/CAP correction tables when required; rough formula is memory aid only."},{"id":"06-9","card":"06","h":"Crosswind / headwind","a":"crosswind--headwind","c":["nav-dr","study-formulas"],"p":["PPL","CPL","IR"],"md":"- `F:` `headwind = wind speed × cos(angle)`.\n- `F:` `crosswind = wind speed × sin(angle)`.\n- `M:` `30° = 1/2 wind`; `45° ≈ 0.7 wind`; `60° ≈ 0.87 wind`; `90° = full wind`.\n- `M:` headwind component: `30°≈0.87`, `45°≈0.7`, `60°=0.5`, `90°=0`.\n- `T:` gusts matter. max demonstrated crosswind ≠ legal limit unless POH says; still operational limit/SOP/personal."},{"id":"06-10","card":"06","h":"Wind correction / nav triangle","a":"wind-correction--nav-triangle","c":["nav-dr","study-formulas"],"p":["PPL","CPL","IR"],"md":"- `F exact idea:` WCA depends wind angle, wind speed, TAS.\n- `F rough:` `WCA° ≈ 60 × crosswind / TAS`, for small WCA, with wind components resolved relative to desired track. Exact: `sin(WCA) = crosswind/TAS`; use a flight computer for large corrections.\n- `F:` `heading = track ± WCA`.\n- `M:` wind from right blows left ⇒ crab right.\n- `T:` variation/deviation are separate from WCA."},{"id":"06-11","card":"06","h":"True / magnetic / compass","a":"true--magnetic--compass","c":["nav-compass","study-formulas"],"p":["PPL","CPL","IR"],"md":"- `F:` `TC ± WCA = TH`; `TH ± variation = MH`; `MH ± deviation = CH`.\n- Alternatively convert TC→MC, then apply WCA to obtain MH before deviation. Never substitute magnetic course for magnetic heading.\n- `M:` true→mag: east is least, west is best.\n- `M:` TVMDC = True Virgins Make Dull Company; reverse = Can Dead Men Vote Twice.\n- `T:` track/course/heading/bearing are different. Track = ground path; heading = nose."},{"id":"06-12","card":"06","h":"Navigation aids — ADF / VOR / DME / intercepts","a":"navigation-aids--adf--vor--dme--intercepts","c":["nav-radio","study-formulas"],"p":["CPL","IR"],"md":"| Memory | Calculation / example |\n|---|---|\n| Conventions | MH = magnetic heading; RB = clockwise relative bearing from nose; BTS/BFS = bearing TO/FROM station. Use one north reference throughout. |\n| Wrap / Normaliser | wrap(x) = x modulo 360; add/subtract 360 until 0–359°. North may be written 000° or 360°. |\n| BTS = MH + RB | BTS = wrap(MH + RB). MH 350°, RB 040° → BTS 030°. |\n| BFS = BTS ±180 | BFS = wrap(BTS +180°). BTS 030° → BFS 210°: aircraft southwest of station. |\n| RB = BTS − MH | RB = wrap(BTS − MH). BTS 020°, MH 080° → RB 300° (60° left of nose). |\n| MH = BTS − RB | MH = wrap(BTS − RB). BTS 100°, RB 250° → MH 210°. |\n| ADF card / Rose | Fixed card: read RB. Movable card: set current MH under index to read magnetic BTS. RMI: correctly referenced needle head = BTS, tail = BFS. |\n| Turn / Virage | At essentially unchanged position, right turn +30° → RB decreases 30°; left turn → RB increases. BTS stays nearly unchanged. |\n| Homing ≠ tracking | RB 000° points the nose at the station. In crosswind, holding RB 000° gives a curved homing path. Tracking needs wind correction. |\n| VOR radial | Radial = bearing FROM station. On R-090: outbound course 090°; inbound course 270°. Identify aid and north reference (true-reference exceptions exist in Canada). |\n| TO / FROM | With CDI centred: selected course toward station → TO; reciprocal → FROM. Flag describes selected-course geometry, not aircraft heading or actual travel. |\n| 30° intercept setup | C = desired direction of travel, NOT always radial. Choose H = C ±30° toward the course line. Sketch station, current BFS and target line first; heading alone cannot select the side. No-wind examples below. |\n| Capture: inbound | At capture BTS = C; RB = wrap(C − H). H=C+30 → RB330; H=C−30 → RB030. Start rollout with appropriate lead. |\n| Capture: outbound | At capture BTS = wrap(C+180); RB = wrap(C+180−H). H=C+30 → RB150; H=C−30 → RB210. |\n| Inbound example | Aircraft west-northwest of NDB (BFS285), intercept C090 inbound: H120 toward line. At capture BTS090, RB330. Turn left toward 090, then correct wind. |\n| Outbound example | Aircraft northeast (BFS045), intercept C090 outbound: H120. At capture BFS090, BTS270, RB150. Turn left toward 090, then correct wind. |\n| Wind trap / Vent | 30° is a chosen training intercept, not a universal rule. Wind changes the ground intercept angle. Always compute capture RB from actual heading; after capture fly the wind-corrected heading. |\n| Cross-track distance | Lateral offset = ground range × sin(angular error); small angle ≈ range × error°/60. At 30 NM, 4° → about 2 NM. |\n| VOR dots | Conventional VOR CDI: normally 2° per dot, ±10° full scale. Two dots at 30 NM ≈ 2 NM. LOC and GNSS scales differ; check equipment/mode. |\n| DME geometry | Slant NM = √(ground NM² + height NM²); height NM = height above station(ft)/6076. Over station at 6076 ft above it → about 1 DME, not zero. |\n| DME ground range | Ground NM = √(DME² − height NM²). DME 5 NM, height 6076 ft → √24 ≈4.90 NM. DME speed/time meaningful toward/away from station; unreliable for along-track speed on an arc. |\n| 30° closing time | For a 30° GROUND-track intercept: closing speed = GS × sin30 = GS/2. Time(min)=120 × lateral NM/GS. 2 NM off at 120 kt → 2 min. Wind-correct heading to obtain that ground track. |\n***\n- `M VOR checks:` **4–6–4** = ground/VOT ±4° (FAA reference), airborne ±6°, dual receivers ≤4° total difference. Receiver accuracy ≠ tracking allowance. See [VOR receiver checks and Canadian source scope](10_inrat_knowledge_core_av_cave_v0_3.md#vor-receiver-checks--464)."},{"id":"06-13","card":"06","h":"1-in-60 rule","a":"1-in-60-rule","c":["nav-dr","study-formulas"],"p":["PPL","CPL","IR"],"md":"- `F:` `track error° ≈ offtrack × 60 / distance flown`.\n- `F:` `closing correction to destination° ≈ offtrack × 60 / distance remaining`.\n- `F:` total correction = track error + closing correction.\n- `M:` halfway off by 1 NM after 30 NM ⇒ error `2°`; if 30 NM left, add `2°`; total `4°`.\n- `T:` use distance flown for error; distance remaining for correction."},{"id":"06-14","card":"06","h":"Climb / descent gradient","a":"climb--descent-gradient","c":["agk-perfcalc","ifr-dep","study-formulas"],"p":["IR"],"md":"- `F:` `ft/NM = ROC(fpm) × 60 / GS`.\n- `F:` `ROC/ROD(fpm)=GS × gradient(ft/NM)/60`.\n- `M:` `200 ft/NM ≈ 3.3%`.\n- `M:` at `90 kt`, `300 ft/NM` needs `450 fpm`; at `120 kt`, needs `600 fpm`.\n- `T:` gradient uses groundspeed. Tailwind increases GS and required fpm."},{"id":"06-15","card":"06","h":"Percent gradient","a":"percent-gradient","c":["agk-perfcalc","ifr-dep","study-formulas"],"p":["IR"],"md":"- `F:` `% gradient = ft/NM / 60.76`.\n- `F:` `ft/NM ≈ % × 60.76`.\n- `M:` `3° glidepath ≈ 318 ft/NM ≈ 5.2%`.\n- `M:` `3.3% ≈ 200 ft/NM`.\n- `T:` degrees and percent are not the same."},{"id":"06-16","card":"06","h":"Descent planning","a":"descent-planning","c":["agk-perfcalc","ifr-app-fly","study-formulas"],"p":["PPL","CPL","IR"],"md":"- `F 3°:` `ROD ≈ GS × 5`.\n- `F 3°:` descent distance NM ≈ `altitude to lose / 300`.\n- `F:` time to descend = distance/GS×60.\n- `M:` `90 kt` on 3° ⇒ `450 fpm`; `100 kt` ⇒ `500 fpm`; `120 kt` ⇒ `600 fpm`.\n- `T:` add level-offs, stepdowns, tailwind, config, ATC restrictions."},{"id":"06-17","card":"06","h":"Holding","a":"holding","c":["ifr-hold","study-formulas"],"p":["IR"],"md":"- `F:` outbound timing adjusted to make inbound leg time.\n- `R:` standard hold: outbound `1 min` at/below `14,000 ft ASL`; `1.5 min` above `14,000 ft ASL`. For DME holding, ATC/published procedure specifies distance instead of time. `[AIM 2026-1 RAC 10.3/10.6]`\n- `M:` outbound wind correction ≈ `3×` inbound drift.\n- `F:` DME leg time = leg distance / GS × 60.\n- `T:` hold speed limits/published leg distances override memory."},{"id":"06-18","card":"06","h":"Rate-one turn / turn geometry","a":"rate-one-turn--turn-geometry","c":["agk-load","study-formulas"],"p":["PPL","CPL","IR"],"md":"- `F:` standard-rate turn = `3°/sec`; 360° in `2 min`.\n- `F rough:` bank for rate-one ≈ `TAS/10 + 7`.\n- `F:` turn radius `ft ≈ TAS² / (11.26 × tan(bank))`; radius `NM ≈ TAS² / (68,420 × tan(bank))`. `[DERIVED; TAS kt]`\n- `M:` at `120 kt`, rate-one bank ≈ `19°`; at `90 kt`, ≈`16°`.\n- `T:` high TAS needs more bank for standard rate."},{"id":"06-19","card":"06","h":"Load factor / accelerated stall","a":"load-factor--accelerated-stall","c":["agk-stall","agk-load","study-formulas"],"p":["PPL","CPL","IR"],"md":"- `F:` in a coordinated, constant-altitude turn, `n = 1 / cos(bank)`. The bank-only equation does not apply to every manoeuvre.\n- `F:` `Vs_bank = Vs × √n`.\n- `M:` `45°` bank ≈ `1.41g`, stall ×`1.19`; `60°` bank = `2g`, stall ×`1.41`.\n- `T:` accelerated stall depends load factor/AoA, not just bank; POH chart wins."},{"id":"06-20","card":"06","h":"Manoeuvring speed / stall-speed notation","a":"manoeuvring-speed--stall-speed-notation","c":["agk-stall","agk-load","agk-vspeeds","study-formulas"],"p":["PPL","CPL","IR"],"md":"- `VS` = generic stall speed in stated config; `VS1` = stall speed in specified config (**often clean**); `VS0` = stall speed in landing config. `VS` and `VS1` may denote the **same clean-config value** in context; do not substitute `VS0`.\n- `F theoretical:` positive stall/limit-load intersection `VA_est ≈ VS(clean) × √n_limit`, using matching config/weight/speed basis; **not guaranteed published VA**.\n- `M legacy normal:` `n_limit=+3.8` ⇒ `VA_est≈1.95×VS1` (mental shortcut `≈2×VS1`, **not a VA range**); e.g. `VS1=50 KIAS ⇒ ≈97.5 KIAS`.\n- `F weight:` approximate `VA2≈VA1×√(W2/W1)` if same config/load-factor basis; lighter ⇒ lower speed.\n- `T:` approved POH/AFM `VA` and weight schedule win; `VA` does **not** guarantee protection against multiple/abrupt control inputs or all turbulence."},{"id":"06-21","card":"06","h":"VREF / landing reference speed","a":"vref--landing-reference-speed","c":["agk-vspeeds","agk-perfcalc","study-formulas"],"p":["CPL","IR","ME"],"md":"- `Definition:` `VREF` is the landing reference speed. Use the POH/AFM value for the specified landing configuration; certification bases differ. In landing-distance certification it is maintained to the `50 ft` screen height.\n- `F fallback:` when `VREF` is not specified, use `VREF = 1.3 × VSO`. Example: `VSO 50 KIAS → VREF 65 KIAS`.\n- `F weight:` for the same configuration and speed basis, `VREF₂ ≈ VREF₁ × √(W₂/W₁)`. Use POH/AFM landing-weight data when published.\n- `Approach category:` use published `VREF`, or `1.3 VSO` if none is specified, at **maximum certificated landing weight**. Do not lower the category because today’s landing weight is lower. `[TC AIM 2026-1 RAC 9.21]`\n- `T:` a wind/gust additive changes the operational approach target (`VAPP`), not the underlying `VREF`. Aircraft procedures and limitations govern."},{"id":"06-22","card":"06","h":"Glide","a":"glide","c":["agk-perfcalc","study-formulas"],"p":["PPL","CPL","IR"],"md":"- `F:` glide distance `NM = height AGL(ft) × glide ratio / 6076`.\n- Example: `9:1` glide ratio ⇒ `1000 ft AGL ≈ 1.48 NM` still-air.\n- `F:` time aloft ≈ height to lose / descent rate.\n- `M C150M:` POH Fig. 3-1 shows approx `6000 ft AGL → 10 NM`; therefore `1000 ft ≈ 1.67 NM` at `60 KIAS`, flaps UP, prop windmilling, zero wind. `[C150M POH 1977 Fig. 3-1]`\n- `T:` use height above terrain, not altitude ASL. Wind, configuration, propeller, speed and aircraft condition change actual range."},{"id":"06-23","card":"06","h":"Runway / landing energy","a":"runway--landing-energy","c":["agk-perfcalc","study-formulas"],"p":["PPL","CPL","IR"],"md":"- `F:` kinetic energy ∝ `V²`.\n- `F:` speed increase energy factor = `(actual/target)²`.\n- `M:` `+10% speed` ⇒ `+21% energy`; `+20% speed` ⇒ `+44% energy`.\n- `T:` fast final burns runway and brakes. Tailwind hurts more than it feels."},{"id":"06-24","card":"06","h":"IFR fuel / reserve memory","a":"ifr-fuel--reserve-memory","c":["law-plan","ifr-plan","study-formulas"],"p":["IR"],"md":"- Prop IFR with alternate: destination approach+missed → alternate → land → `45 min`.\n- Prop IFR no alternate: destination approach+missed → `45 min`.\n- Turbojet/helicopter: same structure but `30 min`.\n- `T:` CAR text/current ops rules win; this is memory, not dispatch release."},{"id":"06-25","card":"06","h":"Alternate minima memory","a":"alternate-minima-memory","c":["ifr-alt","study-formulas"],"p":["IR"],"md":"| Case | Weather memory |\n|---|---|\n| 2+ precision, separate suitable runways | `400-1` or `+200/+1/2`, greater |\n| 1 precision | `600-2` or `+300/+1`, greater |\n| NPA only | `800-2` or `+300/+1`, greater |\n| no IFR approach | ≥`500 ft` above min IFR alt allowing VFR app/landing |\n\n- `T:` check CAP alternate notes, NOTAM, NAVAID, runway suitability, forecast type."},{"id":"06-26","card":"06","h":"TAF change groups","a":"taf-change-groups","c":["met-taf","study-formulas"],"p":["PPL","CPL","IR"],"md":"- `BECMG` improving: use new condition at end of period.\n- `BECMG` deteriorating: use new condition at start of period.\n- `TEMPO` must stay ≥ alternate minima.\n- `PROB` must stay ≥ landing minima.\n- `T:` alternate minima ≠ landing minima ≠ approach ban."},{"id":"06-27","card":"06","h":"RVR / visibility quick memory","a":"rvr--visibility-quick-memory","c":["ifr-minima","study-formulas"],"p":["IR"],"md":"- `R non-Part VII aeroplane:` if both measured, below minimum when `RVR A <1200` **or** `RVR B <600`; if only A or B measured, below minimum when that RVR `<1200`. `[CAR 602.129]`\n- Below-minimum RVR normally bars continuation beyond the applicable point, subject to listed exceptions: report received after FAF/final-course intercept, training no-landing, varying RVR, ground visibility ≥`1/4 SM`, or CAT III.\n- Advisory visibility helps planning; DA/MDA visual reference controls descent/landing.\n- `T:` this general rule excludes Part VII operations; ground visibility, runway visibility, RVR, advisory visibility and flight visibility are different."},{"id":"06-28","card":"06","h":"Coordinates / distance / map","a":"coordinates--distance--map","c":["nav-dr","nav-units","study-formulas"],"p":["PPL","CPL","IR"],"md":"- `1° latitude = 60 NM`.\n- `1' latitude = 1 NM`.\n- Longitude distance = `60 NM × cos(latitude)` per degree.\n- `F:` map distance real = measured distance × scale.\n- `T:` longitude spacing shrinks toward poles."},{"id":"06-29","card":"06","h":"Clocks / logbook","a":"clocks--logbook","c":["nav-dr","nav-units","study-formulas"],"p":["PPL","CPL","IR"],"md":"- `0.1 hr = 6 min`; `0.2=12`; `0.3=18`; `0.4=24`; `0.5=30`; `0.6=36`; `0.7=42`; `0.8=48`; `0.9=54`.\n- `F:` decimal hours = minutes/60.\n- `T:` flight time / air time / block time / night time / instrument time are different records."},{"id":"06-30","card":"06","h":"Pebble","a":"pebble","c":["study-pebble","study-formulas"],"p":["PPL","CPL","IR"],"md":"- `D=GS×t` | `t=min=D/GS×60` | `fuel=t×burn` | `CG=ΣM/ΣW` | `PA=elev+(29.92-alt)×1000` | `DA≈PA+120(OAT-ISA)` | `1-in-60: err=off×60/flown` | `WCA≈60×XW/TAS` | `ROC=GS×ft/NM/60` | `3° ROD=GS×5` | `TOD=alt lose/300` | `n=1/cosφ` | `Vsφ=Vs√n` | `VA_est=VS1√nlimit≈1.95VS1 @+3.8g; VS≈VS1 if same clean config ≠VS0` | `VREF=1.3VSO` if unpublished | `+10%V=+21%E` | `1°lat=60NM` | `0.1h=6min`."},{"id":"06-31","card":"06","h":"Sources & review status","a":"sources--review-status","c":["study-formulas","study-src"],"p":["PPL","CPL","IR"],"md":"See the [separate review record](../CONTENT_REVIEW.md#historical-source-review-notes) for source editions, check dates and earlier validation notes."},{"id":"07-0","card":"07","h":"Overview","a":null,"c":["type-c150","study-src"],"p":["PPL","CPL"],"md":"`SEPTEMBER CPAER REVIEW: retained reference, not freshly revalidated` | use exact aircraft/current operational sources\n`L` limitation | `P` POH procedure | `N` POH note | `T` trap | `M` memory | `!` safety | `PERF` chart-dependent | 1977 Cessna Model 150M\n`RELEASE:` `AIRCRAFT-REF PROVISIONAL` | `NOT FLIGHT AUTHORITY`"},{"id":"07-1","card":"07","h":"Source / status","a":"source--status","c":["type-c150","study-src"],"p":["PPL","CPL"],"md":"- `SRC:` provided `1977 Cessna Model 150M POH`; exact model, not confirmed for a specific serial/configuration.\n- `!:` before use, verify POH revision/service-letter updates, serial, Canadian supplements, equipment, W&B, placards, STCs and checklist.\n- `T:` carried aircraft POH/checklist wins."},{"id":"07-2","card":"07","h":"Aircraft","a":"aircraft","c":["agk-systems","type-c150"],"p":["PPL","CPL"],"md":"- Continental `O-200-A`: normally aspirated/carbureted/direct-drive/air-cooled, opposed `4-cylinder`, `201 cu in`; `100 BHP @2750 RPM`.\n- McCauley fixed-pitch `2-blade`, nominal `69 in`, approved `67.5–69 in`; max TKOF/LDG `1600 lb`.\n- Standard empty: Commuter `1111 lb`, Commuter II `1129 lb`; use actual aircraft data."},{"id":"07-3","card":"07","h":"Airspeed limitations","a":"airspeed-limitations","c":["agk-vspeeds","type-c150"],"p":["PPL","CPL"],"md":"| Item | KCAS | KIAS | Meaning |\n|---|---:|---:|---|\n| `Vne` | `141` | `141` | never exceed |\n| `Vno` | `104` | `107` | max structural cruise |\n| `Va @1600` | `95` | `97` | manoeuvring |\n| `Va @1450` | `90` | `93` | manoeuvring |\n| `Va @1300` | `85` | `88` | manoeuvring |\n| `Vfe` | `89` | `85` | max flap extended |\n| max window open | `141` | `141` | |\n\n- `T:` preserve POH units. `KIAS≠KCAS`, especially near stall/flap speeds.\n- `T:` `Vx=56 KIAS` is the best-angle value; POH short-field obstacle procedure uses `60 KIAS @50 ft`. Do not substitute one for the other."},{"id":"07-4","card":"07","h":"Airspeed-indicator markings","a":"airspeed-indicator-markings","c":["agk-vspeeds","agk-pitot","type-c150"],"p":["PPL","CPL"],"md":"| Marking | KIAS | Meaning |\n|---|---:|---|\n| white | `42–85` | full-flap range |\n| green | `47–107` | normal operating |\n| yellow | `107–141` | caution; smooth air only |\n| red | `141` | never exceed |"},{"id":"07-5","card":"07","h":"Engine / instrument limits","a":"engine--instrument-limits","c":["agk-engine","type-c150"],"p":["PPL","CPL"],"md":"| Item | Limit / range |\n|---|---|\n| max RPM | `2750` |\n| static RPM | `2460–2560` full throttle, carb heat cold, full rich |\n| tach green | `2000–2750 RPM` |\n| oil pressure min | `10 psi` |\n| oil pressure normal | `30–60 psi` |\n| oil pressure max | `100 psi` |\n| oil temperature normal | `100–240°F` / `38–116°C` |\n| oil temperature max | `240°F` / `116°C` |\n\n- `T:` abnormal static RPM can indicate engine/propeller/induction condition; do not accept without maintenance assessment."},{"id":"07-6","card":"07","h":"Weight / CG / baggage","a":"weight--cg--baggage","c":["agk-wb","type-c150"],"p":["PPL","CPL"],"md":"- Datum firewall face; forward CG `31.5 in @≤1280 lb`→`32.9 in @1600`; aft `37.5 in` all weights.\n- Baggage 1 station `50–76`: `120 lb`; area 2 `76–94`: `40 lb`; combined max `120 lb`.\n- Graph arms: seats avg `39 in` (`33–41`), baggage 1≈`64`, area 2≈`84`.\n- `P:` actual basic empty W/moment→add occupants/fuel/baggage→total→plot. `T:` never use published standard empty for actual W&B."},{"id":"07-7","card":"07","h":"Manoeuvre / structural limits","a":"manoeuvre--structural-limits","c":["agk-load","type-c150"],"p":["PPL","CPL"],"md":"- Utility category. Approved only: chandelles/lazy eights/steep turns `95 kt`; spins and non-whip stalls by slow deceleration.\n- Load factors: flaps UP `+4.4/-1.76 g`; DOWN `+3.5 g`; no abrupt controls above `Va`.\n- No intentional spin with flaps, baggage or occupied child seat; known icing prohibited.\n- `T:` approval still requires training, altitude, area, W&B and regulatory compliance."},{"id":"07-8","card":"07","h":"Fuel","a":"fuel","c":["agk-fuel","type-c150"],"p":["PPL","CPL"],"md":"| System | Total | Usable | Unusable |\n|---|---:|---:|---:|\n| standard | `26.0 US gal` | `22.5` | `3.5` |\n| long range | `38.0 US gal` | `35.0` | `3.0` |\n\n- Two vented wing tanks→gravity feed→shutoff valve→strainer→carburetor.\n- Cross-feeding occurs; re-top both tanks after refuelling to assure maximum capacity.\n- Approved fuels: `80/87 red`, `100LL blue`, `100/130 green`.\n- `T:` visually verify quantity; gauges + clock/burn tracking, not gauges alone."},{"id":"07-9","card":"07","h":"Oil","a":"oil","c":["agk-engine","type-c150"],"p":["PPL","CPL"],"md":"- Sump `6 qt`; system `7 qt` with full-flow filter; minimum `4 qt`; POH suggests `5 qt` for flights `<3 h`, `6 qt` extended.\n- Break-in: straight mineral until POH hours/consumption stabilized, then ashless dispersant.\n- Viscosity: `SAE 40` above `4°C/40°F`; `10W30 or SAE 20` below."},{"id":"07-10","card":"07","h":"Normal speeds — max weight unless noted","a":"normal-speeds--max-weight-unless-noted","c":["agk-vspeeds","type-c150"],"p":["PPL","CPL"],"md":"| Operation | KIAS / config |\n|---|---|\n| normal climb-out | `60–70` |\n| short-field at 50 ft | `60`, flaps UP |\n| normal climb | `65–75`, flaps UP |\n| `Vy` | `68 SL → 62 @10,000` |\n| `Vx` | `56` SL through `10,000` |\n| normal approach | `60–70` flaps UP |\n| normal approach | `50–60` flaps `40°` |\n| short-field approach | `52`, flaps `40°` |\n| balked landing | max power, flaps `20°`, `55` |\n| max demonstrated XW | `13 kt` |\n\n- `N:` max demonstrated crosswind is not stated as a limiting value."},{"id":"07-11","card":"07","h":"Preflight — POH highlights","a":"preflight--poh-highlights","c":["ops-to","type-c150"],"p":["PPL","CPL"],"md":"- Remove all frost/ice/snow; controls internally free of ice/debris.\n- Cabin: lock out; ignition OFF; master ON gauges check/OFF; fuel ON.\n- Wings: tie-down/tire; sump before first flight and after refuel; visually verify fuel/caps.\n- Nose: oil (`4 qt` min; `6` extended), strainer drain≈`4 sec`, prop/spinner, filter, light, strut/tire, static port.\n- `T:` any water→continue draining all specified points until clear."},{"id":"07-12","card":"07","h":"Before start","a":"before-start","c":["ops-to","type-c150"],"p":["PPL","CPL"],"md":"- `P:` preflight complete→seats/belts/shoulder harnesses adjusted/locked→fuel ON→radios/electrical OFF→brakes test/set→breakers IN."},{"id":"07-13","card":"07","h":"Start","a":"start","c":["ops-to","type-c150"],"p":["PPL","CPL"],"md":"- `P:` MIX RICH→carb heat COLD→master ON→prime→throttle `1/4 in`→CLEAR→START→oil P.\n- Prime: warm `1–2`, cold up to `6`; flooded: MIX ICO/throttle full/crank/restart no prime.\n- `!:` oil P within `30 sec` summer/`60 sec` very cold or stop. Carb heat only if needed; air unfiltered."},{"id":"07-14","card":"07","h":"Taxi","a":"taxi","c":["ops-to","type-c150"],"p":["PPL","CPL"],"md":"- Minimum speed/braking; use wind controls.\n- Carb heat COLD unless necessary; heated induction air is unfiltered.\n- Low RPM over gravel/cinders to protect propeller."},{"id":"07-15","card":"07","h":"Before takeoff","a":"before-takeoff","c":["ops-to","type-c150"],"p":["PPL","CPL"],"md":"- `P:` doors→brake→controls→instruments→fuel ON→MIX RICH below `5000 ft`→trim→`1700 RPM`.\n- Run-up: each mag drop `≤150 RPM`, difference `≤75 RPM`; carb-heat drop; engine/ammeter/suction; radios/lights/friction.\n- Field `>5000 ft`: full-throttle static lean for max RPM."},{"id":"07-16","card":"07","h":"Normal takeoff","a":"normal-takeoff","c":["ops-to","type-c150"],"p":["PPL","CPL"],"md":"- `P:` flaps `0°`→carb heat COLD→full throttle→lift nosewheel at `50 KIAS`→climb `60–70`.\n- Verify expected static/full-throttle RPM and engine indications before commitment."},{"id":"07-17","card":"07","h":"Short-field takeoff","a":"short-field-takeoff","c":["ops-to","type-c150"],"p":["PPL","CPL"],"md":"- `P:` flaps `0°`→carb heat COLD→brakes APPLY→full throttle→brakes RELEASE→slightly tail-low→`60 KIAS` with obstacle.\n- POH obstacle-clearance speed is `60`, despite pure `Vx=56`; it accounts for near-ground turbulence/overall obstacle performance."},{"id":"07-18","card":"07","h":"Soft / rough field flap logic","a":"soft--rough-field-flap-logic","c":["ops-to","type-c150"],"p":["PPL","CPL"],"md":"- Normal/short: flaps UP. `10°` cuts ground run≈`10%`, advantage gone by `50 ft`; reserve for minimum run/soft-rough field.\n- With obstacle, normally retain `10°` until clear; hot/high marginal climb may require retraction. `>10°` prohibited for TKOF."},{"id":"07-19","card":"07","h":"Crosswind takeoff","a":"crosswind-takeoff","c":["ops-to","type-c150"],"p":["PPL","CPL"],"md":"- Minimum flap needed; accelerate slightly above normal, lift off decisively, then coordinate into wind.\n- `T:` school technique may refine POH baseline."},{"id":"07-20","card":"07","h":"Climb","a":"climb","c":["ops-to","type-c150"],"p":["PPL","CPL"],"md":"- Normal `65–75 KIAS`, flaps UP/full throttle; `Vy 68 SL→62 @10,000`; `Vx 56`.\n- MIX full rich below `5000 ft`, may lean above for smoothness; keep steep low-speed climbs brief for cooling."},{"id":"07-21","card":"07","h":"Cruise / leaning","a":"cruise--leaning","c":["agk-engine","type-c150"],"p":["PPL","CPL"],"md":"- `P:` `2000–2750 RPM`, ≤`75%`→trim→LEAN; normal cruise `55–75%`, charts assume recommended lean.\n- `T:` RPM alone≠power across altitude/temp; use chart/power computer."},{"id":"07-22","card":"07","h":"Before landing","a":"before-landing","c":["ops-ldg","type-c150"],"p":["PPL","CPL"],"md":"- `P:` seats/belts/harnesses secure→mixture RICH→full carb heat before closing throttle."},{"id":"07-23","card":"07","h":"Normal landing","a":"normal-landing","c":["ops-ldg","type-c150"],"p":["PPL","CPL"],"md":"- `P:` `60–70` UP→flaps below `85`→`50–60` DOWN→power-off mains first→nose gently→minimum brake."},{"id":"07-24","card":"07","h":"Short-field landing","a":"short-field-landing","c":["ops-ldg","type-c150"],"p":["PPL","CPL"],"md":"- `P:` flaps `40°` below `85`→`52` smooth-air→power path→idle after obstacle→mains→nose down→full-up elevator/max non-skid brake→flaps UP.\n- Add slight speed in turbulence. `T:` excess speed sharply increases distance."},{"id":"07-25","card":"07","h":"Crosswind landing","a":"crosswind-landing","c":["ops-ldg","type-c150"],"p":["PPL","CPL"],"md":"- Crab, wing-low or combination; strong XW: minimum flap needed for field. Maintain directional/wind control after touchdown."},{"id":"07-26","card":"07","h":"Balked landing","a":"balked-landing","c":["ops-ldg","type-c150"],"p":["PPL","CPL"],"md":"- `P:` throttle FULL→carb heat COLD→flaps RETRACT TO `20°`→`55 KIAS`→flaps retract slowly after safe climb.\n- `T:` abrupt full-flap retraction at low speed can cause sink."},{"id":"07-27","card":"07","h":"After landing / secure","a":"after-landing--secure","c":["ops-ldg","type-c150"],"p":["PPL","CPL"],"md":"- After landing: flaps UP; carb heat COLD.\n- Secure: parking brake SET→radios/electrical OFF→mixture ICO→ignition OFF→master OFF→control lock."},{"id":"07-28","card":"07","h":"Emergency speeds","a":"emergency-speeds","c":["agk-vspeeds","type-c150"],"p":["PPL","CPL"],"md":"| Event | KIAS / config |\n|---|---|\n| failure immediately after takeoff | `60` |\n| maximum glide | `60`, flaps UP |\n| no-power landing | `65` flaps UP / `55` flaps DOWN |\n| precautionary inspection | `60`, flaps `20°` |\n| precautionary final | `55`, flaps `40°` |\n| ditching | `55`, flaps `40°`, power for `300 fpm` if available |\n| engine fire in flight | `85` initially |\n| no-elevator landing | approx `55`, flaps `20°` |"},{"id":"07-29","card":"07","h":"Engine failure — takeoff roll","a":"engine-failure--takeoff-roll","c":["type-c150","emg-engine"],"p":["PPL","CPL"],"md":"- `P:` throttle IDLE→brakes APPLY→flaps RETRACT→mixture ICO→ignition OFF→master OFF."},{"id":"07-30","card":"07","h":"Engine failure — immediately after takeoff","a":"engine-failure--immediately-after-takeoff","c":["ops-to","type-c150","emg-engine"],"p":["PPL","CPL"],"md":"- `P:` `60 KIAS`→mixture ICO→fuel OFF→ignition OFF→flaps as required→master OFF.\n- `!:` speed first; landing path ahead/near-ahead."},{"id":"07-31","card":"07","h":"Engine failure — in flight / restart","a":"engine-failure--in-flight--restart","c":["type-c150","emg-engine"],"p":["PPL","CPL"],"md":"- `P:` `60 KIAS`→carb heat ON→primer IN/LOCKED→fuel ON→mixture RICH→ignition BOTH, or START if prop stopped.\n- If no restart: commit to forced landing checklist."},{"id":"07-32","card":"07","h":"Forced landing without power","a":"forced-landing-without-power","c":["type-c150","emg-engine"],"p":["PPL","CPL"],"md":"- `P:` `65 UP / 55 DOWN`→mixture ICO→fuel OFF→ignition OFF→flaps as required, `40°` recommended→master OFF→doors UNLATCH before touchdown→slightly tail-low→brakes heavily.\n- `T:` only use flap after landing is assured."},{"id":"07-33","card":"07","h":"Precautionary landing with power","a":"precautionary-landing-with-power","c":["type-c150","emg-engine"],"p":["PPL","CPL"],"md":"- `P:` `60`, flaps `20°`→inspect selected field→retract flap after safe climb→radio/electrical OFF→flaps `40°` final→`55`→master OFF→doors unlatch→slightly tail-low→ignition OFF→heavy brakes."},{"id":"07-34","card":"07","h":"Ditching","a":"ditching","c":["type-c150","emg-engine"],"p":["PPL","CPL"],"md":"- `P:` MAYDAY `121.5` + position/intentions→secure/jettison heavy items→high wind/heavy sea INTO wind; light wind/heavy swells PARALLEL swells→flaps `40°`→power for `300 fpm @55`→doors unlatch→level attitude at touchdown→protect face→evacuate→inflate vests/raft after exit."},{"id":"07-35","card":"07","h":"Engine fire during start","a":"engine-fire-during-start","c":["type-c150","emg-fire"],"p":["PPL","CPL"],"md":"- Continue cranking to draw fire into engine.\n- If engine starts: `1700 RPM` briefly→shutdown→inspect.\n- If no start: continue cranking→obtain extinguisher→master OFF→ignition OFF→fuel OFF→extinguish→inspect/repair."},{"id":"07-36","card":"07","h":"Engine fire in flight","a":"engine-fire-in-flight","c":["type-c150","emg-fire"],"p":["PPL","CPL"],"md":"- `P:` mixture ICO→fuel OFF→master OFF→cabin heat/air OFF except wing-root vents→`85 KIAS`; if fire persists, increase speed to find non-combustible mixture→forced landing.\n- Do not restart."},{"id":"07-37","card":"07","h":"Electrical fire","a":"electrical-fire","c":["agk-elec","type-c150","emg-fire"],"p":["PPL","CPL"],"md":"- `P:` master OFF→all other switches except ignition OFF→vents/cabin air/heat CLOSED→extinguisher.\n- After extinguisher: ventilate cabin.\n- If power essential and fire fully out: master ON→breakers inspect; do not reset faulty breaker→switches ON one at a time with delay."},{"id":"07-38","card":"07","h":"Cabin / wing fire","a":"cabin--wing-fire","c":["type-c150","emg-fire"],"p":["PPL","CPL"],"md":"- Cabin: master OFF→vents/heat CLOSED→extinguisher→land ASAP.\n- Wing: nav/strobe/pitot heat OFF→side-slip to keep flames from fuel tank/cabin→land ASAP with flaps retracted."},{"id":"07-39","card":"07","h":"Inadvertent icing","a":"inadvertent-icing","c":["met-icing","type-c150"],"p":["PPL","CPL"],"md":"- `L:` known icing prohibited.\n- `P:` pitot heat ON if installed→turn back/change altitude to less-conducive temperature→max defrost heat→increase engine RPM→watch carb/filter ice; carb heat as required→lean for max RPM if continuous heat→nearest airport.\n- `T:` this is an escape checklist, not authorization to remain in icing."},{"id":"07-40","card":"07","h":"Spin recovery","a":"spin-recovery","c":["agk-stall","type-c150"],"p":["PPL","CPL"],"md":"- `P:` throttle IDLE + ailerons NEUTRAL→full opposite rudder→immediately/briskly move wheel forward enough to break stall→hold until rotation stops→neutralize rudder→smooth dive recovery.\n- Training: POH recommends `1–2` turns; cabin clear/loose items secured; no baggage or occupied child seat.\n- `L:` intentional spins with flaps extended prohibited."},{"id":"07-41","card":"07","h":"Landing without elevator control","a":"landing-without-elevator-control","c":["type-c150","emg-sys"],"p":["PPL","CPL"],"md":"- Trim level at approx `55 KIAS`, flaps `20°`.\n- Do not change trim; use power exclusively for glide path.\n- At flare: full nose-up trim + power to rotate to level touchdown attitude; close throttle at touchdown."},{"id":"07-42","card":"07","h":"Vacuum-system failure / cloud","a":"vacuum-system-failure--cloud","c":["agk-gyro","type-c150","emg-sys"],"p":["PPL","CPL"],"md":"- Directional and attitude indicators may be disabled; electrically powered turn coordinator/turn-and-bank remains primary legacy backup.\n- POH provides timed standard-rate 180° and emergency-descent procedures.\n- `T:` actual installed instruments/avionics may differ; use current supplement/SOP and declare early."},{"id":"07-43","card":"07","h":"Spin vs spiral memory","a":"spin-vs-spiral-memory","c":["agk-stall","type-c150"],"p":["PPL","CPL"],"md":"- Spin: stalled, low AS, rotation.\n- Spiral: AS increasing; recovery = throttle idle→wings level→smooth pullout."},{"id":"07-44","card":"07","h":"Electrical system","a":"electrical-system","c":["agk-elec","type-c150"],"p":["PPL","CPL"],"md":"- `14 V DC`, `60 A` alternator, `12 V/25 Ah` battery, single bus; split master `BAT`=aircraft power, `ALT`=field.\n- Mags independent of master/battery; ammeter shows battery charge/discharge.\n- `T:` prolonged ALT OFF may deplete battery enough to prevent alternator restart."},{"id":"07-45","card":"07","h":"High-voltage light / alternator","a":"high-voltage-light--alternator","c":["agk-elec","type-c150","emg-sys"],"p":["PPL","CPL"],"md":"- Over-voltage sensor removes field current and shuts alternator; red `HIGH VOLTAGE` light illuminates.\n- `P:` master OFF then ON once to reset.\n- If light stays out: charging resumed.\n- If light returns: malfunction; terminate flight as soon as practical.\n- `T:` exact current-aircraft checklist/supplement wins."},{"id":"07-46","card":"07","h":"Carburetor / induction","a":"carburetor--induction","c":["carb-ice","type-c150"],"p":["PPL","CPL"],"md":"- Updraft float carburetor, fixed jet, accelerator pump, manual mixture, idle cut-off.\n- Fuel reaches carb by gravity.\n- Full carb heat at full throttle causes about `200–250 RPM` loss.\n- Primer draws from fuel strainer and injects intake manifold; lock primer IN."},{"id":"07-47","card":"07","h":"Cooling","a":"cooling","c":["agk-engine","type-c150"],"p":["PPL","CPL"],"md":"- Ram-air cooling; no manual cowl-flap control.\n- Winterization kit intended for consistently below `-7°C / 20°F`."},{"id":"07-48","card":"07","h":"Brakes","a":"brakes","c":["agk-systems","type-c150"],"p":["PPL","CPL"],"md":"- Single-disc hydraulic brake on each main wheel; interconnected toe brakes; parking brake.\n- If braking fades: release then reapply firmly.\n- Spongy/excess travel: pumping may restore pressure.\n- One brake weak/failed: use other sparingly + opposite rudder."},{"id":"07-49","card":"07","h":"Performance — headline specifications","a":"performance--headline-specifications","c":["agk-perfcalc","type-c150"],"p":["PPL","CPL"],"md":"| Item | Published value |\n|---|---:|\n| max speed SL | `109 kt` |\n| 75% cruise @7000 | `106 kt` |\n| ROC SL | `670 fpm` |\n| service ceiling | `14,000 ft` |\n| TO ground roll | `735 ft` |\n| TO over 50 ft | `1385 ft` |\n| LDG ground roll | `445 ft` |\n| LDG over 50 ft | `1075 ft` |\n\n- `T:` headline values are not substitutes for chart calculations at actual weight/PA/OAT/wind/surface/technique."},{"id":"07-50","card":"07","h":"Performance-chart rules","a":"performance-chart-rules","c":["agk-perfcalc","type-c150"],"p":["PPL","CPL"],"md":"- Test aircraft/engine good, average technique; choose conservative next-higher altitude/temp and apply only chart-authorized wind correction.\n- Range/endurance may vary `10%+` with leaning/metering/engine-prop/turbulence; add margin for grass, slope, contamination or degradation."},{"id":"07-51","card":"07","h":"Rate-of-climb memory — 1600 lb, flaps UP, full throttle, standard temperature","a":"rate-of-climb-memory--1600-lb-flaps-up-full-throttle-standard-temperature","c":["agk-perfcalc","type-c150"],"p":["PPL","CPL"],"md":"| Pressure altitude | KIAS | ROC fpm |\n|---:|---:|---:|\n| SL | `68` | `670` |\n| `2000` | `67` | `590` |\n| `4000` | `65` | `510` |\n| `6000` | `64` | `425` |\n| `8000` | `63` | `345` |\n| `10,000` | `62` | `265` |\n| `12,000` | `61` | `180` |\n\n- `N:` increase climb time/fuel/distance `10%` for each `8°C` above standard.\n- Add `0.8 US gal` for start/taxi/takeoff to climb-fuel planning."},{"id":"07-52","card":"07","h":"Maximum glide","a":"maximum-glide","c":["agk-perfcalc","type-c150"],"p":["PPL","CPL"],"md":"- Conditions: `60 KIAS`, flaps UP, propeller windmilling, zero wind.\n- Approx memory: `6000 ft` height above terrain ≈ `10 NM`; about `1.67 NM/1000 ft`.\n- `T:` use height above terrain, not altitude ASL; wind materially changes ground range."},{"id":"07-53","card":"07","h":"Cruise sample — not universal","a":"cruise-sample--not-universal","c":["agk-perfcalc","type-c150"],"p":["PPL","CPL"],"md":"- POH sample at approx `6000 ft`, `20°C above standard`, `2600 RPM`: about `60%`, `98 KTAS`, `4.5 GPH`.\n- `T:` sample problem only; use Figure 5-7 for actual altitude/temp/RPM."},{"id":"07-54","card":"07","h":"Range / endurance assumptions","a":"range--endurance-assumptions","c":["agk-perfcalc","type-c150"],"p":["PPL","CPL"],"md":"- `1600 lb`, recommended lean, standard temp; range zero wind; includes start/taxi/TKOF/climb and `45 min @45%` reserve=`2.6 US gal`.\n- `T:` legal/personal reserve may exceed chart assumption."},{"id":"07-55","card":"07","h":"Airspeed calibration snapshots","a":"airspeed-calibration-snapshots","c":["agk-vspeeds","agk-pitot","type-c150"],"p":["PPL","CPL"],"md":"| Flaps | KIAS | Approx KCAS |\n|---|---:|---:|\n| UP | `40/50/60/70/80/90/100` | `43/51/59/68/77/87/98` |\n| `10°` | `40/50/60/70/80/85` | `42/50/60/69/78/82` |\n| `40°` | `40/50/60/70/80/85` | `40/50/61/72/83/89` |\n\n- `T:` stall chart lists approximate `KIAS`; limitation table may use both `KCAS/KIAS`."},{"id":"07-56","card":"07","h":"POH memory pebble","a":"poh-memory-pebble","c":["type-c150","study-pebble"],"p":["PPL","CPL"],"md":"- `1600 lb` | `Vne141` | `Vno107` | `Va97/93/88` | `Vfe85` | XW demo `13`\n- engine `O-200-A / 100HP / 2750` | static `2460–2560`\n- oil `4 min / 5 normal / 6 extended` | pressure `10–100`, normal `30–60`\n- fuel std `26/22.5`; LR `38/35`\n- TKOF `F0 / nose50 / climb60–70` | short `F0 / 60@50`\n- climb `65–75`; `Vy68→62`; `Vx56`\n- APP `60–70 UP / 50–60 F40`; short `52 F40`\n- GO `full / carb cold / F20 / 55 / flaps slow`\n- EFATO `60`; glide `60`; forced `65 UP /55 DOWN`\n- restart `60-HEAT-PRIMER-FUEL-MIX-MAGS`\n- fire engine `MIX-FUEL-MASTER-HEAT-AIR-85-LAND`\n- spin `IDLE-AIL NEUT-OPP RUD-FWD-HOLD-NEUT-RECOVER`\n- `POH/current aircraft checklist wins`."},{"id":"08-0","card":"08","h":"Overview","a":null,"c":["study-src"],"p":["PPL","CPL"],"md":"`TARGETED CPAER REVIEW: 2026-09-06` | see `00_CPAER_REVIEW_NOTES.md` for scope and remaining gaps\n`P` procedure | `S` symptom | `T` trap | `M` memory | `!` safety | `?` verify | trainer/light-aircraft generic; POH/AFM/SOP wins\n`RELEASE:` `STUDY / AIRCRAFT-DEPENDENT` | `NOT FLIGHT AUTHORITY`"},{"id":"08-1","card":"08","h":"Source / discipline / scan","a":"source--discipline--scan","c":["agk-systems","study-src"],"p":["PPL","CPL"],"md":"- `SRC:` exact POH/AFM §3 + systems, current checklist/SOP; FTM/TP guidance.\n- Memorize only aircraft-designated memory items; abnormal checklists normally read-and-do.\n- `P:` control→power/sound→fuel→oil→electrical→pitot/static/gyro→controls/config→smoke/fire/odour; confirm instrument failure with `≥2` independent indications.\n- `M:` `CONTROL-DIAGNOSE-MEMORY-CHECKLIST-DECLARE-LAND` | `POWER-FUEL-OIL-ELECTRIC-AIR-DIRECTION-CONTROLS`.\n- `T:` preserve control/landing options; same symptom may have several causes."},{"id":"08-2","card":"08","h":"Engine essentials","a":"engine-essentials","c":["agk-engine"],"p":["PPL","CPL"],"md":"- Piston engine needs: air + fuel + ignition + compression + correct timing.\n- Power loss scan: throttle/mixture/carb heat/fuel selector/quantity/primer/mags/boost pump as installed.\n- `M:` `AIR-FUEL-SPARK-COMPRESSION`.\n- `T:` partial power may be temporary. Keep a landing area continuously available."},{"id":"08-3","card":"08","h":"Magnetos / ignition","a":"magnetos--ignition","c":["agk-engine"],"p":["PPL","CPL"],"md":"- Mags are battery/alternator-independent; dual mags/plugs add redundancy/efficiency. Engine running with master OFF is normal.\n- One-mag roughness: plug fouling, mag/lead or mixture. `!:` bad P-lead can leave mag live—moving prop may start engine.\n- `T:` electrical failure may spare engine but remove radios/lights/flaps/gear/instruments."},{"id":"08-4","card":"08","h":"Magneto roughness in flight","a":"magneto-roughness-in-flight","c":["agk-engine","emg-engine"],"p":["PPL","CPL"],"md":"- `P:` control→mixture adjust→carb heat as appropriate→select mags individually briefly per POH→return BOTH if worse→land/divert.\n- `T:` switching to OFF in flight may load exhaust with fuel; returning to BOTH can cause backfire/damage. Follow POH.\n- `!:` severe vibration/power loss/fire indications = treat as engine emergency, not merely a mag check."},{"id":"08-5","card":"08","h":"Mixture","a":"mixture","c":["agk-engine"],"p":["PPL","CPL"],"md":"- Too rich: rough/fouling/high burn/power loss aloft; too lean: rough/power loss/high temps/detonation risk at high power.\n- Lean by POH RPM/EGT/monitor method. `T:` full rich may be over-rich for high-DA TKOF."},{"id":"08-6","card":"08","h":"Carburetor icing","a":"carburetor-icing","c":["carb-ice"],"p":["PPL","CPL"],"md":"- Can occur in moist air from about `-13°C to +38°C`; risk high in humid partial-power operation.\n- `S:` fixed-pitch: unexplained RPM↓, then roughness/airspeed↓. Constant-speed: manifold pressure↓.\n- `P:` full carb heat→expect initial power loss/roughness→leave full hot until ice clears→re-adjust power/mixture per POH.\n- `M:` initial worse, then better = ice melting.\n- `T:` partial heat without carb-air-temperature guidance may place air in icing range. Heated air is usually unfiltered and reduces power.\n- `T:` structural icing conditions and carb-ice conditions are related but not identical."},{"id":"08-7","card":"08","h":"Aviation fuel grades / FSII — L4","a":"aviation-fuel-grades--fsii--l4","c":["agk-fuel"],"p":["CPL","ME"],"md":"| Key | Recall |\n|---|---|\n| `T` OCTANE | AVGAS **antiknock/detonation resistance**, not fuel energy; **80/87 = lean/rich ratings**, likewise **100/130** (rich performance number >100 ≠ % octane). |\n| `M` AVGAS | **80/87 RED** · **100/130 GREEN** · **100LL BLUE** (`LL` = low lead, **≠ unleaded**; rated 100 lean / 130 rich). |\n| `M` JET A | Kerosene-type turbine fuel; **max freezing point −40°C**. |\n| `M` JET A-1 | Kerosene-type turbine fuel; **max freezing point −47°C**. |\n| `T` JET B | Wide-cut gasoline/kerosene-type turbine fuel, more volatile; fuel specification / AFM approval required. |\n| `R` FSII | **Fuel System Icing Inhibitor:** lowers freezing point of **water in fuel** → prevents fuel-line/filter ice; **not fuel freeze-point improver or airframe de-icer**; use approved additive/concentration only. |\n| `T` ICE | **Fuel freezing (wax/crystals) ≠ entrained/free WATER freezing**; FSII addresses latter. |\n| `!` FUEL | Confirm **correct grade/type** against AFM/POH, placards and delivery; sample/check water/debris, no-go contaminated/wrong fuel; AVGAS↔JET misfuel may cause ENG failure; **colour alone insufficient**. |\n\n- `SRC:` [FAA AMT General · AVGAS grades/colour + JET types](https://www.faa.gov/sites/faa.gov/files/regulations_policies/handbooks_manuals/aviation/amt_general_handbook.pdf) · [Canadian SCC · JET A/A-1 freeze points](https://scc-ccn.ca/standards/notices-of-intent/canadian-general-standards-board-cgsb/aviation-turbine-fuel-grades-4) · [FAA AC 20-29C · FSII](https://www.faa.gov/documentLibrary/media/Advisory_Circular/AC_20_29C.pdf); **POH/AFM wins**.\n- `M · L4` **FUEL: OCTANE=knock resistance | 80/87 RED; 100/130 GREEN (lean/rich); 100LL BLUE (low lead≠unleaded) | JET A −40°C / A-1 −47°C (max freeze) | JET B wide-cut | FSII inhibits water ice ≠ fuel/airframe de-ice | verify approved grade/type; colour≠proof.**"},{"id":"08-8","card":"08","h":"Fuel / starvation / contamination","a":"fuel--starvation--contamination","c":["agk-fuel"],"p":["PPL","CPL"],"md":"- Know total/usable/unusable, geometry, selector, vents, drains, pumps/crossfeed and gauge limits.\n- Starvation: fuel aboard but not reaching engine; exhaustion: none usable. `M:` starvation may be recoverable, exhaustion is not.\n- `S:` rough/power or flow loss, selected tank empty, vent blocked, selector wrong/OFF, water/wrong fuel.\n- `P:` heat/alternate air→proper/fullest tank→mixture→pump→primer locked→mags, while preserving landing path.\n- Drain all POH sumps after required events; one clear sample proves only that point. Wrong/contaminated fuel=no-go.\n- `T:` gauges≠measured fuel+time/burn; late tank changes may add delay/air."},{"id":"08-9","card":"08","h":"Oil pressure / temperature","a":"oil-pressure--temperature","c":["agk-engine"],"p":["PPL","CPL"],"md":"| Indication | Likely concern | Action memory |\n|---|---|---|\n| low oil pressure + high temp | lubrication loss / impending seizure | reduce power, land ASAP |\n| low pressure + normal temp | gauge/sender or early failure | treat seriously, monitor, land |\n| high temp + normal pressure | cooling, low oil, prolonged climb | enrich/increase airflow/reduce power |\n| pressure fluctuation | low quantity, aeration, sensor, manoeuvre | stabilize, assess, land |\n\n- `T:` “gauge fault” is a diagnosis of exclusion. Plan for engine stoppage.\n- `!:` abnormal noise/vibration + oil indication = immediate landing priority."},{"id":"08-10","card":"08","h":"Cylinder-head / engine temperature","a":"cylinder-head--engine-temperature","c":["agk-engine"],"p":["PPL","CPL"],"md":"- High temperature: excessive power, lean mixture, poor airflow, high OAT, prolonged low-speed climb, cowl-flap/config issue.\n- `P:` lower nose/increase airspeed→enrich as appropriate→reduce power→open cowl flaps if fitted→land if unresolved.\n- `T:` cooling by excessive mixture/power changes can create other problems; POH limits/procedure win."},{"id":"08-11","card":"08","h":"Engine roughness — generic flow","a":"engine-roughness--generic-flow","c":["agk-engine","emg-engine"],"p":["PPL","CPL"],"md":"- `P:` control/landing area→carb heat or alternate air→mixture adjust→fuel selector/pump→primer locked→mags→engine gauges→declare/divert.\n- `M:` `HEAT-MIX-FUEL-PRIMER-MAGS`.\n- `T:` do not spend altitude cycling controls repeatedly. One deliberate diagnostic pass, then land."},{"id":"08-12","card":"08","h":"Complete engine failure","a":"complete-engine-failure","c":["emg-engine","emg-sys"],"p":["PPL","CPL"],"md":"- `P:` nose→best glide `[POH]`→field/landing path→restart flow if time→MAYDAY/7700→pax/secure→land.\n- Restart generic: carb heat→fuel selector→mixture→pump→primer→mags/start as applicable.\n- `T:` best glide gives options only if established immediately.\n- `!:` after takeoff: lower nose and land ahead-ish; turnback only with trained/proven margin and suitable conditions."},{"id":"08-13","card":"08","h":"Powerplant / PROP · L4 CAVE","a":"powerplant--prop--l4-cave","c":["agk-engine","agk-prop"],"p":["CPL","ME"],"md":"| Key | Recall |\n|---|---|\n| `R` Cycle | Gas turbine: **INTAKE→COMPRESS→continuous COMBUST→TURBINE→EXHAUST**; turbine drives compressor; remaining energy → thrust/shaft. Piston: intermittent combustion. |\n| `M` Turbojet | Core airflow → exhaust jet = principal thrust; no bypass fan. |\n| `M` Turbofan | Fan + core; bypass air adds thrust; **BPR = bypass mass flow ÷ core mass flow** (5:1 = 5 bypass/1 core; **≠ thrust ratio**). |\n| `M` Turboprop | Gas turbine → power shaft + reduction gearbox → **PROP** principal thrust (e.g. ATR); exhaust contributes some thrust. |\n| `M` Turboshaft | Turbine → output shaft → rotor/accessory load; output not principally jet thrust. |\n| `T` AFR ≠ BPR | **AFR = air mass ÷ fuel mass** (fuel mixture); **BPR = bypass/core airflow** (turbofan). |\n| `R` Compressor | **Axial** successive rotor/stator rows; **centrifugal** impeller→radial diffuser. |\n| `T` STAGE ≠ SPOOL | Compressor STAGE≈rotor+stator; turbine STAGE≈stator/nozzle+rotor. SPOOL=compressor+shaft+driving turbine; multi-stage spool ≠ multi-spool. |\n| `R` N1/N2 | Typical two-spool turbofan: **N1 LP/fan**, **N2 HP/core** speeds; exact indications/configuration ACFT-specific. Free power turbine mechanically independent of gas-generator compressor spool. |\n| `R` Pitch | Blade angle ↑ → **COARSE/HIGH** → PROP load ↑, RPM tendency ↓; angle ↓ → **FINE/LOW** → load ↓, RPM tendency ↑ (**given comparable power/airspeed**). Pitch≠blade AOA. |\n| `R` Types | Fixed: no FLT pitch control; ground-adjustable: ground only; pilot variable: selectable angle; **constant-speed governor varies pitch to hold selected RPM** within stops; full-feathering or reversible only if installed. |\n| `P` CS PROP | Typical piston: throttle→power/MP; PROP lever→governed RPM; lever FWD→high RPM/fine, AFT→lower RPM/coarse; pitch stops may prevent RPM hold. |\n| `R` Feather | Near edge-on to airflow→**windmilling drag↓** after ENG failure; **≠ reverse**. |\n| `R` ALPHA | Turboprop flight range: PROP governor varies blade angle to maintain selected RPM. |\n| `R` BETA | Ground range aft of FLT idle: power lever schedules PROP blade angle (outside normal RPM governing). |\n| `R` GROUND FINE | Low blade angle→low/near-zero forward thrust for taxi. |\n| `R` REVERSE | Further BETA→negative blade angle→reverse thrust for ground deceleration; **BETA ≠ REVERSE** (reverse ⊂ beta, on equipped ACFT). |\n| `!` BETA LIMIT | Normally **ground only**; observe FLT-idle gate and AFM limits; in-FLT BETA may cause loss of control/overspeed. |\n| `T` SE vs ME | **Typical piston** SE non-feathering: governor oil P↑→pitch↑/RPM↓; **typical piston** ME full-feathering: oil P↑→pitch↓/RPM↑; oil P loss→counterweights/springs drive feather. **Not universal**; POH/AFM wins. |\n| `!` OEI | Windmilling unfeathered failed PROP→large drag / climb loss; **control→identify→verify→feather→secure per POH**, never feather unverified ENG; feather locks/accumulator/prop architecture vary. |\n\n- `SRC:` [FAA AFH Ch 15 · Alpha/Beta](https://www.faa.gov/sites/faa.gov/files/regulations_policies/handbooks_manuals/aviation/airplane_handbook/16_afh_ch15.pdf) · [FAA PHAK · engines/PROP](https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/faa-h-8083-25c.pdf) · [FAA AFH · ME governor/feather](https://www.faasafety.gov/files/events/SO/SO15/2022/SO15118118/TransitionToMultiengineAirplanes.pdf) · [FAA AMT Powerplant · PROP](https://www.faa.gov/sites/faa.gov/files/09_amtp_ch7.pdf); aircraft POH/AFM controls.\n- `M · L4` **JET=exhaust | FAN=bypass+core | T-PROP=gearbox+PROP | T-SHAFT=shaft | BPR=bypass/core ≠ AFR=air/fuel | STAGE≠SPOOL | FINE=angle↓/RPM↑; COARSE=angle↑/RPM↓ | FEATHER drag↓ ≠ REVERSE | TURBOPROP ALPHA=governed RPM; BETA=ground lever→blade angle; GROUND FINE=low thrust; REVERSE=negative thrust⊂BETA; AFM limits | SE oil→coarse vs ME oil→fine (typical piston only) | verify ENG before feather.**"},{"id":"08-14","card":"08","h":"Manifold pressure · MP — L4","a":"manifold-pressure--mp--l4","c":["agk-engine","agk-prop"],"p":["CPL","ME"],"md":"| Key | Recall |\n|---|---|\n| `R` MP | **Absolute** intake-manifold P, **inHg**; **MP ≠ MAP** (missed approach point). |\n| `M` OFF→IDLE | ENG OFF: **MP≈ambient P** (29.92 inHg at standard SL) → IDLE: throttle nearly closed + intake pumping → **MP↓↓** (typically ~10–15 inHg; ACFT-specific). |\n| `R` POWER | Throttle↑→MP↑; constant-speed PROP lever→selected RPM; power depends on **MP+RPM+mixture/conditions**. |\n| `R` ALT / TURBO | Naturally aspirated ALT↑→max MP↓; turbocharged ENG may maintain commanded MP up to critical ALT, within limits. |\n| `S` ICE | Carb ice: fixed-pitch **RPM↓**; constant-speed **MP↓**, RPM initially governed. |\n| `T` SQUARE / BOOST | **Over-square:** MP(inHg) > RPM/100 (25 inHg / 2300 RPM → 25>23); numerical only, often permitted. **Overboost:** MP above approved limit **for operating conditions / RPM** (may occur below redline); damaging. POH/AFM MP–RPM limits + sequence win. |\n\n- `SRC:` [FAA PHAK · manifold pressure / constant-speed PROP](https://www.faa.gov/sites/faa.gov/files/pilot_handbook_1.pdf) · POH/AFM governs.\n- `M · L4` **MP absolute inHg | OFF≈ambient→IDLE↓↓ | throttle↑ MP↑ | non-turbo ALT↑→MPmax↓ | CS PROP→RPM | carb ice: CS MP↓ / fixed RPM↓ | over-square=MP>RPM/100 (may be OK) | overboost=MP>approved limit (RPM-dependent) | POH wins.**"},{"id":"08-15","card":"08","h":"Propeller / governor — constant-speed","a":"propeller--governor--constant-speed","c":["agk-prop"],"p":["CPL","ME"],"md":"- Throttle controls manifold pressure; prop control governs RPM/blade angle; mixture controls fuel-air ratio.\n- `S overspeed:` RPM↑, noise↑. `P:` throttle reduce→prop control reduce RPM if effective→airspeed/power manage→land.\n- `S underspeed/governor fault:` RPM low/unresponsive. Use power setting that avoids vibration/limits; land.\n- `T:` power-setting order and manifold-pressure/RPM limitations are aircraft-specific."},{"id":"08-16","card":"08","h":"Propeller vibration","a":"propeller-vibration","c":["agk-prop"],"p":["PPL","CPL"],"md":"- Causes: ice, damage, spinner, engine/prop fault.\n- `P:` reduce power/RPM to minimize vibration→check ice systems if fitted→land ASAP.\n- `!:` severe vibration: throttle idle may prevent separation/damage; secure engine if required by POH.\n- `T:` do not cycle prop aggressively unless checklist directs."},{"id":"08-17","card":"08","h":"Electrical / alternator failure","a":"electrical--alternator-failure","c":["agk-elec","emg-sys"],"p":["PPL","CPL","IR"],"md":"- Alternator/generator+regulator powers bus/recharges battery; battery supplies start/emergency energy.\n- `S:` ALT/low-voltage light, discharge/low volts, weakening equipment.\n- `P:` confirm→shed→one reset only if POH permits→if no recovery ALT OFF→preserve essentials→declare/divert/land. `M:` `SHED-CALCULATE-COMMUNICATE-LAND`.\n- `F rough:` endurance h≈usable Ah/essential A; reduce for age/temp/voltage. Precompute IFR/night loads; repeated resets may worsen fault."},{"id":"08-18","card":"08","h":"Fire / smoke","a":"fire--smoke","c":["emg-fire"],"p":["PPL","CPL"],"md":"| Event | Generic memory—exact POH wins |\n|---|---|\n| electrical smoke/fire | master/ALT OFF→vents/heat per checklist→extinguish→restore only essential circuits after smoke stops→land now |\n| start fire | continue cranking to draw fire inward→MIX ICO/fuel/throttle/master/mags per POH→evacuate/extinguis
