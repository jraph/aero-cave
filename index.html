ank to fly selected mode (HDG, VOR/LOC, APP, G/S, GA, ALT). Computer takes nav receivers, attitude gyro, radar altimeter, compass, air data. `T:` FD shows what to do, not where you are: cross-check raw data. [TP 2076 2.1.5 A–D]\n- **Radio (radar) altimeter**: absolute height by timed radio echo; less accurate over ice, deep snow, rapidly changing terrain. CAT II DH based on radio altimeter. `T:` height AGL ≠ altitude ASL. [TP 2076 2.1.2 F.3; CAP GEN CAT II/III chart legend]\n- `?:` HSI back course: set front (inbound) course → normal sensing; not in TP 2076, check aircraft AFM/avionics guide.","p":["CPL","IR"]},{"id":"IFR-74","card":"IFR","f":"kb/ifr/navaid-checks.md","h":"Radio propagation, VOR and NDB/ADF principles and limitations","a":"radio-propagation-vor-and-ndbadf-principles-and-limitations","c":["nav-radio"],"kd":"knowledge","u":"nav-radio-propagation-vor-ndb-principles","md":"| Band | Propagation | Navaid |\n|---|---|---|\n| <3 MHz (LF/MF) | **ground wave** dominant | NDB 190–415 / 510–535 kHz |\n| 3–30 MHz (HF) | **sky wave**, skip zones | HF comms |\n| >30 MHz (VHF and up) | **line of sight** | VOR 112.0–117.95 MHz, DME (UHF) |\n\n- **VOR**: 360 radials (magnetic) to/from station · identified by 3-letter Morse · published radials **±3°** · range with altitude: ~**50 NM at 1 500 ft AGL**, **≥150 NM above 30 000 ft** · terrain shadow. Dual VOR check >**4°** apart → suspect; airborne check >**±6°** off published radial → not for IFR.\n- **NDB/ADF**: loop antenna senses signal direction; needle = **relative bearing**. Ident 2–3 characters Morse. Flight-checked **±5° approach, ±10° en route**. Classes: H ≥2 000 W · M 50–<2 000 W · L <50 W.\n- ADF errors: **night (twilight) effect** (sky-wave, worst near sunrise/sunset; little below 350 kHz) · **mountain** reflection · **coastal refraction** (shoreline crossed at <30°) · **thunderstorm** (needle points to lightning) · **bank error** in turns · AM receivers / calculators within 5 ft of antenna (200–450 kHz).\n- `T` ADF ± 10° en route vs VOR ± 3°: never treat NDB tracks as precise.\n\n- Sources: [TC AIM COM 4.4–4.7](https://tc.canada.ca/sites/default/files/2026-10/aim-2026-2_com_en.pdf); [TP 2076](https://www.phoenixaviation.ca/IPM%20tp2076e.pdf) 2.2.2, 2.2.3, 2.2.5.","p":["CPL"],"e":["CPL"]},{"id":"IFR-75","card":"IFR","f":"kb/ifr/navaid-checks.md","h":"Time and distance to station — VOR / ADF","a":"time-and-distance-to-station--vor--adf","c":["nav-radio"],"kd":"knowledge","u":"nav-time-distance-to-station-vor-adf","md":"- `F` **Time to station (min) = seconds for the bearing change ÷ degrees of change.** Distance = time × groundspeed (or TAS) per minute.\n- `P` ADF: turn to put the pointer at **090° or 270°** relative, hold heading, time a **10°** change. VOR: turn ~90° to the radial, time the radial change.\n- Example: 120 s for 10° → **12 min**; 45 s for 10° → 4.5 min. Very fast needle swing → very close to the station.\n\n- Sources: [TP 2076](https://www.phoenixaviation.ca/IPM%20tp2076e.pdf) 2.2.3 E.3, 2.2.5 D.5.","p":["CPL"]},{"id":"IFR-76","card":"IFR","f":"kb/ifr/navaid-checks.md","h":"VHF / LF airways, air routes, T-routes — RAC 2.7.1 / 2.8.7","a":"vhf--lf-airways-air-routes-t-routes--rac-271--287","c":["nav-radio"],"kd":"knowledge","u":"nav-airways-air-routes-rac-2-7","md":"| Route | Width each side of centreline | Splay | Base |\n|---|---|---|---|\n| VHF/UHF (Victor) airway | **4 NM** | lines **4.5°** from each facility | 2 200 ft AGL (low-level controlled) |\n| LF/MF airway | **4.34 NM** | lines **5°** | 2 200 ft AGL |\n| T-route (RNAV) | 4 NM primary + 2 NM secondary obstacle protection; airspace **10 NM** | **none** | low-level controlled |\n| Low-level air route | as a low-level airway | as airway | **surface** (Class G) |\n\n- Low-level controlled airspace: **2 200 ft AGL to <18 000 ft ASL**.\n- Victor airway using VOR/VORTAC + NDB → LF/MF airway boundaries.\n- `T` Air route = uncontrolled, **no ATC separation** for IFR or VFR.\n\n- Sources: [TC AIM RAC](https://tc.canada.ca/sites/default/files/2026-10/aim-2026-2_rac_en.pdf) 2.7.1, 2.8.7.","p":["CPL"]},{"id":"IFR-77","card":"IFR","f":"kb/ifr/navaid-checks.md","h":"RMI — uses and limitations","a":"rmi--uses-and-limitations","c":["nav-radio"],"kd":"knowledge","u":"nav-rmi-advantages-limitations","md":"- RMI: slaved heading card + pointer = magnetic bearing **to** station (tail = from); tracking on **one instrument**; wind-correction heading does not change the bearing while on track.\n- Limitations follow the sensors: pointer inherits ADF/VOR errors (night effect, terrain, coastal, bank); card depends on the slaved compass (fail → card wrong, set by hand where a free mode exists).\n\n- Sources: [TP 2076](https://www.phoenixaviation.ca/IPM%20tp2076e.pdf) 2.2.6, 2.1.3 D.4.","p":["CPL"]},{"id":"IFR-78","card":"IFR","f":"kb/ifr/navaid-checks.md","h":"Pebble","a":"pebble","c":["nav-radio"],"kd":"pebble","u":"ifr-navaid-checks-pebble","md":"- VOR CHECK `4 ground — 6 airborne — 4 between receivers | VOT: 000° FROM or 180° TO, ±4° (FAA AIM source) | airborne ±6° from published radial | dual: 4° TOTAL difference, same TO/FROM sense | Canada (TC AIM COM 4.5.1–4.5.2): dual >4° or airborne >6° → not for IFR until corrected`\n- T `±6° = receiver-check tolerance ≠ permission to track off course | failed identification = unusable navaid for approach | do not infer U.S. intervals/recordkeeping for Canada`\n- ILS/DME `LOC 108.1–111.9 · GP 329.3–335, 3°, false GP at 2× and 3× | couple within 6° | DME slant ±0.5 NM or 3 % | RMI head = TO`\n- RADIO `LF/MF ground wave | HF sky wave | VHF line of sight (~50 NM at 1500 AGL) | VOR ±3° published, dual >4° suspect, airborne >±6° no IFR | NDB ±5° app/±10° enroute | ADF errors: night, mountain, coastal <30°, TS, bank`\n- TIME TO STN `sec ÷ deg = min | wingtip (090/270) 10° change | distance = time × GS`\n- AIRWAYS `Victor 4 NM, splay 4.5° | LF/MF 4.34 NM, splay 5° | T-route 4+2 NM, airspace 10 NM, no splay | base 2200 AGL | air route: surface, Class G, no separation`\n- RMI `one-instrument tracking | inherits ADF/VOR + slaved compass errors`","p":["PPL","CPL","IR"]},{"id":"IFR-79","card":"IFR","f":"kb/ifr/planning-fuel.md","h":"IFR flight planning workflow","a":"ifr-flight-planning-workflow","c":["ifr-plan"],"kd":"knowledge","u":"ifr-ifr-flight-planning-workflow","md":"- Route: CFS/CAP/LO chart/preferred routes/airways/direct fixes/MEA/MOCA/AMA/MSA/mountainous region/controlled airspace.\n- Weather: METAR/SPECI actual; TAF legality; GFA area; FD winds/temp; SIGMET/AIRMET/PIREP; NOTAM; RSC/CRFI; freezing level.\n- Leg calc: `TC±VAR=MC±DEV=CH`; `time=dist/GS`; `fuel=time×burn`; `ETA=dep+ETE`; `wind correction` and actual GS.\n- `T:` simulated flight questions often test route feasibility, not one isolated fact.","p":["IR"]},{"id":"IFR-80","card":"IFR","f":"kb/ifr/planning-fuel.md","h":"IFR fuel — CAR 602.88 memory","a":"ifr-fuel--car-60288-memory","c":["ifr-plan","law-plan"],"kd":"knowledge","u":"ifr-ifr-fuel-car-602-88-memory","md":"- IFR prop with alternate: dest + approach + missed → alternate + land → `45 min`.\n- IFR prop no alternate: dest + approach + missed → `45 min`.\n- IFR turbojet/helicopter: same logic but `30 min`.\n- Always add foreseeable taxi/delay/met/routing/traffic/other delays.\n- `T:` fuel reserve is after required legs, not “fuel on board at destination.” Exam may hide missed approach before alternate leg.","p":["IR"]},{"id":"IFR-81","card":"IFR","f":"kb/ifr/planning-fuel.md","h":"Simulated IFR flight workflow","a":"simulated-ifr-flight-workflow","c":["ifr-plan","ifr"],"kd":"knowledge","u":"ifr-simulated-ifr-flight-workflow","md":"- `1 Documents:` current CAP/CFS/LO/NOTAM/TAF/METAR/GFA/FD/SIGMET/PIREP.\n- `2 Route:` dep SID/ODP → enroute MEA/MOCA/AMA → STAR/approach → alternate.\n- `3 Weather:` dest legal? alternate legal? icing/TS/turb/wind/RVR/approach ban? freezing level? runway state?\n- `4 Fuel:` taxi/delay + trip + app/missed + alternate + reserve + foreseeable.\n- `5 Plates:` RASS/cold temp, minima, stepdowns, MAP, missed, lighting, runway length.\n- `6 Calculations:` GS/ETE/fuel, climb gradient fpm, descent rate, hold timing, alternate minima.\n- `7 Decision:` legal? safe? equipped? current? if no, what changes?","p":["IR"]},{"id":"IFR-82","card":"IFR","f":"kb/ifr/planning-fuel.md","h":"Pebble","a":"pebble","c":["ifr-plan"],"kd":"pebble","u":"ifr-planning-fuel-pebble","md":"- FUEL CAR 602.88 `prop + alternate: dest + approach + missed → alternate + land → 45 min | prop no alternate: dest + approach + missed → 45 min | turbojet/helicopter: 30 min | add foreseeable taxi/delay/met/routing/traffic`\n- T `reserve is after required legs ≠ fuel on board at destination | exam may hide the missed approach before the alternate leg`\n- WORKFLOW `documents → route → weather → fuel → plates → calculations → decision: legal? safe? equipped? current?`\n- LEG `TC±VAR=MC±DEV=CH | time = dist/GS | fuel = time×burn | ETA = dep + ETE`","p":["IR"]},{"id":"IFR-83","card":"IFR","f":"kb/ifr/rass.md","h":"RASS / remote altimeter","a":"rass--remote-altimeter","c":["ifr-rass"],"kd":"knowledge","u":"ifr-rass-remote-altimeter","md":"- Before IAP: current usable altimeter required; local or authorized remote. older than 60min caution; 90min current limit concept.\n- `Use CYND`: procedure minima have RASS built in; use identified altimeter source.\n- `When using CYND add 160`: add adjustment to intermediate, final, and missed-approach segment minimum altitudes.\n- `When using CYND add 160. Circling minima apply`: final descent gradient exceeded after RASS; straight-in minima not usable.\n- `T:` RASS/cold temperature corrections can change stepdowns, MDA/DA, and missed segment altitudes; do not just add to the final line mentally.\n- `T:` cold/remote/falling pressure corrections affect obstacle margin.\n- Read the altimeter source line before the minima: the approved source drives procedure protection.","p":["IR"]},{"id":"IFR-84","card":"IFR","f":"kb/ifr/rass.md","h":"Pebble","a":"pebble","c":["ifr-rass"],"kd":"pebble","u":"ifr-rass-pebble","md":"- RASS `“Use X” = built into minima, use that source | “When using X add N” = add to intermediate, final AND missed-approach segment minimum altitudes | “… Circling minima apply” = straight-in minima not usable`\n- T `current usable altimeter required before IAP | cold/remote/falling pressure corrections affect obstacle margin: stepdowns, MDA/DA, missed altitudes`","p":["IR"]},{"id":"IFR-85","card":"IFR","f":"kb/ifr/recall.md","h":"Source / mindset","a":"source--mindset","c":["ifr"],"kd":"trap","u":"ifr-source-mindset","md":"- AIM = guidance, not law. Current CAP/CAP GEN, CFS, AIP SUP and NOTAM govern published operational data.\n- Local `CAP_GEN_03-19-2026.pdf` is expired; cycle at last review (14 Nov 2026) began `2026-10-29`.\n- `T:` CAP is amended by NOTAM/AIP SUP. A Trigger NOTAM only announces changed source material; open the referenced source.\n- IFR = clearance + obstacle clearance + nav accuracy + comms + fuel/alternate logic + workload discipline.","p":[],"ph":["IR"]},{"id":"IFR-86","card":"IFR","f":"kb/ifr/recall.md","h":"Source / exam frame","a":"source--exam-frame","c":["ifr"],"kd":"trap","u":"ifr-source-exam-frame","md":"- `SRC:` TP 691E topic anchor; CARs/STD 421 legal req; TC AIM + current CAP/CFS/AIP SUP/NOTAM for procedures.\n- CAP/CFS cycle at last review (14 Nov 2026): `2026-10-29` to `2026-12-24`; local March/2025 copies are reference-only.\n- `T:` TP/AIM/test guides = guidance; CARs/Standards = regulatory; current operational publications win.\n- INRAT = Instrument Rating written. `50 MCQ`, `3h`, `70%`. General IFR + simulated IFR flight. Initial flight-test aircraft category must match INRAT category.\n- Standard 421 IR groups: `G1` multi-engine aeroplane flight test = all aeroplanes; `G2` centreline thrust + single; `G3` single-engine; `G4` helicopter.\n- IR knowledge req: CARs, IFR rules/procedures, met, instruments, radio/radar, nav. Experience/skill are separate from exam.","p":["IR"]},{"id":"IFR-87","card":"IFR","f":"kb/ifr/recall.md","h":"INRAT attack method","a":"inrat-attack-method","c":["ifr"],"kd":"trap","u":"ifr-inrat-attack-method","md":"- Read question stem first: asks `legal?`, `safe?`, `next?`, `minimum?`, `forecast?`, `plate?`, `lost comm?`.\n- Extract: aircraft category, equipment, departure/dest/alternate, ETA, route, freezing level, winds, NOTAM, CAP note, RASS, lighting, RVR/vis, TAF change group.\n- `M:` source order = CAR/STD → CAP/CFS/NOTAM → AIM/TP guide → school notes.\n- `T:` many wrong answers are “operationally plausible but legally wrong” or “legal but unsafe.”","p":[],"ph":["IR"]},{"id":"IFR-88","card":"IFR","f":"kb/ifr/recall.md","h":"INRAT plate question method","a":"inrat-plate-question-method","c":["ifr","ifr-plates"],"kd":"trap","u":"plate-inrat-plate-question-method","md":"- `1` identify procedure/minima line; `2` check category; `3` read notes/RASS/cold; `4` check altimeter source; `5` apply lighting/runway/NOTAM; `6` compare weather/RVR; `7` determine legal/safe action.\n- `T:` exam distractors often ignore a note or use wrong category/minima line.","p":[],"ph":["IR"]},{"id":"IFR-89","card":"IFR","f":"kb/ifr/recall.md","h":"INRAT high-yield traps","a":"inrat-high-yield-traps","c":["ifr"],"kd":"trap","u":"ifr-inrat-high-yield-traps","md":"- Legal source vs guidance source. RVR vs ground vis vs advisory vis. Alternate minima vs landing minima vs approach ban. RASS/cold-temp corrections.\n- Lost comm route/alt/time. STAR lateral vs vertical clearance. Visual/contact approach IFR status. Hold EFC/fuel.\n- MAP vs MDA vs missed after MAP. SCDA not permission below MDA. LPV vs ILS. LNAV/VNAV temp limits. OBS/SUSP.\n- Fuel includes approach+missed at destination before alternate. `TEMPO/BECMG/PROB` logic. Uncontrolled IFR comms/separation. NOTAM invalidates NAVAID/runway/procedure.","p":["IR"]},{"id":"IFR-90","card":"IFR","f":"kb/ifr/recall.md","h":"Sources & review status · card 09","a":"sources--review-status--card-09","c":["ifr"],"kd":"source","u":"ifr-sources-review-status-core","md":"See the [separate review record](../../CONTENT_REVIEW.md#historical-source-review-notes) for source editions, check dates and earlier validation notes.","p":[],"ph":["IR"]},{"id":"IFR-91","card":"IFR","f":"kb/ifr/rules-privileges.md","h":"IFR in VMC: VFR restriction, visual & contact approach","a":"ifr-in-vmc-vfr-restriction-visual--contact-approach","c":["ifr"],"kd":"knowledge","u":"ifr-ifr-in-vmc-vfr-restriction","md":"- IFR clearance with VFR restriction may be issued if pilot requests, outside Class A, within applicable B/C/D/E, and weather permits.\n- `T:` during VFR restriction/release, pilot provides own separation incl wake; if unable, advise ATC/request amended clearance.\n- If IFR clearance includes VFR/visual restriction, pilot accepts own terrain/traffic/wake responsibility as specified.\n- Visual approach: IFR remains IFR; visual reference to airport/traffic; ATC may clear visual; missed usually as coordinated/ATC, not necessarily published IAP missed unless assigned.\n- Contact approach: pilot requests; clear of cloud; flight visibility and reasonable expectation to destination; IFR remains IFR.\n- `T:` visual/contact approach can remove published segment protection if you wander.","p":["IR"]},{"id":"IFR-92","card":"IFR","f":"kb/ifr/rules-privileges.md","h":"Air law / IFR privileges","a":"air-law--ifr-privileges","c":["ifr","law-lic"],"kd":"knowledge","u":"ifr-air-law-ifr-privileges","md":"- IFR needs appropriate licence/rating/medical/recency + aircraft equipment + IFR flight plan/clearance where required.\n- IFR rating privilege depends on group/class/category and aircraft. `G3` single only; `G1` covers all aeroplanes.\n- `T:` INRAT pass≠rating issued; written + experience + skill + admin still needed.\n- `T:` clearance limit is not destination authorization beyond that point; expect hold/further clearance.","p":["IR"]},{"id":"IFR-93","card":"IFR","f":"kb/ifr/rules-privileges.md","h":"Controlled / uncontrolled IFR","a":"controlled--uncontrolled-ifr","c":["ifr","law-airspace","ifr-enr"],"kd":"knowledge","u":"ifr-controlled-uncontrolled-ifr","md":"- Controlled IFR: clearance, altitude, route, comms, transponder/Mode C where required.\n- Uncontrolled IFR: pilot self-separation from terrain and other IFR/VFR using published procedures, MF/ATF calls, IFR flight plan/itinerary, and weather/altitude minima.\n- `T:` uncontrolled IFR departure/arrival may have no ATC separation until controlled airspace; broadcast and protect yourself.","p":["IR"]},{"id":"IFR-94","card":"IFR","f":"kb/ifr/rules-privileges.md","h":"Instrument-rating recency","a":"instrument-rating-recency","c":["ifr","law-recency"],"kd":"knowledge","u":"ifr-instrument-rating-recency","md":"- `24 months:` qualifying instrument flight test, IPC or other accepted test/check under CAR 401.05(3).\n- `Six approaches / six months:` following the first day of the seventh month after that test/check, complete six instrument approaches within the six months before the flight, in accordance with the procedure's specified minima.\n- Aircraft: actual or simulated IMC. Other options: Level B/C/D full-flight simulator of the same instrument-rating group, or an FTD under a person qualified under Standard 425.21(9).\n- `T:` no separate six-hour instrument-time requirement. The old 12-month grace period and `6–6–6` memory rule are outdated. Retain recency records for three years.\n- `M:` **24-month check; after six months, six approaches in six months.** [CAR 401.05(3)–(3.2)](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-401.05.html)","p":["IR"]},{"id":"IFR-95","card":"IFR","f":"kb/ifr/rules-privileges.md","h":"Human factors / single-pilot IFR","a":"human-factors--single-pilot-ifr","c":["ifr","agk-hf"],"kd":"knowledge","u":"ifr-human-factors-single-pilot-ifr","md":"- Threats: workload, fixation, automation surprise, spatial disorientation, fatigue, hypoxia, CO, pressure.\n- `P:` brief before busy segment; set bugs/freqs/GPS/OBS; use flows+checklists; say unable early.\n- Leans/coriolis/graveyard spiral/somatogravic illusion: trust instruments, cross-check, standard-rate turns.\n- `T:` automation can be wrong because pilot loaded it wrong.","p":["PPL","CPL","IR"],"e":["PPL"]},{"id":"IFR-96","card":"IFR","f":"kb/ifr/rules-privileges.md","h":"Pebble","a":"pebble","c":["ifr"],"kd":"pebble","u":"ifr-rules-privileges-pebble","md":"- IFR NEEDS `licence/rating/medical/recency + ACFT equipment + IFR flight plan/clearance where required | G3 single only; G1 all aeroplanes | INRAT pass ≠ rating issued | clearance limit ≠ authorization beyond it`\n- RECENCY `24-month test/IPC/check | from 1st day of 7th month after: six approaches in the six months before the flight, to specified minima | actual or simulated IMC, or approved FFS/FTD | no six-hour rule; 6–6–6 outdated | records 3 years` CAR 401.05(3)–(3.2)\n- VFR RESTRICTION `pilot request + outside Class A + weather permits | pilot provides own separation incl wake | unable → advise ATC`\n- VISUAL / CONTACT `IFR remains IFR | contact = pilot requests, clear of cloud | wandering can remove published segment protection`\n- UNCONTROLLED IFR `self-separation, MF/ATF calls | may be no ATC separation until controlled airspace`\n- SINGLE-PILOT `brief before busy segment | say unable early | trust instruments | automation wrong if loaded wrong`","p":["PPL","CPL","IR"]},{"id":"AGK-0","card":"AGK","f":"kb/agk/circuit-approach-landing.md","h":"Handling / landings","a":"handling--landings","c":["ops-ldg","agk-ops"],"kd":"knowledge","u":"agk-handling-landings","md":"- Steep turn: clearing→entry speed/pwr→bank→back pressure→scan→rollout lead. `T:` altitude by attitude first.\n- Slow flight: coord critical. Stall: AoA↓ first, power as req, coord. Spiral: idle→wings level→ease.\n- Precision/P180: key positions + wind + energy. `T:` high fixable, low usually not.\n- Short LDG: stable speed/profile/touchdown zone; fast final eats runway. Soft LDG: protect nose, keep moving, yoke back.","p":["PPL","CPL","ME"],"e":["PPL"]},{"id":"AGK-1","card":"AGK","f":"kb/agk/circuit-approach-landing.md","h":"Pebble","a":"pebble","c":["ops-ldg"],"kd":"pebble","u":"agk-circuit-approach-landing-pebble","md":"- HANDLING `steep turn: altitude by attitude first | stall: AoA↓ first, power as required, coordinate | spiral: idle → wings level → ease | P180: high fixable, low usually not | short LDG: fast final eats runway | soft LDG: protect nose, keep moving, yoke back`","p":["PPL","CPL","ME"]},{"id":"AGK-2","card":"AGK","f":"kb/agk/engines-powerplant.md","h":"Engine essentials","a":"engine-essentials","c":["agk-engine"],"kd":"knowledge","u":"sys-engine-essentials","md":"- Piston engine needs: air + fuel + ignition + compression + correct timing.\n- Power loss scan: throttle/mixture/carb heat/fuel selector/quantity/primer/mags/boost pump as installed.\n- `M:` `AIR-FUEL-SPARK-COMPRESSION`.\n- `T:` partial power may be temporary. Keep a landing area continuously available.","p":["PPL","CPL"]},{"id":"AGK-3","card":"AGK","f":"kb/agk/engines-powerplant.md","h":"Magnetos / ignition","a":"magnetos--ignition","c":["agk-engine"],"kd":"knowledge","u":"sys-magnetos-ignition","md":"- Mags are battery/alternator-independent; dual mags/plugs add redundancy/efficiency. Engine running with master OFF is normal.\n- One-mag roughness: plug fouling, mag/lead or mixture. `!:` bad P-lead can leave mag live—moving prop may start engine.\n- `T:` electrical failure may spare engine but remove radios/lights/flaps/gear/instruments.","p":["PPL","CPL"],"e":["PPL"]},{"id":"AGK-4","card":"AGK","f":"kb/agk/engines-powerplant.md","h":"Mixture","a":"mixture","c":["agk-engine"],"kd":"knowledge","u":"sys-mixture","md":"- Too rich: rough/fouling/high burn/power loss aloft; too lean: rough/power loss/high temps/detonation risk at high power.\n- Lean by POH RPM/EGT/monitor method. `T:` full rich may be over-rich for high-DA TKOF.","p":["PPL","CPL"],"e":["PPL"]},{"id":"AGK-5","card":"AGK","f":"kb/agk/engines-powerplant.md","h":"Oil pressure / temperature","a":"oil-pressure--temperature","c":["agk-engine"],"kd":"knowledge","u":"sys-oil-pressure-temperature","md":"| Indication | Likely concern | Action memory |\n|---|---|---|\n| low oil pressure + high temp | lubrication loss / impending seizure | reduce power, land ASAP |\n| low pressure + normal temp | gauge/sender or early failure | treat seriously, monitor, land |\n| high temp + normal pressure | cooling, low oil, prolonged climb | enrich/increase airflow/reduce power |\n| pressure fluctuation | low quantity, aeration, sensor, manoeuvre | stabilize, assess, land |\n\n- `T:` “gauge fault” is a diagnosis of exclusion. Plan for engine stoppage.\n- `!:` abnormal noise/vibration + oil indication = immediate landing priority.","p":["PPL","CPL"]},{"id":"AGK-6","card":"AGK","f":"kb/agk/engines-powerplant.md","h":"Powerplant / PROP · L4 CAVE","a":"powerplant--prop--l4-cave","c":["agk-engine","agk-prop"],"kd":"knowledge","u":"sys-powerplant-prop-l4-cave","md":"| Key | Recall |\n|---|---|\n| `R` Cycle | Gas turbine: **INTAKE→COMPRESS→continuous COMBUST→TURBINE→EXHAUST**; turbine drives compressor; remaining energy → thrust/shaft. Piston: intermittent combustion. |\n| `M` Turbojet | Core airflow → exhaust jet = principal thrust; no bypass fan. |\n| `M` Turbofan | Fan + core; bypass air adds thrust; **BPR = bypass mass flow ÷ core mass flow** (5:1 = 5 bypass/1 core; **≠ thrust ratio**). |\n| `M` Turboprop | Gas turbine → power shaft + reduction gearbox → **PROP** principal thrust (e.g. ATR); exhaust contributes some thrust. |\n| `M` Turboshaft | Turbine → output shaft → rotor/accessory load; output not principally jet thrust. |\n| `T` AFR ≠ BPR | **AFR = air mass ÷ fuel mass** (fuel mixture); **BPR = bypass/core airflow** (turbofan). |\n| `R` Compressor | **Axial** successive rotor/stator rows; **centrifugal** impeller→radial diffuser. |\n| `T` STAGE ≠ SPOOL | Compressor STAGE≈rotor+stator; turbine STAGE≈stator/nozzle+rotor. SPOOL=compressor+shaft+driving turbine; multi-stage spool ≠ multi-spool. |\n| `R` N1/N2 | Typical two-spool turbofan: **N1 LP/fan**, **N2 HP/core** speeds; exact indications/configuration ACFT-specific. Free power turbine mechanically independent of gas-generator compressor spool. |\n| `R` Pitch | Blade angle ↑ → **COARSE/HIGH** → PROP load ↑, RPM tendency ↓; angle ↓ → **FINE/LOW** → load ↓, RPM tendency ↑ (**given comparable power/airspeed**). Pitch≠blade AOA. |\n| `R` Types | Fixed: no FLT pitch control; ground-adjustable: ground only; pilot variable: selectable angle; **constant-speed governor varies pitch to hold selected RPM** within stops; full-feathering or reversible only if installed. |\n| `P` CS PROP | Typical piston: throttle→power/MP; PROP lever→governed RPM; lever FWD→high RPM/fine, AFT→lower RPM/coarse; pitch stops may prevent RPM hold. |\n| `R` Feather | Near edge-on to airflow→**windmilling drag↓** after ENG failure; **≠ reverse**. |\n| `R` ALPHA | Turboprop flight range: PROP governor varies blade angle to maintain selected RPM. |\n| `R` BETA | Ground range aft of FLT idle: power lever schedules PROP blade angle (outside normal RPM governing). |\n| `R` GROUND FINE | Low blade angle→low/near-zero forward thrust for taxi. |\n| `R` REVERSE | Further BETA→negative blade angle→reverse thrust for ground deceleration; **BETA ≠ REVERSE** (reverse ⊂ beta, on equipped ACFT). |\n| `!` BETA LIMIT | Normally **ground only**; observe FLT-idle gate and AFM limits; in-FLT BETA may cause loss of control/overspeed. |\n| `T` SE vs ME | **Typical piston** SE non-feathering: governor oil P↑→pitch↑/RPM↓; **typical piston** ME full-feathering: oil P↑→pitch↓/RPM↑; oil P loss→counterweights/springs drive feather. **Not universal**; POH/AFM wins. |\n| `!` OEI | Windmilling unfeathered failed PROP→large drag / climb loss; **control→identify→verify→feather→secure per POH**, never feather unverified ENG; feather locks/accumulator/prop architecture vary. |\n\n- `SRC:` [FAA AFH Ch 15 · Alpha/Beta](https://www.faa.gov/sites/faa.gov/files/regulations_policies/handbooks_manuals/aviation/airplane_handbook/16_afh_ch15.pdf) · [FAA PHAK · engines/PROP](https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/faa-h-8083-25c.pdf) · [FAA AFH · ME governor/feather](https://www.faasafety.gov/files/events/SO/SO15/2022/SO15118118/TransitionToMultiengineAirplanes.pdf) · [FAA AMT Powerplant · PROP](https://www.faa.gov/sites/faa.gov/files/09_amtp_ch7.pdf); aircraft POH/AFM controls.\n- `M · L4` **JET=exhaust | FAN=bypass+core | T-PROP=gearbox+PROP | T-SHAFT=shaft | BPR=bypass/core ≠ AFR=air/fuel | STAGE≠SPOOL | FINE=angle↓/RPM↑; COARSE=angle↑/RPM↓ | FEATHER drag↓ ≠ REVERSE | TURBOPROP ALPHA=governed RPM; BETA=ground lever→blade angle; GROUND FINE=low thrust; REVERSE=negative thrust⊂BETA; AFM limits | SE oil→coarse vs ME oil→fine (typical piston only) | verify ENG before feather.**","p":["PPL","CPL"],"e":["CPL"]},{"id":"AGK-7","card":"AGK","f":"kb/agk/engines-powerplant.md","h":"Manifold pressure · MP — L4","a":"manifold-pressure--mp--l4","c":["agk-engine","agk-prop"],"kd":"knowledge","u":"sys-manifold-pressure-mp-l4","md":"| Key | Recall |\n|---|---|\n| `R` MP | **Absolute** intake-manifold P, **inHg**; **MP ≠ MAP** (missed approach point). |\n| `M` OFF→IDLE | ENG OFF: **MP≈ambient P** (29.92 inHg at standard SL) → IDLE: throttle nearly closed + intake pumping → **MP↓↓** (typically ~10–15 inHg; ACFT-specific). |\n| `R` POWER | Throttle↑→MP↑; constant-speed PROP lever→selected RPM; power depends on **MP+RPM+mixture/conditions**. |\n| `R` ALT / TURBO | Naturally aspirated ALT↑→max MP↓; turbocharged ENG may maintain commanded MP up to critical ALT, within limits. |\n| `S` ICE | Carb ice: fixed-pitch **RPM↓**; constant-speed **MP↓**, RPM initially governed. |\n| `T` SQUARE / BOOST | **Over-square:** MP(inHg) > RPM/100 (25 inHg / 2300 RPM → 25>23); numerical only, often permitted. **Overboost:** MP above approved limit **for operating conditions / RPM** (may occur below redline); damaging. POH/AFM MP–RPM limits + sequence win. |\n\n- `SRC:` [FAA PHAK · manifold pressure / constant-speed PROP](https://www.faa.gov/sites/faa.gov/files/pilot_handbook_1.pdf) · POH/AFM governs.\n- `M · L4` **MP absolute inHg | OFF≈ambient→IDLE↓↓ | throttle↑ MP↑ | non-turbo ALT↑→MPmax↓ | CS PROP→RPM | carb ice: CS MP↓ / fixed RPM↓ | over-square=MP>RPM/100 (may be OK) | overboost=MP>approved limit (RPM-dependent) | POH wins.**","p":["PPL","CPL"],"e":["CPL"]},{"id":"AGK-8","card":"AGK","f":"kb/agk/engines-powerplant.md","h":"Diesel engines, FADEC, oil system venting","a":"diesel-engines-fadec-oil-system-venting","c":["agk-engine"],"kd":"knowledge","u":"agk-diesel-fadec-oil-venting","md":"- **Diesel (compression ignition)**: high compression heats air; injected fuel ignites without spark plugs. Usually Jet-A / diesel, turbocharged, single power lever, FADEC-controlled. No mixture, no magnetos, no carb ice.\n- **FADEC** (full authority digital engine control): computer meters fuel, timing and (if equipped) prop for a single power lever setting; redundant channels + backup battery; failure → reverts to backup channel/mode per AFM.\n- **Oil system venting** (breather): vents crankcase pressure (blow-by) overboard; blocked breather → pressure → oil forced out / seal failure; in cold, breather can **freeze** (moisture).\n- `?:` general knowledge; no free TC or NAV CANADA text found. Check against a TC-recognized text (e.g. *From the Ground Up*, TC Flight Training Manual) in the fact-check pass.","p":["CPL"]},{"id":"AGK-9","card":"AGK","f":"kb/agk/flight-operations-handling.md","h":"CPL mindset","a":"cpl-mindset","c":["agk-ops","agk-hf"],"kd":"trap","u":"agk-cpl-mindset","md":"- PPL asks “can I fly?” CPL asks “should I accept/continue as paid PIC?”\n- `T:` legal≠professional. customer/time/weather/fuel/runway pressure = threat multipliers.\n- ADM: PAVE before start; 5P enroute; DECIDE abnormal.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"AGK-10","card":"AGK","f":"kb/agk/flight-operations-handling.md","h":"Systems oral list","a":"systems-oral-list","c":["agk-ops","agk-systems"],"kd":"knowledge","u":"agk-systems-oral-list","md":"- Systems: fuel/oil/electrical/ignition/vacuum/pitot-static/flaps/brakes/heat/vent. `T:` checklist item without system model = weak oral.","p":["PPL","CPL"]},{"id":"AGK-11","card":"AGK","f":"kb/agk/flight-operations-handling.md","h":"Wildlife hazards and conservation — AIR 2.4.1 / RAC 1.10","a":"wildlife-hazards-and-conservation--air-241--rac-110","c":["agk-ops"],"kd":"knowledge","u":"agk-wildlife-hazards-conservation","md":"- Birds mostly **<500 ft**; in migration **2 500–3 000 ft**, some to **20 000 ft**. Most strikes in TKOF/LDG; damage rises with speed → avoid low altitude where possible. [AIR 2.4.1]\n- `R` **≥2 000 ft AGL** over: fur and poultry farms (fur farms: chrome-yellow/black stripes, red flag whelping Feb–May) · wildlife herds · wildlife refuges and bird sanctuaries on charts · national/provincial/municipal parks and reserves. [RAC 1.10]\n- `R` Intentionally killing migratory birds with an aircraft is prohibited (Migratory Birds Regulations). TKOF/LDG in a bird sanctuary may need a permit; in national parks only at prescribed places (National Parks of Canada Aircraft Access Regulations).\n\n- Sources: [TC AIM AIR](https://tc.canada.ca/sites/default/files/2026-10/aim-2026-2_air_en.pdf); [TC AIM RAC 1.10](https://tc.canada.ca/sites/default/files/2026-10/aim-2026-2_rac_en.pdf).","p":["CPL"]},{"id":"AGK-12","card":"AGK","f":"kb/agk/flight-operations-handling.md","h":"Porpoising (seaplane)","a":"porpoising-seaplane","c":["agk-ops"],"kd":"knowledge","u":"agk-porpoising-seaplane","md":"- Porpoising = **rhythmic pitch oscillation** on the step during water TKOF or LDG, usually from **wrong pitch attitude** (too low or too high on the step). Can grow until the nose digs in.\n- `P` Recovery: set and hold the correct planing attitude; if it continues or grows, **close throttle** and hold attitude (TKOF); on LDG apply power and go around rather than chase it.\n- `?:` general knowledge; no free TC or NAV CANADA text found. Check against a TC-recognized text (e.g. *From the Ground Up*, TC Flight Training Manual) in the fact-check pass.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"AGK-13","card":"AGK","f":"kb/agk/flight-operations-handling.md","h":"Pebble","a":"pebble","c":["agk-ops"],"kd":"pebble","u":"agk-flight-operations-handling-pebble","md":"- CPL MINDSET `PPL: can I fly? CPL: should I accept/continue as paid PIC? | legal ≠ professional | PAVE before start; 5P enroute; DECIDE abnormal | checklist item without system model = weak oral`\n- WILDLIFE `birds <500 ft, migration 2500–3000 (to 20000) | ≥2000 AGL over farms, herds, sanctuaries, parks | no harassing; park landings only where prescribed`\n- PORPOISING `pitch oscillation on step from wrong attitude | hold correct attitude, else throttle closed (TKOF) or go around (LDG)`","p":["PPL","CPL"]},{"id":"AGK-14","card":"AGK","f":"kb/agk/fuel-fuel-systems.md","h":"Fuel","a":"fuel","c":["agk-fuel"],"kd":"formula","u":"agk-fuel","md":"- `F:` `fuel = time(hr) × burn`.\n- `F:` `time available = usable fuel / burn`.\n- `F:` `fuel remaining = fuel on board - fuel used`.\n- `F:` `fuel used = burn × minutes/60`.\n- `M:` burn `6 gph` ⇒ `0.1 gal/min`; burn `9 gph` ⇒ `0.15 gal/min`; burn `12 gph` ⇒ `0.2 gal/min`.\n- `T:` IFR reserve starts after required destination/alternate logic, not after takeoff.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"AGK-15","card":"AGK","f":"kb/agk/fuel-fuel-systems.md","h":"Aviation fuel grades / FSII — L4","a":"aviation-fuel-grades--fsii--l4","c":["agk-fuel"],"kd":"knowledge","u":"sys-aviation-fuel-grades-fsii-l4","md":"| Key | Recall |\n|---|---|\n| `T` OCTANE | AVGAS **antiknock/detonation resistance**, not fuel energy; **80/87 = lean/rich ratings**, likewise **100/130** (rich performance number >100 ≠ % octane). |\n| `M` AVGAS | **80/87 RED** · **100/130 GREEN** · **100LL BLUE** (`LL` = low lead, **≠ unleaded**; rated 100 lean / 130 rich). |\n| `M` JET A | Kerosene-type turbine fuel; **max freezing point −40°C**. |\n| `M` JET A-1 | Kerosene-type turbine fuel; **max freezing point −47°C**. |\n| `T` JET B | Wide-cut gasoline/kerosene-type turbine fuel, more volatile; fuel specification / AFM approval required. |\n| `R` FSII | **Fuel System Icing Inhibitor:** lowers freezing point of **water in fuel** → prevents fuel-line/filter ice; **not fuel freeze-point improver or airframe de-icer**; use approved additive/concentration only. |\n| `T` ICE | **Fuel freezing (wax/crystals) ≠ entrained/free WATER freezing**; FSII addresses latter. |\n| `!` FUEL | Confirm **correct grade/type** against AFM/POH, placards and delivery; sample/check water/debris, no-go contaminated/wrong fuel; AVGAS↔JET misfuel may cause ENG failure; **colour alone insufficient**. |\n\n- `SRC:` [FAA AMT General · AVGAS grades/colour + JET types](https://www.faa.gov/sites/faa.gov/files/regulations_policies/handbooks_manuals/aviation/amt_general_handbook.pdf) · [Canadian SCC · JET A/A-1 freeze points](https://scc-ccn.ca/standards/notices-of-intent/canadian-general-standards-board-cgsb/aviation-turbine-fuel-grades-4) · [FAA AC 20-29C · FSII](https://www.faa.gov/documentLibrary/media/Advisory_Circular/AC_20_29C.pdf); **POH/AFM wins**.\n- `M · L4` **FUEL: OCTANE=knock resistance | 80/87 RED; 100/130 GREEN (lean/rich); 100LL BLUE (low lead≠unleaded) | JET A −40°C / A-1 −47°C (max freeze) | JET B wide-cut | FSII inhibits water ice ≠ fuel/airframe de-ice | verify approved grade/type; colour≠proof.**","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"AGK-16","card":"AGK","f":"kb/agk/fuel-fuel-systems.md","h":"Fuel / starvation / contamination","a":"fuel--starvation--contamination","c":["agk-fuel"],"kd":"knowledge","u":"sys-fuel-starvation-contamination","md":"- Know total/usable/unusable, geometry, selector, vents, drains, pumps/crossfeed and gauge limits.\n- Starvation: fuel aboard but not reaching engine; exhaustion: none usable. `M:` starvation may be recoverable, exhaustion is not.\n- `S:` rough/power or flow loss, selected tank empty, vent blocked, selector wrong/OFF, water/wrong fuel.\n- `P:` heat/alternate air→proper/fullest tank→mixture→pump→primer locked→mags, while preserving landing path.\n- Drain all POH sumps after required events; one clear sample proves only that point. Wrong/contaminated fuel=no-go.\n- `T:` gauges≠measured fuel+time/burn; late tank changes may add delay/air.","p":["PPL","CPL"],"e":["PPL"]},{"id":"AGK-17","card":"AGK","f":"kb/agk/fuel-fuel-systems.md","h":"Fuelling: static, bonding and grounding — AIR 1.3","a":"fuelling-static-bonding-and-grounding--air-13","c":["agk-fuel"],"kd":"knowledge","u":"agk-fuelling-static-bonding-grounding","md":"- `R` **Bond and ground the ACFT before the nozzle nears the tank**, any temperature or fuel. Over-wing: nozzle bonded to ACFT **before the cap comes off**; funnels/filters bonded too; drums: bond pump to drum before removing bungs.\n- Bonding equalizes potentials (no spark); it does **not** remove charge already in the fuel. Jet fuel builds more static than AVGAS (low conductivity) → let it rest; anti-static additive helps.\n- `T` **Plastic jerry cans cannot be bonded or grounded.** Empty-tank vapour = most flammable. Blower heaters in cold dry air, enclosed spaces → charged dust; injuries and deaths reported.\n- No fuelling with thunderstorms nearby; control ignition sources (smoking, portable electronics). Jet A-1 auto-ignites at **220 °C** (hot brakes, exhausts).\n\n- Sources: [TC AIM AIR](https://tc.canada.ca/sites/default/files/2026-10/aim-2026-2_air_en.pdf) 1.3.2, 1.3.4.1.","p":["CPL"],"e":["CPL"]},{"id":"AGK-18","card":"AGK","f":"kb/agk/fuel-fuel-systems.md","h":"Fuel heater","a":"fuel-heater","c":["agk-fuel"],"kd":"knowledge","u":"agk-fuel-heater","md":"- Turbine fuel can hold water that **freezes** into ice crystals at low temperature → blocked filters. **Fuel heater** (often oil-to-fuel heat exchanger) keeps fuel above freezing at the filter; filter-bypass/icing warning in some types.\n- `?:` general knowledge; no free TC or NAV CANADA text found. Check against a TC-recognized text (e.g. *From the Ground Up*, TC Flight Training Manual) in the fact-check pass.","p":["CPL"]},{"id":"AGK-19","card":"AGK","f":"kb/agk/fuel-fuel-systems.md","h":"Pebble","a":"pebble","c":["agk-fuel"],"kd":"pebble","u":"agk-fuel-fuel-systems-pebble","md":"- FUEL `fuel = time(h) × burn | time available = usable fuel / burn | 6 gph = 0.1 gal/min, 9 = 0.15, 12 = 0.2 | IFR reserve starts after destination/alternate logic, not after takeoff`\n- FUELLING `bond + ground before nozzle near tank | nozzle bonded before cap off | plastic jerry can = no bond | no fuelling near TS | Jet A-1 220 °C`\n- FUEL HEATER `turbine fuel water → ice crystals at filter | oil-to-fuel heat exchanger`","p":["PPL","CPL"]},{"id":"AGK-20","card":"AGK","f":"kb/agk/gyro-instruments.md","h":"Gyroscopic instruments — principles and errors","a":"gyroscopic-instruments--principles-and-errors","c":["agk-gyro","ifr-emerg"],"kd":"knowledge","u":"agk-gyro-instruments-principles-errors","md":"| Property | Meaning | Used by |\n|---|---|---|\n| Rigidity in space | spinning rotor holds its plane (AI ~15 000 rpm, HI ~10 000 rpm) | attitude indicator, heading indicator |\n| Precession | force acts 90° ahead in direction of rotation; friction + manoeuvres → drift; excess force → tumble | turn indicator / coordinator |\n\n- Power: AI + HI typically vacuum (engine pump, regulator, suction gauge); turn-and-slip normally electric (~8 000 rpm). Different sources = redundancy. [TP 2076 2.1.3 C]\n- **AI** errors: turn error (precesses toward inside of turn; steep turns → pitch from VSI + altimeter) · acceleration → false pitch-up · deceleration → false pitch-down. Limits: newer 360° bank / 85° pitch, no tumble; older tumble at 100° bank or 70° pitch. AI does not show coordination: ball needed. [TP 2076 2.1.3 D.1]\n- **HI**: no direction-seeking; set to compass on ground or steady unaccelerated flight. Drift = real precession (manoeuvres, friction) + apparent precession (aircraft movement, earth rotation). Check vs compass **at least every 15 min**. [TP 2076 2.1.3 D.2]\n- **Turn coordinator**: gyro canted ~35° → senses roll rate + yaw rate; once bank steady, shows rate only. Standard rate 3°/s = wing on index. Ball = quality of turn (slip/skid), not gyro. Turn-and-slip needle shows rate only, not bank. [TP 2076 2.1.3 D.3]\n- **Slaved (gyrosyn) compass**: remote magnetic sensor slaves the heading gyro; free/non-slaved mode for high latitudes (set by hand). [TP 2076 2.1.3 D.4]\n- `T:` HI has no north-seeking ability: re-align every ≤15 min.","p":["PPL","CPL","IR"],"e":["CPL"]},{"id":"AGK-21","card":"AGK","f":"kb/agk/gyro-instruments.md","h":"Control and performance instruments — attitude instrument flying","a":"control-and-performance-instruments--attitude-instrument-flying","c":["agk-gyro","agk-inst"],"kd":"knowledge","u":"agk-control-performance-instrument-flying","md":"- **Control** instruments: **attitude indicator + power** (RPM, MP, EPR) — set directly, in known amounts. **Performance**: airspeed, VSI, altimeter, HI, turn coordinator/turn-and-slip, compass — show the result, lag a little. **Navigation**: track/position.\n- `P` Establish attitude + power on control instruments → **trim** (pressures neutral; ball centred with rudder trim) → **cross-check** performance → **adjust**.\n- `M` **Attitude + power = performance.**\n\n- Sources: [TP 2076](https://www.phoenixaviation.ca/IPM%20tp2076e.pdf) 2.3.1.","p":["PPL","CPL"]},{"id":"AGK-22","card":"AGK","f":"kb/agk/human-factors-decision-making.md","h":"Human factors / ADM","a":"human-factors--adm","c":["agk-hf"],"kd":"knowledge","u":"agk-human-emergency","md":"- IMSAFE | PAVE | DECIDE | 5P. `T:` external pressure makes bad plan feel reasonable.\n- Hypoxia: night vision early. Meds/fatigue degrade before obvious.\n- Haz attitudes: anti-authority/impulsivity/invulnerability/macho/resignation. Antidotes: follow rules/not so fast/could happen/chances foolish/not helpless.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"AGK-23","card":"AGK","f":"kb/agk/human-factors-decision-making.md","h":"Emergency priorities","a":"emergency-priorities","c":["agk-hf","emg","emg-engine","emg-fire"],"kd":"knowledge","u":"agk-emerg-human","md":"- Emerg: aviate>navigate>communicate. MAYDAY×3→ident→problem→position→intention→POB/fuel.\n- Declare early. Forced: control→field→plan→cause→MAYDAY→pax→secure→land. EFATO: nose/Vg→land ahead-ish.\n- Rough engine: carb heat/mixture/fuel/mags/primer as POH/time. `T:` partial power can lure you past fields.\n- Fire: POH memory items + land ASAP. CO: heat off/vent/fresh air/land.","p":["PPL","CPL"]},{"id":"AGK-24","card":"AGK","f":"kb/agk/human-factors-decision-making.md","h":"Situational awareness and cockpit setup","a":"situational-awareness-and-cockpit-setup","c":["agk-hf","ifr"],"kd":"knowledge","u":"agk-situational-awareness-cockpit-setup","md":"- Situational awareness = awareness of all information relevant to the current situation; first step of decision-making. [TC Human Factors for Aviation, Advanced Handbook TP 12864]\n- Perceive → understand → project (what comes next). Low SA precedes most accidents (CFIT, LOC-I, mid-air). Fatigue, stress and environment shrink SA capacity day to day. [TC ASL 1/2019]\n- Keep SA: split the flight into segments; before each, name the top threats + countermeasures; re-prioritize at each segment change; checklists cover equipment, not this flight's threats; ask yourself \"how is my SA?\" [ASL 1/2019]\n- Seat: eyes at **Design Eye Reference Point** (manufacturer marks, e.g. glare-shield balls); instruments + warning lights unobscured; full control travel; nose not blocking view on approach. [AIM AIR 4.12]\n- Disorientation: rely on flight instruments; never senses alone. [AIR 3.7]","p":["IR"]},{"id":"AGK-25","card":"AGK","f":"kb/agk/human-factors-decision-making.md","h":"Workload, information processing, TEM and undesired aircraft states","a":"workload-information-processing-tem-and-undesired-aircraft-states","c":["agk-hf"],"kd":"knowledge","u":"agk-workload-information-processing-tem-uas","md":"- Pilot performance loop: **gather information → process → decide → act**; actions change the situation and the loop repeats, often several at once. Workload rises when inputs exceed processing capacity → task shedding, fixation, missed items. [TC Human Factors for Aviation, Basic Handbook TP 12863]\n- **TEM**: analyse hazards and act to avoid, trap or mitigate **threats** and manage **errors** before they lead to an **undesired aircraft state**. [TC AC 700-042]\n- **Undesired aircraft state (UAS)**: crew-induced position or speed deviation, misapplied flight controls, or incorrect systems configuration that reduces safety margins; last chance before an incident/accident.\n- `T` Once in a UAS, switch from fixing the error to **managing the aircraft state** first (fly, then diagnose).\n\n- Sources: [TC HF module](https://bac-lac.wayback.archive-it.org/web/20071219042208/http:/www.tc.gc.ca/civilaviation/systemsafety/pubs/pdm/module2.htm); [TEM in flight operations (ICAO model)](https://skybrary.aero/articles/threat-and-error-management-tem-flight-operations).","p":["CPL"],"e":["CPL"]},{"id":"AGK-26","card":"AGK","f":"kb/agk/human-factors-decision-making.md","h":"Pebble","a":"pebble","c":["agk-hf"],"kd":"pebble","u":"agk-human-factors-decision-making-pebble","md":"- ADM `IMSAFE | PAVE | DECIDE | 5P | hazardous attitudes: anti-authority / impulsivity / invulnerability / macho / resignation → follow rules / not so fast / could happen / chances foolish / not helpless | external pressure makes a bad plan feel reasonable`\n- EMERGENCY `aviate > navigate > communicate | MAYDAY ×3 → ident → problem → position → intention → POB/fuel | declare early | forced: control → field → plan → cause → MAYDAY → pax → secure → land | CO: heat off, vent, land | partial power can lure you past fields`\n- SA/SEAT `know position, mode, energy, next | eyes at design eye reference point | disoriented → instruments only`\n- WORKLOAD `gather → process → decide → act | overload → shed, fixate, miss`\n- TEM `threats + errors → UAS | in UAS: manage state first, then error`","p":["PPL","CPL","IR"]},{"id":"AGK-27","card":"AGK","f":"kb/agk/load-factor-turns-manoeuvring-speed.md","h":"Rate-one turn / turn geometry","a":"rate-one-turn--turn-geometry","c":["agk-load"],"kd":"formula","u":"agk-rate-one-turn-turn-geometry","md":"- `F:` standard-rate turn = `3°/sec`; 360° in `2 min`.\n- `F rough:` bank for rate-one ≈ `TAS/10 + 7`.\n- `F:` turn radius `ft ≈ TAS² / (11.26 × tan(bank))`; radius `NM ≈ TAS² / (68,420 × tan(bank))`. `[DERIVED; TAS kt]`\n- `M:` at `120 kt`, rate-one bank ≈ `19°`; at `90 kt`, ≈`16°`.\n- `T:` high TAS needs more bank for standard rate.","p":["PPL","CPL"]},{"id":"AGK-28","card":"AGK","f":"kb/agk/load-factor-turns-manoeuvring-speed.md","h":"Pebble","a":"pebble","c":["agk-load"],"kd":"pebble","u":"agk-load-factor-turns-manoeuvring-speed-pebble","md":"- RATE ONE `3°/s, 360° in 2 min | bank ≈ TAS/10 + 7 | 120 kt ≈ 19°, 90 kt ≈ 16° | higher TAS needs more bank`","p":["PPL","CPL"]},{"id":"AGK-29","card":"AGK","f":"kb/agk/pitot-static-instruments.md","h":"Pitot / static","a":"pitot--static","c":["agk-pitot"],"kd":"knowledge","u":"sys-pitot-static","md":"- Pitot→ASI; static→ASI/ALT/VSI. Pitot heat normally does not heat static ports; preflight for covers/bugs/water/ice/tape.\n\n| Failure | ASI | ALT | VSI |\n|---|---|---|---|\n| pitot blocked, drain open | →`0` | normal | normal |\n| pitot+drain blocked | climb high/descent low | normal | normal |\n| static blocked | climb low/descent high | frozen | →`0` |\n| alternate static | often ASI/ALT higher | aircraft-specific | momentary/specific |\n\n- `P:` heat→alternate static per POH→attitude/power/GPS trend→ATC→land. Exact errors vary.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"AGK-30","card":"AGK","f":"kb/agk/pitot-static-instruments.md","h":"Pitot-static instruments — principles","a":"pitot-static-instruments--principles","c":["agk-pitot","ifr-emerg"],"kd":"knowledge","u":"agk-pitot-static-instrument-principles","md":"| Instrument | Senses | Principle |\n|---|---|---|\n| ASI | pitot + static | diaphragm fed pitot pressure, case vented static → IAS |\n| Altimeter | static | sealed aneroid in case vented to static expands as altitude increases; subscale = pressure datum |\n| VSI | static | calibrated leak between case and static → rate of change; rate lags, settles 6–9 s after level-off |\n\n- Altimeter lags in climb/descent: lead level-off by ~10 % of vertical speed. IVSI adds accelerometers → near-zero lag. [TP 2076 2.1.2 F]\n- Altimeter calibrated ±20 ft at sea level; ground check ±50 ft of known elevation. [AIM AIR 1.5.1–1.5.2]\n- Setting too high → reads too high. Cold → true lower: ~4 % per 11 °C below ISA. Mountain wave + cold → overread up to 3 000 ft. [AIR 1.5.3–1.5.8]\n- Blockage patterns: `sys-pitot-static`.","p":["IR"]},{"id":"AGK-31","card":"AGK","f":"kb/agk/pressurization.md","h":"Cabin pressurization / outflow — L4","a":"cabin-pressurization--outflow--l4","c":["agk-press"],"kd":"knowledge","u":"sys-cabin-pressurization-outflow-l4","md":"| Key | Recall |\n|---|---|\n| `T` CABIN ALT | Pressure-equivalent **cabin** ALT ≠ ACFT ALT; cabin ALT governs altitude-dependent O₂ use, subject to separate rules. |\n| `R` OUTFLOW | Regulates cabin P by controlling **air discharged**, with conditioned/pressurizing air supplied. |\n| `M` CLOSE | Outflow closes→less air escapes→cabin **P↑ / ALT↓** (other factors equal). |\n| `M` OPEN | Outflow opens→more air escapes→cabin **P↓ / ALT↑** (other factors equal). |\n| `F` ΔP | Differential P = **cabin P − ambient P**; AFM structural limit. |\n| `T` RELIEF | **Positive** relief protects against excess cabin P; **negative** relief protects against excess outside P. |\n| `!` FAILURE | Depressurization→cabin ALT↑→O₂ / emergency DESC per AFM; **O₂ thresholds/supply: [card 04 · CAR 605.31–32](../../kb/law/oxygen-requirements.md)** (not duplicated). |\n\n- `SRC:` [FAA PHAK · pressurization systems](https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/phak) · [CAR 605.31–32](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.31.html); ACFT AFM/checklists control.\n- `M · L4` **PRESSURIZATION: outflow CLOSE→cabin P↑/ALT↓; OPEN→P↓/ALT↑ | ΔP=cabin−ambient | +relief excess cabin P; −relief excess outside P | decompression→O₂/emergency DESC per AFM.**","p":["CPL"]},{"id":"AGK-32","card":"AGK","f":"kb/agk/stall-spin-spiral.md","h":"Load factor / accelerated stall","a":"load-factor--accelerated-stall","c":["agk-stall","agk-load"],"kd":"formula","u":"agk-load-factor-accelerated-stall","md":"- `F:` in a coordinated, constant-altitude turn, `n = 1 / cos(bank)`. The bank-only equation does not apply to every manoeuvre.\n- `F:` `Vs_bank = Vs × √n`.\n- `M:` `45°` bank ≈ `1.41g`, stall ×`1.19`; `60°` bank = `2g`, stall ×`1.41`.\n- `T:` accelerated stall depends load factor/AoA, not just bank; POH chart wins.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"AGK-33","card":"AGK","f":"kb/agk/stall-spin-spiral.md","h":"Manoeuvring speed / stall-speed notation","a":"manoeuvring-speed--stall-speed-notation","c":["agk-stall","agk-load","agk-vspeeds"],"kd":"formula","u":"agk-manoeuvring-speed-stall-speed-notation","md":"- `VS` = generic stall speed in stated config; `VS1` = stall speed in specified config (**often clean**); `VS0` = stall speed in landing config. `VS` and `VS1` may denote the **same clean-config value** in context; do not substitute `VS0`.\n- `F theoretical:` positive stall/limit-load intersection `VA_est ≈ VS(clean) × √n_limit`, using matching config/weight/speed basis; **not guaranteed published VA**.\n- `M legacy normal:` `n_limit=+3.8` ⇒ `VA_est≈1.95×VS1` (mental shortcut `≈2×VS1`, **not a VA range**); e.g. `VS1=50 KIAS ⇒ ≈97.5 KIAS`.\n- `F weight:` approximate `VA2≈VA1×√(W2/W1)` if same config/load-factor basis; lighter ⇒ lower speed.\n- `T:` approved POH/AFM `VA` and weight schedule win; `VA` does **not** guarantee protection against multiple/abrupt control inputs or all turbulence.","p":["PPL","CPL"],"e":["PPL"]},{"id":"AGK-34","card":"AGK","f":"kb/agk/stall-spin-spiral.md","h":"Pebble","a":"pebble","c":["agk-stall"],"kd":"pebble","u":"agk-stall-spin-spiral-pebble","md":"- LOAD FACTOR `coordinated level turn n = 1/cos(bank) | Vs_bank = Vs × √n | 45° ≈ 1.41 g, stall ×1.19 | 60° = 2 g, stall ×1.41`\n- VA `VA_est ≈ VS(clean) × √n_limit; +3.8 g → ≈1.95 × VS1, not guaranteed published VA | lighter → lower VA | VS0 ≠ VS1 | VA does not protect against multiple/abrupt inputs`","p":["PPL","CPL"]},{"id":"AGK-35","card":"AGK","f":"kb/agk/takeoff-climb-cruise-glide-landing-performance.md","h":"Performance factors","a":"performance-factors","c":["agk-perfcalc","agk-perf","agk-vspeeds"],"kd":"knowledge","u":"agk-performance-factors","md":"- Vx=altitude/distance. Vy=altitude/time. Best glide=max distance no power. Min sink=max time.\n- Calculate, don’t guess. TO/LDG: weight/temp/pressure/elev/wind/slope/surface/config/technique.\n- `M:` hot-high-heavy-humid-tailwind-soft-uphill TO = bad stack.\n- Headwind helps; tailwind hurts big: small value, large distance penalty. grass/soft/wet/snow roll↑ braking↓.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"AGK-36","card":"AGK","f":"kb/agk/takeoff-climb-cruise-glide-landing-performance.md","h":"Climb / descent gradient","a":"climb--descent-gradient","c":["agk-perfcalc","ifr-dep"],"kd":"formula","u":"agk-climb-descent-gradient","md":"- `F:` `ft/NM = ROC(fpm) × 60 / GS`.\n- `F:` `ROC/ROD(fpm)=GS × gradient(ft/NM)/60`.\n- `M:` `200 ft/NM ≈ 3.3%`.\n- `M:` at `90 kt`, `300 ft/NM` needs `450 fpm`; at `120 kt`, needs `600 fpm`.\n- `T:` gradient uses groundspeed. Tailwind increases GS and required fpm.","p":["CPL"],"e":["CPL"]},{"id":"AGK-37","card":"AGK","f":"kb/agk/takeoff-climb-cruise-glide-landing-performance.md","h":"Percent gradient","a":"percent-gradient","c":["agk-perfcalc","ifr-dep"],"kd":"formula","u":"agk-percent-gradient","md":"- `F:` `% gradient = ft/NM / 60.76`.\n- `F:` `ft/NM ≈ % × 60.76`.\n- `M:` `3° glidepath ≈ 318 ft/NM ≈ 5.2%`.\n- `M:` `3.3% ≈ 200 ft/NM`.\n- `T:` degrees and percent are not the same.","p":[],"ph":["IR"]},{"id":"AGK-38","card":"AGK","f":"kb/agk/takeoff-climb-cruise-glide-landing-performance.md","h":"Descent planning","a":"descent-planning","c":["agk-perfcalc","ifr-app-fly"],"kd":"formula","u":"agk-descent-planning","md":"- `F 3°:` `ROD ≈ GS × 5`.\n- `F 3°:` descent distance NM ≈ `altitude to lose / 300`.\n- `F:` time to descend = distance/GS×60.\n- `M:` `90 kt` on 3° ⇒ `450 fpm`; `100 kt` ⇒ `500 fpm`; `120 kt` ⇒ `600 fpm`.\n- `T:` add level-offs, stepdowns, tailwind, config, ATC restrictions.","p":["CPL"],"e":["CPL"]},{"id":"AGK-39","card":"AGK","f":"kb/agk/takeoff-climb-cruise-glide-landing-performance.md","h":"Glide","a":"glide","c":["agk-perfcalc"],"kd":"formula","u":"agk-glide","md":"- `F:` glide distance `NM = height AGL(ft) × glide ratio / 6076`.\n- Example: `9:1` glide ratio ⇒ `1000 ft AGL ≈ 1.48 NM` still-air.\n- `F:` time aloft ≈ height to lose / descent rate.\n- `M C150M:` POH Fig. 3-1 shows approx `6000 ft AGL → 10 NM`; therefore `1000 ft ≈ 1.67 NM` at `60 KIAS`, flaps UP, prop windmilling, zero wind. `[C150M POH 1977 Fig. 3-1]`\n- `T:` use height above terrain, not altitude ASL. Wind, configuration, propeller, speed and aircraft condition change actual range.","p":["PPL","CPL"]},{"id":"AGK-40","card":"AGK","f":"kb/agk/takeoff-climb-cruise-glide-landing-performance.md","h":"Runway / landing energy","a":"runway--landing-energy","c":["agk-perfcalc"],"kd":"formula","u":"agk-runway-landing-energy","md":"- `F:` kinetic energy ∝ `V²`.\n- `F:` speed increase energy factor = `(actual/target)²`.\n- `M:` `+10% speed` ⇒ `+21% energy`; `+20% speed` ⇒ `+44% energy`.\n- `T:` fast final burns runway and brakes. Tailwind hurts more than it feels.","p":[],"ph":["PPL","CPL","IR"]},{"id":"AGK-41","card":"AGK","f":"kb/agk/takeoff-climb-cruise-glide-landing-performance.md","h":"Runway / landing distance","a":"runway--landing-distance","c":["agk-perfcalc","ifr-plates"],"kd":"knowledge","u":"plate-runway-landing-distance","md":"- Use LDA/declared distances, slope, surface condition/RSC, wind, temperature, aircraft landing performance.\n- `T:` approach legal does not mean landing distance acceptable.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"AGK-42","card":"AGK","f":"kb/agk/takeoff-climb-cruise-glide-landing-performance.md","h":"Pebble","a":"pebble","c":["agk-perfcalc"],"kd":"pebble","u":"agk-takeoff-climb-cruise-glide-landing-performance-pebble","md":"- FACTORS `Vx = altitude/distance; Vy = altitude/time; best glide = max distance; min sink = max time | hot-high-heavy-humid-tailwind-soft-uphill = bad stack | calculate, don’t guess`\n- GRADIENT `ft/NM = ROC × 60 / GS | fpm = GS × ft/NM / 60 | % = ft/NM / 60.76 | 200 ft/NM ≈ 3.3% | 3° ≈ 318 ft/NM ≈ 5.2% | uses groundspeed`\n- DESCENT `3°: ROD ≈ GS × 5; distance NM ≈ altitude to lose / 300 | add level-offs, stepdowns, tailwind`\n- GLIDE `NM = height AGL × glide ratio / 6076 | height above terrain, not ASL`\n- ENERGY `KE ∝ V² | +10% speed = +21% energy; +20% = +44% | fast final burns runway`","p":["PPL","CPL"]},{"id":"AGK-43","card":"AGK","f":"kb/agk/theory-of-flight.md","h":"Aerodynamics — lift, drag & equilibrium","a":"aerodynamics--lift-drag--equilibrium","c":["agk-theory"],"kd":"knowledge","u":"agk-aerodynamics-lift-drag-equilibrium","md":"| Key | Essential recall |\n|---|---|\n| `LIFT` | Force component ⟂ relative airflow; `L=½ρV²SCL` (V = TAS); AOA controls `CL` until critical AOA/stall. |\n| `CP / CG / AC` | CP = location of resultant aero force on airfoil (moves with AOA); CG = weight acts here; AC ≈25% chord for typical subsonic airfoil (pitching moment approx constant with AOA). |\n| `MOMENT` | Pitching moment about CG = force × perpendicular arm; trimmed unaccelerated FLT requires net pitching moment `ΣM(CG)=0` (tail force may balance wing/fuselage moment). |\n| `DRAG` | Total = parasite + induced; parasite = form/pressure + skin friction + interference; induced = drag due to lift/downwash. |\n| `SPD / DRAG` | At given GW/config/ALT in steady level FLT, IAS↓→AOA/induced drag↑; IAS↑→parasite drag↑; minimum total drag ≈ max `L/D`. |\n| `EQUIL` | Straight/level/constant-speed simplified: `L=W; T=D; ΣM=0`; requires aligned thrust & negligible vertical thrust/tail geometry effects. |\n| `BANK` | Coordinated level turn: `L cosφ=W`, `n=1/cosφ`, `Vs(turn)=Vs(level)√n` (same config/weight). |\n| `AIRFOIL` | Wing cross-section: chord = LE→TE straight line; camber = curvature; thickness = upper/lower separation; `CL` varies with AOA up to critical AOA. |\n| `WASHOUT` | Geometric twist: wingtip incidence < root incidence → generally promotes root-first stall/longer aileron effectiveness; not guaranteed. |\n| `AR` | Aspect ratio `AR=b²/S` (span²/wing area); rectangular wing `AR=b/c` (span/chord). |\n| `INDUCED / AR` | At equal `CL` and span efficiency, `AR↑→CDi↓`; `CDi=CL²/(πeAR)` (e = span-efficiency factor). |\n| `T` | Washout ≠ dihedral; AR ≠ wing area; cambered airfoil may lift at geometric AOA 0°; stall at critical AOA. |\n| `T` | CP ≠ CG ≠ AC; lift vector ⟂ relative wind, not necessarily vertical; stall = critical AOA, not a fixed IAS. |\n\n- `SRC:` [FAA PHAK, Ch. 4–5 · Principles/Aerodynamics of Flight](https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/phak); general theory; aircraft POH/AFM governs performance.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"AGK-44","card":"AGK","f":"kb/agk/theory-of-flight.md","h":"Wing design devices, control balancing, roll upset","a":"wing-design-devices-control-balancing-roll-upset","c":["agk-theory"],"kd":"knowledge","u":"agk-wing-design-devices-control-balance","md":"| Device | Effect | Trade-off |\n|---|---|---|\n| **Sweepback** | delays compressibility (high Mach); adds lateral stability | tip stalls first, pitch-up tendency; less lift at low speed |\n| **Wing fence** | blocks spanwise flow on swept wing | delays tip stall |\n| **Stall strip** | small wedge on inboard leading edge | forces **root stall first** → aileron control kept |\n| **Spoilers** | spoil lift: roll control (one side) and/or descent/braking (both) | lift loss, drag |\n| **Vortex generators** | re-energize boundary layer | delay separation, better low-speed control |\n| **Winglets** | reduce wingtip vortices → **induced drag** | weight, structure |\n\n- **Static balance**: mass ahead of hinge so the surface's CG is at/near the hinge line. **Dynamic (aerodynamic) balance**: horn or inset hinge reduces stick forces. Both guard against **flutter**.\n- **Roll upset** (e.g. wake turbulence, asymmetric flap, aileron trim/runaway): unload, roll wings level with ailerons (rudder as needed) before pulling; then recover pitch and power.\n- `?:` general knowledge; no free TC or NAV CANADA text found. Check against a TC-recognized text (e.g. *From the Ground Up*, TC Flight Training Manual) in the fact-check pass.","p":["PPL","CPL"]},{"id":"AGK-45","card":"AGK","f":"kb/agk/theory-of-flight.md","h":"Pebble","a":"pebble","c":["agk-theory"],"kd":"pebble","u":"agk-theory-of-flight-pebble","md":"- AERO `L ⟂ relative airflow; L = ½ρV²S·CL | CP ≠ CG ≠ AC (≈25% chord) | trim: ΣM(CG) = 0 | drag = parasite (form + friction + interference) + induced | IAS↓ → induced↑; IAS↑ → parasite↑; min drag ≈ max L/D | level: L = W, T = D | level turn n = 1/cosφ, Vs × √n | washout: tip incidence < root → root-first stall generally | AR = b²/S; AR↑ → induced drag↓ | stall = critical AOA, not a fixed IAS`\n- WING DEVICES `sweepback: high Mach, tip stall | fence + stall strip: root stalls first | spoilers: roll or descent | VGs: delay separation | winglets: less induced drag | balance: mass vs flutter, horn vs forces`","p":["PPL","CPL"]},{"id":"AGK-46","card":"AGK","f":"kb/agk/v-speeds-airspeed-limits.md","h":"VREF / landing reference speed","a":"vref--landing-reference-speed","c":["agk-vspeeds","agk-perfcalc"],"kd":"formula","u":"agk-vref-landing-reference-speed","md":"- `Definition:` `VREF` is the landing reference speed. Use the POH/AFM value for the specified landing configuration; certification bases differ. In landing-distance certification it is maintained to the `50 ft` screen height.\n- `F fallback:` when `VREF` is not specified, use `VREF = 1.3 × VSO`. Example: `VSO 50 KIAS → VREF 65 KIAS`.\n- `F weight:` for the same configuration and speed basis, `VREF₂ ≈ VREF₁ × √(W₂/W₁)`. Use POH/AFM landing-weight data when published.\n- `Approach category:` use published `VREF`, or `1.3 VSO` if none is specified, at **maximum certificated landing weight**. Do not lower the category because today’s landing weight is lower. `[TC AIM 2026-1 RAC 9.21]`\n- `T:` a wind/gust additive changes the operational approach target (`VAPP`), not the underlying `VREF`. Aircraft procedures and limitations govern.","p":["PPL","CPL","ME"],"e":["PPL","CPL"]},{"id":"AGK-47","card":"AGK","f":"kb/agk/v-speeds-airspeed-limits.md","h":"Pebble","a":"pebble","c":["agk-vspeeds"],"kd":"pebble","u":"agk-v-speeds-airspeed-limits-pebble","md":"- VREF `POH/AFM value; fallback 1.3 × VSO | weight: VREF₂ ≈ VREF₁ × √(W₂/W₁) | approach category at maximum certificated landing weight | gust additive changes VAPP, not VREF`","p":["PPL","CPL","ME"]},{"id":"AGK-48","card":"AGK","f":"kb/agk/weight-balance.md","h":"Weight / balance","a":"weight--balance","c":["agk-wb"],"kd":"formula","u":"agk-weight-balance","md":"- `F:` `moment = weight × arm`.\n- `F:` `CG = Σmoment / Σweight`.\n- `F:` `new CG = (old moment ± added/removed/shifted moment) / new weight`.\n- `F:` shifted load moment change = `weight × distance shifted`.\n- `M:` forward load lowers arm? depends datum. Calculate, don’t feel it.\n- `T:` within max gross ≠ within CG envelope. Check takeoff + landing + zero-fuel if near limit.\n- FWD CG: stable↑ stall↑ elevator/flare↓. AFT CG: stable↓ stall/spin recovery worse.","p":["PPL","CPL","ME"],"e":["PPL","CPL"]},{"id":"AGK-49","card":"AGK","f":"kb/agk/weight-balance.md","h":"Pebble","a":"pebble","c":["agk-wb"],"kd":"pebble","u":"agk-weight-balance-pebble","md":"- W&B `moment = weight × arm | CG = Σmoment / Σweight | shift: weight × distance shifted | within max gross ≠ within CG | check takeoff + landing + zero-fuel | FWD CG: stable↑ stall↑ flare authority↓ | AFT CG: stable↓, stall/spin recovery worse`","p":["PPL","CPL","ME"]},{"id":"LAW-0","card":"LAW","f":"kb/law/aerial-work-702.md","h":"Scope and flight operations — 702.01 / .11 / .13 / .14 / .16–.18 / .20 / .23 / .24","a":"scope-and-flight-operations--70201--11--13--14--1618--20--23--24","c":["law-702"],"kd":"knowledge","u":"law-702-scope-flight-operations","md":"- `R` 702 applies to aeroplane or helicopter aerial work with: persons other than flight crew on board · helicopter Class B/C/D external loads · towing objects · dispersing products. **Not**: ultra-lights, sightseeing.\n- `R` Ops personnel instructed on duties and follow the COM. Flight starts only when **authorized per COM**; operational flight plan (Commercial Air Service Standards) prepared per COM.\n- `R` Non-crew persons carried only if: presence **essential** during flight · parachutist + AOC authorizes parachute descents · or AOC authorizes carrying persons + CASS met.\n- `R` Day VFR, uncontrolled, <1 000 ft AGL: aeroplane may fly with flight visibility **<2 SM**, helicopter **<1 SM**, only with **AOC authorization + CASS**.\n- `R` Night, VFR OTT or IFR **not** while towing, carrying heli Class B/C/D load, dispersing, or in a **single-engined** ACFT, unless AOC authorizes + CASS.\n- `R` Night with non-crew persons only if: PIC holds an **instrument rating** · or parachutists, AOC for parachuting + night VFR, within **10 NM** of DEP A/D · or AOC authorizes carrying persons + CASS.\n- `R` Land ACFT over water beyond gliding reach of shore after engine failure (except TKOF/LDG) → AOC authorization + CASS.\n- `R` PIC ensures non-crew persons get a CASS safety briefing.\n- `R` Icing reported or forecast on route → no authorization, TKOF or continuation if **PIC** thinks safety may suffer, even if ACFT is equipped (605.30(a)).\n\n- Sources: [702.01](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.01.html), [702.11](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.11.html), [702.13](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.13.html), [702.14](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.14.html), [702.16](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.16.html), [702.17](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.17.html), [702.18](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.18.html), [702.20](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.20.html), [702.23](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.23.html), [702.24](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.24.html).","p":["CPL"]},{"id":"LAW-1","card":"LAW","f":"kb/law/aerial-work-702.md","h":"Equipment — 702.42 / .44 / .45","a":"equipment--70242--44--45","c":["law-702"],"kd":"knowledge","u":"law-702-equipment","md":"- `R` Night: **≥1 landing light**; in icing, a means to illuminate or detect ice formation.\n- `R` **Multi-engine in IMC**: **2 generators/alternators**, each on a separate engine (or rotor drive) + **2 independent energy sources**, ≥1 **not a battery**, each able to drive all flight instruments needing power, installed so one failure affects neither the other source nor the other instruments.\n- `R` Pilot seat **and any seat beside it**: safety belt **with shoulder harness**.\n- `R` External load: attachment device authorized in an **STC** or airworthiness approval for that configuration.\n\n- Sources: [702.42](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.42.html), [702.44](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.44.html), [702.45](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.45.html).","p":["CPL"],"e":["CPL"]},{"id":"LAW-2","card":"LAW","f":"kb/law/aerial-work-702.md","h":"Crew designation, validity, training, manuals, SOPs — 702.64 / .67 / .76 / .83 / .84","a":"crew-designation-validity-training-manuals-sops--70264--67--76--83--84","c":["law-702"],"kd":"knowledge","u":"law-702-crew-validity-training-manuals-sop","md":"- `R` Designate PIC (PIC + SIC if 2 pilots); record names, keep **≥180 days**.\n- `R` **PPC valid to 1st day of 25th month**; competency check + annual training → **13th month**. Renewed in last 90 days → **+24 / +12 months**. Minister may extend **≤60 days**. Expired **≥24 months** → requalify per CASS.\n- `R` Ground + flight training program, Minister-approved: indoctrination · upgrading · training for the aerial work · initial + annual (type, servicing/ground handling, emergency, surface contamination, persons carried on board or **externally**). Syllabus in COM; contamination awareness program for others.\n- `R` COM parts + amendments to each crew member, ground ops and maintenance staff; or one copy **in each ACFT** (or, for parachute ops within **25 NM** of DEP, another suitable place) if COM has amendment procedures. Holders keep it current and accessible.\n- `R` SOPs for each ACFT **required to have ≥2 pilots**, within AFM limits, CASS; copy **on board**.\n- `T` 702 PPC **24 months** ≠ 703 PPC **12 months**.\n\n- Sources: [702.64](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.64.html), [702.67](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.67.html), [702.76](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.76.html), [702.83](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.83.html), [702.84](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.84.html).","p":["CPL"]},{"id":"LAW-3","card":"LAW","f":"kb/law/aerial-work-702.md","h":"Flight time, FDP, rest, time free from duty — 702.91–.97","a":"flight-time-fdp-rest-time-free-from-duty--7029197","c":["law-702"],"kd":"knowledge","u":"law-702-flight-time-fdp-rest","md":"- `R` Monitoring system (flight time, FDP, rest) in COM; anyone aware of an exceedance → tell operator ASAP.\n- `R` Max flight time: **1 200 h / 365 d · 300 h / 90 d · 120 h / 30 d (100 h on call) · 60 h / 7 d · single-pilot IFR 8 h / 24 h**. More only with AOC authorization + CASS. Limit reached → off flight duty until 702.93 rest or 702.96 time off (except 702.94).\n- `R` Max FDP **14 consecutive h in 24 consecutive h**. Split: + **½ the rest, max +3 h**, with advance notice + **≥4 consecutive h** rest in suitable accommodation, uninterrupted; next rest + **≥ the extension**. Longer FDP only with AOC authorization + CASS.\n- `R` Unforeseen operational circumstance **after FDP starts**: flight time and FDP may be exceeded if PIC, after consulting other flight crew, considers it safe + CASS met.\n- `R` Delay **>3 h**, notified before leaving rest facility → FDP begins **3 h after original** report.\n- `R` Time free: **24 consecutive h, 13× per 90 d and 3× per 30 d**; on call: **36 consecutive h / 7 d** or **3 consecutive days / 17 d** (start and duration notified). Other patterns only with AOC + CASS.\n- `R` Positioning after FDP → extra rest **≥½** of travel beyond max FDP.\n\n- Sources: [702.91](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.91.html), [702.92](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.92.html), [702.93](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.93.html), [702.94](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.94.html), [702.95](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.95.html), [702.96](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.96.html), [702.97](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.97.html).","p":["CPL"],"e":["CPL"]},{"id":"LAW-4","card":"LAW","f":"kb/law/aerial-work-702.md","h":"Pebble","a":"pebble","c":["law-702"],"kd":"pebble","u":"law-702-pebble","md":"- 702 SCOPE `persons on board | heli Class B/C/D load | towing | dispersing | not ultra-light, not sightseeing`\n- 702 OPS `flight authorized + OFP per COM | non-crew: essential, parachutist, or AOC + CASS | <2 SM aeroplane / <1 SM heli day VFR uncontrolled <1000 AGL only with AOC + CASS | night/OTT/IFR no towing, loads, dispersing, single-engine unless AOC | night + passengers: PIC IR, or parachutists ≤10 NM`\n- 702 EQUIP `night landing light | ME IMC 2 gens + 2 sources, ≥1 not battery | pilot + beside seat shoulder harness | external load attachment per STC`\n- 702 VALIDITY `PPC 25th mo | CC + annual 13th mo | renew last 90 d → +24/+12 | expired ≥24 mo → requalify`\n- 702 FATIGUE `FT 1200/365, 300/90, 120/30 (100 on call), 60/7, SP IFR 8/24 | FDP 14/24 | split ½ rest ≤+3 h | UOC after FDP start, PIC + crew | delay >3 h → +3 h | off 24 h 13×/90 d + 3×/30 d`","p":["CPL"]},{"id":"LAW-5","card":"LAW","f":"kb/law/air-law-procedures.md","h":"Sources of authority","a":"sources-of-authority","c":["law"],"kd":"knowledge","u":"ref-source-authority-c04","md":"- `A1:` Act/CARs/incorporated Standards = law; `A2:` current AIP/CFS/CAP/NOTAM = operational data; AIM/TP/FTM = guidance.\n- `T:` never rely on expired CAR/CFS/CAP copies.","p":[],"ph":["PPL","CPL","IR"]},{"id":"LAW-6","card":"LAW","f":"kb/law/air-law-procedures.md","h":"High-yield traps","a":"high-yield-traps","c":["law"],"kd":"trap","u":"law-high-yield-traps","md":"- PIC vs ATC | PPL cost-share conditions | CPL≠AOC | medical vs `5y/24mo/6mo` recency | night passenger recency | `500 ft from`≠`500 AGL`.\n- Controlled `3-1-500`; uncontrolled high `1D/3N-2000/500`; low `2D/3N-clear`; `25 NM` plan exemption; fuel `30D/45N`; MF≠ATF; SVFR pilot-request/control-zone/COC/surface.","p":[],"ph":["PPL","CPL"]},{"id":"LAW-7","card":"LAW","f":"kb/law/air-law-procedures.md","h":"Key definitions — CAR 101.01","a":"key-definitions--car-10101","c":["law"],"kd":"knowledge","u":"law-car-101-01-key-definitions","md":"| Term | CAR 101.01 meaning (short) |\n|---|---|\n| controlled airspace | fixed dimensions in DAH; ATC service provided |\n| IMC / VMC | below / at-or-above Div VI VMC minima (vis + cloud distance) |\n| flight visibility | forward visibility from cockpit in flight |\n| RVR | range pilot on centreline can expect to see rwy markings / lights |\n| MDA | ASL, non-precision; no descent below until required visual reference |\n| DH | height (CAP/RCAP) for precision approach: missed if no visual ref |\n| night | end of evening civil twilight → start of morning civil twilight |\n| transponder | Mode S ATC transponder (CAN-TSO-C112) |\n\n- `T:` MDA = altitude (ASL); DH = height. CAP: DA = altitude, DH = DA above TDZE/threshold.\n- `T:` IMC is defined by VMC minima, not by \"in cloud\".\n- [CAR 101.01; CAP GEN definitions]","p":["IR"]},{"id":"LAW-8","card":"LAW","f":"kb/law/air-law-procedures.md","h":"Entry, transit and departure of aircraft — AIP Canada GEN 1.2","a":"entry-transit-and-departure-of-aircraft--aip-canada-gen-12","c":["law"],"kd":"knowledge","u":"law-entry-transit-departure-gen-1-2","md":"- `R` International ARR/DEP → **first land at an A/D with customs** (CFS/CWAS heading `CUST` = airport of entry, AOE).\n- `R` Foreign commercial: Canadian **Foreign Air Operator Certificate (FAOC)**; scheduled also needs designation + Agency scheduled licence; non-scheduled needs prior Agency permission + licence. Overflight without FAOC → request **≥10 working days** ahead.\n- `R` **Private flights** into or over Canada: no prior permission, but **flight plan** required. Customs decides private vs commercial by how the flight actually operates.\n- `R` Transborder: flight plan **required** for every flight Canada ↔ foreign state (602.73). Canada → U.S.: eAPIS manifest **≥60 min before DEP**. U.S. → Canada: land at CBSA-designated A/D; **≤15 persons** may report by telephone **2–48 h** before ARR + call on landing; >15 → staffed AOE. CANPASS (all on board members, ≤15) → any AOE when open.\n\n- Sources: AIP Canada GEN 1.2 (NAV CANADA, edition of 2 Oct 2025).","p":["CPL"]},{"id":"LAW-9","card":"LAW","f":"kb/law/air-law-procedures.md","h":"Canada Transportation Act — air service licence","a":"canada-transportation-act--air-service-licence","c":["law"],"kd":"knowledge","u":"law-canada-transportation-act-air-service-licence","md":"- `R` CTA s. 57: no one operates an **air service** without, for that service: a **licence** under CTA Part II · a **Canadian aviation document** (normally an AOC) · prescribed **liability insurance**. s. 59: no selling or advertising an air service without the required licence.\n- `R` Air service = aircraft service **publicly available** for carrying passengers and/or goods. Licences: **domestic** · **scheduled international** · **non-scheduled international**, issued by the **Canadian Transportation Agency**.\n- `T` AOC (TC, safety) ≠ licence (Agency, economic): an air service needs both, plus insurance.\n- `?:` Air Transportation Regulations Parts I and VII not read for this note.\n\n- Sources: [CTA s. 57](https://lois-laws.justice.gc.ca/eng/acts/C-10.4/page-9.html); [Agency licence guide](https://otc-cta.gc.ca/eng/publication/canadian-air-carrier-licence-application-guide).","p":["CPL"]},{"id":"LAW-10","card":"LAW","f":"kb/law/air-law-procedures.md","h":"Canada Labour Code Part II on board aircraft","a":"canada-labour-code-part-ii-on-board-aircraft","c":["law"],"kd":"knowledge","u":"law-canada-labour-code-on-board-ohs","md":"- `R` Part II (occupational health and safety) covers employees **on board aircraft in operation**: flying, or doors closed and moving under own power for TKOF/LDG. Not when stationary before, after or between flights. TC administers it (MOU with ESDC Labour Program) with the Aviation OHS Regulations.\n- `R` Employee rights: **know** hazards · **participate** (committee / representative) · **refuse dangerous work** (s. 128). Refusing on board: tell the **person in charge of the aircraft**; health and safety officer investigates. No refusal if it directly endangers another person's life, health or safety.\n- `R` Employer duties (ss. 124–125) protect employees' health and safety; employee duties (s. 126). Death or disabling injury to ≥2 employees → employer contacts TC OHS inspector **within 24 h**.\n- `?:` Sections 124–126 summarized from TC brochures, not read in the Code.\n\n- Sources: [TC TP 14215](https://tc.canada.ca/node/29631); [TC TP 13537](https://tc.canada.ca/en/aviation/publications/right-refuse-dangerous-work-board-aircraft-while-operation-tp-13537); [TC TP 14793](https://tc.canada.ca/sites/default/files/2024-07/TP_14793_E.pdf).","p":["CPL"]},{"id":"LAW-11","card":"LAW","f":"kb/law/air-law-procedures.md","h":"Dangerous goods by air — TC AIM RAC 12.3","a":"dangerous-goods-by-air--tc-aim-rac-123","c":["law"],"kd":"knowledge","u":"law-dangerous-goods-by-air-rac-12-3","md":"- `R` Dangerous goods = items in the **9 classes** of the TDG Act: explosives · gases · flammable liquids · flammable solids · oxidizers · toxic/infectious · radioactive · corrosives · miscellaneous.\n- `R` Not carried on Canadian aircraft, or foreign aircraft in Canada, unless per **TDG Act + Regulations**; TDGR 12.1–12.3 adopt the **ICAO Technical Instructions**; 12.4–12.17 give domestic alternatives.\n- `R` Anyone handling, offering or transporting DG: valid **TDG training certificate** (Part 6) or direct supervision by a certified person. Cer
