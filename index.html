al line qualification / Récence 90 jours des vols/secteurs; qualification en ligne |\n| CAR | 705.106 | 705.106 |\n\n\\* Under 604, the 24-mo figure describes its CC/check regime; an accepted Part VII PPC remains subject to the equivalency/validity conditions in 604.140. **†** CPL PIC only if the aeroplane is certificated for one pilot; commercial PIC on a two-crew aeroplane requires ATPL. **‡** 705 PPC 6 mo by default; approved six-month recurrent substitution may permit 12 mo, or approved AQP. **§** Additional MPL pathway exists for 705 SIC. All PIC/SIC assignments require the correct Part IV privileges, approved training, recency and operator authorization. / *L'équivalence 604 ne prolonge pas automatiquement la validité d'un PPC externe; † CDB commercial avion à deux pilotes : ATPL; ‡ autre programme périodique/AQP approuvé possible; § voie MPL possible pour copilote 705.*\n\n**604 scope vs registration / Champ 604 et enregistrement :** §604.02 applies when **ANY ONE** of the four aircraft characteristics above is present. Separately, §604.03 generally requires a private-operator registration document to carry passengers or goods in a **large aeroplane**, a **turbojet aeroplane**, or a **turbine-powered pressurized aeroplane certificated for more than six passenger seats** (Part VII / flight-permit exceptions). A small, non-pressurized piston twin meets §604.02 solely because it is multi-engine; that fact alone does not trigger §604.03 registration. / §604.02 : **un seul** des quatre critères suffit. §604.03 : enregistrement généralement requis pour transporter passagers ou marchandises en **gros avion**, **avion à turboréacteur**, ou **avion à turbine pressurisé homologué pour plus de six sièges passagers** (exceptions partie VII / permis de vol). Un petit bimoteur à pistons non pressurisé relève du §604.02 par ses moteurs, sans que cela déclenche seul l'enregistrement §604.03.\n\n**Aircraft examples / Exemples d'avions:** Illustrations only, not assigned CAR categories: operator certificate/authorization, certified passenger seating and mission control applicability. PA-30 private multi-engine, PA-46 Malibu private pressurized piston, C208 private turbine, CJ3 private jet **or** 704 authorized turbojet; DHC-6 19-seat commuter or fewer-seat variants/other authorized operations. / Exemples indicatifs seulement : certificat d'exploitation, capacité passagers homologuée et mission prévalent; un même type peut relever de plusieurs sous-parties selon l'exploitation.\n\n**Aircraft classification / Classement des aéronefs:** MCTOW = maximum certificated takeoff weight / masse maximale homologuée au décollage (MMHD). MZFW = maximum zero fuel weight / masse maximale sans carburant. **704 turbojet uses MZFW, not MCTOW.** Seating limits exclude pilot seats except where the rule expressly uses type-certificate passenger authorization; 702 aerial work and 604 private operations are defined by purpose/equipment, not one shared seat cut-off. §604.02 applicability is broader than §604.03 registration. Ministerial 703/704/705 authorizations and helicopter-specific conditions may apply. / **704 turboréacteur : masse maxi sans carburant, non masse au décollage.**","p":["CPL"],"e":["CPL"]},{"id":"LAW-123","card":"LAW","f":"kb/law/type-ratings-ppc-cc-crew-seats.md","h":"703 single-pilot IFR with passengers / IFR monopilote avec passagers — STD 723.86","a":"703-single-pilot-ifr-with-passengers--ifr-monopilote-avec-passagers--std-72386","c":["law-type","law-commercial"],"kd":"knowledge","u":"q17-703-single-pilot-ifr-passengers-ifr-monopilo","md":"**Authorized exception to two-pilot IFR / Dispense autorisée de copilote IFR.** In addition to 703 ME PIC **PPC 12 mo**, the PIC needs **1,000 h total**, **100 h ME if operating ME**, **50 h simulated or actual flight in IMC**, **50 h on aeroplane type**. PPC must assess single-pilot procedures including autopilot; for pressurized aeroplanes, **FL250 maximum**. These thresholds do **not** apply to every 703 flight. / En plus du **PPC CDB multimoteur 12 mois** : **1 000 h total**, **100 h multimoteur si appareil ME**, **50 h de vol en IMC réel ou simulé**, **50 h sur type**; PPC monopilote et procédures pilote automatique; avion pressurisé **FL250 max**. **Pas** un minimum universel pour tous les vols 703.\n\n**M:** `703 SP-IFR PAX = 1000 TT / 100 ME / 50 IMC / 50 TYPE + PPC`. [CASS 723.86](https://tc.canada.ca/en/corporate-services/acts-regulations/list-regulations/canadian-aviation-regulations-sor-96-433/standards/standard-723-air-taxi-aeroplanes-canadian-aviation-regulations-cars)","p":["CPL"],"e":["CPL"]},{"id":"LAW-124","card":"LAW","f":"kb/law/type-ratings-ppc-cc-crew-seats.md","h":"Operator-check exam traps / Pièges d’examen","a":"operator-check-exam-traps--pièges-dexamen","c":["law-type"],"kd":"trap","u":"q17-exam-traps-pi-ges-d-examen","md":"| Label | English | Français |\n|---|---|---|\n| Licence ≠ operator check ≠ type | Holding CPL/ME/IR does not itself authorize Part VII PIC; PPC/CC, training and operational eligibility are separate. | CPL/multimoteur/IFR ne suffisent pas : contrôle PPC/VC, formation et exigences d'exploitation sont distincts. |\n| 604 clock vs accepted check | 604 check is normally 24 mo; an accepted external PPC/CC must still be valid under the equivalency conditions. | Contrôle 604 normalement 24 mois; PPC/VC externe reconnu doit rester valide selon l'équivalence. |\n| 703 SE special case | 703.22(2) single-engine passenger IFR/night VFR changes the PIC CC to PPC; night VFR carrying non-crew also invokes IR requirement. | Sous 703.22(2), le contrôle CDB passe de VC à PPC; VFR de nuit avec non-équipage exige aussi IFR. |\n| 702 IFR non-crew | 702 IFR with a non-flight-crew person on board requires PPC even where the general chief-pilot exception applies. | 702 IFR avec personne hors équipage de conduite : PPC malgré l'exception générale du chef pilote. |\n| ATPL and two-crew PIC | CPL can qualify for certain single-pilot aeroplane PIC roles; ATPL is needed as PIC of a commercial two-crew aeroplane. | CPL permet certains postes CDB sur avion monopilote; ATPL requis comme CDB commercial d'un avion à deux pilotes. |\n| PPC vs IR currency | A qualifying PPC can satisfy CAR 401.05(3) only if it includes required instrument procedures; check separate approach recency. | Un PPC admissible satisfait 401.05(3) uniquement avec procédures IFR requises; récence des approches distincte. |","p":[],"ph":["CPL","IR"]},{"id":"LAW-125","card":"LAW","f":"kb/law/type-ratings-ppc-cc-crew-seats.md","h":"Sources · operator checks","a":"sources--operator-checks","c":["law-type"],"kd":"source","u":"q17-sources-sources","md":"- [Air Tractor AT-502B agricultural aircraft](https://airtractor.com/aircraft/)\n- [De Havilland Twin Otter 19-seat specifications](https://dehavilland.com/twin-otter/)\n- [Textron Cessna Citation CJ3 (MZFW / occupancy)](https://cessna.txtav.com/citation/cj3-gen3)\n- [ATR 42 / ATR 72 manufacturer specification](https://www.atr-aircraft.com/regional-mobility/regional-aircraft/)\n- [Piper PA-46 Malibu POH (pressurization)](https://www.aeroelectric.com/Reference_Docs/Piper/PiperMalibu_PA46-310_SN4608008-140.pdf)\n\n- [CAR 101.01 — large aeroplane](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-101.01.html)\n- [CAR 604.02 — private scope](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.02.html)\n- [CAR 604.03 — private registration](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.03.html)\n- [CAR 702.01 — aerial work](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.01.html)\n- [CAR 703.01 — air taxi](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-703.01.html)\n- [CAR 704.01 — commuter](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-704.01.html)\n- [CAR 705.01 — airline](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-705.01.html)\n\n\n- [401.05](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-401.05.html)\n- [404.04](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-404.04.html)\n- [401.30–401.34](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/)\n- [421.40 / 421.46](https://tc.canada.ca/en/corporate-services/acts-regulations/list-regulations/canadian-aviation-regulations-sor-96-433/standards/standard-421-flight-crew-permits-licences-ratings-canadian-aviation-regulations-cars)\n- [604.139–604.143](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.139.html)\n- [702.65 / 702.67](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-702.65.html)\n- [703.88 / 703.91](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-703.88.html)\n- [704.108 / 704.111](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-704.108.html)\n- [705.106 / 705.113](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-705.106.html)\n- [TC AIM 2026-2 LRA 1.7–1.12](https://tc.canada.ca/en/aviation/publications/transport-canada-aeronautical-information-manual-tc-aim)\n\n**Scope:** Aeroplanes and common operator cases; not exhaustive of aircraft-specific Ops Specs, type endorsements, special authorizations, alternative checks, helicopter rules, privileges and experience credits. Revalidate for operational decisions. / **Portée :** avions, cas usuels; vérifier spécifications d'exploitation, qualifications de type, autorisations, contrôles alternatifs et crédits d'expérience.","p":[],"ph":["CPL","IR"]},{"id":"LAW-126","card":"LAW","f":"kb/law/type-ratings-ppc-cc-crew-seats.md","h":"Pebble","a":"pebble","c":["law-type"],"kd":"pebble","u":"law-type-ratings-ppc-cc-crew-seats-pebble","md":"- TYPE `blanket: single-pilot non-high-performance | HP: single-pilot AND VNE ≥250 KIAS OR VSO ≥80 KIAS | complex ≠ HP | HP individual type: ≥200 h + qualifying flight within 12 mo`\n- TWO-CREW `≥250 h (or integrated ATP(A) course) | IATRA ≥70% within 24 mo, or SAMRA + SARON | PPC within 12 mo before application | three clocks: IATRA 24 mo / PPC 12 mo / operational PPC currency | type endorsement ≠ operator authorization`\n- OPERATOR CHECKS `PPL45 → CPL200 → ATPL1500 | IR 50 XC PIC / 40 inst | HP type200 / 2crew type250 + IATRA/SAMRA-SARON | 604 CC24 / ground12 | 702 CC12 or PPC24 (IFR + non-crew PPC) | 703 SE PIC CC12*; ME PIC PPC12; ME SIC PPC/CC12 | 704 PPC12 | 705 PPC6 (exceptions) | general 5y/24m/6m | IFR 24m + 6 approaches/6m after month6`.","p":["PPL","CPL"]},{"id":"ME-0","card":"ME","f":"kb/me/engine-failure-procedures-multi-engine.md","h":"Engine failure flow — generic","a":"engine-failure-flow--generic","c":["me-fail","emg-engine"],"kd":"knowledge","u":"me-engine-failure-flow-generic","md":"- `P:` MAINTAIN CONTROL → POWER AS REQ → PITCH `Vyse/Vxse` → GEAR/FLAPS UP as appropriate → IDENTIFY → VERIFY → FEATHER → SECURE → CHECKLIST → PLAN.\n- `M:` Control–Config–Identify–Verify–Feather–Secure–Checklist.\n- `T:` in critical phase, memory items first; full checklist only after control and drag clean-up.\n- `T:` do not rush feather below safe altitude if procedure/aircraft/training says simulate only.","p":["ME"]},{"id":"ME-1","card":"ME","f":"kb/me/engine-failure-procedures-multi-engine.md","h":"Engine failure on takeoff / overshoot","a":"engine-failure-on-takeoff--overshoot","c":["me-fail","emg-engine"],"kd":"knowledge","u":"me-engine-failure-on-takeoff-overshoot","md":"- `P:` recognize → control → power/config/drag in proper order → identify/verify → bank good engine → maintain heading ± practical → positive climb if capable → `Vxse` obstacle or `Vyse` rate → trim.\n- TC test tolerances: heading control within about `±20°`; speed `Vxse/Vyse +10/-5` for overshoot scenario.\n- `T:` gear/flap movement during power change is high workload; control first.\n- `T:` OEI go-around may not climb. If not climbing, land under control.","p":["ME"]},{"id":"ME-2","card":"ME","f":"kb/me/engine-failure-procedures-multi-engine.md","h":"Engine failure in cruise","a":"engine-failure-in-cruise","c":["me-fail","emg-engine"],"kd":"knowledge","u":"me-engine-failure-in-cruise","md":"- `P:` control → maintain heading/alt if capable → set power/config → identify/verify → cause checks → feather/secure if no restart → trim → evaluate restart/divert.\n- Turns OEI: bank not >`30°` in TC test context; use appropriate pitch/bank/trim.\n- `T:` trying to hold altitude below OEI capability causes speed decay to Vmc/stall. Descend if required.","p":["IR","ME"]},{"id":"ME-3","card":"ME","f":"kb/me/engine-failure-procedures-multi-engine.md","h":"Precautionary shutdown","a":"precautionary-shutdown","c":["me-fail","emg-engine"],"kd":"knowledge","u":"me-precautionary-shutdown","md":"- Reasons: oil pressure loss, severe vibration, fire risk, runaway prop, uncontrollable temps/pressures.\n- `P:` confirm need → stabilize → identify/verify affected engine → reduce power → feather/secure per checklist → monitor live engine → divert/land.\n- `T:` not every roughness = immediate shutdown; not every problem can wait. Decide by fire/mechanical damage/controllability.","p":["ME"]},{"id":"ME-4","card":"ME","f":"kb/me/engine-failure-procedures-multi-engine.md","h":"PROP governor / feather — L4 cross-ref","a":"prop-governor--feather--l4-cross-ref","c":["me-fail","agk-prop"],"kd":"knowledge","u":"me-prop-governor-feather-l4-cross-ref","md":"- `M` Typical **piston SE CS non-feather**: governor oil P↑→COARSE/pitch↑→RPM↓ | **piston ME CS full-feather**: oil P↑→FINE/pitch↓→RPM↑; oil P↓→counterweights/springs→FEATHER; **architecture varies**.\n- `T` FINE low blade angle ≠ low RPM: low angle→RPM tendency↑ | COARSE high angle→RPM tendency↓ | FEATHER near airflow→drag↓; REVERSE negative thrust (ground only if approved).\n- `!` OEI: windmilling low-pitch PROP→drag↑/climb↓ | **IDENTIFY→VERIFY→FEATHER** per POH; feather locks, unfeather pumps, accumulators ACFT-specific.\n- `SRC:` [FAA AFH · ME propeller](https://www.faasafety.gov/files/events/SO/SO15/2022/SO15118118/TransitionToMultiengineAirplanes.pdf) | [08 Aircraft Systems · Powerplant / PROP](../../cheatsheets/08_aircraft_systems_failures_qrc_av_cave_v0_2_compact.md).","p":["ME"]},{"id":"ME-5","card":"ME","f":"kb/me/engine-failure-procedures-multi-engine.md","h":"Restart / unfeather","a":"restart--unfeather","c":["me-fail","agk-prop"],"kd":"knowledge","u":"me-restart-unfeather","md":"- `P:` assess altitude/time/fire/damage/prop status/fuel/electrical. If feasible: restart checklist; if not: leave secured and land.\n- `T:` restarting a damaged/fire engine can make problem worse. checklist and scenario drive.","p":["ME"]},{"id":"ME-6","card":"ME","f":"kb/me/engine-failure-procedures-multi-engine.md","h":"OEI approach / landing","a":"oei-approach--landing","c":["me-fail"],"kd":"knowledge","u":"me-oei-approach-landing","md":"- `P:` brief long final, avoid rushed configuration, maintain `Vyse` or POH speed until landing assured, configure late/controlled, anticipate asymmetric power.\n- Gear/flap only when landing assured unless procedure says otherwise. Power changes gradual; trim cautiously.\n- `T:` full flap/gear early can remove climb escape. OEI go-around may be unavailable.\n- `M:` stable > pretty. no salvage below minima/unstable.","p":["ME"]},{"id":"ME-7","card":"ME","f":"kb/me/engine-failure-procedures-multi-engine.md","h":"OEI missed / go-around","a":"oei-missed--go-around","c":["me-fail","ifr-missed"],"kd":"knowledge","u":"me-oei-missed-go-around","md":"- `P:` max allowable power live engine → control yaw/bank → pitch `Vyse/Vxse` → drag up in sequence → verify failed engine secure/feathered → trim.\n- `T:` if unable climb, lower nose and land ahead/within available area. Do not pull below `Vyse` toward `Vmc`.\n- `T:` high power + low speed + dirty config = Vmc trap.","p":["ME"]},{"id":"ME-8","card":"ME","f":"kb/me/engine-failure-procedures-multi-engine.md","h":"Pebble","a":"pebble","c":["me-fail"],"kd":"pebble","u":"me-engine-failure-procedures-multi-engine-pebble","md":"- FLOW `Control–Config–Identify–Verify–Feather–Secure–Checklist | dead foot = dead engine | identify before verify; verify before feather | control first, checklist second | clean + feather + blue line`\n- OEI `pitch Vyse/Vxse | bank toward good engine | cannot climb → land under control; do not pull below Vyse toward Vmc | high power + low speed + dirty = Vmc trap | gear/flap only when landing assured | OEI go-around may be unavailable`\n- PROP `piston ME full-feather: oil pressure↑ → fine/RPM↑; oil loss → feather; architecture varies | windmilling drag↑, feather drag↓ | restarting a damaged/fire engine can make it worse`","p":["IR","ME"]},{"id":"ME-9","card":"ME","f":"kb/me/me-training-systems-flight-test.md","h":"ME rating frame","a":"me-rating-frame","c":["me-train"],"kd":"knowledge","u":"ref-source-rating-frame-c13","md":"- `SRC:` CAR/STD 421.38 = rating skill requirement; TP 219E = TC flight-test guide; POH/AFM/SOP wins aircraft-specific speeds/procedures.\n- Canada ME class rating: applicant completes flight test as PIC of multi-engine class aeroplane per Standard 428 Schedule 7.\n- `T:` ME rating ≠ Group 1 IFR. ME class lets you fly multi-engine class aeroplanes VFR/IFR only if licence/rating/equipment/recency/ops rules allow.","p":[],"ph":["ME"]},{"id":"ME-10","card":"ME","f":"kb/me/me-training-systems-flight-test.md","h":"Stall / slow flight ME","a":"stall--slow-flight-me","c":["me-train","agk-stall"],"kd":"knowledge","u":"me-stall-slow-flight-me","md":"- Slow flight near Vmc/VS margins with asymmetry is dangerous. Maintain coordination, power awareness, safe altitude.\n- Stall recovery: reduce AoA, manage asymmetry, power as appropriate, avoid yaw.\n- `T:` power-on stall with one engine/thrust asymmetry can roll/yaw aggressively.","p":["PPL","CPL","ME"],"e":["PPL"]},{"id":"ME-11","card":"ME","f":"kb/me/me-training-systems-flight-test.md","h":"Systems focus for ME","a":"systems-focus-for-me","c":["me-train","agk-systems"],"kd":"knowledge","u":"me-systems-focus-for-me","md":"- Prop governors/feathering/unfeathering: oil pressure, accumulators/unfeather pumps depending aircraft.\n- Fuel: selectors/crossfeed/aux pumps/boost pumps; know which positions are allowed for takeoff/landing.\n- Electrical: two alternators? bus logic? battery endurance? gear/flap dependence?\n- Vacuum/pressure: source from one/both engines? failure effect after engine shutdown?\n- Hydraulics/gear: extension/retraction speed, emergency extension, gear warning.\n- `T:` engine shutdown may remove systems powered by that engine.","p":["PPL","CPL","ME"]},{"id":"ME-12","card":"ME","f":"kb/me/me-training-systems-flight-test.md","h":"Flight test mindset","a":"flight-test-mindset","c":["me-train"],"kd":"trap","u":"me-flight-test-mindset","md":"- TC test wants PIC-level control, memory vital actions, checklist discipline, POH knowledge, and decision-making.\n- Essential speeds from memory. Charts and performance from approved data.\n- `T:` examiner is testing whether you know when not to continue as much as whether you can keep it flying.","p":[],"ph":["ME"]},{"id":"ME-13","card":"ME","f":"kb/me/me-training-systems-flight-test.md","h":"Pebble","a":"pebble","c":["me-train"],"kd":"pebble","u":"me-me-training-systems-flight-test-pebble","md":"- RATING `ME class rating = flight test as PIC, Std 428 Schedule 7 (CAR/Std 421.38; TP 219E) | ME rating ≠ Group 1 IFR`\n- SYSTEMS `engine shutdown may remove systems powered by that engine: electrical, vacuum, hydraulics | know fuel selector/crossfeed positions allowed for takeoff/landing`\n- TEST `essential speeds from memory; performance from approved data | asymmetric power-on stall can roll/yaw aggressively: reduce AoA, manage asymmetry`","p":["PPL","CPL","ME"]},{"id":"ME-14","card":"ME","f":"kb/me/oei-performance-takeoff-planning.md","h":"Essential speeds to know cold","a":"essential-speeds-to-know-cold","c":["me-oei","agk-vspeeds"],"kd":"knowledge","u":"me-essential-speeds-to-know-cold","md":"| Symbol | Meaning |\n|---|---|\n| `Vmc` | min control speed airborne, critical engine failed |\n| `Vsse` | safe intentional OEI speed; if POH none, TC guide says use `Vmc+10` |\n| `Vyse` | OEI best rate-of-climb speed, blue line |\n| `Vxse` | OEI best angle-of-climb speed |\n| `Vs0` | stall speed landing config |\n| `Va` | manoeuvring speed |\n| `Vle` | max gear extended |\n| `Vlo` | max gear operating |\n| `Vfe` | max flap extended |\n\n- `T:` quote aircraft numbers from memory for test; all other performance from POH/AFM charts.","p":["PPL","CPL","ME"],"e":["PPL","CPL"]},{"id":"ME-15","card":"ME","f":"kb/me/oei-performance-takeoff-planning.md","h":"OEI climb","a":"oei-climb","c":["me-oei","agk-perfcalc"],"kd":"knowledge","u":"me-oei-climb","md":"- `Vyse` = best rate; `Vxse` = best angle. Use obstacle vs rate logic.\n- `T:` positive climb may be zero or negative depending weight/DA/config/failed engine/prop/surface.\n- POH required: OEI ROC, single-engine service ceiling, accelerate-stop/go if available, climb gradients.\n- `M:` ME safety comes from precomputed options, not heroic rudder.","p":["ME"]},{"id":"ME-16","card":"ME","f":"kb/me/oei-performance-takeoff-planning.md","h":"Accelerate-stop / accelerate-go","a":"accelerate-stop--accelerate-go","c":["me-oei","agk-perfcalc"],"kd":"knowledge","u":"me-accelerate-stop-accelerate-go","md":"- Accelerate-stop = accelerate to decision/engine-failure speed, reject, stop.\n- Accelerate-go = accelerate to failure speed, continue takeoff, climb/clear obstacle OEI.\n- Light twins often have long or unavailable accelerate-go margins at normal training weights/DA.\n- `T:` balanced field/V1 thinking from transport category does not automatically apply to light twins.\n- `P pre-TKOF brief:` below reject speed/runway remaining → stop; after liftoff/gear up/no runway → control, clean, climb if able, land ahead/nearby if not.","p":["ME"]},{"id":"ME-17","card":"ME","f":"kb/me/oei-performance-takeoff-planning.md","h":"TKOF speeds · transport-category distinctions — L4","a":"tkof-speeds--transport-category-distinctions--l4","c":["me-oei","agk-vspeeds"],"kd":"knowledge","u":"me-tkof-speeds-transport-category-distinctions-l4","md":"| Key | Recall |\n|---|---|\n| `V1` | Reject/continue boundary; first reject action **by V1** to satisfy applicable accelerate-stop limits. |\n| `VR` | Rotation speed → initiate nose-up rotation. |\n| `V2` | TKOF safety speed → **OEI = One Engine Inoperative** climb/control margins; **≠ braking speed**. |\n| `Vtire` | Maximum certificated **tire groundspeed** during TKOF roll; may limit max TKOF GW. |\n| `T` | V1 depends on GW/ENG accel, RWY, wind, conditions/config; transport-category V1/V2 concepts **not automatically applicable to light twins**; AFM/POH wins. |\n\n- `SRC:` [FAA AFH Ch 16 · takeoff speeds/accelerate-stop](https://www.faa.gov/sites/faa.gov/files/regulations_policies/handbooks_manuals/aviation/airplane_handbook/17_afh_ch16.pdf).\n- `M · L4` **V1=reject/continue (accelerate-stop) | VR=rotate | V2=OEI safety/climb | Vtire=max tire GS | GW/RWY/conditions affect V1 | light twin ≠ automatic transport-category V-speeds | AFM wins.**","p":[],"ph":["CPL","ME"]},{"id":"ME-18","card":"ME","f":"kb/me/oei-performance-takeoff-planning.md","h":"Takeoff briefing — ME","a":"takeoff-briefing--me","c":["me-oei"],"kd":"knowledge","u":"me-takeoff-briefing-me","md":"- `P:` runway/length/wind/DA/perf → rotate speed → `Vmc/Vyse/Vsse` → reject criteria → EF before liftoff → EF after liftoff with runway → EF airborne no runway → emergency return/straight-ahead plan.\n- `M:` before power: “what kills us today?” runway, weight, DA, obstacles, weather, traffic.\n- `T:` “continue no matter what” is wrong; “stop no matter what” is also wrong. runway remaining + energy + control decide.","p":["ME"]},{"id":"ME-19","card":"ME","f":"kb/me/oei-performance-takeoff-planning.md","h":"Performance calculations required","a":"performance-calculations-required","c":["me-oei","agk-perfcalc"],"kd":"knowledge","u":"me-performance-calculations-required","md":"- Takeoff distance / obstacle. Accelerate-stop if available. Accelerate-go if available. Time/fuel to climb. Cruise power/KTAS/fuel. Landing distance. OEI ROC. OEI enroute performance.\n- `T:` use actual weight, temp, pressure altitude, runway, wind, obstacle, configuration. Training “it climbs” assumption is unsafe.\n- `M:` compare before flight: all-engine climb, OEI climb, terrain/obstacle, nearest runway/return.","p":["ME"]},{"id":"ME-20","card":"ME","f":"kb/me/oei-performance-takeoff-planning.md","h":"W&B ME traps","a":"wb-me-traps","c":["me-oei","agk-wb"],"kd":"trap","u":"me-w-b-me-traps","md":"- Multi-engine aircraft often have narrow CG/fuel/baggage constraints. Check takeoff, landing, zero-fuel if relevant.\n- Aft CG worsens Vmc/control. Light weight can worsen Vmc but improves climb; heavy weight may improve Vmc but destroy climb.\n- `T:` Vmc certification worst case is light/aft; performance worst case is heavy/hot/high/dirty.","p":["PPL","CPL","ME"],"e":["PPL"]},{"id":"ME-21","card":"ME","f":"kb/me/oei-performance-takeoff-planning.md","h":"Pebble","a":"pebble","c":["me-oei"],"kd":"pebble","u":"me-oei-performance-takeoff-planning-pebble","md":"- SPEEDS `Vmc = min control speed, critical engine failed (red line) | Vsse = safe intentional OEI; Vmc + 10 if POH none | Vyse = OEI best rate, blue line | Vxse = OEI best angle`\n- OEI CLIMB `may be zero or negative | single-engine service ceiling may be below terrain | above Vmc ≠ climb`\n- TAKEOFF `accelerate-stop = accelerate, reject, stop | accelerate-go = continue and clear obstacle OEI | V1/V2 transport-category concepts ≠ automatic for light twins; AFM wins | brief: stop below reject speed/runway remaining; airborne no runway → control, clean, climb if able, land ahead if not`\n- W&B `Vmc worst case light/aft; performance worst case heavy/hot/high/dirty`","p":["PPL","CPL","ME"]},{"id":"ME-22","card":"ME","f":"kb/me/vmc-asymmetric-thrust-critical-engine.md","h":"Core ME physics","a":"core-me-physics","c":["me-vmc"],"kd":"knowledge","u":"me-core-me-physics","md":"- Two engines = thrust + yaw + roll problem after failure, not “half a single-engine airplane.”\n- Failed engine side: thrust↓ + drag↑. Operating engine creates yaw toward failed engine.\n- `T:` asymmetry increases with power on live engine, low speed, high AoA, aft CG, low weight, windmilling prop, gear/flaps drag.\n- `M:` CONTROL before CHECKLIST; drag reduction before diagnosis obsession.","p":["ME"]},{"id":"ME-23","card":"ME","f":"kb/me/vmc-asymmetric-thrust-critical-engine.md","h":"Critical engine","a":"critical-engine","c":["me-vmc"],"kd":"knowledge","u":"me-critical-engine","md":"- Critical engine = engine whose failure most adversely affects performance/handling.\n- Conventional clockwise props viewed from cockpit: left engine often critical.\n- Why: `P-factor` + accelerated slipstream + spiraling slipstream + torque effects usually make left-engine failure worse.\n- `M:` left failed = right engine thrust line farther from CG ⇒ larger yaw arm.\n- `T:` counter-rotating twins may have no “more critical” engine; aircraft-specific.","p":["PPL","CPL","ME"]},{"id":"ME-24","card":"ME","f":"kb/me/vmc-asymmetric-thrust-critical-engine.md","h":"Vmc definition / certification memory","a":"vmc-definition--certification-memory","c":["me-vmc"],"kd":"knowledge","u":"me-vmc-definition-certification-memory","md":"- `Vmc:` minimum flight speed where straight flight/control possible after sudden critical-engine failure with max rudder and ≤`5°` bank.\n- TC guide conditions: max rated power on engines at failure, min practical test weight, rearmost CG, gear retracted, flaps takeoff, failed critical prop windmilling.\n- Below `Vmc`: yaw/roll toward failed engine; regain by reducing live-engine power, increasing airspeed by lowering pitch, or both.\n- `T:` `Vmc` is a control speed, not a climb speed. Above Vmc does not mean climb possible.","p":["ME"]},{"id":"ME-25","card":"ME","f":"kb/me/vmc-asymmetric-thrust-critical-engine.md","h":"Vmc factors","a":"vmc-factors","c":["me-vmc"],"kd":"knowledge","u":"me-vmc-factors","md":"| Factor | Vmc effect |\n|---|---|\n| live engine power ↑ | `Vmc ↑` |\n| density altitude ↑ / power ↓ | `Vmc ↓` but performance worse |\n| aft CG | `Vmc ↑` |\n| lower weight | `Vmc ↑` |\n| gear/flap down | often `Vmc ↓` due drag/stability, but performance worse |\n| windmilling failed prop | yaw/drag ↑, performance worse |\n| bank into live engine | `Vmc ↓`, performance ↑ |\n\n- `T:` high DA may lower Vmc but makes OEI climb worse. “control easier” while performance gone.","p":["ME"]},{"id":"ME-26","card":"ME","f":"kb/me/vmc-asymmetric-thrust-critical-engine.md","h":"Zero sideslip / best OEI performance","a":"zero-sideslip--best-oei-performance","c":["me-vmc"],"kd":"knowledge","u":"me-zero-sideslip-best-oei-performance","md":"- Best OEI performance usually: slight bank toward operating engine + ball slightly displaced toward live engine / aircraft-specific.\n- Common memory: `2–5°` bank toward good engine, rudder to stop yaw, trim.\n- `M:` bank into good engine reduces rudder drag; level wings often requires lots of rudder and creates sideslip/drag.\n- `T:` centre the ball blindly? not always best; use POH/AFM and instructor method.","p":["ME"]},{"id":"ME-27","card":"ME","f":"kb/me/vmc-asymmetric-thrust-critical-engine.md","h":"Dead foot / dead engine","a":"dead-foot--dead-engine","c":["me-vmc","me-fail"],"kd":"knowledge","u":"me-dead-foot-dead-engine","md":"- Failure recognition: yaw/roll/noise/power instruments.\n- `M:` dead foot = dead engine. Foot not pressing = failed side.\n- Identify: mixture/prop/throttle or power lever suspected engine. Verify: reduce suspected throttle/power; no change confirms failed engine. Then feather/shutdown per checklist.\n- `T:` never feather until verified. Wrong feather can make a bad day unrecoverable.","p":["ME"]},{"id":"ME-28","card":"ME","f":"kb/me/vmc-asymmetric-thrust-critical-engine.md","h":"Drag hierarchy","a":"drag-hierarchy","c":["me-vmc"],"kd":"knowledge","u":"me-drag-hierarchy","md":"- Worst drag: windmilling prop. Then gear, flaps, cowl flaps, sideslip, excessive bank/trim.\n- `M:` clean + feather + blue line.\n- `P:` gear up after positive climb/no runway; flaps up in stages as POH; prop feather after verify; cowl flaps as required.\n- `T:` unfeathered failed prop can erase climb performance.","p":[],"ph":["ME"]},{"id":"ME-29","card":"ME","f":"kb/me/vmc-asymmetric-thrust-critical-engine.md","h":"Vmc demo / reduced-speed training","a":"vmc-demo--reduced-speed-training","c":["me-vmc","me-train"],"kd":"knowledge","u":"me-vmc-demo-reduced-speed-training","md":"- Setup per POH/instructor/test guide; safe altitude; clearing; no real hazard; recover at first sign of loss of directional control/stall buffet/warning or prebriefed minimum.\n- Recovery: reduce live-engine power enough to regain control + lower pitch/increase speed + wings/bank controlled.\n- `T:` wrong instinct = add power/pull. Correct = reduce asymmetric thrust and increase airspeed.\n- `T:` Vmc demo is not a macho manoeuvre; it is recognition and immediate recovery.","p":["ME"]},{"id":"ME-30","card":"ME","f":"kb/me/vmc-asymmetric-thrust-critical-engine.md","h":"Pebble","a":"pebble","c":["me-vmc"],"kd":"pebble","u":"me-vmc-asymmetric-thrust-critical-engine-pebble","md":"- VMC `control speed with critical engine failed, max rudder, ≤5° bank | conditions: max power, min weight, rearmost CG, gear up, takeoff flap, failed prop windmilling | control speed, not climb speed | below Vmc: reduce live-engine power + lower nose`\n- FACTORS `Vmc↑: live power↑, aft CG, lower weight | Vmc↓: high DA (performance worse), bank into live engine | critical engine: usually left on conventional clockwise props (P-factor, slipstream, torque); counter-rotating may have none`\n- ZERO SIDESLIP `≈2–5° bank toward good engine, rudder to stop yaw, per POH | drag: windmilling prop worst, then gear, flaps, cowl flaps, sideslip`","p":["PPL","CPL","ME"]},{"id":"NAV-0","card":"NAV","f":"kb/nav/gnss-rnav.md","h":"RNAV / GNSS","a":"rnav--gnss","c":["nav-gnss","ifr-app-fly"],"kd":"knowledge","u":"ifr-rnav-gnss","md":"- Verify database current, correct airport/runway/procedure/transition, RAIM/WAAS, mode/sensitivity, OBS/SUSP, missed approach sequencing.\n- CDI sensitivity: enroute → terminal → approach; ensure unit arms/activates correct mode.\n- Alternate planning with GNSS: verify availability/integrity and current Canadian rules; ground NAVAID fallback may be required depending equipment/approval.\n- Alternate with satellite approach: verify expected RAIM/WAAS integrity at ETA; destination+alternate satellite-use separation rules may apply.\n- `T:` “direct-to FAF” may delete procedure sequencing/protection. `OBS/SUSP` misuse is an INRAT classic.\n- `T:` “GPS direct” ≠ cleared route unless ATC cleared.","p":["CPL","IR"],"e":["CPL"]},{"id":"NAV-1","card":"NAV","f":"kb/nav/gnss-rnav.md","h":"GNSS / RNAV plate traps","a":"gnss--rnav-plate-traps","c":["nav-gnss","ifr-app-fly","ifr-plates"],"kd":"trap","u":"plate-gnss-rnav-plate-traps","md":"- Verify database current, correct airport/runway/procedure/transition, approach mode armed/active, RAIM/WAAS, CDI sensitivity, OBS/SUSP.\n- Do not use expired database for IFR approach unless explicitly permitted/verified by approved procedure and data.\n- `T:` `Direct-To FAF` can destroy sequencing; missed approach may not auto-sequence until SUSP cancelled correctly.","p":["IR"]},{"id":"NAV-2","card":"NAV","f":"kb/nav/gnss-rnav.md","h":"GNSS principles — AIM COM 5","a":"gnss-principles--aim-com-5","c":["nav-gnss"],"kd":"knowledge","u":"nav-gnss-principles-com-5","md":"- GNSS = worldwide position + time: satellites + aircraft receivers + integrity monitoring. [COM 5.1]\n- Space: GPS design 24 satellites, 6 planes × 4. Control: USAF centre + global monitor/uplink stations. User: receiver computes position. [COM 5.2.1]\n- Position: time-of-arrival → pseudoranges; **4** needed for 3-D position + clock. [COM 5.2.1]\n- **RAIM** ≥5 satellites (detect); **FDE** ≥6 (exclude). [COM 5.3.1]\n- **WAAS** (SBAS): ground stations → corrections + integrity via geostationary satellites; enables vertical guidance (LPV). [COM 5.3.2]\n- `M:` `4 FIX · 5 DETECT · 6 EXCLUDE`.","p":["IR"]},{"id":"NAV-3","card":"NAV","f":"kb/nav/gnss-rnav.md","h":"T-routes","a":"t-routes","c":["nav-gnss"],"kd":"knowledge","u":"nav-t-routes-rnav","md":"- T-route = **low-level controlled fixed RNAV route**. Obstacle protection 4 NM primary + 2 NM secondary each side; associated airspace **10 NM** each side; **no splay** (unlike VOR/NDB airways).\n- `?:` T-route equipment/GNSS requirements not read for this note: check RAC 2.7.1(c) and the CFS before flight planning.\n\n- Sources: [TC AIM RAC](https://tc.canada.ca/sites/default/files/2026-10/aim-2026-2_rac_en.pdf) 2.7.1(c).","p":["CPL"]},{"id":"NAV-4","card":"NAV","f":"kb/nav/headings-true-magnetic-compass.md","h":"True / magnetic / compass","a":"true--magnetic--compass","c":["nav-compass"],"kd":"formula","u":"nav-true-magnetic-compass","md":"- `F:` `TC ± WCA = TH`; `TH ± variation = MH`; `MH ± deviation = CH`.\n- Alternatively convert TC→MC, then apply WCA to obtain MH before deviation. Never substitute magnetic course for magnetic heading.\n- `M:` true→mag: east is least, west is best.\n- `M:` TVMDC = True Virgins Make Dull Company; reverse = Can Dead Men Vote Twice.\n- `T:` track/course/heading/bearing are different. Track = ground path; heading = nose. Bearing = direction to object; course = planned line.","p":["PPL","CPL"],"e":["PPL"]},{"id":"NAV-5","card":"NAV","f":"kb/nav/headings-true-magnetic-compass.md","h":"Magnetic compass","a":"magnetic-compass","c":["nav-compass"],"kd":"knowledge","u":"sys-magnetic-compass","md":"- Errors: variation/deviation, oscillation, acceleration/turning/dip.\n- Northern hemisphere: on east/west headings, acceleration causes a false north indication and deceleration a false south indication (`ANDS`); turning-error rollout memory is `UNOS`: undershoot north/overshoot south.\n- `T:` turbulence and turns make compass difficult; roll out using timed/lead technique.","p":["PPL","CPL"],"e":["PPL"]},{"id":"NAV-6","card":"NAV","f":"kb/nav/headings-true-magnetic-compass.md","h":"Magnetic compass — principle and use","a":"magnetic-compass--principle-and-use","c":["nav-compass","agk-inst"],"kd":"knowledge","u":"nav-magnetic-compass-principle-use","md":"- Float with two or more magnets aligns with Earth's field; case filled with kerosene damps oscillation; card tilts up to 18°. [TP 2076 2.1.4 B, D]\n- Dip: field lines ~parallel to surface near equator, steep near magnetic poles → dip errors. [2.1.4 C]\n- Errors: **deviation** (aircraft electrics, ferrous parts → swing compass, correction card) · **turning** (from north: card first shows turn the wrong way/lags; from south: leads; only while turning) · **acceleration** `ANDS` (most on E/W headings). Variation = chart, not instrument. [2.1.4 E]\n- Use: read only wings-level, steady, unaccelerated; let card settle a few seconds after roll-out; HI set from it. [2.1.4 F]\n- Lightning can induce permanent compass error. [AIM AIR 2.7.1]\n- Timed turns: rate one = 3°/s (180° per minute) when compass unreliable mid-turn. [TP 2076 2.1.3 D.3]","p":["IR"]},{"id":"NAV-7","card":"NAV","f":"kb/nav/headings-true-magnetic-compass.md","h":"Pebble","a":"pebble","c":["nav-compass"],"kd":"pebble","u":"nav-headings-true-magnetic-compass-pebble","md":"- HEADINGS `TC ± WCA = TH | TH ± variation = MH | MH ± deviation = CH | east is least, west is best | TVMDC | track = ground path, heading = nose, bearing = direction to object, course = planned line | never substitute magnetic course for magnetic heading`\n- COMPASS `read straight, level, unaccelerated | ANDS · UNOS | lightning may cause permanent error`","p":["PPL","CPL","IR"]},{"id":"NAV-8","card":"NAV","f":"kb/nav/pilot-navigation-dead-reckoning.md","h":"Time / speed / distance","a":"time--speed--distance","c":["nav-dr"],"kd":"formula","u":"nav-time-speed-distance","md":"- `F:` `distance = GS × time(hr)`.\n- `F:` `time(hr)=distance/GS`; `time(min)=distance/GS×60`.\n- `F:` `GS=distance/time(hr)`.\n- `M:` `120 kt = 2 NM/min`; `90 kt = 1.5 NM/min`; `60 kt = 1 NM/min`.\n- `T:` navigation timing uses `GS`, not IAS/TAS.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"NAV-9","card":"NAV","f":"kb/nav/pilot-navigation-dead-reckoning.md","h":"Quick ETE table","a":"quick-ete-table","c":["nav-dr"],"kd":"formula","u":"nav-quick-ete-table","md":"Distance in NM × fraction = ETE in minutes. Use GS, including wind.\n\n| GS | ETE fraction | Mental calculation | 10 NM | 30 NM | 60 NM |\n|---:|---:|---|---:|---:|---:|\n| 60 kt | ×1 | same number | 10 min | 30 min | 60 min |\n| 75 kt | ×4/5 | ÷5 ×4 | 8 min | 24 min | 48 min |\n| 90 kt | ×2/3 | ÷3 ×2 | 6 min 40 s | 20 min | 40 min |\n| 100 kt | ×3/5 | ÷5 ×3 | 6 min | 18 min | 36 min |\n| 120 kt | ×1/2 | ÷2 ×1 | 5 min | 15 min | 30 min |\n| 150 kt | ×2/5 | ÷5 ×2 | 4 min | 12 min | 24 min |\n| 180 kt | ×1/3 | ÷3 ×1 | 3 min 20 s | 10 min | 20 min |\n\n90 kt: two-thirds of the NM gives minutes. Decimal minutes are not minutes:seconds.","p":["PPL","CPL"]},{"id":"NAV-10","card":"NAV","f":"kb/nav/pilot-navigation-dead-reckoning.md","h":"Crosswind / headwind","a":"crosswind--headwind","c":["nav-dr"],"kd":"formula","u":"nav-crosswind-headwind","md":"- `F:` `headwind = wind speed × cos(angle)`.\n- `F:` `crosswind = wind speed × sin(angle)`.\n- `M:` `30° = 1/2 wind`; `45° ≈ 0.7 wind`; `60° ≈ 0.87 wind`; `90° = full wind`.\n- `M:` headwind component: `30°≈0.87`, `45°≈0.7`, `60°=0.5`, `90°=0`.\n- `T:` gusts matter. max demonstrated crosswind ≠ legal limit unless POH says; still operational limit/SOP/personal.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"NAV-11","card":"NAV","f":"kb/nav/pilot-navigation-dead-reckoning.md","h":"Wind correction / nav triangle","a":"wind-correction--nav-triangle","c":["nav-dr"],"kd":"formula","u":"nav-wind-correction-nav-triangle","md":"- `F exact idea:` WCA depends wind angle, wind speed, TAS.\n- `F rough:` `WCA° ≈ 60 × crosswind / TAS`, for small WCA, with wind components resolved relative to desired track. Exact: `sin(WCA) = crosswind/TAS`; use a flight computer for large corrections.\n- `F:` `heading = track ± WCA`.\n- `M:` wind from right blows left ⇒ crab right.\n- `T:` variation/deviation are separate from WCA.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"NAV-12","card":"NAV","f":"kb/nav/pilot-navigation-dead-reckoning.md","h":"1-in-60 rule","a":"1-in-60-rule","c":["nav-dr"],"kd":"formula","u":"nav-1-in-60-rule","md":"- `F:` `track error° ≈ offtrack × 60 / distance flown`.\n- `F:` `closing correction to destination° ≈ offtrack × 60 / distance remaining`.\n- `F:` total correction = track error + closing correction.\n- `M:` halfway off by 1 NM after 30 NM ⇒ error `2°`; if 30 NM left, add `2°`; total `4°`.\n- `T:` use distance flown for error; distance remaining for correction.\n- `T:` ETA uses actual GS. Double-track-error is a separate intercept technique, not a universal destination correction.","p":["PPL","CPL"],"e":["CPL"]},{"id":"NAV-13","card":"NAV","f":"kb/nav/pilot-navigation-dead-reckoning.md","h":"Coordinates / distance / map","a":"coordinates--distance--map","c":["nav-dr","nav-units"],"kd":"formula","u":"nav-coordinates-distance-map","md":"- `1° latitude = 60 NM`.\n- `1' latitude = 1 NM`.\n- Longitude distance = `60 NM × cos(latitude)` per degree.\n- `F:` map distance real = measured distance × scale.\n- `T:` longitude spacing shrinks toward poles.","p":["PPL","CPL"],"e":["PPL"]},{"id":"NAV-14","card":"NAV","f":"kb/nav/pilot-navigation-dead-reckoning.md","h":"Clocks / logbook","a":"clocks--logbook","c":["nav-dr","nav-units"],"kd":"formula","u":"nav-clocks-logbook","md":"- `0.1 hr = 6 min`; `0.2=12`; `0.3=18`; `0.4=24`; `0.5=30`; `0.6=36`; `0.7=42`; `0.8=48`; `0.9=54`.\n- `F:` decimal hours = minutes/60.\n- `T:` flight time / air time / block time / night time / instrument time are different records.","p":[],"ph":["PPL","CPL","IR"]},{"id":"NAV-15","card":"NAV","f":"kb/nav/pilot-navigation-dead-reckoning.md","h":"Diversion / lost","a":"diversion--lost","c":["nav-dr"],"kd":"knowledge","u":"nav-diversion-lost","md":"- Divert: decide early→dest→line feature→MTRK/dist/GS/ETA/fuel→terrain/airspace/wx→inform/advise.\n- Lost: climb safe→communicate→conserve→confess→comply.","p":["PPL","CPL"],"e":["PPL"]},{"id":"NAV-16","card":"NAV","f":"kb/nav/pilot-navigation-dead-reckoning.md","h":"EFB and PEDs — principles, power, distraction","a":"efb-and-peds--principles-power-distraction","c":["nav-dr"],"kd":"knowledge","u":"nav-efb-ped-principles-power-distraction","md":"- EFB = electronic display mainly for flight deck use: aviation data or calculations (performance, fuel). **Portable** EFB = PED, not part of ACFT type design; **installed** EFB = TC/STC approved.\n- Apps: **Type A** = no safety effect if failed (manuals, MEL, forms) · **Type B** = minor failure condition (AFM, charts, performance, checklists). Own-ship position = situational awareness only, not for navigation or taxi.\n- Power and backup: battery life and replacement interval known; charging from aircraft power via a certified source after load analysis; a way to de-power other than a circuit breaker. Plan for total/partial failure (redundant, ideally dissimilar EFB; crew procedures). Lithium battery: overheating → thermal runaway, smoke/fire → crew training + firefighting procedure.\n- Distraction: avoid multi-step data entry in TKOF, LDG and other critical phases · alerts inhibited in critical phases · mount within 90° of line of sight, no glare, not blocking controls/egress (suction cups can fail on decompression) · cables secured.\n- PEDs: intentional transmitters (phones, tablets, Bluetooth) and non-intentional (cameras, e-readers) can both interfere. **Airplane mode ≠ non-transmitting** unless transmitters are off. 5G C-band (3 450–3 900 MHz) near radio altimeter band (4 200–4 400 MHz).\n- `P` Suspected PED interference: identify users → stop use → prohibit → recheck systems → report (703/704/705 operators must report to TC).\n\n- Sources: [TC AC 700-020](https://tc.canada.ca/en/aviation/reference-centre/advisory-circulars/advisory-circular-ac-no-700-020); [TC AC 700-005](https://tc.canada.ca/sites/default/files/2023-08/ac_700-005_issue_04.pdf); CAR 602.08, 700.12.","p":["CPL"],"e":["CPL"]},{"id":"NAV-17","card":"NAV","f":"kb/nav/pilot-navigation-dead-reckoning.md","h":"Flight log (navigation log) form","a":"flight-log-navigation-log-form","c":["nav-dr"],"kd":"knowledge","u":"nav-flight-log-form","md":"- Columns, per leg: checkpoint (from/to) · altitude · TAS · W/V · TT / variation / MT · drift/WCA → MH · deviation → CH · distance · GS · ETE / ETA · fuel per leg and remaining; then actual ATA, revised GS/ETA in flight.\n- Header: flight plan/itinerary details, frequencies, alternates, fuel reserve.\n- `T` Variation turns TRUE into MAGNETIC; deviation turns MAGNETIC into COMPASS.\n- `?:` general knowledge; no free TC or NAV CANADA text found. Check against a TC-recognized text (e.g. *From the Ground Up*, TC Flight Training Manual) in the fact-check pass.","p":["CPL"],"e":["CPL"]},{"id":"NAV-18","card":"NAV","f":"kb/nav/pilot-navigation-dead-reckoning.md","h":"Pebble","a":"pebble","c":["nav-dr"],"kd":"pebble","u":"nav-pilot-navigation-dead-reckoning-pebble","md":"- TSD `distance = GS × time | time(min) = distance/GS × 60 | 60 kt = 1 NM/min, 90 = 1.5, 120 = 2 | GS, not IAS/TAS`\n- WIND `crosswind = wind × sin(angle), headwind = wind × cos(angle) | 30° = ½ / 45° ≈ 0.7 / 60° ≈ 0.87 / 90° = full | WCA° ≈ 60 × crosswind / TAS (small angles) | wind from right → crab right`\n- 1-IN-60 `track error° ≈ off × 60 / distance flown | closing° ≈ off × 60 / distance remaining | total = error + closing | double-track-error ≠ destination correction`\n- MAP / TIME `1° latitude = 60 NM, 1' = 1 NM | longitude = 60 NM × cos(latitude) | 0.1 h = 6 min | decimal minutes ≠ minutes:seconds`\n- DIVERT / LOST `decide early → MTRK/dist/GS/ETA/fuel → terrain/airspace/wx → advise | lost: climb, communicate, conserve, confess, comply`\n- EFB `portable = PED | Type A no safety effect, Type B minor | backup for total failure | no multi-step entry in critical phases | Li battery fire`\n- PED `airplane mode ≠ non-transmitting | interference: identify, stop, prohibit, recheck, report`\n- NAV LOG `TT ± var = MT ± WCA = MH ± dev = CH | distance, GS, ETE, fuel per leg | update ATA/ETA in flight`","p":["PPL","CPL","IR"]},{"id":"NAV-19","card":"NAV","f":"kb/nav/publications-cfs-cap-notam-currency.md","h":"CFS / aerodrome scan","a":"cfs--aerodrome-scan","c":["nav-pubs"],"kd":"knowledge","u":"nav-cfs-aerodrome-scan","md":"- `P:` aerodrome ID/elevation→RWY dimensions/surface/slope→circuit direction/altitude→FREQ/MF/ATF→lighting/PCL→`PRO`→`CAUTION`→services/fuel→nearby airspace.\n- CFS sections: General | Aerodrome Directory | Planning | Radio Navigation/Communications | Military | Emergency.\n- `T:` CFS page still requires current NOTAM/AIP SUP; a Trigger NOTAM is only a pointer.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"NAV-20","card":"NAV","f":"kb/nav/publications-cfs-cap-notam-currency.md","h":"Publication currency","a":"publication-currency","c":["nav-pubs"],"kd":"knowledge","u":"ref-current-publication-cycle-c01","md":"- Publication schedules differ by product; do not assign a universal 56-day validity to all charts and publications.\n- `P preflight:` current publication→NOTAM→AIP SUP/AIC→airport/procedure page→aircraft data.\n- Trigger NOTAM = notice that source material changed; retrieve the referenced amendment/Supplement. It may expire while the underlying AIP SUP remains active.\n- `[NAV CANADA publication schedule; AIC 009/2026]`","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"NAV-21","card":"NAV","f":"kb/nav/publications-cfs-cap-notam-currency.md","h":"CFS servicing · public facilities / Services · installations publiques CFS","a":"cfs-servicing--public-facilities--services--installations-publiques-cfs","c":["nav-pubs","agk-stall"],"kd":"glossary","u":"fx-cfs-servicing-public-facilities-services-ins","md":"| Label | English | Français |\n|---|---|---|\n| 1 | Storage available | Entreposage disponible |\n| 2 | Servicing / minor repairs | Entretien / réparations mineures |\n| 3 | Major repairs | Réparations majeures |\n| 4 | Extended-term parking | Stationnement prolongé |\n| 5 | Tie-down facilities | Dispositifs d’amarrage |\n| 6 | Plug-in facilities | Prises de branchement |\n| 7 | Pick-up/drop-off only; no extended parking | Embarquement/débarquement seulement; aucun stationnement prolongé |\n| PF location / Lieu | `PF` = public facilities. `A` terminal; `B` on aerodrome; `C` within 5 NM; `D` within 30 NM. | `PF` = installations publiques. `A` aérogare; `B` sur l’aérodrome; `C` à moins de 5 NM; `D` à moins de 30 NM. |\n| PF 1–4 | `1` phone; `2` food; `3` taxi; `4` medical. | `1` téléphone; `2` restauration; `3` taxi; `4` services médicaux. |\n| PF 5–8 | `5` hotel; `6` car rental; `7` public Wi-Fi; `8` public Internet access. | `5` hôtel; `6` location auto; `7` Wi-Fi public; `8` accès Internet public. |\n| PF example / Exemple | `PF A-1,2 B-5` = phone and food in terminal; hotel on aerodrome. `S 5` means tie-down, but `PF 5` means hotel. | `PF A-1,2 B-5` = téléphone et restauration dans l’aérogare; hôtel sur l’aérodrome. `S 5` signifie arrimage, mais `PF 5` signifie hôtel. |","p":[],"ph":["PPL","CPL"]},{"id":"NAV-22","card":"NAV","f":"kb/nav/publications-cfs-cap-notam-currency.md","h":"NOTAM · header & Q-line / En-tête et ligne Q","a":"notam--header--q-line--en-tête-et-ligne-q","c":["nav-pubs"],"kd":"knowledge","u":"fx-notam-header-q-line-en-t-te-et-ligne-q","md":"| Label | English | Français |\n|---|---|---|\n| Example / Exemple | Training example: H1234/26 NOTAMN; Q) CZUL/QMRLC/IV/NBO/A/000/999/4528N07345W005 | Exemple pédagogique : H1234/26 NOTAMN; Q) CZUL/QMRLC/IV/NBO/A/000/999/4528N07345W005 |\n| 1 Header | H = series; 1234 = number; /26 = year | H = série; 1234 = numéro; /26 = année |\n| 2 Type | NOTAMN new; NOTAMR replacement; NOTAMC cancellation | NOTAMN nouveau; NOTAMR remplacement; NOTAMC annulation |\n| 3–5 | Q) qualifiers; CZUL FIR; QMRLC = runway closed (MR runway, LC closed) | Q) qualificatifs; CZUL FIR; QMRLC = piste fermée (MR piste, LC fermé) |\n| 6 Traffic | I IFR; V VFR; IV both | I IFR; V VFR; IV les deux |\n| 7 Purpose | N immediate attention; B briefing; O flight operations; M miscellaneous on request; K checklist | N attention immédiate; B exposé; O opérations de vol; M divers sur demande; K liste récapitulative |\n| 8 Scope | A aerodrome; E en route; W navigation warning; AE aerodrome + en route | A aérodrome; E en route; W avertissement navigation; AE aérodrome + en route |\n| 9–10 Vertical | Lower/upper in FL; 000/999 commonly default filtering values | Limites inférieure/supérieure en FL; 000/999 souvent valeurs de filtrage par défaut |\n| 11–12 Geography | 4528N07345W = centre; 005 = 5 NM RADIUS | 4528N07345W = centre; 005 = RAYON de 5 NM |\n| A / B / C | A location; B start UTC; C end UTC or PERM | A lieu; B début UTC; C fin UTC ou PERM |\n| D / E / F / G | D schedule; E operational text; F/G lower/upper limits when applicable | D horaire; E texte opérationnel; F/G limites inférieure/supérieure si applicables |","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"NAV-23","card":"NAV","f":"kb/nav/publications-cfs-cap-notam-currency.md","h":"Common NOTAM codes / Codes NOTAM courants","a":"common-notam-codes--codes-notam-courants","c":["nav-pubs"],"kd":"glossary","u":"fx-common-notam-codes-codes-notam-courants","md":"| Label | English | Français |\n|---|---|---|\n| QMRLC | Runway closed | Piste fermée |\n| QMXLC | Taxiway closed | Voie de circulation fermée |\n| QFALC | Aerodrome closed | Aérodrome fermé |\n| QICAS | ILS unserviceable | ILS hors service |\n| QILAS | Localizer unserviceable | Radiophare d’alignement hors service |\n| QIGAS | Glide path unserviceable | Alignement de descente hors service |\n| QNVAS | VOR unserviceable | VOR hors service |\n| QNDAS | DME unserviceable | DME hors service |\n| QNBAS | NDB unserviceable | NDB hors service |\n| QCAAS | Air-ground communications unserviceable | Communications air-sol hors service |\n| QOBCE | Obstacle erected | Obstacle érigé |\n| QOLAS | Obstacle lights unserviceable | Feux d’obstacle hors service |","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"NAV-24","card":"NAV","f":"kb/nav/publications-cfs-cap-notam-currency.md","h":"Enroute low altitude (LO) chart","a":"enroute-low-altitude-lo-chart","c":["nav-pubs"],"kd":"knowledge","u":"nav-lo-chart-navaid-depiction","md":"- LO charts: IFR navigation along ATS routes **below 18 000 ft ASL**; show radio aids, airways, controlled/uncontrolled airspace, special use airspace, communication stations, selected aerodromes. 10-chart series.\n- `T` **Not for VFR navigation**: no obstacles, terrain or roads. Check NOTAM and AIP Supplements: data current only to the effective date.\n- VNC (1:500 000) limits: not for low ceiling/visibility, not all obstacles shown, updated every 1–5 years → VTA where available; new data appears first by NOTAM/AIP SUP, then CFS, then chart.\n- `?:` navaid symbols (VOR, VORTAC, NDB, DME) not described here: read the chart legend.\n\n- Sources: [NAV CANADA, Fit for Purpose (B1, B7)](https://www.navcanada.ca/en/publications/_localised-assets/files/14-403_aeronautical-publications-guide_e3.pdf).","p":["PPL","CPL"],"e":["CPL"]},{"id":"NAV-25","card":"NAV","f":"kb/nav/publications-cfs-cap-notam-currency.md","h":"Pebble","a":"pebble","c":["nav-pubs"],"kd":"pebble","u":"nav-publications-cfs-cap-notam-currency-pebble","md":"- CFS `ID/elevation → RWY → circuit → FREQ/MF/ATF → lighting/PCL → PRO → CAUTION → services/fuel → airspace | sections: General, Aerodrome Directory, Planning, Radio Nav/Comm, Military, Emergency | CFS page still needs current NOTAM/AIP SUP | Trigger NOTAM = pointer only | schedules differ by product`\n- LO `IFR <18000 ASL | airways + radio aids + airspace | not for VFR (no terrain/obstacles) | check NOTAM + AIP SUP`","p":["PPL","CPL"]},{"id":"NAV-26","card":"NAV","f":"kb/nav/units-conversions.md","h":"Units / constants","a":"units--constants","c":["nav-units"],"kd":"formula","u":"nav-units-constants","md":"| Item | Memory |\n|---|---|\n| `1 NM` | `6076 ft` ≈ `1.852 km` |\n| `1 SM` | `5280 ft` ≈ `1.609 km` |\n| `1 NM` | ≈ `1.15 SM` |\n| `1 kt` | `1 NM/hr` ≈ `1.15 mph` ≈ `1.852 km/h` |\n| `1 hr` | `60 min`; `0.1 hr = 6 min` |\n| `1 gal US` | `3.785 L` |\n| `1 gal Imp` | `4.546 L` |\n| `1 US gal avgas` | ≈ `6 lb` |\n| `1 L avgas` | ≈ `1.6 lb` |\n| `1 kg` | `2.205 lb` |\n| `1 lb` | `0.454 kg` |\n| `1 inHg` | ≈ `33.86 hPa` |\n| `1 hPa` | ≈ `30 ft` pressure altitude rough |\n\n- `T:` US gal ≠ Imperial gal. POH fuel units may differ from pump/club logs.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"NAV-27","card":"NAV","f":"kb/nav/units-conversions.md","h":"Temperature","a":"temperature","c":["nav-units"],"kd":"formula","u":"calc-temperature","md":"- `F:` `°C = (°F - 32) × 5/9`.\n- `F:` `°F = °C × 9/5 + 32`.\n- `M:` `0°C=32°F`; `10°C=50°F`; `20°C=68°F`; `30°C=86°F`.\n- `T:` cold temp correction affects obstacle clearance; not just comfort.","p":["PPL","CPL"]},{"id":"NAV-28","card":"NAV","f":"kb/nav/units-conversions.md","h":"Pebble","a":"pebble","c":["nav-units"],"kd":"pebble","u":"nav-units-conversions-pebble","md":"- UNITS `1 NM = 6076 ft ≈ 1.852 km ≈ 1.15 SM | 1 SM = 5280 ft | 1 US gal = 3.785 L; 1 Imp gal = 4.546 L; US ≠ Imperial | avgas ≈ 6 lb/US gal ≈ 1.6 lb/L | 1 kg = 2.205 lb | 1 inHg ≈ 33.86 hPa; 1 hPa ≈ 30 ft`\n- TEMP `°C = (°F − 32) × 5/9 | °F = °C × 9/5 + 32 | 0/10/20/30°C = 32/50/68/86°F`","p":["PPL","CPL"]}]}</script>
<script>
(() => {

const REPO = 'https://github.com/jraph/aero-cave/blob/main/';
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

const T = {
  title:['Canadian pilot study notes','Notes d’étude pour pilotes canadiens'], hRead:['By type of note','Par type de note'], tcItems:['TC items under this topic','Points TC sous ce thème'], tcGaps:['Missing or partial items','Points manquants ou partiels'], tcEss:['Essential items (all statuses)','Points essentiels (tous statuts)'],

  hGuide:['Training path: TC exams and flight tests','Parcours : examens et tests en vol de TC'], items:['items','points'], stC:['Covered','Couvert'], stP:['Partial','Partiel'], stM:['Missing','Manquant'], stE:['Elsewhere, unchecked','Ailleurs, non vérifié'], back:['← Explorer','← Explorateur'], reviewed:['Reviewed','Révisé'], official:['Official guide ↗','Guide officiel ↗'], ess:['Essential','Essentiel'], depth:['Commercial depth','Niveau professionnel'], essU:['% essential: cited by an item the % guide marks ✈','Essentiel %: cité par un point marqué ✈ dans le guide %'], handLv:['Level set by hand: no TC item cites this note yet','Niveau attribué à la main : aucun point TC ne cite encore cette note'], kWritten:['Written exam','Examen écrit'], kFlight:['Flight test','Test en vol'], study:['Study the mapped sections','Étudier les sections reliées'], mapped:['sections mapped','sections reliées'], method:['Method','Méthode'], toGuide:['Item-by-item coverage →','Couverture point par point →'], own:['Item labels are our own short wording; the guide text is authoritative.','Les libellés sont notre formulation abrégée; le texte du guide fait foi.'],
  clr:['✕ Clear','✕ Effacer'],

};
let lang = store.get('aero-cave-language'); if (!['en','fr','both'].includes(lang)) lang = 'both';
const t = k => lang === 'en' ? T[k][0] : lang === 'fr' ? T[k][1] : (T[k][0] === T[k][1] ? T[k][0] : T[k][0] + ' / ' + T[k][1]);
const L = o => lang === 'en' ? o.en : lang === 'fr' ? o.fr : (o.en === o.fr ? o.en : o.en + ' / ' + o.fr);
const L1 = o => lang === 'fr' ? o.fr : o.en;

/* ---- graph index ---- */
const C = new Map(D.concepts.map(c => [c.id, Object.assign({narrower:[]}, c)]));
for (const c of C.values()) for (const b of c.broader) C.get(b).narrower.push(c.id);
for (const c of C.values()) for (const r of c.related) { const o = C.get(r); if (!o.related.includes(c.id)) o.related.push(c.id); }
const desc = new Map();
const getDesc = id => { if (desc.has(id)) return desc.get(id); const s = new Set([id]); desc.set(id, s); for (const n of C.get(id).narrower) for (const x of getDesc(n)) s.add(x); return s; };
const roots = D.concepts.filter(c => !c.broader.length).map(c => c.id);
const K = new Map(D.cards.map(c => [c.id, c]));
const KIND = new Map(D.kinds.map((k, i) => [k.id, Object.assign({i}, k)]));
const V = new Map();
for (const v of D.views) { const set = v.concepts ? new Set() : null; if (set) for (const id of v.concepts) for (const x of getDesc(id)) set.add(x); V.set(v.id, Object.assign({}, v, {set, kset: v.kinds ? new Set(v.kinds) : null, uset: v.units ? new Set(v.units) : null, rx: v.re ? new RegExp(v.re, 'i') : null})); }
const inView = (s, v) => (!v.level || s.p.includes(v.level)) && (v.uset ? v.uset.has(s.u) : ((!v.set && !v.rx && !v.kset) || (v.kset && v.kset.has(s.kd)) || (v.set && s.c.some(x => v.set.has(x))) || (v.rx && v.rx.test(s.h))));
for (const s of D.sections) {
  s.t = norm(s.h + ' ' + s.md + ' ' + s.c.map(id => C.get(id).en + ' ' + C.get(id).fr + ' ' + (C.get(id).alt || []).join(' ')).join(' '));
  s.hn = norm(s.h);
}

const U = new Map(D.sections.filter(s => s.u).map(s => [s.u, s]));
const G = new Map(D.guides.map(g => [g.id, g]));
const unitItems = new Map();
for (const g of D.guides) for (const grp of g.groups) for (const it of grp.items) for (const u of it.u) { if (!unitItems.has(u)) unitItems.set(u, []); unitItems.get(u).push({g, grp, it}); }
let gFilter = '';
const PLANE = '✈\uFE0E';
const gHit = i => !gFilter || (gFilter === 'e' ? i.e : gFilter === 'd' ? i.d : i.s === gFilter);
/* ---- state + routing: #x-VIEW-KIND-CONCEPT (k = note kind) ---- */
const S = {q:'', p:'', k:'', c:'', g:''};

function readHash() {
  const m = /^#x-([A-Za-z0-9]+)-([A-Za-z0-9]+)-([a-z0-9-]+)$/.exec(location.hash);
  S.p = S.k = S.c = S.g = '';
  const mg = /^#g-([a-z0-9-]+)$/.exec(location.hash); if (mg && G.has(mg[1])) { S.g = mg[1]; return; }
  const mu = /^#u-([a-z0-9-]+)$/.exec(location.hash); if (mu && U.has(mu[1])) { S.c = U.get(mu[1]).c[0]; focusUnit = mu[1]; return; }
  if (!m) return;

  if (h !== location.hash) { try { history.replaceState(null, '', h || location.pathname + location.search); } catch (e) { location.hash = h; } }
}
function openUnit(u) { focusUnit = u; go({q:'', p:'', k:'', g:'', c:U.get(u).c[0]}); }
function go(patch, top) { if (!('g' in patch)) S.g = ''; Object.assign(S, patch); writeHash(); render(); if (top) window.scrollTo({top:0}); }

/* ---- filtering ---- */
function matches(s, skip) {
  if (skip !== 'p' && S.p && !inView(s, V.get(S.p))) return false;

  fp.value = S.p; fp.classList.toggle('on', !!S.p);
  fillSelect($('fk'), [['', t('allK')]].concat(D.kinds.map(k => [k.id, L1(k) + ' (' + baseK.filter(s => s.kd === k.id).length + ')'])), S.k);
  fillSelect($('fc'), conceptOptions(counts), S.c);
  $('gpanel').hidden = !S.g;
  if (S.g) { const c0 = $('clr'); c0.textContent = lang === 'fr' ? T.clr[1] : T.clr[0]; c0.hidden = false; for (const id of ['home','vpanel','cpanel','count']) $(id).hidden = true; $('results').textContent = ''; renderGuide(); return; }
  const browsing = !S.c && !S.k && !tokens.length && !S.p;
  $('home').hidden = !browsing;
  if (browsing) {
    $('legend').innerHTML = '<p>' + esc(t('legIntro')) + '</p><dl>' + Object.entries(MK).map(([k, v]) => '<dt><code class="mk">' + esc(k) + ':</code></dt><dd>' + esc(mkTxt(v)) + '</dd>').join('') + '</dl><p>' + esc(t('legBadges')) + '</p>';
    const ts = $('ts'), tg = $('tg'), tr = $('tr'); ts.textContent = tg.textContent = tr.textContent = '';
    for (const k of D.kinds) { const n = D.sections.filter(x => x.kd === k.id).length; if (!n) continue; const b = el('button', 'tile', '<b>' + esc(L(k)) + '</b><span>' + n + ' ' + t('secs') + '</span>'); b.type = 'button'; b.onclick = () => go({k:k.id}, true); tr.appendChild(b); }
    D.guides.forEach((g, i) => { const all = g.groups.flatMap(x => x.items), n = k => all.filter(it => it.s === k).length; const b = el('button', 'tile', '<b>' + (i + 1) + ' · ' + esc(L(g)) + '</b><span>' + esc(g.guide) + ' · ' + esc(t(g.kind === 'flight' ? 'kFlight' : 'kWritten')) + '<br>' + all.length + ' ' + t('items') + ' · ' + ['C','P','M','E'].filter(k => n(k)).map(k => n(k) + ' ' + k).join(' · ') + (all.some(x => x.e) ? ' · ' + PLANE + ' ' + all.filter(x => x.e).length : '') + '</span>' + bar(all)); b.type = 'button'; b.onclick = () => go({g:g.id}, true); tg.appendChild(b); });
    for (const [g, box] of [['ops', $('to')]]) { box.textContent = ''; for (const v of V.values()) if (v.group === g) { const b = el('button', 'tile', '<b>' + esc(L(v)) + '</b><span>' + (v.ref ? esc(v.ref) + ' · ' : '') + vn.get(v.id) + ' ' + t('secs') + '</span>'); b.type = 'button'; b.onclick = () => go({p:v.id}, true); box.appendChild(b); } }
    for (const r of roots) { const n = counts.get(r); if (!n) continue; const b = el('button', 'tile', '<b>' + esc(L(C.get(r))) + '</b><span>' + n + ' ' + t('secs') + ' · ' + C.get(r).narrower.filter(x => counts.get(x)).length + ' ' + t('topics') + '</span>'); b.type = 'button'; b.onclick = () => go({c:r}, true); ts.appendChild(b); }
  }
  renderConcept(counts);
  const vp = $('vpanel'); vp.textContent = ''; vp.hidden = !S.p;
  if (S.p) { const v = V.get(S.p);
    vp.appendChild(el('h3', '', esc(L(v))));
    if (v.guide && G.has(v.guide)) { const gg = G.get(v.guide), all = gg.groups.flatMap(x => x.items); vp.insertAdjacentHTML('beforeend', bar(all)); const gb = el('button', 'btn', esc(t('toGuide'))); gb.type = 'button'; gb.onclick = () => go({g:v.guide}, true); vp.appendChild(gb); }
    if (v.group === 'ops') vp.appendChild(el('div', 'crumbs', esc(t('opsNote'))));
    if (!S.c) { const r = el('div', 'rel', '<i>' + esc(t('narrow')) + '</i>'); let any = 0; for (const id of roots) if (counts.get(id)) { r.appendChild(chip(id, '', counts.get(id))); any++; } if (any > 1) vp.appendChild(r); }
  }
  const res = $('results'), cnt = $('count'); res.textContent = ''; cnt.hidden = browsing; if (browsing) return;
  let list = D.sections.filter(s => matches(s));
  if (tokens.length) { const sc = s => tokens.every(w => s.hn.includes(w)) ? 0 : tokens.some(w => s.hn.includes(w)) ? 1 : 2; list = list.map((s, i) => [sc(s), i, s]).sort((a, b) => a[0] - b[0] || a[1] - b[1]).map(x => x[2]); }
  cnt.textContent = '';
  cnt.appendChild(el('span', '', '<b>' + list.length + '</b> ' + t(list.length === 1 ? 'sec' : 'secs')));
  const rs = el('button', 'btn', esc(t('reset'))); rs.type = 'button'; rs.onclick = () => go({q:'', p:'', k:'', c:'', g:''}, true); cnt.appendChild(rs);
  if (list.length && list.length <= 40) { const ex = el('button', 'btn', esc(t('expand'))); ex.type = 'button'; let open = false; ex.onclick = () => { open = !open; res.querySelectorAll('details').forEach(d => d.open = open); ex.textContent = t(open ? 'collapse' : 'expand'); }; cnt.appendChild(ex); }
  if (!list.length) { res.appendChild(el('p', 'empty', esc(t('none')))); return; }
  const frag = document.createDocumentFragment();
  if (tokens.length) { list.forEach(s => { const d = sectionEl(s); d.querySelector('.st').insertAdjacentHTML('beforebegin', '<span class="pb" style="color:var(--accent)">' + s.card + '</span>'); frag.appendChild(d); }); }
  else if (S.c && !S.k) { const ord = list.map((x, i) => [KIND.get(x.kd).i, i, x]).sort((a, b) => a[0] - b[0] || a[1] - b[1]).map(x => x[2]); let cur = null; for (const s of ord) { if (s.kd !== cur) { cur = s.kd; frag.appendChild(el('div', 'gh', esc(L(KIND.get(cur))) + ' <small>' + ord.filter(x => x.kd === cur).length + '</small>')); } frag.appendChild(sectionEl(s)); } }
  else { let cur = null; const key = x => x.f || x.card; for (const s of list) { if (key(s) !== cur) { cur = key(s); const c = K.get(s.card), n = list.filter(x => key(x) === cur).length; frag.appendChild(el('div', 'gh', esc(s.f ? c.id + ' › ' + c.files[s.f] : (/^\d/.test(c.id) ? c.id + ' · ' : '') + L(c)) + ' <small>' + n + '</small>')); } frag.appendChild(sectionEl(s)); } }
  res.appendChild(frag);
  if (list.length === 1) res.querySelector('details').open = true;
  if (focusUnit) { const d = res.querySelector('details[data-u="' + focusUnit + '"]'); focusUnit = ''; if (d) { d.open = true; d.classList.add('hit'); setTimeout(() => d.scrollIntoView({block:'start'}), 0); } }
}

/* ---- events ---- */
let timer; $('q').addEventListener('input', e => { clearTimeout(timer); timer = setTimeout(() => { S.q = e.target.value; render(); }, 120); });
$('fp').onchange = e => go({p:e.target.value}); $('fk').onchange = e => go({k:e.target.value}); $('fc').onchange = e => go({c:e.target.value});
document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => {
  const openUnits = new Set(Array.from(document.querySelectorAll('#results details[open]'), d => d.dataset.u));
  lang = b.dataset.lang; store.set('aero-cave-language', lang); render();
  for (const d of document.querySelectorAll('#results details')) if (openUnits.has(d.dataset.u)) d.open = true;
});
let size = +store.get('aero-cave-explorer-size') || 16; const setSize = n => { size = Math.min(22, Math.max(12, n)); document.documentElement.style.setProperty('--size', size + 'px'); store.set('aero-cave-explorer-size', size); };
setSize(size); $('fs-').onclick = () => setSize(size - 1); $('fs+').onclick = () => setSize(size + 1);
const th = store.get('aero-cave-explorer-theme'); if (th) document.documentElement.dataset.theme = th;
$('theme').onclick = () => { const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme:dark)').matches); const v = dark ? 'light' : 'dark'; document.documentElement.dataset.theme = v; store.set('aero-cave-explorer-theme', v); };
const clearAll = () => { gFilter = ''; go({q:'', p:'', k:'', c:'', g:''}, true); };
$('clr').onclick = clearAll;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (S.q || S.p || S.k || S.c || S.g)) clearAll(); });
window.addEventListener('hashchange', () => { readHash(); render(); });
readHash(); render();
window.__explorer = {D, S, go, md};
})();
</script>
