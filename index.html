tificate valid **24 months**.\n- `R` Air operators submit DG procedures + training to TC; may delegate tasks but stay accountable. 604 private operators may not submit, but ICAO TIs still require a training program even if they never carry DG.\n\n- Sources: [TC AIM RAC 12.3](https://tc.canada.ca/sites/default/files/2026-10/aim-2026-2_rac_en.pdf).","p":["CPL"]},{"id":"LAW-12","card":"LAW","f":"kb/law/air-law-procedures.md","h":"Pebble","a":"pebble","c":["law"],"kd":"pebble","u":"law-air-law-procedures-pebble","md":"- AUTHORITY `Act/CARs/Standards = law | AIP/CFS/CAP/NOTAM = current data | AIM/TP = guidance | no expired copies`\n- DEFS `MDA = altitude ASL | DH = height | IMC = below VMC minima, not \"in cloud\" | night = civil twilight to civil twilight`\n- ENTRY `first landing at CUST A/D | private: no permission, FPL required | transborder FPL always | ≤15 POB phone CBSA 2–48 h before`\n- CTA `air service → Agency licence + Canadian aviation document (AOC) + liability insurance | no selling without licence`\n- LABOUR CODE `on board \"in operation\" = flying or doors closed + moving | know, participate, refuse (tell person in charge) | death/≥2 injured → TC ≤24 h`\n- DG `9 TDG classes | TDG Act + ICAO TIs | training certificate 24 mo or supervised | operator accountable`","p":["CPL","IR"]},{"id":"LAW-13","card":"LAW","f":"kb/law/air-taxi-703-706.md","h":"Operating instructions, operational control, authorization, OFP, maintenance — 703.14 / .16–.19","a":"operating-instructions-operational-control-authorization-ofp-maintenance--70314--1619","c":["law-703"],"kd":"knowledge","u":"law-703-operational-control-flight-plan","md":"- `R` Ops personnel instructed on duties and follow the COM.\n- `R` Operational control system meeting CASS, **under the control of the operations manager**.\n- `R` Flight starts only when authorized per COM. OFP (CASS) prepared per COM; PIC leaves a copy **at the point of departure** per COM; operator keeps OFP + amendments **≥180 days**.\n- `R` No TKOF in an ACFT not maintained under the operator's **maintenance control system**.\n\n- Sources: [703.14](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-703.14.html), [703.16](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-703.16.html), [703.17](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-703.17.html), [703.18](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-703.18.html), [703.19](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-703.19.html).","p":["CPL"]},{"id":"LAW-14","card":"LAW","f":"kb/law/air-taxi-703-706.md","h":"Flight operations — 703.23–.29 / .34 / .37 / .42","a":"flight-operations--7032329--34--37--42","c":["law-703"],"kd":"knowledge","u":"law-703-flight-operations","md":"- `R` Land ACFT over water beyond gliding reach of shore (except TKOF/LDG) → AOC authorization + CASS.\n- `R` Single-engined ACFT with **>9 passengers** only if transport category **helicopter** + AOC + CASS.\n- `R` External load with passengers only if the load carriage is authorized in a **TC or STC**.\n- `R` No simulated emergencies affecting flight characteristics with **passengers or cargo** on board.\n- `R` VFR obstacle clearance (except TKOF/LDG): **night ≥1 000 ft above highest obstacle within 3 mi of route** · **day, aeroplane ≥300 ft AGL and ≥300 ft horizontally from any obstacle**.\n- `R` Day VFR, uncontrolled, <1 000 ft AGL: aeroplane <**2 SM**, helicopter <**1 SM** flight visibility only with AOC + CASS.\n- `R` Start VFR only if current reports and forecasts, if obtainable, show VFR along route **and at destination**.\n- `R` IFR or **night VFR** in uncontrolled airspace off an air route → route established by operator per CASS.\n- `R` W&B within AFM limits **in every phase**; W&B system (CASS) described in COM with form-preparation instructions.\n- `R` Icing reported/forecast → PIC's safety judgment overrides being equipped (605.30(a)).\n\n- Sources: [703.23](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-703.23.html), [703.24](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-703.24.html), [703.25](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-703.25.html), [703.26](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-703.26.html), [703.27](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-703.27.html), [703.28](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-703.28.html), [703.29](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-703.29.html), [703.34](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-703.34.html), [703.37](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-703.37.html), [703.42](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-703.42.html).","p":["CPL"]},{"id":"LAW-15","card":"LAW","f":"kb/law/air-taxi-703-706.md","h":"Single-pilot IMC equipment, shoulder harness — 703.66 / .69","a":"single-pilot-imc-equipment-shoulder-harness--70366--69","c":["law-703"],"kd":"knowledge","u":"law-703-equipment-single-pilot-imc-harness","md":"- `R` **Single-pilot IMC**: **autopilot** able to hold flight and manoeuvre about lateral + longitudinal axes · **headset with boom mic** (or equivalent) + **transmit button on control column** · **chart holder** easily readable + lit.\n- `R` Pilot seat and any seat beside it: safety belt **with shoulder harness**.\n- `T` Autopilot requirement = **single-pilot in IMC** only; not VMC, not two-pilot.\n\n- Sources: [703.66](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-703.66.html), [703.69](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-703.69.html).","p":["CPL"],"e":["CPL"]},{"id":"LAW-16","card":"LAW","f":"kb/law/air-taxi-703-706.md","h":"Crew designation, validity, training, manuals, SOPs — 703.87 / .91 / .98 / .106 / .107","a":"crew-designation-validity-training-manuals-sops--70387--91--98--106--107","c":["law-703"],"kd":"knowledge","u":"law-703-crew-validity-training-manuals-sop","md":"- `R` Designate PIC (PIC + SIC if 2 pilots); record names, keep **≥180 days**.\n- `R` **PPC, competency check and annual training → 1st day of 13th month**. Renewed in last 90 days → **+12 months**. Minister may extend **≤60 days**. Expired **≥24 months** → requalify per CASS.\n- `R` Training program (Minister-approved): indoctrination · upgrading · initial + annual (type, servicing/ground handling, emergency, **operational control personnel**, surface contamination) · **seaplane pilots: underwater egress initially then every 3 years**. Syllabus in COM; contamination awareness for others.\n- `R` Fatigue management training: personal strategies (sleep hygiene, lifestyle/exercise/diet, alcohol and drugs) · fatigue impact on safety · sleep science · causes/consequences · recognizing fatigue in self and others · sleep disorders · human/organizational factors (sleep, shift work, overtime, circadian rhythm, time zones).\n- `R` COM parts + amendments to crew, ground ops and maintenance staff; or copy **in each ACFT** if COM has amendment procedures.\n- `R` SOPs for each ACFT **required to have ≥2 pilots**; copy on board.\n\n- Sources: [703.87](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-703.87.html), [703.91](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-703.91.html), [703.98](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-703.98.html), [703.106](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-703.106.html), [703.107](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-703.107.html).","p":["CPL"]},{"id":"LAW-17","card":"LAW","f":"kb/law/air-taxi-703-706.md","h":"Maintenance arrangements, elementary work, servicing — 706.09–.11","a":"maintenance-arrangements-elementary-work-servicing--7060911","c":["law-703"],"kd":"knowledge","u":"law-706-maintenance-arrangements-elementary-work-servicing","md":"- `R` Maintenance only by a person/organization with adequate facilities, equipment, parts and staff on site **and**: AMO certificate (573.02) rated for the work · or abroad, approved by a state with a recognition agreement with Canada · or Minister-approved.\n- `R` Arrangement specifies the maintenance and tasks, follows the MCM procedures (or Minister-approved). Abroad without AMO → Minister issues a **maintenance specification** when the agreement/foreign state requires it or no agreement exists. Operator ensures all tasks are completed.\n- `R` **Elementary work** unsupervised only after training under the 706.12 program **and** having done that task before under **direct supervision** of an AME or approved training organization.\n- `R` Anyone performing **or requesting** servicing has completed 706.12 training for it.\n- `T` Elementary work ≠ servicing: elementary needs prior supervised performance; servicing needs training only.\n\n- Sources: [706.09](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-706.09.html), [706.10](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-706.10.html), [706.11](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-706.11.html).","p":["CPL"]},{"id":"LAW-18","card":"LAW","f":"kb/law/air-taxi-703-706.md","h":"Pebble","a":"pebble","c":["law-703"],"kd":"pebble","u":"law-703-pebble","md":"- 703 CONTROL `ops control under ops manager | flight authorized per COM | OFP copy left at departure point, kept ≥180 d | no TKOF unless maintained under MCS`\n- 703 OPS `single-engine >9 pax only transport-cat heli + AOC | no simulated emergencies with pax/cargo | VFR night ≥1000 ft within 3 mi | day aeroplane ≥300 ft AGL + 300 ft horizontal | VFR start: route + destination VFR | night VFR/IFR off air route → operator route`\n- 703 EQUIP `single-pilot IMC: autopilot + boom mic + yoke PTT + lit chart holder | pilot + beside seat shoulder harness`\n- 703 VALIDITY `PPC + CC + annual → 13th mo (≠ 702 PPC 25th) | renew last 90 d → +12 | seaplane egress every 3 yr | fatigue training`\n- 706 `AMO or recognized foreign or Minister | elementary work: training + done once under direct AME supervision | servicing: training, incl. person requesting it`","p":["CPL"]},{"id":"LAW-19","card":"LAW","f":"kb/law/airspace-vfr-minima-cruising-altitudes.md","h":"Cruising altitudes","a":"cruising-altitudes","c":["law-airspace"],"kd":"knowledge","u":"law-cruising-altitudes","md":"- At more than `3000 ft AGL`, use appropriate cruising altitude/flight level based on track, unless otherwise authorized/required. `[CAR 602.34]`\n- VFR: `000–179°` odd thousands +`500`; `180–359°` even thousands +`500`.\n- Southern Domestic Airspace uses magnetic track; Northern Domestic Airspace true track.\n- `T:` track, not heading.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"LAW-20","card":"LAW","f":"kb/law/airspace-vfr-minima-cruising-altitudes.md","h":"Aerodrome / MF operations","a":"aerodrome--mf-operations","c":["law-airspace","ops-ldg"],"kd":"knowledge","u":"law-aerodrome-mf-operations","md":"- Ensure suitability/no collision; observe/conform to or avoid circuit; left turns unless CFS/ATC says right; comply CFS/NOTAM; into wind where practicable. Controlled aerodrome: clearance to taxi/TKOF/land. `[CAR 602.96]`\n- No flight below `2000 ft over an aerodrome` except listed operations/ATC authorization; separate from circuit and CAR 602.14 minima. `[CAR 602.96(4)]`\n- MF procedures/reports: CAR 602.97–602.104 + current CFS frequency/area/hours. `T:` uncontrolled≠unregulated; ATF calls≠MF mandatory reports.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"LAW-21","card":"LAW","f":"kb/law/airspace-vfr-minima-cruising-altitudes.md","h":"VFR minima — controlled","a":"vfr-minima--controlled","c":["law-airspace"],"kd":"knowledge","u":"law-vfr-minima-controlled","md":"- Visual reference to surface.\n- Flight visibility `≥3 SM`.\n- Cloud distance `≥500 ft vertical + 1 SM horizontal`.\n- In control zone: reported ground visibility `≥3 SM`; except takeoff/landing, aircraft `≥500 ft` from surface.\n- `[CAR 602.114]`","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"LAW-22","card":"LAW","f":"kb/law/airspace-vfr-minima-cruising-altitudes.md","h":"VFR minima — uncontrolled aeroplane","a":"vfr-minima--uncontrolled-aeroplane","c":["law-airspace"],"kd":"knowledge","u":"law-vfr-minima-uncontrolled-aeroplane","md":"| Height | Day | Night | Cloud |\n|---|---:|---:|---|\n| `≥1000 AGL` | `1 SM` | `3 SM` | `500 ft vert / 2000 ft horiz` |\n| `<1000 AGL` | `2 SM` (unless otherwise authorized in an AOC) | `3 SM` | clear of cloud |\n\n- Visual reference to surface required. `[CAR 602.115]`\n- `T:` these are legal minima, not personal minima.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"LAW-23","card":"LAW","f":"kb/law/airspace-vfr-minima-cruising-altitudes.md","h":"Special VFR","a":"special-vfr","c":["law-airspace"],"kd":"knowledge","u":"law-special-vfr","md":"- Only within a control zone; pilot requests and obtains ATC authorization.\n- Aeroplane flight visibility `≥1 SM`; helicopter `≥1/2 SM`.\n- Remain clear of cloud and in visual reference to surface. Reported ground visibility and radio conditions also apply. Night aeroplane SVFR authorization is to land at destination; do not generalize it to night departures. `[CAR 602.117; AIM RAC 2.7.3]`\n- `T:` SVFR is not permission to enter cloud/IMC; ATC traffic capacity and conditions still apply.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"LAW-24","card":"LAW","f":"kb/law/airspace-vfr-minima-cruising-altitudes.md","h":"IFR general","a":"ifr-general","c":["law-airspace","ifr"],"kd":"knowledge","u":"law-ifr-general","md":"- IFR operation requires IFR flight plan/clearance where applicable, instrument rating/current privileges, appropriate equipment and compliance with IFR minima/procedures. `[CAR 602.121+]`\n- Alternate, takeoff, approach, landing and approach-ban rules are separated in CAR 602.122–602.131.\n- `T:` advisory visibility, approach-ban threshold and DA/MDA visual-reference rule are three different concepts.","p":[],"ph":["CPL","IR"]},{"id":"LAW-25","card":"LAW","f":"kb/law/airspace-vfr-minima-cruising-altitudes.md","h":"Airspace classes / entry","a":"airspace-classes--entry","c":["law-airspace"],"kd":"knowledge","u":"law-airspace-entry-memory","md":"| Class | VFR memory |\n|---|---|\n| A | IFR only |\n| B | ATC clearance + specified equipment/qualification |\n| C | ATC clearance before entry |\n| D | establish two-way communication before entry |\n| E | no VFR clearance generally; IFR controlled |\n| F | special-use rules: `CYR/CYA/CYD` |\n| G | uncontrolled; CARs still apply |\n\n- Check current chart/CFS for floor, ceiling, transponder and communication requirements.\n- `T:` class rules≠weather minima.\n- See the [VFR separation / conflict-resolution matrix](#vfr-separation--conflict-resolution-by-class) for who ATC separates in Classes B–E.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"LAW-26","card":"LAW","f":"kb/law/airspace-vfr-minima-cruising-altitudes.md","h":"VFR separation / conflict resolution by class","a":"vfr-separation--conflict-resolution-by-class","c":["law-airspace","law-atc"],"kd":"knowledge","u":"law-vfr-separation-conflict-resolution-by-class","md":"| Class | VFR entry | Airborne ATC service |\n|---|---|---|\n| A | prohibited | IFR only; `SEP ALL` |\n| B | clearance; `CVFR` | `SEP ALL`, incl VFR–VFR |\n| C | clearance | `SEP` IFR–IFR; `CR` IFR–VFR as needed; `TFC` all; VFR–VFR `CR O/R` after TFC |\n| D | 2-way comm | `SEP` IFR–IFR only; `TFC` all; workload/equipment permitting: IFR–VFR `CR`, VFR–VFR `CR O/R` |\n| E | none generally; MF/XPDR rules may apply | `SEP` IFR–IFR only; VFR `TFC O/R` workload/equipment permitting; may stop without notice |\n| F | obey `CYR/CYA/CYD` | surrounding class unless specified; may be controlled, uncontrolled or both |\n| G | none | no ATC control/`SEP`; see-and-avoid + CARs |\n\n- `SEP` formal separation | `CR` conflict resolution for identified aircraft in ATC comm | `TFC` traffic information | `O/R` on request.\n- `C/D → E` when ATC unit closed: check published hours + NOTAM.\n- `C/D runway:` `SEP ALL`; this does **not** mean airborne VFR–VFR separation.\n- `T:` clearance/TFC/flight following ≠ collision-avoidance transfer. Lookout + right-of-way remain.\n- Sources: [TC AIM 2026-2 RAC 2.8.1–2.8.7](https://tc.canada.ca/sites/default/files/2026-10/aim-2026-2_rac_en.pdf) · [Standard 821.01 definitions](https://tc.canada.ca/en/corporate-services/acts-regulations/list-regulations/sor-96-433/standards/standard-821-canadian-domestic-air-traffic-control-separation-standards-canadian-aviation-regulations-cars)","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"LAW-27","card":"LAW","f":"kb/law/airspace-vfr-minima-cruising-altitudes.md","h":"Transponder airspace — CAR 601.03","a":"transponder-airspace--car-60103","c":["law-airspace","law-atc"],"kd":"knowledge","u":"law-transponder-airspace-car-601-03","md":"- Transponder airspace = all Class **A, B, C** + any Class **D or E** specified as transponder airspace in the DAH. [CAR 601.03]\n- Need transponder + automatic pressure-altitude reporting there (Class A also ADS-B per AIM). [AIM RAC 2.8.1–2.8.5]\n- `T:` Class D/E only if DAH says so. Check chart/DAH, not class letter alone.\n- `M:` `ABC always · D/E if DAH`.","p":["IR"]},{"id":"LAW-28","card":"LAW","f":"kb/law/airspace-vfr-minima-cruising-altitudes.md","h":"Class F special use airspace — CAR 601.04","a":"class-f-special-use-airspace--car-60104","c":["law-airspace"],"kd":"knowledge","u":"law-class-f-special-use-car-601-04","md":"| Type | Rule |\n|---|---|\n| CYR restricted | no flight unless authorized by user agency in DAH [CAR 601.04(2)] |\n| CYA advisory | non-participants may enter; avoid unless participating; extra vigilance [RAC 2.8.6.3] |\n| CYD danger (intl waters) | no ATC clearance for non-participants [RAC 2.8.6.2] |\n| MOA | ATC won't clear non-participating IFR through active MOA unless IFR separation possible; VFR need not avoid [RAC 2.9.4] |\n| Joint-use | ops authorized by controlling agency [RAC 2.8.6.5] |\n\n- ID: `CY` + `R/A/D` + 3 digits; advisory activity letter in brackets, e.g. `CYA113(A)`. [RAC 2.8.6.1]\n- IFR vs active Class F: ATC separates unless pilot states permission, ALTRV APVL, or contact/visual approach. IFR gets 500 ft vertical from active CYA (wake may need 1000). [RAC 2.8.6.1, 2.8.6.3]\n- NOTAM-activated CYR: NOTAM ≥24 h before activation. [RAC 2.8.6.6]\n- `T:` MSA/TAA ignore CYA, CYR, blasting areas: pilot stays clear. [CAP GEN]\n- Activity letters: A acro · F test · H hang glider · M military · P parachute · S soaring · T training. [CAP GEN symbol legend]","p":["IR"]},{"id":"LAW-29","card":"LAW","f":"kb/law/airspace-vfr-minima-cruising-altitudes.md","h":"Forest fire areas — 601.15–.17","a":"forest-fire-areas--6011517","c":["law-airspace"],"kd":"knowledge","u":"law-forest-fire-601-15-17","md":"- `R` No flight **over or within 5 NM of a forest fire area below 3 000 ft AGL**, nor in airspace described in a forest fire **NOTAM** (location + dimensions of fire area, airspace of fire control operations).\n- `R` Exempt: aircraft operating at the request or with authorization of the **fire control authority** · with Minister's **written authorization** (for public safety or to support an A/D in/near the fire area; conditions apply; authorization **on board**) · TC enforcement/surveillance staff.\n\n- Sources: [601.15](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-601.15.html), [601.16](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-601.16.html), [601.17](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-601.17.html).","p":["PPL","CPL"]},{"id":"LAW-30","card":"LAW","f":"kb/law/airspace-vfr-minima-cruising-altitudes.md","h":"Pebble","a":"pebble","c":["law-airspace"],"kd":"pebble","u":"law-airspace-vfr-minima-cruising-altitudes-pebble","md":"- CLASSES `A IFR only | B clearance + specified equipment/qualification (CVFR) | C clearance before entry | D two-way comm before entry | E no VFR clearance generally, IFR controlled | F CYR/CYA/CYD | G uncontrolled, CARs still apply | class rules ≠ weather minima`\n- ATC SERVICE `B SEP ALL | C SEP IFR–IFR, CR IFR–VFR, TFC all | D SEP IFR–IFR only | E SEP IFR–IFR only | clearance/TFC ≠ collision-avoidance transfer`\n- VFR CONTROLLED CAR 602.114 `visual reference to surface | flight vis ≥3 SM | cloud 500 ft vertical + 1 SM horizontal | control zone: ground vis ≥3 SM, ≥500 ft from surface except TKOF/LDG`\n- VFR UNCONTROLLED CAR 602.115 `≥1000 AGL: day 1 SM / night 3 SM, cloud 500 ft vert / 2000 ft horiz | <1000 AGL aeroplane: day 2 SM / night 3 SM, clear of cloud`\n- SVFR `control zone only | pilot requests | aeroplane flight vis ≥1 SM | clear of cloud, visual reference to surface | night aeroplane: to land at destination`\n- VFR OTT `day cruise only | ≥1000 ft vertical from cloud | ≥5000 ft between layers | flight vis ≥5 SM | not automatic with PPL`\n- CRUISE CAR 602.34 `>3000 ft AGL | VFR 000–179° odd +500 / 180–359° even +500 | SDA magnetic track, NDA true track | track ≠ heading`\n- AERODROME `left turns unless CFS/ATC says right | no flight below 2000 ft over an aerodrome except listed operations | ATF calls ≠ MF mandatory reports`\n- XPDR/CLASS F `601.03: ABC always, D/E if DAH | CYR = authorization · CYA = avoid unless participating · CYD no clearance · MOA no IFR through unless separated | IFR 500 ft from active CYA | CYR NOTAM ≥24 h`\n- FOREST FIRE `no flight <3000 AGL over or ≤5 NM | NOTAM airspace | exempt: fire authority, Minister written authorization on board, TC`","p":["PPL","CPL","IR"]},{"id":"LAW-31","card":"LAW","f":"kb/law/airworthiness-documents-maintenance.md","h":"Maintenance approvals / abnormal occurrences","a":"maintenance-approvals--abnormal-occurrences","c":["law-airworthy","law-report"],"kd":"knowledge","u":"law-maintenance-approvals-abnormal-occurrences","md":"| CAVE | Recall / rule |\n|---|---|\n| `R` AME | Aircraft Maintenance Engineer = licensed person; maintenance-release privileges depend on licence, rating, work and CAR 571 authority. [CAR 403](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-403.01.html) · [571.11](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-571.11.html) |\n| `R` AMO | Approved Maintenance Organization = TC-approved organization/scope; **not required for every private-ACFT inspection**. [CAR 573](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-573.02.html) |\n| `R` abnormal occurrence | Hard/overweight LDG, prop strike, excessive loads/turbulence, lightning, wind/jet blast suspected damage → applicable inspection per MFR + STD 625 App G **before return to service**; release by appropriately authorized person/org. [STD 625 App G](https://tc.canada.ca/en/corporate-services/acts-regulations/list-regulations/canadian-aviation-regulations-sor-96-433/standards/standard-625-aircraft-equipment-maintenance-canadian-aviation-regulations-cars) |\n| `R` PRM | **Person Responsible for Maintenance** → AMO appoints; oversees QA/SMS corrective actions; accountable even when management functions assigned. [573.03](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-573.03.html) · [573.04](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-573.04.html) |\n| `R` PRM QUAL | MAINT performance/direct supervision **≥6 yr**, incl. **≥6 mo in preceding 2 yr**; CAR open-book **≥70%** (AME licence/legacy exemptions for test; limited AMO rating/risk-assessment exception for experience). [STD 573.04(1)](https://tc.canada.ca/en/corporate-services/acts-regulations/list-regulations/canadian-aviation-regulations-sor-96-433/standards/standard-573-approved-maintenance-organizations-canadian-aviation-regulations-cars) · [573.03(4)–(5)](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-573.03.html) |\n| `R` PRM ACK | Sign acceptance to TC **≤30 days** after appointment; delegation of specified functions in **MPM ≠ transfer of responsibility**. [573.04(1),(4)–(6)](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-573.04.html) |\n| `R` PRMCS | **Person Responsible for Maintenance Control System** → AOC holder appoints employee; **≥70% open-book** unless AME licence or legacy exemption; ensures MAINT control / removes unsafe or non-compliant ACFT from operation. [706.03](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-706.03.html) |\n| `T` PRM/PRMCS | **AMO→PRM · Air operator→PRMCS**; if same holder holds **AOC + AMO**, **same person** fills both roles [706.03(7)](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-706.03.html). PRM/PRMCS appointment **≠ AME MAINT-release privileges**. |\n| `R` MPM | Maintenance Policy Manual → AMO procedures. [573.10](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-573.10.html) |\n| `R` MCM | Maintenance Control Manual → applicable air-operator maintenance-control procedures. [706.08](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-706.08.html) |\n| `R` MSA | Maintenance Schedule Approval → where required, approved schedule/intervals; **not universal to every private ACFT**. [605.86](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.86.html) |\n| `R` DML | Deferred Maintenance List → defect tracking (where used); **DML ≠ MEL authority**. [605.09–.10](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.10.html) |\n| `T` | AME≠AMO · INSP requirement≠mandatory AMO · defect entry≠maintenance release. |\n\n`M:` **AME=licenced individual | AMO=approved org | AMO→PRM (6 yr/6 mo, test ≥70% unless exempt, TC ACK ≤30d) | AOC→PRMCS (test ≥70% unless exempt) | dual AOC+AMO→same person | MPM AMO | MCM operator | MSA intervals | DML defects | App G→INSP**.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"LAW-32","card":"LAW","f":"kb/law/airworthiness-documents-maintenance.md","h":"Aircraft operating limitations","a":"aircraft-operating-limitations","c":["law-airworthy"],"kd":"knowledge","u":"law-aircraft-operating-limitations","md":"- Operate according to AFM/POH/authorized documents, limitations, markings and placards. `[CAR 602.07; 605.04–605.05]`\n- `T:` a school checklist cannot authorize something prohibited by the POH/placard.","p":["PPL","CPL"]},{"id":"LAW-33","card":"LAW","f":"kb/law/airworthiness-documents-maintenance.md","h":"Core aircraft documents","a":"core-aircraft-documents","c":["law-airworthy"],"kd":"knowledge","u":"law-core-aircraft-documents","md":"| Document | Rule |\n|---|---|\n| Certificate of Registration | carried on board `[CAR 202.26]` |\n| Flight authority / C of A / permit | in effect, conditions complied with, normally carried `[CAR 605.03]` |\n| AFM/POH if required | current applicable amendments/supplements available to crew `[CAR 605.04]` |\n| Journey log | carried unless a listed exception applies `[CAR 605.95]` |\n| Radio licence | carried if one has been issued for onboard apparatus `[CAR 605.03.1]` |\n\n- Journey-log exception: may remain behind when no landing and shutdown is planned anywhere other than departure, subject to exact CAR conditions.\n- `T:` proof of insurance is required by CAR 606.02, but “must be carried on board” is not stated as a universal CAR 202/605 document rule.\n- PIC responsible. Also onboard as applicable: required licences/medical.\n- `T:` valid document≠current pilot or airworthy aircraft. Current CFS/AIP/NOTAM/POH wins.","p":["PPL","CPL","ME"],"e":["PPL"]},{"id":"LAW-34","card":"LAW","f":"kb/law/airworthiness-documents-maintenance.md","h":"ACFT REG / airworthiness — CoR · CoA","a":"acft-reg--airworthiness--cor--coa","c":["law-airworthy"],"kd":"knowledge","u":"law-acft-reg-airworthiness-cor-coa","md":"| CAVE | Rule / trap |\n|---|---|\n| `R` CoR | Certificate of Registration; carry onboard; registered custody/control **≠ proof of title**. [202.26](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-202.26.html) |\n| `R` CoR fields | **REG marks · ACFT manufacturer/model/serial no. · registered owner name/address · purpose PVT/COM/State · issuing authority/date**; `purpose` = statistical designation **≠ operating AUTH or MAINT category**. [TC AC 202-002 §3, 7.2](https://tc.canada.ca/en/aviation/reference-centre/advisory-circulars/advisory-circular-ac-no-202-002) |\n| `T` CoR vs register | **MTOW stored in Canadian Civil Aircraft Register (CCAR), NOT displayed on CoR**; CCAR MTOW ≠ approved AFM/POH limit. [TC AC 202-002 §7.2(3)](https://tc.canada.ca/en/aviation/reference-centre/advisory-circulars/advisory-circular-ac-no-202-002) |\n| `R` transfer | Any transfer of legal custody/control → CoR cancelled; former registered owner informs TC **in writing ≤7 days**; Part 203 leasing provisions may apply. [202.35](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-202.35.html) |\n| `R` interim | First qualifying transfer to eligible new owner → deemed interim REG; **no second successive interim transfer**; ends at earliest trigger, including **3 mo**, new CoR or further transfer. [202.36](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-202.36.html) |\n| `R` temporary | TC-issued temporary CoR for registration processing; **≤3 mo** or earlier termination. [202.25](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-202.25.html) |\n| `R` provisional | Movement/import under **specific route/dates/conditions**, not general 3-mo authority. [202.37](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-202.37.html) |\n| `R` CoA | Certificate of Airworthiness = flight authority **≠ CoR**; transfer alone does not cancel CoA if validity/airworthiness conditions continue. [507.11](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-507.11.html) |\n| `R` special | Special CoA ≠ Flight Permit; see FLT-authority classification table below; conditions control. [CAR 507.03–.04](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/FullText.html) |\n| `T` | REG≠title≠airworthiness · CoA alone cannot replace REG · dual-state REG prohibited. |\n\n`M:` **CoR: REG marks + manufacturer/model/serial + owner name/address + purpose PVT/COM/State + issue info | MTOW NOT printed | transfer→cancel + TC ≤7d | interim ≤3mo/2nd NO | TEMP ≤3mo | PROV route-specific | CoA independent**.","p":["PPL","CPL"]},{"id":"LAW-35","card":"LAW","f":"kb/law/airworthiness-documents-maintenance.md","h":"Flight authorities — CAR 507","a":"flight-authorities--car-507","c":["law-airworthy"],"kd":"knowledge","u":"law-flight-authorities-car-507","md":"| Flight authority | Classification / meaning |\n|---|---|\n| `C of A` (standard) | Aircraft conforms to approved, non-restricted type design and is safe for FLT. |\n| `Special C of A — Provisional` | Provisional type certificate. |\n| `Special C of A — Restricted` | Restricted-category type certificate or approved modified/special-purpose ACFT. |\n| `Special C of A — Amateur-built` | Built to amateur-built airworthiness requirements (AWM 549). |\n| `Special C of A — Limited` | Eligible aircraft accepted under Limited classification (e.g. certain historic/ex-military ACFT). |\n| `Special C of A — Owner-maintenance` | Eligible ACFT with owner-maintenance privileges; recreational purposes only. |\n| `Flight Permit — Experimental` | Aeronautical R&D or demonstration of compliance with airworthiness standards; not the Canadian amateur-built classification. |\n| `Flight Permit — Specific Purpose` | Defined flight of nonconforming but safe-to-fly ACFT when no CoA/Special CoA is in effect (e.g. ferry). |\n\n- `T:` Amateur-built ≠ Experimental in Canada; Normal/Utility/Aerobatic/Commuter/Transport = **type-certification categories**, not FLT-authority classifications.\n- `T PAX:` Classification alone ≠ passenger authorization; check FLT-authority conditions, operating limits, pilot privileges and applicable CARs.\n- `SRC:` [CAR 507.02–.04, .09–.11](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/FullText.html) · [AWM Standard 507.02–.04](https://tc.canada.ca/en/corporate-services/acts-regulations/list-regulations/canadian-aviation-regulations-sor-96-433/standards/standard-507-flight-authority-certificate-noise-compliance-canadian-aviation-regulations-cars).","p":[],"ph":["PPL","CPL"]},{"id":"LAW-36","card":"LAW","f":"kb/law/airworthiness-documents-maintenance.md","h":"AAIR — Annual Airworthiness Information Report · CAR 501","a":"aair--annual-airworthiness-information-report--car-501","c":["law-airworthy"],"kd":"knowledge","u":"law-aair-annual-airworthiness-information-report-car","md":"| CAVE | Rule / trap |\n|---|---|\n| `R` WHO | Canadian ACFT owner → AAIR to TC; exemptions: ultra-light; RPAS without issued/applied design approval document; reported out-of-service ACFT for ≥1 reporting period, with **TC notified forthwith on return to service**. [CAR 501.01](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-501.01.html) |\n| `R` WHEN | **JAN 1–DEC 31** reporting period → submit **≤MAR 30 following year**, or **different date agreed beforehand with TC**. [CAR 501.03](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-501.03.html) |\n| `R` HOW | Individual via **CAWIS** or **Form 24-0059** (mail/fax); approved consolidated fleet report permitted. [STD 501.01](https://tc.canada.ca/en/corporate-services/acts-regulations/list-regulations/canadian-aviation-regulations-sor-96-433/standards/standard-501-annual-airworthiness-information-report-canadian-aviation-regulations-cars) |\n| `R` DATA | REG marks · total/annual **air time** · aircraft make/model/serial · base/region · REG & flight-authority type · type certificate · empty W&B/MCTOW/config · **ENG + PROP make/model/serial if applicable** · skis/floats if applicable · significant DMG/repair certification · owner signature/CAWIS authentication. [STD 501.02](https://tc.canada.ca/en/corporate-services/acts-regulations/list-regulations/canadian-aviation-regulations-sor-96-433/standards/standard-501-annual-airworthiness-information-report-canadian-aviation-regulations-cars) |\n| `R` INSP | **Except Part IV/VII ACFT**: last annual/equivalent INSP date + certifying AME licence no. or AMO approval no.; owner-maintenance/amateur-built special CoA → inspector name. [STD 501.02(1)(c)](https://tc.canada.ca/en/corporate-services/acts-regulations/list-regulations/canadian-aviation-regulations-sor-96-433/standards/standard-501-annual-airworthiness-information-report-canadian-aviation-regulations-cars) |\n| `T` PROP | **AAIR: all applicable PROP** (fixed or variable pitch) · **separate PROP tech record: variable-pitch only** [CAR 605.92](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.92.html). |\n| `T` | **AAIR ≠ annual INSP**; AAIR notice not received ≠ exemption; out-of-service declaration requires qualified reporting + return notification. |\n\n`M:` **AAIR: owner→TC ≤MAR30 after JAN–DEC (or pre-agreed date) | CAWIS/24-0059 | air time+INSP/AME/AMO exceptions+DMG+ACFT/ENG/PROP data | O/S reported→no AAIR until RTS notice | AAIR PROP any type ≠ tech-record variable-pitch PROP only**.","p":["PPL","CPL"]},{"id":"LAW-37","card":"LAW","f":"kb/law/airworthiness-documents-maintenance.md","h":"Journey log / technical records — CAR 605.92–.97","a":"journey-log--technical-records--car-6059297","c":["law-airworthy"],"kd":"knowledge","u":"law-journey-log-technical-records-car-605-92-97","md":"| CAVE | Rule / trap |\n|---|---|\n| `R` records | Owner: journey log + airframe + **each ENG** + **each variable-pitch PROP** technical record + applicable components + empty W&B report; allowed combining cases apply. [605.92](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.92.html) |\n| `T` fixed PROP | **No separate fixed-pitch PROP technical record required**; applicable MAINT still recorded. |\n| `R` journey | Air time/defects/MAINT/releases entered per prescribed schedules/timing; PIC checks defects + MAINT status. [605.94](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.94.html) |\n| `R` carry | Journey log onboard **unless CAR 605.95 exception** (e.g. no planned LDG + engine shutdown outside DEP). [605.95](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.95.html) |\n| `R` retain | Technical-record retention varies by record/STD 625; **no universal period**. [605.96](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.96.html) |\n| `R` title transfer | Transfer **all related technical records with aeronautical product at transfer**. [605.97](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.97.html) |\n\n`M:` **JL + airframe + each ENG + variable-pitch PROP only + W&B | JL onboard unless exception | title→records | MAINT entry≠release**.","p":["PPL","CPL"],"e":["PPL"]},{"id":"LAW-38","card":"LAW","f":"kb/law/airworthiness-documents-maintenance.md","h":"Unserviceable equipment — no MEL","a":"unserviceable-equipment--no-mel","c":["law-airworthy","law-equip"],"kd":"knowledge","u":"law-unserviceable-equipment-no-mel","md":"- If equipment is required by applicable day/night VFR/IFR standard, manufacturer equipment list, certificate, AD or CAR: no takeoff with it unserviceable/removed. `[CAR 605.10]`\n- Non-required defective equipment may permit flight only if isolated/secured, placarded, and recorded as applicable. `[CAR 605.10]`\n- PIC cannot fly if safety is affected regardless of deferral mechanics. `[CAR 605.08]`\n- `M:` `REQUIRED? → SERVICEABLE? → DEFER LEGALLY? → SAFE?`","p":["PPL","CPL"],"e":["CPL"]},{"id":"LAW-39","card":"LAW","f":"kb/law/airworthiness-documents-maintenance.md","h":"Synthetic flight training equipment — 606.03","a":"synthetic-flight-training-equipment--60603","c":["law-airworthy"],"kd":"knowledge","u":"law-synthetic-training-equipment-606-03","md":"- `R` Training or skills assessment under Part IV, VI or VII on a simulator/FTD only with a **flight simulator** or **flight training device certificate** (or recognized foreign equivalent). Not RPAS.\n- `R` Certificate shows operator, ACFT type/model represented, qualification level, issue date. Stays valid only if performance kept (except per SCIG), maintained per the Simulator Manual, updated for ADs/rule changes affecting training.\n- `R` Re-evaluation: **simulator every 6 months** (valid to 1st day of **7th** month) · **FTD every 12 months** (to 1st day of **13th** month). Minister may extend **≤60 days**.\n\n- Sources: [606.03](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-606.03.html).","p":["CPL"]},{"id":"LAW-40","card":"LAW","f":"kb/law/airworthiness-documents-maintenance.md","h":"Pebble","a":"pebble","c":["law-airworthy"],"kd":"pebble","u":"law-airworthiness-documents-maintenance-pebble","md":"- DOCS `CofR on board | flight authority in effect, normally carried | AFM/POH if required | journey log unless 605.95 exception | radio licence if issued | insurance required (606.02), not a universal carry rule | valid document ≠ airworthy aircraft`\n- REG `CoR ≠ proof of title | MTOW not printed on CoR | transfer → CoR cancelled, TC in writing ≤7 days | interim ≤3 mo, no second successive | temporary ≤3 mo | provisional route-specific | CoA independent of CoR`\n- FLIGHT AUTHORITY `C of A standard | Special C of A: provisional / restricted / amateur-built / limited / owner-maintenance | Flight Permit: experimental / specific purpose | amateur-built ≠ experimental in Canada`\n- MAINT `AME = licensed individual | AMO = approved organization, not required for every private inspection | AMO → PRM | AOC → PRMCS | MPM AMO / MCM operator | DML ≠ MEL | defect entry ≠ maintenance release | abnormal occurrence → inspection before return to service`\n- RECORDS `journey log + airframe + each ENG + each variable-pitch PROP + W&B | no separate fixed-pitch PROP record | title transfer → all records`\n- AAIR `owner → TC ≤MAR 30 after JAN–DEC period, or pre-agreed date | AAIR ≠ annual inspection`\n- UNSERVICEABLE `REQUIRED? → SERVICEABLE? → DEFER LEGALLY? → SAFE? | required equipment unserviceable → no takeoff (605.10)`\n- SIM/FTD `certificate required | sim re-eval 6 mo (7th mo) | FTD 12 mo (13th mo) | +60 d max`","p":["PPL","CPL","ME"]},{"id":"LAW-41","card":"LAW","f":"kb/law/atc-radio-transponder.md","h":"Radio / transponder","a":"radio--transponder","c":["law-atc"],"kd":"knowledge","u":"law-radio-transponder","md":"- XPDR: `1200 ≤12500` | `1400 >12500` | `7600 comm` | `7700 emerg` | `7500 hijack`.\n- Call: who-called | who-you-are | where | what-want. Readback: clearance/runway/hold-short/alt/hdg/squawk.\n- `T:` “roger”≠cleared. listen before transmit. aviate before radio.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"LAW-42","card":"LAW","f":"kb/law/atc-radio-transponder.md","h":"ATC clearances / instructions","a":"atc-clearances--instructions","c":["law-atc"],"kd":"knowledge","u":"law-atc-clearances-instructions","md":"- Comply with ATC clearances/instructions received and accepted, except emergency authority or amended clearance. `[CAR 602.31]`\n- If unable/unsafe: advise ATC immediately; do not silently improvise.\n- `T:` clearance ≠ information; “roger” does not mean approval to deviate.","p":["PPL","CPL"],"e":["PPL"]},{"id":"LAW-43","card":"LAW","f":"kb/law/atc-radio-transponder.md","h":"ATS surveillance / wake / RVSM","a":"ats-surveillance--wake--rvsm","c":["law-atc"],"kd":"knowledge","u":"law-ats-surveillance-wake-rvsm","md":"| CAVE | Rule / trap |\n|---|---|\n| `G` ATS SEP | Surveillance **5 NM standard / 3 NM authorized terminal**; other minima may apply. [AIM RAC](https://tc.canada.ca/en/aviation/publications/transport-canada-aeronautical-information-manual-tc-aim) |\n| `G` vertical | **1,000 ft below FL290**; RVSM **FL290–FL410 incl. 1,000 ft** for approved ACFT; higher non-RVSM generally **2,000 ft**. |\n| `G` WAKE CAT | **S=A380 · H>136t · M>7t to <136t · L≤7t**. |\n| `G` WAKE NM | Leader→follower: **S→S/H/M/L=4/6/7/8 · H→H/M/L=4/5/6 · M→L=4**; unspecified pairs still need normal ATS SEP. |\n| `G` TKOF MIN | Specified same/close-parallel THLD: **H→following 2 min**; specified INTXN/downstream: **3 min**; **M→L same THLD advisory, INTXN 3 min**. Check configuration. |\n| `G` WAKE AVOID | Strongest heavy+clean+slow; vortex ↓ and downwind drift; avoid behind/below/downwind · jet blast/propwash ≠ vortex WAKE. |\n\n`M:` **ATS 5/3NM | RVSM FL290–410 1,000ft | WAKE S 4/6/7/8 · H 4/5/6 · M→L 4NM | H TKOF 2/3min cases**.","p":["PPL","CPL"],"e":["PPL"]},{"id":"LAW-44","card":"LAW","f":"kb/law/atc-radio-transponder.md","h":"TWR light signals — NORDO","a":"twr-light-signals--nordo","c":["law-atc","emg-comms"],"kd":"knowledge","u":"law-twr-light-signals-nordo","md":"| Signal | IN FLT | ON GND |\n|---|---|---|\n| Steady GN | LDG CLNC | TKOF CLNC |\n| Flash GN | Return for LDG (not CLNC) | Taxi CLNC |\n| Steady RED | Give way / circle | STOP |\n| Flash RED | A/D unsafe / NO LDG | Taxi clear LDG area / RWY |\n| Flash WHITE | — | Return starting point |\n| Alternating RED/GN | Extreme caution | Extreme caution |\n\n- `P:` ACK IN FLT → rock wings; night → flashing lights as prescribed. [TC AIM RAC](https://tc.canada.ca/en/aviation/publications/transport-canada-aeronautical-information-manual-tc-aim).\n- `T:` Flash GN ≠ LDG CLNC; **steady GN** = LDG CLNC.\n- `M:` **IN FLT GN steady=LDG/flash=return · RED steady=circle/flash=unsafe | GND GN steady=TKOF/flash=taxi · RED steady=STOP/flash=clear · WHITE=return**.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"LAW-45","card":"LAW","f":"kb/law/atc-radio-transponder.md","h":"Communications · weather / Communications · météo","a":"communications--weather--communications--météo","c":["law-atc","met-products"],"kd":"glossary","u":"fx-communications-weather-communications-m-t-o","md":"| Label | English | Français |\n|---|---|---|\n| RADIO | FSS/FIC information and advisories | Information et conseils FSS/FIC |\n| RCO | Remote radio link to FSS/FIC: FISE or RAAS | Liaison radio distante FSS/FIC : FISE ou RAAS |\n| DRCO | Dial-up RCO; 4 deliberate mic clicks | RCO à liaison téléphonique; 4 pressions délibérées |\n| FISE | Flight Information Service En Route | Service d’information de vol en route |\n| RAAS | Remote Aerodrome Advisory Service | Service consultatif télécommandé d’aérodrome |\n| ATIS | Recorded terminal weather and operational information; note letter | Information météo et opérationnelle enregistrée; noter lettre |\n| CLNC DEL | Clearance delivery | Délivrance des autorisations |\n| APRON | Apron movement management/advisory | Gestion/conseils des mouvements sur aire de trafic |\n| GND | Ground control: taxi instructions | Contrôle sol : instructions de circulation |\n| GND ADV | Ground advisory at certain MF sites; may relay pre-taxi clearances | Conseils au sol à certains sites MF; relais possible d’autorisations avant circulation |\n| TWR | Tower: runway and local airborne control | Tour : contrôle piste et circulation aérienne locale |\n| MF | Mandatory Frequency; mandatory reporting area, not necessarily controlled | Fréquence obligatoire; comptes rendus obligatoires, pas nécessairement contrôlé |\n| ATF | Aerodrome Traffic Frequency for uncontrolled traffic coordination | Fréquence de trafic d’aérodrome pour coordination non contrôlée |\n| TML | Terminal ATC | Contrôle terminal |\n| ARR / DEP | Arrival / departure ATC | Contrôle des arrivées / départs |\n| VFR ADV | VFR advisory service | Service consultatif VFR |\n| PAL | Peripheral station: remote ATC radio site | Station périphérique : site radio ATC distant |\n| UNICOM | Private airport information/advisory radio | Radio privée d’information/conseils d’aéroport |\n| APRT RDO | Airport Radio, usually CARS observer/communicator | Radio d’aéroport, généralement observateur/communicateur CARS |\n| A/G | Air/Ground communications | Communications air-sol |\n| MIL | Military frequency; read named unit | Fréquence militaire; lire unité indiquée |\n| VDF / UDF | VHF / UHF direction finding: bearing from your transmission | Radiogoniométrie VHF / UHF : relèvement de votre émission |\n| INTL AIR | International air-carrier communications, commonly HF | Communications transporteurs internationaux, souvent HF |\n| AWOS | Automated Weather Observation System | Système automatisé d’observation météorologique |\n| LWIS | Limited Weather Information System: wind, temperature, dew point, altimeter | Système limité : vent, température, point de rosée, calage |\n| AUTO | Local automated weather; does not meet METAR/SPECI/LWIS reporting requirements | Météo automatisée locale; ne satisfait pas exigences METAR/SPECI/LWIS |\n| PMSV | Pilot to Metro Service: military meteorological personnel | Liaison pilote–service météo militaire |\n| VOLMET | Weather for aircraft in flight: voice broadcast | Météo pour aéronefs en vol : diffusion vocale |\n| D-VOLMET | Weather via data link; D = data link | Météo par liaison de données; D = données |","p":["PPL","CPL","IR"]},{"id":"LAW-46","card":"LAW","f":"kb/law/atc-radio-transponder.md","h":"FIR · FIC","a":"fir--fic","c":["law-atc","law-airspace"],"kd":"knowledge","u":"fx-fir-fic","md":"| Label | English | Français |\n|---|---|---|\n| 7 FIR | Vancouver, Edmonton, Winnipeg, Toronto, Montréal, Moncton, Gander | Vancouver, Edmonton, Winnipeg, Toronto, Montréal, Moncton, Gander |\n| 4 briefing FIC | Kamloops, Edmonton, London, Québec | Kamloops, Edmonton, London, Québec |\n| Whitehorse | FIC for flight-plan processing/alerting; Kamloops provides telephone pilot briefings | FIC pour traitement plans de vol/alerte; Kamloops assure exposés téléphoniques |\n| Five areas | Course shorthand: Pacific, Edmonton, Ontario, Québec, Atlantic; London serves Ontario + Atlantic. These are not the seven FIRs. | Raccourci pédagogique : Pacifique, Edmonton, Ontario, Québec, Atlantique; London dessert Ontario + Atlantique. Ce ne sont pas les sept FIR. |","p":[],"ph":["PPL","CPL"]},{"id":"LAW-47","card":"LAW","f":"kb/law/atc-radio-transponder.md","h":"Radar service and vectors — AIM RAC 1.5","a":"radar-service-and-vectors--aim-rac-15","c":["law-atc","ifr-enr"],"kd":"knowledge","u":"law-radar-service-vectors-rac-1-5","md":"- Vectoring IFR (and CVFR, IFR arrivals): ATC assumes terrain/obstacle clearance until normal nav resumes. [RAC 1.5.2, 1.5.5(a)]\n- ATC tells you when vectors end — except vectors to final or circuit: approach clearance = resume own nav. [RAC 1.5.2]\n- Identified ≠ relieved of see-and-avoid or terrain responsibility. [RAC 1.5.2]\n- Comm failure on low vector: climb to published minimum altitude unless VMC. [RAC 1.5.5(a)]\n- VFR on vectors: pilot keeps terrain, traffic, VFR weather responsibility. [RAC 1.5.4, 1.5.5(b)]\n- Identified: position reports over compulsory points no longer required until told to resume. [RAC 8.1]\n- `T:` \"radar contact\" ≠ terrain clearance for VFR.","p":["IR"]},{"id":"LAW-48","card":"LAW","f":"kb/law/atc-radio-transponder.md","h":"Transponder, SSR, PSR, ADS-B — AIM COM 7–8","a":"transponder-ssr-psr-ads-b--aim-com-78","c":["law-atc","nav-radio"],"kd":"knowledge","u":"law-transponder-ssr-psr-ads-b-com-7-8","md":"| System | Principle | Limit |\n|---|---|---|\n| PSR | range + azimuth from reflected RF | no transponder needed; no altitude/ID |\n| SSR | interrogates transponder 1030 MHz, reply 1090 MHz; range by timing | sees only aircraft with working transponder |\n| Mode C | adds pressure altitude | |\n| Mode S | selective address; base for ADS-B Out + TCAS II | |\n| ADS-B | aircraft broadcasts own position (1090 ES via Mode S) | ATS matches flight ID to flight plan |\n\n- Codes: VFR `1200` ≤12 500 ASL · `1400` above · IFR high level `2000` unless assigned · `7500` unlawful (only once ATC told) · `7600` comm · `7700` emergency. [COM 8.2–8.8]\n- IDENT only when ATS asks. [COM 8.5]\n- `T:` SSR has longer range + positive ID; PSR still sees non-transponder targets. [COM 7.1–7.2]","p":["IR"]},{"id":"LAW-49","card":"LAW","f":"kb/law/atc-radio-transponder.md","h":"Noise abatement and noise-restricted runways — 602.105 / .106","a":"noise-abatement-and-noise-restricted-runways--602105--106","c":["law-atc"],"kd":"knowledge","u":"law-noise-abatement-602-105-106","md":"- `R` At or near an A/D, follow noise abatement procedures and requirements published in the **CAP or CFS**: preferential RWYs · minimum noise routes · hours with operations prohibited/restricted · ARR/DEP procedures · flight duration · training flight restrictions · VFR/visual approaches · simulated approaches · minimum altitude near the A/D.\n- `R` **Subsonic turbojet aeroplane >34 000 kg MCTOW** taking off from a listed noise-restricted RWY → **noise compliance certificate on board** (or validated foreign one). Not when PIC declared an emergency, medevac/other emergency air operation, or departing after an emergency landing. Listed: Vancouver, Calgary, Edmonton (Blatchford, International), Winnipeg, Hamilton, Toronto Pearson, Ottawa, Montréal Trudeau (all RWYs at Blatchford and Trudeau).\n\n- Sources: [602.105](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-602.105.html), [602.106](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-602.106.html).","p":["PPL","CPL"]},{"id":"LAW-50","card":"LAW","f":"kb/law/atc-radio-transponder.md","h":"ADIZ — 602.145","a":"adiz--602145","c":["law-atc"],"kd":"knowledge","u":"law-adiz-602-145","md":"- `R` Before entering and within the **ADIZ** (dimensions in the Designated Airspace Handbook): flight plan or itinerary filed with an ATS unit or CARS station.\n- `R` DEP point has filing facilities → file **before TKOF**. VFR from outside ADIZ: include **estimated time and point of ADIZ entry**, and ASAP after TKOF radio a position report (position, altitude, DEP A/D, entry time and point) to ATC, FSS or CARS. VFR departing inside ADIZ: same report without entry data.\n- `R` No filing facilities → file **by radio ASAP after TKOF** (VFR: include entry estimate).\n- `R` VFR revises and reports when not expected within **±5 min** of a reporting point, entry point or destination inside the ADIZ, or within **20 NM** of the entry point or route centreline.\n\n- Sources: [602.145](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-602.145.html).","p":["PPL","CPL"],"e":["CPL"]},{"id":"LAW-51","card":"LAW","f":"kb/law/atc-radio-transponder.md","h":"Common frequency area (CFA)","a":"common-frequency-area-cfa","c":["law-atc"],"kd":"knowledge","u":"law-common-frequency-area-cfa","md":"- `R` CFA = area with a designated frequency published for use by **any aircraft**, for **air-to-air** traffic awareness.\n- `T` CFA is **not a class of airspace**, its frequency is **not monitored by ATC**, and it is **not for use at uncontrolled aerodromes** (those use MF / ATF; 123.2 MHz where none is published).\n\n- Sources: [TC AC 100-001 glossary](https://tc.canada.ca/en/aviation/reference-centre/advisory-circulars/advisory-circular-ac-no-100-001); TC AIM GEN 5.1 glossary; RAC 4.5.","p":["CPL"],"e":["CPL"]},{"id":"LAW-52","card":"LAW","f":"kb/law/atc-radio-transponder.md","h":"Operations on intersecting runways, LAHSO — RAC 4.4.9","a":"operations-on-intersecting-runways-lahso--rac-449","c":["law-atc"],"kd":"knowledge","u":"law-intersecting-runways-lahso","md":"- `R` LAHSO needs pilot participation: accept **only if the ACFT can land and stop within the available landing distance**. PIC has **complete authority to accept or decline**; must decline if safety compromised; unsure → tell ATC immediately.\n- `R` Conditions: runway **dry** (no wet/contaminated RSC, no precipitation observed or reported) · no TS, turbulence or wind shear affecting hold-short · LDA (THR to **200 ft** short of intersecting RWY) published in **CAP and CFS** · advisories on ATIS/voice early · **ceiling ≥1 000 ft, visibility ≥3 SM** · crosswind ≤**25 kt**, tailwind **<5 kt** (ATC may allow ≤10 kt tactically: include in landing distance or decline).\n- `R` Hold-short line **200 ft** before the intersecting RWY edge (red/white mandatory signs, LAHSO lights where installed). ACFT grouped by stopping distance (groups 1–6); not cleared if group distance > LDA.\n- `R` Pilot reads back the **hold-short instruction**, stops 200 ft short; rejected landing → keep separation, tell ATC ASAP.\n\n- Sources: [TC AIM RAC 4.4.9](https://tc.canada.ca/sites/default/files/2026-10/aim-2026-2_rac_en.pdf).","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"LAW-53","card":"LAW","f":"kb/law/atc-radio-transponder.md","h":"Pebble","a":"pebble","c":["law-atc"],"kd":"pebble","u":"law-atc-radio-transponder-pebble","md":"- XPDR `1200 ≤12,500 | 1400 >12,500 | 7600 comm | 7700 emergency | 7500 hijack`\n- ATC CAR 602.31 `comply with clearances/instructions received and accepted, except emergency authority or amended clearance | unable → advise immediately | “roger” ≠ cleared`\n- LIGHTS `in flight: steady green = LDG clearance / flashing green = return for landing / steady red = give way, circle / flashing red = unsafe, no landing | ground: steady green = TKOF / flashing green = taxi / steady red = STOP / flashing red = taxi clear / flashing white = return to start`\n- ATS / WAKE `surveillance 5 NM standard / 3 NM authorized terminal | 1,000 ft below FL290; RVSM FL290–FL410 1,000 ft approved ACFT | wake S→S/H/M/L 4/6/7/8 NM · H→H/M/L 4/5/6 · M→L 4 | H ahead: 2 min same threshold, 3 min intersection`\n- RADAR `IFR vectors: ATC owns terrain until vectors end · approach clearance = own nav | VFR keeps terrain | identified → no compulsory reports | SSR 1030/1090 needs XPDR · PSR sees all · IDENT only on request`\n- NOISE `CAP/CFS procedures binding | turbojet >34000 kg on listed RWY → noise certificate on board, not in emergency`\n- ADIZ `FPL/FIT before entry | VFR: entry time + point, position report after TKOF | revise if >±5 min or >20 NM`\n- CFA `published frequency, any ACFT, air-to-air awareness | not airspace class | not ATC-monitored | not for uncontrolled A/D (MF/ATF)`\n- LAHSO `PIC may decline | dry RWY, ceiling 1000, vis 3 SM, xwind ≤25, tailwind <5 (≤10 tactical) | stop 200 ft short | read back hold short`","p":["PPL","CPL","IR"]},{"id":"LAW-54","card":"LAW","f":"kb/law/commercial-ops-604-702-705-duty-time.md","h":"Commercial scope / flight-time comparison — September 2026","a":"commercial-scope--flight-time-comparison--september-2026","c":["law-commercial"],"kd":"knowledge","u":"law-commercial-scope-flight-time-comparison-septembe","md":"- PORD: CAR 604.03 covers transport of passengers/goods in specified Canadian aircraft: large aeroplane, turbojet, or pressurized turbine aeroplane certificated for more than six passenger seats, subject to its exceptions. No fare payment is needed to trigger this test.\n- Ordinary private C150 flying does not automatically become Subpart 604 operation.\n\nThe shared flight/duty section below contains current limits and applicability.\n\n- Sources: [604.03](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.03.html), [604.98](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.98.html), [700.27](https://laws-lois.justice.gc.ca/eng/regulations/sor-96-433/page-83.html), [404.04](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-404.04.html).","p":["CPL"]},{"id":"LAW-55","card":"LAW","f":"kb/law/commercial-ops-604-702-705-duty-time.md","h":"Flight time · FDT · FDP / Temps de vol · service","a":"flight-time--fdt--fdp--temps-de-vol--service","c":["law-commercial"],"kd":"knowledge","u":"law-flight-time-fdt-fdp-temps-de-vol-service","md":"| Label | English | Français |\n|---|---|---|\n| Terms / Termes | FDT = flight/duty time (general shorthand). FDP = flight duty period; flight time, FDP, work and rest are separate clocks. FPD = freezing-point depressant (fluid). | FDT = abréviation générale temps vol/service. FDP = période de service de vol; vol, service, travail et repos : compteurs distincts. FPD = abaisseur du point de congélation (liquide). |\n| Applicability / Portée | 700 Division III: applicable commercial operations. 604 private operators have separate limits; ordinary private PPL/CPL flying is not automatically 604. 702 aerial work and 700 Division IV medevac differ. | 700 division III : opérations commerciales applicables. Exploitants privés 604 : limites distinctes; vol privé ordinaire PPL/CPL pas automatiquement 604. Travail aérien 702 et évacuation médicale division IV : règles distinctes. |\n| 700.27 flight time | 112 h/28 days; 300 h/90 days; 1000 h/365 days. Single-pilot: 8 h/24 consecutive hours. | 112 h/28 jours; 300 h/90 jours; 1000 h/365 jours. Monopilote : 8 h/24 heures consécutives. |\n| 604.98 flight time | 120 h/30 days; 300 h/90 days; 1200 h/12 consecutive months. Single-pilot IFR: 8 h/24 h. | 120 h/30 jours; 300 h/90 jours; 1200 h/12 mois consécutifs. IFR monopilote : 8 h/24 h. |\n| FDP table key | 700.28: select average scheduled flight duration, number of flights, and applicable start-time reference. No universal 14-hour limit. Tables below are baseline, before special adjustments. | 700.28 : choisir durée moyenne des vols prévus, nombre de vols et référence horaire applicable. Pas de limite universelle 14 h. Tableaux de base avant adaptations particulières. |\n| Columns A / B / C | Average <30 min: A=1–11 flights, B=12–17, C=18+. Average 30–<50: A=1–7, B=8–11, C=12+. Average ≥50: A=1–4, B=5–6, C=7+. | Moyenne <30 min : A=1–11 vols, B=12–17, C=18+. Moyenne 30–<50 : A=1–7, B=8–11, C=12+. Moyenne ≥50 : A=1–4, B=5–6, C=7+. |\n| 00:00–03:59 | FDP maximum A / B / C = 9 / 9 / 9 hours. | FDP maximum A / B / C = 9 / 9 / 9 heures. |\n| 04:00–04:59 | FDP maximum A / B / C = 10 / 9 / 9 hours. | FDP maximum A / B / C = 10 / 9 / 9 heures. |\n| 05:00–05:59 | FDP maximum A / B / C = 11 / 10 / 9 hours. | FDP maximum A / B / C = 11 / 10 / 9 heures. |\n| 06:00–06:59 | FDP maximum A / B / C = 12 / 11 / 10 hours. | FDP maximum A / B / C = 12 / 11 / 10 heures. |\n| 07:00–12:59 | FDP maximum A / B / C = 13 / 12 / 11 hours. | FDP maximum A / B / C = 13 / 12 / 11 heures. |\n| 13:00–16:59 | FDP maximum A / B / C = 12.5 / 11.5 / 10.5 hours. | FDP maximum A / B / C = 12.5 / 11.5 / 10.5 heures. |\n| 17:00–21:59 | FDP maximum A / B / C = 12 / 11 / 10 hours. | FDP maximum A / B / C = 12 / 11 / 10 heures. |\n| 22:00–22:59 | FDP maximum A / B / C = 11 / 10 / 9 hours. | FDP maximum A / B / C = 11 / 10 / 9 heures. |\n| 23:00–23:59 | FDP maximum A / B / C = 10 / 9 / 9 hours. | FDP maximum A / B / C = 10 / 9 / 9 heures. |\n| Day VFR / VFR jour | All flights day VFR: 700.28(9) uses column A values irrespective of flight count. Positioning is not a flight for table count. | Tous vols VFR jour : 700.28(9) utilise valeurs colonne A indépendamment du nombre de vols. Mise en place non comptée comme vol dans tableau. |\n| Example / Exemple | Start 08:00, five 60-min flights → column B →12 h FDP (baseline). All day VFR →13 h. Flight time is 5 h, not 12 h. | Début 08:00, cinq vols de 60 min → colonne B →12 h FDP de base. Tous VFR jour →13 h. Temps de vol =5 h, pas 12 h. |\n| Work / Travail 700.29 | 60 h/7 d or qualifying 70 h/7 d option; 192 h/28 d; 2200 h/365 d. Each option has its own time-off conditions. | 60 h/7 j ou option admissible 70 h/7 j; 192 h/28 j; 2200 h/365 j. Conditions de congé propres à chaque option. |\n| Rest / Repos 700.40 | Home: 12 h OR 11 h + travel to/from rest OR 10 h in operator-provided suitable accommodation. Away: 10 h in suitable accommodation. Special schedules may require more. | Base : 12 h OU 11 h + trajets aller-retour repos OU 10 h en hébergement convenable fourni. Hors base : 10 h en hébergement convenable. Horaires particuliers : repos supplémentaire possible. |\n| Fatigue trap | Being under a numeric limit does not establish fitness. Acclimatization, reserve/standby, split duty, extensions and augmented crews require their specific rules. | Respecter limite numérique ne prouve pas aptitude. Acclimatation, réserve/attente, service fractionné, prolongations et équipage renforcé : règles spécifiques. |\n| 604 FDP base | 604.99: 14 h/24 h; 15 h only if preceding 30 d total FDP ≤70 h OR preceding REST ≥24 h. | 604.99 : 14 h/24 h ; 15 h si FDP total des 30 j précédents ≤70 h OU repos précédent ≥24 h. |\n| 604 split 604.100 | Break ≥4 consecutive h in suitable accommodation + notice before first FLT/standby → FDP extension MIN(½ break,4 h). | Pause ≥4 h consécutives en hébergement convenable + préavis avant premier vol/veille → prolongation FDP MIN(½ pause,4 h). |\n| 604 split REST | Next minimum REST += at least split FDP extension; break stays INSIDE FDP; flight time limits unchanged. | Repos minimal suivant augmenté d'au moins la prolongation ; pause DANS le FDP ; limites de temps de vol inchangées. |\n| 604 UOC 604.102 | Unexpected operational circumstance AFTER FDP starts; PIC consults crew → safe FDP extension ≤3 h; next min REST += extension; PIC advises operator, retained 5 y. | Circonstance opérationnelle imprévue APRÈS début FDP ; CDB consulte équipage → prolongation sûre ≤3 h ; repos minimal suivant + prolongation ; avis exploitant, conservation 5 ans. |\n| 700 split 700.50 | Break ≥60 min in suitable accommodation; deduct 45 min THEN credit 100% at 00:00–05:59 / 50% at 06:00–23:59 (acclimatized time). | Pause ≥60 min en hébergement convenable ; retrancher 45 min PUIS crédit 100 % à 00:00–05:59 / 50 % à 06:00–23:59 (heure acclimatée). |\n| 700 split special | UOC replanning after FDP begins → 50% credit after 45-min deduction; night duty split ≤3 consecutive nights; reserve extension +2 h only with ≤2 FLTs after break. | Replanification pour imprévu après début FDP → crédit 50 % après déduction 45 min ; service de nuit ≤3 nuits consécutives ; réserve +2 h seulement si ≤2 vols après pause. |\n| 700 UOC 700.63 | UOC within 60 min after FDP starts; PIC consults ALL crew; max FDP +1 h single / +2 h unaugmented / +3 h augmented 1 FLT / +2 h augmented 2–3 FLTs. | Imprévu dans les 60 min après début FDP ; CDB consulte TOUT équipage ; max +1 h solo / +2 h non renforcé / +3 h renforcé 1 vol / +2 h renforcé 2–3 vols. |\n| 700 UOC REST / 700.64 | 700.63 extension → following REST += extension; PIC notifies operator at FDP end. 700.64 post-start split only on PIC agreement BEFORE ground break. | Prolongation 700.63 → repos suivant + prolongation ; CDB avise exploitant à fin FDP. 700.64 : fractionnement en cours seulement avec accord CDB AVANT pause au sol. |\n| FDP vs FLT trap | SPLIT/UOC increases permitted FDP, NOT flight-time allowance (604.98/700.27); split + UOC not automatically cumulative; Part 700 Division IV MEDEVAC differs. | Fractionnement/imprévu prolonge FDP, PAS temps de vol permis (604.98/700.27) ; crédits non automatiquement cumulables ; Division IV MEDEVAC différente. |","p":["CPL"],"e":["CPL"]},{"id":"LAW-56","card":"LAW","f":"kb/law/commercial-ops-604-702-705-duty-time.md","h":"FDP extensions / split / unforeseen — CAR 604 vs 700 (Division III)","a":"fdp-extensions--split--unforeseen--car-604-vs-700-division-iii","c":["law-commercial"],"kd":"knowledge","u":"law-fdp-extensions-split-unforeseen-car-604-vs-700-d","md":"| CAVE | 604 · Private operator | 700 · Commercial general fatigue regime |\n|---|---|---|\n| `R` Base FDP | **14 h/24 h**; **15 h/24 h** iff previous 30 d total FDP **≤70 h OR previous REST ≥24 h**. [604.99](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.99.html) | **700.28** A/B/C = **9–13 h** based on start-time reference + scheduled FLT count/average duration (table above). |\n| `R` Split | **604.100:** planned break **≥4 consecutive h** in suitable accommodation; prior notice before first FLT/standby. | **700.50:** break **≥60 consecutive min** in suitable accommodation; time windows at acclimatized location. |\n| `F` Split EXT | `MIN(break ÷ 2, 4 h)` → FDP MAX increases by credit. | Deduct **45 min** first; **00:00–05:59 → 100%** of remainder; **06:00–23:59 → 50%**; if replanned after FDP start due to unforeseen circumstances → **50%**. [700.50](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.50.html) |\n| `R` Split REST | **Next minimum REST += ≥actual FDP extension**. [604.100(c)](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.100.html) | REST under **700.40**, plus other applicable provisions; **700.50 does not itself mandate REST += split credit**. |\n| `R` Split restrictions | No generic automatic extension without all 604.100 conditions. | Night-duty split maximum **3 consecutive nights**; reserve duty +2 h only under 700.50(5), with **≤2 FLTs after break**. |\n| `R` UOC timing | **604.102:** unforeseen operational circumstance **after FDP begins**; PIC consults other FLT crew; safe. | **700.63:** UOC **within 60 min of FDP beginning**; PIC consults **all crew** about fatigue; may reduce FDP, extend FDP, or extend REST. |\n| `R` UOC MAX | **+3 h** FDP. [604.102](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.102.html) | **+1 h** single-pilot · **+2 h** non-augmented · **+3 h** augmented +1 scheduled FLT · **+2 h** augmented +2–3 scheduled FLTs. [700.63](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.63.html) |\n| `R` UOC special | PIC informs private operator of UOC + EXT; operator retains notification **5 yr**. | Further UOC **after TKOF of final FLT already extended** → PIC may continue to DESTN/ALTN; PIC notifies operator **at FDP end**. [700.63(2),(4)](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.63.html) |\n| `R` UOC REST | **Next minimum REST += ≥actual FDP extension**. | **REST after extended FDP += ≥actual extension**. [700.63(3)](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.63.html) |\n| `R` UOC→split | `604.102` unexpected EXT ≠ `604.100` planned split. | **700.64:** post-start UOC may trigger split **only if PIC agrees before scheduled ground break**; after consulting crew, refuse if fatigue jeopardizes safety; waiting **before decision ≠ credited break**. [700.64](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.64.html) |\n| `T` | Extension changes **FDP MAX**, **not FLT time** limits under 604.98; split/UOC credits **not automatically stackable**. | Extension changes **FDP MAX**, **not FLT time** limits under 700.27; night split ≠ UOC night credit; no invented universal split cap. |\n\n- `M · L4` **604: 14h | 15h if 30d FDP≤70h OR prior REST≥24h | SPLIT≥4h→+MIN(½break,4h) + next REST≥EXT | UOC after start +3h MAX + next REST≥EXT, PIC→operator, 5yr record.**\n- `M · L4` **700 Div III: FDP 700.28 matrix | SPLIT≥60min→deduct45min, remaining ×100% (00–0559) / ×50% (06–2359 or UOC replan) | UOC ≤60min from FDP start→+1h single/+2h unaug/+3h aug1FLT/+2h aug2–3FLT + next REST≥EXT | 700.64 post-start split only before break + PIC consent.**\n\n\nShared additions reviewed 19 October 2026: [source editions and scope](../../CONTENT_REVIEW.md#operational-additions--19-october-2026).","p":["CPL"],"e":["CPL"]},{"id":"LAW-57","card":"LAW","f":"kb/law/commercial-ops-604-702-705-duty-time.md","h":"Pebble","a":"pebble","c":["law-commercial"],"kd":"pebble","u":"law-commercial-ops-604-702-705-duty-time-pebble","md":"- 604 `large aeroplane, turbojet, or pressurized turbine >6 passenger seats | no fare needed | ordinary private C150 flying ≠ 604`\n- FLIGHT TIME `700.27: 112 h/28 d, 300 h/90 d, 1000 h/365 d, single-pilot 8 h/24 h | 604.98: 120 h/30 d, 300 h/90 d, 1200 h/12 mo, single-pilot IFR 8 h/24 h`\n- FDP 700.28 `9–13 h by start time + flights + average duration | no universal 14 h | all day VFR → column A | positioning not a flight for the count`\n- 604 FDP `14 h/24 h; 15 h iff previous 30 d FDP ≤70 h OR previous rest ≥24 h`\n- WORK / REST `700.29: 60 h/7 d (or qualifying 70 h option), 192 h/28 d, 2200 h/365 d | 700.40 home: 12 h, or 11 h + travel, or 10 h in operator accommodation; away: 10 h`\n- UOC `604.102: +3 h | 700.63: +1 h single-pilot, +2 h non-augmented | next rest += actual extension`","p":["CPL"]},{"id":"LAW-58","card":"LAW","f":"kb/law/elt-survival-equipment.md","h":"ELT — CAR 605.38–.40","a":"elt--car-6053840","c":["law-elt"],"kd":"knowledge","u":"law-elt-car-605-38-40","md":"| CAVE | Rule / trap |\n|---|---|\n| `R` general | Approved ELT(s) required subject to type/operation + exceptions; modern approved ELT **406 MHz distress + 121.5 MHz homing**. [605.38](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.38.html) |\n| `R` exceptions | Glider/balloon/airship/ultralight/gyroplane; **FTU flight training ≤25 NM DEP**; flight test; specified new-ACFT delivery/manufacture; parachuting **≤25 NM**; qualifying foreign-registered 406 beacon; or compliant unserviceable-ELT operation. [605.38(3)](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.38.html) |\n| `R` over water | Where liferafts required, relevant **type S** ELT rules; passenger large ME turbojet additional ELT rules. See operation-specific table. [605.38](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.38.html) |\n| `R` UNSVCBL | Missing/defective ELT → only fly if **605.39 conditions** met; placard, records, rectification + applicable time limit. [605.39](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.39.html) |\n| `G` test | 121.5 functional test: first **5 min of UTC HR**, **≤5 sec TX**; 406 testing **MFR instructions only**. [AIM SAR 3.8](https://tc.canada.ca/en/aviation/publications/transport-canada-aeronautical-information-manual-tc-aim) |\n| `T` | FTU ≤25 NM ≠ general exemption for private flights; required ELT count/type varies. |\n\n`M:` **ELT 406+121.5 | FTU training ≤25NM exempt | other 605.38 exceptions | UNSVCBL→605.39 | test first5min UTC HR ≤5s; 406 MFR**.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"LAW-59","card":"LAW","f":"kb/law/elt-survival-equipment.md","h":"Over water · survival / Survol de l’eau · survie","a":"over-water--survival--survol-de-leau--survie","c":["law-elt"],"kd":"knowledge","u":"law-over-water-survival-survol-de-l-eau-survie","md":"| Label | English | Français |\n|---|---|---|\n| Flotation trigger | Water takeoff/landing OR unable to reach shore after engine failure: one life preserver, individual flotation device or PFD per person. [602.62(1)] | Décollage/amerrissage OU rive inaccessible après panne moteur : un gilet, dispositif individuel de flottaison ou VFI par personne. [602.62(1)] |\n| 50 NM / Shore | Landplane >50 NM from shore: LIFE PRESERVER for each person, even if engine-out shore reach is possible. Accessible while seated. [602.62(2),(4)] | Avion terrestre >50 NM rive : GILET DE SAUVETAGE par personne, même si rive accessible après panne. Accessible depuis siège. [602.62(2),(4)] |\n| Raft / Radeau — SE | Single engine, or multi unable to maintain flight with any engine failed: rafts beyond lesser of 100 NM or 30 min at FILED cruise speed from suitable emergency landing site. [602.63(1)] | Monomoteur, ou multi incapable de maintenir vol avec panne d’un moteur : radeaux au-delà du moindre de 100 NM ou 30 min à vitesse croisière DÉPOSÉE depuis lieu convenable d’atterrissage d’urgence. [602.63(1)] |\n| Raft / Radeau — ME | Multi able to maintain flight with any engine failed: lesser of 200 NM/60 min. Transport-category aeroplane exception: up to lesser of 400 NM/120 min. [602.63(2)–(3)] | Multi capable de maintenir vol avec panne d’un moteur : moindre de 200 NM/60 min. Exception avion catégorie transport : jusqu’au moindre de 400 NM/120 min. [602.63(2)–(3)] |\n| Calculation / Calcul | SE threshold = min(100, filed kt ×0.5) NM. Filed 120 kt →60 NM; 180 kt →90 NM; 240 kt →100 NM. Beyond threshold triggers raft carriage. | Seuil monomoteur = min(100, kt déposés ×0,5) NM. 120 kt →60 NM; 180 kt →90 NM; 240 kt →100 NM. Au-delà : radeau requis. |\n| Capacity / Capacité | Total raft rated capacity covers everyone. Stow accessible, visibly marked near exit; attached kit: shelter, water/purification, visual distress signals, suited to area/season. [602.63(6)] | Capacité nominale totale radeaux pour tous. Accessibles, emplacement signalé près sortie; trousse attachée : abri, eau/purification, signaux visuels, adaptée région/saison. [602.63(6)] |\n| Shore ≠ landing site | Flotation test uses shore reach/distance; raft test uses a SUITABLE EMERGENCY LANDING SITE. Crossing width is not automatically distance from that site. | Flottaison : rive accessible/distance rive; radeaux : LIEU CONVENABLE D’ATTERRISSAGE D’URGENCE. Largeur traversée pas automatiquement distance de ce lieu. |\n| 703 seaplane | 703.83: inflatable flotation worn on/above water; COM procedures and PIC instruction. Exception: person on stretcher, incubator or similar device. Not a blanket rule for every private landplane. | 703.83 : dispositif gonflable porté sur/au-dessus eau; procédures manuel exploitation et instruction CdB. Exception : civière, incubateur ou dispositif similaire. Pas règle universelle avion terrestre privé. |\n| Land survival / Survie terre | 602.61: FIRE + SHELTER + WATER + SIGNAL, for everyone and climate. 25-NM exception requires staying within 25 NM of departure aerodrome AND surface-station radio capability throughout. Other listed exceptions exist. | 602.61 : FEU + ABRI + EAU + SIGNAL, pour tous selon climat. Exception 25 NM : rester à 25 NM aérodrome départ ET capacité radio avec station au sol tout le vol. Autres exceptions prévues. |\n| Planning / Préparation | Recommendation: wear suitable inflatable flotation, brief evacuation and inflate only outside; assess cold-water exposure and rescue delay. Equipment carriage alone does not make a crossing safe. | Recommandation : porter dispositif gonflable adapté, expliquer évacuation et gonfler seulement dehors; évaluer eau froide et délai secours. Emport seul ne rend pas traversée sûre. |","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"LAW-60","card":"LAW","f":"kb/law/elt-survival-equipment.md","h":"ELT / emergency equipment","a":"elt--emergency-equipment","c":["law-elt"],"kd":"knowledge","u":"sys-elt-emergency-equipment","md":"- Know activation, remote switch, antenna, battery/inspection status, survival equipment and extinguisher.\n- After forced landing: ELT confirm ON, evacuate, fire risk, first aid, shelter/signalling.\n- `T:` ELT does not replace flight plan/itinerary closure or survival planning.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"LAW-61","card":"LAW","f":"kb/law/elt-survival-equipment.md","h":"Pebble","a":"pebble","c":["law-elt"],"kd":"pebble","u":"law-elt-survival-equipment-pebble","md":"- ELT `406 MHz distress + 121.5 homing | FTU flight training ≤25 NM DEP exempt, not private flights generally | unserviceable → 605.39 conditions | 121.5 test: first 5 min of UTC hour, ≤5 s; 406 per MFR only`\n- FLOTATION 602.62 `water TKOF/LDG or cannot reach shore engine-out: one per person | landplane >50 NM from shore: life preserver each, accessible while seated`\n- RAFTS 602.63 `SE (or ME unable to hold flight OEI): beyond lesser of 100 NM / 30 min at filed cruise | ME able: lesser of 200 NM / 60 min | measured from a suitable emergency landing site, not shore`\n- SURVIVAL 602.61 `fire + shelter + water + signal | 25-NM exception needs radio capability with a surface station throughout`","p":["PPL","CPL"]},{"id":"LAW-62","card":"LAW","f":"kb/law/fatigue-700.md","h":"PEDs, Division III scope, records, home base, meals — 700.12 / .19 / .20 / .36 / .37","a":"peds-division-iii-scope-records-home-base-meals--70012--19--20--36--37","c":["law-fatigue"],"kd":"knowledge","u":"law-700-ped-scope-records-home-base-meals","md":"- `R` PEDs (703 / 704 / 705): despite 602.08(1), operator **may** permit a PED once it has **validated** no adverse effect on ACFT operation or systems in any phase of flight.\n- `R` Division III fatigue rules **do not apply** to 702 (aerial work) operations or to **medevac** flights (Division IV instead).\n- `R` Times of day: acclimatized → local time where the crew member is; not acclimatized → local time at the last place they were acclimatized.\n- `R` Monitoring system for flight time, FDP, hours of work, rest, described in the COM. Records per crew member: flight times · start/end/duration of each FDP, duty period and rest · time free from duty · PIC notices under 700.63(4). Keep **24 months**.\n- `R` Every flight crew member gets an assigned **home base**.\n- `R` Meal break: **≥15 min every 6 h** of FDP to eat and drink.\n\n- Sources: [700.12](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.12.html), [700.19](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.19.html), [700.20](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.20.html), [700.36](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.36.html), [700.37](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.37.html).","p":["CPL"]},{"id":"LAW-63","card":"LAW","f":"kb/law/fatigue-700.md","h":"Disruptive schedules, time-zone rest, positioning, consecutive night FDPs — 700.41 / .42 / .43 / .51","a":"disruptive-schedules-time-zone-rest-positioning-consecutive-night-fdps--70041--42--43--51","c":["law-fatigue"],"kd":"knowledge","u":"law-700-disruptive-schedules-time-zones-positioning-nights","md":"- `R` Disruptive schedule: on top of 700.40 rest, **one local night's rest** between late/night duty → following early duty, and between early duty → following late/night duty. Not required where local time differs **>4 h** from the last acclimatized location.\n- `R` FDP ends **away from home base**, start vs end local time differs **4 h** → **11 consecutive h** rest; **>4 h** → **14 consecutive h**, in suitable accommodation.\n- `R` FDP starts in another time zone and **ends at home base**:\n\n| Difference start vs home | Condition | Rest before next FDP |\n|
