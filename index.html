l.md":"IFR planning, fuel & alternates / Planification IFR, carburant et dégagement","kb/ifr/rass.md":"RASS / remote altimeter setting / RASS / calage altimétrique éloigné","kb/ifr/recall.md":"IFR — exam method & traps / IFR — méthode d’examen et pièges","kb/ifr/rules-privileges.md":"IFR rules, privileges & recency / Règles, privilèges et récence IFR"}},{"id":"AGK","en":"Knowledge · Aeronautics","fr":"Connaissances · Aéronautique","file":"kb/agk/README.md","reader":null,"title":null,"kb":true,"files":{"kb/agk/circuit-approach-landing.md":"Circuit, approach & landing / Circuit, approche et atterrissage","kb/agk/engines-powerplant.md":"Engines & powerplant / Moteurs et groupe motopropulseur","kb/agk/flight-operations-handling.md":"Flight operations & handling / Opérations aériennes et pilotage","kb/agk/fuel-fuel-systems.md":"Fuel & fuel systems / Carburant et circuits carburant","kb/agk/gyro-instruments.md":"Gyro & vacuum instruments / Instruments gyroscopiques et à dépression","kb/agk/human-factors-decision-making.md":"Human factors & decision-making / Facteurs humains et prise de décision","kb/agk/load-factor-turns-manoeuvring-speed.md":"Load factor, turns & manoeuvring speed / Facteur de charge, virages et vitesse de manœuvre","kb/agk/pitot-static-instruments.md":"Pitot-static instruments / Instruments anémobarométriques","kb/agk/pressurization.md":"Pressurization / Pressurisation","kb/agk/stall-spin-spiral.md":"Stall, spin & spiral / Décrochage, vrille et spirale","kb/agk/takeoff-climb-cruise-glide-landing-performance.md":"Takeoff, climb, cruise, glide & landing performance / Performances : décollage, montée, croisière, plané, atterrissage","kb/agk/theory-of-flight.md":"Theory of flight / Théorie du vol","kb/agk/v-speeds-airspeed-limits.md":"V-speeds & airspeed limits / Vitesses caractéristiques et limites","kb/agk/weight-balance.md":"Weight & balance / Masse et centrage"}},{"id":"LAW","en":"Knowledge · Air law","fr":"Connaissances · Droit aérien","file":"kb/law/README.md","reader":null,"title":null,"kb":true,"files":{"kb/law/aerial-work-702.md":"Aerial work (CAR 702) / Travail aérien (RAC 702)","kb/law/air-law-procedures.md":"Air law & procedures / Droit aérien et procédures","kb/law/air-taxi-703-706.md":"Air taxi (CAR 703) and maintenance control (706) / Taxi aérien (RAC 703) et contrôle de la maintenance (706)","kb/law/airspace-vfr-minima-cruising-altitudes.md":"Airspace, VFR minima & cruising altitudes / Espace aérien, minimums VFR et altitudes de croisière","kb/law/airworthiness-documents-maintenance.md":"Airworthiness, documents & maintenance / Navigabilité, documents et maintenance","kb/law/atc-radio-transponder.md":"ATC, radio & transponder / ATC, radio et transpondeur","kb/law/commercial-ops-604-702-705-duty-time.md":"Commercial ops (604 / 702–705) & duty time / Exploitation commerciale (604 / 702–705) et temps de service","kb/law/elt-survival-equipment.md":"ELT & survival equipment / ELT et équipement de survie","kb/law/fatigue-700.md":"Flight crew fatigue rules (CAR 700 Div III / IV) / Gestion de la fatigue (RAC 700 div. III / IV)","kb/law/flight-plans-fuel-requirements.md":"Flight plans & fuel requirements / Plans de vol et exigences de carburant","kb/law/general-operating-rules.md":"General operating rules / Règles générales d’utilisation","kb/law/licences-medicals-privileges.md":"Licences, medicals & privileges / Licences, médicaux et privilèges","kb/law/medical-fitness.md":"Medical & fitness / Médical et aptitude","kb/law/night-vfr-ott.md":"Night & VFR over-the-top / Vol de nuit et VFR OTT","kb/law/occurrence-reporting-tsb.md":"Occurrence reporting (TSB) / Déclaration des événements (BST)","kb/law/oxygen-requirements.md":"Oxygen requirements / Exigences d’oxygène","kb/law/private-operators-604.md":"Private operators (CAR 604) / Exploitants privés (RAC 604)","kb/law/recency.md":"Recency / Mise à jour des connaissances / récence","kb/law/required-equipment.md":"Required equipment / Équipement exigé","kb/law/type-ratings-ppc-cc-crew-seats.md":"Type ratings, PPC / CC & crew seats / Qualifications de type, CCP / VC et postes"}},{"id":"ME","en":"Knowledge · Multi-engine","fr":"Connaissances · Multimoteur","file":"kb/me/README.md","reader":null,"title":null,"kb":true,"files":{"kb/me/engine-failure-procedures-multi-engine.md":"Engine-failure procedures (multi-engine) / Procédures de panne moteur (multimoteur)","kb/me/me-training-systems-flight-test.md":"ME training, systems & flight test / Formation ME, systèmes et test en vol","kb/me/oei-performance-takeoff-planning.md":"OEI performance & takeoff planning / Performances OEI et planification du décollage","kb/me/vmc-asymmetric-thrust-critical-engine.md":"Vmc, asymmetric thrust & critical engine / Vmc, poussée asymétrique et moteur critique"}},{"id":"NAV","en":"Knowledge · Navigation","fr":"Connaissances · Navigation","file":"kb/nav/README.md","reader":null,"title":null,"kb":true,"files":{"kb/nav/gnss-rnav.md":"GNSS / RNAV","kb/nav/headings-true-magnetic-compass.md":"Headings: true / magnetic / compass / Caps : vrai / magnétique / compas","kb/nav/pilot-navigation-dead-reckoning.md":"Pilot navigation & dead reckoning / Navigation à l’estime","kb/nav/publications-cfs-cap-notam-currency.md":"Publications: CFS / CAP / NOTAM & currency / Publications : CFS / CAP / NOTAM et validité","kb/nav/units-conversions.md":"Units & conversions / Unités et conversions"}}],"sections":[{"id":"02-1","card":"02","h":"Core","a":"core","c":["agk-ops"],"kd":"procedure","u":"trn-core","md":"- `P:` ATT→PWR→TRIM. LOOKOUT→ATT→PWR→PERF→TRIM→SCAN. Outside picture primary; instruments confirm.\n- `T:` trim≠control. chasing ASI late; set attitude first.","p":[],"ph":["PPL","CPL"]},{"id":"02-2","card":"02","h":"Taxi / pre-takeoff","a":"taxi--pre-takeoff","c":["ops-to"],"kd":"procedure","u":"trn-taxi-pre-takeoff","md":"- `P:` brake chk→steer→wind ctrl→walk-ish speed→clear path. Runup/pre-TKOF before active.\n- `!:` loose items/belts/doors/fuel/trim/controls/mags/carb heat/temps-pressures.","p":["PPL","CPL","ME"],"e":["PPL"]},{"id":"02-3","card":"02","h":"Normal takeoff","a":"normal-takeoff","c":["ops-to"],"kd":"procedure","u":"trn-normal-takeoff","md":"- `P:` line-up runway/HDG chk→heels floor→full pwr smooth→engine green→ASI alive→rudder centreline→rotate `[POH]`→climb attitude→track runway→after-TKOF.\n- `T:` rudder keeps centreline. reject early if no full power/no ASI/rough while runway remains.","p":["PPL"]},{"id":"02-4","card":"02","h":"Crosswind takeoff","a":"crosswind-takeoff","c":["ops-to"],"kd":"procedure","u":"trn-crosswind-takeoff","md":"- `P:` aileron into wind→reduce as speed↑→rudder centreline→rotate+prevent drift→airborne crab to track runway.\n- `T:` drift≠yaw. ground track matters.","p":[],"ph":["PPL","CPL"]},{"id":"02-5","card":"02","h":"Short / obstacle takeoff","a":"short--obstacle-takeoff","c":["ops-to"],"kd":"procedure","u":"trn-short-obstacle-takeoff","md":"- `P:` POH config→max usable runway→brakes?→full pwr→green→rotate POH→`Vx` until clear→`Vy/normal`.\n- `M:` obstacle = height/distance ⇒ `Vx`.\n- `T:` Vx long climb = poor cooling/visibility; use only as needed.","p":["PPL","CPL"]},{"id":"02-6","card":"02","h":"Soft / rough takeoff","a":"soft--rough-takeoff","c":["ops-to"],"kd":"procedure","u":"trn-soft-rough-takeoff","md":"- `P:` keep moving→nose light/up→liftoff in ground effect→level just clear→accelerate→climb `[POH]`.\n- `M:` unstick early, don’t climb early.\n- `T:` ground effect can lie; climb before safe speed ⇒ sink/stall.","p":["PPL","CPL"],"e":["PPL"]},{"id":"02-7","card":"02","h":"Climb","a":"climb","c":["ops-to"],"kd":"procedure","u":"trn-climb","md":"- `P:` attitude+pwr set→trim→lookout→temps/pressures→track. `Vy/normal`; `Vx` obstacle.\n- `T:` high nose = low energy/heat/poor vis. wind correction after departure.","p":["PPL","CPL"]},{"id":"02-8","card":"02","h":"Circuit","a":"circuit","c":["ops-ldg"],"kd":"procedure","u":"trn-circuit","md":"- `P:` TKOF→crosswind→downwind→base→final. default LH unless published/cleared. normal `1000 AAE`.\n- `P:` after TKOF straight ~`500 AAE`→crosswind→circuit height. downwind parallel/spacing/pre-LDG. base by wind/spacing. final centreline/profile/speed/config/aimpoint.\n- `T:` headings change with wind; ground track matters. lookout all legs.","p":["PPL","CPL","ME"]},{"id":"02-9","card":"02","h":"Normal landing","a":"normal-landing","c":["ops-ldg"],"kd":"procedure","u":"trn-normal-landing","md":"- `P:` aligned→stabilized→speed `[POH]`→descent path→aimpoint fixed→flare→holdoff→land.\n- `T:` aimpoint up=low/undershoot; down=high/overshoot. flare high=drop; late=flat/hard.","p":["PPL"]},{"id":"02-10","card":"02","h":"Crosswind landing","a":"crosswind-landing","c":["ops-ldg"],"kd":"procedure","u":"trn-crosswind-landing","md":"- `P:` crab to track OR wing-low sideslip. touchdown longitudinal axis aligned. rollout: more aileron into wind as speed↓.\n- `T:` crab tracks; slip aligns. no side-load at touchdown.","p":[],"ph":["PPL","CPL"]},{"id":"02-11","card":"02","h":"Slip","a":"slip","c":["ops-ldg"],"kd":"procedure","u":"trn-slip","md":"- `P:` forward slip=bank+opposite rudder→↑ROD no ↑IAS. side slip=wing low into wind+opposite rudder→no drift.\n- `T:` flap+slip only if POH allows. recover before flare unless side-slip XW landing.","p":["PPL","CPL"],"e":["PPL"]},{"id":"02-12","card":"02","h":"Go-around","a":"go-around","c":["ops-ldg"],"kd":"procedure","u":"trn-go-around","md":"- `P:` power full/smooth→attitude climb→carb heat cold→stop sink→flaps staged POH→climb speed→track→communicate.\n- `M:` Power–Attitude–Config–Track–Talk.\n- `T:` trim may be nose-up; flap up too fast/low energy ⇒ sink.","p":["PPL","CPL"]},{"id":"02-13","card":"02","h":"Precautionary landing","a":"precautionary-landing","c":["ops-ldg","emg-engine"],"kd":"procedure","u":"trn-precautionary-landing","md":"- `P:` doubt site/wx/fuel/light/health/mech ⇒ inspect before commitment. overhead/normal circuit→safe low inspection beside runway/site→repeat if needed→land/leave.\n- `T:` don’t rush unless fuel/dark/wx force abbreviated inspection. bad site? leave early.","p":["PPL","CPL"]},{"id":"02-14","card":"02","h":"Forced landing","a":"forced-landing","c":["ops-ldg","emg-engine"],"kd":"procedure","u":"trn-forced-landing","md":"- `!:` POH emergency checklist wins.\n- `P:` engine fail=CONTROL→CARB HEAT→TRIM→FIELD→PLAN. then time permitting CAUSE→MAYDAY→PAX→SECURE→LAND.\n- `M:` Control–Field–Plan–Cause–Mayday–Pax–Secure–Land.\n- `T:` glide trimmed = judgement possible. troubleshooting never replaces landing plan.","p":["PPL","CPL"]},{"id":"02-15","card":"02","h":"EFATO","a":"efato","c":["emg-engine"],"kd":"procedure","u":"trn-efato","md":"- `P:` nose down `Vg/POH`→landing path→small turns only→land. below safe turnback alt: NOSE–FIELD–LAND.\n- `T:` impossible turn = pull+bank+low AS⇒spin.","p":[],"ph":["PPL","CPL"]},{"id":"02-16","card":"02","h":"Engine fail in circuit / from altitude","a":"engine-fail-in-circuit--from-altitude","c":["ops-ldg","emg-engine"],"kd":"procedure","u":"trn-engine-fail-in-circuit-from-altitude","md":"- `P:` glide speed→choose runway/field→forced pattern. key pattern: high key→low key abeam→base/final.\n- `F:` high key AGL≈`2 min glide loss + 200 ft`. strong wind⇒key closer.\n- `T:` high is fixable; low usually not. flap/slip once landing assured.","p":[],"ph":["PPL","CPL"]},{"id":"02-17","card":"02","h":"Mayday / pax / secure","a":"mayday--pax--secure","c":["emg","emg-engine"],"kd":"procedure","u":"trn-mayday-pax-secure","md":"- `P:` MAYDAY×3→ident→problem→position→intention→POB/fuel if time. xpdr `7700`; comm fail `7600`; unlawful `7500`.\n- `P:` pax: glasses/sharp off→loose secure→belts tight→brace. secure: fuel off→mixture ICO→mags off→alt/gen off→master off after flaps set.\n- `T:` master off before electric flaps set = self-own.","p":["PPL","CPL"]},{"id":"02-18","card":"02","h":"Spiral / stall","a":"spiral--stall","c":["agk-stall","emg-ua"],"kd":"procedure","u":"trn-spiral-stall","md":"- `P spiral:` throttle closed→wings level→ease out→power after AS normal. `T:` pulling first=tighter/high-g.\n- `P stall:` AoA↓ NOW→wings coordinated→power as req/full if low→recover attitude. `T:` stall=AoA, not speed; yaw aggravates spin.","p":["PPL","CPL"],"e":["PPL"]},{"id":"02-19","card":"02","h":"VFR nav / diversion / lost","a":"vfr-nav--diversion--lost","c":["nav-dr"],"kd":"procedure","u":"trn-vfr-nav-diversion-lost","md":"- `P dep:` overhead/geopoint/enroute climb. set heading: over point→time hack→compass HDG→visual departure angle→DI/compass chk→checkpoint ETA.\n- `P enroute:` altitude→planned speed→trim→OAT→lean→DI→engine/fuel scan. map: orient→anticipate→confirm→pinpoint.\n- `P divert:` decide early→choose dest→line feature if possible→track/dist/GS/ETA/fuel→inform.\n- `P lost:` climb if safe→communicate→conserve→confess→comply.","p":["PPL","CPL"],"e":["PPL"]},{"id":"02-20","card":"02","h":"Pebble","a":"pebble","c":["agk-ops"],"kd":"pebble","u":"trn-pebble","md":"- TKOF line-up→pwr→green→alive→rotate→climb | XW aileron wind+rudder centre | SOFT keep moving→GE accel | SHORT Vx→clear→Vy | CCT 500/1000 | LDG align-profile-speed-flare | GO power-att-config-track-talk | PREC inspect-decide | FORCED control-field-plan-cause-MAYDAY-pax-secure-land | EFATO nose-field-land | SPIRAL idle-level-ease | STALL AoA↓ | LOST C5.","p":["PPL","CPL","ME"]},{"id":"05-1","card":"05","h":"Source / master scan","a":"source--master-scan","c":["met-products"],"kd":"source","u":"wxp-master-scan","md":"- `SRC:` current AIM MET + NAV CANADA/FIC + CARs/CAP/CFS/NOTAM. Products describe; PIC decides legal + safe.\n- Review GFA/AIRMET/SIGMET→TAF/METAR/SPECI→PIREP/upper winds→radar/satellite/lightning→RSC/CRFI/cameras.\n- `P:` big picture→route→DEP/enroute/DEST/ALT→escape→update. `M:` `SYNOPTIC-GFA-HAZARDS-TERMINALS-PIREP-WINDS-RUNWAY-TREND`.\n- `T:` never one product: decode→compare→trend→threats→options.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"05-2","card":"05","h":"Go/no-go gates","a":"gono-go-gates","c":["met-decide"],"kd":"procedure","u":"wxp-gates","md":"- `LEGAL:` minima/alternate/approach ban/fuel/equipment/day-night.\n- `AIRCRAFT:` icing approval/wind-XW/runway/performance/terrain/heat-defrost.\n- `PILOT:` currency/recent IMC-night-XW-ice/fatigue/workload. `OPTIONS:` alternates/turn-back/fuel/route-alt-time.\n- `T:` legal + no options = fragile.","p":["IR"]},{"id":"05-3","card":"05","h":"Wind / runway gate","a":"wind--runway-gate","c":["met-decide"],"kd":"procedure","u":"wxp-wind-runway","md":"- Compute steady + gust XW/HW/TW; compare POH/SOP/personal limits.\n- Add runway length/slope/surface/RSC/CRFI, obstacles, mechanical turbulence, wind shear.\n- `T:` gusty XW + wet/contaminated short runway = compounded risk, not separate minor issues.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"05-4","card":"05","h":"Night weather","a":"night-weather","c":["met-decide","law-night"],"kd":"procedure","u":"wxp-night","md":"- Raise minima for cloud/vis/terrain/precip. Horizon and cloud boundaries disappear; snow/black-hole effects worsen.\n- Moon illumination, terrain lighting and cloud cover affect visual navigation.\n- `T:` legal night VFR visibility may provide poor terrain/weather avoidance.","p":[],"ph":["PPL","CPL","IR"]},{"id":"05-5","card":"05","h":"VFR go/no-go flow","a":"vfr-gono-go-flow","c":["met-decide"],"kd":"procedure","u":"wxp-vfr-flow","md":"- `P:` ceiling/vis trend→terrain clearance→cloud layers/tops→precip/TS→wind/XW→daylight/night→diversion airports→fuel.\n- Establish personal minimums by day/night, terrain, route familiarity and passenger pressure.\n- `T:` scud running = shrinking options; turn around before valley/ceiling closes.","p":["PPL","CPL"]},{"id":"05-6","card":"05","h":"IFR go/no-go flow","a":"ifr-gono-go-flow","c":["met-decide","ifr-plan","ifr-wx"],"kd":"procedure","u":"wxp-ifr-flow","md":"- `P:` departure minima/ODP→enroute MEA/icing/TS→destination TAF/RVR/wind→alternate legality→approach/runway/NOTAM→missed/climb→fuel/options.\n- Single-engine IFR: terrain/icing/engine-failure landing options. Multi-engine: actual OEI climb/ceiling.\n- `T:` legal approach at destination + unusable alternate + icing enroute = no robust plan.","p":["IR"]},{"id":"05-7","card":"05","h":"Trend","a":"trend","c":["met-decide"],"kd":"procedure","u":"wxp-trend","md":"- Compare last `3` METAR/SPECI + TAF + GFA panels + radar/satellite + PIREPs; mark CIG/vis/wind/pressure `↑/↓` and precip/cell motion.\n- `M:` observation=now; forecast=expected; trend=forecast performance. Worse observations→confidence↓.","p":[],"ph":["PPL","CPL","IR"]},{"id":"05-8","card":"05","h":"Personal weather matrix","a":"personal-weather-matrix","c":["met-decide"],"kd":"procedure","u":"wxp-personal-matrix","md":"| Threat | Green | Amber | Red |\n|---|---|---|---|\n| ceiling/vis | well above personal min | close/trending down | below or no escape |\n| wind/XW | stable below limit | gusty/near limit | above limit/shear |\n| icing | none/clear escape | uncertain nearby | forecast/reported in route |\n| convection | none/distant | isolated with wide escape | line/embedded/near route |\n| runway | dry/long | wet/short margin | contam/braking unknown |\n| options | many | limited | single point of failure |\n\n- `T:` multiple amber items often equal red overall.","p":[],"ph":["PPL","CPL","IR"]},{"id":"05-9","card":"05","h":"FIC / in-flight update","a":"fic--in-flight-update","c":["met-products"],"kd":"procedure","u":"wxp-fic","md":"- Ask FIC: system timing/confidence, worst segment, bases/tops, ice layers/trend, convection motion, PIREPs, ALT/escape, next update; briefing does not transfer PIC responsibility.\n- Before critical point: DEST/ALT METAR-TAF→SIGMET/AIRMET→PIREP→radar/lightning→fuel→decision. Predefine divert trigger; file useful PIREP.\n- `M:` `UPDATE-FUEL-OPTIONS-DECIDE EARLY`.","p":["PPL","CPL","IR"],"e":["PPL"]},{"id":"05-10","card":"05","h":"Hard no-go / exit triggers — light GA","a":"hard-no-go--exit-triggers--light-ga","c":["met-decide"],"kd":"procedure","u":"wxp-hard-no-go","md":"- Freezing rain/drizzle, embedded/line TS, severe icing/turbulence, runway below performance/braking needs, wind/shear beyond limits, ceiling/vis below legal or personal minima, no legal/suitable alternate, insufficient fuel/options.\n- `!:` unexpected ice, worsening VMC, rising terrain under lowering ceiling, cell growth/line closure, fuel below divert plan ⇒ exit now.","p":[],"ph":["PPL","CPL","IR"]},{"id":"05-11","card":"05","h":"INRAT weather question method","a":"inrat-weather-question-method","c":["ifr-wx"],"kd":"trap","u":"wxp-inrat-method","md":"- `1` locate ETA/time window; `2` decode prevailing/change groups; `3` identify legal threshold; `4` include TEMPO/PROB/BECMG rule; `5` check GFA/AIRMET/SIGMET/NOTAM; `6` calculate wind/fuel/temperature; `7` select legal answer, then note operational risk.\n- `T:` common distractors use wrong time, AGL vs ASL, BKN vs SCT, prevailing vs TEMPO, alternate vs landing minima.","p":[],"ph":["IR"]},{"id":"05-12","card":"05","h":"Pebble","a":"pebble","c":["met"],"kd":"pebble","u":"wxp-pebble","md":"- weather scan `SYNOPTIC-GFA-HAZARDS-TERMINALS-PIREP-WINDS-RUNWAY-TREND` | gates `LEGAL-AIRCRAFT-PILOT-OPTIONS`; legal + no options = fragile | observations worse than forecast=confidence↓ | many amber=red | `UPDATE-FUEL-OPTIONS-DECIDE EARLY` | scud running = shrinking options; turn around early | decoding and hazard recall: concept Pebbles in `kb/met/`.","p":["PPL","CPL","IR"]},{"id":"07-1","card":"07","h":"Source / status","a":"source--status","c":["agk"],"kd":"source","u":"c150-source-status","md":"- `SRC:` provided `1977 Cessna Model 150M POH`; exact model, not confirmed for a specific serial/configuration.\n- `!:` before use, verify POH revision/service-letter updates, serial, Canadian supplements, equipment, W&B, placards, STCs and checklist.\n- `T:` carried aircraft POH/checklist wins.","p":[],"ph":["PPL","CPL"]},{"id":"07-2","card":"07","h":"Aircraft","a":"aircraft","c":["agk-systems"],"kd":"aircraft","u":"c150-aircraft","md":"- Continental `O-200-A`: normally aspirated/carbureted/direct-drive/air-cooled, opposed `4-cylinder`, `201 cu in`; `100 BHP @2750 RPM`.\n- McCauley fixed-pitch `2-blade`, nominal `69 in`, approved `67.5–69 in`; max TKOF/LDG `1600 lb`.\n- Standard empty: Commuter `1111 lb`, Commuter II `1129 lb`; use actual aircraft data.","p":[],"ph":["PPL","CPL"]},{"id":"07-3","card":"07","h":"Airspeed limitations","a":"airspeed-limitations","c":["agk-vspeeds"],"kd":"aircraft","u":"c150-airspeed-limitations","md":"| Item | KCAS | KIAS | Meaning |\n|---|---:|---:|---|\n| `Vne` | `141` | `141` | never exceed |\n| `Vno` | `104` | `107` | max structural cruise |\n| `Va @1600` | `95` | `97` | manoeuvring |\n| `Va @1450` | `90` | `93` | manoeuvring |\n| `Va @1300` | `85` | `88` | manoeuvring |\n| `Vfe` | `89` | `85` | max flap extended |\n| max window open | `141` | `141` | |\n\n- `T:` preserve POH units. `KIAS≠KCAS`, especially near stall/flap speeds.\n- `T:` `Vx=56 KIAS` is the best-angle value; POH short-field obstacle procedure uses `60 KIAS @50 ft`. Do not substitute one for the other.","p":["PPL","CPL"],"e":["CPL"]},{"id":"07-4","card":"07","h":"Airspeed-indicator markings","a":"airspeed-indicator-markings","c":["agk-vspeeds","agk-pitot"],"kd":"aircraft","u":"c150-airspeed-indicator-markings","md":"| Marking | KIAS | Meaning |\n|---|---:|---|\n| white | `42–85` | full-flap range |\n| green | `47–107` | normal operating |\n| yellow | `107–141` | caution; smooth air only |\n| red | `141` | never exceed |","p":["PPL","CPL"],"e":["PPL"]},{"id":"07-5","card":"07","h":"Engine / instrument limits","a":"engine--instrument-limits","c":["agk-engine"],"kd":"aircraft","u":"c150-engine-instrument-limits","md":"| Item | Limit / range |\n|---|---|\n| max RPM | `2750` |\n| static RPM | `2460–2560` full throttle, carb heat cold, full rich |\n| tach green | `2000–2750 RPM` |\n| oil pressure min | `10 psi` |\n| oil pressure normal | `30–60 psi` |\n| oil pressure max | `100 psi` |\n| oil temperature normal | `100–240°F` / `38–116°C` |\n| oil temperature max | `240°F` / `116°C` |\n\n- `T:` abnormal static RPM can indicate engine/propeller/induction condition; do not accept without maintenance assessment.","p":["PPL","CPL"]},{"id":"07-6","card":"07","h":"Weight / CG / baggage","a":"weight--cg--baggage","c":["agk-wb"],"kd":"aircraft","u":"c150-weight-cg-baggage","md":"- Datum firewall face; forward CG `31.5 in @≤1280 lb`→`32.9 in @1600`; aft `37.5 in` all weights.\n- Baggage 1 station `50–76`: `120 lb`; area 2 `76–94`: `40 lb`; combined max `120 lb`.\n- Graph arms: seats avg `39 in` (`33–41`), baggage 1≈`64`, area 2≈`84`.\n- `P:` actual basic empty W/moment→add occupants/fuel/baggage→total→plot. `T:` never use published standard empty for actual W&B.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"07-7","card":"07","h":"Manoeuvre / structural limits","a":"manoeuvre--structural-limits","c":["agk-load"],"kd":"aircraft","u":"c150-manoeuvre-structural-limits","md":"- Utility category. Approved only: chandelles/lazy eights/steep turns `95 kt`; spins and non-whip stalls by slow deceleration.\n- Load factors: flaps UP `+4.4/-1.76 g`; DOWN `+3.5 g`; no abrupt controls above `Va`.\n- No intentional spin with flaps, baggage or occupied child seat; known icing prohibited.\n- `T:` approval still requires training, altitude, area, W&B and regulatory compliance.","p":["PPL","CPL"],"e":["PPL"]},{"id":"07-8","card":"07","h":"Fuel","a":"fuel","c":["agk-fuel"],"kd":"aircraft","u":"c150-fuel","md":"| System | Total | Usable | Unusable |\n|---|---:|---:|---:|\n| standard | `26.0 US gal` | `22.5` | `3.5` |\n| long range | `38.0 US gal` | `35.0` | `3.0` |\n\n- Two vented wing tanks→gravity feed→shutoff valve→strainer→carburetor.\n- Cross-feeding occurs; re-top both tanks after refuelling to assure maximum capacity.\n- Approved fuels: `80/87 red`, `100LL blue`, `100/130 green`.\n- `T:` visually verify quantity; gauges + clock/burn tracking, not gauges alone.","p":["PPL","CPL"]},{"id":"07-9","card":"07","h":"Oil","a":"oil","c":["agk-engine"],"kd":"aircraft","u":"c150-oil","md":"- Sump `6 qt`; system `7 qt` with full-flow filter; minimum `4 qt`; POH suggests `5 qt` for flights `<3 h`, `6 qt` extended.\n- Break-in: straight mineral until POH hours/consumption stabilized, then ashless dispersant.\n- Viscosity: `SAE 40` above `4°C/40°F`; `10W30 or SAE 20` below.","p":["PPL","CPL"],"e":["PPL"]},{"id":"07-10","card":"07","h":"Normal speeds — max weight unless noted","a":"normal-speeds--max-weight-unless-noted","c":["agk-vspeeds"],"kd":"aircraft","u":"c150-normal-speeds-max-weight-unless-noted","md":"| Operation | KIAS / config |\n|---|---|\n| normal climb-out | `60–70` |\n| short-field at 50 ft | `60`, flaps UP |\n| normal climb | `65–75`, flaps UP |\n| `Vy` | `68 SL → 62 @10,000` |\n| `Vx` | `56` SL through `10,000` |\n| normal approach | `60–70` flaps UP |\n| normal approach | `50–60` flaps `40°` |\n| short-field approach | `52`, flaps `40°` |\n| balked landing | max power, flaps `20°`, `55` |\n| max demonstrated XW | `13 kt` |\n\n- `N:` max demonstrated crosswind is not stated as a limiting value.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"07-11","card":"07","h":"Preflight — POH highlights","a":"preflight--poh-highlights","c":["ops-to"],"kd":"aircraft","u":"c150-preflight-poh-highlights","md":"- Remove all frost/ice/snow; controls internally free of ice/debris.\n- Cabin: lock out; ignition OFF; master ON gauges check/OFF; fuel ON.\n- Wings: tie-down/tire; sump before first flight and after refuel; visually verify fuel/caps.\n- Nose: oil (`4 qt` min; `6` extended), strainer drain≈`4 sec`, prop/spinner, filter, light, strut/tire, static port.\n- `T:` any water→continue draining all specified points until clear.","p":["PPL","CPL"]},{"id":"07-12","card":"07","h":"Before start","a":"before-start","c":["ops-to"],"kd":"aircraft","u":"c150-before-start","md":"- `P:` preflight complete→seats/belts/shoulder harnesses adjusted/locked→fuel ON→radios/electrical OFF→brakes test/set→breakers IN.","p":["PPL","CPL"]},{"id":"07-13","card":"07","h":"Start","a":"start","c":["ops-to"],"kd":"aircraft","u":"c150-start","md":"- `P:` MIX RICH→carb heat COLD→master ON→prime→throttle `1/4 in`→CLEAR→START→oil P.\n- Prime: warm `1–2`, cold up to `6`; flooded: MIX ICO/throttle full/crank/restart no prime.\n- `!:` oil P within `30 sec` summer/`60 sec` very cold or stop. Carb heat only if needed; air unfiltered.","p":["PPL","CPL"]},{"id":"07-14","card":"07","h":"Taxi","a":"taxi","c":["ops-to"],"kd":"aircraft","u":"c150-taxi","md":"- Minimum speed/braking; use wind controls.\n- Carb heat COLD unless necessary; heated induction air is unfiltered.\n- Low RPM over gravel/cinders to protect propeller.","p":["PPL","CPL"],"e":["PPL"]},{"id":"07-15","card":"07","h":"Before takeoff","a":"before-takeoff","c":["ops-to"],"kd":"aircraft","u":"c150-before-takeoff","md":"- `P:` doors→brake→controls→instruments→fuel ON→MIX RICH below `5000 ft`→trim→`1700 RPM`.\n- Run-up: each mag drop `≤150 RPM`, difference `≤75 RPM`; carb-heat drop; engine/ammeter/suction; radios/lights/friction.\n- Field `>5000 ft`: full-throttle static lean for max RPM.","p":["PPL","CPL"]},{"id":"07-16","card":"07","h":"Normal takeoff","a":"normal-takeoff","c":["ops-to"],"kd":"aircraft","u":"c150-normal-takeoff","md":"- `P:` flaps `0°`→carb heat COLD→full throttle→lift nosewheel at `50 KIAS`→climb `60–70`.\n- Verify expected static/full-throttle RPM and engine indications before commitment.","p":["PPL"]},{"id":"07-17","card":"07","h":"Short-field takeoff","a":"short-field-takeoff","c":["ops-to"],"kd":"aircraft","u":"c150-short-field-takeoff","md":"- `P:` flaps `0°`→carb heat COLD→brakes APPLY→full throttle→brakes RELEASE→slightly tail-low→`60 KIAS` with obstacle.\n- POH obstacle-clearance speed is `60`, despite pure `Vx=56`; it accounts for near-ground turbulence/overall obstacle performance.","p":["PPL","CPL"]},{"id":"07-18","card":"07","h":"Soft / rough field flap logic","a":"soft--rough-field-flap-logic","c":["ops-to"],"kd":"aircraft","u":"c150-soft-rough-field-flap-logic","md":"- Normal/short: flaps UP. `10°` cuts ground run≈`10%`, advantage gone by `50 ft`; reserve for minimum run/soft-rough field.\n- With obstacle, normally retain `10°` until clear; hot/high marginal climb may require retraction. `>10°` prohibited for TKOF.","p":["PPL","CPL"],"e":["PPL"]},{"id":"07-19","card":"07","h":"Crosswind takeoff","a":"crosswind-takeoff","c":["ops-to"],"kd":"aircraft","u":"c150-crosswind-takeoff","md":"- Minimum flap needed; accelerate slightly above normal, lift off decisively, then coordinate into wind.\n- `T:` school technique may refine POH baseline.","p":[],"ph":["PPL","CPL"]},{"id":"07-20","card":"07","h":"Climb","a":"climb","c":["ops-to"],"kd":"aircraft","u":"c150-climb","md":"- Normal `65–75 KIAS`, flaps UP/full throttle; `Vy 68 SL→62 @10,000`; `Vx 56`.\n- MIX full rich below `5000 ft`, may lean above for smoothness; keep steep low-speed climbs brief for cooling.","p":[],"ph":["PPL","CPL"]},{"id":"07-21","card":"07","h":"Cruise / leaning","a":"cruise--leaning","c":["agk-engine"],"kd":"aircraft","u":"c150-cruise-leaning","md":"- `P:` `2000–2750 RPM`, ≤`75%`→trim→LEAN; normal cruise `55–75%`, charts assume recommended lean.\n- `T:` RPM alone≠power across altitude/temp; use chart/power computer.","p":["PPL","CPL"],"e":["PPL"]},{"id":"07-22","card":"07","h":"Before landing","a":"before-landing","c":["ops-ldg"],"kd":"aircraft","u":"c150-before-landing","md":"- `P:` seats/belts/harnesses secure→mixture RICH→full carb heat before closing throttle.","p":[],"ph":["PPL","CPL"]},{"id":"07-23","card":"07","h":"Normal landing","a":"normal-landing","c":["ops-ldg"],"kd":"aircraft","u":"c150-normal-landing","md":"- `P:` `60–70` UP→flaps below `85`→`50–60` DOWN→power-off mains first→nose gently→minimum brake.","p":["PPL"]},{"id":"07-24","card":"07","h":"Short-field landing","a":"short-field-landing","c":["ops-ldg"],"kd":"aircraft","u":"c150-short-field-landing","md":"- `P:` flaps `40°` below `85`→`52` smooth-air→power path→idle after obstacle→mains→nose down→full-up elevator/max non-skid brake→flaps UP.\n- Add slight speed in turbulence. `T:` excess speed sharply increases distance.","p":["PPL","CPL"]},{"id":"07-25","card":"07","h":"Crosswind landing","a":"crosswind-landing","c":["ops-ldg"],"kd":"aircraft","u":"c150-crosswind-landing","md":"- Crab, wing-low or combination; strong XW: minimum flap needed for field. Maintain directional/wind control after touchdown.","p":[],"ph":["PPL","CPL"]},{"id":"07-26","card":"07","h":"Balked landing","a":"balked-landing","c":["ops-ldg"],"kd":"aircraft","u":"c150-balked-landing","md":"- `P:` throttle FULL→carb heat COLD→flaps RETRACT TO `20°`→`55 KIAS`→flaps retract slowly after safe climb.\n- `T:` abrupt full-flap retraction at low speed can cause sink.","p":["PPL","CPL"]},{"id":"07-27","card":"07","h":"After landing / secure","a":"after-landing--secure","c":["ops-ldg"],"kd":"aircraft","u":"c150-after-landing-secure","md":"- After landing: flaps UP; carb heat COLD.\n- Secure: parking brake SET→radios/electrical OFF→mixture ICO→ignition OFF→master OFF→control lock.","p":[],"ph":["PPL","CPL"]},{"id":"07-28","card":"07","h":"Emergency speeds","a":"emergency-speeds","c":["agk-vspeeds"],"kd":"aircraft","u":"c150-emergency-speeds","md":"| Event | KIAS / config |\n|---|---|\n| failure immediately after takeoff | `60` |\n| maximum glide | `60`, flaps UP |\n| no-power landing | `65` flaps UP / `55` flaps DOWN |\n| precautionary inspection | `60`, flaps `20°` |\n| precautionary final | `55`, flaps `40°` |\n| ditching | `55`, flaps `40°`, power for `300 fpm` if available |\n| engine fire in flight | `85` initially |\n| no-elevator landing | approx `55`, flaps `20°` |","p":["PPL","CPL"]},{"id":"07-29","card":"07","h":"Engine failure — takeoff roll","a":"engine-failure--takeoff-roll","c":["emg-engine"],"kd":"aircraft","u":"c150-engine-failure-takeoff-roll","md":"- `P:` throttle IDLE→brakes APPLY→flaps RETRACT→mixture ICO→ignition OFF→master OFF.","p":[],"ph":["PPL","CPL"]},{"id":"07-30","card":"07","h":"Engine failure — immediately after takeoff","a":"engine-failure--immediately-after-takeoff","c":["ops-to","emg-engine"],"kd":"aircraft","u":"c150-engine-failure-immediately-after-takeoff","md":"- `P:` `60 KIAS`→mixture ICO→fuel OFF→ignition OFF→flaps as required→master OFF.\n- `!:` speed first; landing path ahead/near-ahead.","p":[],"ph":["PPL","CPL"]},{"id":"07-31","card":"07","h":"Engine failure — in flight / restart","a":"engine-failure--in-flight--restart","c":["emg-engine"],"kd":"aircraft","u":"c150-engine-failure-in-flight-restart","md":"- `P:` `60 KIAS`→carb heat ON→primer IN/LOCKED→fuel ON→mixture RICH→ignition BOTH, or START if prop stopped.\n- If no restart: commit to forced landing checklist.","p":["PPL","CPL"]},{"id":"07-32","card":"07","h":"Forced landing without power","a":"forced-landing-without-power","c":["emg-engine"],"kd":"aircraft","u":"c150-forced-landing-without-power","md":"- `P:` `65 UP / 55 DOWN`→mixture ICO→fuel OFF→ignition OFF→flaps as required, `40°` recommended→master OFF→doors UNLATCH before touchdown→slightly tail-low→brakes heavily.\n- `T:` only use flap after landing is assured.","p":["PPL","CPL"]},{"id":"07-33","card":"07","h":"Precautionary landing with power","a":"precautionary-landing-with-power","c":["emg-engine"],"kd":"aircraft","u":"c150-precautionary-landing-with-power","md":"- `P:` `60`, flaps `20°`→inspect selected field→retract flap after safe climb→radio/electrical OFF→flaps `40°` final→`55`→master OFF→doors unlatch→slightly tail-low→ignition OFF→heavy brakes.","p":["PPL","CPL"]},{"id":"07-34","card":"07","h":"Ditching","a":"ditching","c":["emg-engine"],"kd":"aircraft","u":"c150-ditching","md":"- `P:` MAYDAY `121.5` + position/intentions→secure/jettison heavy items→high wind/heavy sea INTO wind; light wind/heavy swells PARALLEL swells→flaps `40°`→power for `300 fpm @55`→doors unlatch→level attitude at touchdown→protect face→evacuate→inflate vests/raft after exit.","p":[],"ph":["PPL","CPL"]},{"id":"07-35","card":"07","h":"Engine fire during start","a":"engine-fire-during-start","c":["emg-fire"],"kd":"aircraft","u":"c150-engine-fire-during-start","md":"- Continue cranking to draw fire into engine.\n- If engine starts: `1700 RPM` briefly→shutdown→inspect.\n- If no start: continue cranking→obtain extinguisher→master OFF→ignition OFF→fuel OFF→extinguish→inspect/repair.","p":[],"ph":["PPL","CPL"]},{"id":"07-36","card":"07","h":"Engine fire in flight","a":"engine-fire-in-flight","c":["emg-fire"],"kd":"aircraft","u":"c150-engine-fire-in-flight","md":"- `P:` mixture ICO→fuel OFF→master OFF→cabin heat/air OFF except wing-root vents→`85 KIAS`; if fire persists, increase speed to find non-combustible mixture→forced landing.\n- Do not restart.","p":["PPL","CPL"]},{"id":"07-37","card":"07","h":"Electrical fire","a":"electrical-fire","c":["agk-elec","emg-fire"],"kd":"aircraft","u":"c150-electrical-fire","md":"- `P:` master OFF→all other switches except ignition OFF→vents/cabin air/heat CLOSED→extinguisher.\n- After extinguisher: ventilate cabin.\n- If power essential and fire fully out: master ON→breakers inspect; do not reset faulty breaker→switches ON one at a time with delay.","p":["PPL","CPL"]},{"id":"07-38","card":"07","h":"Cabin / wing fire","a":"cabin--wing-fire","c":["emg-fire"],"kd":"aircraft","u":"c150-cabin-wing-fire","md":"- Cabin: master OFF→vents/heat CLOSED→extinguisher→land ASAP.\n- Wing: nav/strobe/pitot heat OFF→side-slip to keep flames from fuel tank/cabin→land ASAP with flaps retracted.","p":[],"ph":["PPL","CPL"]},{"id":"07-39","card":"07","h":"Inadvertent icing","a":"inadvertent-icing","c":["met-icing"],"kd":"aircraft","u":"c150-inadvertent-icing","md":"- `L:` known icing prohibited.\n- `P:` pitot heat ON if installed→turn back/change altitude to less-conducive temperature→max defrost heat→increase engine RPM→watch carb/filter ice; carb heat as required→lean for max RPM if continuous heat→nearest airport.\n- `T:` this is an escape checklist, not authorization to remain in icing.","p":[],"ph":["PPL","CPL"]},{"id":"07-40","card":"07","h":"Spin recovery","a":"spin-recovery","c":["agk-stall"],"kd":"aircraft","u":"c150-spin-recovery","md":"- `P:` throttle IDLE + ailerons NEUTRAL→full opposite rudder→immediately/briskly move wheel forward enough to break stall→hold until rotation stops→neutralize rudder→smooth dive recovery.\n- Training: POH recommends `1–2` turns; cabin clear/loose items secured; no baggage or occupied child seat.\n- `L:` intentional spins with flaps extended prohibited.","p":["PPL","CPL"],"e":["PPL"]},{"id":"07-41","card":"07","h":"Landing without elevator control","a":"landing-without-elevator-control","c":["emg-sys"],"kd":"aircraft","u":"c150-landing-without-elevator-control","md":"- Trim level at approx `55 KIAS`, flaps `20°`.\n- Do not change trim; use power exclusively for glide path.\n- At flare: full nose-up trim + power to rotate to level touchdown attitude; close throttle at touchdown.","p":[],"ph":["PPL","CPL"]},{"id":"07-42","card":"07","h":"Vacuum-system failure / cloud","a":"vacuum-system-failure--cloud","c":["agk-gyro","emg-sys"],"kd":"aircraft","u":"c150-vacuum-system-failure-cloud","md":"- Directional and attitude indicators may be disabled; electrically powered turn coordinator/turn-and-bank remains primary legacy backup.\n- POH provides timed standard-rate 180° and emergency-descent procedures.\n- `T:` actual installed instruments/avionics may differ; use current supplement/SOP and declare early.","p":["PPL","CPL"]},{"id":"07-43","card":"07","h":"Spin vs spiral memory","a":"spin-vs-spiral-memory","c":["agk-stall"],"kd":"aircraft","u":"c150-spin-vs-spiral-memory","md":"- Spin: stalled, low AS, rotation.\n- Spiral: AS increasing; recovery = throttle idle→wings level→smooth pullout.","p":["PPL","CPL"],"e":["PPL"]},{"id":"07-44","card":"07","h":"Electrical system","a":"electrical-system","c":["agk-elec"],"kd":"aircraft","u":"c150-electrical-system","md":"- `14 V DC`, `60 A` alternator, `12 V/25 Ah` battery, single bus; split master `BAT`=aircraft power, `ALT`=field.\n- Mags independent of master/battery; ammeter shows battery charge/discharge.\n- `T:` prolonged ALT OFF may deplete battery enough to prevent alternator restart.","p":["PPL","CPL"]},{"id":"07-45","card":"07","h":"High-voltage light / alternator","a":"high-voltage-light--alternator","c":["agk-elec","emg-sys"],"kd":"aircraft","u":"c150-high-voltage-light-alternator","md":"- Over-voltage sensor removes field current and shuts alternator; red `HIGH VOLTAGE` light illuminates.\n- `P:` master OFF then ON once to reset.\n- If light stays out: charging resumed.\n- If light returns: malfunction; terminate flight as soon as practical.\n- `T:` exact current-aircraft checklist/supplement wins.","p":[],"ph":["PPL","CPL"]},{"id":"07-46","card":"07","h":"Carburetor / induction","a":"carburetor--induction","c":["carb-ice"],"kd":"aircraft","u":"c150-carburetor-induction","md":"- Updraft float carburetor, fixed jet, accelerator pump, manual mixture, idle cut-off.\n- Fuel reaches carb by gravity.\n- Full carb heat at full throttle causes about `200–250 RPM` loss.\n- Primer draws from fuel strainer and injects intake manifold; lock primer IN.","p":["PPL","CPL"]},{"id":"07-47","card":"07","h":"Cooling","a":"cooling","c":["agk-engine"],"kd":"aircraft","u":"c150-cooling","md":"- Ram-air cooling; no manual cowl-flap control.\n- Winterization kit intended for consistently below `-7°C / 20°F`.","p":["PPL","CPL"]},{"id":"07-48","card":"07","h":"Brakes","a":"brakes","c":["agk-systems"],"kd":"aircraft","u":"c150-brakes","md":"- Single-disc hydraulic brake on each main wheel; interconnected toe brakes; parking brake.\n- If braking fades: release then reapply firmly.\n- Spongy/excess travel: pumping may restore pressure.\n- One brake weak/failed: use other sparingly + opposite rudder.","p":[],"ph":["PPL","CPL"]},{"id":"07-49","card":"07","h":"Performance — headline specifications","a":"performance--headline-specifications","c":["agk-perfcalc"],"kd":"aircraft","u":"c150-performance-headline-specifications","md":"| Item | Published value |\n|---|---:|\n| max speed SL | `109 kt` |\n| 75% cruise @7000 | `106 kt` |\n| ROC SL | `670 fpm` |\n| service ceiling | `14,000 ft` |\n| TO ground roll | `735 ft` |\n| TO over 50 ft | `1385 ft` |\n| LDG ground roll | `445 ft` |\n| LDG over 50 ft | `1075 ft` |\n\n- `T:` headline values are not substitutes for chart calculations at actual weight/PA/OAT/wind/surface/technique.","p":[],"ph":["PPL","CPL"]},{"id":"07-50","card":"07","h":"Performance-chart rules","a":"performance-chart-rules","c":["agk-perfcalc"],"kd":"aircraft","u":"c150-performance-chart-rules","md":"- Test aircraft/engine good, average technique; choose conservative next-higher altitude/temp and apply only chart-authorized wind correction.\n- Range/endurance may vary `10%+` with leaning/metering/engine-prop/turbulence; add margin for grass, slope, contamination or degradation.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"07-51","card":"07","h":"Rate-of-climb memory — 1600 lb, flaps UP, full throttle, standard temperature","a":"rate-of-climb-memory--1600-lb-flaps-up-full-throttle-standard-temperature","c":["agk-perfcalc"],"kd":"aircraft","u":"c150-rate-of-climb-memory-1600-lb-flaps-up-full-throt","md":"| Pressure altitude | KIAS | ROC fpm |\n|---:|---:|---:|\n| SL | `68` | `670` |\n| `2000` | `67` | `590` |\n| `4000` | `65` | `510` |\n| `6000` | `64` | `425` |\n| `8000` | `63` | `345` |\n| `10,000` | `62` | `265` |\n| `12,000` | `61` | `180` |\n\n- `N:` increase climb time/fuel/distance `10%` for each `8°C` above standard.\n- Add `0.8 US gal` for start/taxi/takeoff to climb-fuel planning.","p":["CPL"]},{"id":"07-52","card":"07","h":"Maximum glide","a":"maximum-glide","c":["agk-perfcalc"],"kd":"aircraft","u":"c150-maximum-glide","md":"- Conditions: `60 KIAS`, flaps UP, propeller windmilling, zero wind.\n- Approx memory: `6000 ft` height above terrain ≈ `10 NM`; about `1.67 NM/1000 ft`.\n- `T:` use height above terrain, not altitude ASL; wind materially changes ground range.","p":["PPL","CPL"]},{"id":"07-53","card":"07","h":"Cruise sample — not universal","a":"cruise-sample--not-universal","c":["agk-perfcalc"],"kd":"aircraft","u":"c150-cruise-sample-not-universal","md":"- POH sample at approx `6000 ft`, `20°C above standard`, `2600 RPM`: about `60%`, `98 KTAS`, `4.5 GPH`.\n- `T:` sample problem only; use Figure 5-7 for actual altitude/temp/RPM.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"07-54","card":"07","h":"Range / endurance assumptions","a":"range--endurance-assumptions","c":["agk-perfcalc"],"kd":"aircraft","u":"c150-range-endurance-assumptions","md":"- `1600 lb`, recommended lean, standard temp; range zero wind; includes start/taxi/TKOF/climb and `45 min @45%` reserve=`2.6 US gal`.\n- `T:` legal/personal reserve may exceed chart assumption.","p":["PPL","CPL"],"e":["CPL"]},{"id":"07-55","card":"07","h":"Airspeed calibration snapshots","a":"airspeed-calibration-snapshots","c":["agk-vspeeds","agk-pitot"],"kd":"aircraft","u":"c150-airspeed-calibration-snapshots","md":"| Flaps | KIAS | Approx KCAS |\n|---|---:|---:|\n| UP | `40/50/60/70/80/90/100` | `43/51/59/68/77/87/98` |\n| `10°` | `40/50/60/70/80/85` | `42/50/60/69/78/82` |\n| `40°` | `40/50/60/70/80/85` | `40/50/61/72/83/89` |\n\n- `T:` stall chart lists approximate `KIAS`; limitation table may use both `KCAS/KIAS`.","p":["PPL","CPL"]},{"id":"07-56","card":"07","h":"POH memory pebble","a":"poh-memory-pebble","c":["agk"],"kd":"pebble","u":"c150-poh-memory-pebble","md":"- `1600 lb` | `Vne141` | `Vno107` | `Va97/93/88` | `Vfe85` | XW demo `13`\n- engine `O-200-A / 100HP / 2750` | static `2460–2560`\n- oil `4 min / 5 normal / 6 extended` | pressure `10–100`, normal `30–60`\n- fuel std `26/22.5`; LR `38/35`\n- TKOF `F0 / nose50 / climb60–70` | short `F0 / 60@50`\n- climb `65–75`; `Vy68→62`; `Vx56`\n- APP `60–70 UP / 50–60 F40`; short `52 F40`\n- GO `full / carb cold / F20 / 55 / flaps slow`\n- EFATO `60`; glide `60`; forced `65 UP /55 DOWN`\n- restart `60-HEAT-PRIMER-FUEL-MIX-MAGS`\n- fire engine `MIX-FUEL-MASTER-HEAT-AIR-85-LAND`\n- spin `IDLE-AIL NEUT-OPP RUD-FWD-HOLD-NEUT-RECOVER`\n- `POH/current aircraft checklist wins`.","p":[],"ph":["PPL","CPL"]},{"id":"08-1","card":"08","h":"Source / discipline / scan","a":"source--discipline--scan","c":["agk-systems"],"kd":"source","u":"sys-source-discipline-scan","md":"- `SRC:` exact POH/AFM §3 + systems, current checklist/SOP; FTM/TP guidance.\n- Memorize only aircraft-designated memory items; abnormal checklists normally read-and-do.\n- `P:` control→power/sound→fuel→oil→electrical→pitot/static/gyro→controls/config→smoke/fire/odour; confirm instrument failure with `≥2` independent indications.\n- `M:` `CONTROL-DIAGNOSE-MEMORY-CHECKLIST-DECLARE-LAND` | `POWER-FUEL-OIL-ELECTRIC-AIR-DIRECTION-CONTROLS`.\n- `T:` preserve control/landing options; same symptom may have several causes.","p":[],"ph":["PPL","CPL"]},{"id":"08-2","card":"08","h":"Magneto roughness in flight","a":"magneto-roughness-in-flight","c":["agk-engine","emg-engine"],"kd":"procedure","u":"sys-magneto-roughness-in-flight","md":"- `P:` control→mixture adjust→carb heat as appropriate→select mags individually briefly per POH→return BOTH if worse→land/divert.\n- `T:` switching to OFF in flight may load exhaust with fuel; returning to BOTH can cause backfire/damage. Follow POH.\n- `!:` severe vibration/power loss/fire indications = treat as engine emergency, not merely a mag check.","p":[],"ph":["PPL","CPL"]},{"id":"08-3","card":"08","h":"Cylinder-head / engine temperature","a":"cylinder-head--engine-temperature","c":["agk-engine"],"kd":"procedure","u":"sys-cylinder-head-engine-temperature","md":"- High temperature: excessive power, lean mixture, poor airflow, high OAT, prolonged low-speed climb, cowl-flap/config issue.\n- `P:` lower nose/increase airspeed→enrich as appropriate→reduce power→open cowl flaps if fitted→land if unresolved.\n- `T:` cooling by excessive mixture/power changes can create other problems; POH limits/procedure win.","p":["PPL","CPL"]},{"id":"08-4","card":"08","h":"Engine roughness — generic flow","a":"engine-roughness--generic-flow","c":["agk-engine","emg-engine"],"kd":"procedure","u":"sys-engine-roughness-generic-flow","md":"- `P:` control/landing area→carb heat or alternate air→mixture adjust→fuel selector/pump→primer locked→mags→engine gauges→declare/divert.\n- `M:` `HEAT-MIX-FUEL-PRIMER-MAGS`.\n- `T:` do not spend altitude cycling controls repeatedly. One deliberate diagnostic pass, then land.","p":[],"ph":["PPL","CPL"]},{"id":"08-5","card":"08","h":"Complete engine failure","a":"complete-engine-failure","c":["emg-engine","emg-sys"],"kd":"procedure","u":"sys-complete-engine-failure","md":"- `P:` nose→best glide `[POH]`→field/landing path→restart flow if time→MAYDAY/7700→pax/secure→land.\n- Restart generic: carb heat→fuel selector→mixture→pump→primer→mags/start as applicable.\n- `T:` best glide gives options only if established immediately.\n- `!:` after takeoff: lower nose and land ahead-ish; turnback only with trained/proven margin and suitable conditions.","p":[],"ph":["PPL","CPL"]},{"id":"08-6","card":"08","h":"Propeller / governor — constant-speed","a":"propeller--governor--constant-speed","c":["agk-prop"],"kd":"procedure","u":"sys-propeller-governor-constant-speed","md":"- Throttle controls manifold pressure; prop control governs RPM/blade angle; mixture controls fuel-air ratio.\n- `S overspeed:` RPM↑, noise↑. `P:` throttle reduce→prop control reduce RPM if effective→airspeed/power manage→land.\n- `S underspeed/governor fault:` RPM low/unresponsive. Use power setting that avoids vibration/limits; land.\n- `T:` power-setting order and manifold-pressure/RPM limitations are aircraft-specific.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"08-7","card":"08","h":"Propeller vibration","a":"propeller-vibration","c":["agk-prop"],"kd":"procedure","u":"sys-propeller-vibration","md":"- Causes: ice, damage, spinner, engine/prop fault.\n- `P:` reduce power/RPM to minimize vibration→check ice systems if fitted→land ASAP.\n- `!:` severe vibration: throttle idle may prevent separation/damage; secure engine if required by POH.\n- `T:` do not cycle prop aggressively unless checklist directs.","p":["CPL"]},{"id":"08-8","card":"08","h":"Electrical / alternator failure","a":"electrical--alternator-failure","c":["agk-elec","emg-sys"],"kd":"procedure","u":"sys-electrical-alternator-failure","md":"- Alternator/generator+regulator powers bus/recharges battery; battery supplies start/emergency energy.\n- `S:` ALT/low-voltage light, discharge/low volts, weakening equipment.\n- `P:` confirm→shed→one reset only if POH permits→if no recovery ALT OFF→preserve essentials→declare/divert/land. `M:` `SHED-CALCULATE-COMMUNICATE-LAND`.\n- `F rough:` endurance h≈usable Ah/essential A; reduce for age/temp/voltage. Precompute IFR/night loads; repeated resets may worsen fault.","p":["PPL","CPL","ME"]},{"id":"08-9","card":"08","h":"Fire / smoke","a":"fire--smoke","c":["emg-fire"],"kd":"procedure","u":"sys-fire-smoke","md":"| Event | Generic memory—exact POH wins |\n|---|---|\n| electrical smoke/fire | master/ALT OFF→vents/heat per checklist→extinguish→restore only essential circuits after smoke stops→land now |\n| start fire | continue cranking to draw fire inward→MIX ICO/fuel/throttle/master/mags per POH→evacuate/extinguish if persistent |\n| engine fire flight | fuel/MIX/pump OFF→throttle/prop/mags + cabin heat/air per POH→specified airspeed→forced landing; no restart unless survival requires and fire confirmed out |\n| cabin fire | control→source OFF→extinguish→vent after out if directed→land |\n\n- `!:` fire/smoke can rapidly damage structure/controls or poison occupants; nearest suitable landing. Extinguisher/ventilation effects are agent- and aircraft-specific.","p":[],"ph":["PPL","CPL"]},{"id":"08-10","card":"08","h":"Carbon monoxide","a":"carbon-monoxide","c":["agk-hf","emg-fire"],"kd":"procedure","u":"sys-carbon-monoxide","md":"- Sources: exhaust/heater leak. Symptoms: headache, nausea, dizziness, drowsiness, impaired judgment.\n- `P:` cabin heat off→fresh air/vents/windows as safe→oxygen if available→land ASAP→medical evaluation.\n- `T:` symptoms mimic fatigue/illness; colour/smell unreliable. Detector is valuable.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"08-11","card":"08","h":"Altimeter failure / unreliable altitude","a":"altimeter-failure--unreliable-altitude","c":["agk-pitot","emg-sys"],"kd":"procedure","u":"sys-altimeter-failure-unreliable-altitude","md":"- Cross-check against genuinely independent sources. GPS altitude differs from barometric altitude; ATC-displayed pressure altitude may share the aircraft static-system fault. ALT/VSI/ASI can all share one blocked static source.\n- `P IFR:` declare→request block altitude/vectors→use reliable backup/standby→avoid terrain/icing→land.\n- `T:` GPS altitude is not barometric altitude and normally cannot replace required altimeter.","p":["PPL","CPL"],"e":["CPL"]},{"id":"08-12","card":"08","h":"Vacuum / gyro failure","a":"vacuum--gyro-failure","c":["agk-gyro","emg-sys"],"kd":"procedure","u":"sys-vacuum-gyro-failure","md":"- Legacy vacuum often powers AI+DG; turn coordinator often electric. `S:` low suction, slow/precessing/frozen or conflicting indications.\n- `P:` identify/cover→use reliable pitot-static/turn/compass/power cues→ATC/no-gyro vectors→land.\n- AI failed: ASI/ALT/VSI/turn/compass/power; DG failed: compass/timed turns/GPS supplementary; TC failed: AI/DG/compass.\n- `T:` gradual failure looks plausible; know common power sources.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"08-13","card":"08","h":"Flight-control malfunction","a":"flight-control-malfunction","c":["agk-systems","emg-sys"],"kd":"procedure","u":"sys-flight-control-malfunction","md":"- `P:` maintain control with remaining surfaces→reduce speed/load→trim/power/flap asymmetry awareness→declare→long straight-in landing.\n- Jammed elevator: power + trim may control pitch. Jammed aileron: rudder/dihedral may assist roll. Jammed rudder: bank/power carefully.\n- `!:` aircraft-specific controllability varies. Avoid abrupt inputs.\n- `T:` autopilot/trim system may be source of apparent control jam.","p":[],"ph":["PPL","CPL"]},{"id":"08-14","card":"08","h":"Trim runaway / jam","a":"trim-runaway--jam","c":["agk-systems","emg-sys"],"kd":"procedure","u":"sys-trim-runaway-jam","md":"- `P:` hold control firmly→disconnect autopilot/electric trim→pull breaker/switch per POH→retrim manually→slow as appropriate→land.\n- `T:` electric trim may continue after autopilot disconnect depending fault; know separate trim disconnect.\n- `!:` do not release control pressure while troubleshooting.","p":["PPL","CPL"]},{"id":"08-15","card":"08","h":"Flap malfunction / asymmetry","a":"flap-malfunction--asymmetry","c":["agk-systems","emg-sys"],"kd":"procedure","u":"sys-flap-malfunction-asymmetry","md":"- `S:` roll/yaw, unequal indication, motor noise/no movement.\n- `P:` stop flap movement→do not reverse unless POH directs→control speed/bank→leave flaps→calculate landing distance→long runway.\n- `T:` asymmetric flaps can create severe roll; cycling may worsen.","p":["PPL","CPL"],"e":["PPL"]},{"id":"08-16","card":"08","h":"Landing-gear malfunction","a":"landing-gear-malfunction","c":["agk-systems","emg-sys"],"kd":"procedure","u":"sys-landing-gear-malfunction","md":"- `P:` slow within limits→check breaker/selector/indicator/light bulbs→recycle only if POH permits→emergency extension→verify visually/ATC→brief landing/evacuation.\n- Gear-up landing: secure fuel/electrical per POH, doors/occupants brief, land under control on suitable surface.\n- `T:` repeated cycling consumes electrical/hydraulic energy and may worsen jam.","p":["PPL","CPL"]},{"id":"08-17","card":"08","h":"Brake failure","a":"brake-failure","c":["agk-systems","emg-sys"],"kd":"procedure","u":"sys-brake-failure","md":"- `P:` release/reapply→use opposite brake/rudder cautiously→reduce speed→mixture cutoff/engine shutdown if necessary→avoid obstacles.\n- One brake failed: plan runway/taxi direction; use aerodynamic control and minimum braking.\n- Hot brakes: stop clear, avoid parking brake, keep people away from wheel area.\n- `T:` brake pumping may not help every system; POH/system type wins.","p":["PPL","CPL"]},{"id":"08-18","card":"08","h":"Tire failure","a":"tire-failure","c":["agk-systems","emg-sys"],"kd":"procedure","u":"sys-tire-failure","md":"- Takeoff roll: reject if controllable/runway permits.\n- Landing: keep failed tire light as long as possible, aerodynamic braking, directional control, avoid heavy braking.\n- `T:` do not taxi fast after suspected failure.","p":[],"ph":["PPL","CPL"]},{"id":"08-19","card":"08","h":"Door / window open","a":"door--window-open","c":["emg-sys"],"kd":"procedure","u":"sys-door-window-open","md":"- `P:` fly aircraft→normal safe speed→land or close only if low workload/POH procedure.\n- Usually noise/vibration more than structural emergency in trainers.\n- `T:` reaching/fighting door can cause loss of control.","p":[],"ph":["PPL","CPL"]},{"id":"08-20","card":"08","h":"Windshield / bird strike","a":"windshield--bird-strike","c":["emg-sys"],"kd":"procedure","u":"sys-windshield-bird-strike","md":"- `P:` control→slow as appropriate→protect eyes→assess engine/controls/visibility→land.\n- Windshield penetration: goggles/sunglasses, head away from airflow, use side view/instruments.\n- `T:` hidden prop/leading-edge/control damage may exist even if engine runs.","p":[],"ph":["PPL","CPL"]},{"id":"08-21","card":"08","h":"Structural icing","a":"structural-icing","c":["met-icing"],"kd":"procedure","u":"sys-structural-icing","md":"- `P:` exit immediately toward known non-icing air→systems on per POH→declare→increase margins/speed as specified→nearest suitable landing.\n- Effects: stall speed↑, drag↑, climb↓, prop/engine/antenna/static blockage, control anomalies.\n- `T:` do not use autopilot to hide control-force change; avoid flap changes if tailplane icing concern/POH directs.","p":[],"ph":["PPL","CPL","IR"]},{"id":"08-22","card":"08","h":"Cabin heat / defrost","a":"cabin-heat--defrost","c":["agk-systems"],"kd":"procedure","u":"sys-cabin-heat-defrost","md":"- Often uses exhaust-shroud heat; exhaust crack can introduce CO.\n- `S:` exhaust smell, headache, detector alert.\n- `P:` heat/defrost off→fresh air→land.\n- `T:` windshield fogging may compete with CO response; safety of occupants first, land promptly.","p":["CPL"]},{"id":"08-23","card":"08","h":"Radio failure","a":"radio-failure","c":["law-atc","emg-sys","emg-comms"],"kd":"procedure","u":"sys-radio-failure","md":"- `P:` audio panel/volume/squelch/headset/mic/PTT/frequency/breaker→other radio→121.5/FSS/relay→transmit blind/listen→squawk `7600`.\n- VFR controlled: comply with light signals/land when safe. IFR: published/specific lost-comms procedure.\n- `T:` receiver failure vs transmitter failure may be different; keep listening.","p":["PPL","CPL"],"e":["PPL"]},{"id":"08-24","card":"08","h":"Transponder failure","a":"transponder-failure","c":["law-atc","emg-sys"],"kd":"procedure","u":"sys-transponder-failure","md":"- `P:` recycle/change code only if appropriate→check breaker/Mode C→advise ATC→comply with instructions/airspace restrictions.\n- `T:` do not select `7500/7600/7700` casually.","p":["PPL","CPL"],"e":["PPL"]},{"id":"08-25","card":"08","h":"Checklist / declaration","a":"checklist--declaration","c":["emg"],"kd":"procedure","u":"sys-checklist-declaration","md":"- Memory items stop immediate threat; flow organizes; current checklist verifies/finishes. Outdated memorization is hazardous.\n- `PAN PAN` urgent/reduced safety; `MAYDAY` serious/imminent danger. State callsign/problem/position-altitude/intentions/fuel/persons/assistance.\n- `T:` declaration is a resource, not failure.","p":["PPL","CPL"]},{"id":"08-26","card":"08","h":"Symptom quick map","a":"symptom-quick-map","c":["agk-systems","emg"],"kd":"procedure","u":"sys-symptom-quick-map","md":"| Symptom | First suspects |\n|---|---|\n| RPM↓ fixed-pitch, humid/partial power | carb ice |\n| MP↓ constant-speed, RPM stable | carb ice/induction/power |\n| rough + low fuel flow | starvation/selector/pump |\n| rough on one mag | plug/mag/lead |\n| low oil P + high T | lubrication failure |\n| discharge/low volts | alternator/gen failure |\n| AI+DG disagree, suction low | vacuum failure |\n| ASI odd, ALT/VSI normal | pitot failure |\n| ASI+ALT+VSI odd | static failure |\n| headache + heater | CO |\n| smoke/odour + electrical anomaly | electrical fire |\n\n- `T:` map starts diagnosis; POH/checklist determines action.","p":[],"ph":["PPL","CPL"]},{"id":"08-27","card":"08","h":"Pebble","a":"pebble","c":["agk-systems"],"kd":"pebble","u":"sys-pebble","md":"- PRESSURIZATION `outflow CLOSE→cabin P↑/ALT↓; OPEN→P↓/ALT↑ | ΔP=cabin−ambient | +relief excess internal P; −relief excess external P | decompression→O₂/emergency DESC per AFM; O₂ rules card 04`\n- FUEL `octane=knock resistance | AVGAS 80/87 RED; 100/130 GREEN (lean/rich); 100LL BLUE (LL=low lead) | JET A max freeze −40°C / A-1 −47°C; B wide-cut | FSII water-ice inhibitor ≠ fuel/airframe de-ice | approved fuel/grade per POH; colour alone≠proof`\n- MP `absolute intake P inHg | OFF≈ambient→IDLE↓↓ | throttle↑ MP↑ | non-turbo ALT↑→MPmax↓; turbo may hold MP to critical ALT | CS throttle→MP/PROP→RPM | carb ice CS MP↓ vs fixed RPM↓ | over-square=MP>RPM/100 (may be OK); overboost=MP>approved limit (RPM-dependent); POH wins`\n- POWERPLANT `JET exhaust | FAN bypass/core; BPR≠AFR | T-PROP gearbox→PROP | T-SHAFT output | STAGE≠SPOOL | fine low pitch/high RPM ↔ coarse high pitch/low RPM | feather drag↓ ≠ reverse | constant-speed governor holds RPM within stops | turboprop ALPHA=governed RPM / BETA=ground blade-angle lever (ground fine→reverse); BETA≠REVERSE; AFM limits | typical piston SE oil→coarse, ME oil→fine/feather on oil loss; POH wins`\n- `CONTROL-DIAGNOSE-MEMORY-CHECKLIST-DECLARE-LAND` | engine=`AIR-FUEL-SPARK-COMPRESSION` | rough=`HEAT-MIX-FUEL-PRIMER-MAGS` | mags independent of master | carb ice: full heat, worse→better | fuel gauges + clock, not gauges alone | low oil P+high T=land ASAP | alternator fail=`SHED-CALCULATE-COMMUNICATE-LAND` | pitot affects ASI; static affects ASI/ALT/VSI | vacuum often AI+DG | smoke/fire=land now | CO heat off/fresh air/land | flap asymmetry stop movement | controls first, checklist second | POH wins.","p":["PPL","CPL","ME"]},{"id":"12-1","card":"12","h":"Scope / discipline","a":"scope--discipline","c":["ifr"],"kd":"source","u":"proc-scope-discipline","md":"- `SRC:` current CARs/TC AIM/CAP/CFS/NOTAM + aircraft POH/AFM/SOP. TC flight-test guide = training/evaluation guidance, not legal authority.\n- `M:` aviate→navigate→communicate; configure early; verify source/mode; brief missed before FAF.\n- `T:` this QRC is generic. Aircraft memory items, speeds, automation logic, icing limitations and engine-out actions are aircraft-specific.","p":[],"ph":["IR"]},{"id":"12-2","card":"12","h":"Before engine start — IFR readiness","a":"before-engine-start--ifr-readiness","c":["ifr-plan"],"kd":"procedure","u":"proc-before-engine-start-ifr-readiness","md":"- `P:` weather→current CAP/CFS/AIP→NOTAM→AIP SUP/AIC→RSC→route/altitudes→fuel/alternate→W&B/performance→database/RAIM-WAAS→equipment/defects→personal minima.\n- Set paper/electronic backup, frequencies, route, departure plate, emergency/alternate plan.\n- `G:` legal + equipped + current + fuel + performance + escape options.\n- `T:` a valid clearance does not make an unsafe weather/icing/performance decision safe.","p":["IR"]},{"id":"12-3","card":"12","h":"Clearance copy","a":"clearance-copy","c":["law-atc","ifr-enr"],"kd":"procedure","u":"proc-clearance-copy","md":"- `M:` `CRAFT+` = clearance limit | route | altitude | frequency | transponder | release/void/EFC/restrictions.\n- `P:` copy verbatim→compare filed/expected→mark initial altitude and top altitude→identify SID/transition→read back limit/route/altitude/restrictions/squawk.\n- Ask immediately if ambiguous, impossible, below safe altitude, equipment-incompatible or route not understood.\n- `T:` takeoff clearance is separate. “Expect” altitude is not authorization to climb.","p":["IR"]},{"id":"12-4","card":"12","h":"IFR cockpit / instrument check","a":"ifr-cockpit--instrument-check","c":["agk-inst"],"kd":"procedure","u":"proc-ifr-cockpit-instrument-check","md":"- `P:` documents/database/current plates→pitot/static heat as req→altimeters set/cross-check→heading indicators aligned→turn instrument/compass during taxi→nav/comms identified→GPS annunciations→autopilot disconnect/test per POH.\n- Taxi turns: heading/compass turn correctly; attitude remains erect; turn coordinator/indicator responds; ball opposite turn; no abnormal flags.\n- `T:` never accept a failed instrument because GPS “looks fine.”","p":["PPL","CPL","IR"]},{"id":"12-5","card":"12","h":"Departure brief","a":"departure-brief","c":["ifr-dep"],"kd":"procedure","u":"proc-departure-brief","md":"- `P:` runway/TODA-ASDA if relevant→takeoff minima→SID/ODP→initial heading/track→first fix→initial altitude→top altitude→freq→climb gradient→terrain→weather→engine/instrument failure plan.\n- `M:` `RWY-PATH-ALT-FREQ-GRAD-THREATS-FAIL`.\n- State: reject criteria; failure before/after liftoff; return vs continue; lost-comms path; automation plan.\n- `T:` ATC vector does not erase obstacle/climb-gradient requirements before radar protection is assured.","p":["IR"]},{"id":"12-6","card":"12","h":"Before-takeoff IFR gate","a":"before-takeoff-ifr-gate","c":["ifr-dep"],"kd":"procedure","u":"proc-before-takeoff-ifr-gate","md":"- `G:` clearance understood/read back | runway verified | instruments green | nav source correct | departure loaded/activated | initial course/heading set | altitude bugged | squawk/Mode C | frequencies staged | timer/clock | takeoff brief complete.\n- `P:` heading bug→initial altitude→first nav leg→departure frequency→transponder→lights/pitot heat→doors/checklist.\n- `T:` wrong runway + correct SID is still wrong.","p":["IR"]},{"id":"12-7","card":"12","h":"Takeoff / initial climb","a":"takeoff--initial-climb","c":["ifr-dep"],"kd":"procedure","u":"proc-takeoff-initial-climb","md":"- `P:` runway/heading cross-check→power set/engine instruments→airspeed alive→rotate/climb→positive rate/gear as applicable→track runway/SID→instrument transition→after-TKOF flow/checklist.\n- TC flight-test context: instrument control once airborne and above `400 ft AAE`, unless departure procedure specifies otherwise.\n- Maintain assigned heading/track/altitude; verify course indications correspond to selected equipment.\n- `T:` do not chase needles immediately after liftoff; attitude/power first, then trim/nav.","p":["IR"]},{"id":"12-8","card":"12","h":"Climb gradient check","a":"climb-gradient-check","c":["ifr-dep"],"kd":"procedure","u":"proc-climb-gradient-check","md":"- `F:` required `fpm = GS × ft/NM ÷ 60`.\n- `P:` compare expected GS/ROC with published requirement before departure; monitor actual performance.\n- `T:` tailwind raises GS and required fpm. If unable, advise ATC before takeoff or immediately when recognized.","p":[],"ph":["IR"]},{"id":"12-9","card":"12","h":"Enroute flow","a":"enroute-flow","c":["ifr-enr"],"kd":"procedure","u":"proc-enroute-flow","md":"- `P:` level→power→trim→mixture/engine→altimeter setting→heading/nav cross-check→fuel/time→weather/icing→next frequency/fix/altitude.\n- `M:` `A-P-T-N-E-F`: altitude, power, trim, nav, engine, fuel.\n- Cross-check raw data vs GPS/autopilot; verify every direct-to/route amendment before EXEC/activate.\n- `T:` automation follows the programming error precisely.","p":["IR"]},{"id":"12-10","card":"12","h":"ATC amendment","a":"atc-amendment","c":["law-atc","ifr-enr"],"kd":"procedure","u":"proc-atc-amendment","md":"- `P:` write→read back→confirm aircraft state→modify one system at a time→verify active leg/course/altitude→monitor turn/intercept.\n- If saturated: “stand by,” request vector, delay descent, or ask for clarification.\n- `T:` heads-down programming during turn/descent = loss-of-control/setup-error trap.","p":["IR"]},{"id":"12-11","card":"12","h":"Arrival setup","a":"arrival-setup","c":["ifr-enr"],"kd":"procedure","u":"proc-arrival-setup","md":"- `P:` weather/ATIS→NOTAM/runway→approach choice→plate current→altimeter/RASS/cold temp→category/minima→landing performance→missed/alternate→fuel.\n- Load procedure with correct transition; verify waypoint sequence against plate; stage frequencies/courses; set minimums and missed altitude.\n- `M:` `WX-PLATE-NAV-MIN-MISSED-RWY-FUEL`.\n- `T:` loading an approach is not clearance to fly it or descend.","p":["IR"]},{"id":"12-12","card":"12","h":"Hold clearance copy","a":"hold-clearance-copy","c":["law-atc","ifr-enr","ifr-hold"],"kd":"procedure","u":"proc-hold-clearance-copy","md":"- `M:` `F-D-C-L-A-E` = fix | direction | course/radial/bearing | leg length/time | altitude | EFC.\n- `P:` copy/read back→slow before fix→determine inbound course/turn direction→choose safe entry→brief wind/timing/fuel/EFC→report entry if required.\n- `T:` no EFC or fuel ambiguity? ask.","p":["IR"]},{"id":"12-13","card":"12","h":"Hold entry / execution","a":"hold-entry--execution","c":["ifr-hold"],"kd":"procedure","u":"proc-hold-entry-execution","md":"- `P:` cross fix→entry→correct side/protected airspace→time outbound abeam/wings-level as appropriate→intercept inbound→adjust timing/wind.\n- Entry: direct / teardrop / parallel; any suitable entry that remains protected is acceptable.\n- Wind rough rule: outbound drift correction ≈ `3×` inbound correction; adjust outbound time to achieve inbound target.\n- TC test targets: track/course `±10°` or within ½-scale, airspeed `±10 kt`, altitude `±100 ft`.\n- `T:` perfect entry sketch with poor fuel awareness is failure. Continuously compute max holding time and alternate fuel.","p":["IR"]},{"id":"12-14","card":"12","h":"Approach clearance / vector-to-final","a":"approach-clearance--vector-to-final","c":["law-atc","ifr-app-fly"],"kd":"procedure","u":"proc-approach-clearance-vector-to-final","md":"- `P:` hear approach/runway/route/altitude→read back→verify clearance does not descend below published/assigned minimum→set intercept heading/course/source→arm correct mode only when appropriate.\n- On vectors: maintain last assigned altitude until cleared lower or established as required by clearance/procedure.\n- `T:` approach clearance ≠ landing clearance.","p":["IR"]},{"id":"12-15","card":"12","h":"Chart-symbol transition","a":"chart-symbol-transition","c":["nav-pubs","ifr-plates"],"kd":"procedure","u":"proc-chart-symbol-transition","md":"- Use current-chart symbology. PFAF lightning-bolt depiction is introduced incrementally from `2026-10-29`; apply it only where printed.","p":["IR"]},{"id":"12-16","card":"12","h":"Frequencies / nav source","a":"frequencies--nav-source","c":["nav-radio","ifr-plates"],"kd":"procedure","u":"plate-frequencies-nav-source","md":"- `P:` set/identify nav aid; verify Morse/voice where applicable; set inbound course/front course; cross-check GPS/database.\n- `T:` wrong CDI source is lethal: green needles vs magenta needles vs raw data.\n- `T:` ILS front course set even when autopilot/GPS displays course automatically; know equipment.","p":[],"ph":["IR"]},{"id":"12-17","card":"12","h":"Approach brief — compact","a":"approach-brief--compact","c":["ifr-app-fly"],"kd":"procedure","u":"proc-approach-brief-compact","md":"- `P:` “[procedure/runway], current plate; nav/freq/course; IAF/FAF altitudes; RASS/cold correction; category/minima/vis; MAP; missed climb-turn-fix-altitude; runway/LDA/lights; threats.”\n- `M:` `PROC-NAV-ALT-MIN-MAP-MISSED-RWY-THREATS`.\n- Pilot-monitoring/self-brief challenge: source? mode? next altitude? next fix? missed action?\n- Spoken form: “This is [procedure/runway] at [airport], plate current. Nav [source/freq/course], minima [line/category/DA-MDA/vis], altimeter/RASS [source/correction], FAF [fix/alt], MAP [fix/time/DME], missed [climb/turn/fix/hold], runway [LDA/lights], threats [wx/terrain/wind/icing/NOTAM].”","p":[],"ph":["IR"]},{"id":"12-18","card":"12","h":"Approach setup gate","a":"approach-setup-gate","c":["ifr-app-fly"],"kd":"procedure","u":"proc-approach-setup-gate","md":"- `G:` plate current | NOTAM checked | altimeter source/correction | frequencies identified | CDI source correct | course set | procedure sequence verified | minimums bugged | missed altitude/nav briefed | landing checklist planned.\n- `T:` green vs magenta needles; LOC vs ILS minima; LNAV vs LPV annunciation; wrong transition.","p":[],"ph":["IR"]},{"id":"12-19","card":"12","h":"Before FAF / FAWP gate","a":"before-faf--fawp-gate","c":["ifr-app-fly"],"kd":"procedure","u":"proc-before-faf-fawp-gate","md":"- `P:` landing checklist→speed/config plan→altitude verified→approach mode active/armed correctly→course alive→timer if required→missed mentally rehearsed.\n- RNAV: confirm approach-active mode within `2 NM` before FAWP inbound when required by TC test criteria.\n- `G:` stable enough to continue; if behind, request delay/vector or go missed.\n- `T:` do not descend because vertical guidance appears unless correct mode/procedure/altitude intercept conditions are verified.\n- Also before FAF: altimeter set/cross-checked, missed loaded/briefed, minimums bugged.","p":["IR"]},{"id":"12-20","card":"12","h":"Stable approach guide","a":"stable-approach-guide","c":["ifr-app-fly"],"kd":"procedure","u":"proc-stable-approach-guide","md":"- TC generic test guide: proper configuration, brief/checklist complete, appropriate power, lateral/vertical within ½-scale for ILS/LPV/LNAV-VNAV, sink ≤`1000 fpm`, speed within `+20/-0`, only small corrections.\n- Stable by `1000 AGL` in IMC / `500 AGL` in VMC; otherwise missed/go-around.\n- `CONTEXT:` TC instrument flight-test guide criterion; not a CAR approach minimum. Operator/school SOP may be tighter.\n- `T:` training/SOP criteria may be tighter. Becoming unstable after the gate still requires a missed approach.","p":[],"ph":["IR"]},{"id":"12-21","card":"12","h":"NPA / CDFA","a":"npa--cdfa","c":["ifr-app-fly"],"kd":"procedure","u":"proc-npa-cdfa","md":"- Prefer CDFA when practical for NPA with suitable slope.\n- `P:` calculate descent→cross FAF at/above altitude→constant descent→respect every stepdown→level at/above MDA if required or treat MDA as decision-style altitude when visual references not imminent.\n- No descent below MDA without required visual reference; no missed-approach turn before MAP.\n- `T:` CDFA does not turn MDA into a legal DA. Prevent momentum from carrying below MDA.","p":["IR"]},{"id":"12-22","card":"12","h":"ILS / LPV / LNAV-VNAV","a":"ils--lpv--lnav-vnav","c":["nav-radio","nav-gnss","ifr-app-fly"],"kd":"procedure","u":"proc-ils-lpv-lnav-vnav","md":"- `P:` intercept lateral course→vertical path from valid position/below as applicable→confirm correct annunciation→small corrections→cross-check altitude/distance→DA decision.\n- ILS/LPV: maintain no more than ½-scale deviations for test standard; at DH/DA without required visual reference→missed.\n- `T:` false glideslope from above; LPV≠ILS; LNAV/VNAV temperature limits; automation downgrade can change minima.","p":["IR"]},{"id":"12-23","card":"12","h":"LNAV / VOR / LOC / NDB","a":"lnav--vor--loc--ndb","c":["nav-radio","nav-gnss","ifr-app-fly"],"kd":"procedure","u":"proc-lnav-vor-loc-ndb","md":"- `P:` identify source→course/raw-data check→FAF altitude→CDFA/stepdowns→MDA→MAP identification.\n- Start timer when required; verify DME/GPS waypoint sequence; maintain MDA until visual descent or MAP.\n- `T:` LOC approach uses LOC minima. “Glideslope available” does not authorize ILS minima if not cleared/equipped/identified.","p":["IR"]},{"id":"12-24","card":"12","h":"Visual transition","a":"visual-transition","c":["ifr-minima"],"kd":"procedure","u":"proc-visual-transition","md":"- `G:` required visual reference established and maintained + normal descent/landing possible + runway/traffic/clearance understood.\n- Transition with minimal manoeuvring; remain within limitations; confirm landing clearance at controlled airport.\n- `T:` runway lights in sight do not automatically mean position/rate permit a safe landing.","p":["IR"]},{"id":"12-25","card":"12","h":"Missed approach — universal flow","a":"missed-approach--universal-flow","c":["ifr-app-fly","ifr-missed"],"kd":"procedure","u":"proc-missed-approach-universal-flow","md":"- `P:` POWER→ATTITUDE→CONFIG→TRACK→NAV→TALK→CHECKLIST.\n- Initiate promptly at MAP/MAWP or DH/DA, or earlier if unstable/unsafe/unable.\n- Follow published missed or ATC modification; report missed; climb to published/cleared altitude; advise if unable climb gradient/restriction.\n- TC test targets: airspeed `+10/-5`, heading/track `±10°`, altitude `±100 ft`.\n- `T:` first turn no earlier than published/MAP requirements. Do not level beyond MAP searching for runway.","p":["IR"]},{"id":"12-26","card":"12","h":"Missed approach setup","a":"missed-approach-setup","c":["ifr-app-fly","ifr-missed"],"kd":"procedure","u":"proc-missed-approach-setup","md":"- Before FAF know: initial climb altitude, straight-ahead requirement, turn altitude, direction, fix/hold, nav source, frequency, minimum climb gradient.\n- GNSS: know `SUSP/OBS` sequencing and when to activate missed; verify unit-specific procedure.\n- `T:` pressing buttons before pitch/power/config creates CFIT/loss-of-control risk.","p":["IR"]},{"id":"12-27","card":"12","h":"Circling","a":"circling","c":["ifr-missed"],"kd":"procedure","u":"proc-circling","md":"- `P:` use correct category/minima→identify runway/traffic→remain visual/protected→configure conservatively→bank ≤aircraft/SOP limits→stable normal descent.\n- Lost visual: execute missed; initially manoeuvre toward landing runway as appropriate, then intercept published missed per plate/SOP.\n- `T:` speed above category may require higher category. Night/marginal circling deserves higher personal minima.","p":["IR"]},{"id":"12-28","card":"12","h":"Lost communications — immediate","a":"lost-communications--immediate","c":["emg-comms"],"kd":"procedure","u":"proc-lost-communications-immediate","md":"- `P:` maintain control/clearance→check volume/squelch/audio panel/mic/PTT/frequency/circuit breakers per POH→try last/next/121.5/FSS/relay→listen on NAV/voice→squawk `7600`.\n- Transmit blind with intentions/position/altitude; monitor for light signals if applicable; use phone after landing.\n- `T:` specific SID/STAR/IAP comm-fail instructions override generic memory.","p":["IR"]},{"id":"12-29","card":"12","h":"Lost communications — route / altitude / time","a":"lost-communications--route--altitude--time","c":["emg-comms"],"kd":"procedure","u":"proc-lost-communications-route-altitude-time","md":"- VMC after failure: continue VFR and land as soon as practicable.\n- IMC route: `A-V-E-F` = assigned→vectored direct to specified fix/route/airway→expected→filed.\n- IMC altitude: highest `A-M-E` = assigned / minimum IFR altitude / expected.\n- Descent/approach timing: use applicable latest ETA/EAT/EFC logic and published procedure.\n- `T:` generic mnemonic cannot answer every uncovered scenario; exercise judgment and comply with published instructions.","p":[],"ph":["IR"]},{"id":"12-30","card":"12","h":"Vacuum / attitude-heading failure","a":"vacuum--attitude-heading-failure","c":["agk-gyro","emg-sys","ifr-emerg"],"kd":"procedure","u":"proc-vacuum-attitude-heading-failure","md":"- `P:` recognize flag/inconsistent indications→cover/ignore failed instruments→level using reliable instruments→power/trim→advise ATC→request vectors/no-gyro or suitable approach→reduce workload.\n- Cross-check turn instrument, compass, ASI, ALT, VSI, GPS track if approved/reliable.\n- `T:` slow-failing gyro can look plausible. Confirm with multiple instruments.","p":["PPL","CPL","IR"]},{"id":"12-31","card":"12","h":"No-gyro vectors","a":"no-gyro-vectors","c":["agk-gyro","ifr-emerg"],"kd":"procedure","u":"proc-no-gyro-vectors","md":"- ATC may instruct “start turn/stop turn”; use standard-rate turns unless otherwise instructed, half-standard on final if directed/appropriate.\n- `P:` acknowledge→stabilize altitude/speed→turn on command→stop promptly→monitor compass/turn instrument.\n- `T:` no-gyro vector does not replace terrain/altitude responsibility outside ATC protection.","p":["CPL"]},{"id":"12-32","card":"12","h":"Pitot/static failure","a":"pitotstatic-failure","c":["agk-pitot","emg-sys","ifr-emerg"],"kd":"procedure","u":"proc-pitot-static-failure","md":"- Pitot blocked + drain open: ASI→zero. Pitot+drain blocked: ASI altitude-like. Static blocked: ALT freezes; VSI zero; ASI errors with altitude changes.\n- `P:` pitot heat→alternate static per POH→use attitude/power/GPS/known settings→advise ATC→land.\n- `T:` alternate static may change indications; know aircraft correction.","p":["IR"]},{"id":"12-33","card":"12","h":"Electrical failure","a":"electrical-failure","c":["agk-elec","emg-sys","ifr-emerg"],"kd":"procedure","u":"proc-electrical-failure","md":"- `P:` confirm alternator/gen failure→reset only per POH→shed load→estimate battery endurance→preserve comm/nav/gear/flaps→declare/divert/land before total loss.\n- Turn off nonessential lights/heaters/chargers; plan manual gear/flap or handheld backup if applicable.\n- `T:` low-voltage light is time-critical in IMC/night.","p":["PPL","CPL","IR"]},{"id":"12-34","card":"12","h":"Autopilot / trim runaway","a":"autopilot--trim-runaway","c":["emg-sys","ifr-emerg"],"kd":"procedure","u":"proc-autopilot-trim-runaway","md":"- `P:` disconnect→override/control→pull appropriate breaker/switch per POH→retrim manually→advise ATC/request lower workload.\n- `T:` autopilot masks develop
