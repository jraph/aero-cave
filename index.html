,"kd":"knowledge","u":"wx-cloud-families","md":"| Cloud | Typical significance |\n|---|---|\n| `Ci/Cs/Cc` | high ice cloud; system/front clues |\n| `As/Ac` | mid-level layered/convective; possible icing |\n| `St/Sc` | low stable layer; ceiling/vis concern |\n| `Ns` | widespread steady precip, low ceilings |\n| `Cu` | convective; benign→growing |\n| `TCU` | strong convection, turbulence/icing |\n| `CB` | TS hazards: turbulence/hail/ice/lightning/shear |\n\n- `T:` cloud type often tells stability/lift mechanism.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"MET-52","card":"MET","f":"kb/met/stability-clouds.md","h":"Precipitation","a":"precipitation","c":["met-stab"],"kd":"knowledge","u":"wx-precip","md":"- Droplets/crystals grow by collision/coalescence or ice-crystal process.\n- `RA` liquid; `DZ` tiny droplets; `SN`; `PL` ice pellets; `FZRA/FZDZ` supercooled liquid freezing on contact.\n- `!:` freezing rain/drizzle = high-severity icing signal.\n- Virga = precip evaporates before ground; may indicate downdrafts/microburst potential.","p":["PPL","CPL"],"e":["PPL"]},{"id":"MET-53","card":"MET","f":"kb/met/stability-clouds.md","h":"Change of state and latent heat","a":"change-of-state-and-latent-heat","c":["met-stab"],"kd":"knowledge","u":"wx-change-of-state-latent-heat","md":"| Change | Name | Latent heat |\n|---|---|---|\n| liquid → vapour | evaporation | absorbed (cools surroundings) |\n| vapour → liquid | condensation | **released** (warms air) |\n| solid → liquid | melting | absorbed |\n| liquid → solid | freezing | released |\n| solid → vapour | sublimation | absorbed |\n| vapour → solid | deposition | released |\n\n- Condensation in rising air releases heat → saturated air cools slower (SALR < DALR) → feeds cloud and thunderstorm growth.\n- `T` Evaporation of precipitation cools air below cloud → downdraft/microburst strength.\n- `?:` general knowledge; no free TC or NAV CANADA text found. Check against a TC-recognized text (e.g. *From the Ground Up*, TC Flight Training Manual) in the fact-check pass.","p":["CPL"]},{"id":"MET-54","card":"MET","f":"kb/met/stability-clouds.md","h":"Pebble","a":"pebble","c":["met-stab"],"kd":"pebble","u":"met-stab-pebble","md":"- LAPSE `DALR ≈3°C/1000 ft | SALR ≈1.5°C/1000 ft average, varies | environment cools faster than DALR → absolutely unstable | slower than SALR / inversion → absolutely stable | between → conditionally unstable`\n- AIR `stable = STRATUS-SMOOTH-POOR VIS-steady precip | unstable = CU/TCU/CB-TURB-SHOWERS, better vis between cloud`\n- CLOUD BASE `exam AGL = 1000(T−Td)/3 | parcel AGL = 1000(T−Td)/(3−0.5) | surface-lifted convective parcel only ≠ every ceiling`\n- DEW POINT `small T−Td + cooling → fog/low cloud more likely, not guaranteed | inversion = temp↑ with height: strongly stable, traps haze/smoke, possible wind shear`\n- PRECIP `FZRA/FZDZ = supercooled liquid, freezes on contact → high-severity icing | virga → possible downdraft/microburst`\n- CHANGE OF STATE `heat absorbed: evaporation, melting, sublimation | released: condensation, freezing, deposition | condensation heat → SALR < DALR → storms`","p":["PPL","CPL","IR"]},{"id":"MET-55","card":"MET","f":"kb/met/taf.md","h":"TAF scan / groups","a":"taf-scan--groups","c":["met-taf"],"kd":"knowledge","u":"wxp-taf","md":"- `P:` ID→issue/valid→prevailing→`FM/BECMG/TEMPO/PROB` timeline covering DEP/ETA/ALT ETA + delay; do not average groups.\n- `FM` permanent from minute | `BECMG` gradual permanent | `TEMPO` each `<1 h`, combined `≤½` of the TEMPO window [TC AIM 2026-2, MET 7.3, p. 158] | `PROB30/40` probability.\n- `FM` begins a new self-contained forecast period. With `BECMG/TEMPO`, unchanged groups may carry forward, but a changed cloud group gives the complete new cloud picture; visibility/weather/obscuration form another related group. Do not retain an old cloud layer merely because it is absent after a change. `[AIM MET 7.4]`","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"MET-56","card":"MET","f":"kb/met/taf.md","h":"TAF alternate / risk","a":"taf-alternate--risk","c":["met-taf","ifr-alt"],"kd":"knowledge","u":"wxp-taf-alternate","md":"- `BECMG` improve=end, deteriorate=start; `TEMPO`≥alternate minima; `PROB`≥landing minima.\n- `T:` alternate≠landing≠approach-ban minima. `TEMPO` near ETA and `PROB30/40` high-consequence `TS/FZRA/low vis` require fuel/options; many short groups reduce confidence.","p":["PPL","CPL","IR"],"e":["PPL"]},{"id":"MET-57","card":"MET","f":"kb/met/taf.md","h":"TAF change groups","a":"taf-change-groups","c":["met-taf"],"kd":"formula","u":"wx-taf-change-groups","md":"- `BECMG` improving: use new condition at end of period.\n- `BECMG` deteriorating: use new condition at start of period.\n- `TEMPO` must stay ≥ alternate minima.\n- `PROB` must stay ≥ landing minima.\n- `T:` alternate minima ≠ landing minima ≠ approach ban.","p":[],"ph":["PPL","CPL","IR"]},{"id":"MET-58","card":"MET","f":"kb/met/taf.md","h":"Pebble","a":"pebble","c":["met-taf"],"kd":"pebble","u":"met-taf-pebble","md":"- TAF `FM = permanent from the minute, new self-contained period | BECMG = gradual permanent | TEMPO = each <1 h, combined ≤½ TEMPO window | PROB30/40 | do not average groups`\n- ALTERNATE `BECMG improve = end / deteriorate = start | TEMPO ≥ alternate minima | PROB ≥ landing minima | alternate ≠ landing ≠ approach-ban minima`","p":["PPL","CPL","IR"]},{"id":"MET-59","card":"MET","f":"kb/met/thunderstorms.md","h":"Thunderstorms","a":"thunderstorms","c":["met-ts"],"kd":"knowledge","u":"wx-thunderstorms","md":"- Moisture + instability + lift.\n- Stages:\n  1. **Cumulus:** updrafts only.\n  2. **Mature:** up + downdrafts; precip; maximum hazards.\n  3. **Dissipating:** downdrafts dominate.\n- Hazards: extreme turbulence, hail, lightning, heavy precip, icing, tornado, wind shear/microburst, instrument errors.\n- `!:` avoid with large margin: cells/lines/embedded TS; never use a visual/radar “gap” to thread active cells.\n- Assess SIGMET/GFA/TAF/PIREP/radar/lightning/satellite for movement/growth/line/escape. `T:` datalink delayed; attenuation hides cells.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"MET-60","card":"MET","f":"kb/met/thunderstorms.md","h":"Thunderstorm types, coverage, lightning detection","a":"thunderstorm-types-coverage-lightning-detection","c":["met-ts","ifr-wx"],"kd":"knowledge","u":"wx-thunderstorm-types-lightning-detection","md":"- Types by trigger: **air mass** (surface heating, afternoon, isolated) · **frontal** (cold air undercuts warm air) · **lake-breeze** (cool lake air meets hot humid air inland) · **upslope / orographic** (forced over terrain; early-day storms on east slopes of the Rockies) · organized lines and systems (**squall line**, MCS) often along fronts. [ECCC *Severe Weather in Canada* ch. 4; NAV CANADA AvMet reference, thunderstorm]\n- Coverage terms: GFA `ISOL` ≤25 % · `OCNL` 26–50 % · `FRQ` >50 % [MET 4.11, same in AIRMET 5.2] · high-level SigWx `ISOL` <50 % · `OCNL` 50–75 % · `FRQ` >75 % [MET 12.2]. SIGMET TS implies severe icing + turbulence [MET 6.2].\n- `T:` same word, different % on GFA vs high-level SigWx.\n- Avoid severe storms (or intense echoes, incl. anvil) by ≥**20 NM**; strong echoes ≤40 NM apart = no safe gap; tops ≥35 000 ft = severe; never under a storm. [AIM AIR 2.7.1–2.7.2]\n- Radar shows precipitation; stronger return → generally worse turbulence; light echoes ≠ light storm. [AIR 2.7.1–2.7.2]\n- Lightning detection: Canadian Lightning Detection Network (CLDN) data to FICs/ACCs; AUTO stations outside CLDN cannot report TS. [MET 1.2.2, 1.2.3, 1.3.9.2; CFS]\n- 703/704 ops: passengers in IMC with forecast TS need thunderstorm detection equipment or weather radar. [CAR 703.65, 704.64]\n- `?:` airborne strike finders map electrical discharges, not precipitation: no TC source found.","p":["CPL","IR"]},{"id":"MET-61","card":"MET","f":"kb/met/thunderstorms.md","h":"Pebble","a":"pebble","c":["met-ts"],"kd":"pebble","u":"met-ts-pebble","md":"- TS `MOISTURE + INSTABILITY + LIFT | cumulus = updrafts only → mature = up + downdrafts, precip, maximum hazards → dissipating = downdrafts dominate`\n- HAZARDS `extreme turbulence | hail | lightning | icing | wind shear/microburst | tornado`\n- AVOID `large margin: cells/lines/embedded TS | never thread a visual/radar gap | datalink delayed; attenuation hides cells`\n- TS `GFA ISOL ≤25 · OCNL 26–50 · FRQ >50 % | hi SigWx ISOL <50 · OCNL 50–75 · FRQ >75 % | avoid severe ≥20 NM | strong echoes ≤40 NM apart = no gap | CLDN lightning to FIC/ACC`","p":["PPL","CPL","IR"]},{"id":"MET-62","card":"MET","f":"kb/met/turbulence-wind-shear.md","h":"Turbulence","a":"turbulence","c":["met-turb"],"kd":"knowledge","u":"wx-turbulence","md":"- Mechanical: wind over terrain/buildings; strongest low/lee side.\n- Convective: thermal/CU/TCU/CB/TS/showers.\n- Frontal: wind/shear + convection.\n- Mountain wave/rotor: strong stable cross-ridge flow.\n- CAT: often near jet stream/strong wind shear, without cloud.\n- `P:` choose altitude/route/time; slow to turbulence penetration speed per POH; secure cabin; report.\n- `T:` Va changes with weight; published max-gross Va may be too high at lower weight.\n- `T:` turbulence intensity depends on aircraft response; same air mass affects light aircraft more.","p":["PPL","CPL","IR"],"e":["CPL"]},{"id":"MET-63","card":"MET","f":"kb/met/turbulence-wind-shear.md","h":"Mountain wave / terrain weather","a":"mountain-wave--terrain-weather","c":["met-turb"],"kd":"knowledge","u":"wx-mountain-wave","md":"- Favoured by strong wind roughly perpendicular to ridge + stable layer.\n- Smooth wave aloft; severe rotor/turbulence below/lee; strong up/downdrafts.\n- Lenticular `ACSL` = wave clue; rotor cloud may mark turbulence.\n- `!:` downdraft may exceed climb capability.\n- Check ridge wind angle/speed, mountain wave, rotor, obscuration, ceiling above pass, escape route, downdraft performance.\n- `P:` cross ridge with margin/angle/escape; avoid lee rotor/cloud; no narrow-valley commitment without turnaround room.\n- `T:` reported aerodrome ceiling may not clear enroute terrain.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"MET-64","card":"MET","f":"kb/met/turbulence-wind-shear.md","h":"Wind shear","a":"wind-shear","c":["met-turb"],"kd":"knowledge","u":"wx-wind-shear","md":"- Rapid wind speed/direction change over short distance.\n- Sources: fronts, inversions/low-level jets, terrain, TS/microbursts.\n- Low-level shear changes IAS/flight path quickly near ground.\n- `T:` surface wind can look acceptable while shear above is severe.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"MET-65","card":"MET","f":"kb/met/turbulence-wind-shear.md","h":"Microburst / LLWS","a":"microburst--llws","c":["met-turb"],"kd":"knowledge","u":"wx-microburst","md":"- Microburst = concentrated downdraft spreading outward at surface.\n- Aircraft may see: headwind/IAS↑ → downdraft → tailwind/IAS↓.\n- Most dangerous low during takeoff/landing.\n- TAF wind shear group describes significant shear in lowest `1500 ft AGL`.\n- Clues / red flags: virga, heavy showers, gust fronts, TS, strong inversion/low-level jet, large surface-vs-aloft wind difference.\n- `!:` postpone/avoid severe shear; go-around may enter worse performance.\n- `T:` increasing airspeed followed by rapid loss can be microburst signature (`M:` gain first can precede severe loss); follow aircraft procedure.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"MET-66","card":"MET","f":"kb/met/turbulence-wind-shear.md","h":"Jet stream / CAT","a":"jet-stream--cat","c":["met-turb","met-systems"],"kd":"knowledge","u":"wx-jet-cat","md":"- Narrow band of strong upper wind near tropopause, usually strongest horizontal temp gradient.\n- CAT favoured near jet core/shear zones, especially bends/entrance/exit regions.\n- Jet position helps locate fronts/system movement.","p":["PPL","CPL"]},{"id":"MET-67","card":"MET","f":"kb/met/turbulence-wind-shear.md","h":"Turbulence reporting criteria — MET 2.2.2","a":"turbulence-reporting-criteria--met-222","c":["met-turb"],"kd":"knowledge","u":"wx-turbulence-reporting-criteria-met-2-2-2","md":"| Intensity | Aircraft | Inside |\n|---|---|---|\n| **Light** | momentary slight, erratic changes in altitude/attitude | mild pressure from belts; loose items may shift slightly |\n| **Moderate** | altitude/attitude changes, **positive control at all times** | clear pressure from belts; unsecured objects dislodged; walking/serving difficult |\n| **Severe** | **large, abrupt** changes in altitude/attitude | forced hard against belts; unsecured objects thrown about; walking/serving impossible |\n\n- Frequency: **occasional <⅓** of the time · **intermittent ⅓–⅔** · **continuous >⅔**.\n\n- Sources: [TC AIM MET](https://tc.canada.ca/sites/default/files/2026-10/aim-2026-2_met_en.pdf) 2.2.2, Table 2.2.","p":["PPL","CPL"]},{"id":"MET-68","card":"MET","f":"kb/met/turbulence-wind-shear.md","h":"Pebble","a":"pebble","c":["met-turb"],"kd":"pebble","u":"met-turb-pebble","md":"- TURB `mechanical = wind over terrain/buildings, strongest low/lee | convective | frontal | wave/rotor | CAT near jet stream/strong shear, without cloud | slow to turbulence penetration speed per POH | Va changes with weight`\n- WAVE `strong wind ⟂ ridge + stable layer | smooth aloft, severe rotor below/lee | lenticular ACSL = clue | downdraft may exceed climb capability | aerodrome ceiling may not clear enroute terrain`\n- SHEAR `rapid speed/direction change over short distance | fronts, inversions/low-level jets, terrain, TS/microbursts | TAF wind shear group = lowest 1500 ft AGL | acceptable surface wind ≠ no shear above`\n- MICROBURST `IAS↑ then ↓ (headwind → downdraft → tailwind) | most dangerous low on TKOF/LDG | virga / gust front / TS clues | go-around may enter worse performance`\n- JET `near tropopause, strongest horizontal temp gradient | CAT near core/shear zones, bends/entrance/exit`\n- TURB REPORT `light slight/momentary | moderate changes, positive control | severe large abrupt | occasional <⅓, intermittent ⅓–⅔, continuous >⅔`","p":["PPL","CPL","IR"]},{"id":"MET-69","card":"MET","f":"kb/met/weather-products.md","h":"Product roles","a":"product-roles","c":["met-products"],"kd":"knowledge","u":"wx-products","md":"| Product | Tells you |\n|---|---|\n| `METAR` | observed aerodrome weather now |\n| `SPECI` | significant observed change |\n| `TAF` | forecast aerodrome conditions/time changes |\n| `GFA` | regional clouds/weather + icing/turb/freezing level |\n| `AIRMET` | potentially hazardous weather / significant change below SIGMET severity (lower-severity/unforecast hazard) |\n| `SIGMET` | significant hazardous weather affecting flight safety |\n| `PIREP` | actual conditions encountered |\n| `FB/upper winds` | forecast wind/temp aloft |\n| `Radar` | precipitation location/intensity/trend; not all turbulence/ice |\n| `Satellite` | cloud structure/coverage; interpretation required |\n| `RSC/CRFI` | runway contamination/condition/friction information |\n\n- `T:` radar gap ≠ clear air. no PIREPs ≠ no hazard.\n- METAR/TAF cloud heights = AGL; GFA heights generally ASL unless stated.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"MET-70","card":"MET","f":"kb/met/weather-products.md","h":"Weather trend logic","a":"weather-trend-logic","c":["met-products","met-decide"],"kd":"knowledge","u":"wx-trend","md":"- Observation = **now**; forecast = **expected**; trend = whether expectation is occurring.\n- Compare several METAR/SPECI, not one snapshot.\n- Falling ceiling/vis + pressure + increasing wind/precip often signals approaching system deterioration.\n- `T:` forecast confidence drops when observations repeatedly diverge.","p":[],"ph":["PPL","CPL","IR"]},{"id":"MET-71","card":"MET","f":"kb/met/weather-products.md","h":"Pebble","a":"pebble","c":["met-products"],"kd":"pebble","u":"met-products-pebble","md":"- PRODUCTS `METAR now | SPECI significant change | TAF aerodrome forecast | GFA regional + icing/turb/freezing level | AIRMET below SIGMET severity | SIGMET hazardous | PIREP actual | FB wind/temp aloft`\n- HEIGHTS `METAR/TAF cloud = AGL | GFA generally ASL unless stated`\n- T `radar gap ≠ clear air | no PIREPs ≠ no hazard | observation = now / forecast = expected / trend = is the forecast happening | repeated divergence → confidence↓`","p":["PPL","CPL","IR"]},{"id":"IFR-0","card":"IFR","f":"kb/ifr/alternate-minima.md","h":"Alternate minima","a":"alternate-minima","c":["ifr-alt"],"kd":"knowledge","u":"ifr-alternate-minima","md":"| Facilities | Weather requirement |\n|---|---|\n| 2+ usable precision, separate suitable runways | `400-1` or `+200/+1/2` above lowest usable HAT/vis, greater |\n| 1 usable precision | `600-2*` or `+300/+1` above lowest HAT/vis, greater |\n| NPA only | `800-2*` or `+300/+1` above lowest HAT/HAA and vis, greater |\n| No IFR approach | forecast ≥`500 ft` above min IFR alt permitting VFR approach/landing |\n\n- Standard alternate minima: `600-2` or `800-2` as applicable; if standard applies, other authorized lower-vis options may apply from CAP table.\n- `T:` alternate use depends on aircraft performance, nav equipment, NAVAIDs/NOTAM, forecast type, wind/runway, and chart “alternate not authorized.”\n- `T:` “alternate not authorized” / NOTAM NAVAID out / runway not suitable / no forecast can kill an otherwise good alternate.","p":["IR"]},{"id":"IFR-1","card":"IFR","f":"kb/ifr/alternate-minima.md","h":"TAF alternate logic","a":"taf-alternate-logic","c":["ifr-alt","met-taf","ifr-wx"],"kd":"knowledge","u":"ifr-taf-alternate-logic","md":"- Improving `BECMG`: use new condition at END of BECMG period.\n- Deteriorating `BECMG`: use new condition at START of BECMG period.\n- `TEMPO` must not be below alternate minima.\n- `PROB` must not be below appropriate landing minima.\n- GFA alternate: no cloud <`1000 ft` above lowest usable HAT/HAA; no CB; vis ≥`3 SM`.\n- Aerodrome advisory forecast alternate: ≥`500 ft` above lowest usable HAT/HAA and vis ≥`3 SM`.\n- `T:` alternate minima ≠ landing minima ≠ approach-ban minima.","p":["IR"]},{"id":"IFR-2","card":"IFR","f":"kb/ifr/alternate-minima.md","h":"Alternate minima memory","a":"alternate-minima-memory","c":["ifr-alt"],"kd":"formula","u":"ifr-alternate-minima-memory","md":"| Case | Weather memory |\n|---|---|\n| 2+ precision, separate suitable runways | `400-1` or `+200/+1/2`, greater |\n| 1 precision | `600-2` or `+300/+1`, greater |\n| NPA only | `800-2` or `+300/+1`, greater |\n| no IFR approach | ≥`500 ft` above min IFR alt allowing VFR app/landing |\n\n- `T:` check CAP alternate notes, NOTAM, NAVAID, runway suitability, forecast type.","p":[],"ph":["IR"]},{"id":"IFR-3","card":"IFR","f":"kb/ifr/alternate-minima.md","h":"Pebble","a":"pebble","c":["ifr-alt"],"kd":"pebble","u":"ifr-alternate-minima-pebble","md":"- ALTERNATE `2+ usable precision, separate suitable RWYs: 400-1 or +200/+½ | 1 precision: 600-2 or +300/+1 | NPA only: 800-2 or +300/+1 | each = above lowest usable HAT (HAA for NPA)/vis, whichever greater | no IFR approach: forecast ≥500 ft above min IFR altitude permitting VFR approach/landing`\n- TAF `BECMG improve = END / deteriorate = START | TEMPO ≥ alternate minima | PROB ≥ landing minima`\n- GFA / ADVISORY `GFA: no cloud <1000 ft above lowest usable HAT/HAA, no CB, vis ≥3 SM | advisory forecast: ≥500 ft above lowest usable HAT/HAA, vis ≥3 SM`\n- T `alternate minima ≠ landing minima ≠ approach-ban minima | “alternate not authorized” / NAVAID NOTAM / RWY not suitable / no forecast kills an alternate`","p":["IR"]},{"id":"IFR-4","card":"IFR","f":"kb/ifr/approaches.md","h":"Approach brief","a":"approach-brief","c":["ifr-app-fly"],"kd":"knowledge","u":"ifr-approach-brief","md":"- `P:` plate/eff date→airport/runway/proc→freq/nav source→MSA/RASS/cold temp→IAF/IF/FAF→altitudes/stepdowns→DA/MDA/HAT/HAA/vis→MAP→missed→runway/LDA/lights→threats.\n- `M:` plate-wx-nav-alt-min-MAP-missed-rwy-threats.\n- `T:` CDI source errors kill. brief both lateral/vertical mode and missed nav setup.","p":[],"ph":["IR"]},{"id":"IFR-5","card":"IFR","f":"kb/ifr/approaches.md","h":"Approach types","a":"approach-types","c":["ifr-app-fly"],"kd":"knowledge","u":"ifr-approach-types","md":"- Precision: ILS with lateral+vertical guidance; uses `DA/DH`.\n- APV: vertical guidance but not precision; e.g., `LPV`, `LNAV/VNAV`; uses `DA`.\n- NPA: lateral guidance only; e.g., LOC/VOR/NDB/LNAV; uses `MDA`.\n- SCDA/CDFA: stable descent technique on NPA; do not descend below MDA without visual reference.\n- CAP minima box lists nav type, MDA/DA, HAA/HAT/HATh/DH, advisory visibility by aircraft category.\n- `T:` LPV is not ILS. Baro-VNAV temperature limits matter; uncompensated altimetry can invalidate VNAV minima.\n- Circling: visual manoeuvre; uses `MDA` / `HAA`.","p":["IR"]},{"id":"IFR-6","card":"IFR","f":"kb/ifr/approaches.md","h":"ILS / LOC / VOR / NDB / DME","a":"ils--loc--vor--ndb--dme","c":["ifr-app-fly","nav-radio"],"kd":"knowledge","u":"ifr-ils-loc-vor-ndb-dme","md":"- ILS: localizer lateral + glideslope vertical; identify frequency/course; beware false GS from above.\n- LOC: localizer lateral only; no glideslope; use LOC minima/MDA.\n- VOR: radials FROM station; set correct course; TO/FROM flag matters.\n- NDB/ADF: bearing to station; wind correction/relative bearing; high workload; needle points to station, not necessarily desired track.\n- DME: slant range; DME arcs require lead/radial orientation.\n- `T:` reverse sensing only if display/source/course logic mishandled; know equipment.","p":["PPL","CPL","IR"],"e":["CPL"]},{"id":"IFR-7","card":"IFR","f":"kb/ifr/approaches.md","h":"Descent / approach math","a":"descent--approach-math","c":["ifr-app-fly"],"kd":"formula","u":"ifr-descent-approach-math","md":"- `F:` 3° path ≈ `300 ft/NM`; required ROD ≈ `GS × 5`.\n- `F:` descent gradient ft/NM → `ROC/ROD fpm = GS × ft/NM / 60`.\n- `F:` descent distance NM ≈ altitude to lose / `300` for 3°. `T:` add level segments, stepdowns, wind, configuration.\n- `F:` time min = distance/GS×60. `T:` groundspeed, not IAS.","p":[],"ph":["IR"]},{"id":"IFR-8","card":"IFR","f":"kb/ifr/approaches.md","h":"Initial / intermediate segment","a":"initial--intermediate-segment","c":["ifr-app-fly","ifr-plates"],"kd":"knowledge","u":"plate-initial-intermediate-segment","md":"- Identify crossing altitudes and restrictions before FAF/FAP.\n- Stepdown fixes: confirm fix source and altitude. If fix cannot be identified, stepdown may be unusable.\n- `T:` “at or above” altitude is a floor, not a target to duck under early.","p":["IR"]},{"id":"IFR-9","card":"IFR","f":"kb/ifr/approaches.md","h":"PFAF depiction transition","a":"pfaf-depiction-transition","c":["ifr-app-fly","nav-pubs","ifr-plates"],"kd":"knowledge","u":"plate-pfaf-depiction-transition","md":"- Use the symbols actually printed on the plate.\n- From `2026-10-29` (AIC `013/2026`), incremental use of a lightning-bolt symbol for the PFAF/glidepath-intercept altitude on vertically guided procedures.\n- Future co-charted procedures may show both: Maltese cross for non-vertical FAF + lightning bolt for PFAF.\n- `T:` this is a future incremental change, not a blanket reinterpretation of current plates.","p":[],"ph":["IR"]},{"id":"IFR-10","card":"IFR","f":"kb/ifr/approaches.md","h":"FAF / FAP","a":"faf--fap","c":["ifr-app-fly","ifr-plates"],"kd":"knowledge","u":"plate-faf-fap","md":"- FAF often Maltese-cross-like symbol on NPA; FAP for precision/APV intercept of final descent path.\n- `P:` before FAF/FAP: correct nav source, approach mode, altimeter, brief complete, landing config plan, missed set, timer if required.\n- `T:` after FAF, workload jumps; if not configured/briefed, go around or delay.","p":[],"ph":["IR"]},{"id":"IFR-11","card":"IFR","f":"kb/ifr/approaches.md","h":"Profile view","a":"profile-view","c":["ifr-app-fly","ifr-plates"],"kd":"knowledge","u":"plate-profile-view","md":"- Read inbound course, crossing altitudes, stepdowns, descent angle, distance to threshold/MAP, MDA/DA relationship.\n- For NPA: manage MDA, MAP, timing/DME/fix. For precision/APV: manage DA and vertical path.\n- `T:` advisory descent angle/CDFA does not authorize descent below MDA without required visual reference.","p":["IR"]},{"id":"IFR-12","card":"IFR","f":"kb/ifr/approaches.md","h":"Timing","a":"timing","c":["ifr-app-fly","ifr-plates"],"kd":"knowledge","u":"plate-timing","md":"- Timing required if MAP based on time or as backup when published.\n- `F:` time(min)=distance/GS×60.\n- `T:` use ground speed, not IAS. Wind change on final can make timing inaccurate; use primary MAP if available.","p":[],"ph":["IR"]},{"id":"IFR-13","card":"IFR","f":"kb/ifr/approaches.md","h":"ILS / LOC traps","a":"ils--loc-traps","c":["ifr-app-fly","nav-radio","ifr-plates"],"kd":"trap","u":"plate-ils-loc-traps","md":"- Identify LOC frequency, set front course, intercept from below glidepath, verify GS alive/captured, monitor raw data.\n- LOC-only approach uses LOC minima and MDA, not ILS DA.\n- `T:` false glideslope if intercept from above; back-course/reverse sensing depends equipment and procedure.","p":["IR"]},{"id":"IFR-14","card":"IFR","f":"kb/ifr/approaches.md","h":"VOR / NDB / DME traps","a":"vor--ndb--dme-traps","c":["ifr-app-fly","nav-radio","ifr-plates"],"kd":"trap","u":"plate-vor-ndb-dme-traps","md":"- VOR radials are FROM; NDB bearing is TO; DME is slant range.\n- DME arc: lead radial/turn anticipation; station passage/DME switch can confuse.\n- `T:` unserviceable navaid or no identification = no approach using that navaid.","p":["CPL"],"e":["CPL"]},{"id":"IFR-15","card":"IFR","f":"kb/ifr/approaches.md","h":"Straight-in approaches and NoPT","a":"straight-in-approaches-and-nopt","c":["ifr-app-fly"],"kd":"knowledge","u":"ifr-straight-in-no-pt-rac-9-15","md":"- Straight-in approach = positioned on final **without a procedure turn**. ATC uses the phrase in that sense. [AIM RAC 9.15]\n- `NO PT` / `NoPT` on chart (usually at the IF or a TAA sector) = no PT or HILPT required from there. [RAC 9.16; CAP GEN TAA]\n- Badly placed after straight-in clearance → go to FAF, request PT. FAF behind you → missed approach + new clearance. [RAC 9.16]\n- Cleared straight-in on simultaneous parallels → PT not permitted. Big airports: vectors, PT never flown. [RAC 9.27, 9.7.2]\n- `T:` NoPT applies from the marked point/sector only; outside it, course reversal may be required.","p":["IR"]},{"id":"IFR-16","card":"IFR","f":"kb/ifr/approaches.md","h":"Radar vectors to final","a":"radar-vectors-to-final","c":["ifr-app-fly","law-atc"],"kd":"knowledge","u":"ifr-radar-vectors-to-final-rac-9-7","md":"- Vectored to intercept final ≈ **2 NM** before final descent point. [AIM RAC 9.7.1]\n- \"ATS SURVEILLANCE REQUIRED\" procedures: initial segment provided by vectors; may have no published initial segment. [RAC 9.7.2]\n- Approach clearance while vectored to final = resume own navigation. [RAC 1.5.2]\n- Comm failure while vectored: squawk `7600`; climb to published minimum altitude unless VMC. [RAC 1.5.5, 6.3.2]\n- `T:` vector altitudes are ATC-temperature-corrected; no pilot cold correction on assigned vector altitudes. [CAP GEN altitude correction]","p":["IR"]},{"id":"IFR-17","card":"IFR","f":"kb/ifr/approaches.md","h":"Pebble","a":"pebble","c":["ifr-app-fly"],"kd":"pebble","u":"ifr-approaches-pebble","md":"- BRIEF `plate-wx-nav-alt-min-MAP-missed-rwy-threats | CDI source errors kill`\n- TYPES `precision = ILS, lateral + vertical, DA/DH | APV = LPV, LNAV/VNAV, vertical guidance but not precision, DA | NPA = LOC/VOR/NDB/LNAV, MDA | SCDA/CDFA ≠ permission below MDA | LPV ≠ ILS | uncompensated Baro-VNAV: temperature limits`\n- NAVAIDS `ILS: beware false GS from above | LOC: no glideslope, LOC minima/MDA | VOR radials FROM station | ADF needle points to station, not necessarily desired track | DME slant range`\n- GNSS `database current, correct procedure/transition, RAIM/WAAS, mode/sensitivity enroute → terminal → approach, missed sequencing | direct-to FAF may delete sequencing/protection | OBS/SUSP misuse | “GPS direct” ≠ cleared route`\n- MATH `3° ≈ 300 ft/NM | ROD ≈ GS × 5 | fpm = GS × ft/NM / 60 | groundspeed, not IAS`\n- STRAIGHT-IN `NoPT from marked point/sector | misplaced → FAF + request PT | vectors to final ≈2 NM before descent point | approach clearance = resume own nav`","p":["PPL","CPL","IR"]},{"id":"IFR-18","card":"IFR","f":"kb/ifr/cap-plates-publications.md","h":"CAP plate read flow","a":"cap-plate-read-flow","c":["ifr-plates"],"kd":"knowledge","u":"ifr-cap-plate-read-flow","md":"- `P:` title/effective→airport/runway/proc→nav source/freq/course→MSA/Safe100/terrain→RASS/cold temp→IAF/IF/FAF/FAP→stepdowns→DA/MDA/HAT/HAA/HATh/DH→advisory vis→MAP→missed→lighting/runway/LDA→notes.\n- `T:` wrong frequency/source/course = common trap. Always verify CDI source and loaded procedure.\n- `T:` plan view altitude is not enough; profile and minima notes can modify it.\n- `M:` `TITLE-NAV-PLAN-PROFILE-MIN-MISSED-NOTES-RWY`.\n- `T:` don’t start with minima only; plate errors usually come from source/fix/altitude/missed/notes.","p":["IR"]},{"id":"IFR-19","card":"IFR","f":"kb/ifr/cap-plates-publications.md","h":"CAP transition watch","a":"cap-transition-watch","c":["ifr-plates","nav-pubs"],"kd":"knowledge","u":"ifr-cap-transition-watch","md":"- AIC `013/2026`: PFAF/glidepath-intercept depiction using a lightning-bolt symbol.\n- Incremental implementation from `2026-10-29`, the cycle current at last review (14 Nov 2026). `?` not yet confirmed on a printed chart.\n- Conversion is incremental: read the symbols printed on the chart in hand; do not assume either convention.","p":[],"ph":["IR"]},{"id":"IFR-20","card":"IFR","f":"kb/ifr/cap-plates-publications.md","h":"Publication cycle","a":"publication-cycle","c":["ifr-plates","nav-pubs"],"kd":"source","u":"ifr-current-publication-cycle","md":"- AIRAC cycle at last review (14 Nov 2026) for `CAP/CAP GEN/CFS/AIP/DAH/charts`: effective `2026-10-29` through `2026-12-24`. `T:` this line ages every 56 days; read the effective dates printed on the product.\n- These publications update every `56 days`; AIP SUP/AIC publish on a `14-day` cycle.\n- `P preflight:` current publication→NOTAM→AIP SUP/AIC→airport/procedure page→aircraft data.\n- Trigger NOTAM = notice that source material changed; retrieve the referenced amendment/Supplement. It may expire while the underlying AIP SUP remains active.\n- `[NAV CANADA publication schedule; AIC 009/2026]`","p":["IR"]},{"id":"IFR-21","card":"IFR","f":"kb/ifr/cap-plates-publications.md","h":"Publication-currency exam traps","a":"publication-currency-exam-traps","c":["ifr-plates","nav-pubs"],"kd":"trap","u":"ifr-publication-currency-exam-traps","md":"- Check effective date/cycle first. Then NOTAM and AIP SUP; Trigger NOTAM only points to changed material.\n- AIP SUP can remain active with no current Trigger NOTAM.\n- PFAF lightning-bolt depiction is an incremental standard from `2026-10-29`; answer from the symbology printed on the chart given.\n- `T:` wrong-cycle plate may produce a numerically correct but operationally invalid answer.\n- `G:` chart effective/current→procedure not cancelled/replaced→NOTAM reviewed→AIP SUP reviewed→NAVAIDs/runway/lights available→database current.\n- `T:` a plate matching the current 56-day cycle can still be amended or unavailable.","p":["IR"]},{"id":"IFR-22","card":"IFR","f":"kb/ifr/cap-plates-publications.md","h":"Source / scope","a":"source--scope","c":["ifr-plates"],"kd":"source","u":"plate-source-scope","md":"- `SRC:` current CAP/CAP GEN/CFS/NOTAM/AIP SUP win. Cycle at last review (14 Nov 2026): `2026-10-29` to `2026-12-24`.\n- CAP contains IFR arrival/departure information: IAP, SID, STAR, visual approaches, noise abatement and aerodrome/ground charts.\n- CAP is not intended for VFR operations and is regularly amended by NOTAM/AIP SUP.\n- `T:` stale plate = no-go. Trigger NOTAM≠the amendment; retrieve referenced material.","p":[],"ph":["IR"]},{"id":"IFR-23","card":"IFR","f":"kb/ifr/cap-plates-publications.md","h":"Title block","a":"title-block","c":["ifr-plates"],"kd":"knowledge","u":"plate-title-block","md":"- Check airport name/ICAO, procedure title, runway, amendment/effective date, page/cycle, units, notes.\n- Procedure title tells primary nav basis: `ILS`, `LOC`, `RNAV (GNSS)`, `VOR`, `NDB`, `DME`, `RNP AR` etc.\n- `T:` runway number/procedure variant matters; `ILS RWY 24` ≠ `LOC RWY 24` ≠ `RNAV (GNSS) RWY 24`.","p":[],"ph":["IR"]},{"id":"IFR-24","card":"IFR","f":"kb/ifr/cap-plates-publications.md","h":"Required equipment / approval","a":"required-equipment--approval","c":["ifr-plates"],"kd":"knowledge","u":"plate-required-equipment-approval","md":"- Confirm aircraft and pilot authorized/equipped: NAV receiver, DME, ADF, GNSS/WAAS, Baro-VNAV, RNP AR, comms, transponder, database.\n- `T:` if equipment/navaid/database not usable, that line/minima may be unavailable.\n- `T:` GNSS overlay/direct-to does not make a non-GNSS procedure a GNSS approach unless authorized/published.","p":[],"ph":["IR"]},{"id":"IFR-25","card":"IFR","f":"kb/ifr/cap-plates-publications.md","h":"Plan view","a":"plan-view","c":["ifr-plates"],"kd":"knowledge","u":"plate-plan-view","md":"- Read IAF/IF/FAF/FAP, transitions, arcs, bearings/radials/tracks, distances, holds, MSA/Safe 100 NM/sector altitudes, terrain, restricted areas.\n- `T:` plan view gives lateral path; profile gives vertical constraints. Need both.\n- `T:` arc/radial orientation: VOR radials are FROM station; bearings to NDB are TO station.","p":[],"ph":["IR"]},{"id":"IFR-26","card":"IFR","f":"kb/ifr/cap-plates-publications.md","h":"MSA / Safe altitude / terrain","a":"msa--safe-altitude--terrain","c":["ifr-plates"],"kd":"knowledge","u":"plate-msa-safe-altitude-terrain","md":"- MSA/sector altitude = emergency/sector obstacle clearance near reference point; not necessarily ATC minimum vectoring altitude.\n- Check terrain symbols, obstacles, minimum sector altitude, procedure notes, cold-temp notes.\n- `T:` MSA is not a clearance to descend on the procedure.","p":[],"ph":["IR"]},{"id":"IFR-27","card":"IFR","f":"kb/ifr/cap-plates-publications.md","h":"Notes block","a":"notes-block","c":["ifr-plates"],"kd":"knowledge","u":"plate-notes-block","md":"- Read all notes: NA at night, procedure NA, GNSS required, DME required, circling restrictions, approach-angle notes, lighting notes, altimeter/RASS, temperature, missed-climb gradient.\n- `T:` notes can override the attractive minima line.\n- `M:` if a note starts with `NA`, `Use`, `When`, `Requires`, or `Circling`, slow down.","p":[],"ph":["IR"]},{"id":"IFR-28","card":"IFR","f":"kb/ifr/cap-plates-publications.md","h":"Real-flight plate method","a":"real-flight-plate-method","c":["ifr-plates"],"kd":"trap","u":"plate-real-flight-plate-method","md":"- `1` current plate/NOTAM; `2` legal/equipped; `3` fuel/alternate; `4` terrain/icing/TS/wind; `5` setup/brief; `6` monitor stable approach; `7` miss early if doubt.\n- `T:` legal minimums are not personal minimums. Low-vis approaches invite confirmation bias.","p":[],"ph":["IR"]},{"id":"IFR-29","card":"IFR","f":"kb/ifr/cap-plates-publications.md","h":"Pebble","a":"pebble","c":["ifr-plates"],"kd":"pebble","u":"ifr-cap-plates-publications-pebble","md":"- CYCLE `publications every 56 days; AIP SUP/AIC every 14 days | cycle dates age: read the effective dates printed on the product | preflight: current publication → NOTAM → AIP SUP/AIC → airport/procedure page → ACFT data`\n- TRIGGER NOTAM `only announces changed source material: open the referenced source | AIP SUP can remain active after the Trigger NOTAM expires`\n- PLATE `title/effective → airport/RWY/proc → nav source/freq/course → MSA → RASS/cold temp → fixes → stepdowns → minima → MAP → missed → lighting/RWY → notes | plan-view altitude not enough: profile and minima notes can modify it`\n- T `wrong-cycle plate = numerically correct, operationally invalid | PFAF lightning-bolt (AIC 013/2026): incremental from 2026-10-29, use the symbols printed on the chart`\n- TRAPS `category first | the note block can kill the approach | RASS adds to altitudes / may force circling | cold temp protects obstacle clearance | MAP timing uses GS | LPV≠ILS | LOC line≠ILS line | wrong CDI source kills | legal approach≠landing distance OK`","p":["IR"]},{"id":"IFR-30","card":"IFR","f":"kb/ifr/departure.md","h":"Departure / takeoff minima","a":"departure--takeoff-minima","c":["ifr-dep"],"kd":"knowledge","u":"ifr-departure-takeoff-minima","md":"- Check CAP aerodrome chart/SID/ODP/diverse departure, climb gradient, obstacle notes, RVR/visibility, lighting, engine-out capability if applicable.\n- `R:` takeoff visibility precedence: use runway `RVR` when reported at/above the applicable minimum; use aerodrome `ground visibility` when RVR is below minimum, varies below/above minimum, or is not reported; use PIC-observed `runway visibility` only when neither RVR nor ground visibility is reported. `[CAR 602.126]`\n- Applicable minimum comes from the AOC/special authorization, or the current CAP for other operations.\n- `T:` takeoff visibility ≠ landing/approach visibility. Departure obstacle climb gradient may be more restrictive than weather.\n- `T:` “standard takeoff minima” is not “safe to climb over obstacles”; compare required climb gradient vs aircraft performance.","p":["IR"]},{"id":"IFR-31","card":"IFR","f":"kb/ifr/departure.md","h":"SID / ODP / climb gradient","a":"sid--odp--climb-gradient","c":["ifr-dep"],"kd":"knowledge","u":"ifr-sid-odp-climb-gradient","md":"- SID = published ATC/obstacle/departure routing; may include altitude/speed/climb gradient.\n- Diverse departure assumes obstacle environment supports generic departure; if obstacle DP exists, use it unless ATC assigns otherwise.\n- Climb gradient: `ft/NM`; required ROC ≈ `GS × ft/NM / 60`.\n- Common 3.3% ≈ `200 ft/NM`. `F:` `ROC fpm = GS kt × gradient(ft/NM)/60`.\n- `T:` climb gradient is ground-speed based; tailwind/high GS raises required fpm.","p":["IR"]},{"id":"IFR-32","card":"IFR","f":"kb/ifr/departure.md","h":"Takeoff visibility / RVR trap","a":"takeoff-visibility--rvr-trap","c":["ifr-dep","ifr-minima"],"kd":"knowledge","u":"ifr-takeoff-visibility-rvr-trap","md":"- RVR report can be below takeoff minimum but ground visibility at/above minimum may govern; inverse also possible.\n- If both lowest RVR and ground visibility are below required minimum, takeoff not authorized.\n- If only RVR below minimum and no governing ground visibility at/above minimum, takeoff not authorized.\n- `T:` “variable RVR” and “observed on-the-hour vs now” wording can flip the answer.","p":["IR"]},{"id":"IFR-33","card":"IFR","f":"kb/ifr/departure.md","h":"SIDs, radar and non-radar departures — AIM RAC 7","a":"sids-radar-and-non-radar-departures--aim-rac-7","c":["ifr-dep"],"kd":"knowledge","u":"ifr-sid-radar-non-radar-departures","md":"- First contact: destination + planned initial cruise altitude. Clearance via CLNC DEL if listed, else ground after taxi auth. [RAC 7.3–7.4]\n- SID types: **vector SID** (radar: ATC vectors to filed route/termination fix) · **pilot-nav SID** (non-radar: fly published tracks yourself) · PBN SID. Clearance names SID, transition, when to expect climb. [RAC 7.6; CAP GEN]\n- SID in clearance → readback only call sign + code (+ amended altitude). Can refuse SID and ask for detailed clearance. Amended altitude does not cancel SID. [RAC 6.1, 7.6]\n- No SID: departure procedure (ODP) or take-off minima premise: 35 ft at DER → straight to **400 AAE** → **200 ft/NM** to enroute altitude. `NOT ASSESSED` = pilot owns obstacles. [RAC 7.8; CAP GEN]\n- \"Right turn, climb on course\" is not a departure procedure. [RAC 7.8]\n- Release from tower: inside TCA tower hands off; outside, tell tower next agency/freq unless already given. [RAC 7.9]\n- `T:` vector SID = expect vectors; still fly the published initial heading/altitude until vectored.","p":["IR"]},{"id":"IFR-34","card":"IFR","f":"kb/ifr/departure.md","h":"IFR departure from an uncontrolled aerodrome — AIM RAC 7.10","a":"ifr-departure-from-an-uncontrolled-aerodrome--aim-rac-710","c":["ifr-dep"],"kd":"knowledge","u":"ifr-departure-uncontrolled-aerodrome-rac-7-10","md":"- Into controlled airspace: get ATC clearance first (often via FIC/RCO or phone). [RAC 7.10]\n- Broadcast departure intentions on MF/ATF before entering runway; confirm no conflict by radio + visually. [RAC 7.10]\n- Keep listening watch on MF until beyond its distance/altitude; then contact ATC/en route frequency (second radio helps). [RAC 7.10]\n- Clearance may be time-limited: \"CLEARANCE CANCELLED IF NOT AIRBORNE BEFORE 1349\". Not departing within 60 min of proposed time → tell ATC. [RAC 7.10]\n- IFR clearance with VFR climb, or VFR release until IFR clearance: only on request, weather permitting. [RAC 6.2.1–6.2.2]\n- `T:` uncontrolled departure = your own obstacle + traffic separation until in controlled airspace.","p":["IR"]},{"id":"IFR-35","card":"IFR","f":"kb/ifr/departure.md","h":"Pebble","a":"pebble","c":["ifr-dep"],"kd":"pebble","u":"ifr-departure-pebble","md":"- TKOF VIS CAR 602.126 `RWY RVR when reported at/above minimum | ground visibility when RVR below minimum, varying, or not reported | PIC-observed runway visibility only when neither reported | minimum from AOC/special authorization, else current CAP`\n- T `both lowest RVR and ground vis below minimum → no takeoff | takeoff vis ≠ landing/approach vis | standard takeoff minima ≠ obstacle clearance`\n- GRADIENT `ROC fpm = GS kt × ft/NM / 60 | 3.3% ≈ 200 ft/NM | GS-based: tailwind/high GS raises required fpm`\n- SID / ODP `SID may include altitude/speed/climb gradient | obstacle DP exists → use it unless ATC assigns otherwise`\n- DEPARTURE `vector SID = radar · pilot-nav SID = own nav | no SID: 35 ft DER → 400 AAE → 200 ft/NM | uncontrolled: clearance first, broadcast, MF watch, void time`","p":["IR"]},{"id":"IFR-36","card":"IFR","f":"kb/ifr/emergencies-instrument-failures.md","h":"IFR emergencies","a":"ifr-emergencies","c":["ifr-emerg"],"kd":"knowledge","u":"ifr-ifr-emergencies","md":"- Emergency: aviate; declare; ATC expects necessary action and will assist. If no comm, `7700` can indicate emergency but may not be detected.\n- Equipment fail: report nav/comm malfunctions to ATC. Partial panel: attitude-power-performance; reduce workload, ask vectors/no-gyro if needed.\n- Icing: exit conditions early; climb/descend/turn; approach speed/config per POH/SOP. `T:` “trace” can become performance problem fast in trainer.","p":["IR"]},{"id":"IFR-37","card":"IFR","f":"kb/ifr/emergencies-instrument-failures.md","h":"Instrument failures","a":"instrument-failures","c":["ifr-emerg","agk-inst"],"kd":"knowledge","u":"ifr-instrument-failures","md":"- Pitot blocked + drain open: ASI reads `0`. Pitot blocked + drain blocked: ASI acts altimeter-ish. Static blocked: ASI/ALT/VSI errors; alternate static changes readings.\n- Vacuum fail: attitude/heading unreliable; use turn coordinator/compass/power/performance if electric TC.\n- Compass: variation, deviation, dip, acceleration, turning errors. `ANDS/UNOS` for N hemisphere.\n- Electrical fail: load shed, battery time, comm/nav loss planning. `T:` GPS/iPad not a full IFR electrical system.","p":["CPL","IR"]},{"id":"IFR-38","card":"IFR","f":"kb/ifr/emergencies-instrument-failures.md","h":"Pebble","a":"pebble","c":["ifr-emerg"],"kd":"pebble","u":"ifr-emergencies-instrument-failures-pebble","md":"- EMERGENCY `aviate, declare | 7700 if no comm, may not be detected | report nav/comm malfunctions to ATC | partial panel: attitude-power-performance, ask vectors/no-gyro`\n- PITOT-STATIC `pitot blocked + drain open: ASI 0 | pitot + drain blocked: ASI acts like altimeter | static blocked: ASI/ALT/VSI errors; alternate static changes readings`\n- OTHER `vacuum fail: attitude/heading unreliable | compass ANDS/UNOS (N hemisphere) | electrical: load shed, battery time; GPS/iPad ≠ full IFR electrical system | icing: exit early`","p":["CPL","IR"]},{"id":"IFR-39","card":"IFR","f":"kb/ifr/enroute.md","h":"Clearance / readback","a":"clearance--readback","c":["ifr-enr","law-atc"],"kd":"knowledge","u":"ifr-clearance-readback","md":"- Clearance contents (`M:` `CRAFT-ish`): clearance limit, route, altitude, departure/restrictions, frequency, squawk/transponder, plus void/release/hold-for-release if issued.\n- `P:` read back clearance limit/route/altitude/restrictions/squawk/hold-short/runway.\n- `T:` clearance ≠ takeoff clearance. “climb/maintain” ≠ terrain clearance on visual/VFR restriction if you accepted separation duties.\n- `T:` “cleared for the approach” authorizes IAP but not visual descent below minima; “cleared to airport” may be clearance limit, not landing clearance.","p":["IR"]},{"id":"IFR-40","card":"IFR","f":"kb/ifr/enroute.md","h":"Minimum IFR altitudes / route terms","a":"minimum-ifr-altitudes--route-terms","c":["ifr-enr"],"kd":"knowledge","u":"ifr-ifr-route-altitude-terms","md":"| Term | Memory |\n|---|---|\n| `MEA` | obstacle + nav reception on airway/route |\n| `MOCA` | obstacle clearance; nav reception usually limited near NAVAID |\n| `MRA` | min altitude to receive/use fix-defining signal |\n| `AMA` | area min altitude; replaced old `GASA`; standard temp/pressure |\n| `MSA` | emergency/sector altitude near facility/ARP/waypoint |\n| `MVA` | ATC radar/vector altitude, normally unpublished to pilots |\n\n- `T:` cleared direct ≠ automatically safe at low altitude; compare minimum IFR altitude / terrain / cold temp / MEA logic.\n- `T:` cleared direct ≠ terrain guaranteed unless ATC/radar/MEA logic valid. cold/RASS/temp corrections can raise minima.","p":["IR"]},{"id":"IFR-41","card":"IFR","f":"kb/ifr/enroute.md","h":"Altimeter-setting / standard-pressure regions","a":"altimeter-setting--standard-pressure-regions","c":["ifr-enr","law-airspace","met-atmos"],"kd":"knowledge","u":"ifr-altimeter-setting-standard-pressure-regions","md":"- Altimeter-setting region: departure set aerodrome setting/elevation; enroute nearest station along route; arrival set destination setting if available.\n- Standard-pressure region: set `29.92/1013.2` except departure/arrival transition procedures.\n- Climbing into standard-pressure region: set standard immediately after entering. Descending into altimeter-setting region: set appropriate station immediately before descending into region.\n- `T:` flight level = standard-pressure altimeter. “high-to-low/cold = look out below” still applies.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"IFR-42","card":"IFR","f":"kb/ifr/enroute.md","h":"Enroute / position reports / ATC","a":"enroute--position-reports--atc","c":["ifr-enr","law-atc"],"kd":"knowledge","u":"ifr-enroute-position-reports-atc","md":"- IFR position report when required: position, time, altitude, next fix/ETA, ensuing fix, remarks.\n- STAR lateral path forms part of route when filed/cleared; descent clearance still needed unless specifically cleared by ATC/procedure.\n- ATC speed assignment supersedes charted speed until prohibited/cancelled; charted restrictions remain unless cancelled.\n- `T:` STAR vertical restrictions above assigned altitude remain mandatory unless cancelled.","p":["IR"]},{"id":"IFR-43","card":"IFR","f":"kb/ifr/enroute.md","h":"Designated mountainous regions — IFR altitudes","a":"designated-mountainous-regions--ifr-altitudes","c":["ifr-enr","ifr-plan"],"kd":"knowledge","u":"ifr-designated-mountainous-regions","md":"- Outside established minimum IFR altitudes (incl. min vectoring altitudes): **2000 ft** above highest obstacle within **5 NM** in areas **1 and 5**; **1500 ft** in areas **2, 3, 4**. [AIM RAC 2.12; CAP GEN]\n- On airways / air routes: published MEA/MOCA; in winter cold, fly ≥1000 ft above MEA/MOCA. [CAP GEN; RAC 2.12]\n- Cold + mountain wave → altimeter may over-read by up to **3000 ft**. [AIM AIR 1.5.6–1.5.8; CAP GEN]\n- Safe Altitude 100 NM uses 1500/2000 ft clearance in mountainous regions (1000 elsewhere). [CAP GEN]\n- `M:` `1-5 = 2000 · 2-3-4 = 1500 · within 5 NM`.","p":["IR"]},{"id":"IFR-44","card":"IFR","f":"kb/ifr/enroute.md","h":"Position reports, reporting points, fixes","a":"position-reports-reporting-points-fixes","c":["ifr-enr"],"kd":"knowledge","u":"ifr-position-reports-fixes-rac-8","md":"- Report contents in CFS order (CAR 602.125): ident, position, time (UTC), altitude/FL, flight plan type, next point + ETA. [AIM RAC 8.1]\n- Compulsory point = **solid triangle**; \"on request\" point = report only if ATC asks. [RAC 8.1]\n- Non-radar without DCPC: report via FIC/nearest station. Identified on radar: compulsory reports stop until told to resume. [RAC 8.1]\n- Altitude reports: reaching initial cleared altitude (outside surveillance); leaving / reaching assigned altitudes; to nearest 100 ft. [RAC 8.3]\n- Fix terms: **intersection** = point from radials/bearings/DME of ground aids; **waypoint** = geographic point for RNAV; **significant point** = point defining ATS route/flight path; DME fixes on an airway may allow lower MEA for DME-equipped aircraft. [CAP GEN definitions; RAC 8.6.1.1]\n- `T:` radar identification removes compulsory reports, not altitude-leaving reports unless told.","p":["IR"]},{"id":"IFR-45","card":"IFR","f":"kb/ifr/enroute.md","h":"1000-ft-on-top IFR — AIM RAC 8.7","a":"1000-ft-on-top-ifr--aim-rac-87","c":["ifr-enr"],"kd":"knowledge","u":"ifr-1000-on-top-rac-8-7","md":"- IFR \"at least 1 000-ft-on-top\" only if all: [RAC 8.7]\n  - ≥1000 ft above all cloud, haze, smoke or other formation;\n  - flight visibility above formation ≥3 miles;\n  - top of formation well defined;\n  - altitude appropriate to direction of flight when cruising level;\n  - ATC authorized;\n  - in Class B ≤12 500 ASL, or Class C, D, E.\n- `M:` `1000 · 3 SM · TOPS CLEAR · CRUISE ALT · ATC · B≤125/C/D/E`.\n- `T:` still IFR (clearance, reports) — not VFR OTT.","p":["IR"]},{"id":"IFR-46","card":"IFR","f":"kb/ifr/enroute.md","h":"Pebble","a":"pebble","c":["ifr-enr"],"kd":"pebble","u":"ifr-enroute-pebble","md":"- CLEARANCE `limit, route, altitude, departure/restrictions, frequency, squawk + void/release/hold-for-release | clearance ≠ takeoff clearance | “cleared for the approach” ≠ descent below minima | “cleared to airport” may be a clearance limit, not landing clearance`\n- ALTITUDES `MEA obstacle + nav reception | MOCA obstacle, nav limited near NAVAID | MRA receive fix-defining signal | AMA area minimum (replaced GASA), standard temp/pressure | MSA emergency/sector | MVA ATC radar, normally unpublished`\n- T `cleared direct ≠ terrain guaranteed | cold/RASS/temp corrections can raise minima`\n- ALTIMETER `standard-pressure region 29.92/1013.2 | climbing in: set standard immediately after entering | descending out: set station immediately before descending into altimeter-setting region | FL = standard pressure`\n- STAR `lateral path part of route when filed/cleared; descent clearance still needed | vertical restrictions above assigned altitude remain unless cancelled | ATC speed supersedes charted speed`\n- POSITION REPORT `position, time, altitude, next fix/ETA, ensuing fix, remarks`\n- ENROUTE `mountain areas 1/5 = 2000, 2/3/4 = 1500 above obstacle within 5 NM | compulsory point = solid triangle | identified → reports stop | 1000-on-top: 1000 above, 3 SM, ATC auth, B≤12 500/C/D/E`","p":["PPL","CPL","IR"]},{"id":"IFR-47","card":"IFR","f":"kb/ifr/holding.md","h":"Holding","a":"holding","c":["ifr-hold"],"kd":"knowledge","u":"ifr-holding","md":"- Clearance: fix, direction, radial/course/bearing/airway, leg length/time, altitude, EFC.\n- Standard = right turns; non-standard = left. Published max speed inside hold wins.\n- Entries: direct / teardrop / parallel. `T:` entry is a method; protected airspace matters.\n- Timing: standard outbound leg `1 min` at/below `14,000 ft ASL`; `1.5 min` above. Adjust outbound to achieve the corresponding inbound time; DME holds use specified distances. `[AIM 2026-1 RAC 10.3/10.6]`\n- Wind: outbound correction about `3×` inbound drift. `T:` EFC and fuel are exam-critical.\n- `T:` no EFC? ask. fuel clock starts early.\n- Max holding IAS (unless charted): ≤6 000 ft ASL **200** · 6 001–14 000 **230** · above 14 000 **265** · shuttle climb **310**. Need more → tell ATC at once. [AIM RAC 10.7; CAP GEN]\n- DME hold: end of each leg by DME, not time. [RAC 10.8]","p":["IR"]},{"id":"IFR-48","card":"IFR","f":"kb/ifr/holding.md","h":"Holding · card 06","a":"holding--card-06","c":["ifr-hold"],"kd":"formula","u":"ifr-holding-c06","md":"- `F:` outbound timing adjusted to make inbound leg time.\n- `R:` standard hold: outbound `1 min` at/below `14,000 ft ASL`; `1.5 min` above `14,000 ft ASL`. For DME holding, ATC/published procedure specifies distance instead of time. `[AIM 2026-1 RAC 10.3/10.6]`\n- `M:` outbound wind correction ≈ `3×` inbound drift.\n- `F:` DME leg time = leg distance / GS × 60.\n- `T:` hold speed limits/published leg distances override memory.","p":[],"ph":["IR"]},{"id":"IFR-49","card":"IFR","f":"kb/ifr/holding.md","h":"Shuttle procedure","a":"shuttle-procedure","c":["ifr-hold"],"kd":"knowledge","u":"ifr-shuttle-procedure","md":"- Shuttle = hold-shaped pattern to climb or descend to a set altitude. Fly as published unless ATC clearance says otherwise. [AIM RAC 10.9; CAP GEN definitions]\n- Shuttle climb protected to **310 KIAS** unless a lower speed is charted. [RAC 10.9; CAP GEN]\n- Left turns charted = non-standard; charted speed = maximum assessed IAS. [CAP GEN]\n- Can't comply (speed, turbulence) → tell ATC at once. [RAC 10.7]\n- `M:` `SHUTTLE = HOLD THAT CHANGES ALTITUDE · 310 MAX`.","p":["IR"]},{"id":"IFR-50","card":"IFR","f":"kb/ifr/holding.md","h":"Pebble","a":"pebble","c":["ifr-hold"],"kd":"pebble","u":"ifr-holding-pebble","md":"- HOLD `clearance: fix, direction, radial/course/bearing/airway, leg length/time, altitude, EFC | standard = right turns | published max speed wins | entries direct/teardrop/parallel`\n- TIMING `outbound 1 min at/below 14,000 ft ASL; 1.5 min above; adjust outbound to achieve inbound time | DME holds: specified distances | outbound wind correction ≈ 3× inbound drift`\n- T `no EFC? ask | fuel clock starts early | protected airspace matters more than entry drawing`\n- HOLD SPEEDS `≤6000 200 · ≤14 000 230 · above 265 · shuttle 310 | DME hold legs by DME | shuttle = hold that changes altitude`","p":["IR"]},{"id":"IFR-51","card":"IFR","f":"kb/ifr/ifr-weather.md","h":"Weather decoding — exam workflow","a":"weather-decoding--exam-workflow","c":["ifr-wx","met-products"],"kd":"knowledge","u":"ifr-weather-decoding-exam-workflow","md":"- METAR/SPECI: wind, vis, wx, cloud, temp/dew, altimeter, remarks; RVR if vis ≤`1 SM` and/or RVR ≤`6000 ft`.\n- TAF: validity, FM, BECMG, TEMPO, PROB, wind/vis/wx/cloud. Ceiling = lowest BKN/OVC/VV.\n- FD: interpolate wind/temp aloft; choose true altitude/level; use winds for GS/fuel/temp/icing.\n- GFA: clouds/wx + icing/turb/freezing level; use time panels and expected movement.\n- `T:` TAF legal but GFA/SIGMET/PIREPs ugly = operational no-go even if exam legal answer exists.","p":["IR"]},{"id":"IFR-52","card":"IFR","f":"kb/ifr/ifr-weather.md","h":"IFR weather traps","a":"ifr-weather-traps","c":["ifr-wx"],"kd":"trap","u":"ifr-ifr-weather-traps","md":"- Freezing level + cloud/precip = icing risk. Carb ice can exist above freezing in humid partial power.\n- Warm front: layered cloud/low vis/steady precip/freezing rain risk. Cold front: convective showers/TS/gusts/wind shear.\n- TS/CB: avoid; embedded CB in IMC is no-go for light trainer.\n- Low-level wind shear/microburst: go-around may not save you if severe; avoid.\n- `T:` altimetry errors from cold temps affect obstacle clearance, not just indicated altitude comfort.","p":["IR"]},{"id":"IFR-53","card":"IFR","f":"kb/ifr/ifr-weather.md","h":"Pebble","a":"pebble","c":["ifr-wx"],"kd":"pebble","u":"ifr-ifr-weather-pebble","md":"- DECODE `METAR: RVR if vis ≤1 SM and/or RVR ≤6000 ft | ceiling = lowest BKN/OVC/VV | FD: interpolate wind/temp aloft | GFA: time panels and expected movement`\n- T `TAF legal but GFA/SIGMET/PIREP ugly = operational no-go | freezing level + cloud/precip = icing risk | embedded CB in IMC = no-go for light trainer | cold-temp altimetry errors affect obstacle clearance`","p":["IR"]},{"id":"IFR-54","card":"IFR","f":"kb/ifr/lost-comms.md","h":"Lost comms — general","a":"lost-comms--general","c":["emg-comms"],"kd":"knowledge","u":"ifr-lost-comms-general","md":"- `P:` squawk `7600`; maintain listening watch; try alternate freq/FSS/other ATC/aircraft relay; comply with specific SID/STAR/IAP/CAP/CFS comm-fail instructions; phone ATS when practical / if all else fails.\n- `T:` specific published SID/STAR/IAP comm-fail procedure overrides generic rules; judgment required if uncovered case.\n- `T:` if ATC says “if no comm by X, expect Y,” that can become expected route/alt/time logic.","p":["IR"]},{"id":"IFR-55","card":"IFR","f":"kb/ifr/lost-comms.md","h":"Lost comms — VMC / IMC route, altitude, time","a":"lost-comms--vmc--imc-route-altitude-time","c":["emg-comms"],"kd":"knowledge","u":"ifr-lost-comms-ifr-route-altitude-time","md":"- VMC after fail: continue VFR, land as soon as practicable. `T:` practicable≠nearest unsuitable field.\n- IMC route: assigned → vectored direct to specified fix/route/airway → expected → filed.\n- IMC altitude: highest of assigned / minimum IFR altitude / expected. If vectored below published IFR altitude, climb immediately to appropriate minimum IFR altitude.\n- Descent: maintain enroute altitude to nav facility/approach fix; start descent at latest of filed/amended ETA, last ATC-ack ETA, or EAT. If holding instruction acknowledged: hold as directed; approach at EAT/EFC.\n- `M:` route = `A-V-E-F`; alt = `highest A-M-E`; time = latest `ETA/EAT/EFC`.\n- `M:` lost comm = `7600 + VMC land / IMC AVEF + AME + latest time`.","p":["IR"]},{"id":"IFR-56","card":"IFR","f":"kb/ifr/lost-comms.md","h":"Pebble","a":"pebble","c":["emg-comms"],"kd":"pebble","u":"ifr-lost-comms-pebble","md":"- LOST COMM `7600 + listening watch + alternate freq/FSS/relay/phone | specific published SID/STAR/IAP procedure overrides generic rules`\n- VMC `continue VFR, land as soon as practicable | practicable ≠ nearest unsuitable field`\n- IMC `route A-V-E-F = assigned → vectored direct to fix/route/airway → expected → filed | altitude = highest of A-M-E = assigned / minimum IFR altitude / expected | vectored below published IFR altitude → climb immediately`\n- DESCENT `maintain enroute altitude to nav facility/approach fix | start at latest of filed/amended ETA, last ATC-acknowledged ETA, or EAT | holding acknowledged: hold as directed, approach at EAT/EFC`","p":["IR"]},{"id":"IFR-57","card":"IFR","f":"kb/ifr/minima-visual-reference.md","h":"CAP definitions / minima","a":"cap-definitions--minima","c":["ifr-minima","ifr-plates"],"kd":"knowledge","u":"ifr-cap-definitions-minima","md":"| Item | Memory |\n|---|---|\n| `DA` | altitude where missed shall be initiated if visual ref not established |\n| `DH` | height of DA above TDZE/threshold |\n| `MDA` | no descent below until required visual ref |\n| `HAA` | MDA above aerodrome elevation, circling |\n| `HAT/HATh` | DA/MDA above TDZE/threshold, straight-in |\n| `MSA` | min 1000 ft clearance in sector, standard temp/pressure |\n| `RVR` | runway centreline visual range of markings/lights |\n| `Vis` | advisory / approach-ban planning value, not DA/MDA itself |\n\n- `T:` advisory visibility helps probability/ban logic; DA/MDA controls vertical descent.\n- Categories by approach speed: **A** ≤90 kt · **B** 91–120 · **C** 121–140 · **D** 141–165 · **E** >165. Faster than your category → use the higher one; never a lower category. [CAP GEN Minima]","p":["IR"]},{"id":"IFR-58","card":"IFR","f":"kb/ifr/minima-visual-reference.md","h":"Landing minima / visual reference","a":"landing-minima--visual-reference","c":["ifr-minima"],"kd":"knowledge","u":"ifr-landing-minima-visual-reference","md":"- Do not continue below DH/DA or descend below MDA unless required visual reference established and maintained for safe landing.\n- Visual refs include runway/markings/threshold/TDZ/approach lights/VGSI/RIL/threshold-end lights/edge/centreline/TDZL.\n- Published landing visibilities are advisory only subject to approach ban; use to judge success probability.\n- `!:` missed after MAP: obstacle clearance not assured.\n- `T:` seeing “some lights” may not be enough if it doesn’t allow position/rate assessment for safe landing.","p":["IR"]},{"id":"IFR-59","card":"IFR","f":"kb/ifr/minima-visual-reference.md","h":"Approach ban / RVR","a":"approach-ban--rvr","c":["ifr-minima"],"kd":"knowledge","u":"ifr-approach-ban-rvr-general-aviation","md":"- RVR = automated runway visual range for landing/takeoff direction. Use current approach-ban rules; category/operator-specific.\n- GA NPA/APV/CAT I/II: governed by RVR values when runway served by RVR.\n- General non-Part VII aeroplane rule: if both measured, below minimum when `RVR A <1200` **or** `RVR B <600`; if only one is measured, below minimum when it is `<1200`. `[CAR 602.129]`\n- Exceptions include: below-min RVR received after FAF; training missed approach; RVR varying below/above; RVR below min but ground vis ≥`1/4 SM`; CAT III as applicable.\n- `T:` if RVR unavailable/not reported, GA approach-ban criterion may not exist; still need DA/MDA visual reference to land.\n- `T:` commercial approach-ban rules are stricter/different; don’t mix GA and 703/704/705 tables.\n- `T:` advisory vis not same as approach-ban controlling visibility. CAP/CAR/operator ops spec wins.","p":["IR"]},{"id":"IFR-60","card":"IFR","f":"kb/ifr/minima-visual-reference.md","h":"RVR / visibility quick memory","a":"rvr--visibility-quick-memory","c":["ifr-minima"],"kd":"formula","u":"ifr-rvr-visibility-quick-memory","md":"- `R non-Part VII aeroplane:` if both measured, below minimum when `RVR A <1200` **or** `RVR B <600`; if only A or B measured, below minimum when that RVR `<1200`. `[CAR 602.129]`\n- Below-minimum RVR normally bars continuation beyond the applicable point, subject to listed exceptions: report received after FAF/final-course intercept, training no-landing, varying RVR, ground visibility ≥`1/4 SM`, or CAT III.\n- Advisory visibility helps planning; DA/MDA visual reference controls descent/landing.\n- `T:` this general rule excludes Part VII operations; ground visibility, runway visibility, RVR, advisory visibility and flight visibility are different.","p":[],"ph":["IR"]},{"id":"IFR-61","card":"IFR","f":"kb/ifr/minima-visual-reference.md","h":"Minima box scan","a":"minima-box-scan","c":["ifr-minima","ifr-plates"],"kd":"knowledge","u":"plate-minima-box-scan","md":"- Read aircraft category first: `A/B/C/D/E` by final approach speed category.\n- Identify line: `ILS/LOC/LNAV/LNAV-VNAV/LPV/VOR/NDB/circling`.\n- Extract: `DA/DH` or `MDA`; `HAT/HATh/HAA`; advisory visibility; notes/lighting penalties; RASS/cold-temp impacts.\n- `T:` wrong category = wrong protected area/minima. Faster circling speed can force higher category.","p":[],"ph":["IR"]},{"id":"IFR-62","card":"IFR","f":"kb/ifr/minima-visual-reference.md","h":"Straight-in vs circling","a":"straight-in-vs-circling","c":["ifr-minima","ifr-missed","ifr-plates"],"kd":"knowledge","u":"plate-straight-in-vs-circling","md":"- Straight-in minima require alignment/descent/visual environment adequate for landing on that runway.\n- If runway not suitable/visual manoeuvre required, use circling minima unless procedure provides straight-in authorized minima.\n- `T:` “approach to runway” does not guarantee straight-in landing is sensible.","p":["IR"]},{"id":"IFR-63","card":"IFR","f":"kb/ifr/minima-visual-reference.md","h":"Lighting / runway / visual aids","a":"lighting--runway--visual-aids","c":["ifr-minima","ifr-plates"],"kd":"knowledge","u":"plate-lighting-runway-visual-aids","md":"- Check ALS, runway lights, TDZ/centreline lights, PAPI/VASI, RIL, approach lighting penalties, runway length/LDA, slope, displaced threshold.\n- `T:` lighting inoperative can increase minima or make procedure/runway unsuitable. NOTAM can change this.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"IFR-64","card":"IFR","f":"kb/ifr/minima-visual-reference.md","h":"Reduced and low visibility operations","a":"reduced-and-low-visibility-operations","c":["ifr-minima","law-atc"],"kd":"knowledge","u":"ifr-reduced-low-visibility-operations","md":"- **RVO** = below RVR 2600 down to RVR 1200; **LVO** = below RVR 1200 down to RVR 600. Arrivals/departures below RVR 600 not authorized. [CAP GEN Operating minima]\n- RVR 2600 imminent → procedures restrict movement area; ATIS: \"LOW / REDUCED VISIBILITY PROCEDURES IN EFFECT\". [CAP GEN]\n- LVP in effect → no NPA, APV, CAT I or CAT II approach may be commenced (CAT III ops only). [CAP GEN; CAR 602.129]\n- CAP aerodrome chart shows each runway's level of service (`RVR 1200`, `¼ SM`, `RVR 600`). Below CFS level of service = taxi/landing \"below published aerodrome operating visibility\" (exceptions: already past FAF, started taxi, ATC-authorized per procedures). [CAP GEN]\n- Start/push: wait for RVR ≥1000 for 1200 take-off minima; ≥600 for 600 minima. \"Follow me\" on request below RVR 2600. [CAP GEN]\n- `M:` `2600 RVO · 1200 LVO · 600 floor`.","p":["IR"]},{"id":"IFR-65","card":"IFR","f":"kb/ifr/minima-visual-reference.md","h":"Pebble","a":"pebble","c":["ifr-minima"],"kd":"pebble","u":"ifr-minima-visual-reference-pebble","md":"- DEFINITIONS `DA = missed initiated if no visual ref | DH = DA above TDZE/threshold | MDA = no descent below without visual ref | HAA = MDA above aerodrome elevation, circling | HAT/HATh = above TDZE/threshold, straight-in`\n- VISUAL REF `no descent below DA/DH/MDA unless required visual reference established AND maintained for safe landing | “some lights” may not be enough | published landing visibilities advisory, subject to approach ban | missed after MAP: obstacle clearance not assured`\n- APPROACH BAN (GA, non-Part VII) CAR 602.129 `both measured: below minimum when RVR A <1200 OR RVR B <600 | one measured: <1200 | exceptions: after FAF, training missed approach, RVR varying, ground vis ≥¼ SM, CAT III as applicable | no RVR reported → criterion may not exist`\n- T `commercial 703/704/705 rules differ: do not mix tables | advisory vis ≠ approach-ban controlling visibility`\n- RVO/LVO `RVO <2600–1200 · LVO <1200–600 · <600 not authorized | LVP in effect → no NPA/APV/CAT I/II start | categories A≤90 B≤120 C≤140 D≤165`","p":["PPL","CPL","IR"]},{"id":"IFR-66","card":"IFR","f":"kb/ifr/missed-approach-circling.md","h":"Missed approach","a":"missed-approach","c":["ifr-missed"],"kd":"knowledge","u":"ifr-missed-approach","md":"- At DA/MDA/MAP without required visual reference, or unstable/unsafe, execute missed. Fly published lateral/vertical exactly.\n- Precision/APV: at DA/DH without visual refs → missed.\n- NPA: at MAP or when unable to continue safely/legally → missed; do not descend below MDA before visual refs.\n- Fly published missed exactly: climb, turn limits, nav source, altitude, hold. If missed after MAP, obstacle clearance may not be assured.\n- `T:` power/attitude/config first; then nav. brief missed before FAF.\n- `T:` missed point is obstacle-clearance origin.\n- Brief before FAF: initial climb, turn direction/altitude, fix/hold, nav source, frequencies, climb gradient, special notes.\n- `T:` do not continue level past the MAP hunting for the runway.","p":["IR"]},{"id":"IFR-67","card":"IFR","f":"kb/ifr/missed-approach-circling.md","h":"Circling","a":"circling","c":["ifr-missed"],"kd":"knowledge","u":"ifr-circling","md":"- Circling minima based on category; maintain visual reference; remain within protected area; use published restrictions.\n- If visual reference lost while circling: initiate missed; generally turn toward landing runway and intercept published missed unless procedure/SOP says otherwise.\n- `T:` circling at night/marginal wx is high risk; exam may test category/speed/minima mismatch.\n- Check circling minima/category, prohibited sectors, day/night restrictions, runway lighting, terrain/obstacles, weather/wind.\n- `T:` circling area depends on category/speed: faster than the category means the higher category.","p":["IR"]},{"id":"IFR-68","card":"IFR","f":"kb/ifr/missed-approach-circling.md","h":"MAP identification","a":"map-identification","c":["ifr-missed","ifr-plates"],"kd":"knowledge","u":"plate-map-identification","md":"- Precision/APV: DA/DH on glidepath is decision point.\n- NPA: MAP may be timing, DME, waypoint, station passage, runway threshold, or defined fix.\n- `T:` if timer/DME/GPS not set before FAF, MAP identification can fail under workload.","p":[],"ph":["IR"]},{"id":"IFR-69","card":"IFR","f":"kb/ifr/missed-approach-circling.md","h":"Pebble","a":"pebble","c":["ifr-missed"],"kd":"pebble","u":"ifr-missed-approach-circling-pebble","md":"- MISSED `precision/APV: at DA/DH without visual refs | NPA: at MAP, or unable to continue safely/legally | unstable/unsafe → missed | fly published missed exactly: climb, turn limits, nav source, altitude, hold | after MAP: obstacle clearance may not be assured`\n- T `power/attitude/config first, then nav | brief missed before FAF | missed point = obstacle-clearance origin`\n- CIRCLING `minima by category | maintain visual reference, remain within protected area | lost visual: missed, generally turn toward landing RWY then intercept published missed unless procedure/SOP says otherwise`","p":["IR"]},{"id":"IFR-70","card":"IFR","f":"kb/ifr/navaid-checks.md","h":"Navigation aid checks","a":"navigation-aid-checks","c":["nav-radio"],"kd":"knowledge","u":"ifr-navigation-aid-checks","md":"- VOR: identify Morse/voice, correct frequency/course/TO-FROM, service volume and NOTAM.\n\n##### VOR receiver checks — 4–6–4\n\n| Check | Maximum acceptable error / difference |\n|---|---|\n| VOT / designated ground checkpoint | **±4°** from the reference indication (FAA AIM reference; see Canadian scope below) |\n| Airborne landmark / published-radial check | **±6°** from the published radial |\n| Dual independent VOR receivers, same station | **4° total difference** between indicated bearings |\n\n- `M:` **4 ground — 6 airborne — 4 between receivers.**\n- `P VOT:` with CDI centred, reference indication is **000° FROM** or **180° TO**; apply ±4°. A designated ground checkpoint uses its published radial instead.\n- `T dual:` NAV1 030° / NAV2 034° = at the limit; 030° / 035° = exceeds tolerance. This is **4° between receivers**, not ±4° each. Compare using the same TO/FROM sense.\n- `T airborne:` ±6° is a **receiver-check tolerance**, not permission to track 6° off course.\n- **Canadian scope:** TC AIM 2026-1 COM 4.5.1–4.5.2 specifies the dual comparison and airborne check: difference greater than 4° requires investigation/correction before IFR use; airborne error greater than 6° means the equipment should not be used for IFR navigation. The ground/VOT ±4° and VOT indications above are explicitly sourced to the FAA AIM; do not infer U.S. checking intervals or recordkeeping requirements for Canada.\n- **Sources:** [TC AIM 2026-1, COM 4.5.1–4.5.2](https://tc.canada.ca/en/aviation/publications/transport-canada-aeronautical-information-manual-tc-aim-tp-14371); [FAA AIM 1-1-4, VOR Receiver Check](https://www.faa.gov/air_traffic/publications/atpubs/aim_html/chap1_section_1.html). Reviewed 2026-10-19.\n\n\n- ILS: identify LOC; set front course; GS alive from below; marker/DME/fixes per plate.\n- NDB: identify; station passage/needle swing; ADF errors near TS/coast/night/mountain.\n- GNSS: current DB, RAIM/WAAS, correct mode, CDI scaling, annunciations.\n- `T:` failed identification = unusable navaid for approach.","p":["CPL","IR"]},{"id":"IFR-71","card":"IFR","f":"kb/ifr/navaid-checks.md","h":"Navigation aids — ADF / VOR / DME / intercepts","a":"navigation-aids--adf--vor--dme--intercepts","c":["nav-radio"],"kd":"formula","u":"nav-navigation-aids-adf-vor-dme-intercepts","md":"| Label | English | Français |\n|---|---|---|\n| Conventions | MH = magnetic heading; RB = clockwise relative bearing from nose; BTS/BFS = bearing TO/FROM station. Use one north reference throughout. | MH = cap magnétique; RB = gisement horaire depuis le nez; BTS/BFS = relèvement VERS/DEPUIS la station. Même référence nord pour tous les angles. |\n| Wrap / Normaliser | wrap(x) = x modulo 360; add/subtract 360 until 0–359°. North may be written 000° or 360°. | wrap(x) = x modulo 360; ajouter/soustraire 360 pour obtenir 0–359°. Nord : 000° ou 360°. |\n| BTS = MH + RB | BTS = wrap(MH + RB). MH 350°, RB 040° → BTS 030°. | BTS = wrap(MH + RB). MH 350°, RB 040° → BTS 030°. |\n| BFS = BTS ±180 | BFS = wrap(BTS +180°). BTS 030° → BFS 210°: aircraft southwest of station. | BFS = wrap(BTS +180°). BTS 030° → BFS 210° : avion au sud-ouest de la station. |\n| RB = BTS − MH | RB = wrap(BTS − MH). BTS 020°, MH 080° → RB 300° (60° left of nose). | RB = wrap(BTS − MH). BTS 020°, MH 080° → RB 300° (60° à gauche du nez). |\n| MH = BTS − RB | MH = wrap(BTS − RB). BTS 100°, RB 250° → MH 210°. | MH = wrap(BTS − RB). BTS 100°, RB 250° → MH 210°. |\n| ADF card / Rose | Fixed card: read RB. Movable card: set current MH under index to read magnetic BTS. RMI: correctly referenced needle head = BTS, tail = BFS. | Rose fixe : lire RB. Rose mobile : afficher MH à l’index pour lire BTS magnétique. RMI correctement référencé : pointe = BTS, queue = BFS. |\n| Turn / Virage | At essentially unchanged position, right turn +30° → RB decreases 30°; left turn → RB increases. BTS stays nearly unchanged. | À position pratiquement constante, virage droite +30° → RB diminue de 30°; gauche → RB augmente. BTS reste presque constant. |\n| Homing ≠ tracking | RB 000° points the nose at the station. In crosswind, holding RB 000° gives a curved homing path. Tracking needs wind correction. | RB 000° pointe le nez vers la station. Par vent traversier, maintenir RB 000° produit une trajectoire courbe. Suivre une route exige une correction de dérive. |\n| VOR radial | Radial = bearing FROM station. On R-090: outbound course 090°; inbound course 270°. Identify aid and north reference (true-reference exceptions exist in Canada). | Radiale = relèvement DEPUIS station. Sur R-090 : route éloignement 090°; rapprochement 270°. Identifier aide et référence nord (exceptions au nord vrai au Canada). |\n| TO / FROM | With CDI centred: selected course toward station → TO; reciprocal → FROM. Flag describes selected-course geometry, not aircraft heading or actual travel. | CDI centré : route sélectionnée vers station → TO; réciproque → FROM. Le drapeau décrit la géométrie sélectionnée, pas le cap ni le déplacement réel. |\n| 30° intercept setup | C = desired direction of travel, NOT always radial. Choose H = C ±30° toward the course line. Sketch station, current BFS and target line first; heading alone cannot select the side. No-wind examples below. | C = route désirée, PAS toujours radiale. Choisir H = C ±30° vers la ligne. Dessiner station, BFS actuel et ligne cible; le cap seul ne donne pas le côté. Exemples sans vent ci-dessous. |\n| Capture: inbound | At capture BTS = C; RB = wrap(C − H). H=C+30 → RB330; H=C−30 → RB030. Start rollout with appropriate lead. | À l’interception BTS = C; RB = wrap(C − H). H=C+30 → RB330; H=C−30 → RB030. Anticiper la sortie du virage. |\n| Capture: outbound | At capture BTS = wrap(C+180); RB = wrap(C+180−H). H=C+30 → RB150; H=C−30 → RB210. | À l’interception BTS = wrap(C+180); RB = wrap(C+180−H). H=C+30 → RB150; H=C−30 → RB210. |\n| Inbound example | Aircraft west-northwest of NDB (BFS285), intercept C090 inbound: H120 toward line. At capture BTS090, RB330. Turn left toward 090, then correct wind. | Avion au ouest-nord-ouest du NDB (BFS285), intercepter C090 en rapprochement : H120 vers ligne. À l’interception BTS090, RB330. Virer gauche vers 090, puis corriger le vent. |\n| Outbound example | Aircraft northeast (BFS045), intercept C090 outbound: H120. At capture BFS090, BTS270, RB150. Turn left toward 090, then correct wind. | Avion au nord-est (BFS045), intercepter C090 en éloignement : H120. À l’interception BFS090, BTS270, RB150. Virer gauche vers 090, puis corriger le vent. |\n| Wind trap / Vent | 30° is a chosen training intercept, not a universal rule. Wind changes the ground intercept angle. Always compute capture RB from actual heading; after capture fly the wind-corrected heading. | 30° est un choix pédagogique, pas une règle universelle. Le vent modifie l’angle au sol. Calculer RB à partir du cap réel; après interception appliquer la correction de dérive. |\n| Cross-track distance | Lateral offset = ground range × sin(angular error); small angle ≈ range × error°/60. At 30 NM, 4° → about 2 NM. | Écart latéral = distance horizontale × sin(erreur angulaire); petit angle ≈ distance × erreur°/60. À 30 NM, 4° → environ 2 NM. |\n| VOR dots | Conventional VOR CDI: normally 2° per dot, ±10° full scale. Two dots at 30 NM ≈ 2 NM. LOC and GNSS scales differ; check equipment/mode. | CDI VOR classique : normalement 2° par point, ±10° pleine échelle. Deux points à 30 NM ≈ 2 NM. Échelles LOC/GNSS différentes; vérifier équipement/mode. |\n| DME geometry | Slant NM = √(ground NM² + height NM²); height NM = height above station(ft)/6076. Over station at 6076 ft above it → about 1 DME, not zero. | Distance oblique NM = √(distance horizontale NM² + hauteur NM²); hauteur NM = pieds au-dessus station/6076. À la verticale à 6076 ft au-dessus → environ 1 DME, pas zéro. |\n| DME ground range | Ground NM = √(DME² − height NM²). DME 5 NM, height 6076 ft → √24 ≈4.90 NM. DME speed/time meaningful toward/away from station; unreliable for along-track speed on an arc. | Distance horizontale NM = √(DME² − hauteur NM²). DME 5 NM, hauteur 6076 ft → √24 ≈4,90 NM. Vitesse/temps DME pertinents vers/depuis station; pas la vitesse le long d’un arc. |\n| 30° closing time | For a 30° GROUND-track intercept: closing speed = GS × sin30 = GS/2. Time(min)=120 × lateral NM/GS. 2 NM off at 120 kt → 2 min. Wind-correct heading to obtain that ground track. | Interception à 30° de ROUTE SOL : vitesse de rapprochement = GS/2. Temps(min)=120 × écart NM/GS. Écart 2 NM à 120 kt → 2 min. Corriger le cap pour obtenir cette route sol. |\n***\n- `M VOR checks:` **4–6–4** = ground/VOT ±4° (FAA reference), airborne ±6°, dual receivers ≤4° total difference. Receiver accuracy ≠ tracking allowance. See [VOR receiver checks and Canadian source scope](navaid-checks.md#navigation-aid-checks).","p":["PPL","CPL","IR"],"e":["CPL"]},{"id":"IFR-72","card":"IFR","f":"kb/ifr/navaid-checks.md","h":"ILS and VORTAC principles — AIM COM 4","a":"ils-and-vortac-principles--aim-com-4","c":["nav-radio"],"kd":"knowledge","u":"nav-ils-vortac-principles-com-4","md":"- ILS = localizer (course) + glide path + FAF fix (NDB or DME/RNAV). [COM 4.10]\n- LOC 108.1–111.9 MHz; reliable 18 NM within 10°, 10 NM within 35°. False courses 6–35° off: don't couple until within 6°. [COM 4.10.1, 4.10.7]\n- GP 329.3–335 MHz, paired with LOC; ~3°, beam 1.4°. False GP at 2× and 3× angle: check altitude at FAF. [COM 4.10.2, 4.10.7]\n- VOR: 360 radials, Morse ID. VORTAC: civil users get VOR azimuth + TACAN DME; TACAN azimuth not for civil. [COM 4.5, 4.9]\n- DME = slant range; ±0.5 NM or 3 %. [COM 4.7]\n- `T:` intercept GP from below; above = risk of false GP.","p":["IR"]},{"id":"IFR-73","card":"IFR","f":"kb/ifr/navaid-checks.md","h":"Nav displays — RMI, HSI, flight director, radio altimeter","a":"nav-displays--rmi-hsi-flight-director-radio-altimeter","c":["nav-radio","agk-inst"],"kd":"knowledge","u":"nav-rmi-hsi-fd-radio-altimeter","md":"- **RMI**: slaved heading card + bearing pointer. Head = magnetic bearing **to** station, tail = reciprocal (from). Read directly: no RB + heading sum (that is fixed-card ADF). [TP 2076 2.2.6]\n- **HSI**: rotating heading card, bearing pointer, aircraft symbol with track (deviation) bar, TO/FROM in one view. Dots: VOR ~5° / 10°, ILS ~1¼° / 2½°. [TP 2076 2.1.5 C]\n- **Flight director**: FDI command bars = computed pitch/b
