---|---|---|\n| 4 h | away >36 consecutive h | 13 consecutive h |\n| >4 to ≤10 h | away ≤60 h, no FDP in window of circadian low | 1 local night |\n| >4 to ≤10 h | away >60 h, or FDP touches WOCL | 2 local nights |\n| >10 h | away ≤60 h | 2 local nights |\n| >10 h | away >60 h | 3 local nights |\n\n- `R` Positioning right after an FDP that, with travel, exceeds the 700.28 max FDP → rest = **hours of work** (excess ≤3 h) or **hours of work + excess** (excess >3 h); never less than 700.40(1). Excess >3 h only if crew **agrees** and excess ≤**7 h**. Positioning not followed by an FDP counts as FDP for 700.40 rest.\n- `R` **≤3 consecutive FDPs** touching **02:00–05:59**, then one local night's rest. Up to **5** if each FDP has **3 h rest in suitable accommodation** + **56 consecutive h free from duty** after the last.\n\n- Sources: [700.41](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.41.html), [700.42](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.42.html), [700.43](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.43.html), [700.51](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.51.html).","p":["CPL"]},{"id":"LAW-64","card":"LAW","f":"kb/law/fatigue-700.md","h":"Delayed reporting, standby, controlled rest — 700.52 / .71 / .72","a":"delayed-reporting-standby-controlled-rest--70052--71--72","c":["law-fatigue"],"kd":"knowledge","u":"law-700-delayed-reporting-standby-controlled-rest","md":"- `R` Delay advised **before leaving suitable accommodation** → FDP length measured from initial or delayed report, **whichever gives the shorter max FDP**.\n- `R` FDP begins: delay **<4 h** → at delayed time · **4 h to <10 h** → **4 h after initial** report · **≥10 h** → delay counts as **rest**, if advised before leaving and rest not disturbed before an agreed time.\n- `R` No agreed contact time → operator may disturb only in the **30 min** before scheduled departure from accommodation or the **60 min** before initial report.\n- `R` Standby: place sheltered from elements, seating, food and drink, ideally not public. Standby with no flight duty → rest **12 h, or 11 h + travel, or 10 h in operator accommodation** at home base; **10 h** away.\n- `R` Controlled rest: **≤45 min**, cruise only, done **≥30 min before scheduled descent** · one pilot rests at a time · **≥2 flight crew stay on the flight deck**. Before: transfer duties, review flight status + wake-up criteria, tell FAs start/end. No duties until **15 min after** rest ends; operational briefing on return.\n- `T` Delay: 604.103 / 702.95 / 700.121 = **>3 h → FDP starts original +3 h** ≠ 700.52 **4 h / 10 h** bands.\n\n- Sources: [700.52](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.52.html), [700.71](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.71.html), [700.72](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.72.html).","p":["CPL"]},{"id":"LAW-65","card":"LAW","f":"kb/law/fatigue-700.md","h":"Medevac (Division IV): scope, fitness, flight time, FDP — 700.100–.104","a":"medevac-division-iv-scope-fitness-flight-time-fdp--700100104","c":["law-fatigue"],"kd":"knowledge","u":"law-700-medevac-scope-flight-time-fdp","md":"- `R` Applies to air operators and crew on **medical evacuation flights**; positioning before/after a medevac counts as medevac. Not 702 operations.\n- `R` Monitoring system (flight time, FDP, rest) in the COM. Anyone aware an assignment would break max flight time or FDP → tell operator ASAP.\n- `R` Fitness: crew says before FDP they are too fatigued → operator **shall not** let FDP start. Fatigued during FDP → tell other crew + operator ASAP; single pilot in flight → tell operator ASAP after landing. Missed rest or time free → report ASAP.\n- `R` Max flight time (includes other flying + full time of augmented flights):\n\n| Window | Limit |\n|---|---|\n| 7 consecutive days | **40 h** (704 / 705, aeroplane) · **60 h** (703, or any helicopter) |\n| 30 consecutive days | **120 h** · **100 h** if on call |\n| 90 consecutive days | **300 h** |\n| 365 consecutive days | **1 200 h** |\n| Single-pilot | **8 h in 24 consecutive h** |\n\n- `R` Max FDP **14 h**.\n\n- Sources: [700.100](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.100.html), [700.101](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.101.html), [700.102](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.102.html), [700.103](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.103.html), [700.104](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.104.html).","p":["CPL"],"e":["CPL"]},{"id":"LAW-66","card":"LAW","f":"kb/law/fatigue-700.md","h":"Medevac rest, split duty, time free, delays, extensions, reserve — 700.116–.121 / .133 / .134","a":"medevac-rest-split-duty-time-free-delays-extensions-reserve--700116121--133--134","c":["law-fatigue"],"kd":"knowledge","u":"law-700-medevac-rest-split-time-off-reserve","md":"- `R` Rest after FDP = **10 h + travel** to and from the rest place; advance notice of rest and its length.\n- `R` Positioning after FDP → extra rest **≥½** of travel time beyond max FDP.\n- `R` Split duty: FDP may exceed 14 h by **½ the rest, max +3 h**, if notice given before FDP + **≥4 consecutive h** rest in suitable accommodation + not interrupted. Following rest extended by **≥ the extension**.\n- `R` Time free from duty, one of: **36 consecutive h / 7 d** · **3 consecutive days / 17 d** · **4 consecutive days / 19 d**; advance notice.\n- `R` **3 consecutive FDPs >12 h** → **≥24 consecutive h** free from flight duty after, unless ≥24 h free between each.\n- `R` Delay **>3 h**, advised before leaving the rest facility → FDP starts **3 h after original** report.\n- `R` Unforeseen operational circumstances: PIC, after consulting **all crew** on fatigue, may extend max flight time **and** FDP by **≤3 h**, notifying operator of length + reason; next rest increased by ≥ the FDP extension. Notices kept **24 months**.\n- `R` Reserve: **≥10 consecutive h rest in 24 h** if 24 h notice, or ≥10 h notice and no duty in those 10 h, or no FDP and no interruption **22:00–06:00**. Next rest start shifts **≤3 h** from previous, **≤8 h total in 7 days**. Rest not given + called or reporting 22:00–06:00 → max FDP **10 h**, next rest + **≥½** of that FDP.\n- `T` Medevac: air taxi (703) gets the **higher** 7-day limit (60 h), not the lower. Medevac 14 h fixed FDP + 40/60 h per 7 d ≠ Division III 700.28 matrix + 700.27 limits.\n\n- Sources: [700.116](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.116.html), [700.117](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.117.html), [700.118](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.118.html), [700.119](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.119.html), [700.120](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.120.html), [700.121](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.121.html), [700.133](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.133.html), [700.134](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-700.134.html).","p":["CPL"],"e":["CPL"]},{"id":"LAW-67","card":"LAW","f":"kb/law/fatigue-700.md","h":"Pebble","a":"pebble","c":["law-fatigue"],"kd":"pebble","u":"law-fatigue-pebble","md":"- 700 DIV III `not 702, not medevac | records 24 mo | home base | meal ≥15 min/6 h | PED only after operator validation`\n- 700 REST `disruptive → 1 local night | away: 4 h diff → 11 h, >4 h → 14 h | ≤3 night FDPs (02–0559) then local night; 5 with 3 h rest each + 56 h off`\n- 700 POSITIONING `excess ≤3 h → rest = work h | >3 h → work + excess, crew consent, ≤7 h`\n- 700 DELAY `<4 h → delayed time | 4–<10 h → initial +4 h | ≥10 h → rest | ≠ 604/702/medevac >3 h → +3 h`\n- CONTROLLED REST `≤45 min | cruise | ≥30 min before descent | +15 min before duties | 700: ≥2 crew on deck`\n- MEDEVAC `FT 40 h/7 d (704/705 aeroplane), 60 h (703 or heli) | 120 (100 on call)/30 d | 300/90 d | 1200/365 d | SP 8 h/24 h | FDP 14 h | rest 10 h + travel | split ≤+3 h | UOC ≤+3 h FT + FDP`","p":["CPL"]},{"id":"LAW-68","card":"LAW","f":"kb/law/flight-plans-fuel-requirements.md","h":"Planning / fuel / go-no-go","a":"planning--fuel--go-no-go","c":["law-plan","met-decide"],"kd":"knowledge","u":"law-planning-fuel-go-no-go","md":"- Plan: wx+NOTAM+CFS+fuel+W&B+perf+alternates/options+daylight/night+terrain/airspace.\n- Fuel: taxi/start + trip + contingency + reserve + alternate/diversion + unusable.\n- `T:` POH burn≠actual burn. marginal VFR + commercial pressure + unfamiliar terrain = trap.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"LAW-69","card":"LAW","f":"kb/law/flight-plans-fuel-requirements.md","h":"Flight plan / itinerary","a":"flight-plan--itinerary","c":["law-plan"],"kd":"knowledge","u":"law-flight-plan-itinerary","md":"- IFR: file IFR flight plan, except itinerary permitted in specified cases wholly/partly outside controlled airspace or where facilities inadequate. `[CAR 602.73]`\n- VFR: flight plan or itinerary unless flight remains within `25 NM` of departure aerodrome. `[CAR 602.73]`\n- International flight: flight plan.\n- Flight plan filed with ATS/CARS; itinerary may be filed with responsible person, ATS or CARS. `[CAR 602.75]`\n- Report required changes and file arrival report/close as required. `[CAR 602.76–602.78]`\n- `T:` landing does not automatically close every plan/itinerary.\n- `T:` itinerary needs responsible person.\n- Arrival report: ident + plan/itinerary + dep + arr + date/time. `T:` close it.\n- VFR pos report: ident-pos-time-alt-plan-dest. PIREP: loc/time-alt-type-cloud-temp-wind-turb-ice-rmk.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"LAW-70","card":"LAW","f":"kb/law/flight-plans-fuel-requirements.md","h":"Fuel requirements","a":"fuel-requirements","c":["law-plan"],"kd":"knowledge","u":"law-fuel-requirements","md":"| Flight | Required fuel after reaching destination |\n|---|---|\n| VFR aeroplane day | normal cruise `30 min` |\n| VFR aeroplane night | normal cruise `45 min` |\n| IFR prop, no alternate | approach + missed + `45 min` |\n| IFR prop, alternate | approach + missed → alternate → land + `45 min` |\n| IFR turbojet/helicopter | same structure + `30 min` |\n\n- Add taxi and foreseeable delays from weather, routing, traffic, system failure and other foreseeable conditions. `[CAR 602.88]`\n- `T:` reserve begins after all required legs; legal reserve is not a target landing fuel.\n- `T:` CAR text/current ops rules win; this is memory, not dispatch release.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"LAW-71","card":"LAW","f":"kb/law/flight-plans-fuel-requirements.md","h":"IFR flight plan contents and changes — CAR 602.74 / 602.76","a":"ifr-flight-plan-contents-and-changes--car-60274--60276","c":["law-plan","ifr-plan","ifr-enr"],"kd":"knowledge","u":"law-ifr-flight-plan-contents-changes","md":"- Contents: as specified in the CFS (flight planning section). [CAR 602.74; AIM RAC 3.14.2]\n- IFR plan: file preferably ≥30 min before departure; include suitable alternate meeting alternate minima; no intermediate stops in one IFR plan. [RAC 3.5.2, 3.9, 3.13]\n- Route points: where speed, level, track or flight rules change. [RAC 3.15.6.2]\n- Changes to notify (IFR plan/itinerary): cruising altitude/FL, route, destination, **TAS ≥5%** of filed TAS, **Mach ≥0.01**. [CAR 602.76(1)]\n- Notify ATC (or responsible person) as soon as practicable; in controlled airspace get **clearance before** the change. [CAR 602.76(2); RAC 3.6.2, 8.2.2]\n- IFR → VFR without new plan if destination unchanged; cancel IFR only in VMC and outside Class A/B. [RAC 6.2]\n- `M:` `ALT-ROUTE-DEST-TAS5%-MACH.01`.\n- `T:` TAS change counts against **filed** TAS, not last cruise speed.","p":["IR"]},{"id":"LAW-72","card":"LAW","f":"kb/law/flight-plans-fuel-requirements.md","h":"Crew member instructions — 602.87","a":"crew-member-instructions--60287","c":["law-plan"],"kd":"knowledge","u":"law-crew-member-instructions-602-87","md":"- `R` PIC ensures every crew member, before acting as crew, is instructed on **their duties** and the **location and use of all normal and emergency exits and all emergency equipment** on board.\n- `T` 602.87 = crew instructions ≠ 602.89 passenger briefing.\n\n- Sources: [602.87](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-602.87.html), [602.89](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-602.89.html).","p":["CPL"]},{"id":"LAW-73","card":"LAW","f":"kb/law/flight-plans-fuel-requirements.md","h":"Pebble","a":"pebble","c":["law-plan"],"kd":"pebble","u":"law-flight-plans-fuel-requirements-pebble","md":"- PLAN CAR 602.73 `IFR: flight plan (itinerary only in specified cases) | VFR: plan or itinerary unless within 25 NM of departure aerodrome | international: flight plan | itinerary needs responsible person | landing does not automatically close a plan`\n- ARRIVAL REPORT `ident + type of plan/itinerary + departure + arrival + date/time`\n- FUEL CAR 602.88 `VFR aeroplane day 30 min / night 45 min at normal cruise | IFR prop: approach + missed (→ alternate + land) + 45 min | turbojet/helicopter IFR 30 min | add taxi + foreseeable delays | reserve begins after all required legs`\n- PLANNING `wx + NOTAM + CFS + fuel + W&B + perf + alternates | POH burn ≠ actual burn`\n- IFR PLAN `contents per CFS | file ≥30 min | no intermediate stops | notify + get clearance for ALT, ROUTE, DEST, TAS ≥5 %, Mach ≥0.01`\n- CREW INSTRUCTIONS `602.87: before acting as crew → duties + exits + emergency equipment`","p":["PPL","CPL","IR"]},{"id":"LAW-74","card":"LAW","f":"kb/law/general-operating-rules.md","h":"PIC responsibility / emergency","a":"pic-responsibility--emergency","c":["law-oprules"],"kd":"knowledge","u":"law-pic-responsibility-emergency","md":"- PIC is responsible; reckless/negligent operation is prohibited. `[CAR 602.01.1–602.01.2]`\n- Emergency deviation only as necessary for safety. `[CAR 602.01.3]` `M:` authority≠absence of accountability.","p":["PPL","CPL"]},{"id":"LAW-75","card":"LAW","f":"kb/law/general-operating-rules.md","h":"Aircraft icing / clean aircraft","a":"aircraft-icing--clean-aircraft","c":["law-oprules","deice"],"kd":"knowledge","u":"law-aircraft-icing-clean-aircraft","md":"- No takeoff with frost, ice or snow adhering to critical surfaces. `[CAR 602.11]`\n- When contamination may reasonably be expected, perform the required immediate pre-takeoff contamination inspection. `[CAR 602.11]`\n- `M:` clean-wing concept: no “little bit is fine.”","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"LAW-76","card":"LAW","f":"kb/law/general-operating-rules.md","h":"Pre-flight information","a":"pre-flight-information","c":["law-oprules","law-plan"],"kd":"knowledge","u":"law-pre-flight-information","md":"- PIC must be familiar with available information appropriate to intended flight. `[CAR 602.71]`\n- For flight away from aerodrome vicinity: includes weather, fuel, alternatives, runway/airport suitability, delays and relevant operational information.\n- `M:` `WX-NOTAM-FUEL-W&B-PERF-ROUTE-AIRSPACE-RUNWAY-ALTERNATES`.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"LAW-77","card":"LAW","f":"kb/law/general-operating-rules.md","h":"Baggage / cargo","a":"baggage--cargo","c":["law-oprules","agk-wb"],"kd":"knowledge","u":"law-baggage-cargo","md":"- Carry-on baggage, equipment and cargo must be stowed/secured so they cannot shift, obstruct controls/exits or injure occupants. `[CAR 602.86]`\n- Respect W&B, baggage-area structural limits and dangerous-goods rules.\n- `T:` within total weight ≠ correctly secured or within CG.","p":["PPL","CPL"],"e":["CPL"]},{"id":"LAW-78","card":"LAW","f":"kb/law/general-operating-rules.md","h":"Passenger briefing","a":"passenger-briefing","c":["law-oprules"],"kd":"knowledge","u":"law-passenger-briefing","md":"- Before takeoff brief exits, seat belts/harnesses/restraints, seats/tables, baggage, oxygen where applicable and smoking restrictions. `[CAR 602.89]`\n- Where applicable include life preservers, first-aid/survival equipment, ELT and raft information.\n- `M:` brief normal use + emergency action, not just “seat belt on.”\n- Pax brief memory: belts/doors/exits/no smoking/ELT/survival/sterile cockpit/emerg. `M:` SAFETY.","p":["PPL","CPL"]},{"id":"LAW-79","card":"LAW","f":"kb/law/general-operating-rules.md","h":"Safety belts / restraints","a":"safety-belts--restraints","c":["law-oprules","law-elt"],"kd":"knowledge","u":"law-safety-belts-restraints","md":"- Seats, safety belts and restraint systems must meet 605.22–605.28 requirements.\n- PIC ensures passengers are instructed and comply during required phases/conditions.\n- `T:` one belt for two persons is not the default; child-restraint provisions are specific.","p":["PPL","CPL"],"e":["PPL"]},{"id":"LAW-80","card":"LAW","f":"kb/law/general-operating-rules.md","h":"Right-of-way / collision avoidance","a":"right-of-way--collision-avoidance","c":["law-oprules"],"kd":"knowledge","u":"law-right-of-way-collision-avoidance","md":"- Distress has priority; ROW never removes collision-avoidance duty. `[CAR 602.19; 602.21]`\n- Converging: traffic on right has ROW; head-on: both right; overtaking: pass/keep clear right.\n- Powered aeroplane gives way to airship/glider/balloon/towing aircraft; landing aircraft has ROW, but lower aircraft may not cut in on final.\n- `M:` `RIGHT-RIGHT-RIGHT`. `T:` ATC clearance does not remove see-and-avoid in VMC.","p":["PPL","CPL"],"e":["PPL"]},{"id":"LAW-81","card":"LAW","f":"kb/law/general-operating-rules.md","h":"Minimum altitudes / distances","a":"minimum-altitudes--distances","c":["law-oprules"],"kd":"knowledge","u":"law-minimum-altitudes-distances","md":"- Built-up area/open-air assembly: altitude allowing emergency landing without hazard and aeroplane at least `1000 ft` above highest obstacle within `2000 ft` horizontally. `[CAR 602.14]`\n- Elsewhere: at least `500 ft` from any person, vessel, vehicle or structure. `[CAR 602.14]`\n- Exceptions include takeoff/approach/landing and authorized low-altitude operations under 602.15.\n- `T:` “500 AGL” is not the wording; it is `500 ft from` persons/vessels/vehicles/structures.","p":["PPL","CPL"],"e":["PPL"]},{"id":"LAW-82","card":"LAW","f":"kb/law/general-operating-rules.md","h":"Aerobatic manoeuvres","a":"aerobatic-manoeuvres","c":["law-oprules"],"kd":"knowledge","u":"law-aerobatic-manoeuvres","md":"- Restrictions include designated airspace/areas, minimum visibility, cloud clearance, altitude and passenger conditions. `[CAR 602.27–602.28]`\n- Aircraft POH/category/W&B limitations also apply.\n- `T:` POH-approved spin ≠ legal anywhere/any altitude/with passengers.","p":["PPL","CPL"],"e":["PPL"]},{"id":"LAW-83","card":"LAW","f":"kb/law/general-operating-rules.md","h":"Passenger weights / Masse des passagers — AIM 2026-1 RAC 3.4.7","a":"passenger-weights--masse-des-passagers--aim-2026-1-rac-347","c":["law-oprules","agk-wb"],"kd":"knowledge","u":"law-passenger-weights-masse-des-passagers-aim-2026-1","md":"| Label | English | Français |\n|---|---|---|\n| Scope / Portée | Standard averages require the applicable approved W&B method. 703 uses actual/volunteered/estimated or approved segmented/survey methods; do not apply airline averages to a small private aircraft. | Moyennes standard selon méthode masse/centrage approuvée applicable. En 703 : masses réelles/déclarées/estimées ou segmentées/enquête approuvées; pas de moyennes compagnie pour petit avion privé. |\n| Adult M / X ≥12 | Summer 206 lb (93.4 kg); winter 212 lb (96.2 kg). | Été 206 lb (93,4 kg); hiver 212 lb (96,2 kg). |\n| Adult F ≥12 | Summer 172 lb (78.1 kg); winter 178 lb (80.7 kg). Adult winter increment =6 lb. | Été 172 lb (78,1 kg); hiver 178 lb (80,7 kg). Supplément adulte hiver =6 lb. |\n| Children / Enfants | Age 2–11: 75 lb (34 kg), both seasons. Infant <2: 30 lb (13.6 kg); standard-method infant allowance note applies when infant count exceeds 10% of adults. | 2–11 ans : 75 lb (34 kg), deux saisons. Bébé <2 : 30 lb (13,6 kg); note de la méthode standard si nombre de bébés dépasse 10 % des adultes. |\n| Baggage / Bagages | Standard adult weights include clothing/carry-on. No carry-on: permitted reduction 13 lb (5.9 kg). Checked baggage and cargo: actual weights. | Masses standard adultes incluent vêtements/bagage cabine. Sans bagage cabine : réduction permise 13 lb (5,9 kg). Bagages enregistrés/fret : masses réelles. |\n| Small sample / Petit groupe | 1–4 maximum certificated passenger seats: actual, volunteered or estimated weights. Segmented weights depend on certificated capacity, not passengers aboard. | 1–4 sièges passagers max certifiés : masses réelles, déclarées ou estimées. Masses segmentées selon capacité certifiée, pas nombre à bord. |\n| Segment 5 | 5 certificated passenger seats: summer M/X 243, F 204 lb; winter M/X 249, F 210 lb. | 5 sièges passagers certifiés : été M/X 243, F 204 lb; hiver M/X 249, F 210 lb. |\n| Segment 6–8 | 6–8 certificated passenger seats: summer M/X 238, F 200 lb; winter M/X 244, F 206 lb. | 6–8 sièges passagers certifiés : été M/X 238, F 200 lb; hiver M/X 244, F 206 lb. |\n| Segment 9–11 | 9–11 certificated passenger seats: summer M/X 230, F 193 lb; winter M/X 236, F 199 lb. | 9–11 sièges passagers certifiés : été M/X 230, F 193 lb; hiver M/X 236, F 199 lb. |\n| Segment 12–16 | 12–16 certificated passenger seats: summer M/X 227, F 190 lb; winter M/X 233, F 196 lb. | 12–16 sièges passagers certifiés : été M/X 227, F 190 lb; hiver M/X 233, F 196 lb. |\n| Segment 17–25 | 17–25 certificated passenger seats: summer M/X 223, F 187 lb; winter M/X 229, F 193 lb. | 17–25 sièges passagers certifiés : été M/X 223, F 187 lb; hiver M/X 229, F 193 lb. |\n| Actual wins / Réel | If a group is heavier than the assumed average, account for actual weights. Never hide infant, baggage or unusual load in a blanket average. | Si groupe plus lourd que moyenne supposée, tenir compte des masses réelles. Ne pas masquer bébé, bagages ou charge inhabituelle dans moyenne générale. |","p":["PPL","CPL"],"e":["CPL"]},{"id":"LAW-84","card":"LAW","f":"kb/law/general-operating-rules.md","h":"Portable electronic devices — CAR 602.08","a":"portable-electronic-devices--car-60208","c":["law-oprules"],"kd":"knowledge","u":"law-ped-car-602-08","md":"- Operator shall not permit PED use if it could adversely affect aircraft operation/systems. [CAR 602.08(1)]\n- No person uses a PED on board without operator permission. [CAR 602.08(2)]\n- `T:` rule is \"could affect\" + operator permission, not a list of banned devices. EFB = operator-approved use.","p":["IR"]},{"id":"LAW-85","card":"LAW","f":"kb/law/general-operating-rules.md","h":"Fuel dumping — 602.30","a":"fuel-dumping--60230","c":["law-oprules"],"kd":"knowledge","u":"law-fuel-dumping-602-30","md":"- `R` Jettison fuel in flight only if **necessary for aviation safety** and all appropriate measures taken to minimize danger to life and environmental damage, as circumstances permit.\n\n- Sources: [602.30](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-602.30.html).","p":["CPL"]},{"id":"LAW-86","card":"LAW","f":"kb/law/general-operating-rules.md","h":"Special flight operations certificates — 603.01 / .36 / .37 / .65 / .66","a":"special-flight-operations-certificates--60301--36--37--65--66","c":["law-oprules"],"kd":"knowledge","u":"law-special-flight-operations-603","md":"- `R` **Special aviation event** (air show etc., **not a fly-in**) → special flight operations certificate (SFOC) — special aviation event.\n- `R` **Parachute descent** in/into controlled airspace or an air route, or over/into a built-up area or open-air assembly → SFOC — parachuting (otherwise prohibited by 602.26).\n- `R` Other operations not under Part VII needing an SFOC: TKOF/LDG in a **built-up area** away from an airport/heliport/military A/D (not balloons) · aerial application, inspection or photography below 602.14(2)(a) distances · heli Class B/C/D external loads over built-up area or assembly · persons entering or leaving a powered ACFT in flight (except parachuting) · **aerobatics below 2 000 ft AGL**.\n\n- Sources: [603.01](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-603.01.html), [603.36](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-603.36.html), [603.37](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-603.37.html), [603.65](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-603.65.html), [603.66](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-603.66.html), [602.26](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-602.26.html).","p":["CPL"]},{"id":"LAW-87","card":"LAW","f":"kb/law/general-operating-rules.md","h":"Pebble","a":"pebble","c":["law-oprules"],"kd":"pebble","u":"law-general-operating-rules-pebble","md":"- PIC `responsible; reckless/negligent operation prohibited | emergency deviation only as necessary | pre-flight: WX-NOTAM-FUEL-W&B-PERF-ROUTE-AIRSPACE-RUNWAY-ALTERNATES (602.71)`\n- CLEAN AIRCRAFT CAR 602.11 `no takeoff with frost, ice or snow adhering to critical surfaces`\n- MIN ALT CAR 602.14 `built-up area/open-air assembly: 1000 ft above highest obstacle within 2000 ft horizontally + able to land without hazard | elsewhere 500 ft FROM person, vessel, vehicle, structure ≠ 500 AGL`\n- RIGHT OF WAY `distress first | converging: traffic on right | head-on: both right | overtaking: pass right | landing ACFT has ROW, lower may not cut in | ATC clearance ≠ end of see-and-avoid`\n- NIGHT CAR 101.01 `end of evening civil twilight → beginning of morning civil twilight ≠ sunset`\n- PAX `brief exits, belts, baggage, oxygen, smoking before takeoff (602.89) | cargo secured (602.86); within weight ≠ secured or within CG`\n- PAX WEIGHTS `adult M/X 206 summer / 212 winter lb | adult F 172 / 178 lb | child 2–11 75 lb | infant 30 lb | 1–4 passenger seats: actual, volunteered or estimated | actual wins`\n- PED `602.08: operator permission + must not affect aircraft systems`\n- FUEL DUMP `only if needed for safety + minimize danger to life and environment`\n- SFOC `special aviation event (not fly-in) | parachuting into controlled airspace, air route, built-up area | built-up TKOF/LDG off airport | aerial work below 602.14 | aerobatics <2000 AGL`","p":["PPL","CPL","IR"]},{"id":"LAW-88","card":"LAW","f":"kb/law/licences-medicals-privileges.md","h":"CPL-A requirements","a":"cpl-a-requirements","c":["law-lic"],"kd":"knowledge","u":"law-cpl-a-requirements","md":"- Age `18`; valid Cat 1 medical for CPL; `80h` CPL ground school; CPAER `60%` each subject + overall.\n- Experience: `200h` aeroplane TT incl `100 PIC` + `20 PIC XC`.\n- Post-PPL training: `65h` = `35 dual + 30 solo VFR`.\n- Dual: `5 night incl 2 XC` + `5 XC incl night-XC credit` + `20 instrument` max `10 sim/FTD`.\n- Solo: `25 h skill improvement` including XC of at least `300 NM total`, full-stop landings at `3 different aerodromes other than departure`, one at least `250 NM straight-line from departure`; plus `5 h solo night` including `10 takeoffs, circuits and landings`.\n- Current non-integrated rule effective `2025-12-17`: special Newfoundland alternative uses `150 NM` straight-line, with the same 300 NM total/3 full stops. Older 300 NM radius wording is not the current 421.30 rule. Integrated-course requirements must be checked separately. [STD 421.30(4)](https://tc.canada.ca/en/corporate-services/acts-regulations/list-regulations/canadian-aviation-regulations-sor-96-433/standards/standard-421-flight-crew-permits-licences-ratings-canadian-aviation-regulations-cars)\n- Skill: flight test within `12mo` before application. `T:` daylight restriction if night req not met.","p":["PPL","CPL"],"e":["CPL"]},{"id":"LAW-89","card":"LAW","f":"kb/law/licences-medicals-privileges.md","h":"Flight test / standard","a":"flight-test--standard","c":["law-lic"],"kd":"trap","u":"law-flight-test-standard","md":"- Admission: ID + licence + CPL medical proof + instructor letter ≤`30d` + ≥`75%` flying exp + written proof/deficiency review if applicable.\n- Stable VFR app: correct path/config/power/checklist/brief; ROD≤`1000 fpm`; speed `+10/-5`; small corrections; stable by `200 AGL` or overshoot.\n- `CONTEXT:` CPL flight-test evaluation criterion; not a CAR operating minimum and not the IFR stable-approach gate.\n- `T:` examiner wants safe PIC judgement, not rote manoeuvre.","p":[],"ph":["CPL"]},{"id":"LAW-90","card":"LAW","f":"kb/law/licences-medicals-privileges.md","h":"Privileges / ops","a":"privileges--ops","c":["law-lic","law-commercial"],"kd":"knowledge","u":"law-privileges-ops","md":"- CPL privileges depend on rating/medical/recency/aircraft/category/class/ops rules.\n- `T:` CPL≠703/704/705 authorization by itself. Hire/reward usually triggers operator/OC/ops rules unless exception.\n- PIC remains responsible for briefing, load, CG, fuel, documents, insurance.","p":["CPL"],"e":["CPL"]},{"id":"LAW-91","card":"LAW","f":"kb/law/licences-medicals-privileges.md","h":"Licence validity stack","a":"licence-validity-stack","c":["law-lic"],"kd":"knowledge","u":"law-licence-validity-stack","md":"- Required: licence/permit + ratings + medical + recency + aircraft class/type + operation authority.\n- `M:` `LICENCE-RATING-MEDICAL-RECENCY-AIRCRAFT-OPERATION`; PPL/CPL alone is insufficient.","p":["PPL","CPL"],"e":["PPL"]},{"id":"LAW-92","card":"LAW","f":"kb/law/licences-medicals-privileges.md","h":"PPL / CPL / commercial boundary","a":"ppl--cpl--commercial-boundary","c":["law-lic","law-commercial"],"kd":"knowledge","u":"law-ppl-cpl-commercial-boundary","md":"- `PPL-A:` PIC/co-pilot only for held ratings; generally no hire/reward except CAR 401.28 cases. `[CAR 401.26; 401.28(2)–(4)]`\n- Cost-share: owner/operator + non-commercial purpose + incidental passengers + reimbursement only for fuel/oil/aircraft fees. Employer/volunteer reimbursement has separate strict conditions.\n- `CPL-A:` PPL/VFR-OTT privileges; PIC single-pilot rated aeroplane or co-pilot in commercial service; instruction needs instructor qualification. Day-only restriction applies if issued without night requirement. `[CAR 401.30]`\n- Air transport and listed aerial work generally require an authorizing AOC. `[CAR 700.02]`\n- `M:` licence qualifies pilot; AOC authorizes service. `T:` equal cost split alone is insufficient.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"LAW-93","card":"LAW","f":"kb/law/licences-medicals-privileges.md","h":"Licence → type requirements / Exigences licence → type","a":"licence--type-requirements--exigences-licence--type","c":["law-lic","law-type"],"kd":"knowledge","u":"q17-licence-type-licence-type","md":"| Label | English | Français |\n|---|---|---|\n| PPL(A) | 17 yr; 45 h TT; PPAER ≥60%; medical Cat 1/3 | 17 ans; 45 h total; PPAER ≥60 %; médical cat. 1/3 |\n| CPL(A) | 18 yr; 200 h aeroplane; 100 PIC incl 20 XC PIC; 65 h post-PPL training (35 dual + 30 solo); CPAER ≥60%; Cat 1 | 18 ans; 200 h avion; 100 h CDB dont 20 en navigation; 65 h après PPL (35 double + 30 solo); CPAER ≥60 %; cat. 1 |\n| ATPL(A) | 21 yr; 1,500 h total; ≥900 aeroplane; ≥250 PIC/PICUS (max 100 PICUS); 100 night; 75 instrument; XC sub-minima; SAMRA + SARON + INRAT ≥70%; Group 1 IR; Cat 1 | 21 ans; 1 500 h total; ≥900 avion; ≥250 CDB/CDB sous supervision (max 100 supervisées); 100 nuit; 75 instruments; détails navigation; SAMRA + SARON + INRAT ≥70 %; IFR G1; cat. 1 |\n| ME class / Classe multimoteur | No fixed training-hour minimum; ME flight test; class rating is not an individual type rating | Pas d'heures de formation minimales fixes; test multimoteur; classe ≠ qualification de type individuelle |\n| Group 1 IR / IFR G1 | 50 h PIC cross-country + 40 h instrument (≤20 approved ground); INRAT ≥70% + flight test | 50 h nav CDB + 40 h instruments (≤20 entraîneur approuvé); INRAT ≥70 % + test en vol |\n| HP individual type / Type HP | ≥200 h aeroplane; type-specific ground/flight training; qualifying flight within 12 months | ≥200 h avion; formation sol/vol propre au type; vol de qualification dans les 12 mois |\n| Two-crew type / Type 2 pilotes | ≥250 h aeroplane (integrated-course exception); type training; IATRA ≥70% within 24 mo OR qualifying SAMRA+SARON/ATPL route; PPC/check for type | ≥250 h avion (exception cours intégré); formation type; IATRA ≥70 % dans les 24 mois OU voie SAMRA+SARON/ATPL admissible; PPC/vérif. du type |","p":[],"ph":["CPL","IR"]},{"id":"LAW-94","card":"LAW","f":"kb/law/licences-medicals-privileges.md","h":"Flight training units — 406.02 / 406.03","a":"flight-training-units--40602--40603","c":["law-lic"],"kd":"knowledge","u":"law-ftu-406-02-03-operator-certificate","md":"- `R` 406 covers flight training services toward: aeroplane PPL, CPL, land/sea rating, instructor (incl. aerobatic), IR, multi-engine, night, VFR OTT, recreational permit, aerobatic experience (similar lists for helicopter, glider, balloon, gyroplane, ultra-light).\n- `R` Flight training service with aeroplane or helicopter in Canada → **FTU operator certificate** + its conditions and ops specs.\n- `R` Exceptions, no FTU certificate: private operator or AOC holder (ACFT on AOC), training **not** toward recreational permit / PPL / CPL / instructor rating · trainee is **owner or owner's family** · director of owning corporation (not toward permit/PPL) · ACFT from an arm's-length person (not toward permit/PPL).\n- `R` Arm's-length case: instructor notifies Minister in writing (trainee, ACFT registration, training type, location, instructor licence) **before** training, **≤10 working days** after any change, and at end.\n- `T` Owner/family exception covers **any** licence; corporation-director and arm's-length exceptions exclude **permit and PPL** training.\n\n- Sources: [406.02](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-406.02.html), [406.03](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-406.03.html).","p":["CPL"]},{"id":"LAW-95","card":"LAW","f":"kb/law/licences-medicals-privileges.md","h":"Pebble","a":"pebble","c":["law-lic"],"kd":"pebble","u":"law-licences-medicals-privileges-pebble","md":"- VALIDITY `LICENCE-RATING-MEDICAL-RECENCY-AIRCRAFT-OPERATION`\n- CPL-A `age 18 | Cat 1 | 80 h ground school | CPAER 60% each subject + overall | 200 h TT incl 100 PIC + 20 PIC XC | 65 h post-PPL = 35 dual + 30 solo | dual: 5 night incl 2 XC, 5 XC, 20 instrument (max 10 sim) | solo: 300 NM XC with 3 full stops, one ≥250 NM straight-line; 5 h night with 10 TKOF/LDG | flight test within 12 mo`\n- PPL-A `no hire/reward except CAR 401.28 cases | cost-share: owner/operator + non-commercial purpose + incidental passengers + fuel/oil/aircraft fees only | equal split alone insufficient`\n- CPL-A `licence qualifies pilot; AOC authorizes service | CPL ≠ 703/704/705 authorization | day-only if issued without night requirement`\n- FLIGHT TEST `instructor letter ≤30 d | stable VFR approach: ROD ≤1000 fpm, speed +10/−5, stable by 200 AGL or overshoot (test criterion, not a CAR minimum)`\n- FTU `aeroplane/heli training service → FTU certificate | no cert: owner/family any licence; director or arm's-length not permit/PPL (notify Minister ≤10 working days of change); AOC/private operator not permit/PPL/CPL/instructor`","p":["PPL","CPL"]},{"id":"LAW-96","card":"LAW","f":"kb/law/medical-fitness.md","h":"Fitness / alcohol / drugs","a":"fitness--alcohol--drugs","c":["law-medical"],"kd":"knowledge","u":"law-fitness-alcohol-drugs","md":"- No crew duty when unfit; no impairing drugs; no alcohol within `12 h` or while affected. `[CAR 602.02–602.03]`\n- `T:` legal medication≠fit to fly; self-ground if performance may be impaired.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"LAW-97","card":"LAW","f":"kb/law/medical-fitness.md","h":"Medical category / validity — aeroplane memory","a":"medical-category--validity--aeroplane-memory","c":["law-medical"],"kd":"knowledge","u":"law-medical-category-validity-aeroplane-memory","md":"| Privilege | Medical | Typical validity |\n|---|---|---|\n| PPL | Category `3` or valid Cat `1` | `<40`: `60 mo`; `40+`: `24 mo` |\n| CPL hire/reward | Category `1` | `12 mo`; reduced to `6 mo` if age `≥40` AND single-pilot with passengers, OR age `≥60` |\n\n- Medical validity is calculated from the first day of the month following the medical examination/declaration. `[CAR 404.04]`\n- CPL holder may exercise PPL privileges while within the applicable PPL medical-validity period. `[CAR 401.30; STD 421.30]`\n- `T:` licence document does not expire like medical privileges do.","p":["PPL","CPL"],"e":["PPL"]},{"id":"LAW-98","card":"LAW","f":"kb/law/medical-fitness.md","h":"Pebble","a":"pebble","c":["law-medical"],"kd":"pebble","u":"law-medical-fitness-pebble","md":"- FITNESS CAR 602.02–.03 `no duty when unfit | no alcohol within 12 h or while affected | legal medication ≠ fit to fly`\n- MEDICAL `PPL: Cat 3 (or Cat 1), <40 = 60 mo, 40+ = 24 mo | CPL hire/reward: Cat 1, 12 mo; 6 mo if ≥40 AND single-pilot with passengers, OR ≥60 | validity from first day of month following the exam (404.04) | licence document ≠ medical validity`","p":["PPL","CPL"]},{"id":"LAW-99","card":"LAW","f":"kb/law/night-vfr-ott.md","h":"Twilight · time zones · DST / Crépuscule · fuseaux · heure avancée","a":"twilight--time-zones--dst--crépuscule--fuseaux--heure-avancée","c":["law-night","law-oprules","nav-dr"],"kd":"knowledge","u":"fx-twilight-time-zones-dst-cr-puscule-fuseaux-h","md":"| Label | English | Français |\n|---|---|---|\n| 4 min/degree | Earth rotates 360°/24h = 15°/h = 4 min per degree LONGITUDE. 1′ longitude = 4 seconds of time. | Rotation terrestre : 360°/24h = 15°/h = 4 min par degré de LONGITUDE. 1′ de longitude = 4 secondes de temps. |\n| Twilight chart | Read date and latitude; chart gives time at the time-zone STANDARD meridian. Check chart basis first. | Lire date et latitude; le graphique donne l’heure au méridien NORMAL du fuseau. Vérifier la référence. |\n| WEST + / EAST − | Relative to chart reference meridian: WEST add 4 min/degree; EAST subtract. Applies to morning AND evening twilight. | Par rapport au méridien de référence : OUEST ajouter 4 min/degré; EST soustraire. Matin ET soir. |\n| Workflow / Méthode | Chart → longitude correction → local STANDARD time → +1h if DST → UTC if required. Do not correct a location-specific result twice. | Graphique → correction longitude → heure NORMALE locale → +1h si heure avancée → UTC au besoin. Ne pas corriger deux fois un résultat déjà localisé. |\n| Example / Exemple | Training: chart 18:00 at 75°W; location 73°30′W = 1.5° east. Subtract 6 min →17:54 EST →18:54 EDT; both =22:54Z. | Exercice : graphique 18:00 à 75°O; lieu 73°30′O = 1,5° à l’est. −6 min →17:54 HNE →18:54 HAE; les deux =22:54Z. |\n| Newfoundland / Terre-Neuve | NST UTC−3:30 (meridian 52°30′W); NDT UTC−2:30 where observed. | HNT UTC−3:30 (méridien 52°30′O); HAT UTC−2:30 si appliquée. |\n| Atlantic / Atlantique | AST UTC−4 (60°W); ADT UTC−3 where observed. | HNA UTC−4 (60°O); HAA UTC−3 si appliquée. |\n| Eastern / Est | EST UTC−5 (75°W); EDT UTC−4. Montréal uses EST/EDT. | HNE UTC−5 (75°O); HAE UTC−4. Montréal utilise HNE/HAE. |\n| Central / Centre | CST UTC−6 (90°W); CDT UTC−5 where observed. | HNC UTC−6 (90°O); HAC UTC−5 si appliquée. |\n| Mountain / Rocheuses | MST UTC−7 (105°W); MDT UTC−6 where observed. | HNR UTC−7 (105°O); HAR UTC−6 si appliquée. |\n| Pacific / Pacifique | PST UTC−8 (120°W); PDT UTC−7 are conventional standard/daylight offsets. Apply the aerodrome’s published factor; local observance may differ. | HNP UTC−8 (120°O); HAP UTC−7 sont les décalages conventionnels normal/avancé. Appliquer le facteur publié de l’aérodrome; régime local variable. |\n| UTC → local | Local = UTC + signed offset. 18:00Z →13:00 EST /14:00 EDT. | Locale = UTC + décalage signé. 18:00Z →13:00 HNE /14:00 HAE. |\n| Local → UTC | UTC = local − signed offset. 20:30 EDT +4h =00:30Z NEXT day. | UTC = locale − décalage signé. 20:30 HAE +4h =00:30Z LENDEMAIN. |\n| DST / Heure avancée | Where seasonal DST applies: +1h in spring, −1h in autumn. UTC does not change. Usual rule: second Sunday March / first Sunday November at 02:00 local. | Si changement saisonnier : +1h au printemps, −1h à l’automne. UTC ne change pas. Règle habituelle : deuxième dimanche mars / premier dimanche novembre à 02:00 locale. |\n| 2026 · Montréal | Seasonal changes: 8 March / 1 November 2026. Confirm local observance rather than assigning a zone from longitude alone. | Changements saisonniers : 8 mars / 1er novembre 2026. Vérifier régime local; la longitude seule ne détermine pas le fuseau légal. |\n| CFS UTC−5(4) | Normal UTC−5; daylight UTC−4. No parentheses may indicate a year-round offset; follow REF entry. | Heure normale UTC−5; avancée UTC−4. Sans parenthèses peut indiquer décalage annuel; suivre rubrique REF. |\n| CFS ‡ | 10–04Z‡ →09–03Z during DST: subtract ONE hour from the listed UTC schedule. This maintains the same local clock hours. | 10–04Z‡ →09–03Z en heure avancée : soustraire UNE heure à l’horaire UTC publié. Les heures locales restent identiques. |\n| CFS explicit DT | If separate DT hours are printed, use them. If no ‡ or DT schedule, do not invent a seasonal UTC shift. | Si horaire DT distinct, l’utiliser. Sans ‡ ni horaire DT, ne pas inventer un décalage saisonnier UTC. |\n| Night / Nuit | Canadian night: end of evening civil twilight to beginning of morning civil twilight. Not simply sunset→sunrise. | Nuit canadienne : fin du crépuscule civil du soir au début du crépuscule civil du matin. Pas simplement coucher→lever du Soleil. |\n| Exceptions | Civil time is jurisdiction-specific. Use current CFS REF and authoritative local rules; standard/daylight pairs are not a claim that every region changes clocks. | Heure civile propre à la juridiction. Utiliser REF CFS courant et règles locales; les paires normale/avancée ne signifient pas que toutes les régions changent d’heure. |","p":["PPL","CPL"]},{"id":"LAW-100","card":"LAW","f":"kb/law/night-vfr-ott.md","h":"Night definition","a":"night-definition","c":["law-night","law-oprules"],"kd":"knowledge","u":"law-night-definition","md":"- `Night` = period from end of evening civil twilight to beginning of morning civil twilight. `[CAR 101.01]`\n- `T:` sunset is not the legal start of night; use official twilight data.","p":["PPL","CPL"]},{"id":"LAW-101","card":"LAW","f":"kb/law/night-vfr-ott.md","h":"VFR OTT","a":"vfr-ott","c":["law-night","law-airspace"],"kd":"knowledge","u":"law-vfr-ott","md":"- Day cruise only; vertical cloud separation `≥1000 ft`; between layers at least `5000 ft`; flight visibility `≥5 SM`; destination weather and rating/equipment conditions apply. `[CAR 602.116; 401.44–401.45; 605.15]`\n- `T:` PPL alone does not automatically include VFR OTT privilege.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"LAW-102","card":"LAW","f":"kb/law/occurrence-reporting-tsb.md","h":"TSB occurrence reporting — AIM GEN 3.3–3.4","a":"tsb-occurrence-reporting--aim-gen-3334","c":["law-report"],"kd":"knowledge","u":"law-tsb-occurrence-reporting-aim-gen-3-3-3-4","md":"| CAVE | Rule / trap |\n|---|---|\n| `R` accident | Fatal/serious injury from ACFT operation; significant structural DMG affecting strength/performance/flight characteristics (specified minor/engine-only exclusions); missing/inaccessible ACFT. [AIM GEN 3.3](https://tc.canada.ca/en/aviation/publications/transport-canada-aeronautical-information-manual-tc-aim) |\n| `R` incident scope | Mandatory listed incidents for **MCTOW >2,250 kg OR ACFT under Part VII AOC**; **not** every private light-ACFT malfunction. |\n| `R` examples | ENG failure/shutdown · fire/smoke · control difficulties · RWY excursion/gear-up · crew incapacitation · depressurization/emerg DESC · fuel divert/priority · wrong fuel · collision/SEP loss · emergency priority · dropped slung load · dangerous goods release. |\n| `R` who/when | Owner/operator/PIC/crew/ATS direct knowledge → TSB **ASAP by quickest means**; remaining info **as available ≤30d**. |\n| `R` evidence | Preserve; safety measures permitted, document/advise TSB as practicable. |\n| `T` | Accident duty ≠ incident threshold; **2,250 kg** applies listed incident class, not accidents. |\n\n`M:` **TSB accident: fatal/serious/structural DMG/missing | incident >2,250kg OR Part VII | ASAP fastest; balance ≤30d | preserve evidence**.","p":["PPL","CPL"],"e":["PPL"]},{"id":"LAW-103","card":"LAW","f":"kb/law/occurrence-reporting-tsb.md","h":"Pebble","a":"pebble","c":["law-report"],"kd":"pebble","u":"law-occurrence-reporting-tsb-pebble","md":"- TSB `accident: fatal/serious injury, significant structural damage, missing/inaccessible ACFT | listed incidents: MCTOW >2,250 kg OR Part VII AOC | report ASAP by quickest means; remaining info ≤30 d | preserve evidence | 2,250 kg applies to incidents, not accidents`","p":["PPL","CPL"]},{"id":"LAW-104","card":"LAW","f":"kb/law/oxygen-requirements.md","h":"Oxygen / Oxygène — CAR 605.31–32","a":"oxygen--oxygène--car-6053132","c":["law-oxygen"],"kd":"knowledge","u":"law-oxygen-oxyg-ne-car-605-31-32","md":"| Label | English | Français |\n|---|---|---|\n| 10–13 / 30 | Cabin-pressure altitude >10,000 to ≤13,000 ft: crew USE oxygen after 30 min. | Altitude-pression cabine >10 000 à ≤13 000 ft : équipage UTILISE oxygène après 30 min. |\n| Supply / Réserve | Unpressurized: supply for ALL crew +10% passengers (at least 1 passenger), for time beyond 30 min in that band. | Non pressurisé : réserve pour TOUT équipage +10 % passagers (au moins 1 passager), pour durée au-delà de 30 min dans cette tranche. |\n| Above / Au-dessus 13,000 | All aboard USE oxygen throughout. Unpressurized supply: all aboard, entire time; air transport service minimum 1 hour. | TOUS utilisent oxygène tout le temps. Réserve non pressurisé : tous, durée entière; service de transport aérien : minimum 1 h. |\n| Boundaries / Seuils | Exactly 13,000 ft remains in the 30-min band. At 13,100 ft, no 30-min grace. Cabin pressure altitude, not height AGL. | Exactement 13 000 ft reste dans tranche 30 min. À 13 100 ft, aucun délai. Altitude-pression cabine, pas hauteur AGL. |\n| Pressurized / Pressurisé | Size emergency supply for worst-point decompression, descent profile and suitable landing aerodrome: use 605.31(2) table and notes; do not reuse unpressurized quantities. | Réserve d’urgence selon dépressurisation au point critique, profil de descente et aérodrome convenable : tableau et notes 605.31(2); quantités différentes du non pressurisé. |\n| Pilot mask / Masque | Pilot at controls: mask required at/above FL250 without quick-donning masks; above FL410 with quick-donning masks. | Pilote aux commandes : masque à FL250 ou plus sans masque à pose rapide; au-dessus FL410 avec masque à pose rapide. |","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"LAW-105","card":"LAW","f":"kb/law/oxygen-requirements.md","h":"Pebble","a":"pebble","c":["law-oxygen"],"kd":"pebble","u":"law-oxygen-requirements-pebble","md":"- OXYGEN CAR 605.31–.32 `>10,000 to ≤13,000 ft cabin: crew USE after 30 min | >13,000 ft: all aboard USE throughout | unpressurized supply 10–13: all crew + 10% passengers (min 1) for time beyond 30 min | exactly 13,000 stays in the 30-min band | cabin pressure altitude, not AGL | mask: at/above FL250 without quick-donning; above FL410 with`","p":["PPL","CPL"]},{"id":"LAW-106","card":"LAW","f":"kb/law/private-operators-604.md","h":"Definitions, operational control, crew designation — 604.01 / .25 / .26","a":"definitions-operational-control-crew-designation--60401--25--26","c":["law-604"],"kd":"knowledge","u":"law-604-definitions-operational-control","md":"| Term | 604 meaning |\n|---|---|\n| Main base | personnel + ACFT + facilities, principal place of business |\n| Sub-base | personnel + ACFT; operational control exercised there under the operator's system |\n| Flight deck duty time | time at a flight crew position during flight time |\n| Special authorization | Minister's authorization (604.05(2)) for a Div IV activity or a 604.74(1) requirement |\n| Incorporated docs | \"should\"/\"must\" → \"shall\"; \"operator\" → \"private operator\"; \"authority\" → \"Minister\" |\n\n- `R` Operational control system, sized to the operation, with procedures that ensure: 604 requirements met · W&B within AFM limits · **names of persons on board recorded before each flight** · SAR notified in time if overdue/missing.\n- `R` Choose one dispatch model: **pilot self-dispatch** (flight planning, when crew reports DEP/ARR to operator, method to confirm safe ARR at unattended A/D in VFR or IFR FPL cancelled before LDG) **or co-authority dispatch** (adds flight following, flight watch, OFP approval/recording by PIC + dispatcher, PIC gets MET + OFP copy + can call dispatcher before TKOF).\n- `R` Operational control docs kept **≥180 days** after the flight.\n- `R` Designate PIC each flight; PIC + SIC if ≥2 flight crew; record names, keep **≥180 days**.\n\n- Sources: [604.01](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.01.html), [604.25](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.25.html), [604.26](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.26.html).","p":["CPL"]},{"id":"LAW-107","card":"LAW","f":"kb/law/private-operators-604.md","h":"Checklist, aircraft operating manual, operational flight data sheet — 604.36 / .37 / .38","a":"checklist-aircraft-operating-manual-operational-flight-data-sheet--60436--37--38","c":["law-604"],"kd":"knowledge","u":"law-604-checklist-aom-flight-data-sheet","md":"- `R` Checklist (602.60(1)(a)), or the part needed, given to **every crew member**; each crew member follows it.\n- `R` Aircraft operating manual is **optional** (*may*). If made: procedures consistent with AFM · AFM performance data + limitations included and marked as AFM requirements **if AFM not on board** · operator SOPs, if any · identifies the ACFT.\n- `R` No TKOF without an **operational flight data sheet**: date · nationality + registration marks · PIC name · DEP / DEST / ALTN (if any) A/D · estimated flight time · fuel endurance · fuel weight on board · zero fuel weight · TKOF weight + CG · persons on board · proposed DEP time · ETA.\n- `R` After each flight PIC records flight time, DEP time, ARR time, ARR A/D. Operator keeps copy **≥180 days**.\n- `T` 604 = operational flight **data sheet**; 702 / 703 = operational flight **plan** meeting Commercial Air Service Standards.\n\n- Sources: [604.36](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.36.html), [604.37](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.37.html), [604.38](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.38.html).","p":["CPL"]},{"id":"LAW-108","card":"LAW","f":"kb/law/private-operators-604.md","h":"Cabin safety, fuelling with passengers, safety features card — 604.82–.84, .86","a":"cabin-safety-fuelling-with-passengers-safety-features-card--6048284-86","c":["law-604"],"kd":"knowledge","u":"law-604-cabin-safety-fuelling-safety-card","md":"- `R` Before TKOF or surface movement with PAX: belts fastened (infants held, child restraints secured) · seat backs upright · chair tables + carry-on stowed · no unsuitable PAX in an emergency exit seat. Before LDG: PAX **directed** to do the same; move unsuitable exit-row PAX.\n- `R` Emergency (time permitting): PIC directs the above + review safety features card + brace until ACFT stops + life preservers on if over water. Seat belt sign on in flight → belts + carry-on.\n- `R` Reclined seat allowed for PAX certified by a physician unable to sit upright: not restricting evacuation · not next to / in front of an exit row · seat behind vacant.\n- `R` Fuelling with PAX on board / boarding / deplaning (604.83), key conditions: two-way comm ground supervisor ↔ person on board trained in evacuation for the type · no GPU connect/disconnect, no ACFT combustion heater, no battery change or charger · no HF radio / WX radar unless AFM procedure · **suspend if lightning within 8 km** of the A/D · emergency lighting armed/on · no smoking signs on, no ignition source · **two exits** (one = boarding door) and their escape routes clear · person authorized to suspend fuelling on board · evacuation means at boarding door · boarding door open (or closed for climate only if crew on board, door not locked, inward-opening or fully openable without moving stairs).\n- `R` Fuelling with an **engine running** + PAX (604.84): all 604.83 conditions + AFM allows that engine as an APU + **propeller brake set**.\n- `R` Safety features card at each PAX seat **before** the briefing, type-specific: belts/harness · brace (each seat type, PAX with infant) · exits (incl. unusable in ditching) · oxygen (own mask first) · life preservers (adult, child ≥2, infant; when to inflate) · smoking · flotation / rafts. >19 PAX seats adds baggage stowage, seats/tables, floor path markings, route away from ACFT, floating attitude. No flight attendant required → card also shows location + access of emergency equipment.\n\n- Sources: [604.82](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.82.html), [604.83](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.83.html), [604.84](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.84.html), [604.86](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.86.html).","p":["CPL"]},{"id":"LAW-109","card":"LAW","f":"kb/law/private-operators-604.md","h":"Delayed reporting, time with no duties, controlled rest — 604.103 / .104 / .106","a":"delayed-reporting-time-with-no-duties-controlled-rest--604103--104--106","c":["law-604"],"kd":"knowledge","u":"law-604-delayed-reporting-time-off-controlled-rest","md":"- `R` Delay of reporting time **>3 h**, crew notified **within 12 h before** original report **and ≥1 h before** leaving the rest facility → FDP starts **3 h after original** reporting time.\n- `R` Time with no assigned duties, one of: **≥36 consecutive h in 7 consecutive days** · or **≥3 consecutive calendar days in 17 consecutive days**.\n- `R` Controlled rest on flight deck only with an operator program (guidelines, fatigue principles, procedures) + trained participants. PIC decides if conditions, flight length and crew state allow; briefs order, duration, wake-up triggers, control transfer, FA duties.\n- `R` Supervising pilot: does the resting pilot's duties · **cruise only, done ≥30 min before top of descent** · **≤45 min** · resting pilot awake **≥15 min** before resuming duties (except abnormal/emergency) · gives operational briefing after. Both stay on the flight deck.\n- `T` 700.52 delay rule differs (see `law-fatigue`).\n\n- Sources: [604.103](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.103.html), [604.104](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.104.html), [604.106](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.106.html).","p":["CPL"],"e":["CPL"]},{"id":"LAW-110","card":"LAW","f":"kb/law/private-operators-604.md","h":"Maintenance authority, validity periods, manual distribution, SMS duties — 604.128 / .139 / .198 / .205","a":"maintenance-authority-validity-periods-manual-distribution-sms-duties--604128--139--198--205","c":["law-604"],"kd":"knowledge","u":"law-604-maintenance-validity-manual-sms","md":"- `R` Maintenance or elementary work only by a person who has the 604.182(1) training (+ for elementary work: done it once supervised by an AME or approved training organization) **or** under a written agreement (tasks, conditions; operator responsible). Agreement kept **2 years**. Servicing staff meet 604.182(2) training.\n- `R` Validity expires **1st day of the month after**: **37th** month → emergency procedures training (604.169(2), 604.179(z)(viii)–(ix)) and high-altitude indoctrination · **13th** month → all other training · **25th** month → competency check or PPC.\n- `R` Renewed in the **last 90 days** → validity extended **36 / 12 / 24 months** respectively. Minister extends **≤60 days** if asked during validity and no reasonable chance to renew in those last 90 days.\n- `R` Operations manual + every amendment to all personnel involved; holders keep it current and accessible on duty. Alternative: up-to-date parts kept **in each aircraft** instead of a crew copy.\n- `R` SMS: personnel report to the operations manager any SMS issue (deficiencies, hazards, incidents, accidents) and share aviation-safety information with service partners.\n\n- Sources: [604.128](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.128.html), [604.139](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.139.html), [604.198](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.198.html), [604.205](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-604.205.html).","p":["CPL"]},{"id":"LAW-111","card":"LAW","f":"kb/law/private-operators-604.md","h":"Pebble","a":"pebble","c":["law-604"],"kd":"pebble","u":"law-604-pebble","md":"- 604 OPS CONTROL `self-dispatch OR co-authority | names on board recorded before flight | SAR alert | docs + PIC/SIC record ≥180 d`\n- 604 DOCS `checklist to every crew | AOM optional | flight data sheet before TKOF, PIC adds times after, ≥180 d | 604 data sheet ≠ 702/703 OFP`\n- 604 FUELLING PAX `trained person on board ↔ ground | lightning ≤8 km → suspend | 2 exits clear | engine running only if AFM APU use + prop brake`\n- 604 FATIGUE `delay >3 h, notified ≤12 h before + ≥1 h before leaving rest → FDP from original +3 h | off: 36 h/7 d OR 3 days/17 d | controlled rest cruise, ≤45 min, end ≥30 min before TOD, awake ≥15 min`\n- 604 VALIDITY `emerg + high-alt 37th mo | other training 13th mo | PPC/CC 25th mo | renew last 90 d → +36/12/24 mo | Minister ≤60 d`","p":["CPL"]},{"id":"LAW-112","card":"LAW","f":"kb/law/recency.md","h":"Recency","a":"recency","c":["law-recency"],"kd":"knowledge","u":"law-recency","md":"| Privilege | Requirement |\n|---|---|\n| general `5 y` | PIC/co-pilot in preceding `5 years`, or prescribed review + exam `[CAR 401.05(1)]` |\n| recurrent `24 mo` | approved recurrent activity, recorded `[CAR 401.05(2); STD 421.05]` |\n| passengers `6 mo` | `5 TO + 5 LDG`, same category/class; night flight requires all `5+5` at night `[CAR 401.05(2)(b)]` |\n| instrument | qualifying test/check within `24 mo`; following first day of seventh month after test/check: `6 approaches in preceding 6 mo` to specified minima; no separate `6 h` requirement; retain records `3 y` [CAR 401.05(3)–(3.2)](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-401.05.html) |\n\n- `T:` medical, general, passenger and instrument recency are separate clocks; solo legality≠passenger legality.\n- Instrument recency detail: [IFR rules, privileges & recency](../ifr/rules-privileges.md#instrument-rating-recency).","p":["PPL","CPL"],"e":["PPL"]},{"id":"LAW-113","card":"LAW","f":"kb/law/recency.md","h":"Recency clocks / Horloges de récence","a":"recency-clocks--horloges-de-récence","c":["law-recency"],"kd":"knowledge","u":"q17-recency-clocks-horloges-de-r-cence","md":"| Label | English | Français |\n|---|---|---|\n| General flight / Vol général · 401.05(1) | 5 years PIC/SIC or permitted alternative | 5 ans CDB/copilote ou équivalent autorisé |\n| General recurrent / Périodique générale · 401.05(2) | 24 months: qualifying recurrent activity | 24 mois : activité périodique admissible |\n| Passengers day / Pax jour · 401.05(2) | 5 takeoffs + 5 landings in 6 months, category/class | 5 décollages + 5 atterrissages en 6 mois, catégorie/classe |\n| Passengers night / Pax nuit · 401.05(2) | 5 NIGHT takeoffs + 5 NIGHT landings in 6 months | 5 décollages NUIT + 5 atterrissages NUIT en 6 mois |\n| IR qualifying check / IFR contrôle · 401.05(3) | 24 months: flight test / IPC / qualifying PPC or CC with instrument portion | 24 mois : test / IPC / PPC ou VC admissible avec composante instruments |\n| IR approaches / IFR approches · 401.05(3.1) | Following first day of 7th month: 6 approaches within preceding 6 months; NO 6-h requirement | Après 1er jour du 7e mois : 6 approches sur les 6 mois précédents; PAS de règle des 6 h |\n| 703 / 704 crew / Équipage · 703.88 / 704.108 | 3 takeoffs + 3 landings within 90 days (with authorized alternatives) | 3 décollages + 3 atterrissages sur 90 jours (options autorisées) |\n| 705 crew / Équipage · 705.106 | 90 days: 3 T/O + LDG plus 1 sector, OR 5 sectors, OR qualifying training | 90 jours : 3 décollages/atterrissages + 1 secteur, OU 5 secteurs, OU formation admissible |\n| Cat 1 commercial / Médical cat. 1 · 404.04 | 12 months; 6 if age ≥40 single-pilot with passengers or age ≥60 | 12 mois; 6 si ≥40 ans monopilote avec passagers ou ≥60 ans |","p":["PPL","CPL"],"e":["PPL"]},{"id":"LAW-114","card":"LAW","f":"kb/law/recency.md","h":"Pebble","a":"pebble","c":["law-recency"],"kd":"pebble","u":"law-recency-pebble","md":"- RECENCY CAR 401.05 `5 y: PIC/co-pilot, or review + exam | 24 mo: recurrent activity | passengers: 5 TKOF + 5 LDG in 6 mo, same category/class; night passengers → all at night | instrument: test/check within 24 mo, then 6 approaches in preceding 6 mo; no 6 h rule | separate clocks; solo legality ≠ passenger legality`","p":["PPL","CPL"]},{"id":"LAW-115","card":"LAW","f":"kb/law/required-equipment.md","h":"Day VFR equipment — power-driven","a":"day-vfr-equipment--power-driven","c":["law-equip"],"kd":"knowledge","u":"law-day-vfr-equipment-power-driven","md":"- Altimeter (`sensitive/adjustable` in controlled), ASI, independent magnetic direction, required engine/prop gauges, each main-tank fuel quantity, retractable-gear indication and required radio. `[CAR 605.14]`\n- `T:` GPS/tablet does not replace required instruments.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"LAW-116","card":"LAW","f":"kb/law/required-equipment.md","h":"Night VFR equipment — PAX / commercial","a":"night-vfr-equipment--pax--commercial","c":["law-equip","law-night"],"kd":"knowledge","u":"law-night-vfr-equipment-pax-commercial","md":"| CAVE | Rule / trap |\n|---|---|\n| `R` ALL night | `605.14(c–n)` day VFR EQPT + sensitive ALTM + turn/slip or turn coordinator¹ + electrical supply + spare fuses **≥50%** of accessible installed fuses **per rating**. [CAR 605.16(1)(a–e)](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.16.html) |\n| `R` NAV/light | Stabilized magnetic DG **if A/D not visible**; non-magnetic direction source **in NDA**; instrument illumination + position/anti-collision lights. [605.16(1)(f–k)](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.16.html) |\n| `R` PAX | **LDG light required when carrying PAX** under 605.16(1)(j); not exclusively commercial. [605.16(1)(j)](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.16.html) |\n| `R` commercial | Night VFR **Part VI Subpart 4 or Part VII Subparts 2–5** → **attitude indicator + VSI + ASI-system anti-ice means + OAT gauge** *in addition to 605.16(1)*; PAX **not** prerequisite. [605.16(4)](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.16.html) |\n| `R` 703 night | Air taxi ACFT at night → **≥1 LDG light**, whether PAX carried or not; in actual icing conditions → ice-formation illumination/detection means. [703.64(2)](https://www.laws-lois.justice.gc.ca/eng/regulations/sor-96-433/page-94.html) |\n| `R` 703 SE PAX | **SE + PAX + IFR or night VFR prohibited UNLESS** AOC expressly authorized **AND** STD 723.22 complied with. [703.22](https://laws.justice.gc.ca/eng/regulations/SOR-96-433/page-93.html) |\n| `R` 723 SE type | Eligible SE aeroplane: factory-built **turbine**, OR turbine + gearbox conversion under TC-approved **STC** (effective **SEP 1 2026**); prescribed ENG reliability + pilot training. **Piston SE not eligible under standard**. [STD 723.22(1)](https://tc.canada.ca/en/corporate-services/acts-regulations/list-regulations/canadian-aviation-regulations-sor-96-433/standards/standard-723-air-taxi-aeroplanes-canadian-aviation-regulations-cars) |\n| `R` 723 SE EQPT | **2 independently powered attitude indicators + 2 independent generating sources**; auto/continuous ignition; ENG chip detector; radar ALTM; compliant manual throttle/fuel-control redundancy; emergency O₂; nearest-suitable-A/D electronic NAV; emergency electrical supply for optimal glide DESC; **airborne WX radar if TS reasonably expected** (effective APR 10 2026). [STD 723.22(2)](https://tc.canada.ca/en/corporate-services/acts-regulations/list-regulations/canadian-aviation-regulations-sor-96-433/standards/standard-723-air-taxi-aeroplanes-canadian-aviation-regulations-cars) |\n| `T` | **Night VFR ≠ IFR EQPT**; `605.16(4)` commercial supplements **do not depend on PAX**; `703.22` SE PAX operation requires separate **AOC AUTH**, not merely extra EQPT. |\n\n- `¹` Qualifying **third attitude indicator** may permit slip-skid indicator substitution under 605.16(2); check exact attitude capability.\n- `M:` **Night=605.14(c–n)+ALTM+turn/slip+ELEC+spare fuses+DG/NDA conditional+instrument/ACFT lights | PAX→LDG light | COM VI-4/VII-2–5→AI+VSI+ASI anti-ice+OAT (PAX or not) | 703 night→LDG light+icing detect if icing | 703 SE PAX night→AOC AUTH+723.22 turbine/STC+special EQPT**.","p":["PPL","CPL"],"e":["CPL"]},{"id":"LAW-117","card":"LAW","f":"kb/law/required-equipment.md","h":"IFR equipment","a":"ifr-equipment","c":["law-equip","ifr"],"kd":"knowledge","u":"law-ifr-equipment","md":"- IFR requires the applicable 605.16 equipment plus attitude indicator, VSI, OAT gauge and the remaining equipment/nav/comm items in 605.18.\n- Equipment must be adequate for the route/procedure and serviceable.\n- `[CAR 605.18]`\n- `T:` “IFR-certified GPS installed” ≠ aircraft/procedure/current-database/RAIM/approval requirements all met.","p":["PPL","CPL","IR"]},{"id":"LAW-118","card":"LAW","f":"kb/law/required-equipment.md","h":"Power-driven aircraft equipment — CAR 602.60","a":"power-driven-aircraft-equipment--car-60260","c":["law-equip"],"kd":"knowledge","u":"law-602-60-operational-emergency-equipment","md":"- Before take-off (power-driven, not ultralight), carry: [CAR 602.60(1)]\n  - checklist or placards per AFM/POH limits;\n  - current charts + publications for route + probable diversion — if **VFR OTT, night VFR or IFR**;\n  - current **database** if IFR / VFR OTT / night VFR (604, 702–705) and database-dependent nav used;\n  - hand-held fire extinguisher in cockpit, suitable type, low toxic gas, reachable;\n  - timepiece showing h:min:s, reachable by each crew;\n  - flashlight per crew member at night;\n  - first aid kit.\n- Checklist must cover pre-start, pre-take-off, post-take-off, pre-landing, emergencies (fuel/hyd/elec/mech, instruments/controls, engine-inop). [CAR 602.60(2)–(3)]\n- `M:` `CHECK-CHARTS-DATA-FIRE-CLOCK-LIGHT-AID`.\n- `T:` charts/database requirement is triggered by IFR, VFR OTT or night VFR, not by day VFR.","p":["IR"]},{"id":"LAW-119","card":"LAW","f":"kb/law/required-equipment.md","h":"Equipment standards, serviceability; icing equipment — 605.06 / 605.30","a":"equipment-standards-serviceability-icing-equipment--60506--60530","c":["law-equip"],"kd":"knowledge","u":"law-605-06-equipment-serviceable-605-30-icing","md":"- `R` No TKOF (or permitting one) unless **required equipment** meets airworthiness standards **and is serviceable** and, where operations need it, **functioning** — except as allowed by 605.08 (unserviceable equipment), 605.09 (MEL) or 605.10.\n- `R` Icing reported or forecast on route → no TKOF or continuing unless PIC determines ACFT is **adequately equipped per its type-certificate airworthiness standards**, **or** current reports/PIREPs show icing no longer exists.\n- `T` \"Has de-icing boots\" ≠ certified for flight into known icing.\n\n- Sources: [605.06](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.06.html), [605.08](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.08.html), [605.09](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.09.html), [605.30](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-605.30.html).","p":["PPL","CPL"],"e":["CPL"]},{"id":"LAW-120","card":"LAW","f":"kb/law/required-equipment.md","h":"Pebble","a":"pebble","c":["law-equip"],"kd":"pebble","u":"law-required-equipment-pebble","md":"- DAY VFR CAR 605.14 `altimeter (sensitive in controlled), ASI, magnetic direction, engine/prop gauges, fuel quantity each main tank, gear indication, required radio | GPS/tablet ≠ required instruments`\n- NIGHT VFR CAR 605.16 `day equipment + sensitive altimeter + turn/slip + electrical supply + spare fuses ≥50% per rating + DG if aerodrome not visible + instrument and aircraft lights | passengers → landing light | commercial (VI-4, VII-2–5) → AI + VSI + ASI anti-ice + OAT, passengers or not`\n- IFR CAR 605.18 `605.16 equipment + attitude indicator + VSI + OAT + nav/comm adequate for route | IFR GPS installed ≠ database/RAIM/approval met`\n- 703 `SE + passengers + IFR or night VFR prohibited unless AOC authorized AND Std 723.22 (turbine) | night VFR ≠ IFR equipment`\n- 602.60 `checklist · charts + database if IFR / VFR OTT / night VFR · extinguisher · timepiece h:m:s · flashlight at night · first aid`\n- 605.06 `required equipment airworthy + serviceable (+ functioning when needed), else 605.08/.09/.10`\n- 605.30 `icing reported/forecast → ACFT equipped per its type certificate OR reports say icing gone`","p":["PPL","CPL","IR"]},{"id":"LAW-121","card":"LAW","f":"kb/law/type-ratings-ppc-cc-crew-seats.md","h":"ACFT type ratings · HP / two-crew / IATRA / PPC — Oct 2026","a":"acft-type-ratings--hp--two-crew--iatra--ppc--oct-2026","c":["law-type"],"kd":"knowledge","u":"law-acft-type-ratings-hp-two-crew-iatra-ppc-oct-2026","md":"| CAVE | Rule / trap |\n|---|---|\n| `R` Blanket | Single-pilot **non-high-performance** aeroplanes → blanket rating with applicable class; otherwise individual type rating where required. |\n| `R` HP test | **Single-pilot** aeroplane per minimum-crew document AND **VNE ≥250 KIAS OR VSO ≥80 KIAS**; **OR** amateur-built aeroplane wing loading above AWM 549.103 threshold. [CAR 400.01](https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/section-400.01.html) |\n| `T` Complex ≠ HP | Complex = flaps + constant-speed PROP + retractable gear (except seaplane); complex, turbine-powered or pressurized ≠ automatically HP. |\n| `R` HP individual TYPE | **STD 421.40(3)(c):** type ground training + type FLT training + **≥200 h aeroplane pilot FLT time** + **qualifying FLT in 12 mo BEFORE rating application** supervised by TC Inspector or qualified person under 425.21(7)(a); **IATRA/PPC not stated as initial HP requirement**. |\n| `R` Two-crew individual TYPE | **Minimum crew ≥2 pilots** per type approval → type ground+FLT training + **≥250 h aeroplane pilot FLT time**, **OR** approved integrated ATP(A) course alternative (STD 421.40, effective 17 DEC 2025). |\n| `R` Two-crew knowledge | First PPL(A)/CPL(A) two-crew endorsement: **IATRA ≥70% within 24 mo** before application **OR SAMRA+SARON ≥70% each within 24 mo**; ATPL(A) holder meets knowledge; approved integrated ATP(A): ATP exams within **5 years** before application. |\n| `R` Two-crew skill | Type-specific **PPC within 12 mo before application** (Part VII / Minister-accepted); **approved AQP LOE** accepted; CAR 604 certificate holder: approved training/proficiency programme + **PPC or PCC under 604.143 within 12 mo**. [STD 421.40](https://tc.canada.ca/en/corporate-services/acts-regulations/list-regulations/canadian-aviation-regulations-sor-96-433/standards/standard-421-flight-crew-permits-licences-ratings-canadian-aviation-regulations-cars) |\n| `T` Three clocks | **IATRA 24 mo** = exam-to-first-rating application; **qualifying FLT/PPC 12 mo** = test-to-type-rating application; **operational PPC currency** = independent recurrent check, **not TYPE rating expiration**. |\n| `R` CAR 704 PPC transition | **Until 01 NOV 2026:** qualifying new PPC may use **24-mo exemption**; **on/after 01 NOV 2026:** no new 24-mo PPC; **standard 12 mo**. Existing PPC issued under 24-mo exemption keeps original validity per TC Bulletin 01/26. [TC ACP/AQPE Bulletin 01/26](https://tc.canada.ca/en/aviation/commercial-air-services/approved-check-pilot-acp-advanced-qualification-program-aqp/acp-aqpe-bulletins/approved-check-pilot-acp-advanced-qualification-program-aqp-evaluator-bulletin-no-01-26) |\n| `T` Operations | TYPE endorsement ≠ operator authorization, PPC, IR, recurrent training or flight crew recency. ATR/other two-crew turboprop uses two-crew path, not HP-speed shortcut. |","p":["PPL","CPL"]},{"id":"LAW-122","card":"LAW","f":"kb/law/type-ratings-ppc-cc-crew-seats.md","h":"Operate → seat → check / Exploiter → siège → contrôle","a":"operate--seat--check--exploiter--siège--contrôle","c":["law-type","law-commercial"],"kd":"knowledge","u":"q17-operate-seat-check-exploiter-si-ge-contr-le","md":"**LEGEND / LÉGENDE:** PIC = pilot-in-command / commandant de bord (CDB); SIC = second-in-command / copilote; PPC = pilot proficiency check / contrôle de la compétence du pilote; CC / VC = competency check / vérification de compétence; SE = single engine / monomoteur; ME = multi-engine / multimoteur; HP = high performance / hautes performances; IR = instrument rating / qualification IFR; TT = total time / heures totales. Validity in months (mo) / validité en mois.\n\n**604 · Private / Privé**\n\n- Aircraft applicability · Aéronefs (kg/lb · pax): **ANY ONE (604.02):** large aeroplane >5,700 kg (>12,566 lb); turbine-powered; pressurized; OR multi-engine. / **UN SEUL SUFFIT (604.02) :** gros avion >5 700 kg (>12 566 lb); turbine; pressurisé; OU multimoteur.\n- Examples · Exemples: PA-30 (ME); PA-46 Malibu (press.); C208 (turbine); Citation CJ3 (jet); Challenger 350 (large) / PA-30 (multi.); PA-46 Malibu (press.); C208 (turbine); Citation CJ3 (réacteur); Challenger 350 (gros)\n\n| Item | PIC | SIC |\n|---|---|---|\n| Licence | Part IV · PPL+ | Part IV · appropriate |\n| Class / Rating · Classe / Qualif. | Class/type; IR if IFR / Classe/type; qualif. IFR si IFR | Class/type; IR if required / Classe/type; IFR si exigé |\n| PPC / CC · PPC / VC | CC or accepted PPC / VC ou PPC reconnu | CC or accepted PPC / VC ou PPC reconnu |\n| Validity / Validité | CC 24 mo* | CC 24 mo* |\n| Ground / Sol | 12 mo / some 36 | 12 mo / some 36 |\n| Condition / Précision | Private operation; 604.140 equivalencies / Exploitation privée; équivalences 604.140 | Same-type check, differences training / Vérif. du même type, formation aux différences |\n| CAR | 604.143 | 604.143 |\n\n**702 · Aerial work / Travail aérien**\n\n- Aircraft applicability · Aéronefs (kg/lb · pax): Aeroplane/helicopter performing qualifying aerial work; no general weight/seat cap; sightseeing excluded (§702.01). / Avion/hélico en travail aérien admissible; aucune limite générale de masse/sièges; excursions aériennes exclues (§702.01).\n- Examples · Exemples: Air Tractor AT-502B (spraying); C172 (survey/photo) / Air Tractor AT-502B (épandage); C172 (photo/relevés)\n\n| Item | PIC/SIC |\n|---|---|\n| Licence | Part IV · commercial as required |\n| Class / Rating · Classe / Qualif. | Class/type + IR if IFR / Classe/type + qualif. IFR si IFR |\n| PPC / CC · PPC / VC | CC or PPC (routine); PPC for IFR with non-crew aboard / VC ou PPC (courant); PPC pour IFR avec non-équipage |\n| Validity / Validité | CC 12 / PPC 24 mo |\n| Ground / Sol | 12 mo |\n| Condition / Précision | Chief-pilot CC/PPC exemption does not waive IFR PPC / Exemption du chef pilote sans dispense du PPC IFR |\n| CAR | 702.65 |\n\n**703 · Air taxi SE / Taxi aérien mono**\n\n- Aircraft applicability · Aéronefs (kg/lb · pax): SE aircraft: no general MCTOW/seat threshold in §703.01(a). / Monomoteur : aucun seuil général de MMHD/sièges au §703.01a).\n- Examples · Exemples: C206 Stationair; C208 Caravan; Pilatus PC-12 / C206 Stationair; C208 Caravan; Pilatus PC-12\n\n| Item | PIC |\n|---|---|\n| Licence | CPL+ |\n| Class / Rating · Classe / Qualif. | SE; IR if IFR/night VFR with pax / Mono; IFR si IFR/VFR nuit avec pax |\n| PPC / CC · PPC / VC | CC normally; PPC if operated under 703.22(2) / VC normalement; PPC si 703.22(2) |\n| Validity / Validité | 12 mo |\n| Ground / Sol | 12 mo |\n| Condition / Précision | 5 h in PIC position on type/basic model before pax; reduction permitted / 5 h en position CDB sur type/modèle avant pax; réduction possible |\n| CAR | 703.88 |\n\n**703 · Air taxi ME / Taxi aérien multi**\n\n- Aircraft applicability · Aéronefs (kg/lb · pax): ME aircraft other than turbojet aeroplane: MCTOW ≤8,618 kg (19,000 lb), ≤9 pax seats (pilot seats excluded). / Multimoteur sauf avion à turboréacteurs : MMHD ≤8 618 kg (19 000 lb), ≤9 sièges pax (hors pilotes).\n- Examples · Exemples: Piper PA-31 Navajo; King Air C90/B200 / Piper PA-31 Navajo; King Air C90/B200\n\n| Item | PIC | SIC |\n|---|---|---|\n| Licence | CPL or ATPL† | CPL+ |\n| Class / Rating · Classe / Qualif. | ME; Group 1 IR if IFR; type if required / Multimoteur; IFR G1 si IFR; type si requis | ME; Group 1 IR if required; type if required / Multimoteur; IFR G1 si requis; type si requis |\n| PPC / CC · PPC / VC | PPC mandatory / PPC obligatoire | PPC or CC / PPC ou VC |\n| Validity / Validité | 12 mo | 12 mo |\n| Ground / Sol | 12 mo | 12 mo |\n| Condition / Précision | 15 h in PIC position on type/basic model before pax; 50% max reduction / 15 h en position CDB sur type/modèle avant pax; réduction max. 50 % | SIC option does not replace PIC PPC / Option copilote ≠ PPC du CDB |\n| CAR | 703.88 | 703.88 |\n\n**704 · Commuter / Navette**\n\n- Aircraft applicability · Aéronefs (kg/lb · pax): ME aeroplane: MCTOW ≤8,618 kg (19,000 lb), 10–19 pax seats. Turbojet: MZFW ≤22,680 kg (50,000 lb), type certificate ≤19 pax. / Avion multimoteur : MMHD ≤8 618 kg (19 000 lb), 10–19 sièges pax. Turboréacteur : masse maxi sans carburant ≤22 680 kg (50 000 lb), type ≤19 pax.\n- Examples · Exemples: DHC-6 Twin Otter (19 seats); Beech 1900D (19) / DHC-6 Twin Otter (19 sièges); Beech 1900D (19)\n\n| Item | PIC | SIC |\n|---|---|---|\n| Licence | CPL or ATPL† | CPL+ |\n| Class / Rating · Classe / Qualif. | Class/IR/type as required / Classe/IFR/type selon le cas | Class/IR/type as required / Classe/IFR/type selon le cas |\n| PPC / CC · PPC / VC | PPC / PPC | PPC / PPC |\n| Validity / Validité | 12 mo | 12 mo |\n| Ground / Sol | 12 mo | 12 mo |\n| Condition / Précision | PIC ≥500 h VFR; ≥1,200 h IFR carrying pax / CDB ≥500 h VFR; ≥1 200 h IFR avec pax | 3 T/O + landings within previous 90 days / 3 décollages + atterrissages sur 90 jours |\n| CAR | 704.108 | 704.108 |\n\n**705 · Airline / Transport aérien**\n\n- Aircraft applicability · Aéronefs (kg/lb · pax): Aeroplane: MCTOW >8,618 kg (>19,000 lb) OR type certificate ≥20 pax; except 704-authorized aeroplanes. / Avion : MMHD >8 618 kg (>19 000 lb) OU certificat de type ≥20 pax; sauf avions autorisés 704.\n- Examples · Exemples: ATR 42; ATR 72; Dash 8 Q400; A220; B737 / ATR 42; ATR 72; Dash 8 Q400; A220; B737\n\n| Item | PIC | SIC |\n|---|---|---|\n| Licence | ATPL | CPL/ATPL§ |\n| Class / Rating · Classe / Qualif. | Group 1 IR + individual type / IFR groupe 1 + type individuel | Group 1 IR + individual type / IFR groupe 1 + type individuel |\n| PPC / CC · PPC / VC | PPC / PPC | PPC / PPC |\n| Validity / Validité | 6 mo‡ | 6 mo‡ |\n| Ground / Sol | 12 mo + 6 mo‡ | 12 mo + 6 mo‡ |\n| Condition / Précision | Line check 12 mo; approved AQP/recurrent alternatives / Contrôle en ligne 12 mois; options approuvées AQP/périodiques | 90-day flight/sector currency; initi
