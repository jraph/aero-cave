ing attitude/trim problem until disconnect. Keep hand near disconnect during approach.","p":["CPL"]},{"id":"12-35","card":"12","h":"Unusual attitude — nose high","a":"unusual-attitude--nose-high","c":["emg-ua"],"kd":"procedure","u":"proc-unusual-attitude-nose-high","md":"- `P:` recognize reliable instruments→power as required/reduce if near stall? aircraft-specific→lower pitch/AoA→level wings→recover to assigned attitude/altitude smoothly.\n- Generic training memory: add power as appropriate, lower nose, level wings; avoid stall/yaw.\n- `T:` exact sequence varies with aircraft/attitude; POH/instructor method wins.","p":["PPL","CPL"]},{"id":"12-36","card":"12","h":"Unusual attitude — nose low","a":"unusual-attitude--nose-low","c":["emg-ua"],"kd":"procedure","u":"proc-unusual-attitude-nose-low","md":"- `P:` power idle/reduce→level wings→ease out→avoid overspeed/excess g→re-establish power/trim.\n- `T:` pulling before levelling increases load factor/spiral.","p":["PPL","CPL"]},{"id":"12-37","card":"12","h":"Icing encounter","a":"icing-encounter","c":["met-icing","ifr-emerg"],"kd":"procedure","u":"proc-icing-encounter","md":"- `P:` exit immediately: turn/climb/descend toward known non-icing→pitot/static/prop/windshield/boots/heat per POH→advise ATC→increase speed/config margins per POH→plan nearest suitable landing.\n- Avoid flap/config changes that create tailplane/handling risk unless POH directs.\n- `T:` non-approved aircraft: “trace” is already an escape event, not a monitoring plan.","p":[],"ph":["IR"]},{"id":"12-38","card":"12","h":"Convective / severe turbulence","a":"convective--severe-turbulence","c":["met-ts","ifr-emerg"],"kd":"procedure","u":"proc-convective-severe-turbulence","md":"- `P:` avoid; ask deviation early. If inadvertent: turbulence penetration speed/attitude per POH, autopilot off if required, accept altitude variation, do not chase, exit shortest safe route.\n- `T:` onboard weather shows history/attenuation; never use it to thread cells.","p":[],"ph":["IR"]},{"id":"12-39","card":"12","h":"Engine abnormal in IMC","a":"engine-abnormal-in-imc","c":["emg-engine","ifr-emerg"],"kd":"procedure","u":"proc-engine-abnormal-in-imc","md":"- `P:` control/attitude→power/config→identify issue→checklist→declare→nearest suitable approach/landing.\n- Single engine aircraft: maintain glide/partial-power option; avoid descending below terrain escape altitude prematurely.\n- Multi-engine: maintain `Vyse`/control, clean/identify/verify/feather per aircraft; OEI missed may be impossible.\n- `T:` troubleshooting fixation + IMC = spatial disorientation/CFIT.","p":["IR"]},{"id":"12-40","card":"12","h":"ATC workload tools","a":"atc-workload-tools","c":["law-atc","agk-hf"],"kd":"procedure","u":"proc-atc-workload-tools","md":"- Use: “unable,” “stand by,” “request vectors,” “request lower,” “request block altitude,” “minimum fuel,” `PAN PAN`, `MAYDAY`.\n- Declare early when safety margin reduced; state equipment failure, capability, fuel, souls, intentions.\n- `T:` ATC cannot help with a problem you hide.","p":[],"ph":["IR"]},{"id":"12-41","card":"12","h":"Final approach callouts — single pilot","a":"final-approach-callouts--single-pilot","c":["agk-hf","ifr-app-fly"],"kd":"procedure","u":"proc-final-approach-callouts-single-pilot","md":"- `P:` altitude/fix→source/mode→course alive→glidepath alive→FAF→gear/config→minimums approaching→minimums/MAP→land or missed.\n- Speak next action: “At minimums: required visual reference or missed.”\n- `T:` silence under high workload permits mode/altitude errors.","p":["IR"]},{"id":"12-42","card":"12","h":"Post-landing","a":"post-landing","c":["ifr"],"kd":"procedure","u":"proc-post-landing","md":"- `P:` clear runway fully→stop/after-landing flow→ground clearance→close flight plan if required→record defects/fuel/approach issues.\n- `T:` do not reconfigure heads-down while still on runway.","p":[],"ph":["IR"]},{"id":"12-43","card":"12","h":"Pebble","a":"pebble","c":["ifr"],"kd":"pebble","u":"proc-pebble","md":"- preflight `legal-equipped-current-fuel-performance-options` | clearance `CRAFT+` | dep brief `RWY-PATH-ALT-FREQ-GRAD-THREATS-FAIL` | gate source/course/alt/freq/squawk | hold `F-D-C-L-A-E` | approach `PROC-NAV-ALT-MIN-MAP-MISSED-RWY-THREATS` | before FAF source-mode-alt-min-missed | stable guide `1000 IMC/500 VMC` | NPA CDFA but never below MDA | missed `POWER-ATT-CONFIG-TRACK-NAV-TALK` | lost comm `7600 + AVEF + highest AME` | partial panel reliable instruments + ATC help | icing exit now | unable early.","p":["PPL","CPL","IR"]},{"id":"12-44","card":"12","h":"Sources & review status","a":"sources--review-status","c":["ifr"],"kd":"source","u":"proc-sources-review-status","md":"See the [separate review record](../CONTENT_REVIEW.md#historical-source-review-notes) for source editions, check dates and earlier validation notes.","p":[],"ph":["IR"]},{"id":"F-1","card":"F","h":"Time · fuel / Temps · carburant","a":"time--fuel--temps--carburant","c":["nav-dr","agk-fuel"],"kd":"formula","u":"fx-time-fuel-temps-carburant","md":"| Label | English | Français |\n|---|---|---|\n| Distance | D(NM) = GS(kt) × t(h) | D(NM) = vitesse sol(kt) × durée(h) |\n| Time / Durée | t(min) = 60D/GS | t(min) = 60D/vitesse sol |\n| GS / Vitesse sol | GS(kt) = 60D/t(min) | Vitesse sol(kt) = 60D/t(min) |\n| Fuel / Carburant | Fuel = hourly flow × hours; endurance = usable fuel/flow | Carburant = débit horaire × heures; autonomie = carburant utilisable/débit |\n| Specific range | GS/fuel flow = NM per fuel unit | Vitesse sol/débit = NM par unité de carburant |","p":[],"ph":["PPL","CPL"]},{"id":"F-2","card":"F","h":"Wind · navigation / Vent · navigation","a":"wind--navigation--vent--navigation","c":["nav-dr"],"kd":"formula","u":"fx-wind-navigation-vent-navigation","md":"| Label | English | Français |\n|---|---|---|\n| Components | Crosswind = W sin θ; headwind = W cos θ; θ is wind-from angle relative to course | Vent traversier = W sin θ; vent de face = W cos θ; θ entre provenance du vent et route |\n| WCA / Dérive | WCA = asin(crosswind/TAS); steer into wind | Correction = asin(vent traversier/TAS); corriger vers le vent |\n| Heading / Cap | True heading = true course + signed WCA | Cap vrai = route vraie + correction signée |\n| T → M → C | Subtract EAST / add WEST: variation, then deviation | Soustraire EST / ajouter OUEST : déclinaison, puis déviation |\n| Track error | TE° ≈ 60 × off-track/distance flown | Erreur de route ≈ 60 × écart latéral/distance parcourue |\n| Closing angle | CA° ≈ 60 × off-track/distance remaining | Angle de convergence ≈ 60 × écart latéral/distance restante |\n| Correction | TE + CA towards track; small-angle approximation | Erreur + convergence vers la route; approximation pour petits angles |","p":[],"ph":["PPL","CPL"]},{"id":"F-3","card":"F","h":"Weight · balance / Masse · centrage","a":"weight--balance--masse--centrage","c":["agk-wb"],"kd":"formula","u":"fx-weight-balance-masse-centrage","md":"| Label | English | Français |\n|---|---|---|\n| Moment | Moment = weight × arm | Moment = masse × bras de levier |\n| CG | CG = total moment/total weight | CG = somme des moments/masse totale |\n| Shift / Déplacement | ΔCG = moved weight × distance moved/total weight | ΔCG = masse déplacée × déplacement/masse totale |\n| Required weight | w = total weight × ΔCG/distance moved | w = masse totale × ΔCG/déplacement |\n| Add / remove | CGnew = (W × CGold ± w × arm)/(W ± w) | CGnouveau = (W × CGancien ± w × bras)/(W ± w) |\n| % MAC / CMA | 100(CG − LEMAC)/MAC; common datum and units | 100(CG − bord d’attaque CMA)/CMA; même référence et unités |","p":[],"ph":["PPL","CPL"]},{"id":"F-4","card":"F","h":"Altitude · weather / Altitude · météo","a":"altitude--weather--altitude--météo","c":["met-atmos"],"kd":"formula","u":"fx-altitude-weather-altitude-m-t-o","md":"| Label | English | Français |\n|---|---|---|\n| ISA | T°C ≈ 15 − 2 × altitude(thousands ft); troposphere | T°C ≈ 15 − 2 × altitude(milliers pi); troposphère |\n| PA / AP | PA ≈ IALT + 1000(29.92 − setting inHg) | AP ≈ altitude indiquée + 1000(29,92 − calage inHg) |\n| DA / AD | DA ≈ PA + 120(OAT − ISA at PA) | AD ≈ AP + 120(température extérieure − ISA à AP) |\n| True altitude | Correction ft ≈ 4 × height above setting source(thousands ft) × ΔT°C; warm add, cold subtract | Correction pi ≈ 4 × hauteur au-dessus de la source du calage(milliers pi) × ΔT°C; chaud ajouter, froid soustraire |\n| Temperature | F = 1.8C + 32; C = (F − 32)/1.8 | F = 1,8C + 32; C = (F − 32)/1,8 |\n| DALR | Unsaturated rising parcel: −3°C/1000 ft | Parcelle ascendante non saturée : −3°C/1000 pi |\n| SALR | Saturated rising parcel: ≈ −1.5°C/1000 ft; variable | Parcelle ascendante saturée : ≈ −1,5°C/1000 pi; variable |\n| Dew point | Unsaturated parcel: ≈ −0.5°C/1000 ft | Point de rosée, parcelle non saturée : ≈ −0,5°C/1000 pi |\n| Cloud base · exam | Convective base AGL ft ≈ 1000(T − Td)/3; **simplified classroom shortcut** assuming Td approximately constant | Base convective AGL pi ≈ 1000(T − Td)/3; **raccourci de cours** avec Td supposé presque constant |\n| Cloud base · parcel | Convective LCL AGL ft ≈ 1000(T − Td)/(3 − 0.5); rising unsaturated parcel cools 3°C/1000 ft, dew point falls 0.5°C/1000 ft → spread closes 2.5°C/1000 ft | NCL convectif AGL pi ≈ 1000(T − Td)/(3 − 0,5); la parcelle non saturée refroidit de 3°C/1000 pi, le point de rosée baisse de 0,5°C/1000 pi → écart réduit de 2,5°C/1000 pi |\n| Freezing · exam | Parcel 0°C height AGL ≈ CB(exam) + 1000 Td/1.5; assumes T at cloud base ≈ surface Td, saturated lapse ≈ 1.5°C/1000 ft | Hauteur AGL de 0°C dans la parcelle ≈ base(examen) + 1000 Td/1,5; T à la base ≈ Td de surface, gradient saturé ≈ 1,5°C/1000 pi |\n| Freezing · parcel | T_CB ≈ T − 3 CB(parcel)/1000; parcel 0°C height AGL ≈ CB(parcel) + 1000 T_CB/1.5 (if T_CB > 0°C); saturated lapse variable | T_base ≈ T − 3 base(parcelle)/1000; hauteur AGL de 0°C ≈ base(parcelle) + 1000 T_base/1,5 (si T_base > 0°C); gradient saturé variable |\n| Freezing · actual | Parcel 0°C height ≠ atmospheric freezing level; environmental vertical temperature profile / GFA / winds-temp aloft wins. ASL = AGL + field elevation (same datum) | Hauteur de 0°C de la parcelle ≠ niveau de congélation réel; privilégier profil thermique ambiant / GFA / vents-températures en altitude. ASL = AGL + altitude du terrain (même référence) |","p":[],"ph":["PPL","CPL"]},{"id":"F-5","card":"F","h":"Stall · airspeed / Décrochage · vitesse","a":"stall--airspeed--décrochage--vitesse","c":["agk-stall","agk-vspeeds"],"kd":"formula","u":"fx-stall-airspeed-d-crochage-vitesse","md":"| Label | English | Français |\n|---|---|---|\n| Load / Charge | n = 1/cos(bank): coordinated LEVEL turn only | n = 1/cos(inclinaison) : virage coordonné EN PALIER uniquement |\n| Stall / Décrochage | Vs loaded = Vs × √n; Vs₂ = Vs₁√(W₂/W₁) | Vs sous charge = Vs × √n; Vs₂ = Vs₁√(W₂/W₁) |\n| VS / VS1 / VS0 | VS = generic stall speed; VS1 = specified configuration (often clean); VS0 = landing config. VS and VS1 can refer to the same clean speed; not VS0. | VS = vitesse de décrochage générique; VS1 = configuration spécifiée (souvent lisse); VS0 = configuration d'atterrissage. VS et VS1 peuvent désigner la même vitesse en configuration lisse; pas VS0. |\n| VA · theoretical / théorique | VA_est = VS(clean)√n_limit; legacy Normal +3.8g → ≈1.95 VS1 (mental ≈2×VS1, not a VA range); VS1=50 KIAS → ≈97.5 KIAS. Positive stall/limit-load intersection, not necessarily certified VA. | VA_est = VS(lisse)√n_limite; Normal ancien +3,8g → ≈1,95 VS1 (calcul mental ≈2×VS1, pas une plage de VA); VS1=50 KIAS → ≈97,5 KIAS. Intersection décrochage/charge limite positive, pas nécessairement la VA certifiée. |\n| VA · weight / masse | VA₂ ≈ VA₁√(W₂/W₁) for same configuration/load-factor basis; lighter → lower VA. Published POH/AFM and weight schedule govern; VA does not protect against every abrupt/multiple input or gust. | VA₂ ≈ VA₁√(W₂/W₁), à configuration et facteur de charge comparables; masse moindre → VA moindre. POH/AFM et valeurs selon la masse prévalent; VA ne protège pas contre toute action brusque/combinée ni toute rafale. |\n| VREF definition / Définition | Landing reference speed: the published POH/AFM speed to be maintained to 50 ft in the specified landing configuration. Use the published value; certification bases differ. | Vitesse de référence à l’atterrissage : vitesse publiée au POH/AFM à maintenir jusqu’à 50 pi dans la configuration d’atterrissage précisée. Utiliser la valeur publiée; les bases de certification diffèrent. |\n| VREF fallback / Calcul | If VREF is not specified: 1.3 × VSO. Example: VSO 50 KIAS → VREF 65 KIAS. For approach category, use VSO at maximum certificated landing weight. | Si VREF n’est pas précisée : 1,3 × VSO. Exemple : VSO 50 KIAS → VREF 65 KIAS. Pour la catégorie d’approche, utiliser VSO à la masse maximale certifiée à l’atterrissage. |\n| Weight / Masse | Same configuration/basis only: VREF₂ ≈ VREF₁√(W₂/W₁). POH/AFM landing-weight data takes precedence. Wind/gust additive changes the approach target, not VREF. | Même configuration et même base seulement : VREF₂ ≈ VREF₁√(W₂/W₁). Les données POH/AFM selon la masse ont priorité. La correction vent/rafale modifie la cible d’approche, pas VREF. |\n| Lift / Portance | L = ½ρV²SCL; dynamic pressure q = ½ρV² | L = ½ρV²SCL; pression dynamique q = ½ρV² |\n| TAS | TAS = EAS√(ρ₀/ρ) | Vitesse vraie = vitesse équivalente × √(ρ₀/ρ) |\n| TAS shortcut | ≈ CAS[1 + 0.02(PA/1000)]; rough; E6B for actual temperature | ≈ CAS[1 + 0,02(AP/1000)]; approximatif; E6B pour température réelle |\n| 30° / 45° / 60° | n: 1.15 / 1.41 / 2; Vs factors: 1.07 / 1.19 / 1.41 | n : 1,15 / 1,41 / 2; facteurs Vs : 1,07 / 1,19 / 1,41 |","p":[],"ph":["PPL","CPL"]},{"id":"F-6","card":"F","h":"Climb · descent / Montée · descente","a":"climb--descent--montée--descente","c":["agk-perfcalc"],"kd":"formula","u":"fx-climb-descent-mont-e-descente","md":"| Label | English | Français |\n|---|---|---|\n| Gradient | ft/NM = 60 × vertical speed(ft/min)/GS(kt) | pi/NM = 60 × vitesse verticale(pi/min)/vitesse sol(kt) |\n| Required rate | ft/min = gradient(ft/NM) × GS/60 | pi/min = gradient(pi/NM) × vitesse sol/60 |\n| Percent / Pourcentage | % = 100 × vertical/horizontal distance; same units | % = 100 × distance verticale/horizontale; mêmes unités |\n| % → ft/NM | ft/NM = 60.76 × percent; 5% ≈ 304 ft/NM | pi/NM = 60,76 × pourcentage; 5% ≈ 304 pi/NM |\n| 3° path / Pente | 3° ≈ 5.24% ≈ 318 ft/NM; NOT 3% | 3° ≈ 5,24% ≈ 318 pi/NM; PAS 3% |\n| 3° rate / Taux | Descent ft/min ≈ 5.3 × GS; mental shortcut 5 × GS | Descente pi/min ≈ 5,3 × vitesse sol; raccourci 5 × vitesse sol |\n| 3° distance | NM ≈ height to lose(ft)/318; rough 3 NM/1000 ft | NM ≈ hauteur à perdre(pi)/318; environ 3 NM/1000 pi |\n| Descent time | Minutes = height change/vertical speed; NM = GS × minutes/60 | Minutes = dénivelé/vitesse verticale; NM = vitesse sol × minutes/60 |\n| Worked / Exemple | Lose 4000 ft at GS120: ≈12.6 NM, 636 ft/min, 6.3 min on 3° | Perdre 4000 pi à GS120 : ≈12,6 NM, 636 pi/min, 6,3 min sur 3° |\n| Wind / Vent | Same climb rate: headwind improves ground gradient; tailwind reduces it | Même taux de montée : vent de face améliore la pente sol; vent arrière la réduit |","p":[],"ph":["PPL","CPL"]},{"id":"F-7","card":"F","h":"Turns / Virages","a":"turns--virages","c":["agk-load"],"kd":"formula","u":"fx-turns-virages","md":"| Label | English | Français |\n|---|---|---|\n| Standard rate | 3°/s; 90°=30s; 180°=60s; 360°=120s | 3°/s; 90°=30s; 180°=60s; 360°=120s |\n| Rate / Taux | °/s ≈ 1091 tan(bank)/TAS(kt) | °/s ≈ 1091 tan(inclinaison)/TAS(kt) |\n| Radius / Rayon | ft ≈ TAS²/[11.26 tan(bank)] | pi ≈ TAS²/[11,26 tan(inclinaison)] |\n| Standard bank | bank = atan(3TAS/1091); 100kt≈15°; 150kt≈22° | inclinaison = atan(3TAS/1091); 100kt≈15°; 150kt≈22° |\n| Double speed | Same bank: half turn rate, FOUR times radius | Même inclinaison : taux divisé par deux, rayon QUADRUPLÉ |\n| Assumptions | Coordinated level turn; TAS; air-relative geometry; wind alters ground track | Virage coordonné en palier; TAS; géométrie dans l’air; vent modifie trajectoire sol |","p":[],"ph":["PPL","CPL"]},{"id":"F-8","card":"F","h":"Radio · runway / Radio · piste","a":"radio--runway--radio--piste","c":["agk-perfcalc","ifr-minima"],"kd":"formula","u":"fx-radio-runway-radio-piste","md":"| Label | English | Français |\n|---|---|---|\n| VHF range | NM ≈ 1.23(√h₁ + √h₂); 1.25 also used; feet above surface | NM ≈ 1,23(√h₁ + √h₂); 1,25 également; hauteurs en pi au-dessus de la surface |\n| Rotating tyre | Dynamic hydroplaning kt ≈ 9√pressure(psi); 36psi→54kt | Pneu en rotation : aquaplanage dynamique kt ≈ 9√pression(psi); 36psi→54kt |\n| Non-rotating tyre | kt ≈ 7.7√pressure(psi); 36psi→46.2kt | Pneu sans rotation : kt ≈ 7,7√pression(psi); 36psi→46,2kt |\n| FISE frequencies | 123.275 / 123.375 / 123.475 / 123.550 MHz; use local published RCO | 123,275 / 123,375 / 123,475 / 123,550 MHz; utiliser RCO publié |\n| 126.7 | Generally not monitored by FIC at dedicated FISE RCOs; broadcasts may occur | Généralement non veillée par FIC aux RCO FISE dédiés; diffusions possibles |","p":["PPL","CPL"],"e":["PPL"]},{"id":"F-9","card":"F","h":"Conversions","a":"conversions","c":["nav-units"],"kd":"formula","u":"fx-conversions","md":"| Label | English | Français |\n|---|---|---|\n| NM | 1 NM = 1.852km = 6076ft = 1.151 statute mi | 1 NM = 1,852km = 6076pi = 1,151 mille terrestre |\n| Gallon | US 3.785L; Imperial 4.546L | US 3,785L; impérial 4,546L |\n| Mass / length | 1kg = 2.205lb; 1m = 3.281ft | 1kg = 2,205lb; 1m = 3,281pi |\n| Earth / Terre | 15° longitude/hour; 4min/degree; 1′ latitude ≈ 1NM | 15° longitude/heure; 4min/degré; 1′ latitude ≈ 1NM |","p":[],"ph":["PPL","CPL"]},{"id":"F-10","card":"F","h":"Timing shortcuts / Estimation du temps","a":"timing-shortcuts--estimation-du-temps","c":["nav-dr"],"kd":"formula","u":"fx-timing-shortcuts-estimation-du-temps","md":"| Label | English | Français |\n|---|---|---|\n| Units / Unités | Distance in NM × fraction = ETE in MINUTES; use groundspeed, including wind. | Distance en NM × fraction = ETE en MINUTES; utiliser la vitesse sol, vent compris. |\n| 60 kt | ETE = distance × 1 → same number; 30 NM = 30 min | ETE = distance × 1 → même nombre; 30 NM = 30 min |\n| 75 kt | ETE = distance × ⅘ → ÷5 then ×4; 30 NM = 24 min | ETE = distance × ⅘ → ÷5 puis ×4; 30 NM = 24 min |\n| 90 kt | ETE = distance × ⅔ → ÷3 then ×2; 30 NM = 20 min | ETE = distance × ⅔ → ÷3 puis ×2; 30 NM = 20 min |\n| 100 kt | ETE = distance × ⅗ → ÷5 then ×3; 30 NM = 18 min | ETE = distance × ⅗ → ÷5 puis ×3; 30 NM = 18 min |\n| 120 kt | ETE = distance × ½ → ÷2; 30 NM = 15 min | ETE = distance × ½ → ÷2; 30 NM = 15 min |\n| 150 kt | ETE = distance × ⅖ → ÷5 then ×2; 30 NM = 12 min | ETE = distance × ⅖ → ÷5 puis ×2; 30 NM = 12 min |\n| 180 kt | ETE = distance × ⅓ → ÷3; 30 NM = 10 min | ETE = distance × ⅓ → ÷3; 30 NM = 10 min |","p":[],"ph":["PPL","CPL"]},{"id":"F-11","card":"F","h":"Memory traps & examples / Pièges et exemples","a":"memory-traps--examples--pièges-et-exemples","c":["nav-dr"],"kd":"trap","u":"fx-memory-traps-examples-pi-ges-et-exemples","md":"**60 ≠ 60** · Rate/gradient: 60 converts hours→minutes. 1-in-60: rounded radians→degrees. / Taux/pente : conversion heures→minutes. 1 sur 60 : radians→degrés arrondis.\n\n**GS vs TAS** · Timing and ground gradient use GS; turn geometry uses TAS. / Temps et pente sol : vitesse sol; géométrie du virage : TAS.\n\n**9 / 7.7** · Rolling tyre 9√psi; non-rotating 7.7√psi. Not a safe braking-speed guarantee. / Rotation 9√psi; sans rotation 7,7√psi. Pas une garantie de freinage.\n\n**3° ≠ 3%** · 3° = about 5.24%, 318 ft/NM. / 3° = environ 5,24%, 318 pi/NM.\n\n**DA ≠ weight** · Weight worsens performance but does not increase density altitude. / La masse dégrade les performances sans augmenter l’altitude-densité.\n\n**True altitude** · Use height above setting source, not mountain elevation; temperature shortcut assumes column conditions. / Hauteur au-dessus de la source du calage, pas du sommet; hypothèses sur température de la colonne.\n\n**Radio / ATC** · RCO links flight service; PAL links ATC. / RCO : service de vol; PAL : ATC.\n\n**NOTAM** · N purpose ≠ NOTAMN new; radius ≠ diameter; E is operational detail. / N objet ≠ NOTAMN nouveau; rayon ≠ diamètre; détails en E.\n\n**CFS S** · 1 store; 2–3 repair; 4 park; 5 tie; 6 plug; 7 drop/go. / 1 entreposer; 2–3 réparer; 4 stationner; 5 amarrer; 6 brancher; 7 déposer/repartir.\n\n**Examples** · Training examples only; POH, published procedures and current NOTAMs govern. / Exemples pédagogiques; manuel de vol, procédures publiées et NOTAM courants prioritaires.\n\n**ADF pebble / Repère** · HEAD + RELATIVE = TO; TO ±180 = FROM. Inbound capture: 330/030; outbound: 150/210 for H=C+30/C−30, no wind. / CAP + GISEMENT = VERS; VERS ±180 = DEPUIS. Interception sans vent : rapprochement 330/030; éloignement 150/210 pour H=C+30/C−30.\n\n[TC CPAER TP12881](https://tc.canada.ca/en/aviation/publications/study-reference-guide-written-examinations-commercial-pilot-licence-aeroplane-tp-12881) · [TC AIM 2026-1 RAC 9.21; VREF checked 20 Oct 2026](https://tc.canada.ca/sites/default/files/2026-03/aim-2026-1_access_en.pdf) · [TC AWM 500/525; VREF certification basis checked 20 Oct 2026](https://tc.canada.ca/en/corporate-services/acts-regulations/list-regulations/canadian-aviation-regulations-sor-96-433/standards/airworthiness-manual-chapter-525-transport-category-aeroplanes/airworthiness-chapter-525-subchapter-b-canadian-aviation-regulations-cars) · [NAV CANADA CNOP v12 · 14 May 2026](https://www.navcanada.ca/en/comms/_localized-assets/guides/cnop/cnop-v12-04172026.pdf) · [NAV CANADA pilot briefings](https://www.navcanada.ca/en/flight-planning/flight-planning-and-reporting.aspx) · [TSB A02C0072 · 7.7√psi](https://tsb.gc.ca/eng/rapports-reports/aviation/2002/a02c0072/a02c0072.html) · [TC radio reception approximation](https://tc.canada.ca/en/corporate-services/acts-regulations/list  altocumulus castellanus; CFS : centre de contrôle régional. |\n| NS | Cloud: nimbostratus; location: Nova Scotia | Nuage : nimbostratus; lieu : Nouvelle-Écosse. |\n| GS | Weather: snow pellets; ILS: glide slope | Météo : neige roulée; ILS : alignement de descente. |\n| NR · WI | Near or number · Within, or Wisconsin. | Près ou numéro · À l’intérieur de, ou Wisconsin. |\n| FEW · SCT · BKN · OVC | 1–2 · 3–4 · 5–7 · 8 oktas. | 1–2 · 3–4 · 5–7 · 8 octas. |\n| CIG | Lowest BKN/OVC layer, or vertical visibility | Plus basse couche BKN/OVC, ou visibilité verticale. |\n| METAR / TAF | Cloud heights: hundreds of feet above aerodrome | Hauteurs des nuages : centaines de pieds au-dessus de l’aérodrome. |\n| GFA | Cloud bases/tops generally ASL; ceilings AGL | Bases/sommets généralement ASL; plafonds AGL. |\n| FZ · SH · TS | Freezing · Showers · Thunderstorm. | Verglaçant · Averses · Orage. |\n| − · no sign · + | Light · moderate · heavy, where intensity applies | Léger · modéré · fort, lorsque l’intensité s’applique. |\n| −SHRA | Light rain showers | Averses de pluie légères. |\n| SHGS | Snow-pellet showers; may also mean small hail <5 mm | Averses de neige roulée; aussi petite grêle <5 mm. |\n| FM | New prevailing conditions from the stated time | Nouvelles conditions dominantes dès l’heure indiquée. |\n| BECMG | Transition within the stated interval | Transition pendant l’intervalle indiqué. |\n| TEMPO | Each event <1 h; total ≤ half the TEMPO window | Chaque épisode <1 h; total ≤ la moitié de la période TEMPO. |\n| NSW | No significant weather; clouds may remain | Aucun temps significatif; des nuages peuvent subsister. |\n| PN ≠ PPR | Notify ≠ obtain permission | Donner un préavis ≠ obtenir une permission. |\n| O/R · O/T · O/S | On request · other times · out of service | Sur demande · aux autres heures · hors service. |\n| MF / ATF | Frequency-area designation; not a service type | Désignation de fréquence-zone; pas un type de service. |\n| FSS · RAAS · CARS · AU · UNICOM | Service labels; an MF area can have no ground station operating | Types de services; une MF peut exister sans station au sol en service. |\n| LWIS | Wind, temperature, dew point, altimeter | Vent, température, point de rosée, calage altimétrique. |\n| 10–04Z | 1000 UTC to 0400 UTC the next day | 10 h UTC à 4 h UTC le lendemain. |\n| ‡ | UTC hours become 1 h earlier during daylight-saving time | Heures UTC avancées de 1 h à l’heure d’été. |\n| UTC−5(4) | Local time: UTC−5 standard; UTC−4 daylight | Heure locale : UTC−5 normale; UTC−4 été. |\n| (V) · (U) · (E) | 121.5 MHz · 243.0 MHz · both | 121,5 MHz · 243,0 MHz · les deux. |\n| INTL AIR | International Air Carrier | Transporteur aérien international. |\n| (bil) | After COMM: all listed services; before one service: that service | Après COMM : tous les services listés; devant un service : ce service. |\n| TORA · TODA · ASDA · LDA | Run · run + clearway · run + stopway · landing | Roulement · roulement + prolongement dégagé · roulement + prolongement d’arrêt · atterrissage. |\n| Displaced threshold / Seuil décalé | Landing distance reduced in that direction | Distance d’atterrissage réduite dans ce sens. |\n| DME | Slant-range distance | Distance oblique. |\n| MEHT | Eye height, not wheel clearance | Hauteur de l’œil, pas marge des roues. |\n| NDA | VOR/TACAN referenced to true north | VOR/TACAN orientés au nord vrai. |\n| FL | Pressure reference 29.92 inHg | Référence de pression 1013,2 hPa. |\n| S 1 · 2 · 3 | Storage · minor repairs · major repairs | Entreposage · réparations mineures · réparations majeures. |\n| S 4 · 5 · 6 · 7 | Extended parking · tie-down · plug-in · pick-up/drop-off only | Stationnement prolongé · arrimage · prises · embarquement/débarquement seulement. |\n| PF A · B · C · D | Terminal · on aerodrome · within 5 NM · within 30 NM | Aérogare · sur l’aérodrome · à moins de 5 NM · à moins de 30 NM. |\n| PF 1 · 2 · 3 · 4 | Phone · food · taxi · medical | Téléphone · restauration · taxi · services médicaux. |\n| PF 5 · 6 · 7 · 8 | Hotel · car rental · public Wi-Fi · public Internet | Hôtel · location auto · Wi-Fi public · Internet public. |\n| S 5 ≠ PF 5 | Tie-down ≠ hotel | Arrimage ≠ hôtel. |\n| PF A-1,2 B-5 | Phone/food in terminal; hotel on aerodrome | Téléphone/restauration dans l’aérogare; hôtel sur l’aérodrome. |\n| S 2,5 | Minor repairs + tie-down | Réparations mineures + arrimage. |\n| MF 118.7 04–12Z 5NM 3100 ASL | Frequency · service hours · radius · upper limit | Fréquence · heures du service · rayon · limite supérieure. |\n\n##### Grouped examples / Exemples groupés\n\n**Basic-code context / Contexte des codes de base** · ACFT = aircraft / aéronef; AD and A/D = aerodrome / aérodrome; APRT = airport / aéroport. AP also means anomalous propagation in meteorology / AP signifie aussi propagation anormale en météo. CFS rpt = report / compte rendu; MANAB RPT = repeat / répéter. CFS hr = hour, HR = high-level air route / CFS hr = heure, HR = route aérienne de haute altitude.\n\n**Fog & code-building / Brouillard et composition** · MIFG = MI shallow + FG fog / MI mince + FG brouillard. BCFG = banks / bancs; PRFG = partial aerodrome coverage / couverture partielle de l’aérodrome; VCFG = nearby / au voisinage; FZFG = freezing fog / brouillard givrant. MI/BC/PR apply to FG / s’emploient avec FG. No TS+SH combined descriptor / pas de double descripteur TS+SH. SS: weather sandstorm, CFS sunset / météo tempête de sable, CFS coucher du soleil. M: temperature minus; bearing magnetic; RVR below measurement range / température négative; relèvement magnétique; RVR sous la plage de mesure.\n\n\n**Context / Contexte** · ACC: weather = altocumulus castellanus; CFS = Area Control Centre / météo = altocumulus castellanus; CFS = centre de contrôle régional. NS: nimbostratus / Nova Scotia (Nouvelle-Écosse). GS: snow pellets / glide slope = neige roulée / alignement de descente. NR: near / number = près / numéro. WI: within; also Wisconsin / à l’intérieur de; aussi Wisconsin.\n\n**Clouds / Nuages** · FEW 1-2; SCT 3-4; BKN 5-7; OVC 8 oktas. Ceiling / plafond = lowest / plus basse couche BKN-OVC, or / ou visibilité verticale. METAR-TAF cloud heights / hauteurs des nuages: hundreds of feet above aerodrome / centaines de pieds au-dessus de l’aérodrome. GFA bases-tops / bases-sommets: generally / généralement ASL; ceilings / plafonds: AGL.\n\n**Weather decoding / Décodage météo** · FZ freezing / verglaçant; SH showers / averses; TS thunderstorm / orage. - light / léger; no sign / sans signe: moderate / modéré; + heavy / fort, where intensity applies / lorsque l’intensité s’applique. -SHRA = light rain showers / averses de pluie légères. SHGS: snow-pellet showers; may also mean small hail <5 mm / averses de neige roulée; aussi petite grêle <5 mm.\n\n**Forecast changes / Évolution des prévisions** · FM: new prevailing conditions from time / nouvelles conditions dominantes dès l’heure indiquée. BECMG: transition during interval / transition pendant l’intervalle. TEMPO: each event <1 h; total ≤ half the TEMPO window / chaque épisode <1 h; total ≤ la moitié de la période TEMPO. NSW: no significant weather; cloud may remain / aucun temps significatif; des nuages peuvent subsister.\n\n**Access & radio / Accès et radio** · PN notify / préavis; PPR permission / permission. O/R request / sur demande; O/T other times / aux autres heures; O/S out of service / hors service. MF-ATF = frequency-area designation / désignation de fréquence-zone. FSS-RAAS-CARS-AU-UNICOM = service / service. MF may have no active ground station / MF possible sans station au sol active. LWIS: wind, temperature, dew point, altimeter / vent, température, point de rosée, calage altimétrique.\n\n**Time & symbols / Heures et symboles** · 10-04Z: 1000 to 0400 next day / 10 h à 4 h le lendemain, UTC. ‡: UTC times 1 h earlier in daylight-saving time / heures UTC avancées de 1 h à l’heure d’été. UTC-5(4): standard minus 5; daylight minus 4 / normale moins 5; été moins 4. (V) 121.5 MHz; (U) 243.0 MHz; (E) both / les deux. INTL AIR: International Air Carrier / transporteur aérien international. (bil) after COMM / après COMM: all listed services / tous les services listés; before one service / devant un service: that service / ce service.\n\n**Runway distances / Distances de piste** · TORA = run / roulement. TODA = TORA + clearway / prolongement dégagé. ASDA = TORA + stopway / prolongement d’arrêt. LDA = landing / atterrissage. Displaced threshold / seuil décalé: landing distance reduced in that direction / distance d’atterrissage réduite dans ce sens. DME = slant range / distance oblique. MEHT = eye height, not wheel clearance / hauteur de l’œil, pas marge des roues. NDA VOR-TACAN: true north / nord vrai. FL: 29.92 inHg / 1013.2 hPa.\n\n**Servicing S / Entretien S** · 1 store / entreposage; 2 minor repairs / réparations mineures; 3 major repairs / réparations majeures; 4 extended parking / stationnement prolongé; 5 tie-down / arrimage; 6 plug-in / prises; 7 pick-up-drop-off only / embarquement-débarquement seulement. Chain / chaîne: store-small-major-park-tie-plug-drop / ranger-mineur-majeur-parquer-attacher-brancher-déposer.\n\n**Public facilities PF / Installations publiques PF** · Location / lieu: A terminal / aérogare; B on aerodrome / sur l’aérodrome; C within / à moins de 5 NM; D within / à moins de 30 NM. 1 phone / téléphone; 2 food / restauration; 3 taxi / taxi; 4 medical / services médicaux; 5 hotel / hôtel; 6 car rental / location auto; 7 public Wi-Fi / Wi-Fi public; 8 public Internet access / accès Internet public. S 5 = tie-down / arrimage; PF 5 = hotel / hôtel.\n\n**Examples / Exemples** · PF A-1,2 B-5: phone-food in terminal; hotel on aerodrome / téléphone-restauration dans l’aérogare; hôtel sur l’aérodrome. S 2,5: minor repairs + tie-down / réparations mineures + arrimage. MF radio 118.7 04-12Z 5NM 3100 ASL: frequency, service hours, radius, upper limit / fréquence, heures du service, rayon, limite supérieure ASL.\n\n***","p":[],"ph":["PPL","CPL","IR","ME"]},{"id":"A-16","card":"A","h":"TC flight-crew examinations / Examens du personnel navigant (TC)","a":null,"c":["law-lic"],"kd":"glossary","u":"abbr-tc-flight-crew-examinations-examens-du-perso","md":"**Scope / Portée** · Selected TC examination meanings supplementary to the MANAB/CFS study sections (not a claim of MANAB/CFS authority). English entries follow the [TC list](https://tc.canada.ca/en/aviation/licensing-pilots-personnel/flight-crew-licences-permits-ratings/flight-crew-examinations/abbreviations-acronyms-flight-crew-examinations); French = concise study translation, not certified official terminology. / Sens complémentaires d'examens TC (non présentés comme définitions MANAB/CFS). Français = traduction d'étude.\n\n| Code | English · TC exam | Français · étude |\n|---|---|---|\n| `AAE` | Above aerodrome elevation | Au-dessus de l'altitude de l'aérodrome |\n| `ACAS` | Airborne collision avoidance system | Système anticollision embarqué |\n| `AD` | Airworthiness directive (TC exam); MANAB AD = aerodrome | Consigne de navigabilité (TC) ; MANAB AD = aérodrome |\n| `ADIZ` | Air defence identification zone | Zone d'identification de défense aérienne |\n| `AME` | Aircraft maintenance engineer | Technicien d'entretien d'aéronefs |\n| `APU` | Auxiliary power unit | Groupe auxiliaire de puissance |\n| `ASI` | Airspeed indicator | Indicateur de vitesse |\n| `ASR` | Airport surveillance radar | Radar de surveillance d'aéroport |\n| `ATPL` | Airline transport pilot licence | Licence de pilote de ligne |\n| `ATS` | Air traffic services | Services de la circulation aérienne |\n| `BFL` | Balanced field length | Longueur de piste équilibrée |\n| `CAME` | Civil Aviation Medical Examiner | Médecin-examinateur de l'aviation civile |\n| `CARs` | Canadian Aviation Regulations; ≠ CARS community aerodrome radio station | Règlement de l'aviation canadien ; ≠ CARS station radio d'aérodrome communautaire |\n| `CAS` | Calibrated airspeed | Vitesse corrigée |\n| `CAT` | Clear air turbulence; ≠ approach category | Turbulence en air clair ; ≠ catégorie d'approche |\n| `CDI` | Course deviation indicator | Indicateur d'écart de route |\n| `CFI` | Chief flying instructor | Chef-instructeur de vol |\n| `CMNPS` | Canadian minimum navigation performance specifications | Spécifications canadiennes de performances minimales de navigation |\n| `CMNPSA` | Canadian minimum navigation performance specifications airspace | Espace aérien des spécifications canadiennes de performances minimales de navigation |\n| `CP` | Critical point; ≠ PNR | Point critique ; ≠ PNR |\n| `CPL` | Commercial pilot licence | Licence de pilote professionnel |\n| `CVFR` | Controlled visual flight rules | Règles de vol à vue contrôlé |\n| `CVR` | Cockpit voice recorder | Enregistreur de conversations de poste de pilotage |\n| `DF` | Direction finder | Radiogoniomètre |\n| `DVFR` | Defence visual flight rules | Règles de vol à vue de défense |\n| `EAT` | Expected approach time | Heure prévue d'approche |\n| `EFC` | Expected further clearance time | Heure prévue de nouvelle autorisation |\n| `EGT` | Exhaust gas temperature | Température des gaz d'échappement |\n| `EPR` | Engine pressure ratio | Rapport de pression moteur |\n| `ESCAT Plan` | Emergency security control of air traffic plan | Plan de contrôle d'urgence de la circulation aérienne à des fins de sécurité |\n| `ETOPS` | Extended range operations by twin-engined aeroplanes | Opérations à distance accrue d'avions bimoteurs |\n| `EWH` | Eye-to-wheel height | Hauteur œil–roues |\n| `FD` | Upper-level wind and temperature forecasts (TC exam); ≠ flight director | Prévisions de vents et températures en altitude (TC) ; ≠ directeur de vol |\n| `FDR` | Flight data recorder | Enregistreur de données de vol |\n| `FMS` | Flight management system | Système de gestion de vol |\n| `FPD` | Freezing point depressant; ≠ FDP flight duty period | Abaisseur du point de congélation ; ≠ FDP période de service de vol |\n| `HSI` | Horizontal situation indicator | Indicateur de situation horizontale |\n| `IAF` | Initial approach fix | Repère d'approche initiale |\n| `IAS` | Indicated airspeed | Vitesse indiquée |\n| `ICAO` | International Civil Aviation Organization | Organisation de l'aviation civile internationale |\n| `IMC` | Instrument meteorological conditions | Conditions météorologiques de vol aux instruments |\n| `INS` | Inertial navigation system | Système de navigation inertielle |\n| `ISA` | International Standard Atmosphere | Atmosphère type internationale |\n| `ISO` | International Organization for Standardization | Organisation internationale de normalisation |\n| `KIAS` | Knots indicated air speed | Nœuds de vitesse indiquée |\n| `LAHSO` | Land and hold short operations | Atterrissage avec arrêt avant intersection |\n| `LEMAC` | Leading edge of mean aerodynamic chord | Bord d'attaque de la corde aérodynamique moyenne |\n| `MAC` | Mean aerodynamic chord | Corde aérodynamique moyenne |\n| `MAP` | Missed approach point; ≠ MP manifold pressure | Point d'approche interrompue ; ≠ MP pression d'admission |\n| `MEA` | Minimum en route altitude | Altitude minimale en route |\n| `MEL` | Minimum equipment list | Liste d'équipement minimal |\n| `MNPS` | Minimum navigation performance specifications | Spécifications de performances minimales de navigation |\n| `MNPSA` | Minimum navigation performance specifications airspace | Espace aérien aux spécifications de performances minimales de navigation |\n| `MP` | Manifold pressure; absolute intake pressure (inHg) | Pression d'admission ; pression absolue (po Hg) |\n| `MRA` | Minimum reception altitude | Altitude minimale de réception |\n| `MSL` | Mean sea level | Niveau moyen de la mer |\n| `MVFR` | Marginal visual flight rules | Conditions marginales de vol à vue |\n| `N1 / Ng` | Gas-generator turbine RPM (TC exam notation; engine-dependent) | Régime de turbine génératrice de gaz (notation TC ; selon moteur) |\n| `N2 / Np` | Power-turbine RPM (TC exam notation; engine-dependent) | Régime de turbine de puissance (notation TC ; selon moteur) |\n| `NAT` | North Atlantic | Atlantique Nord |\n| `NAVAID` | Navigation aid | Aide à la navigation |\n| `OBS` | Omnibearing selector | Sélecteur omnidirectionnel |\n| `PNR` | Point of no return; ≠ CP | Point de non-retour ; ≠ CP |\n| `PSR` | Primary surveillance radar | Radar primaire de surveillance |\n| `RAIM` | Receiver autonomous integrity monitoring | Contrôle autonome de l'intégrité par le récepteur |\n| `RMI` | Radio magnetic indicator | Indicateur radiomagnétique |\n| `RVSM` | Reduced vertical separation minimums | Minimums réduits d'espacement vertical |\n| `SAE` | Society of Automotive Engineers | Society of Automotive Engineers (organisme de normalisation) |\n| `SGR` | Specific ground range | Distance-sol spécifique (distance par unité de carburant) |\n| `SSR` | Secondary surveillance radar | Radar secondaire de surveillance |\n| `STOL` | Short take-off and landing | Décollage et atterrissage courts |\n| `SVFR` | Special visual flight rules | Règles de vol à vue spécial |\n| `TCAS` | Traffic alert and collision avoidance system | Système d'alerte de trafic et d'évitement des collisions |\n| `TEMAC` | Trailing edge of mean aerodynamic chord | Bord de fuite de la corde aérodynamique moyenne |\n| `TOT` | Turbine outlet temperature | Température de sortie de turbine |\n| `VLF` | Very low frequency | Très basse fréquence |\n| `VMC` | Visual meteorological conditions | Conditions météorologiques de vol à vue |\n| `VOT` | VOR receiver test facility | Installation d'essai de récepteur VOR |\n| `VSI` | Vertical speed indicator | Variomètre / indicateur de vitesse verticale |\n\n**T · COLLISIONS** · `AD` TC Airworthiness Directive ≠ MANAB aerodrome | `MP` manifold pressure ≠ `MAP` missed approach point | `FD` upper-wind/temp forecast ≠ flight director | `CARs` regulations ≠ `CARS` station | `FPD` freezing-point depressant ≠ `FDP` flight duty period | TC `N1/Ng` / `N2/Np` ≠ universal turbine indications.\n\n**Sources / Références** · MANAB 4th ed. / 4e éd. (2021), English and French tables / tables anglaise et française; supplied / fourni CFS General (12 Jun-7 Aug / 12 juin-7 août 2025), A7-A12 + directory legends / légendes; supplied / fourni TC AIM 2026-1, MET. Study terminology; use current CFS-NOTAM for flight / Terminologie d’étude; utiliser le CFS-NOTAM en vigueur pour le vol.\n\n[TC exam abbreviations](https://tc.canada.ca/en/aviation/licensing-pilots-personnel/flight-crew-licences-permits-ratings/flight-crew-examinations/abbreviations-acronyms-flight-crew-examinations) · [MANAB EN](https://www.canada.ca/en/environment-climate-change/services/weather-manuals-documentation/manab-word-abbreviations-4th-edition/search.html) · [MANAB FR](https://www.canada.ca/fr/environnement-changement-climatique/services/manuels-documents-conditions-meteorologiques/manab-abreviations-de-mots-4e-edition/recherche.html)","p":[],"ph":["PPL","CPL","IR","ME"]},{"id":"MET-0","card":"MET","f":"kb/met/air-masses-fronts-wind.md","h":"Air masses","a":"air-masses","c":["met-systems"],"kd":"knowledge","u":"wx-air-masses","md":"- Classified by moisture/source: continental `c` dry, maritime `m` moist; Arctic/Polar/Tropical temp source.\n- Weather changes as air mass moves over warmer/colder/moister terrain.\n- Cold air over warm surface ⇒ instability/showers.\n- Warm air over cold surface ⇒ stability/fog/stratus.","p":["PPL","CPL","IR"],"e":["CPL"]},{"id":"MET-1","card":"MET","f":"kb/met/air-masses-fronts-wind.md","h":"Pressure systems","a":"pressure-systems","c":["met-systems"],"kd":"knowledge","u":"wx-pressure-systems","md":"- Northern Hemisphere:\n  - Low: counter-clockwise + inward, rising air, cloud/precip.\n  - High: clockwise + outward, sinking air, often fair/stable.\n- Trough = elongated low pressure, often wind shift/cloud/showers.\n- Ridge = elongated high pressure, generally more stable.\n- Closely spaced isobars ⇒ stronger pressure-gradient wind.","p":["PPL","CPL","IR"],"e":["CPL"]},{"id":"MET-2","card":"MET","f":"kb/met/air-masses-fronts-wind.md","h":"Wind","a":"wind","c":["met-systems"],"kd":"knowledge","u":"wx-wind","md":"- Pressure-gradient force drives high→low.\n- Coriolis deflects right in Northern Hemisphere; increases with latitude/speed.\n- Aloft, pressure gradient + Coriolis ≈ geostrophic/gradient flow, roughly parallel isobars.\n- Surface friction slows wind ⇒ Coriolis↓ ⇒ wind crosses isobars toward low.\n- `M:` surface wind angles **into LOW / out of HIGH**.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"MET-3","card":"MET","f":"kb/met/air-masses-fronts-wind.md","h":"Local winds","a":"local-winds","c":["met-systems"],"kd":"knowledge","u":"wx-local-winds","md":"- Sea breeze day: sea→land; land breeze night: land→sea.\n- Valley/anabatic day: upslope/up-valley.\n- Mountain/katabatic night: downslope/down-valley.\n- Funnel/terrain effects can accelerate and redirect wind.\n- `T:` airport wind may differ sharply from ridge/pass/valley wind.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"MET-4","card":"MET","f":"kb/met/air-masses-fronts-wind.md","h":"Fronts","a":"fronts","c":["met-systems"],"kd":"knowledge","u":"wx-fronts","md":"- **Cold:** cold undercuts warm; steeper/narrower; CU/CB, showers, gusts, turbulence, fast wind shift.\n- **Warm:** warm overruns cold; broad layered cloud; lowering ceilings, steady precip, icing/FZRA risk.\n- **Stationary:** little movement; prolonged cloud/precip.\n- **Occluded:** cold front catches warm front; extensive mixed frontal weather.\n- `M cold:` `fast-steep-convective`.\n- `M warm:` `slow-wide-layered`.\n- `T:` timing errors can rapidly change runway/wind/CIG; fog may form after departure.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"MET-5","card":"MET","f":"kb/met/air-masses-fronts-wind.md","h":"CF — before / passing / after","a":"cf--before--passing--after","c":["met-systems"],"kd":"knowledge","u":"wx-cold-front","md":"- `K:` surface passage at one location; typical NH mid-latitude low, south of centre. Wind = FROM; directions illustrative.\n\n| Element | Before | Passing | After |\n|---|---|---|---|\n| Pressure | ↓ | minimum → sharp ↑ | ↑, then levels |\n| T / Td | warm / relatively high | T↓; Td usually↓ | colder / usually drier |\n| Wind | S–SW; may strengthen | veers W–NW; gusts/squalls | W–NW; often gusty, later eases |\n| Cloud | CU/TCU; CB if unstable | TCU/CB band; low ragged cloud | CU/SC; clearing trend |\n| Precip | SH/TS may precede | brief heavy SH ± TS/hail | showers, then easing |\n| CIG / VIS | deteriorate near band | low CIG / poor in precip | improve between showers |\n| `!` | prefrontal squall line possible | turbulence / shear / icing / TS | gusts / turbulence; snow squalls possible |\n\n- `M:` CF = `T↓ Td↓ P↑ WIND VEERS`.\n- `T:` stable/slow CF may give layered cloud + prolonged precip; passage ≠ instant clearing.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"MET-6","card":"MET","f":"kb/met/air-masses-fronts-wind.md","h":"WF — before / passing / after","a":"wf--before--passing--after","c":["met-systems"],"kd":"knowledge","u":"wx-warm-front","md":"| Element | Before | Passing | After |\n|---|---|---|---|\n| Pressure | steady ↓ | fall slows → levels | ~steady / slight ↑; may ↓ toward next low/CF |\n| T / Td | cool / Td tends ↑ | T↑; Td steady→↑ | warmer / moist, Td higher |\n| Wind | E–SE | veers toward S; variable near boundary | S–SW; speed varies |\n| Cloud | Ci → Cs → As → Ns; St/fog below | low St / fog | St/SC; may lift/break; CB if unstable |\n| Precip | widespread steady RA/SN; PL/FZRA possible | RA/DZ; may ease | often eases; DZ/SH may persist |\n| CIG / VIS | progressively ↓ | often low / poor | usually improve; low cloud/haze/fog may persist |\n| `!` | icing / embedded CB; FZRA if warm layer over subzero surface | low CIG / fog / shear | warm-sector low cloud / fog; possible TS |\n\n- `M:` WF = `LAYERS LOWER → T↑ Td↑ WIND VEERS; P FALL STOPS`.\n- `T:` tendencies, not guarantees: track/terrain/stability/season modify sequence. Both fronts can have CB; WF ≠ guaranteed clearing or strong P rise.\n- `SRC:` [FAA PHAK — Weather Theory, Fronts (NWS-hosted)](https://www.weather.gov/media/zhu/ZHU_Training_Page/Met_Tutorials/Weather_Theory.pdf); [NWS — frontal analysis / pressure tendencies](https://www.weather.gov/media/zhu/ZHU_Training_Page/Met_Tutorials/AF-Trainee.pdf).","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"MET-7","card":"MET","f":"kb/met/air-masses-fronts-wind.md","h":"Typical warm-front sequence","a":"typical-warm-front-sequence","c":["met-systems"],"kd":"knowledge","u":"wx-warm-front-sequence","md":"- `Ci → Cs → As → Ns → St/fog`, ceilings lower and precip increases approaching front.\n- Warm-layer-over-subfreezing-surface setup can produce `FZRA/PL`.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"MET-8","card":"MET","f":"kb/met/air-masses-fronts-wind.md","h":"Front formation, trowal, upper fronts","a":"front-formation-trowal-upper-fronts","c":["met-systems"],"kd":"knowledge","u":"wx-front-formation-trowal-upper-fronts","md":"- Cold front = transition zone where cold air **advances and replaces** warm air. Forms as cold dense air wraps cyclonically (counter-clockwise) around a developing low, undercuts warm moist air → lift → often convective cloud and precipitation. Weakens as the low occludes.\n- **Occlusion**: cold front overtakes warm front (fronts move at different speeds); warm air lifted aloft.\n- **Trowal** (trough of warm air aloft): mid-level ribbon of warm air lifted over cooler air after occlusion → **elevated convective precipitation**, low visibility, heavy accumulation; winter: **freezing precipitation** at low levels beneath it. Chart: trowal symbol (red/blue hooks on Canadian surface charts) marks the weather aloft, not surface winds.\n- **Upper front**: front aloft not reaching the surface (dashed on surface charts); turbulence possible in an upper cold front.\n- `?:` frontogenesis (front forming/strengthening) / frontolysis (weakening/dissipating): standard meteorology terms, not found in a TC/NAV CANADA text.\n\n- Sources: [NAV CANADA AvMet: cold front](https://avmet.navcanada.ca/en/cold-front.aspx), [trowal](https://avmet.navcanada.ca/en/trowal.aspx); [TC AIM MET](https://tc.canada.ca/sites/default/files/2026-10/aim-2026-2_met_en.pdf) 10.0.","p":["PPL","CPL"],"e":["CPL"]},{"id":"MET-9","card":"MET","f":"kb/met/air-masses-fronts-wind.md","h":"Centrifugal force and gradient wind","a":"centrifugal-force-and-gradient-wind","c":["met-systems"],"kd":"knowledge","u":"wx-centrifugal-force-gradient-wind","md":"- Around curved isobars, centrifugal force adds to the pressure-gradient / Coriolis balance → **gradient wind**.\n- **Low** (cyclonic): centrifugal force acts with Coriolis against pressure gradient → wind **slower** than geostrophic for the same isobar spacing. **High** (anticyclonic): wind **faster** than geostrophic.\n- `T` Same isobar spacing ≠ same wind around a high and a low.\n- `?:` general knowledge; no free TC or NAV CANADA text found. Check against a TC-recognized text (e.g. *From the Ground Up*, TC Flight Training Manual) in the fact-check pass.","p":["CPL"]},{"id":"MET-10","card":"MET","f":"kb/met/air-masses-fronts-wind.md","h":"Pebble","a":"pebble","c":["met-systems"],"kd":"pebble","u":"met-systems-pebble","md":"- AIR MASS `c dry / m moist; Arctic/Polar/Tropical | cold air over warm surface → instability/showers | warm air over cold surface → stability/fog/stratus`\n- PRESSURE (NH) `low = CCW-IN-RISE, cloud/precip | high = CW-OUT-SINK | trough → wind shift/cloud/showers | closely spaced isobars → stronger wind`\n- WIND `pressure gradient high→low | Coriolis deflects right (NH) | aloft ≈ parallel isobars | surface friction → wind crosses isobars toward low`\n- LOCAL `sea breeze day sea→land; land breeze night land→sea | anabatic day upslope; katabatic night downslope`\n- COLD FRONT `FAST-STEEP-CU | T↓ Td↓ P↑ WIND VEERS | passage ≠ instant clearing`\n- WARM FRONT `SLOW-WIDE-LAYERED | Ci→Cs→As→Ns→St/fog | T↑ Td↑ WIND VEERS; P FALL STOPS | FZRA/PL if warm layer over subfreezing surface`\n- T `tendencies, not guarantees | both fronts can have CB`\n- FRONTS `cold front: cold replaces warm, undercuts | occlusion: cold overtakes warm | TROWAL: warm air aloft → heavy elevated precip, FZ precip below | upper front dashed, turbulence`\n- GRADIENT WIND `centrifugal force on curved flow | low: < geostrophic | high: > geostrophic`","p":["PPL","CPL","IR"]},{"id":"MET-11","card":"MET","f":"kb/met/atmosphere-altimetry.md","h":"Atmosphere / ISA","a":"atmosphere--isa","c":["met-atmos"],"kd":"knowledge","u":"wx-isa","md":"- ISA SL: `15°C`, `29.92 inHg /1013.25 hPa`, density `1.225 kg/m³`.\n- Standard temp lapse ≈ `2°C/1000 ft` to tropopause.\n- Pressure/density decrease with altitude; warm air less dense than cold air.\n- `F:` ISA temp ≈ `15 - 2×altitude(1000 ft)`.\n- `T:` ISA is a reference model, not forecast weather.","p":["PPL","CPL","IR"],"e":["PPL"]},{"id":"MET-12","card":"MET","f":"kb/met/atmosphere-altimetry.md","h":"Pressure altitude / density altitude","a":"pressure-altitude--density-altitude","c":["met-atmos"],"kd":"knowledge","u":"wx-pa-da","md":"- Pressure altitude = altitude with altimeter `29.92`.\n- Density altitude = pressure altitude corrected for non-standard temperature.\n- `F rough:` `DA ≈ PA + 120 × (OAT - ISA temp)` ft.\n- High `PA + temp + humidity` ⇒ DA↑ ⇒ takeoff roll↑, climb↓, TAS for same IAS↑.\n- `M:` `HOT-HIGH-HUMID = PERFORMANCE LOW`.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"MET-13","card":"MET","f":"kb/met/atmosphere-altimetry.md","h":"Altimetry / pressure traps","a":"altimetry--pressure-traps","c":["met-atmos"],"kd":"trap","u":"wx-altimetry-traps","md":"- From high pressure→low without reset: true altitude lower than indicated.\n- Warm→cold: true altitude lower than indicated.\n- `M:` `HIGH→LOW / HOT→COLD = LOOK OUT BELOW`.\n- Cold temperature increases obstacle/terrain error; apply published corrections where required.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"MET-14","card":"MET","f":"kb/met/atmosphere-altimetry.md","h":"Density / TAS","a":"density--tas","c":["met-atmos"],"kd":"knowledge","u":"wx-density-tas","md":"- For same IAS, TAS rises with altitude as density falls.\n- Rule-of-thumb TAS ≈ `IAS + ~2% per 1000 ft` in lower atmosphere.\n- Higher TAS at same IAS ⇒ larger turn radius and more ground distance during manoeuvre.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"MET-15","card":"MET","f":"kb/met/atmosphere-altimetry.md","h":"Altimetry / density altitude","a":"altimetry--density-altitude","c":["met-atmos"],"kd":"knowledge","u":"wx-altimetry-density-altitude","md":"- ISA SL: `29.92 / 1013 / 15°C`; lapse≈`2°C/1000 ft`.\n- High→low or warm→cold = actual lower. `M:` look out below.\n- DA↑ with temperature/humidity/pressure altitude↑. Weight does NOT change DA; it independently worsens takeoff/climb. Higher DA: roll↑ climb↓; TAS↑ for the same IAS.\n- `F:` PA≈elev+(29.92-altset)×1000. DA≈PA+120×(OAT-ISA). `T:` approximation only.","p":[],"ph":["PPL","CPL"]},{"id":"MET-16","card":"MET","f":"kb/met/atmosphere-altimetry.md","h":"Pressure altitude / density altitude · card 06","a":"pressure-altitude--density-altitude--card-06","c":["met-atmos"],"kd":"formula","u":"wx-pressure-altitude-density-altitude","md":"- `F:` `PA ≈ field elev + (29.92 - altimeter) × 1000`.\n- `F:` `ISA temp °C ≈ 15 - 2 × altitude(thousands ft)`.\n- `F:` `DA ≈ PA + 120 × (OAT - ISA)`.\n- `M:` hot/high/humid/low pressure ⇒ DA↑ ⇒ roll↑ climb↓. Heavy independently worsens performance; weight does NOT change DA.\n- `T:` DA formula is approximation; POH chart wins.","p":[],"ph":["PPL","CPL","IR"]},{"id":"MET-17","card":"MET","f":"kb/met/atmosphere-altimetry.md","h":"Pebble","a":"pebble","c":["met-atmos"],"kd":"pebble","u":"met-atmos-pebble","md":"- ISA `15°C / 29.92 inHg / 1013.25 hPa / ≈2°C per 1000 ft to tropopause | ISA temp ≈ 15 − 2×ALT(1000 ft) | reference model ≠ forecast`\n- DA `PA = altitude with 29.92 set | DA ≈ PA + 120×(OAT − ISA temp) ft | HOT-HIGH-HUMID → TKOF roll↑ climb↓ TAS↑ for same IAS`\n- ALTIMETRY `HIGH→LOW / HOT→COLD = LOOK OUT BELOW (true ALT lower than indicated) | cold → apply published corrections where required`\n- TAS `≈ IAS + ~2% per 1000 ft (lower atmosphere) | TAS↑ → turn radius↑`","p":["PPL","CPL","IR"]},{"id":"MET-18","card":"MET","f":"kb/met/carburettor-icing.md","h":"Carburetor icing","a":"carburetor-icing","c":["carb-ice"],"kd":"knowledge","u":"wx-carb-ice","md":"- Fuel vaporization + venturi pressure drop can cool carb throat well below OAT.\n- Possible even in warm weather, well above freezing; risk high with humidity and partial power/descent.\n- Fixed-pitch clue: RPM↓ then roughness.\n- `P:` apply carb heat per POH; initial RPM drop/roughness may worsen while ice melts, then recovery.\n- `T:` carb icing ≠ structural icing; structural icing forecast and carb icing risk are different.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"MET-19","card":"MET","f":"kb/met/carburettor-icing.md","h":"Carburetor icing","a":"carburetor-icing-1","c":["carb-ice"],"kd":"knowledge","u":"sys-carburetor-icing","md":"- Can occur in moist air from about `-13°C to +38°C`; risk high in humid partial-power operation.\n- `S:` fixed-pitch: unexplained RPM↓, then roughness/airspeed↓. Constant-speed: manifold pressure↓.\n- `P:` full carb heat→expect initial power loss/roughness→leave full hot until ice clears→re-adjust power/mixture per POH.\n- `M:` initial worse, then better = ice melting.\n- `T:` partial heat without carb-air-temperature guidance may place air in icing range. Heated air is usually unfiltered and reduces power.\n- `T:` structural icing conditions and carb-ice conditions are related but not identical.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"MET-20","card":"MET","f":"kb/met/carburettor-icing.md","h":"Induction / alternate air","a":"induction--alternate-air","c":["carb-ice"],"kd":"knowledge","u":"sys-induction-alternate-air","md":"- Fuel-injected engines may use alternate induction air instead of carb heat.\n- `S:` intake filter blockage/ice → power loss; alternate air may restore.\n- `T:` alternate air often warmer/unfiltered and changes mixture/power.","p":["PPL","CPL"]},{"id":"MET-21","card":"MET","f":"kb/met/carburettor-icing.md","h":"Pebble","a":"pebble","c":["carb-ice"],"kd":"pebble","u":"carb-ice-pebble","md":"- CARB ICE `fuel vaporization + venturi → throat well below OAT | possible in warm weather, well above freezing | humid + partial power/descent | fixed pitch: RPM↓ then roughness | carb heat per POH: RPM drop/roughness may worsen first | ≠ structural icing`","p":["PPL","CPL"]},{"id":"MET-22","card":"MET","f":"kb/met/cold-temperature-altitude-corrections.md","h":"Cold temperature / altitude error","a":"cold-temperature--altitude-error","c":["met-cold"],"kd":"formula","u":"wx-cold-temperature-altitude-error","md":"- `M:` high to low, look out below; warm to cold, look out below.\n- `F rough:` altitude error ≈ `4 ft × height above station(thousands ft) × °C below ISA`.\n- Example rough: `2000 ft above station`, `20°C colder than ISA` ⇒ `4×2×20=160 ft` low.\n- `T:` use approved cold-temperature/CAP correction tables when required; rough formula is memory aid only.","p":["IR"]},{"id":"MET-23","card":"MET","f":"kb/met/cold-temperature-altitude-corrections.md","h":"Cold temperature","a":"cold-temperature","c":["met-cold","ifr-plates"],"kd":"knowledge","u":"plate-cold-temperature","md":"- Check CAP cold-temp notes / temperature limits / uncompensated Baro-VNAV restrictions.\n- Apply required altitude corrections to procedure altitudes as applicable; ATC cleared altitude may need coordination if correction affects assigned altitude.\n- `T:` cold correction protects obstacle clearance; it does not change aircraft altimeter reading.\n- Apply when surface temp ≤**0 °C**, or ≤**+10 °C** when MDA/DA ≥1 000 ft HAA; add CAP table values to MSA/TAA, initial, intermediate, final, missed, MDA/DA. [CAP GEN Altitude correction chart]\n- Accepted ATC-assigned altitudes: not corrected (refuse if unsafe). Vector altitudes: already corrected. Corrected mandatory/missed-hold altitude: tell ATC before the fix. [CAP GEN]","p":["IR"]},{"id":"MET-24","card":"MET","f":"kb/met/fog-visibility.md","h":"Fog","a":"fog","c":["met-fog"],"kd":"knowledge","u":"wx-fog","md":"- **Radiation:** clear/light wind/moist ground/night cooling; burns with heating/mixing.\n- **Advection:** moist air over colder surface; needs wind; can persist.\n- **Upslope:** moist air forced uphill and cooled.\n- **Steam:** cold air over warmer water.\n- **Precipitation/frontal:** rain evaporates into cooler air.\n- **Ice fog:** very cold air, ice crystals.\n- `M:` radiation = cooling ground; advection = moving moist air.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"MET-25","card":"MET","f":"kb/met/fog-visibility.md","h":"Visibility","a":"visibility","c":["met-fog"],"kd":"knowledge","u":"wx-visibility","md":"- Reduced by fog, mist, haze, smoke, dust, precip, blowing snow.\n- Stable air tends to trap contaminants; unstable mixing often improves general visibility.\n- `!:` whiteout = no discernible horizon/terrain cues over snow/cloud; visual attitude/height judgment can disappear.","p":["PPL","CPL"]},{"id":"MET-26","card":"MET","f":"kb/met/fog-visibility.md","h":"Pebble","a":"pebble","c":["met-fog"],"kd":"pebble","u":"met-fog-pebble","md":"- FOG `RAD = clear / light wind / moist ground / night cooling | ADVECT = moist air over colder surface, needs wind, can persist | UPSLOPE = forced uphill | STEAM = cold air over warmer water | PRECIP/frontal = rain into cooler air | ICE FOG = very cold air`\n- M `RAD COOL / ADVECT MOVE / UPSLOPE LIFT`\n- VIS `stable air traps contaminants | whiteout = no horizon/terrain cues over snow/cloud`","p":["PPL","CPL","IR"]},{"id":"MET-27","card":"MET","f":"kb/met/gfa-sigmet-pirep-winds.md","h":"GFA","a":"gfa","c":["met-gfa"],"kd":"knowledge","u":"wxp-gfa","md":"- Most probable conditions ≤`24,000 ft`; issued `4×/day` approx `2330/0530/1130/1730Z`, valid `0000/0600/1200/1800Z`.\n- Six charts: C&W + icing/turb/freezing at valid/`+6 h/+12 h`; final C&W adds `12 h` IFR outlook.\n- `P:` region/time→system/motion→cloud bases/tops→vis/WX/wind→icing/turb/freezing→comments/outlook; interpolate snapshots with buffer.\n- Heights hundreds ft `ASL` unless `CIG/AGL`; METAR/TAF clouds AGL. `LCA≤25% | PTCHY 26–50% | XTNSV/INTMT>50%`; `P6SM`=>6 SM.\n- Movement/`6 h`: `5 kt≈30 NM`, `10 kt≈60 NM`, `20 kt≈120 NM`. `T:` local/patchy hazard may sit on route.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"MET-28","card":"MET","f":"kb/met/gfa-sigmet-pirep-winds.md","h":"AIRMET / SIGMET / PIREP","a":"airmet--sigmet--pirep","c":["met-gfa"],"kd":"knowledge","u":"wxp-airmet-sigmet-pirep","md":"| Product | Use / trap |\n|---|---|\n| `AIRMET` | moderate ice/turb, low CIG/vis, strong wind, mountain obscuration/significant change; may exceed light-GA capability |\n| `SIGMET` | TS, severe turb/LLWS/wave/ice, TC, dust/sand, VA/radioactive cloud; avoid; expired≠hazard ended |\n| `PIREP` | actual `/OV /TM /FL /TP /SK /TA /WV /TB /IC /RM`; match time/place/level/type; jet “light” may be severe operationally for trainer |\n\n- `P:` plot phenomenon/area/time/levels/movement/change; compare route/ETA and updates. UUA includes severe/extreme turb, severe ice, LLWS, tornado/funnel/waterspout, VA or other safety-critical condition.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"MET-29","card":"MET","f":"kb/met/gfa-sigmet-pirep-winds.md","h":"Upper winds / temperature","a":"upper-winds--temperature","c":["met-gfa"],"kd":"knowledge","u":"wxp-upper-winds","md":"- Use forecast level nearest route altitude; interpolate if needed. Wind is true direction/speed; temperature °C, omitted at low levels in some coding conventions.\n- `P:` compute WCA/GS/fuel→compare freezing level/temp→select altitude balancing wind, terrain, cloud, icing, oxygen/performance.\n- `T:` strongest tailwind route may place you in icing/turbulence/terrain trap.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"MET-30","card":"MET","f":"kb/met/gfa-sigmet-pirep-winds.md","h":"Weather maps and prognostic charts — AIM MET 3","a":"weather-maps-and-prognostic-charts--aim-met-3","c":["met-gfa","ifr-wx"],"kd":"knowledge","u":"wx-weather-maps-prog-charts","md":"| Chart | Shows | Times |\n|---|---|---|\n| Surface analysis | MSL isobars (close = strong wind), H/L, fronts (blue cold, red warm, red/blue stationary, purple occluded; dashed = upper), precip / obstructions | obs 00/06/12/18Z; out 2–3 h later |\n| Upper analysis `ANAL` 850 / 700 / 500 / 250 hPa | reported wind, temperature, moisture; height contours 60 m (250 hPa: 120 m); isotherms 5 °C at 850/700 only; isotachs 250 hPa only | obs 00Z, 12Z |\n| Upper prog `PROG` FL240/340/390/450 | forecast wind barbs (pennant 50, feather 10, half 5 kt; true) + temperature (negative unless marked) | issued 12 h before valid; valid 00/06/12/18Z |\n| SigWx prog FL100–240, FL250–630 | mid: surface H/L/fronts + motion (kt), mod/sev icing, cloud layers, mountain waves, 0 °C level; high: TS, jets ≥80 kt, mod/sev non-convective turb, tropopause | issued 12 h before valid |\n\n- Levels ≈ 850 hPa 5 000 ft · 700 hPa 10 000 ft · 500 hPa 18 000 ft · 250 hPa 34 000 ft. 1 mb = 1 hPa. [AIM MET 3.3]\n- GFA: motion arrow + speed if ≥5 kt, else `STNR`; GFA symbols = SigWx symbols. [MET 4.5, 4.11] Charts detail: [MET 10.0–12.2]\n- `T:` analysis = observed (past); prog = forecast (future valid time).","p":["PPL","CPL","IR"],"e":["CPL"]},{"id":"MET-31","card":"MET","f":"kb/met/gfa-sigmet-pirep-winds.md","h":"Pebble","a":"pebble","c":["met-gfa"],"kd":"pebble","u":"met-gfa-pebble","md":"- GFA `most probable conditions ≤24,000 ft | issued ≈2330/0530/1130/1730Z, valid 0000/0600/1200/1800Z | six charts: C&W + icing/turb/freezing at valid / +6 h / +12 h; final C&W adds 12 h IFR outlook | heights ASL unless CIG/AGL | LCA ≤25% / PTCHY 26–50% / XTNSV/INTMT >50%`\n- AIRMET / SIGMET `AIRMET = moderate ice/turb, low CIG/vis, strong wind, mountain obscuration | SIGMET = TS, severe turb/LLWS/wave/ice, TC, dust/sand, VA; expired ≠ hazard ended`\n- PIREP `match time/place/level/ACFT type | jet “light” may be severe for a trainer`\n- FB `true direction | level nearest route altitude, interpolate | strongest tailwind may = icing/turbulence/terrain trap`\n- CHARTS `surface ANAL 00/06/12/18Z · upper ANAL 850/700/500/250 hPa at 00/12Z · PROG issued 12 h ahead · SigWx FL100–240 / 250–630`","p":["PPL","CPL","IR"]},{"id":"MET-32","card":"MET","f":"kb/met/go-no-go-weather-decisions.md","h":"MET","a":"met","c":["met-decide"],"kd":"knowledge","u":"wx-met","md":"- METAR actual; SPECI special; TAF aerodrome forecast; GFA area; FD/FB winds/temp aloft.\n- Clouds: FEW 1-2, SCT 3-4, BKN 5-7, OVC 8. Ceiling=lowest BKN/OVC/VV.\n- Stable=smooth/layer/poor vis/steady precip. Unstable=bumps/CU/showers/good vis.\n- `!:` TS/CB/gust front/wind shear/hail/icing/turb = avoid. Carb ice possible above freezing in humid partial power.","p":[],"ph":["PPL","CPL"]},{"id":"MET-33","card":"MET","f":"kb/met/ground-deicing.md","h":"De-/anti-icing · FPD · HOT / Dégivrage · antigivrage","a":"de-anti-icing--fpd--hot--dégivrage--antigivrage","c":["deice"],"kd":"knowledge","u":"wxp-deice-hot","md":"| Label | English | Français |\n|---|---|---|\n| De / Anti | De-icing removes contamination; anti-icing protects a clean surface temporarily. Clean-aircraft rule: CAR 602.11; ground fluid does not authorize flight in icing. | Dégivrage retire contamination; antigivrage protège temporairement surface propre. Aéronef propre : RAC 602.11; liquide au sol n’autorise pas vol en givrage. |\n| I / II / III / IV | I: thin, usually heated, orange, short protection. II: thickened, pale/yellow. III: thickened, lower-speed applications, bright yellow. IV: thickened, longer protection, green. Verify product/aircraft approval. | I : fluide, généralement chauffé, orange, protection courte. II : épaissi, pâle/jaune. III : épaissi, vitesses inférieures, jaune vif. IV : épaissi, protection prolongée, vert. Vérifier produit/aéronef approuvé. |\n| FPD / FDP | FPD = freezing-point depressant. FDP = flight duty period. ADF in fluid literature can mean aircraft deicing fluid, not the navigation receiver. | FPD = abaisseur du point de congélation. FDP = période de service de vol. ADF en dégivrage peut désigner liquide dégivrant, pas radiocompas. |\n| LOUT | Use the warmest limit: aerodynamic acceptance; freezing point +10°C (I) or +7°C (II/III/IV); for diluted thickened fluids, coldest published HOT temperature. | Retenir limite la plus chaude : acceptation aérodynamique; congélation +10°C (I) ou +7°C (II/III/IV); liquides épaissis dilués : température minimale HOT publiée. |\n| LOUT example | Type I: freezing point −30°C; aerodynamic limit −25°C → LOUT −20°C. OAT −22°C: too cold. Check aircraft skin temperature too. | Type I : congélation −30°C; limite aérodynamique −25°C → LOUT −20°C. OAT −22°C : trop froid. Vérifier aussi température du revêtement. |\n| HOT clock | Starts at BEGINNING of final fluid application. Two-step: start of anti-icing step, not completion. Product/dilution, temperature, precipitation/intensity determine table. | Débute au COMMENCEMENT de dernière application. Deux étapes : début antigivrage, pas fin. Tableau selon produit/dilution, température, précipitations/intensité. |\n| HOT judgement | HOT is an estimate, not assured protection. Fluid failure or changed conditions can end protection earlier. Expired HOT: approved inspection/re-treatment procedure; never automatic extra minutes. | HOT estimatif, protection non garantie. Défaillance ou changement météo peut raccourcir protection. HOT expiré : procédure approuvée inspection/nouveau traitement; aucun délai automatique. |\n| Snow / Neige | Use TC snowfall-intensity/visibility table, including day/night and temperature. METAR −SN alone does not resolve very-light versus light HOT categories. | Utiliser tableau TC intensité neige/visibilité, jour/nuit et température. −SN seul ne distingue pas catégories HOT très faible/faible. |\n| Annual tables | Use current winter 2026–27 HOT guidance and exact fluid table. No universal duration per type. Allowance-time rules for ice pellets/small hail differ from HOT. | Utiliser guide HOT hiver 2026–27 et tableau produit exact. Aucune durée universelle par type. Délais granulés de glace/petite grêle distincts des HOT. |","p":["PPL","CPL"]},{"id":"MET-34","card":"MET","f":"kb/met/ground-deicing.md","h":"Pebble","a":"pebble","c":["deice"],"kd":"pebble","u":"deice-pebble","md":"- DE/ANTI `de-icing removes contamination | anti-icing protects a clean surface temporarily | clean-ACFT rule CAR 602.11 | ground fluid ≠ authority to fly in icing`\n- FLUIDS `I thin, usually heated, orange, short protection | II thickened, pale/yellow | III thickened, lower-speed, bright yellow | IV thickened, longer protection, green | verify product/ACFT approval`\n- LOUT `warmest of: aerodynamic acceptance | freezing point +10°C (I) or +7°C (II/III/IV) | diluted thickened: coldest published HOT temperature`\n- HOT `clock starts at BEGINNING of final fluid application (two-step: start of anti-icing step) | estimate, not assured | expired → approved inspection/re-treatment, never automatic extra minutes | current-season table for the exact fluid`","p":["PPL","CPL"]},{"id":"MET-35","card":"MET","f":"kb/met/icing.md","h":"Structural icing","a":"structural-icing","c":["met-icing"],"kd":"knowledge","u":"wx-icing","md":"- Requires visible moisture + aircraft surface at/below freezing.\n- **Rime:** small supercooled drops, rapid freeze, rough/opaque.\n- **Clear:** larger drops, slower freeze/spread, smooth/heavy.\n- **Mixed:** combination.\n- Intensity: trace/light/moderate/severe.\n- Effects: lift↓, drag↑, stall speed↑, climb↓; prop/intake/static/control contamination.\n- `!:` freezing rain/drizzle and severe icing require immediate escape.\n- `!:` non-approved aircraft: avoid forecast/reported ice; exit at first indication.\n- Red: `FZRA/FZDZ/PL`, freezing-level crossing in cloud/precip, warm-front overrunning, PIREP/AIRMET/SIGMET, tops above capability. `T:` surface >`0°C` does not clear icing aloft.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"MET-36","card":"MET","f":"kb/met/icing.md","h":"Freezing level","a":"freezing-level","c":["met-icing","met-stab"],"kd":"knowledge","u":"wx-freezing-level","md":"- Altitude where `0°C`; may be multiple levels with inversions.\n- `F exam parcel 0°C:` AGL ≈ `CB_exam + 1000×Td_surface/1.5` ft: assumes cloud-base parcel temperature ≈ surface dew point and SALR≈1.5°C/1000 ft.\n- `F parcel 0°C:` `T_CB ≈ T_surface−3×CB_parcel/1000`; if `T_CB>0°C`, parcel reaches 0°C at `CB_parcel+1000×T_CB/1.5` ft AGL (approximate/variable SALR).\n- `T:` parcel 0°C height ≠ atmospheric freezing level; use actual environmental temperature profile / GFA / temperatures aloft. Temperature inversions may create multiple 0°C levels.\n- Freezing level ≠ guaranteed icing layer; requires moisture.\n- Cloud + subzero temp + PIREP/AIRMET icing = stronger evidence.","p":["PPL","CPL"],"e":["PPL"]},{"id":"MET-37","card":"MET","f":"kb/met/icing.md","h":"Snow / freezing precipitation","a":"snow--freezing-precipitation","c":["met-icing"],"kd":"knowledge","u":"wxp-snow-fzra","md":"- Snow reduces visibility rapidly; blowing snow may create whiteout/false horizon; contamination harms acceleration/braking/lift.\n- Ice pellets imply warm layer aloft and possible nearby freezing rain/mixed icing.\n- `!:` freezing rain = severe icing/ground contamination risk; avoid.\n- `T:` light snow code can still produce unacceptable visual contrast/visibility.","p":["PPL","CPL"],"e":["PPL"]},{"id":"MET-38","card":"MET","f":"kb/met/icing.md","h":"Pebble","a":"pebble","c":["met-icing"],"kd":"pebble","u":"met-icing-pebble","md":"- ICING `visible moisture + ACFT surface ≤0°C | rime = small drops, rough/opaque | clear = larger drops, smooth/heavy | lift↓ drag↑ stall speed↑ climb↓ | FZRA/FZDZ RED → immediate escape | surface >0°C ≠ no ice aloft`\n- GATE `non-approved ACFT: avoid forecast/reported ice, exit at first indication | PL → warm layer aloft, FZRA possible nearby`\n- FREEZING LEVEL `parcel 0°C exam = CB + 1000×Td/1.5 | detailed = CB + 1000×T_CB/1.5 | environmental FZ ≠ parcel 0°C | multiple levels possible with inversions | FZ level ≠ icing without moisture`","p":["PPL","CPL","IR"]},{"id":"MET-39","card":"MET","f":"kb/met/metar.md","h":"METAR / SPECI scan","a":"metar--speci-scan","c":["met-metar"],"kd":"knowledge","u":"wxp-metar","md":"- `P:` type→ID→time→wind→vis/RVR→WX→cloud→T/TD→ALT→RMK. `M:` `ID-TIME-WIND-VIS-WX-CLOUD-T/TD-ALT-RMK`.\n- Cloud heights: hundreds ft AGL; ceiling=lowest `BKN/OVC/VV`; `SCT`≠ceiling.\n- `SPECI:` significant change; compare last `2–4` reports for ceiling/vis/wind/pressure/precip/convection.\n- `T:` `AUTO` limits and remarks matter; recent SPECI can override comfort from older data.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"MET-40","card":"MET","f":"kb/met/metar.md","h":"Wind decoding","a":"wind-decoding","c":["met-metar","met-systems"],"kd":"knowledge","u":"wxp-wind","md":"- `dddffGggKT`: direction/sustained/gust. `VRB` variable. `dddVddd` directional variation.\n- METAR/TAF wind direction is true. Runway/ATC use requires magnetic/runway alignment awareness.\n- `F:` XW=`wind×sin angle`; HW=`wind×cos angle`.\n- `M:` 30° XW=½; 45°≈0.7; 60°≈0.87; 90°=full.\n- `T:` use gust for control/landing margin; tailwind/XW/runway contamination stack risk.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"MET-41","card":"MET","f":"kb/met/metar.md","h":"Visibility / RVR","a":"visibility--rvr","c":["met-metar","met-fog","ifr-minima"],"kd":"knowledge","u":"wxp-vis-rvr","md":"- `P6SM` >6 SM. Fractions may be combined. Prevailing vis may hide directional/local variation in remarks.\n- RVR gives runway visual range, usually hundreds/thousands ft with trend where reported.\n- `T:` prevailing visibility, flight visibility, ground visibility, runway visibility and RVR are different legal/operational concepts.","p":["CPL","IR"],"e":["CPL"]},{"id":"MET-42","card":"MET","f":"kb/met/metar.md","h":"Weather codes","a":"weather-codes","c":["met-metar"],"kd":"glossary","u":"wxp-wx-codes","md":"- Intensity: `-` light | no sign moderate | `+` heavy. Proximity `VC`.\n- Descriptors: `MI` shallow | `BC` patches | `PR` partial | `DR` low drifting | `BL` blowing | `SH` showers | `TS` thunderstorm | `FZ` freezing.\n- Precip: `DZ RA SN SG IC PL GR GS UP`.\n- Obscuration: `BR FG FU VA DU SA HZ PY`.\n- Other: `PO SQ FC SS DS`.\n- `M:` `FZ` + liquid precip = immediate icing red flag.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"MET-43","card":"MET","f":"kb/met/metar.md","h":"Cloud groups","a":"cloud-groups","c":["met-metar"],"kd":"knowledge","u":"wxp-cloud-groups","md":"- `FEW 1-2` | `SCT 3-4` | `BKN 5-7` | `OVC 8` oktas; `VV` obscured sky.\n- `TCU/CB` appended to layer. `NSC/SKC/CLR` meanings depend station/reporting system.\n- `T:` cloud base at destination may be legal while enroute terrain/cloud geometry is not.","p":["CPL","IR"],"e":["CPL"]},{"id":"MET-44","card":"MET","f":"kb/met/metar.md","h":"Temperature / dew point","a":"temperature--dew-point","c":["met-metar","met-stab"],"kd":"knowledge","u":"wxp-temp-dewpoint","md":"- Format `TT/DD`; `M` means minus. Spread small ⇒ saturation/fog/low cloud risk, especially cooling/night.\n- `T:` dew-point spread alone does not predict fog; consider wind, cloud, moisture, terrain, advection and precipitation.\n- `M:` freezing level + visible moisture/precip = icing analysis required.","p":["CPL"],"e":["CPL"]},{"id":"MET-45","card":"MET","f":"kb/met/metar.md","h":"Altimeter / pressure trend","a":"altimeter--pressure-trend","c":["met-metar","met-atmos"],"kd":"knowledge","u":"wxp-altimeter","md":"- `A2992` = 29.92 inHg. Remarks may show sea-level pressure and rapid rise/fall.\n- `M:` high→low or warm→cold = actual lower than indicated.\n- `T:` rapidly falling pressure often accompanies strengthening system/wind/weather deterioration.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"MET-46","card":"MET","f":"kb/met/metar.md","h":"Pebble","a":"pebble","c":["met-metar"],"kd":"pebble","u":"met-metar-pebble","md":"- SCAN `ID-TIME-WIND-VIS-WX-CLOUD-T/TD-ALT-RMK`\n- WIND `dddffGggKT, true direction | VRB | XW = wind×sin angle, HW = wind×cos angle | 30° = ½ / 45° ≈ 0.7 / 60° ≈ 0.87 / 90° = full | use gust for margin`\n- VIS `P6SM = >6 SM | prevailing ≠ flight ≠ ground ≠ runway visibility ≠ RVR`\n- WX `− light / no sign moderate / + heavy | VC proximity | FZ + liquid precip = icing red flag`\n- CLOUD `FEW 1-2 / SCT 3-4 / BKN 5-7 / OVC 8 oktas | hundreds ft AGL | ceiling = lowest BKN/OVC/VV; SCT ≠ ceiling`\n- T / ALT `TT/DD, M = minus | small spread alone ≠ fog | A2992 = 29.92 inHg`","p":["PPL","CPL","IR"]},{"id":"MET-47","card":"MET","f":"kb/met/recall.md","h":"Exam traps","a":"exam-traps","c":["met"],"kd":"trap","u":"wx-exam-traps","md":"- Stable ≠ “good”: can mean fog/stratus/poor vis/icing.\n- Unstable ≠ “bad everywhere”: often better vis between showers but more turbulence/CB.\n- Warm front generally broader/layered; cold front narrower/convective.\n- Dew-point spread predicts saturation risk, not certainty.\n- Freezing level alone does not equal icing.\n- Wind direction aloft/surface differs due friction.\n- Density altitude is a performance concept, not an indicated instrument altitude.\n- Cloud base units: METAR AGL vs GFA ASL.","p":["PPL","CPL"],"e":["PPL","CPL"]},{"id":"MET-48","card":"MET","f":"kb/met/stability-clouds.md","h":"Temperature / dew point","a":"temperature--dew-point","c":["met-stab"],"kd":"knowledge","u":"wx-temp-dewpoint","md":"- Dew point = temperature air must cool to reach saturation at constant pressure/water content.\n- Small `T-Td` spread + cooling ⇒ fog/low cloud increasingly likely.\n- Temperature inversion = temp increases with height; strongly stable, traps haze/smoke, can create wind shear.\n- `T:` small spread alone does not guarantee fog.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"MET-49","card":"MET","f":"kb/met/stability-clouds.md","h":"Lapse rates / stability","a":"lapse-rates--stability","c":["met-stab"],"kd":"knowledge","u":"wx-lapse-stability","md":"- `DALR` unsaturated ≈ `3°C/1000 ft`.\n- `SALR` saturated ≈ `1.5°C/1000 ft` average; varies with temp/moisture.\n- Environment cools faster than DALR ⇒ absolutely unstable.\n- Environment cools slower than SALR / inversion ⇒ absolutely stable.\n- Between SALR/DALR ⇒ conditionally unstable.\n- Stable: stratiform cloud, smooth air, poor vis, steady precip, broad ice.\n- Unstable: CU/TCU/CB, turbulence, showers, generally better between-cloud vis.\n- `M:` steep lapse = vertical motion grows.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"MET-50","card":"MET","f":"kb/met/stability-clouds.md","h":"Moisture / cloud formation","a":"moisture--cloud-formation","c":["met-stab"],"kd":"knowledge","u":"wx-moisture-cloud","md":"- Need moisture + cooling to saturation.\n- Cooling mechanisms: lifting, radiation, contact/advection, mixing.\n- Lift: convection, fronts, terrain, convergence.\n- Condensation nuclei help droplets form.\n- Cloud base often near LCL; rising unsaturated air cools DALR until saturated, then SALR.\n- `F exam CB:` convective cloud base AGL ≈ `1000(T−Td)/3` ft, with surface `T,Td` °C; **simplified course shortcut** assumes Td ≈ constant during unsaturated ascent.\n- `F parcel CB:` LCL/cloud base AGL ≈ `1000(T−Td)/(3−0.5)` ft; parcel T↓ ≈3°C/1000 ft, parcel Td↓ ≈0.5°C/1000 ft; both approximate.\n- `T:` estimates apply to a surface-lifted convective parcel, not every observed ceiling/cloud base; field elevation + AGL = ASL only for same vertical datum.","p":["PPL","CPL","IR"],"e":["PPL","CPL"]},{"id":"MET-51","card":"MET","f":"kb/met/stability-clouds.md","h":"Cloud families","a":"cloud-families","c":["met-stab"]
